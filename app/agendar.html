<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orenzi — Agendar horário</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Jost:wght@400;500;600;700&display=swap">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="shared/salon.js"></script>
<script src="ds/orenzi-ui.js"></script>
<!-- Orenzi Design System — carregado antes do <style> local de propósito:
     pela cascata, o CSS abaixo continua vencendo até esta página ser
     migrada componente por componente. Ver docs/08_IMPLEMENTATION_RULES.md. -->
<link rel="stylesheet" href="ds/orenzi-tokens.css">
<link rel="stylesheet" href="ds/orenzi-base.css">
<link rel="stylesheet" href="ds/orenzi-components.css">
<style>
  /* ══════════════════════════════════════════════════════════════
     BOOKING EXPERIENCE V2 — FASE 1 (shell + seleção de serviços)
     Transporte fiel de preview/booking-v2.html. Tokens locais
     espelham docs/03_DESIGN_SYSTEM.md; nenhum token global alterado.
     ══════════════════════════════════════════════════════════════ */
  :root {
    --color-bg: #f3ede4;
    --color-surface: #f7f1e8;
    --color-text: #2b2420;
    --color-accent: #b6784a;
    --color-accent-2: #b23a3a;
    --color-accent-2-700: #8a2a2a;
    --color-divider: rgba(43,36,32,0.14);
    --color-neutral-100: #f7f1e8;
    --color-neutral-200: #e8ddce;
    --color-neutral-300: #ddcfba;
    --color-neutral-600: #6b6053;
    --color-neutral-700: #5c4f42;
    --color-accent-100: #ecdcc9;
    --color-accent-600: #a1683f;
    --color-accent-700: #8a5a34;
    --font-heading: "Poppins", "Jost", system-ui, sans-serif;
    --font-body: "Jost", system-ui, sans-serif;

    --space-1: 4px; --space-2: 8px; --space-2-5: 10px; --space-3: 12px;
    --space-3-5: 14px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px;

    --radius-sm: 12px; --radius-md: 16px; --radius-lg: 20px;
    --radius-full: 999px; --radius-circle: 50%;

    --elevation-raised: 0 3px 10px rgba(43,36,32,0.16);
    --elevation-overlay: 0 20px 60px rgba(43,36,32,0.18);
    --focus-ring: 0 0 0 3px var(--color-accent-100);

    --motion-instant: 80ms; --motion-fast: 160ms; --motion-standard: 200ms;
    --motion-emphasized: 240ms; --motion-route: 280ms;
    --ease-standard: cubic-bezier(.4,0,.2,1);
    --ease-out: cubic-bezier(0,0,.2,1);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--color-bg); color: var(--color-text);
    font-family: var(--font-body); font-size: 15px; line-height: 1.45;
    -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center;
  }
  button { font-family: inherit; color: inherit; }
  h1, p { margin: 0; }
  svg { display: block; }
  :focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }

  /* Só para leitor de tela — o progresso precisa ser anunciado sem
     poluir a interface (docs/07_ACCESSIBILITY.md). */
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important; animation-iteration-count: 1 !important;
      transition-duration: .001ms !important; scroll-behavior: auto !important;
    }
  }

  /* ── App: mobile-first; no desktop fica centralizado e estreito,
       nunca esticado na viewport inteira (Orenzi UI contract, item 5). ── */
  .bk-app {
    width: 100%; max-width: 430px; height: 100dvh;
    display: flex; flex-direction: column; position: relative;
    background: var(--color-bg); overflow: hidden;
  }
  @media (min-width: 520px) {
    body { background: #e9e1d2; }
    .bk-app { border-left: 1px solid var(--color-divider); border-right: 1px solid var(--color-divider); }
  }

  /* ── Shell: topbar ─────────────────────────────────────────────── */
  .bk-topbar {
    flex-shrink: 0; display: flex; align-items: center; gap: var(--space-2);
    height: 52px; padding: 0 var(--space-3) 0 var(--space-2);
    background: var(--color-bg); position: relative; z-index: 20;
  }
  .bk-back {
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    background: none; border: none; border-radius: var(--radius-circle); cursor: pointer;
    color: var(--color-text); flex-shrink: 0;
    transition: transform var(--motion-instant) var(--ease-standard);
  }
  .bk-back:active { transform: scale(.9); }
  .bk-back svg { width: 20px; height: 20px; }
  .bk-back.is-hidden { visibility: hidden; }
  .bk-progress-track {
    flex: 1; height: 3px; border-radius: var(--radius-full); background: var(--color-divider);
    margin: 0 var(--space-2); overflow: hidden;
  }
  .bk-progress-fill {
    height: 100%; border-radius: var(--radius-full); background: var(--color-accent-600);
    transition: width var(--motion-route) var(--ease-standard);
  }
  .bk-mark { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .bk-mark-dot {
    width: 22px; height: 22px; border-radius: var(--radius-circle); background: var(--color-accent-700);
    color: var(--color-bg); font-family: var(--font-heading); font-weight: 600; font-size: 11px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }

  /* ── Shell: área rolável ───────────────────────────────────────── */
  .bk-main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #steps { padding: var(--space-2) var(--space-5) 28px; min-height: 100%; }
  .bk-title {
    font-family: var(--font-heading); font-weight: 600; font-size: 23px;
    letter-spacing: -.01em; margin-bottom: var(--space-1); line-height: 1.2;
  }
  .bk-title-note { font-size: 12px; color: var(--color-neutral-600); margin-bottom: var(--space-5); }

  @keyframes bk-step-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .bk-step-enter { animation: bk-step-in var(--motion-standard) var(--ease-out); }

  /* ── Chips de categoria ────────────────────────────────────────── */
  .bk-chip-rail {
    display: flex; gap: var(--space-2); overflow-x: auto; scrollbar-width: none;
    margin: var(--space-4) calc(var(--space-5) * -1) var(--space-5); padding: 2px var(--space-5);
    -webkit-overflow-scrolling: touch;
  }
  .bk-chip-rail::-webkit-scrollbar { display: none; }
  .bk-chip {
    flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px;
    height: 34px; padding: 0 var(--space-3-5); border-radius: var(--radius-full);
    background: var(--color-surface); border: 1px solid var(--color-divider);
    font-size: 13px; font-weight: 600; color: var(--color-text); cursor: pointer;
    position: relative;
    transition: background var(--motion-fast) var(--ease-standard),
                border-color var(--motion-fast) var(--ease-standard),
                color var(--motion-fast) var(--ease-standard),
                transform var(--motion-instant) var(--ease-standard);
  }
  /* Alvo de toque de 44px sem engordar a pílula (docs/07_ACCESSIBILITY.md). */
  .bk-chip::after { content: ''; position: absolute; inset: -5px; }
  .bk-chip:active { transform: scale(.96); }
  .bk-chip[aria-pressed="true"] {
    background: var(--color-accent-100); border-color: var(--color-accent-600); color: var(--color-accent-700);
  }

  /* ── Cartões de serviço ────────────────────────────────────────── */
  .bk-svc-list { display: flex; flex-direction: column; gap: var(--space-3); }
  .bk-svc-card {
    width: 100%; text-align: left; font: inherit; color: inherit;
    background: var(--color-surface); border: 1px solid var(--color-divider);
    border-left: 3px solid var(--cat-color, var(--color-divider));
    border-radius: var(--radius-md); padding: var(--space-3-5) var(--space-4);
    cursor: pointer; display: block;
    transition: background var(--motion-fast) var(--ease-standard),
                border-color var(--motion-fast) var(--ease-standard),
                transform var(--motion-instant) var(--ease-standard);
  }
  .bk-svc-card:active { transform: scale(.99); }
  .bk-svc-card[aria-pressed="true"] { background: var(--color-accent-100); border-color: var(--color-accent-600); }
  .svc-card-top { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-2); }
  .svc-card-name { font-size: 16px; font-weight: 600; font-family: var(--font-heading); }
  .svc-card-duration { font-size: 12px; color: var(--color-neutral-600); flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .svc-card-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: var(--space-3); }
  .svc-card-price { font-family: var(--font-heading); font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; }
  /* Marcador visual do estado: o botão real é o cartão inteiro, então este
     círculo é decorativo (aria-hidden) — quem anuncia é o aria-pressed. */
  .svc-select-mark {
    width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--color-divider);
    background: var(--color-surface); color: var(--color-accent-700);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: background var(--motion-fast) var(--ease-standard),
                border-color var(--motion-fast) var(--ease-standard),
                color var(--motion-fast) var(--ease-standard);
  }
  .svc-select-mark svg { width: 16px; height: 16px; }
  .bk-svc-card[aria-pressed="true"] .svc-select-mark {
    background: var(--color-accent-700); border-color: var(--color-accent-700); color: var(--color-bg);
  }
  .price-disclaimer {
    font-family: var(--font-body); font-size: 11px; color: var(--color-neutral-600);
    margin-top: var(--space-4); line-height: 1.5;
  }

  /* ── Skeleton / erro / vazio ───────────────────────────────────── */
  @keyframes bk-pulse { 0%,100% { opacity: 1 } 50% { opacity: .55 } }
  .bk-skel-line { height: 14px; border-radius: var(--radius-sm); background: var(--color-neutral-200); animation: bk-pulse 1.2s var(--ease-standard) infinite; }
  .bk-skel-card { height: 104px; border-radius: var(--radius-md); background: var(--color-neutral-200); animation: bk-pulse 1.2s var(--ease-standard) infinite; }
  .bk-skel-chip { height: 34px; width: 92px; border-radius: var(--radius-full); background: var(--color-neutral-200); flex-shrink: 0; animation: bk-pulse 1.2s var(--ease-standard) infinite; }
  @media (prefers-reduced-motion: reduce) {
    .bk-skel-line, .bk-skel-card, .bk-skel-chip { animation: none; opacity: .75; }
  }
  .bk-state {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: var(--space-8) var(--space-4); gap: var(--space-2);
  }
  .bk-state svg { width: 30px; height: 30px; color: var(--color-neutral-600); margin-bottom: var(--space-1); }
  .bk-state-title { font-family: var(--font-heading); font-weight: 600; font-size: 16px; }
  .bk-state-text { font-size: 13px; color: var(--color-neutral-600); line-height: 1.5; max-width: 30ch; }
  .bk-state-action {
    margin-top: var(--space-3); background: var(--color-surface); border: 1px solid var(--color-divider);
    border-radius: var(--radius-full); padding: 10px var(--space-5); font-size: 13px; font-weight: 600;
    cursor: pointer; min-height: 40px;
    transition: transform var(--motion-instant) var(--ease-standard);
  }
  .bk-state-action:active { transform: scale(.97); }

  /* ── CTA fixo ──────────────────────────────────────────────────── */
  .bk-cta-wrap {
    flex-shrink: 0;
    padding: var(--space-3) var(--space-5) calc(var(--space-4) + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, var(--color-bg) 60%, rgba(243,237,228,0));
  }
  .bk-cta {
    width: 100%; height: 52px; border-radius: var(--radius-full); border: none; cursor: pointer;
    background: var(--color-accent-700); color: var(--color-bg); font-size: 15px; font-weight: 600;
    box-shadow: var(--elevation-raised);
    transition: background var(--motion-fast) var(--ease-standard),
                transform var(--motion-instant) var(--ease-standard);
  }
  .bk-cta:active:not(:disabled) { transform: scale(.98); }
  .bk-cta:disabled { background: var(--color-neutral-300); color: var(--color-neutral-600); cursor: default; box-shadow: none; }
  .bk-cta-context { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
  .bk-cta-context .cc-text { line-height: 1.25; min-width: 0; }
  .bk-cta-context .cc-price {
    display: block; font-family: var(--font-heading); font-weight: 600; font-size: 18px;
    font-variant-numeric: tabular-nums;
  }
  .bk-cta-context .cc-sub { display: block; font-size: 12px; color: var(--color-neutral-600); }
  .bk-cta-context .bk-cta { width: auto; padding: 0 var(--space-5); flex-shrink: 0; }
  /* Em 320px o par "contexto + botão" não pode espremer o rótulo. */
  @media (max-width: 340px) {
    .bk-cta-context { gap: var(--space-2); }
    .bk-cta-context .bk-cta { padding: 0 var(--space-4); font-size: 14px; }
    .bk-cta-context .cc-price { font-size: 17px; }
  }

  /* ── Subview full-screen (calendário) ──────────────────────────── */
  .bk-topbar.sub-mode .bk-progress-track { display: none; }
  .bk-sub-title {
    flex: 1; font-family: var(--font-heading); font-weight: 600; font-size: 15px;
    text-align: center; margin-right: 44px;
  }

  /* ── Cartões de profissional ───────────────────────────────────── */
  .bk-staff-list { display: flex; flex-direction: column; gap: var(--space-3); }
  .bk-staff-card {
    width: 100%; text-align: left; font: inherit; color: inherit;
    display: flex; align-items: center; gap: var(--space-3);
    background: var(--color-surface); border: 1px solid var(--color-divider);
    border-radius: var(--radius-md); padding: var(--space-3-5) var(--space-4); cursor: pointer;
    transition: background var(--motion-fast) var(--ease-standard),
                border-color var(--motion-fast) var(--ease-standard),
                transform var(--motion-instant) var(--ease-standard);
  }
  .bk-staff-card:active { transform: scale(.99); }
  .bk-staff-card[aria-pressed="true"] { background: var(--color-accent-100); border-color: var(--color-accent-600); }
  .bk-staff-card .stf-avatar {
    width: 46px; height: 46px; border-radius: 50%; background: var(--color-accent-100); color: var(--color-accent-700);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    font-family: var(--font-heading); font-weight: 600; font-size: 15px;
  }
  .bk-staff-card .stf-avatar.any { background: var(--color-neutral-200); color: var(--color-neutral-700); font-size: 18px; }
  .bk-staff-card[aria-pressed="true"] .stf-avatar { background: var(--color-accent-700); color: var(--color-bg); }
  .bk-staff-card .stf-body { flex: 1; min-width: 0; }
  .bk-staff-card .stf-name { font-size: 15px; font-weight: 600; font-family: var(--font-heading); display: block; }
  .bk-staff-card .stf-sub { font-size: 12px; color: var(--color-neutral-600); margin-top: 2px; display: block; }
  .bk-staff-card .stf-select {
    width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--color-divider);
    background: var(--color-surface); color: var(--color-accent-700); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
  }
  .bk-staff-card .stf-select svg { width: 13px; height: 13px; }
  .bk-staff-card[aria-pressed="true"] .stf-select { background: var(--color-accent-700); border-color: var(--color-accent-700); color: var(--color-bg); }

  /* ── Linha de contexto (profissional escolhida) ────────────────── */
  .bk-context-line {
    display: flex; align-items: center; gap: var(--space-2); font: inherit; color: var(--color-neutral-700);
    background: none; border: none; padding: 0 0 var(--space-4); cursor: pointer; font-size: 13px;
  }
  .bk-context-line:disabled { cursor: default; }
  .bk-context-line .cl-avatar {
    width: 24px; height: 24px; border-radius: 50%; background: var(--color-accent-100); color: var(--color-accent-700);
    display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0;
  }
  .bk-context-line .cl-avatar.any { background: var(--color-neutral-200); color: var(--color-neutral-700); }
  .bk-context-line svg { width: 13px; height: 13px; color: var(--color-neutral-600); }

  /* ── Faixa de datas (estados explícitos) ───────────────────────── */
  .bk-date-rail { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; margin: 0 0 var(--space-6); padding: 2px 0 4px; }
  .bk-date-rail::-webkit-scrollbar { display: none; }
  .bk-day {
    flex-shrink: 0; width: 52px; height: 68px; border-radius: var(--radius-sm);
    background: var(--color-surface); border: 1px solid var(--color-divider); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    position: relative; font: inherit; color: inherit;
    transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
  }
  .bk-day .d-dow { font-size: 10px; font-weight: 700; color: var(--color-neutral-600); text-transform: uppercase; letter-spacing: .02em; }
  .bk-day .d-num { font-family: var(--font-heading); font-weight: 600; font-size: 17px; font-variant-numeric: tabular-nums; }
  .bk-day .d-mon { font-size: 10px; color: var(--color-neutral-600); text-transform: uppercase; letter-spacing: .02em; }
  .bk-day .d-today-mark { position: absolute; top: 6px; width: 4px; height: 4px; border-radius: 50%; background: var(--color-accent-600); }
  /* O rótulo textual é o que garante que o estado não dependa só de cor. */
  .bk-day .d-status-label { position: absolute; bottom: 5px; font-size: 6.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
  .bk-day.st-full .d-mon, .bk-day.st-closed .d-mon, .bk-day.st-unavailable .d-mon { visibility: hidden; }
  .bk-day[aria-pressed="true"] { background: var(--color-accent-700); border-color: var(--color-accent-700); }
  .bk-day[aria-pressed="true"] .d-dow, .bk-day[aria-pressed="true"] .d-mon { color: rgba(247,241,232,.75); }
  .bk-day[aria-pressed="true"] .d-num { color: var(--color-bg); }
  .bk-day[aria-pressed="true"] .d-today-mark { background: var(--color-bg); }
  .bk-day:active:not(:disabled) { transform: scale(.95); }
  .bk-day:disabled { cursor: default; }
  .bk-day.st-full { background: transparent; }
  .bk-day.st-full .d-num { color: var(--color-neutral-600); }
  .bk-day.st-full .d-status-label { color: var(--color-accent-2-700); }
  .bk-day.st-closed { background: transparent; border-color: transparent; }
  .bk-day.st-closed .d-num, .bk-day.st-closed .d-dow, .bk-day.st-closed .d-mon { color: var(--color-neutral-300); }
  .bk-day.st-closed .d-status-label { color: var(--color-neutral-300); }
  .bk-day.st-unavailable { background: transparent; }
  .bk-day.st-unavailable .d-num { color: var(--color-neutral-600); }
  .bk-day.st-unavailable .d-status-label { color: var(--color-neutral-700); }

  .bk-cal-link {
    background: none; border: none; color: var(--color-accent-700); font-size: 12px; font-weight: 700;
    cursor: pointer; padding: 4px 0; display: inline-flex; align-items: center; gap: 4px;
    position: relative; margin-bottom: var(--space-3);
  }
  .bk-cal-link::after { content: ''; position: absolute; inset: -10px -2px; }
  .bk-cal-link svg { width: 13px; height: 13px; }
  .bk-eyebrow {
    font-size: 12px; font-weight: 700; color: var(--color-neutral-600);
    margin: 0 0 var(--space-3); text-transform: uppercase; letter-spacing: .03em; display: block;
  }

  /* ── Grade de horários ─────────────────────────────────────────── */
  .bk-time-group { margin-bottom: var(--space-5); }
  .bk-time-group-label { font-size: 12px; font-weight: 700; color: var(--color-neutral-600); margin-bottom: var(--space-2-5); text-transform: uppercase; letter-spacing: .03em; }
  .bk-time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .bk-time-chip {
    height: 44px; border-radius: var(--radius-sm); background: var(--color-surface); border: 1px solid var(--color-divider);
    font-size: 14px; font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums; font-family: inherit; color: inherit;
    transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
  }
  .bk-time-chip:active { transform: scale(.96); }
  .bk-time-chip[aria-pressed="true"] { background: var(--color-accent-700); border-color: var(--color-accent-700); color: var(--color-bg); }

  /* ── Blocos de estado (vazio / erro) ───────────────────────────── */
  .bk-state-block { padding: var(--space-6) var(--space-3) var(--space-5); text-align: center; }
  .bk-state-block .sb-icon {
    width: 44px; height: 44px; border-radius: 50%; background: var(--color-neutral-200); color: var(--color-neutral-600);
    display: flex; align-items: center; justify-content: center; margin: 0 auto var(--space-4);
  }
  .bk-state-block .sb-icon svg { width: 22px; height: 22px; }

// Quantos minutos o fuso do salão está à frente do UTC naquele instante
// (cobre o horário de verão irlandês automaticamente).
function salonOffsetMinutes(date) {
  const dtf = new Intl.DateTimeFormat('en-US', {
    timeZone: SALON_TZ, hour12: false,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
  });
  const p = {};
  for (const part of dtf.formatToParts(date)) p[part.type] = part.value;
  const asUTC = Date.UTC(+p.year, p.month - 1, +p.day, (+p.hour) % 24, +p.minute, +p.second);
  return (asUTC - Math.floor(date.getTime() / 1000) * 1000) / 60000;
}

// "2026-08-15" + 570min -> o instante absoluto das 09:30 em Dublin.
function salonTimeToInstant(dateStr, minutesFromMidnight) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const naive = Date.UTC(y, m - 1, d, 0, 0, 0) + minutesFromMidnight * 60000;
  const off1 = salonOffsetMinutes(new Date(naive));
  let inst = new Date(naive - off1 * 60000);
  const off2 = salonOffsetMinutes(inst);          // 2ª passada: virada do horário de verão
  if (off2 !== off1) inst = new Date(naive - off2 * 60000);
  return inst;
}

  return date.toLocaleTimeString('pt-BR', { timeZone: SALON_TZ, hour: '2-digit', minute: '2-digit' });
