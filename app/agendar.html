<style>

  input[type=date], input[type=text], input[type=tel], input[type=email] {

    border-radius: 0; background: transparent; font-family: var(--font-body); font-size: 15px;

  input[type=date]:focus, input[type=text]:focus, input[type=tel]:focus, input[type=email]:focus {

  label {

  .btn {
    width: 100%; padding: 15px; border-radius: 999px; border: none; cursor: pointer;

    text-transform: uppercase; margin-top: 8px;

  .btn-ghost-link {

  .confirm-card .name { font-family: var(--font-heading); font-weight: 600; font-size: 16px; color: var(--color-text); }
  .confirm-card .sub { font-family: var(--font-body); font-size: 12px; color: var(--color-neutral-600); margin-top: 2px; }
  .confirm-row {
    display: flex; justify-content: space-between; align-items: center; padding: 6px 0;
    font-family: var(--font-body); font-size: 13.5px; color: var(--color-neutral-700);

  .confirm-total {
    display: flex; justify-content: space-between; align-items: baseline; padding-top: 14px;
    margin-top: 8px; border-top: 1px solid var(--color-divider);

    font-family: var(--font-body); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;

    text-align: center; font-family: var(--font-body); font-size: 13px;

</style>

<body>
<button class="back-arrow" id="backArrow" aria-label="Voltar">←</button>
<div class="wrap">
  <div class="brand">Orenzi</div>
  <!-- Os pontinhos são montados pelo setStep(): quantos aparecem depende de o
       passo da profissional entrar no fluxo ou não. -->
  <div class="steps" id="steps"></div>
  <div class="step-caption" id="stepCaption"></div>
  <div id="errorBanner"></div>
  <div class="app-viewport" id="appViewport">
    <div id="app"></div>
  </div>
</div>
<div class="bottom-bar" id="bottomBar">
  <button class="btn btn-primary" id="advanceBtn" disabled>Avançar</button>
</div>

<script>
// ── CONFIGURAÇÃO ─────────────────────────────────────────────
// Troque pelos valores do seu projeto: Settings → API no Supabase
const SUPABASE_URL = 'https://gsagtsxkhqlpxuvrijgw.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_c2b9NNovCdvQ64_Sfiiecg_H_5M0FIg';

// Expediente do salão (ajuste conforme necessário)
const OPEN_HOUR = 9;
const CLOSE_HOUR = 18;
const SLOT_MINUTES = 30;
// Dias em que o salão não abre (0 = domingo, 1 = segunda) — usado no calendário e nos horários.
const CLOSED_WEEKDAYS = [0, 1];

// ── RELÓGIO DO SALÃO ─────────────────────────────────────────
// O expediente é no fuso do SALÃO, não no do aparelho de quem está agendando.
// Sem isso, `new Date('2026-08-15T00:00:00')` vira meia-noite no fuso do celular
// da cliente: quem marcasse "9h" com o telefone no horário do Brasil gravava 13h
// em Dublin, e o erro é silencioso — a tela, o e-mail e o painel mostram valores
// diferentes e ninguém percebe até o dia do atendimento.
const SALON_TZ = 'Europe/Dublin';

// Quantos minutos o fuso do salão está à frente do UTC naquele instante
// (cobre o horário de verão irlandês automaticamente).
function salonOffsetMinutes(date) {
  const dtf = new Intl.DateTimeFormat('en-US', {
    timeZone: SALON_TZ, hour12: false,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
  });
  const p = {};
  for (const part of dtf.formatToParts(date)) p[part.type] = part.value;
  const asUTC = Date.UTC(+p.year, p.month - 1, +p.day, (+p.hour) % 24, +p.minute, +p.second);
  return (asUTC - Math.floor(date.getTime() / 1000) * 1000) / 60000;
}

// "2026-08-15" + 570min -> o instante absoluto das 09:30 em Dublin.
function salonTimeToInstant(dateStr, minutesFromMidnight) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const naive = Date.UTC(y, m - 1, d, 0, 0, 0) + minutesFromMidnight * 60000;
  const off1 = salonOffsetMinutes(new Date(naive));
  let inst = new Date(naive - off1 * 60000);
  const off2 = salonOffsetMinutes(inst);          // 2ª passada: virada do horário de verão
  if (off2 !== off1) inst = new Date(naive - off2 * 60000);
  return inst;
}

// Hora como o salão lê, independente do fuso do aparelho.
function salonClock(date) {
  return date.toLocaleTimeString('pt-BR', { timeZone: SALON_TZ, hour: '2-digit', minute: '2-digit' });
}

// Data de hoje NO SALÃO, em YYYY-MM-DD. `new Date().toISOString()` daria o dia em
// UTC, que na madrugada de Dublin ainda é o dia anterior.
function salonToday() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: SALON_TZ }).format(new Date());
}

const MONTHS_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const state = {
  step: 1,
  // Com uma profissional só atendendo não existe escolha a fazer, e o passo 2
  // sai do fluxo: a cliente vai do serviço direto pra data. Começa true porque
  // hoje só a Juliane atende; o init confere no banco e corrige se outra voltar
  // a ficar ativa, e o advanceFromStep1() confirma pelo serviço escolhido.
  pulaEscolhaStaff: true,
  services: [],
  staff: [],
  selectedService: null,
  selectedStaff: null,
  selectedDate: '',
  calViewYear: null,
  calViewMonth: null,
  slots: [],
  selectedSlot: null,
  clientName: '',
  clientPhone: '',
  clientEmail: '',
  loading: true,
  error: null,
  done: false,
};

const app = document.getElementById('app');
const appViewport = document.getElementById('appViewport');
const backArrow = document.getElementById('backArrow');
const bottomBar = document.getElementById('bottomBar');
const advanceBtn = document.getElementById('advanceBtn');
let hasRenderedOnce = false;

function renderTransition(direction) {
  const oldHeight = app.offsetHeight;
  const clone = app.cloneNode(true);
  clone.removeAttribute('id');
  clone.classList.add('app-pane');
  appViewport.appendChild(clone);

  render();
  const newHeight = app.offsetHeight;
  appViewport.style.minHeight = Math.max(oldHeight, newHeight) + 'px';

  const enterFrom = direction === 'back' ? '-100%' : '100%';
  const exitTo = direction === 'back' ? '100%' : '-100%';

  app.classList.add('app-pane');
  app.style.transition = 'none';
  app.style.transform = `translateX(${enterFrom})`;
  clone.style.transform = 'translateX(0)';

  void app.offsetWidth;

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      app.style.transition = 'transform .32s cubic-bezier(.22,.61,.36,1)';
      clone.style.transition = 'transform .32s cubic-bezier(.22,.61,.36,1)';
      app.style.transform = 'translateX(0)';
      clone.style.transform = `translateX(${exitTo})`;
    });
  });

  let cleaned = false;
  function cleanup() {
    if (cleaned) return;
    cleaned = true;
    app.removeEventListener('transitionend', onTransitionEnd);
    app.classList.remove('app-pane');
    app.style.transition = '';
    app.style.transform = '';
    appViewport.style.minHeight = '';
    clone.remove();
  }
  function onTransitionEnd(e) {
    if (e.target === app && e.propertyName === 'transform') cleanup();
  }
  app.addEventListener('transitionend', onTransitionEnd);
  setTimeout(cleanup, 500);
}

function setBackArrow(visible, handler) {
  backArrow.classList.toggle('visible', visible);
  backArrow.onclick = visible ? handler : null;
}

function setBottomBar(visible, opts) {
  bottomBar.classList.toggle('visible', visible);
  document.body.classList.toggle('has-advance-bar', visible);
  if (visible && opts) {
    advanceBtn.disabled = !opts.enabled;
    advanceBtn.textContent = opts.label || 'Avançar';
    advanceBtn.onclick = opts.onClick;
  }
}

function pad2(n) { return String(n).padStart(2, '0'); }

function initials(name) {
  return (name || '').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
}

function formatMoney(n) {
  const num = Number(n);
  return num % 1 === 0 ? `€${num}` : `€${num.toFixed(2)}`;
}

function formatPrice(service) {
  const base = service.price_label || formatMoney(service.price);
  return service.price_varies ? `${base}*` : base;
}

function groupByCategory(services) {
  const groups = [];
  let current = null;
  services.forEach(s => {
    if (!current || current.category !== s.category) {
      current = { category: s.category, items: [] };
      groups.push(current);
    }
    current.items.push(s);
  });
  return groups;
}

// Os passos que a cliente realmente vê. O número interno continua o mesmo
// (1 serviço · 2 profissional · 3 data/hora · 4 dados) — o que muda é a
// contagem exibida, senão o fluxo curto anunciaria "Passo 3 de 4" na tela 2.
function etapasVisiveis() {
  return state.pulaEscolhaStaff ? [1, 3, 4] : [1, 2, 3, 4];
}

function setStep(n) {
  const direction = n >= state.step ? 'forward' : 'back';
  state.step = n;
  const etapas = etapasVisiveis();
  const pos = etapas.indexOf(n) + 1;
  document.getElementById('steps').innerHTML = etapas
    .map((_, i) => `<div class="dot${i < pos ? ' active' : ''}"></div>`).join('');
  document.getElementById('stepCaption').textContent =
    (state.done || pos < 1) ? '' : `Passo ${pos} de ${etapas.length}`;
  if (!hasRenderedOnce) { hasRenderedOnce = true; render(); }
  else { renderTransition(direction); }
}

async function loadServices() {
  const { data, error } = await sb.from('services').select('*').order('sort_order');
  if (error) { state.error = error.message; return; }
  state.services = data;
}

async function loadStaffForService(serviceId) {
  const { data, error } = await sb
    .from('staff_services')
    .select('staff:staff_id(id, name, role, active)')
    .eq('service_id', serviceId);
  if (error) { state.error = error.message; return; }
  // Só quem atende de verdade. As inativas continuam no banco por causa do
  // histórico de agendamentos, e todas estão ligadas a todos os serviços — sem
  // este filtro a cliente escolhia entre cinco pessoas, quatro delas fora do
  // salão, inclusive a recepção.
  state.staff = data.map(row => row.staff).filter(s => s && s.active !== false);
}

// Quantas atendem hoje, independente de serviço. Serve só pra saber, já no
// primeiro passo, se o fluxo tem 3 ou 4 telas.
async function loadActiveStaffCount() {
  const { count, error } = await sb
    .from('staff')
    .select('id', { count: 'exact', head: true })
    .eq('active', true);
  if (error) return;   // no erro, mantém o padrão de uma profissional só
  state.pulaEscolhaStaff = count === 1;
}

// Calcula horários livres pro profissional escolhido, na data escolhida,
// considerando a duração do serviço.
async function loadAvailableSlots() {
  const { selectedStaff, selectedDate, selectedService } = state;

  const weekday = new Date(`${selectedDate}T00:00:00`).getDay();
  if (CLOSED_WEEKDAYS.includes(weekday)) {
    state.slots = [];
    return;
  }

  // A janela do dia também é a do salão: como strings soltas, o Postgres as lia
  // no fuso da sessão dele e a busca por conflitos pegava algumas horas erradas.
  const dayStart = salonTimeToInstant(selectedDate, 0).toISOString();
  const dayEnd = salonTimeToInstant(selectedDate, 24 * 60 - 1).toISOString();

  // Pela RPC, nunca por `.from('appointments')`: esta página usa a chave anônima
  // e a RLS de appointments só libera SELECT autenticado. A leitura direta não
  // dava erro — devolvia lista vazia — e com isso TODO horário aparecia livre,
  // inclusive os já ocupados. get_busy_slots é SECURITY DEFINER e devolve só os
  // blocos de trabalho: a pausa (tinta agindo) fica de fora de propósito,
  // porque durante ela a profissional está livre pra atender outra cliente.
  const { data: busy, error } = await sb.rpc('get_busy_slots', {
    p_staff_id: selectedStaff.id,
    p_from: dayStart,
    p_to: dayEnd,
  });

  if (error) { state.error = error.message; return; }

  const duration = selectedService.duration_minutes;
  const slots = [];
  for (let m = OPEN_HOUR * 60; m + duration <= CLOSE_HOUR * 60; m += SLOT_MINUTES) {
    // m é minutos desde a meia-noite EM DUBLIN, não no relógio do aparelho.
    const slotStart = salonTimeToInstant(selectedDate, m);
    const slotEnd = new Date(slotStart.getTime() + duration * 60000);

    const overlaps = (busy || []).some(b => {
      const bStart = new Date(b.busy_start);
      const bEnd = new Date(b.busy_end);
      return slotStart < bEnd && slotEnd > bStart;
    });

    slots.push({
      label: salonClock(slotStart),
      start: slotStart,
      end: slotEnd,
      available: !overlaps,
    });
  }
  state.slots = slots;
}

// Remove tudo que não for dígito, pra "01234567", "+353 1234567" e "(0123) 456-7"
// serem tratados como o mesmo número na hora de identificar o cliente.
function normalizePhone(phone) {
  return (phone || '').replace(/[^\d]/g, '');
}

async function confirmBooking() {
  state.error = null;
  try {
    // Acha cliente existente pelo telefone (normalizado) ou cria um novo — via função
    // do banco com permissão controlada (a tabela clients não é legível publicamente).
    const normalizedPhone = normalizePhone(state.clientPhone);
    const { data: clientId, error: clientErr } = await sb.rpc('find_or_create_client', {
      p_name: state.clientName,
      p_phone: normalizedPhone,
      p_email: state.clientEmail || null,
      p_birthdate: state.clientBirthdate || null,
      p_instagram: state.clientInstagram || null,
    });
    if (clientErr) throw clientErr;

    const { error: apptErr } = await sb.from('appointments').insert({
      client_id: clientId,
      staff_id: state.selectedStaff.id,
      service_id: state.selectedService.id,
      starts_at: state.selectedSlot.start.toISOString(),
      ends_at: state.selectedSlot.end.toISOString(),
      status: 'confirmed',
      source: 'online',
    });
    if (apptErr) throw apptErr;

    state.done = true;
    document.getElementById('stepCaption').textContent = '';
    renderTransition('forward');
  } catch (e) {
    state.error = e.message;
    render();
  }
}

function buildCalendarGrid(year, month) {
  const first = new Date(year, month, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const prevDaysInMonth = new Date(year, month, 0).getDate();
  const todayStr = salonToday();
  const cells = [];

  for (let i = 0; i < startWeekday; i++) {
    cells.push(`<div class="cal-day muted">${prevDaysInMonth - startWeekday + 1 + i}</div>`);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${pad2(month + 1)}-${pad2(d)}`;
    const weekday = new Date(year, month, d).getDay();
    if (CLOSED_WEEKDAYS.includes(weekday)) {
      cells.push(`<div class="cal-day closed">${d}</div>`);
      continue;
    }
    let cls = 'cal-day';
    if (dateStr < todayStr) cls += ' past';
    else if (dateStr === todayStr) cls += ' today';
    if (dateStr === state.selectedDate) cls += ' selected';
    cells.push(`<div class="${cls}" data-date="${dateStr}">${d}</div>`);
  }
  const trailing = (7 - (cells.length % 7)) % 7;
  for (let i = 1; i <= trailing; i++) {
    cells.push(`<div class="cal-day muted">${i}</div>`);
  }
  return cells.join('');
}

function renderStep3() {
  if (state.calViewYear == null) {
    const t = new Date();
    state.calViewYear = t.getFullYear();
    state.calViewMonth = t.getMonth();
  }
  const t = new Date();
  const monthsFromToday = (state.calViewYear - t.getFullYear()) * 12 + (state.calViewMonth - t.getMonth());
  const prevDisabled = monthsFromToday <= 0;
  const nextDisabled = monthsFromToday >= 5;

  app.innerHTML = `
    <h2>Data &amp; <em>horário</em></h2>
    <div class="cal-head">
      <div class="cal-nav ${prevDisabled ? 'disabled' : ''}" id="calPrev">‹</div>
      <div class="cal-month">${MONTHS_PT[state.calViewMonth]} ${state.calViewYear}</div>
      <div class="cal-nav ${nextDisabled ? 'disabled' : ''}" id="calNext">›</div>
    </div>
    <div class="cal-grid">
      <div class="cal-dow">D</div><div class="cal-dow">S</div><div class="cal-dow">T</div>
      <div class="cal-dow">Q</div><div class="cal-dow">Q</div><div class="cal-dow">S</div><div class="cal-dow">S</div>
      ${buildCalendarGrid(state.calViewYear, state.calViewMonth)}
    </div>
    <div id="slotsWrap"></div>
  `;

  // Sem o passo da profissional, a seta volta pro serviço.
  setBackArrow(true, () => setStep(state.pulaEscolhaStaff ? 1 : 2));

  document.getElementById('calPrev').onclick = () => {
    state.calViewMonth--;
    if (state.calViewMonth < 0) { state.calViewMonth = 11; state.calViewYear--; }
    renderStep3();
  };
  document.getElementById('calNext').onclick = () => {
    state.calViewMonth++;
    if (state.calViewMonth > 11) { state.calViewMonth = 0; state.calViewYear++; }
    renderStep3();
  };
  app.querySelectorAll('.cal-day[data-date]').forEach(el => {
    el.onclick = () => {
      state.selectedDate = el.dataset.date;
      state.selectedSlot = null;
      renderStep3();
      refreshSlots();
    };
  });

  updateStep3Bar();
  if (state.selectedDate) refreshSlots();
}

function updateStep3Bar() {
  setBottomBar(true, {
    enabled: !!(state.selectedDate && state.selectedSlot),
    onClick: () => setStep(4),
  });
}

async function refreshSlots() {
  const slotsWrap = document.getElementById('slotsWrap');
  if (!slotsWrap || !state.selectedDate) return;
  slotsWrap.innerHTML = `<div class="avail-label">Horários disponíveis</div><div class="empty">Carregando horários…</div>`;
  await loadAvailableSlots();
  const isClosedDay = CLOSED_WEEKDAYS.includes(new Date(`${state.selectedDate}T00:00:00`).getDay());
  const anyOpen = state.slots.some(s => s.available);
  slotsWrap.innerHTML = `<div class="avail-label">Horários disponíveis</div>` + (anyOpen ? `
    <div class="time-grid">${state.slots.map(s => `
      <div class="time-item ${s.available ? '' : 'disabled'}${state.selectedSlot && state.selectedSlot.label === s.label ? ' selected' : ''}" data-label="${s.label}">${s.label}</div>
    `).join('')}</div>
  ` : `<div class="empty">${isClosedDay ? 'O salão não abre nesse dia.' : 'Sem horários livres nesse dia.'}</div>`);

  slotsWrap.querySelectorAll('.time-item:not(.disabled)').forEach(el => {
    el.onclick = () => {
      state.selectedSlot = state.slots.find(s => s.label === el.dataset.label);
      slotsWrap.querySelectorAll('.time-item.selected').forEach(x => x.classList.remove('selected'));
      el.classList.add('selected');
      updateStep3Bar();
    };
  });
  updateStep3Bar();
}

async function advanceFromStep1() {
  if (!state.selectedService) return;
  advanceBtn.disabled = true;
  advanceBtn.textContent = 'Carregando…';
  await loadStaffForService(state.selectedService.id);
  // Uma só atendendo: o agendamento já sai no nome dela e a cliente vai direto
  // pra data. Zero é outra história — cai no passo 2, que tem o aviso de que
  // ninguém atende esse serviço.
  state.pulaEscolhaStaff = state.staff.length === 1;
  if (state.pulaEscolhaStaff) {
    state.selectedStaff = state.staff[0];
    setStep(3);
  } else {
    setStep(2);
  }
}

function render() {
  document.getElementById('errorBanner').innerHTML = state.error
    ? `<div class="empty" style="color:var(--color-accent-2)">Erro: ${state.error}</div>`
    : '';

  if (state.done) {
    setBackArrow(false);
    setBottomBar(false);
    const dateLabel = state.selectedSlot.start.toLocaleDateString('pt-BR', { timeZone: SALON_TZ, weekday: 'long', day: 'numeric', month: 'long' });
    app.innerHTML = `
      <div class="confirm-check">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="var(--color-neutral-100)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="confirm-heading">Você está<br>agendada.</div>
      <div class="confirm-sub">Reservamos seu horário. A confirmação já está a caminho do seu e-mail.</div>
      <div class="confirm-card">
        <div class="staff-avatar">${initials(state.selectedStaff.name)}</div>
        <div>
          <div class="name">${state.selectedStaff.name}</div>
          <div class="sub">${state.selectedService.name}</div>
        </div>
      </div>
      <div class="confirm-row"><span>${dateLabel.charAt(0).toUpperCase() + dateLabel.slice(1)}</span><span>${state.selectedSlot.label}</span></div>
      <div class="confirm-total">
        <span class="label">Total</span>
        <span class="amount${state.selectedService.price_label ? ' price-note' : ''}">${formatPrice(state.selectedService)}</span>
      </div>
      ${state.selectedService.price_varies ? '<div class="price-disclaimer" style="text-align:center">*valor varia de acordo com o cabelo e é confirmado após avaliação presencial</div>' : ''}
      <div class="confirm-footer">Te esperamos no Orenzi.</div>
    `;
    return;
  }

  if (state.step === 1) {
    const groups = groupByCategory(state.services);
    const hasVarying = state.services.some(s => s.price_varies);
    app.innerHTML = `
      <h2>Escolha o <em>serviço</em></h2>
      ${groups.map(g => `
        <div class="category-label">${g.category}</div>
        <div class="row-list">
          ${g.items.map(s => `
            <div class="row-item${state.selectedService && state.selectedService.id === s.id ? ' selected' : ''}" data-id="${s.id}">
              <div class="info">
                <div class="name">${s.name}</div>
                <div class="meta">${s.duration_minutes} min</div>
              </div>
              <div class="price">${formatPrice(s)}</div>
            </div>
          `).join('')}
        </div>
      `).join('')}
      ${hasVarying ? '<div class="price-disclaimer">*valor varia de acordo com o cabelo e é confirmado após avaliação presencial</div>' : ''}
    `;
    app.querySelectorAll('.row-item').forEach(el => {
      el.onclick = () => {
        const chosen = state.services.find(s => s.id === el.dataset.id);
        if (!state.selectedService || state.selectedService.id !== chosen.id) {
          state.selectedStaff = null;
          state.selectedDate = '';
          state.selectedSlot = null;
        }
        state.selectedService = chosen;
        app.querySelectorAll('.row-item.selected').forEach(x => x.classList.remove('selected'));
        el.classList.add('selected');
        setBottomBar(true, { enabled: true, onClick: advanceFromStep1 });
      };
    });
    setBackArrow(false);
    setBottomBar(true, { enabled: !!state.selectedService, onClick: advanceFromStep1 });
    return;
  }

  if (state.step === 2) {
    app.innerHTML = `
      <h2>Escolha a <em>profissional</em></h2>
      ${state.staff.length ? `<div class="row-list">${state.staff.map(s => `
        <div class="staff-row${state.selectedStaff && state.selectedStaff.id === s.id ? ' selected' : ''}" data-id="${s.id}">
          <div class="staff-avatar">${initials(s.name)}</div>
          <div>
            <div class="name">${s.name}</div>
            <div class="sub">${s.role || ''}</div>
          </div>
        </div>
      `).join('')}</div>` : '<div class="empty">Nenhum profissional disponível para esse serviço.</div>'}
    `;
    app.querySelectorAll('.staff-row').forEach(el => {
      el.onclick = () => {
        const chosen = state.staff.find(s => s.id === el.dataset.id);
        if (!state.selectedStaff || state.selectedStaff.id !== chosen.id) {
          state.selectedSlot = null;
        }
        state.selectedStaff = chosen;
        app.querySelectorAll('.staff-row.selected').forEach(x => x.classList.remove('selected'));
        el.classList.add('selected');
        setBottomBar(true, { enabled: true, onClick: () => setStep(3) });
      };
    });
    setBackArrow(true, () => setStep(1));
    setBottomBar(true, { enabled: !!state.selectedStaff, onClick: () => setStep(3) });
    return;
  }

  if (state.step === 3) {
    renderStep3();
    return;
  }

  if (state.step === 4) {
    app.innerHTML = `
      <h2>Seus <em>dados</em></h2>
      <div style="display:flex; gap:14px;">
        <div style="flex:1">
          <label>Primeiro nome</label>
          <input type="text" id="firstName" placeholder="Primeiro nome" value="${state.clientFirstName || ''}">
        </div>
        <div style="flex:1">
          <label>Último nome</label>
          <input type="text" id="lastName" placeholder="Último nome" value="${state.clientLastName || ''}">
        </div>
      </div>
      <label>Data de nascimento</label>
      <input type="date" id="birthdate" value="${state.clientBirthdate || ''}">
      <label>Telefone</label>
      <input type="tel" id="phone" placeholder="+353 ..." value="${state.clientPhone}">
      <label>E-mail</label>
      <input type="email" id="email" placeholder="voce@email.com" value="${state.clientEmail}">
      <label>Instagram</label>
      <input type="text" id="instagram" placeholder="opcional" value="${state.clientInstagram || ''}">
      <button class="btn btn-primary" id="confirm">Confirmar agendamento</button>
    `;
    setBackArrow(true, () => setStep(3));
    setBottomBar(false);
    document.getElementById('confirm').onclick = () => {
      state.clientFirstName = document.getElementById('firstName').value.trim();
      state.clientLastName = document.getElementById('lastName').value.trim();
      state.clientName = `${state.clientFirstName} ${state.clientLastName}`.trim();
      state.clientBirthdate = document.getElementById('birthdate').value;
      state.clientPhone = document.getElementById('phone').value.trim();
      state.clientEmail = document.getElementById('email').value.trim();
      state.clientInstagram = document.getElementById('instagram').value.trim();
      if (!state.clientFirstName || !state.clientLastName || !state.clientPhone) {
        state.error = 'Preencha nome, sobrenome e telefone.';
        render();
        return;
      }
      if (!state.clientEmail || !state.clientEmail.includes('@')) {
        state.error = 'Digite um e-mail válido — é por ele que enviamos a confirmação.';
        render();
        return;
      }
      confirmBooking();
    };
    return;
  }
}

// Registra uma visita à tela de agendar — só um contador simples (sem dados
// pessoais), usado no painel pra medir a taxa de conversão. Nunca deve travar
// nem quebrar a experiência do cliente, então falha em silêncio.
function logBookingVisit() {
  sb.from('booking_visits').insert({}).then(({ error }) => {
    if (error) console.warn('Não foi possível registrar a visita:', error.message);
  });
}

(async function init() {
  logBookingVisit();
  await Promise.all([loadServices(), loadActiveStaffCount()]);
  setStep(1);
})();
</script>
