  'Outros':      'var(--color-neutral-600)',
};
const CATEGORY_ACCENT_FALLBACK = Object.values(CATEGORY_ACCENTS);
function accentForCategory(cat) {
  if (cat && CATEGORY_ACCENTS[cat]) return CATEGORY_ACCENTS[cat];
  let h = 0;
  for (const ch of String(cat || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return CATEGORY_ACCENT_FALLBACK[h % CATEGORY_ACCENT_FALLBACK.length];
}

// ── ESTADO ───────────────────────────────────────────────────
// Jornada completa do V2.2 aprovado. A Fase 1 implementa só 'service';
// 'professional' é ocupado por um placeholder até a Fase 2. As chaves ficam
// todas aqui desde já para o progresso do topo refletir a jornada real, e não
// uma barra que "encolhe" quando as etapas seguintes entrarem.
const STEP_KEYS = ['service', 'professional', 'datetime', 'data', 'review'];

const state = {
  step: 'service',
  services: [],
  categories: [],
  categoryFilter: 'all',
  // Ordem de seleção é significativa: define sort_order em appointment_services
  // e a ordem de execução no bloco contínuo. Nunca reordenar por catálogo.
  selectedServiceIds: [],
  loading: true,
  error: null,
  servicesScrollTop: 0,
  acquisitionSource: captureAcquisitionSource(),

  // ── Profissional / data / horário (Fase 2) ──
  staff: [],                 // todas as ativas, com created_at para desempate
  staffServices: [],         // pares (staff_id, service_id) para a interseção
  staffLoaded: false,
  staffPref: null,           // 'any' | staff_id
  resolvedStaffId: null,     // previsão de UX; o servidor é a autoridade final
  selectedDateIso: null,
  selectedTime: null,

  // Cache de disponibilidade — chaveado por serviços + preferência + janela.
  availability: { key: null, loading: false, error: null, days: null },

  // Subview full-screen (calendário / política)
  subview: null,
  calendarMonth: null,
  calFeedback: '',
  calReturnFocusId: null,

  // ── Dados da cliente / política / commit (Fase 3) ──
  // Só em memória: nada de PII em sessionStorage/localStorage nesta fase.
  form: { name: '', phone: '', email: '', notes: '' },
  formTouched: {},
  formValidated: false,
  policy: null,              // versão corrente lida do banco
  policyAccepted: false,
  policyTouched: false,
  committing: false,
  commitError: null,         // { code, message } — nunca mostra código à cliente
  conflict: null,            // { alternatives: [{iso, time}] }
  booking: null,             // resposta do servidor (autoridade do recibo)
  createRequestKey: null,    // idempotência da OPERAÇÃO — uma por tentativa lógica
  manageToken: null,         // só em memória; nunca localStorage/sessionStorage/log
  emailSuccess: null,        // true|false|null — null quando o e-mail nem foi tentado (replay)
};

// Trocar os serviços muda a duração total E o conjunto de profissionais
// elegíveis, então toda escolha posterior deixa de ser válida. Chamada em TODO
// toggle de serviço e em toda troca de profissional (parcialmente).
function invalidateDownstreamSelections() {
  state.staffPref = null;
  state.resolvedStaffId = null;
  state.selectedDateIso = null;
  state.selectedTime = null;
  invalidateAvailability();
}

// Disponibilidade depende de (serviços × duração total × profissional), então
// qualquer um dos três mudar torna o cache inválido. Slot restaurado nunca é
// garantido — é exatamente por isso que o cache morre em vez de ser remendado.
function invalidateAvailability() {
  state.availability = { key: null, loading: false, error: null, days: null };
}

// ── DERIVADOS (apresentação apenas) ──────────────────────────
// ATENÇÃO: estes totais servem só para a UX. Na criação real, quem calcula
// preço e duração é o servidor, dentro de create_public_booking, a partir dos
// service_ids — o browser nunca é autoridade sobre valor nem sobre duração.
function serviceById(id) { return state.services.find(s => s.id === id); }
function selectedServices() { return state.selectedServiceIds.map(serviceById).filter(Boolean); }
function totalDurationMinutes() { return selectedServices().reduce((sum, s) => sum + (s.duration_minutes || 0), 0); }
function totalPrice() { return selectedServices().reduce((sum, s) => sum + Number(s.price || 0), 0); }
function anySelectedPriceVaries() { return selectedServices().some(s => s.price_varies); }

function formatMoney(n) {
  const num = Number(n);
  return num % 1 === 0 ? `€${num}` : `€${num.toFixed(2)}`;
}

function formatPrice(service) {
  const base = service.price_label || formatMoney(service.price);
  return service.price_varies ? `${base}*` : base;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ── CARREGAMENTO REAL ────────────────────────────────────────
async function loadServices() {
  state.loading = true;
  state.error = null;
  renderStepBody();
  renderCTA();

  const { data, error } = await sb.from('services').select('*').order('sort_order');
  state.loading = false;

  if (error) {
    console.error('agendar.loadServices', error);
    state.error = error.message;
    renderStepBody();
    renderCTA();
    return;
  }

  state.services = data || [];
  // Categorias saem dos dados reais, na ordem de sort_order — nada de lista
  // fixa: categoria nova no painel aparece aqui sozinha, e chip fixo viraria
  // filtro que nunca acha nada (mesma decisão já tomada no Estoque).
  state.categories = [...new Set(state.services.map(s => s.category).filter(Boolean))];
  // Seleção que aponte para serviço que sumiu do catálogo não pode sobreviver.
  state.selectedServiceIds = state.selectedServiceIds.filter(serviceById);
  renderStepBody();
  renderCTA();
}

// Profissionais ativas + os vínculos serviço↔profissional. Duas leituras
// públicas (policies "public read staff"/"public read staff_services"), feitas
// UMA vez no init — a interseção por serviço é calculada em memória depois,
// sem ida ao banco a cada toggle.
async function loadStaffCatalog() {
  const [staffRes, linkRes] = await Promise.all([
    sb.from('staff').select('id, name, role, active, created_at').eq('active', true).order('created_at'),
    sb.from('staff_services').select('staff_id, service_id'),
  ]);
  if (staffRes.error || linkRes.error) {
    console.error('agendar.loadStaffCatalog', staffRes.error || linkRes.error);
    return false;
  }
  state.staff = staffRes.data || [];
  state.staffServices = linkRes.data || [];
  state.staffLoaded = true;
  return true;
}

function staffById(id) { return state.staff.find(s => s.id === id); }

// Profissional elegível atende TODOS os serviços escolhidos. Só ativas entram:
// as quatro inativas continuam ligadas a todos os 15 serviços em
// staff_services por causa do histórico, e sem esse filtro a cliente escolheria
// entre pessoas que não estão mais no salão (armadilha já documentada no V1).
//
// Isto é DESCOBERTA/UX. O servidor revalida a mesma interseção dentro de
// create_public_booking e é ele quem decide — o browser nunca é autoridade.
function eligibleStaff() {
  const ids = state.selectedServiceIds;
  if (!ids.length) return [];
  return state.staff.filter(st =>
    ids.every(svcId => state.staffServices.some(l => l.staff_id === st.id && l.service_id === svcId))
  );
}

// ── DISPONIBILIDADE ──────────────────────────────────────────
const AVAILABILITY_DAYS = 60;   // horizonte da janela, conforme feasibility
// Tolerância idêntica à do servidor: is_public_booking_window aceita
// `p_starts_at >= now() - 5 minutes`. Espelhar o número evita oferecer um
// horário que a RLS recusaria — e evita esconder um que ela aceitaria.
const PAST_TOLERANCE_MS = 5 * 60 * 1000;

function addDaysIso(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d + n));
  return dt.toISOString().slice(0, 10);
}
function isoWeekday(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d)).getUTCDay();
}
function availabilityKey() {
  return `${[...state.selectedServiceIds].join(',')}|${state.staffPref}|${totalDurationMinutes()}`;
}

// Uma chamada MULTI-DIA por profissional elegível — nunca uma por dia.
// Com a Juliane sozinha isso é 1 request para os 60 dias inteiros.
// Pela RPC, nunca por `.from('appointments')`: esta página usa a chave anônima
// e a RLS só libera SELECT autenticado — a leitura direta devolveria lista
// vazia SEM erro e todo horário apareceria livre.
async function fetchBusyByStaff(staffIds, fromIso, toIso) {
  const from = salonTimeToInstant(fromIso, 0).toISOString();
  const to = salonTimeToInstant(toIso, 24 * 60).toISOString();
  const results = await Promise.all(staffIds.map(id =>
    sb.rpc('get_busy_slots', { p_staff_id: id, p_from: from, p_to: to })
      .then(({ data, error }) => ({ id, data, error }))
  ));
  const failed = results.find(r => r.error);
  if (failed) throw failed.error;
  const map = new Map();
  results.forEach(r => map.set(r.id, (r.data || []).map(b => ({
    start: new Date(b.busy_start).getTime(),
    end: new Date(b.busy_end).getTime(),
  }))));
  return map;
}

// Estados de dia (mesma semântica no rail e no calendário):
//   closed      — salão não opera (domingo/segunda, ou data passada)
//   unavailable — salão opera, mas a profissional escolhida não atende no dia
//   full        — opera e a profissional atende, mas nenhum bloco compatível cabe
//   available   — há ao menos um slot
const DAY_STATUS_LABEL = { available: 'Disponível', full: 'Lotado', closed: 'Fechado', unavailable: 'Indisp.' };
const DAY_STATUS_MARK = { full: 'L', closed: 'F', unavailable: 'I' };

// Constrói o mapa de dias/slots para a janela inteira.
// Cada slot guarda candidateStaffIds[] — sem isso, escolher um horário em
// "Qualquer profissional" não teria como virar uma profissional concreta.
function buildAvailability(staffIds, busyByStaff, fromIso, days, durationMin) {
  const out = new Map();
  const nowMs = Date.now() - PAST_TOLERANCE_MS;

  for (let i = 0; i < days; i++) {
    const iso = addDaysIso(fromIso, i);

    if (CLOSED_WEEKDAYS.includes(isoWeekday(iso))) {
      out.set(iso, { status: 'closed', slots: [] });
      continue;
    }
    // Sem tabela de escala por profissional, "não atende neste dia" não tem
    // origem de dado real hoje — o estado existe no modelo e é renderizado,
    // mas só passa a ocorrer quando/se existir uma escala por profissional.
    const worksToday = staffIds.filter(() => true);
    if (!worksToday.length) {
      out.set(iso, { status: 'unavailable', slots: [] });
      continue;
    }

    const slots = [];
    for (let m = OPEN_HOUR * 60; m + durationMin <= CLOSE_HOUR * 60; m += SLOT_MINUTES) {
      // m é minutos desde a meia-noite EM DUBLIN, nunca no relógio do aparelho.
      const start = salonTimeToInstant(iso, m);
      const startMs = start.getTime();
      if (startMs < nowMs) continue;              // nada no passado
      const endMs = startMs + durationMin * 60000;

      // O bloco multi-serviço é SÓLIDO E CONTÍNUO: a duração agregada inteira
      // precisa caber livre. Não se tenta encaixar nada em pausa interna nesta
      // fase (decisão congelada do V2).
      const candidates = worksToday.filter(id =>
        !(busyByStaff.get(id) || []).some(b => startMs < b.end && endMs > b.start)
      );
      if (candidates.length) {
        slots.push({ label: salonClock(start), minutes: m, start, candidateStaffIds: candidates });
      }
    }
    out.set(iso, { status: slots.length ? 'available' : 'full', slots });
  }
  return out;
}

async function ensureAvailability(force) {
  const key = availabilityKey();
  if (!force && state.availability.key === key && state.availability.days) return;

  const pool = eligibleStaff();
  const staffIds = state.staffPref && state.staffPref !== 'any'
    ? [state.staffPref]
    : pool.map(s => s.id);
  if (!staffIds.length) return;

  state.availability = { key, loading: true, error: null, days: null };
  renderStepBody(); renderCTA();

  const fromIso = salonToday();
  const toIso = addDaysIso(fromIso, AVAILABILITY_DAYS - 1);
  try {
    const busy = await fetchBusyByStaff(staffIds, fromIso, toIso);
    // Chave mudou enquanto a rede respondia (a cliente mexeu nos serviços):
    // descarta em silêncio, senão a tela mostraria dados de outra seleção.
    if (availabilityKey() !== key) return;
    const days = buildAvailability(staffIds, busy, fromIso, AVAILABILITY_DAYS, totalDurationMinutes());
    state.availability = { key, loading: false, error: null, days };
  } catch (e) {
    console.error('agendar.ensureAvailability', e);
    // Falha de disponibilidade NÃO derruba o shell nem apaga serviço/
    // profissional já escolhidos — só esta seção entra em estado de erro.
    state.availability = { key, loading: false, error: e.message || 'erro', days: null };
  }
  renderStepBody(); renderCTA();
}

function dayInfo(iso) {
  const days = state.availability.days;
  if (!days) return { status: 'closed', slots: [] };
  return days.get(iso) || { status: 'closed', slots: [] };
}
function slotAt(iso, label) {
  return dayInfo(iso).slots.find(s => s.label === label) || null;
}
// Primeira data com pelo menos um horário dentro da janela carregada.
function nextAvailableIso(afterIso) {
  const days = state.availability.days;
  if (!days) return null;
  for (const [iso, info] of days) {
    if (info.status === 'available' && (!afterIso || iso > afterIso)) return iso;
  }
  return null;
}

// Resolução de "Qualquer profissional" -> profissional concreta.
// Regra idêntica à do servidor (ORDER BY created_at, id entre as disponíveis),
// justamente para que a previsão da tela e a decisão do banco coincidam.
// AINDA ASSIM é só previsão: na Fase 3, o retorno de create_public_booking
// substitui isto. Review/Sucesso nunca mostram "Qualquer profissional".
function resolveStaffForSlot(slot) {
  if (!slot) return null;
  if (state.staffPref && state.staffPref !== 'any') return state.staffPref;
  const ordered = state.staff
    .filter(s => slot.candidateStaffIds.includes(s.id))
    .sort((a, b) => (a.created_at || '').localeCompare(b.created_at || '') || a.id.localeCompare(b.id));
  return ordered.length ? ordered[0].id : null;
}

// ── POLÍTICA DE CANCELAMENTO ─────────────────────────────────
// A versão corrente vem do banco (tabela cancellation_policies, leitura
// pública só de is_current). O texto NÃO vive no frontend: o mesmo registro
// que a cliente lê é o que fica apontado no agendamento, então o que foi
// aceito é reconstituível depois mesmo que a política mude.
async function loadPolicy() {
  const { data, error } = await sb
    .from('cancellation_policies')
    .select('id, version, summary, body')
    .eq('is_current', true)
    .maybeSingle();
  if (error) { console.error('agendar.loadPolicy', error); return; }
  state.policy = data || null;
}

// ── COMMIT ───────────────────────────────────────────────────
// Mensagens por código semântico. A cliente nunca vê o código; e cada erro
// recuperável aponta a etapa onde ela consegue resolver.
const COMMIT_ERRORS = {
  invalid_service:            { step: 'service',  msg: 'Um dos serviços escolhidos não está mais disponível. Escolha novamente.' },
  no_staff_available:         { step: 'service',  msg: 'Nenhum profissional atende essa combinação de serviços. Ajuste os serviços para continuar.' },
  invalid_staff_for_services: { step: 'professional', msg: 'A profissional escolhida não atende todos esses serviços. Escolha outra.' },
  outside_booking_window:     { step: 'datetime', msg: 'Esse horário não está mais dentro do expediente. Escolha outro horário.' },
  invalid_client_data:        { step: 'data',     msg: 'Confira seus dados: precisamos de nome, telefone e um e-mail válido.' },
  policy_not_accepted:        { step: 'review',   msg: 'É preciso aceitar a política de cancelamento para concluir.' },
  internal_error:             { step: null,       msg: 'Não foi possível concluir agora. Tente de novo em instantes.' },
};

// Alternativas REAIS para o conflito: recalculadas da disponibilidade fresca,
// nunca inventadas a partir do horário pedido.
function buildAlternatives() {
  const alts = [];
  const iso = state.selectedDateIso;
  const chosen = state.selectedTime;
  const sameDay = dayInfo(iso).slots.filter(s => s.label !== chosen);
  // Prioriza o mesmo dia, do horário mais próximo do que ela queria.
  const toMin = t => Number(t.split(':')[0]) * 60 + Number(t.split(':')[1]);
  sameDay.sort((a, b) => Math.abs(a.minutes - toMin(chosen)) - Math.abs(b.minutes - toMin(chosen)));
  sameDay.slice(0, 2).forEach(s => alts.push({ iso, time: s.label }));
  // Completa com o primeiro horário do próximo dia disponível.
  if (alts.length < 3) {
    const nextIso = nextAvailableIso(iso);
    const first = nextIso && dayInfo(nextIso).slots[0];
    if (first) alts.push({ iso: nextIso, time: first.label });
  }
  return alts.slice(0, 3);
}

// request_key: uma por TENTATIVA lógica de confirmar (não uma por clique) —
// reaproveitada em qualquer retry automático dessa mesma tentativa, pra que
// a Edge Function/RPC do lado do banco possa deduplicar de verdade. Só nasce
// de novo se a cliente reiniciar o fluxo (resetFlow) ou trocar algo essencial.
function ensureRequestKey() {
  if (!state.createRequestKey) state.createRequestKey = crypto.randomUUID();
  return state.createRequestKey;
}

async function commitBooking() {
  // Guarda de duplo submit no próprio estado: não basta desabilitar o botão,
  // porque Enter/duplo toque podem disparar antes do re-render.
  if (state.committing) return;
  state.committing = true;
  state.commitError = null;
  state.conflict = null;
  renderStepBody(); renderCTA();

  const slot = slotAt(state.selectedDateIso, state.selectedTime);
  if (!slot) {
    state.committing = false;
    state.commitError = { code: 'outside_booking_window', ...COMMIT_ERRORS.outside_booking_window };
    renderStepBody(); renderCTA();
    return;
  }

  // Só o que o contrato permite. Preço, duração, nome do serviço, ends_at,
  // source, referência, token e a profissional final são derivados no
  // servidor — enviar qualquer um deles seria tratar o browser como autoridade.
  // Browser = UX; a Edge Function orquestra (RPC + e-mail); a RPC é a
  // autoridade de negócio. O browser nunca chama a RPC direto neste fluxo.
  const payload = {
    service_ids: [...state.selectedServiceIds],
    staff_pref: (!state.staffPref || state.staffPref === 'any') ? null : state.staffPref,
    starts_at: slot.start.toISOString(),
    name: state.form.name.trim(),
    phone: state.form.phone.trim(),
    email: state.form.email.trim(),
    notes: state.form.notes.trim() || null,
    policy_accepted: state.policyAccepted === true,
  };

  let res, body;
  try {
    res = await sb.functions.invoke('booking-orchestrator', {
      body: { event_type: 'created', request_key: ensureRequestKey(), payload },
    });
    body = res.data;
    if (res.error) throw res.error;
  } catch (e) {
    state.committing = false;
    state.commitError = { code: 'internal_error', ...COMMIT_ERRORS.internal_error };
    console.error('agendar.commitBooking', e && e.message);   // nunca o token, nunca PII
    renderStepBody(); renderCTA();
    return;
  }
  state.committing = false;

  if (!body || !body.operation_success) {
    const code = (body && body.code) || 'internal_error';
    if (code === 'slot_conflict') {
      // Recuperação contextual: dados preservados, alternativas reais. A
      // request_key NÃO é trocada — é a mesma tentativa lógica até concluir.
      await ensureAvailability(true);
      state.conflict = { alternatives: buildAlternatives() };
      renderStepBody(); renderCTA();
      return;
    }
    const known = COMMIT_ERRORS[code] || COMMIT_ERRORS.internal_error;
    state.commitError = { code, ...known };
    console.error('agendar.commitBooking', code);
    if (known.step && known.step !== 'review') {
      if (known.step === 'data') state.formValidated = true;
      if (known.step === 'service') invalidateDownstreamSelections();
      goTo(known.step);
      return;
    }
    renderStepBody(); renderCTA();
    return;
  }

  // A resposta do servidor passa a ser a autoridade do recibo: profissional
  // realmente atribuída, totais calculados no banco, referência e horários.
  // manage_token só vem preenchido na conclusão fresca — num replay depois de
  // resposta perdida, vem null, e isso é aceitável: o booking não duplicou,
  // só esta resposta específica não pode reconstituir o segredo (nunca se
  // busca o token por booking_reference, isso enfraqueceria o hash-only).
  state.booking = body.booking;
  state.emailSuccess = body.email_success;
  state.manageToken = body.manage_token || null;
  state.resolvedStaffId = body.booking.staff && body.booking.staff.id ? body.booking.staff.id : state.resolvedStaffId;
  state.step = 'success';
  renderAll();
  document.getElementById('main').scrollTop = 0;
}

// Registra uma visita à tela de agendar — só um contador simples (sem dados
// pessoais), usado no painel pra medir a taxa de conversão. Nunca deve travar
// nem quebrar a experiência do cliente, então falha em silêncio.
function logBookingVisit() {
  sb.from('booking_visits').insert({}).then(({ error }) => {
    if (error) console.warn('Não foi possível registrar a visita:', error.message);
  });
}

// ══════════════════════════════════════════════════════════════
// FASE 2/3 — funções preservadas do V1, ainda NÃO chamadas.
// Continuam aqui porque a lógica é validada e a armadilha que elas evitam
// é real (ver app/CLAUDE.md). Foram parametrizadas para não depender do
// formato antigo de `state`, então não há acoplamento com o que foi removido.
// ══════════════════════════════════════════════════════════════

// Profissionais que atendem um serviço. FILTRA POR `active`: todas as cinco
// estão ligadas a todos os 15 serviços em staff_services, então sem esse filtro
// a cliente escolheria entre cinco pessoas — quatro fora do salão, incluindo a
// recepcionista — e poderia agendar com quem não atende.
async function loadStaffForService(serviceId) {
  const { data, error } = await sb
    .from('staff_services')
    .select('staff:staff_id(id, name, role, active)')
    .eq('service_id', serviceId);
  if (error) { console.error('agendar.loadStaffForService', error); return []; }
  return data.map(row => row.staff).filter(s => s && s.active !== false);
}

// Horários livres de uma profissional num dia, para uma duração.
// Pela RPC, NUNCA por `.from('appointments')`: esta página usa a chave anônima
// e a RLS de appointments só libera SELECT autenticado. A leitura direta não dá
// erro — devolve lista vazia — e com isso TODO horário aparece livre, inclusive
// os ocupados. get_busy_slots é SECURITY DEFINER e devolve só os blocos de
// trabalho: a pausa (tinta agindo) fica de fora de propósito, porque durante
// ela a profissional está livre pra atender outra cliente.
async function loadAvailableSlots(staffId, dateStr, durationMinutes) {
  const weekday = new Date(`${dateStr}T00:00:00`).getDay();
  if (CLOSED_WEEKDAYS.includes(weekday)) return [];

  // A janela do dia também é a do salão: como strings soltas, o Postgres as lia
  // no fuso da sessão dele e a busca por conflitos pegava horas erradas.
  const dayStart = salonTimeToInstant(dateStr, 0).toISOString();
  const dayEnd = salonTimeToInstant(dateStr, 24 * 60 - 1).toISOString();

  const { data: busy, error } = await sb.rpc('get_busy_slots', {
    p_staff_id: staffId,
    p_from: dayStart,
    p_to: dayEnd,
  });
  if (error) { console.error('agendar.loadAvailableSlots', error); return []; }

  const slots = [];
  for (let m = OPEN_HOUR * 60; m + durationMinutes <= CLOSE_HOUR * 60; m += SLOT_MINUTES) {
    // m é minutos desde a meia-noite EM DUBLIN, não no relógio do aparelho.
    const slotStart = salonTimeToInstant(dateStr, m);
    const slotEnd = new Date(slotStart.getTime() + durationMinutes * 60000);
    const overlaps = (busy || []).some(b =>
      slotStart < new Date(b.busy_end) && slotEnd > new Date(b.busy_start));
    slots.push({ label: salonClock(slotStart), start: slotStart, end: slotEnd, available: !overlaps });
  }
  return slots;
}

// Remove tudo que não for dígito, pra "01234567", "+353 1234567" e "(0123) 456-7"
// serem tratados como o mesmo número. A dedup de verdade acontece no banco
// (normalize_ie_phone dentro de find_or_create_client); isto é só o preparo.
function normalizePhone(phone) {
  return (phone || '').replace(/[^\d]/g, '');
}

// ── SHELL ────────────────────────────────────────────────────
// O passo de profissional só sai do fluxo quando há EXATAMENTE uma elegível —
// aí não existe escolha a fazer e a cliente vai do serviço direto para a data
// (mesmo princípio do `pulaEscolhaStaff` do V1, agora derivado da interseção
// multi-serviço).
//
// Zero elegíveis NÃO é caso de pular: é o estado de "nenhum profissional
// atende esta combinação", que precisa de tela própria para explicar e oferecer
// "Alterar serviços". Um `> 1` aqui tornava esse estado inalcançável e jogava o
// fluxo direto em Data/Horário sem profissional nenhuma.
function visibleStepKeys() {
  return eligibleStaff().length === 1 ? STEP_KEYS.filter(k => k !== 'professional') : STEP_KEYS;
}
function stepIndex() { return visibleStepKeys().indexOf(state.step); }

function renderShell() {
  const topbar = document.getElementById('topbar');

  // Subviews full-screen: sem barra de progresso, título no centro.
  if (state.subview) {
    const isPolicy = state.subview === 'policy';
    topbar.className = 'bk-topbar sub-mode';
    topbar.innerHTML = `
      <button class="bk-back" id="backBtn" aria-label="${isPolicy ? 'Voltar para a revisão' : 'Fechar calendário'}">${ICONS.chevronLeft}</button>
      <span class="bk-sub-title">${isPolicy ? 'Política de cancelamento' : 'Escolha uma data'}</span>`;
    document.getElementById('backBtn').addEventListener('click', isPolicy ? closePolicy : closeCalendar);
    return;
  }

  // Sucesso encerra o fluxo: sem voltar (o agendamento já existe) e sem progresso.
  if (state.step === 'success') {
    topbar.className = 'bk-topbar';
    topbar.innerHTML = `<div class="bk-mark" style="margin:0 auto"><span class="bk-mark-dot" aria-hidden="true">O</span></div>`;
    return;
  }

  const keys = visibleStepKeys();
  const idx = Math.max(0, keys.indexOf(state.step));
  const pct = Math.max(6, Math.round(((idx + 1) / keys.length) * 100));
  const first = idx <= 0;

  topbar.className = 'bk-topbar';
  topbar.innerHTML = `
    <button class="bk-back${first ? ' is-hidden' : ''}" id="backBtn" aria-label="Voltar"
      ${first ? 'tabindex="-1"' : ''}>${ICONS.chevronLeft}</button>
    <div class="bk-progress-track" role="progressbar"
      aria-valuemin="1" aria-valuemax="${keys.length}" aria-valuenow="${idx + 1}"
      aria-label="Progresso do agendamento: passo ${idx + 1} de ${keys.length}">
      <div class="bk-progress-fill" style="width:${pct}%"></div>
    </div>
    <div class="bk-mark"><span class="bk-mark-dot" aria-hidden="true">O</span></div>
  `;
  const backBtn = document.getElementById('backBtn');
  if (backBtn && !first) backBtn.addEventListener('click', goBack);
}

function goTo(stepKey) {
  if (state.step === 'service') {
    // Guardado para restaurar ao voltar — a cliente não deve perder o ponto da
    // lista onde estava só porque foi olhar a etapa seguinte.
    state.servicesScrollTop = document.getElementById('main').scrollTop;
  }
  state.step = stepKey;

  // Uma só elegível: já entra escolhida, sem passar por tela nenhuma. Vale
  // inclusive quando a preferência anterior era 'any' — com uma única
  // profissional possível, "qualquer" É ela, e mostrar "Qualquer profissional"
  // num fluxo de uma pessoa só seria impreciso. Preferência concreta que
  // continue elegível nunca é sobrescrita.
  if (stepKey === 'datetime') {
    const pool = eligibleStaff();
    const prefValida = state.staffPref && state.staffPref !== 'any'
      && pool.some(s => s.id === state.staffPref);
    if (pool.length === 1 && !prefValida) state.staffPref = pool[0].id;
    else if (!state.staffPref && pool.length > 1) state.staffPref = 'any';
  }

  renderAll();
  document.getElementById('main').scrollTop = (stepKey === 'service') ? state.servicesScrollTop : 0;
  if (stepKey === 'datetime') ensureAvailability();
}

function goBack() {
  const keys = visibleStepKeys();
  const idx = keys.indexOf(state.step);
  if (idx <= 0) return;
  const prev = keys[idx - 1];
  // Voltar de Data/Horário para Profissional PRESERVA a preferência escolhida
  // (a tela reabre já mostrando quem estava selecionada), mas descarta
  // data/horário: eles foram escolhidos contra uma agenda específica e não
  // podem ser dados como válidos se a profissional mudar. O cache em si só cai
  // se a preferência realmente mudar — quem faz isso é bindStepProfessional.
  if (state.step === 'datetime' && prev === 'professional') {
    state.selectedDateIso = null;
    state.selectedTime = null;
    state.resolvedStaffId = null;
  }
  goTo(prev);
}

function renderAll() {
  renderShell();
  renderStepBody();
  renderCTA();
}

// ── STEP 1: SERVIÇOS ─────────────────────────────────────────
function servicesSkeletonHtml() {
  return `
    <h1 class="bk-title">Escolha o serviço</h1>
    <div class="bk-title-note">Você pode escolher mais de um.</div>
    <div class="bk-chip-rail" aria-hidden="true">
      ${Array.from({ length: 4 }).map(() => '<div class="bk-skel-chip"></div>').join('')}
    </div>
    <div class="bk-svc-list" aria-hidden="true">
      ${Array.from({ length: 5 }).map(() => '<div class="bk-skel-card"></div>').join('')}
    </div>
    <p class="sr-only" role="status">Carregando serviços…</p>
  `;
}

function servicesErrorHtml() {
  return `
    <h1 class="bk-title">Escolha o serviço</h1>
    <div class="bk-state" role="alert">
      ${ICONS.warn}
      <div class="bk-state-title">Não foi possível carregar</div>
      <p class="bk-state-text">Verifique sua conexão e tente de novo. Nada do que você escolheu foi perdido.</p>
      <button class="bk-state-action" id="retryBtn">Tentar de novo</button>
    </div>
  `;
}

function servicesEmptyHtml() {
  return `
    <h1 class="bk-title">Escolha o serviço</h1>
    <div class="bk-state">
      ${ICONS.empty}
      <div class="bk-state-title">Nenhum serviço disponível</div>
      <p class="bk-state-text">A agenda online está sem serviços publicados no momento. Fale com o salão para marcar seu horário.</p>
    </div>
  `;
}

function serviceCardHtml(s) {
  const selected = state.selectedServiceIds.includes(s.id);
  const duration = `${s.duration_minutes} min`;
  const price = formatPrice(s);
  // O cartão inteiro É o botão (não há <div onclick>, e não há botão dentro de
  // botão): o círculo +/✓ é decorativo e o estado é anunciado por aria-pressed.
  return `
    <button type="button" class="bk-svc-card" data-svc="${esc(s.id)}"
      style="--cat-color:${accentForCategory(s.category)}"
      aria-pressed="${selected}"
      aria-label="${esc(s.name)}, ${duration}, ${esc(price)}">
      <span class="svc-card-top">
        <span class="svc-card-name">${esc(s.name)}</span>
        <span class="svc-card-duration">${duration}</span>
      </span>
      <span class="svc-card-bottom">
        <span class="svc-card-price">${esc(price)}</span>
        <span class="svc-select-mark" aria-hidden="true">${selected ? ICONS.check : ICONS.plus}</span>
      </span>
    </button>`;
}

function renderStepServices() {
  if (state.loading) return servicesSkeletonHtml();
  if (state.error) return servicesErrorHtml();
  if (!state.services.length) return servicesEmptyHtml();

  const filtered = state.categoryFilter === 'all'
    ? state.services
    : state.services.filter(s => s.category === state.categoryFilter);

  const hasVarying = filtered.some(s => s.price_varies);

  return `
    <h1 class="bk-title">Escolha o serviço</h1>
    <div class="bk-title-note">Você pode escolher mais de um.</div>

    <div class="bk-chip-rail" id="catRail" role="group" aria-label="Filtrar por categoria">
      <button type="button" class="bk-chip" data-cat="all"
        aria-pressed="${state.categoryFilter === 'all'}">Todos</button>
      ${state.categories.map(c => `
        <button type="button" class="bk-chip" data-cat="${esc(c)}"
          aria-pressed="${state.categoryFilter === c}">${esc(c)}</button>`).join('')}
    </div>

    <div class="bk-svc-list" id="svcList">
      ${filtered.map(serviceCardHtml).join('')}
    </div>
    ${hasVarying ? '<p class="price-disclaimer">*valor varia de acordo com o cabelo e é confirmado após avaliação presencial</p>' : ''}
  `;
}

function toggleService(id) {
  if (!serviceById(id)) return;
  const idx = state.selectedServiceIds.indexOf(id);
  // O próprio índice impede duplicata: já selecionado sai, ausente entra no fim
  // (preservando a ordem de escolha).
  if (idx === -1) state.selectedServiceIds.push(id);
  else state.selectedServiceIds.splice(idx, 1);

  invalidateDownstreamSelections();

  // Repinta só o cartão tocado e o CTA — re-renderizar a lista inteira
  // destruiria o botão que está sob o dedo e mataria o foco do teclado.
  // Mesma armadilha já documentada na busca de Clientes e no Estoque.
  const card = document.querySelector(`.bk-svc-card[data-svc="${CSS.escape(id)}"]`);
  if (card) {
    const nowSelected = state.selectedServiceIds.includes(id);
    card.setAttribute('aria-pressed', String(nowSelected));
    card.querySelector('.svc-select-mark').innerHTML = nowSelected ? ICONS.check : ICONS.plus;
  }
  renderCTA();
}

function bindStepServices() {
  const retry = document.getElementById('retryBtn');
  if (retry) { retry.addEventListener('click', loadServices); return; }

  const rail = document.getElementById('catRail');
  if (rail) {
    rail.querySelectorAll('.bk-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        // Trocar de categoria é só filtro de exibição: NÃO mexe na seleção.
        state.categoryFilter = btn.dataset.cat;
        renderStepBody();
        renderCTA();
      });
    });
  }
  const list = document.getElementById('svcList');
  if (list) {
    list.querySelectorAll('.bk-svc-card').forEach(card => {
      card.addEventListener('click', () => toggleService(card.dataset.svc));
    });
  }
}

// ── STEP 2: PROFISSIONAL ─────────────────────────────────────
function initials(name) {
  return (name || '').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
}

function renderStepProfessional() {
  const pool = eligibleStaff();

  // Nenhuma profissional atende a combinação escolhida: não há caminho adiante,
  // e o único movimento útil é voltar e mexer nos serviços.
  if (!pool.length) {
    return `
      <h1 class="bk-title">Escolha o profissional</h1>
      <div class="bk-state-block">
        <div class="sb-icon">${ICONS.warn}</div>
        <p>Nenhum profissional disponível para esta combinação de serviços.</p>
        <button class="sb-retry" id="changeSvcBtn">Alterar serviços</button>
      </div>`;
  }

  const card = (id, avatar, name, sub, isAny) => {
    const sel = state.staffPref === id;
    return `
      <button type="button" class="bk-staff-card" data-staff="${esc(id)}" aria-pressed="${sel}">
        <span class="stf-avatar${isAny ? ' any' : ''}" aria-hidden="true">${avatar}</span>
        <span class="stf-body">
          <span class="stf-name">${esc(name)}</span>
          <span class="stf-sub">${esc(sub)}</span>
        </span>
        <span class="stf-select" aria-hidden="true">${sel ? ICONS.check : ''}</span>
      </button>`;
  };

  return `
    <h1 class="bk-title">Escolha o profissional</h1>
    <div class="bk-title-note">${esc(selectedServices().map(s => s.name).join(' · '))}</div>
    <div class="bk-staff-list" id="staffList">
      ${card('any', '∗', 'Qualquer profissional', 'Maior disponibilidade de horários', true)}
      ${pool.map(s => card(s.id, initials(s.name), s.name, s.role || 'Profissional', false)).join('')}
    </div>`;
}

function bindStepProfessional() {
  const change = document.getElementById('changeSvcBtn');
  if (change) { change.addEventListener('click', () => goTo('service')); return; }
  document.getElementById('staffList').querySelectorAll('[data-staff]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (state.staffPref !== btn.dataset.staff) {
        state.staffPref = btn.dataset.staff;
        // Trocar de profissional muda a agenda: data/horário e cache caem.
        state.selectedDateIso = null;
        state.selectedTime = null;
        state.resolvedStaffId = null;
        invalidateAvailability();
      }
      renderStepBody();
      renderCTA();
    });
  });
}

// ── STEP 3: DATA E HORÁRIO ───────────────────────────────────
const DOW_SHORT = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const RAIL_DAYS = 14;   // período curto próximo; o resto vive no calendário

function fmtDayFull(iso) {
  if (!iso) return '—';
  const [y, m, d] = iso.split('-').map(Number);
  const dow = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'][isoWeekday(iso)];
  return `${dow}, ${d} de ${MONTHS_PT[m - 1].toLowerCase()}`;
}
function fmtDayShort(iso) {
  if (!iso) return '—';
  const [, m, d] = iso.split('-').map(Number);
  return `${DOW_SHORT[isoWeekday(iso)]}, ${d} ${MONTHS_PT[m - 1].slice(0, 3).toLowerCase()}`;
}

function contextStaffLine() {
  const pool = eligibleStaff();
  const editable = pool.length > 1;   // sem escolha real, não há o que editar
  const isAny = !state.staffPref || state.staffPref === 'any';
  const st = isAny ? null : staffById(state.staffPref);
  const name = isAny ? 'Qualquer profissional' : (st ? st.name : '—');
  return `
    <button type="button" class="bk-context-line" id="staffContextBtn" ${editable ? '' : 'disabled'}
      ${editable ? 'aria-label="Profissional: ' + esc(name) + '. Tocar para alterar"' : ''}>
      <span class="cl-avatar${isAny ? ' any' : ''}" aria-hidden="true">${isAny ? '∗' : esc(initials(name))}</span>
      <span>${esc(name)}</span>
      ${editable ? ICONS.chevronDown : ''}
    </button>`;
}

function datetimeSkeleton() {
  return `
    <span class="bk-eyebrow">Escolha uma data</span>
    <div class="bk-date-rail" aria-hidden="true">
      ${Array.from({ length: 6 }).map(() => '<div class="bk-skel-day"></div>').join('')}
    </div>
    <span class="bk-eyebrow">Escolha um horário</span>
    <div class="bk-time-grid" aria-hidden="true">
      ${Array.from({ length: 6 }).map(() => '<div class="bk-skel-slot"></div>').join('')}
    </div>
    <p class="sr-only" role="status">Carregando horários…</p>`;
}

function dateRailHtml() {
  const from = salonToday();
  return `
    <div class="bk-date-rail" id="dateRail" role="group" aria-label="Escolha um dia">
      ${Array.from({ length: RAIL_DAYS }).map((_, i) => {
        const iso = addDaysIso(from, i);
        const info = dayInfo(iso);
        const st = info.status;
        const notAvail = st !== 'available';
        const selected = state.selectedDateIso === iso;
        const [, m, d] = iso.split('-').map(Number);
        return `
          <button type="button" class="bk-day${notAvail ? ' st-' + st : ''}" data-date="${iso}"
            aria-pressed="${selected}" ${notAvail ? 'disabled' : ''}
            aria-label="${fmtDayFull(iso)}${notAvail ? ', ' + DAY_STATUS_LABEL[st] : ''}">
            <span class="d-dow">${DOW_SHORT[isoWeekday(iso)]}</span>
            <span class="d-num">${d}</span>
            <span class="d-mon">${MONTHS_PT[m - 1].slice(0, 3).toLowerCase()}</span>
            ${i === 0 && !notAvail ? '<span class="d-today-mark" aria-hidden="true"></span>' : ''}
            ${notAvail ? `<span class="d-status-label">${DAY_STATUS_LABEL[st]}</span>` : ''}
          </button>`;
      }).join('')}
    </div>`;
}

// Manhã < 12h · Tarde 12–17h · Noite ≥ 18h. Com CLOSE_HOUR = 18 e o
// atendimento tendo que TERMINAR até lá, "Noite" não chega a existir hoje —
// o grupo só aparece se algum dia houver slot noturno de verdade.
const TIME_GROUPS = [
  { label: 'Manhã', test: m => m < 12 * 60 },
  { label: 'Tarde', test: m => m >= 12 * 60 && m < 18 * 60 },
  { label: 'Noite', test: m => m >= 18 * 60 },
];

function timeGridHtml() {
  const iso = state.selectedDateIso;
  if (!iso) return `<p class="bk-state-text" style="color:var(--color-neutral-600);font-size:13px">Escolha uma data para ver os horários.</p>`;

  const info = dayInfo(iso);
  if (!info.slots.length) {
    const next = nextAvailableIso(iso);
    return `
      <div class="bk-state-block">
        <div class="sb-icon">${ICONS.empty}</div>
        <p><strong style="color:var(--color-text)">Nenhum horário disponível</strong><br>em ${esc(fmtDayShort(iso))}.</p>
        ${next ? `
          <div class="bk-next-avail">
            <strong>Próximo horário disponível em ${esc(fmtDayShort(next))}</strong>
            <button type="button" id="nextAvailBtn">Ver essa data</button>
          </div>` : `
          <div class="bk-next-avail">
            <strong>Sem horários nos próximos ${AVAILABILITY_DAYS} dias</strong>
            <button type="button" id="openCalBtn2">Ver calendário</button>
          </div>`}
      </div>`;
  }

  return TIME_GROUPS.map(g => {
    const slots = info.slots.filter(s => g.test(s.minutes));
    if (!slots.length) return '';
    return `
      <div class="bk-time-group">
        <div class="bk-time-group-label">${g.label}</div>
        <div class="bk-time-grid">
          ${slots.map(s => `
            <button type="button" class="bk-time-chip" data-time="${s.label}"
              aria-pressed="${state.selectedTime === s.label}">${s.label}</button>`).join('')}
        </div>
      </div>`;
  }).join('');
}

function renderStepDatetime() {
  const head = `
    <h1 class="bk-title">Escolha a data e o horário</h1>
    <div class="bk-title-note">${totalDurationMinutes()} min no total</div>
    ${commitErrorBanner('datetime')}
    ${contextStaffLine()}`;

  const av = state.availability;
  if (av.loading) return head + datetimeSkeleton();
  if (av.error) {
    return head + `
      <div class="bk-state-block is-error" role="alert">
        <div class="sb-icon">${ICONS.offline}</div>
        <p>Não foi possível carregar os horários.<br>Verifique sua conexão e tente novamente.</p>
        <button class="sb-retry" id="availRetryBtn">Tentar de novo</button>
      </div>`;
  }

  // A data escolhida pelo calendário pode cair FORA dos dias do rail; sem
  // nomeá-la aqui, a grade mostraria horários de um dia que não aparece em
  // lugar nenhum da tela.
  const dayLabel = state.selectedDateIso ? ` · ${esc(fmtDayShort(state.selectedDateIso))}` : '';
  return head + `
    <span class="bk-eyebrow">Escolha uma data</span>
    <button type="button" class="bk-cal-link" id="openCalBtn">${ICONS.calendar} Ver calendário</button>
    ${dateRailHtml()}
    <span class="bk-eyebrow">Escolha um horário${dayLabel}</span>
    ${timeGridHtml()}`;
}

function selectDate(iso) {
  state.selectedDateIso = iso;
  state.selectedTime = null;      // slot nunca sobrevive à troca de dia
  state.resolvedStaffId = null;
  renderStepBody(); renderCTA();
}

function bindStepDatetime() {
  const ctx = document.getElementById('staffContextBtn');
  if (ctx && !ctx.disabled) ctx.addEventListener('click', () => goBack());

  const retry = document.getElementById('availRetryBtn');
  if (retry) { retry.addEventListener('click', () => ensureAvailability(true)); return; }

  const openCal = document.getElementById('openCalBtn');
  if (openCal) openCal.addEventListener('click', () => openCalendar('openCalBtn'));
  const openCal2 = document.getElementById('openCalBtn2');
  if (openCal2) openCal2.addEventListener('click', () => openCalendar('openCalBtn2'));

  const next = document.getElementById('nextAvailBtn');
  if (next) next.addEventListener('click', () => selectDate(nextAvailableIso(state.selectedDateIso)));

  const rail = document.getElementById('dateRail');
  if (rail) rail.querySelectorAll('[data-date]').forEach(btn => {
    btn.addEventListener('click', () => selectDate(btn.dataset.date));
  });

  document.querySelectorAll('.bk-time-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      state.selectedTime = btn.dataset.time;
      const slot = slotAt(state.selectedDateIso, state.selectedTime);
      state.resolvedStaffId = resolveStaffForSlot(slot);
      renderStepBody(); renderCTA();
    });
  });
}

// ── CALENDÁRIO (subview full-screen, não BottomSheet) ────────
function openCalendar(returnFocusId) {
  state.calReturnFocusId = returnFocusId || null;
  state.calFeedback = '';
  const base = state.selectedDateIso || salonToday();
  const [y, m] = base.split('-').map(Number);
  state.calendarMonth = { y, m: m - 1 };
  state.subview = 'calendar';
  renderAll();
}

function closeCalendar() {
  state.subview = null;
  renderAll();
  // Foco volta para o controle que abriu o calendário — sem isso o teclado
  // reinicia no topo do documento a cada abertura/fechamento.
  const back = state.calReturnFocusId && document.getElementById(state.calReturnFocusId);
  if (back) back.focus();
  state.calReturnFocusId = null;
}

function calendarBounds() {
  const from = salonToday();
  return { from, to: addDaysIso(from, AVAILABILITY_DAYS - 1) };
}

function renderCalendar() {
  const { y, m } = state.calendarMonth;
  const { from, to } = calendarBounds();
  const startDow = new Date(Date.UTC(y, m, 1)).getUTCDay();
  const daysInMonth = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();

  let cells = '';
  for (let i = 0; i < startDow; i++) cells += '<button class="mg-day is-empty" disabled aria-hidden="true"></button>';
  for (let d = 1; d <= daysInMonth; d++) {
    const iso = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    // Fora da janela carregada não se inventa estado: dia anterior a hoje é
    // fechado; depois do horizonte fica desabilitado sem rótulo enganoso.
    let status;
    if (iso < from) status = 'closed';
    else if (iso > to) status = 'closed';
    else status = dayInfo(iso).status;
    const notAvail = status !== 'available';
    const isToday = iso === from;
    const isSel = iso === state.selectedDateIso;
    cells += `
      <button type="button" class="mg-day${notAvail ? ' st-' + status : ''}${isToday ? ' is-today' : ''}${isSel ? ' is-selected' : ''}"
        data-cal-day="${iso}" data-cal-status="${status}"
        aria-label="${fmtDayFull(iso)}${notAvail ? ', ' + DAY_STATUS_LABEL[status] : ', disponível'}"
        ${isSel ? 'aria-current="date"' : ''}>${d}${notAvail ? `<span class="mg-mark" aria-hidden="true">${DAY_STATUS_MARK[status]}</span>` : ''}</button>`;
  }

  // Navegação limitada ao horizonte já carregado — nada de puxar 12 meses.
  const prevDisabled = `${y}-${String(m + 1).padStart(2, '0')}-01` <= from.slice(0, 7) + '-01';
  const nextDisabled = `${y}-${String(m + 1).padStart(2, '0')}` >= to.slice(0, 7);

  return `
    <div class="bk-cal-legend">
      <span class="lg-item"><span class="lg-swatch avail" aria-hidden="true">●</span>Disponível</span>
      <span class="lg-item"><span class="lg-swatch full" aria-hidden="true">L</span>Lotado</span>
      <span class="lg-item"><span class="lg-swatch closed" aria-hidden="true">F</span>Fechado</span>
      <span class="lg-item"><span class="lg-swatch unavail" aria-hidden="true">I</span>Indisponível</span>
    </div>
    <div class="bk-month-nav">
      <button type="button" id="calPrevBtn" aria-label="Mês anterior" ${prevDisabled ? 'disabled' : ''}>${ICONS.chevronLeft}</button>
      <span class="mn-label">${MONTHS_PT[m]} de ${y}</span>
      <button type="button" id="calNextBtn" aria-label="Próximo mês" ${nextDisabled ? 'disabled' : ''}>${ICONS.chevronRight}</button>
    </div>
    <div class="bk-month-grid">
      ${DOW_SHORT.map(d => `<div class="mg-dow" aria-hidden="true">${d}</div>`).join('')}
      ${cells}
    </div>
    <div class="bk-cal-feedback${state.calFeedback ? ' is-visible' : ''}" role="status">${esc(state.calFeedback)}</div>`;
}

function dayFeedbackText(status, iso) {
  if (status === 'full') return `Sem horários disponíveis em ${fmtDayShort(iso)}.`;
  if (status === 'closed') return 'O salão não abre neste dia.';
  if (status === 'unavailable') return 'A profissional escolhida não atende neste dia.';
  return '';
}

function bindCalendar() {
  const prev = document.getElementById('calPrevBtn');
  const next = document.getElementById('calNextBtn');
  if (prev && !prev.disabled) prev.addEventListener('click', () => stepMonth(-1));
  if (next && !next.disabled) next.addEventListener('click', () => stepMonth(1));
  document.querySelectorAll('[data-cal-day]').forEach(btn => {
    btn.addEventListener('click', () => {
      const st = btn.dataset.calStatus;
      const iso = btn.dataset.calDay;
      if (st !== 'available') {
        // Dia indisponível dá retorno contextual em vez de simplesmente
        // não responder ao toque.
        state.calFeedback = dayFeedbackText(st, iso);
        renderStepBody();
        return;
      }
      selectDate(iso);
      closeCalendar();
    });
  });
}

function stepMonth(delta) {
  let { y, m } = state.calendarMonth;
  m += delta;
  if (m < 0) { m = 11; y--; } else if (m > 11) { m = 0; y++; }
  state.calendarMonth = { y, m };
  state.calFeedback = '';
  renderStepBody();
}

// ── STEP 4: SEUS DADOS ───────────────────────────────────────
function escAttr(s) { return String(s ?? '').replace(/"/g, '&quot;'); }

// O erro do commit acompanha a cliente até a etapa onde ela pode resolvê-lo.
function commitErrorBanner(forStep) {
  if (!state.commitError || state.commitError.step !== forStep) return '';
  return `<div class="bk-commit-error" role="alert">${esc(state.commitError.msg)}</div>`;
}

// Copy voltada à cliente ("Digite seu nome."), nunca à operação do salão.
function validateForm() {
  const e = {};
  if (!state.form.name || state.form.name.trim().length < 2) e.name = 'Digite seu nome.';
  if ((state.form.phone || '').replace(/\D/g, '').length < 9) e.phone = 'Digite um telefone válido.';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.form.email || '')) e.email = 'Digite um e-mail válido.';
  return e;
}
function formIsValid() { return Object.keys(validateForm()).length === 0; }

function renderStepData() {
  const errors = validateForm();
  // Erro só aparece depois que a cliente saiu do campo ou tentou avançar —
  // não se acusa erro em campo que ela ainda nem terminou de preencher.
  const show = f => state.formValidated || state.formTouched[f];
  const field = (id, key, label, type, autocomplete, placeholder, extra) => `
    <div class="bk-field${errors[key] && show(key) ? ' has-error' : ''}">
      <label for="${id}">${label}</label>
      <input id="${id}" type="${type}" autocomplete="${autocomplete}" placeholder="${placeholder}"
        value="${escAttr(state.form[key])}" ${extra || ''}
        ${errors[key] && show(key) ? `aria-invalid="true" aria-describedby="${id}Err"` : ''}>
      <div class="bk-error-msg" id="${id}Err">${errors[key] || ''}</div>
    </div>`;

  return `
    <h1 class="bk-title">Seus dados</h1>
    <div class="bk-title-note">Pra confirmar o agendamento com você</div>
    ${commitErrorBanner('data')}
    ${field('fName', 'name', 'Nome', 'text', 'name', 'Seu nome')}
    ${field('fPhone', 'phone', 'Telefone', 'tel', 'tel', '+353 87 123 4567', 'inputmode="tel"')}
    ${field('fEmail', 'email', 'E-mail', 'email', 'email', 'seu@email.com', 'inputmode="email"')}
    <div class="bk-field">
      <label for="fNotes">Observações <span class="bk-field-optional-tag">(opcional)</span></label>
      <textarea id="fNotes" placeholder="Algo que gostaria que o salão soubesse?">${esc(state.form.notes)}</textarea>
    </div>`;
}

function bindStepData() {
  const map = { fName: 'name', fPhone: 'phone', fEmail: 'email', fNotes: 'notes' };
  Object.keys(map).forEach(id => {
    const input = document.getElementById(id);
    if (!input) return;
    // Digitação NÃO re-renderiza: reescrever o innerHTML a cada tecla mataria o
    // foco e a posição do cursor (mesma armadilha da busca de Clientes).
    input.addEventListener('input', () => { state.form[map[id]] = input.value; renderCTA(); });
    input.addEventListener('blur', () => {
      if (map[id] !== 'notes') { state.formTouched[map[id]] = true; renderStepBody(); }
    });
  });
}

// ── STEP 5: REVISÃO ──────────────────────────────────────────
function serviceRowsHtml(withAlter) {
  const svcs = selectedServices();
  const n = svcs.length;
  const label = n > 1 ? `${n} serviços` : (svcs[0] ? svcs[0].name : '—');
  let html = `
    <div class="bk-summary-row">
      <span class="sr-label">Serviço${n > 1 ? 's' : ''}</span>
      <span class="sr-value">${esc(label)}</span>
      ${withAlter ? '<button type="button" class="sr-alter" data-alter="service">Alterar</button>' : ''}
    </div>`;
  if (n > 1) {
    html += `<div class="bk-svc-review-list">${svcs.map(s => `
      <div class="bk-svc-review-item"><span class="sri-name">${esc(s.name)}</span><span class="sri-price">${esc(formatPrice(s))}</span></div>`).join('')}</div>`;
  }
  return html;
}

function renderConflictBlock() {
  const alts = state.conflict.alternatives;
  return `
    <div class="bk-conflict" role="alert">
      <div class="bk-conflict-icon">${ICONS.warn}</div>
      <div class="bk-conflict-title">Esse horário acabou de ser reservado.</div>
      <div class="bk-conflict-sub">Seus dados foram mantidos. Escolha outro horário para concluir o agendamento.</div>
      ${alts.length ? `<div class="bk-alt-list">${alts.map(a => `
        <button type="button" class="bk-alt-row" data-alt-date="${a.iso}" data-alt-time="${a.time}">
          <span><span class="alt-time">${a.time}</span><span class="alt-day">${esc(fmtDayShort(a.iso))}</span></span>
          <span class="alt-go">Usar horário</span>
        </button>`).join('')}</div>` : `
        <p class="bk-conflict-sub">Não encontramos outro horário próximo automaticamente.</p>`}
      <button type="button" class="bk-conflict-more" id="conflictMoreBtn">Ver mais horários</button>
    </div>`;
}

function renderStepReview() {
  // Sem data/horário não há o que revisar. Só acontece se um erro de commit
  // tiver invalidado a escolha; melhor devolver a cliente ao passo que resolve
  // do que renderizar um resumo pela metade.
  if (!state.selectedDateIso || !state.selectedTime) {
    setTimeout(() => goTo('datetime'), 0);
    return `<h1 class="bk-title">Revise seu agendamento</h1><p class="bk-block-text">Escolha um horário para continuar.</p>`;
  }
  const st = state.resolvedStaffId ? staffById(state.resolvedStaffId) : null;
  const showPolicyErr = state.policyTouched && !state.policyAccepted;
  const varies = anySelectedPriceVaries();

  // Conflito substitui o resumo: a cliente precisa resolver o horário antes de
  // qualquer outra coisa, e o botão de confirmar deixa de fazer sentido.
  if (state.conflict) {
    return `<h1 class="bk-title">Revise seu agendamento</h1>${renderConflictBlock()}`;
  }

  return `
    <h1 class="bk-title">Revise seu agendamento</h1>
    <div class="bk-title-note">Confira antes de confirmar</div>
    ${state.commitError ? `<div class="bk-commit-error" role="alert">${esc(state.commitError.msg)}</div>` : ''}
    <div class="bk-summary">
      ${serviceRowsHtml(true)}
      <div class="bk-summary-row"><span class="sr-label">Profissional</span>
        <span class="sr-value">${st ? esc(st.name) : '—'}</span>
        ${eligibleStaff().length > 1 ? '<button type="button" class="sr-alter" data-alter="professional">Alterar</button>' : ''}</div>
      <div class="bk-summary-row"><span class="sr-label">Data</span>
        <span class="sr-value">${esc(fmtDayShort(state.selectedDateIso))}</span>
        <button type="button" class="sr-alter" data-alter="datetime">Alterar</button></div>
      <div class="bk-summary-row"><span class="sr-label">Horário</span>
        <span class="sr-value">${esc(state.selectedTime)}</span>
        <button type="button" class="sr-alter" data-alter="datetime">Alterar</button></div>
      <div class="bk-summary-row"><span class="sr-label">Duração</span>
        <span class="sr-value">${totalDurationMinutes()} min</span></div>
      <div class="bk-summary-row total"><span class="sr-label">Total</span>
        <span class="sr-value">${esc(formatMoney(totalPrice()))}${varies ? '*' : ''}</span></div>
    </div>
    ${varies ? '<p class="price-disclaimer" style="margin-top:-8px">*valor varia de acordo com o cabelo e é confirmado após avaliação presencial</p>' : ''}

    <div class="bk-block">
      <div class="bk-block-title">Política de cancelamento</div>
      <div class="bk-block-text">${esc(state.policy ? state.policy.summary : '')}</div>
      <button type="button" class="bk-block-link" id="policyLinkBtn">Ver política completa</button>
      <label class="bk-consent-row${showPolicyErr ? ' has-error' : ''}">
        <input type="checkbox" id="policyCheck" ${state.policyAccepted ? 'checked' : ''}
          ${showPolicyErr ? 'aria-invalid="true"' : ''}>
        <span>Li e concordo com a política de cancelamento.</span>
      </label>
    </div>`;
}

function bindStepReview() {
  if (state.conflict) {
    document.querySelectorAll('[data-alt-date]').forEach(row => {
      row.addEventListener('click', () => {
        state.selectedDateIso = row.dataset.altDate;
        state.selectedTime = row.dataset.altTime;
        // "Qualquer profissional" é resolvida de novo contra o slot NOVO.
        state.resolvedStaffId = resolveStaffForSlot(slotAt(state.selectedDateIso, state.selectedTime));
        state.conflict = null;
        renderStepBody(); renderCTA();
      });
    });
    document.getElementById('conflictMoreBtn').addEventListener('click', () => goTo('datetime'));
    return;
  }
  document.querySelectorAll('[data-alter]').forEach(btn => {
    btn.addEventListener('click', () => goTo(btn.dataset.alter));
  });
  document.getElementById('policyLinkBtn').addEventListener('click', () => openPolicy());
  const chk = document.getElementById('policyCheck');
  chk.addEventListener('change', () => {
    state.policyAccepted = chk.checked;
    state.policyTouched = true;
    renderStepBody(); renderCTA();
  });
}

// ── POLÍTICA COMPLETA (subview full-screen, não BottomSheet) ─
function openPolicy() {
  state.calReturnFocusId = 'policyLinkBtn';
  state.subview = 'policy';
  renderAll();
}
function closePolicy() {
  state.subview = null;
  renderAll();
  const back = document.getElementById(state.calReturnFocusId);
  if (back) back.focus();
  state.calReturnFocusId = null;
}
function renderPolicyFull() {
  const body = state.policy ? state.policy.body : '';
  return `<div class="bk-block-text">${body.split(/\n{2,}/).map(p => `<p>${esc(p)}</p>`).join('')}</div>`;
}

// ── SUCESSO ──────────────────────────────────────────────────
// Tudo aqui vem da RESPOSTA DO SERVIDOR, não do estado do browser: totais,
// profissional efetivamente atribuída, horários e referência.
function renderSuccess() {
  const b = state.booking || {};
  const svcs = b.services || [];
  const staffName = b.staff && b.staff.name ? b.staff.name : '—';
  const startsIso = b.starts_at ? b.starts_at.slice(0, 10) : state.selectedDateIso;
  const hora = b.starts_at ? salonClock(new Date(b.starts_at)) : (state.selectedTime || '—');

  // Copy do e-mail é condicionada ao que REALMENTE aconteceu — nunca prometer
  // envio que não se sabe se saiu. email_success=null (replay que não reenviou)
  // é tratado como "não sei", mesma copy de fallback que false.
  const emailNote = state.emailSuccess === true
    ? 'Você receberá os detalhes deste agendamento por e-mail.'
    : `Guarde esta referência: <strong>${esc(b.booking_reference || '')}</strong>.`;

  // "Gerenciar agendamento" só funciona se este payload específico trouxe o
  // token — num replay excepcional (resposta original perdida) ele vem null,
  // e não existe forma segura de reconstruí-lo (booking_reference não é auth).
  const manageAction = state.manageToken
    ? `<button type="button" class="bk-btn-ghost" id="manageBtn">Gerenciar agendamento</button>`
    : (state.emailSuccess
        ? `<p class="bk-state-text" style="text-align:center;color:var(--color-neutral-600);font-size:12px">Use o link enviado por e-mail para gerenciar este agendamento.</p>`
        : '');

  return `
    <div class="bk-success-wrap">
      <div class="bk-success-icon">${ICONS.check}</div>
      <h1 class="bk-success-title">Agendamento confirmado</h1>
      <div class="bk-success-email-note">${emailNote}</div>
      <div class="bk-success-card">
        <div class="bk-summary-row">
          <span class="sr-label">Serviço${svcs.length > 1 ? 's' : ''}</span>
          <span class="sr-value">${svcs.length > 1 ? svcs.length + ' serviços' : esc((svcs[0] || {}).name || '—')}</span>
        </div>
        ${svcs.length > 1 ? `<div class="bk-svc-review-list">${svcs.map(s => `
          <div class="bk-svc-review-item"><span class="sri-name">${esc(s.name)}</span><span class="sri-price">${esc(formatMoney(s.price))}</span></div>`).join('')}</div>` : ''}
        <div class="bk-summary-row"><span class="sr-label">Profissional</span><span class="sr-value">${esc(staffName)}</span></div>
        <div class="bk-summary-row"><span class="sr-label">Data</span><span class="sr-value">${esc(fmtDayShort(startsIso))}</span></div>
        <div class="bk-summary-row"><span class="sr-label">Horário</span><span class="sr-value">${esc(hora)}</span></div>
        <div class="bk-summary-row"><span class="sr-label">Duração</span><span class="sr-value">${b.total_duration_minutes || 0} min</span></div>
        <div class="bk-summary-row total"><span class="sr-label">Total</span><span class="sr-value">${esc(formatMoney(b.total_price || 0))}</span></div>
      </div>
      <div class="bk-success-actions">
        <button type="button" class="bk-btn-secondary" id="addCalBtn">Adicionar ao calendário</button>
        ${manageAction}
        <button type="button" class="bk-btn-ghost" id="backHomeBtn">Voltar ao início</button>
      </div>
      <div class="bk-booking-ref">Agendamento ${esc(b.booking_reference || '')}</div>
    </div>`;
}

// .ics gerado no cliente a partir da resposta do servidor. Sem rede, sem
// dependência nova e sem token: o arquivo só carrega o que a cliente já vê.
function downloadIcs() {
  const b = state.booking;
  if (!b) return;
  const stamp = d => new Date(d).toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  const nomes = (b.services || []).map(s => s.name).join(' + ');
  const lines = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Orenzi Atelier//Booking//PT',
    'BEGIN:VEVENT',
    `UID:${b.booking_reference}@orenzi`,
    `DTSTAMP:${stamp(Date.now())}`,
    `DTSTART:${stamp(b.starts_at)}`,
    `DTEND:${stamp(b.ends_at)}`,
    `SUMMARY:Orenzi Ateliê — ${nomes}`,
    `DESCRIPTION:Agendamento ${b.booking_reference} com ${b.staff ? b.staff.name : ''}`,
    'END:VEVENT', 'END:VCALENDAR',
  ];
  const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `orenzi-${b.booking_reference}.ics`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

function bindSuccess() {
  document.getElementById('addCalBtn').addEventListener('click', downloadIcs);
  const manageBtn = document.getElementById('manageBtn');
  if (manageBtn) {
    manageBtn.addEventListener('click', () => {
      // Token bruto só existe em memória (state.manageToken) até este ponto —
      // nunca gravado em storage nem logado. Vai codificado na querystring
      // porque é assim que o magic link precisa carregá-lo até gerenciar.html.
      location.href = 'gerenciar.html?t=' + encodeURIComponent(state.manageToken);
    });
  }
  document.getElementById('backHomeBtn').addEventListener('click', resetFlow);
}

// Reinício limpo: nada da cliente anterior pode vazar para a próxima pessoa
// que abrir a página no mesmo aparelho.
function resetFlow() {
  state.step = 'service';
  state.selectedServiceIds = [];
  state.categoryFilter = 'all';
  state.servicesScrollTop = 0;
  state.form = { name: '', phone: '', email: '', notes: '' };
  state.formTouched = {}; state.formValidated = false;
  state.policyAccepted = false; state.policyTouched = false;
  state.commitError = null; state.conflict = null; state.booking = null;
  state.createRequestKey = null; state.manageToken = null; state.emailSuccess = null;
  state.subview = null;
  invalidateDownstreamSelections();
  renderAll();
  document.getElementById('main').scrollTop = 0;
}

function renderStepBody() {
  const steps = document.getElementById('steps');
  if (state.subview === 'calendar') { steps.innerHTML = renderCalendar(); bindCalendar(); return; }
  if (state.subview === 'policy') { steps.innerHTML = renderPolicyFull(); return; }

  if (state.step === 'service') steps.innerHTML = renderStepServices();
  else if (state.step === 'professional') steps.innerHTML = renderStepProfessional();
  else if (state.step === 'datetime') steps.innerHTML = renderStepDatetime();
  else if (state.step === 'data') steps.innerHTML = renderStepData();
  else if (state.step === 'review') steps.innerHTML = renderStepReview();
  else if (state.step === 'success') steps.innerHTML = renderSuccess();

  steps.classList.remove('bk-step-enter');
  void steps.offsetWidth;   // reflow síncrono: elemento novo não anima sozinho
  steps.classList.add('bk-step-enter');

  if (state.step === 'service') bindStepServices();
  else if (state.step === 'professional') bindStepProfessional();
  else if (state.step === 'datetime') bindStepDatetime();
  else if (state.step === 'data') bindStepData();
  else if (state.step === 'review') bindStepReview();
  else if (state.step === 'success') bindSuccess();
}

// ── CTA ──────────────────────────────────────────────────────
function renderCTA() {
  const wrap = document.getElementById('ctaWrap');

  // No calendário quem conclui é o toque no dia; sem CTA competindo.
  if (state.subview === 'calendar') { wrap.innerHTML = ''; return; }

  if (state.subview === 'policy') {
    wrap.innerHTML = `<button type="button" class="bk-cta" id="ctaBtn">Voltar para a revisão</button>`;
    document.getElementById('ctaBtn').addEventListener('click', closePolicy);
    return;
  }

  // Sucesso: as ações vivem no corpo da tela, não no CTA fixo.
  if (state.step === 'success') { wrap.innerHTML = ''; return; }

  if (state.step === 'data') {
    const ok = formIsValid();
    wrap.innerHTML = `<button type="button" class="bk-cta" id="ctaBtn" ${ok ? '' : 'disabled'}>Continuar</button>`;
    if (ok) document.getElementById('ctaBtn').addEventListener('click', () => goTo('review'));
    return;
  }

  if (state.step === 'review') {
    if (state.conflict) {
      // Em conflito não há o que confirmar: a escolha volta a ser o horário.
      wrap.innerHTML = '';
      return;
    }
    const pronto = state.policyAccepted && formIsValid() && !!state.selectedTime;
    const label = state.committing ? 'Confirmando…' : 'Confirmar agendamento';
    wrap.innerHTML = `<button type="button" class="bk-cta" id="ctaBtn"
      ${(!pronto || state.committing) ? 'disabled' : ''} ${state.committing ? 'aria-busy="true"' : ''}>${label}</button>`;
    if (pronto && !state.committing) {
      document.getElementById('ctaBtn').addEventListener('click', () => {
        state.policyTouched = true;
        if (!state.policyAccepted) { renderStepBody(); renderCTA(); return; }
        commitBooking();
      });
    }
    return;
  }

  if (state.step === 'professional') {
    const pool = eligibleStaff();
    const disabled = !pool.length || !state.staffPref;
    wrap.innerHTML = `<button type="button" class="bk-cta" id="ctaBtn" ${disabled ? 'disabled' : ''}>${
      !pool.length ? 'Nenhum profissional disponível' : 'Continuar'}</button>`;
    if (!disabled) document.getElementById('ctaBtn').addEventListener('click', () => goTo('datetime'));
    return;
  }

  if (state.step === 'datetime') {
    const av = state.availability;
    const ready = !av.loading && !av.error && !!state.selectedDateIso && !!state.selectedTime;
    const label = av.loading ? 'Carregando horários…' : (ready ? 'Continuar' : 'Escolha um horário');
    wrap.innerHTML = `<button type="button" class="bk-cta" id="ctaBtn" ${ready ? '' : 'disabled'}>${label}</button>`;
    if (ready) document.getElementById('ctaBtn').addEventListener('click', () => goTo('data'));
    return;
  }


  if (state.loading || state.error || !state.services.length) {
    wrap.innerHTML = `<button type="button" class="bk-cta" id="ctaBtn" disabled>Escolha um serviço</button>`;
    return;
  }

  const n = state.selectedServiceIds.length;
  if (n === 0) {
    wrap.innerHTML = `<button type="button" class="bk-cta" id="ctaBtn" disabled>Escolha um serviço</button>`;
    return;
  }

  // Rótulo agregado: nunca "Continuar com <serviço>", porque agora pode haver
  // mais de um. O total é só apresentação — o servidor recalcula na criação.
  const price = `${formatMoney(totalPrice())}${anySelectedPriceVaries() ? '*' : ''}`;
  const sub = `${totalDurationMinutes()} min${n > 1 ? ` · ${n} serviços` : ''}`;
  wrap.innerHTML = `
    <div class="bk-cta-context">
      <span class="cc-text">
        <span class="cc-price">${price}</span>
        <span class="cc-sub">${sub}</span>
      </span>
      <button type="button" class="bk-cta" id="ctaBtn">Continuar</button>
    </div>`;
  // Só pula para data/horário quando há exatamente uma elegível. Com zero, o
  // destino é a tela de profissional — que nesse caso mostra o estado de
  // "nenhum profissional para esta combinação" em vez de deixar seguir.
  document.getElementById('ctaBtn').addEventListener('click', () =>
    goTo(eligibleStaff().length === 1 ? 'datetime' : 'professional'));
}

// ── INIT ─────────────────────────────────────────────────────
(async function init() {
  logBookingVisit();
  renderAll();
  // Serviços, catálogo de profissionais e política corrente em paralelo: a
  // interseção de elegibilidade precisa dos dois primeiros, e a política tem
  // que estar carregada antes da Revisão.
  await Promise.all([loadServices(), loadStaffCatalog(), loadPolicy()]);
  renderAll();
})();
</script>
</body>
</html>
