// ── Etapa 4 · Horário ──────────────────────────────────────────
// Mensagens de apresentação — ainda não refletem inteligência real (PR
// combinado com o Raphael: placeholders por enquanto). Duas exceções
// honestas: o horário que encosta exatamente no fim de outro atendimento
// (fecha um buraco na agenda) ganha "Recomendado" de verdade; no modo
// contextual (opts.contextualFirst), quem ganha é o primeiro horário da
// lista, porque a lista já foi filtrada pro intervalo clicado — ele É o
// início do espaço livre, não decoração.
function wizSlotMessages(slots, staffId, dateStr, durationMin, opts) {
  const contextualFirst = !!(opts && opts.contextualFirst);
  const busy = busyBlocksForStaffOnDate(staffId, new Date(`${dateStr}T00:00:00`));
  const busyEnds = busy.map(([, be]) => be.getTime());
  let recommendedAssigned = false;
  return slots.map((t, i) => {
    if (contextualFirst && i === 0) {
      recommendedAssigned = true;
      return { time: t, recommended: true, message: 'Usa o início do horário livre.' };
    }
    const [hh, mm] = t.split(':').map(Number);
    const slotStart = new Date(`${dateStr}T00:00:00`);
    slotStart.setHours(hh, mm, 0, 0);
    const fillsGap = busyEnds.some(end => Math.abs(end - slotStart.getTime()) < 60000);
    if (fillsGap && !recommendedAssigned) {
      recommendedAssigned = true;
      return { time: t, recommended: true, message: 'Aproveita um intervalo livre sem aumentar sua jornada.' };
    }
    if (i === 0) return { time: t, recommended: false, message: 'Bom encaixe pela manhã' };
    if (i === slots.length - 1) return { time: t, recommended: false, message: 'Último horário disponível' };
    return { time: t, recommended: false, message: 'Agenda tranquila' };
  });
}
// Restringe os horários (já calculados por computeAvailableSlots — regras
// de negócio intactas) ao buraco real clicado na Agenda. Puro filtro por
// cima do resultado, nunca recálculo de disponibilidade.
function wizFilterSlotsToInterval(rawSlots, dateStr, durationMin) {
  if (!wizIsContextual() || !wiz.slotStart || !wiz.slotEnd) return rawSlots;
  return rawSlots.filter(t => {
    const [hh, mm] = t.split(':').map(Number);
    const slotStart = new Date(`${dateStr}T00:00:00`);
    slotStart.setHours(hh, mm, 0, 0);
    const slotEnd = new Date(slotStart.getTime() + durationMin * 60000);
    return slotStart.getTime() >= wiz.slotStart && slotEnd.getTime() <= wiz.slotEnd;
  });
}
function wizDayPreviewHtml(staffId, durationMin) {
  const busy = busyBlocksForStaffOnDate(staffId, new Date(`${wiz.date}T00:00:00`));
  const totalMin = (CLOSE_HOUR - OPEN_HOUR) * 60;
  const pct = (mins) => `${Math.max(0, Math.min(100, (mins / totalMin) * 100))}%`;
  const busyBars = busy.map(([bs, be]) => {
    const startMin = (bs.getHours() * 60 + bs.getMinutes()) - OPEN_HOUR * 60;
    const endMin = (be.getHours() * 60 + be.getMinutes()) - OPEN_HOUR * 60;
    return `<div class="o-wizard-daypreview-busy" style="left:${pct(startMin)};width:${pct(endMin - startMin)}"></div>`;
  }).join('');
  let markHtml = '';
  if (wiz.time) {
    const [hh, mm] = wiz.time.split(':').map(Number);
    const startMin = (hh * 60 + mm) - OPEN_HOUR * 60;
    markHtml = `<div class="o-wizard-daypreview-mark" style="left:${pct(startMin)}"></div>`;
  }
  return `
    <div class="o-wizard-daypreview">
      <div class="o-wizard-daypreview-track">${busyBars}${markHtml}</div>
      <div class="o-wizard-daypreview-labels"><span>${OPEN_HOUR}h</span><span>${CLOSE_HOUR}h</span></div>
    </div>
  `;
}
function wizStepTime() {
  return { title: 'Horários disponíveis', subtitle: '', bodyHtml: `<div id="wizSlotsWrap"></div>`, footHtml: '' };
}
function wizBindStepTime() {
  wizRenderSlots();
}
function wizRenderSlots() {
  const wrap = document.getElementById('wizSlotsWrap');
  if (!wrap) return;
  const service = wizService();
  const staffId = wizStaffId();
  if (!service || !staffId || !wiz.date) {
    wrap.innerHTML = `<div class="o-wizard-empty">Volte e escolha o serviço e a data.</div>`;
    return;
  }
  const [y, m, d] = wiz.date.split('-').map(Number);
  const dateLabelRaw = new Date(y, m - 1, d).toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  const dateLabel = dateLabelRaw.charAt(0).toUpperCase() + dateLabelRaw.slice(1);

  const daySlots = computeAvailableSlots(staffId, wiz.date, service.duration_minutes);
  const contextual = wizIsContextual() && !!wiz.slotStart && !!wiz.slotEnd;
  const rawSlots = contextual ? wizFilterSlotsToInterval(daySlots, wiz.date, service.duration_minutes) : daySlots;
  if (!wiz.time && wiz.preferredTime && rawSlots.includes(wiz.preferredTime)) wiz.time = wiz.preferredTime;

  if (!rawSlots.length) {
    if (!contextual) {
      wrap.innerHTML = `
        <div class="o-wizard-section-label">${dateLabel}</div>
        <div class="o-wizard-empty">Sem horário livre nesse dia. Volte e escolha outra data.</div>
      `;
      return;
    }
    // Modo contextual não tem etapa Data pra "voltar" — a saída é sempre uma
    // ação explícita. `fits` distingue "não cabe neste intervalo, mas cabe
    // em outro horário do dia" de "não sobrou nada nesse dia".
    const fits = daySlots.length > 0;
    wrap.innerHTML = `
      <div class="o-wizard-section-label">${dateLabel}</div>
      <div class="o-wizard-empty">${fits ? 'Este serviço não cabe neste intervalo.' : 'Sem horário livre nesse dia.'}</div>
      ${fits ? `<button class="o-btn o-btn-secondary" id="wizSeeOtherTimesBtn" type="button" style="margin-top:var(--space-3)">Ver outros horários neste dia</button>` : ''}
      <button class="o-btn o-btn-ghost" id="wizPickAnotherDateBtn" type="button" style="margin-top:${fits ? 'var(--space-2)' : 'var(--space-3)'}">Escolher outra data</button>
    `;
    if (fits) {
      document.getElementById('wizSeeOtherTimesBtn').onclick = () => {
        wiz.slotStart = null;
        wiz.slotEnd = null;
        // renderWizard(), não só wizRenderSlots(): o banner de contexto (fora
        // de #wizBody) mostra o intervalo, e precisa sumir a linha de hora
        // junto com a restrição.
        renderWizard();
      };
    }
    document.getElementById('wizPickAnotherDateBtn').onclick = wizSwitchToFullFlowAtDate;
    return;
  }

  const slots = wizSlotMessages(rawSlots, staffId, wiz.date, service.duration_minutes, { contextualFirst: contextual });

  wrap.innerHTML = `
    <div class="o-wizard-section-label">${dateLabel}</div>
    ${slots.map(s => `
      <button class="o-card o-card-interactive o-wizard-slot-card ${wiz.time === s.time ? 'is-selected' : ''}" data-time="${s.time}" aria-selected="${wiz.time === s.time}">
        ${s.recommended ? `<div class="o-badge o-badge-attention o-wizard-slot-badge">${ICONS.sparkle} Recomendado</div>` : ''}
        <div class="o-wizard-slot-top">
          <span class="o-wizard-slot-time">${s.time}</span>
          <span class="o-wizard-slot-check" aria-hidden="true">${ICONS.check}</span>
        </div>
        <div class="o-wizard-slot-msg">${s.message}</div>
      </button>
    `).join('')}
    ${wizDayPreviewHtml(staffId, service.duration_minutes)}
  `;

  wrap.querySelectorAll('.o-wizard-slot-card[data-time]').forEach(btn => {
    btn.onclick = () => {
      wiz.time = btn.dataset.time;
      wizRenderSlots();
      setTimeout(() => wizGoToStep(wizIsContextual() ? 4 : 5), prefersReducedMotion() ? 0 : 200);
    };
  });
}

// ── Etapa 5 · Confirmação ──────────────────────────────────────
function wizStepConfirm() {
  const c = wizClient();
  const s = wizService();
  const staff = wizStaff();
  if (!c || !s || !wiz.date || !wiz.time) {
    return {
      title: 'Confirmar agendamento',
      subtitle: '',
      bodyHtml: `<div class="o-wizard-empty">Algo ficou incompleto. Volte e revise as etapas anteriores.</div>`,
      footHtml: '',
    };
  }
  const [y, m, d] = wiz.date.split('-').map(Number);
  const dateLabelRaw = new Date(y, m - 1, d).toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  const dateLabel = dateLabelRaw.charAt(0).toUpperCase() + dateLabelRaw.slice(1);

  const rows = [
    { icon: ICONS.users, label: 'Cliente', value: `${c.name}${c.phone ? ` · ${c.phone}` : ''}` },
    { icon: ICONS.tag, label: 'Serviço', value: `${s.name}${staff ? ` · ${staff.name}` : ''}` },
    { icon: ICONS.calendar, label: 'Data', value: dateLabel },
    { icon: ICONS.clock, label: 'Horário', value: wiz.time },
    { icon: ICONS.target, label: 'Duração', value: `${s.duration_minutes} min` },
    { icon: ICONS.money, label: 'Valor', value: `€${Number(s.price || 0).toFixed(0)}` },
  ];

  return {
    title: 'Confirmar agendamento',
    subtitle: 'Revise os detalhes antes de salvar',
    bodyHtml: `
      <div class="o-card" style="margin-top:var(--space-3)">
        ${rows.map(r => `
          <div class="o-wizard-summary-row">
            <span class="o-wizard-summary-icon" aria-hidden="true">${r.icon}</span>
            <div>
              <div class="o-wizard-summary-label">${r.label}</div>
              <div class="o-wizard-summary-value">${r.value}</div>
            </div>
          </div>
        `).join('')}
      </div>
      <div class="o-wizard-notice">
        ${ICONS.chat}
        <span>A cliente receberá a confirmação automaticamente.</span>
      </div>
      ${wiz.error ? `<div class="login-error" style="margin-top:var(--space-3)">${wiz.error}</div>` : ''}
    `,
    footHtml: `<button class="o-btn o-btn-primary" id="wizSaveBtn">Salvar agendamento</button>`,
  };
}
function wizBindStepConfirm() {
  const btn = document.getElementById('wizSaveBtn');
  if (btn) btn.onclick = wizSaveAppointment;
}
async function wizSaveAppointment() {
  const btn = document.getElementById('wizSaveBtn');
  const c = wizClient();
  const s = wizService();
  const staffId = wizStaffId();
  if (!c || !s || !staffId || !wiz.date || !wiz.time) {
    wiz.error = 'Algo ficou incompleto. Volte e revise as etapas anteriores.';
    paintWizStep();
    return;
  }
  orenziUI.setButtonBusy(btn, 'Agendando…');
  try {
    const [hh, mm] = wiz.time.split(':').map(Number);
    const startsAt = new Date(`${wiz.date}T00:00:00`);
    startsAt.setHours(hh, mm, 0, 0);
    const endsAt = new Date(startsAt.getTime() + s.duration_minutes * 60000);

    const { data: createdAppt, error: apptErr } = await sb.from('appointments').insert({
      client_id: c.id,
      staff_id: staffId,
      service_id: s.id,
      starts_at: startsAt.toISOString(),
      ends_at: endsAt.toISOString(),
      status: 'confirmed',
      source: 'manual',
    }).select('id').single();
    if (apptErr) throw apptErr;

    // Só anima a entrada se o agendamento cair no dia que a Agenda já está
    // mostrando — senão o bloco nasceria animado numa tela que o usuário
    // nem está vendo, e o efeito passaria em branco.
    if (createdAppt && sameDay(startsAt, state.agendaDate)) {
      state.enteringApptId = createdAppt.id;
    }

    await orenziUI.setButtonSuccess(btn, 'Agendado');
    closeModal();
    showToast('Agendamento criado');
    await loadAll();
  } catch (e) {
    console.error('appointments.insert (wizard)', e);
    wiz.error = 'Não foi possível agendar. Tente de novo.';
    paintWizStep();
  }
}

// O mesmo botão fixo serve duas abas — o que ele cadastra depende de onde
// está. A Agenda ganhou o próprio + na pílula do mês (#agendaAddBtn).
document.getElementById('fabNewAppt').onclick = () => {
  if (state.tab === 'clients') openNewClientSheet();
  else openStockFabSheet();
};

// "Hoje" vive na linha de controle da Agenda (#agendaTodayBtn), então o
// clique é reamarrado a cada renderAgenda() junto com prevWeek/nextWeek.
function goToToday() {
  const hoje = new Date();
  if (!sameDay(state.agendaDate, hoje)) {
    const direction = hoje > state.agendaDate ? 'forward' : 'back';
    state.agendaDate = hoje;
    renderAgendaTransition(direction);
    highlightCurrentTimeLine();
    return;
  }
  // Já é hoje: não tem o que deslizar, então o feedback é recentralizar a
  // grade no agora com scroll animado + destacar a linha — senão o toque
  // no botão pareceria não ter feito nada.
  const el = document.getElementById('timelineEl');
  const info = currentTimeInfo();
  if (el && info) scrollTimelineTo(el, info.top - HOUR_HEIGHT * 1.5, { animate: true });
  highlightCurrentTimeLine();
}

// A cada 30s, se a agenda de hoje estiver na tela, reposiciona a linha do
// horário atual sem re-renderizar a tela inteira.
setInterval(updateCurrentTimeLine, 30000);

// ── SPLASH — CICLO DE VIDA (15/08/2026) ───────────────────────
// A splash cobre o carregamento REAL e sai quando o app está pronto, não
// quando um cronômetro estoura. Antes eram setTimeout(1300) + fade de
// 500ms: 1,8s fixos, que SOBRAVAM em rede boa (medido: DOMContentLoaded aos
// 82ms no localhost) e FALTAVAM em rede ruim — a splash saía e revelava um
// #app vazio, porque `render()` só roda depois de loadAll().
//
// Três emissores chamam markReady(); o primeiro vence:
//   READY_LOGIN   — sem sessão, renderLogin() já desenhou
//   READY_PANEL   — com sessão, loadAll() terminou e render() desenhou
//   READY_TIMEOUT — rede de segurança, SPLASH_TETO_MS desde a navegação
//
// A saída acontece em max(piso de branding, appReady). O piso conta a partir
// do frame em que o WORDMARK ficou visível, não do início: o wordmark espera
// Jost (até SPLASH_FONTE_MS), e um piso contado do início encurtaria a marca
// justamente quando a fonte demora.
//
// ── O PISO É DE BRANDING, NÃO DE LOADING (ajuste de 15/08/2026) ──
// A primeira versão usava 400ms, só pra evitar piscada. Ficou rápida demais:
// `ORENZI / ATELIER` não dava tempo de ser lido. A intenção mudou — a splash
// agora é também um momento curto de marca. O piso subiu para
// SPLASH_BRANDING_MS e o ritmo é:
//
//   entrada do wordmark   ~340ms   (--splash-in, no CSS)
//   permanência legível   ~1760ms  (SPLASH_BRANDING_MS - entrada)
//   saída                  280ms   (--motion-route)
//   ────────────────────────────
//   total desde tW        ~2380ms, mais o tempo até a fonte resolver
//
// Isto NÃO é a volta do timer cego. O readiness continua sendo a condição de
// saída: sem markReady() a splash não sai por conta do piso. O piso só
// atrasa uma saída que já foi autorizada. Quem chega depois manda — em rede
// lenta é o app que dita, não o relógio.
const SPLASH_ENTRADA_MS  = 340;   // espelha --splash-in no CSS; mudar os dois juntos
// Passagem compartilhada para o Login (16/08/2026). Espelham
// --login-morph e --login-reveal-start no CSS; mudar os dois juntos.
const SPLASH_MORPH_MS      = 460;
const LOGIN_REVEAL_START_MS = 150;
const LOGIN_REVEAL_MS       = 280;  // = --motion-route
const LOGIN_STAGGER_MAX_MS  = 120;  // maior --reveal-delay do formulário
const SPLASH_BRANDING_MS = 2100;  // de tW até o INÍCIO da saída (entrada + permanência)
const SPLASH_TETO_MS     = 2500;  // desde a navegação (performance.now() é essa base)
const SPLASH_FONTE_MS    = 600;   // espera máxima por Jost antes de aceitar system-ui

const splashState = {
  done: false, ready: false, motivo: null,
  wordmarkAt: null, tetoId: null, saidaAgendada: false, pct: 0,
};

function splashReduzido() {
  return !!(window.orenziUI && orenziUI.prefersReducedMotion && orenziUI.prefersReducedMotion());
}

// Monotônica por contrato: a barra nunca anda pra trás. Em rede boa o app
// fica pronto ANTES de a fonte chegar, e sem esta guarda o 100% viraria 80%
// quando a marca aparecesse — progresso regredindo na cara de quem abre.
// `durMs` deixa a barra encher no tempo exato que falta pra saída, em vez de
// saltar e ficar cheia parada durante todo o piso de branding.
function splashProgresso(pct, durMs) {
  if (pct <= splashState.pct) return;
  splashState.pct = pct;
  const barra = document.getElementById('splashProgress');
  if (!barra || splashReduzido()) return;
  if (durMs != null) barra.style.transitionDuration = durMs + 'ms';
  barra.style.width = pct + '%';
}

// Revela o wordmark e ABRE o piso. Chamada quando Jost fica utilizável ou
// no teto de SPLASH_FONTE_MS — o que vier primeiro.
function splashRevelarMarca() {
  if (splashState.wordmarkAt !== null) return;
  splashState.wordmarkAt = performance.now();
  const mark = document.getElementById('splashMark');
  if (mark) mark.classList.add('is-in');
  splashProgresso(80);
  splashAgendarSaida();
}

// Idempotente de propósito: onAuthStateChange dispara SIGNED_IN durante o
// próprio boot do supabase-js e chamaria checkSession() outra vez. A splash
// não pode reabrir nem reagendar saída depois de já ter saído.
function markReady(motivo) {
  if (splashState.ready || splashState.done) return;
  splashState.ready = true;
  splashState.motivo = motivo;
  splashAgendarSaida();
}

// Chamada pelos dois lados (marca revelada / app pronto) porque a saída
// depende dos dois, e a ordem entre eles varia com a rede. `saidaAgendada`
// impede agendar duas vezes — o que não quebraria splashSair (idempotente)
// mas daria à barra duas durações de enchimento diferentes.
function splashAgendarSaida() {
  if (splashState.done || splashState.saidaAgendada) return;
  if (!splashState.ready || splashState.wordmarkAt === null) return;
  splashState.saidaAgendada = true;
  splashState.readyAt = performance.now();
  const decorrido = splashState.readyAt - splashState.wordmarkAt;
  const espera = Math.max(0, SPLASH_BRANDING_MS - decorrido);
  // Alvo absoluto desde tW, guardado pra diagnóstico: é o contrato do piso
  // ("a marca fica no ar até aqui"), independente de quanto o setTimeout
  // atrase na prática. Sem isto, medir o ritmo exige cronometrar de fora, e
  // aba em segundo plano agrupa timers em ~1s e falseia a medida.
  splashState.saidaEm = splashState.readyAt + espera;
  // A barra enche exatamente no instante da saída: quando ela chega ao fim,
  // a splash sai. Agora que o piso de branding costuma mandar no tempo
  // restante, é essa a leitura honesta de "quanto falta" — saltar pra 100%
  // e ficar parada dois segundos diria que acabou quando não acabou.
  splashProgresso(100, espera);
  setTimeout(splashSair, espera);
}

// Limpeza idempotente com três gatilhos (transitionend + rede de segurança
// por setTimeout + o próprio flag): sem composição de frames — aba em
// segundo plano — o transitionend nunca dispara e a splash ficaria presa
// por cima do app. Mesma armadilha já documentada em morphAvatar().
function splashSair() {
  if (splashState.done) return;
  splashState.done = true;
  if (splashState.tetoId) clearTimeout(splashState.tetoId);
  const appEl = document.getElementById('app');
  const splash = document.getElementById('splash');
  if (!splash) { if (appEl) appEl.removeAttribute('inert'); return; }
  // Destino Login: a splash não sai, ela VIRA a tela. Destino painel: o
  // fade de sempre, sem uma linha nova no caminho autenticado.
  const telaLogin = document.querySelector('.login-screen.is-preparing');
  if (telaLogin) { splashMorphParaLogin(splash, telaLogin, appEl); return; }
  if (appEl) appEl.removeAttribute('inert');
  const remover = () => { if (splash.parentNode) splash.remove(); };
  splash.addEventListener('transitionend', remover, { once: true });
  setTimeout(remover, 600);
  splash.classList.add('fade-out');
}

// ── Passagem compartilhada Splash → Login (16/08/2026) ────────
// FLIP com o elemento DO LOGIN: mede-se onde ele vai ficar, joga-se ele
// para onde a marca da splash está (sem transição), e solta-se. Assim o
// que anima já é o elemento definitivo — no fim não há troca de nó,
// nenhum "agora vale o outro", nenhum frame de duas marcas.
//
// Isto roda DEPOIS de a saída já ter sido autorizada (markReady + piso de
// branding). Nada aqui adianta, atrasa ou condiciona a saída: readiness,
// piso, teto e progresso continuam exatamente como estavam.
function splashMorphParaLogin(splash, tela, appEl) {
  const marcaLogin = tela.querySelector('.login-mark');
  const marcaSplash = splash.querySelector('.splash-mark');
  if (!marcaLogin || !marcaSplash) {
    // Sem um dos dois não há o que compartilhar: cai no fade de sempre.
    if (appEl) appEl.removeAttribute('inert');
    tela.classList.remove('is-preparing');
    splash.classList.add('fade-out');
    setTimeout(() => { if (splash.parentNode) splash.remove(); }, 600);
    return;
  }
  const reduzido = splashReduzido();
  const destino = marcaLogin.getBoundingClientRect();   // onde ela VAI ficar
  const origem = marcaSplash.getBoundingClientRect();   // onde ela ESTÁ
  splashState.morph = {
    origemY: Math.round(origem.top), destinoY: Math.round(destino.top),
    dy: Math.round(origem.top - destino.top), reduzido,
  };

  // Fundo da splash sai da frente; a barra some sozinha. A marca da splash
  // é apagada no MESMO frame em que a do Login assume o lugar dela.
  splash.classList.add('is-morphing');
  tela.classList.add('is-morphing');

  if (!reduzido) {
    const dx = origem.left - destino.left;
    const dy = origem.top - destino.top;
    marcaLogin.style.transition = 'none';
    marcaLogin.style.transform = `translate(${dx}px, ${dy}px)`;
    marcaLogin.getBoundingClientRect();   // reflow: fixa o ponto de partida
    marcaLogin.style.transition = '';
  }
  // Mesmo frame: o formulário começa a entrar por conta do transition-delay
  // do CSS (~1/3 do caminho da marca), não de um timer novo — timer em aba
  // de segundo plano é agrupado e desmontaria a sobreposição.
  tela.classList.add('is-revealing');
  marcaLogin.style.transform = '';

  // Limpeza idempotente, mesmas três redes da saída antiga: transitionend,
  // setTimeout de segurança e o próprio flag. Sem composição de frames o
  // transitionend não dispara — armadilha já documentada aqui.
  let feito = false;
  const encerrar = () => {
    if (feito) return;
    feito = true;
    // Aterramento antes de tirar as classes: numa aba sem composição de
    // frames as transições ficam congeladas onde estavam, e o CTA (o
    // último a entrar) poderia continuar invisível depois da limpeza.
    // Aqui elas já deveriam ter terminado — isto só garante o destino.
    const aterrar = el => { if (el && el.getAnimations) el.getAnimations().forEach(a => { try { a.finish(); } catch (e) {} }); };
    tela.querySelectorAll('[data-reveal]').forEach(aterrar);
    aterrar(marcaLogin);
    tela.classList.remove('is-preparing', 'is-morphing', 'is-revealing');
    marcaLogin.style.transform = '';
    marcaLogin.style.transition = '';
    if (splash.parentNode) splash.remove();
    // Só agora o Login aceita toque e teclado: antes disso ele estava
    // atravessando a tela. Nenhum campo é focado por conta própria.
    if (appEl) appEl.removeAttribute('inert');
    splashState.morphFimEm = performance.now();
  };
  // O gatilho é o CTA, não o wordmark: a marca chega aos 460ms, mas o
  // botão é o último a entrar (150 + 120 + 280 = 550ms). Fechar no fim do
  // movimento cortaria os últimos ~90ms do fade dele.
  const ultimo = tela.querySelector('#loginBtn') || marcaLogin;
  ultimo.addEventListener('transitionend', ev => {
    if (ev.propertyName === 'opacity') encerrar();
  }, { once: true });
  const total = Math.max(
    SPLASH_MORPH_MS,
    LOGIN_REVEAL_START_MS + LOGIN_STAGGER_MAX_MS + LOGIN_REVEAL_MS
  );
  setTimeout(encerrar, total + 120);
}

function splashBoot() {
  // Enquanto a splash cobre a tela, nada atrás dela recebe foco de teclado.
  const appEl = document.getElementById('app');
  if (appEl) appEl.setAttribute('inert', '');
  splashProgresso(12);

  // O wordmark espera a fonte, e não o contrário. O teto garante que uma
  // rede ruim no CSS do Google não segure a marca indefinidamente — passado
  // ele, a marca entra em system-ui e a diferença é assumida.
  let fonteResolvida = false;
  const aceitarFonte = () => {
    if (fonteResolvida) return;
    fonteResolvida = true;
    splashRevelarMarca();
  };
  if (document.fonts && document.fonts.load) {
    document.fonts.load('600 22px Jost').then(aceitarFonte).catch(aceitarFonte);
  }
  setTimeout(aceitarFonte, SPLASH_FONTE_MS);

  // performance.now() já conta desde a navegação, então o teto cobre também
  // o parse do script inline (este arquivo tem ~570 KB) — não só o tempo a
  // partir daqui.
  splashState.tetoId = setTimeout(() => {
    // Teto atingido, app ainda não pronto. Sair revelando um #app vazio
    // seria pior que a splash, então há sempre algo desenhado antes:
    //  · com sessão (state.booting) — o painel em modo carregando, onde
    //    renderHome() mostra estado neutro em vez de empty state falso;
    //  · sem sessão resolvida — o Login, que é tela completa e honesta sem
    //    depender de rede nenhuma.
    if (state.booting) render();
    else if (!appEl || !appEl.innerHTML.trim()) renderLogin();
    splashRevelarMarca();
    markReady('READY_TIMEOUT');
  }, Math.max(0, SPLASH_TETO_MS - performance.now()));
}

splashBoot();
checkSession();
</script>
