<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orenzi</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orenzi">
<meta name="theme-color" content="#f7f3ea">
<!-- Ordem deliberada (15/08/2026): os CSS locais vêm ANTES do CSS de fonte
     do Google. CSS é render-blocking, e com o Google primeiro o navegador
     não pintava NADA até ele responder — o primeiro pixel era branco, e só
     depois vinha a splash. Com os tokens antes, o primeiro paint já sai em
     --color-bg e a sequência fica bege → bege → bege (splash nativa do PWA,
     splash HTML, app). O preconnect corta o handshake do domínio de fonte.
     Isto não mexe na cascata: o CSS do Google só declara @font-face, e o
     <style> local continua vindo por último e vencendo. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Orenzi Design System — carregado antes do <style> local de propósito:
     pela cascata, o CSS abaixo continua vencendo até esta página ser
     migrada componente por componente. Ver docs/08_IMPLEMENTATION_RULES.md. -->
<link rel="stylesheet" href="ds/orenzi-tokens.css">
<link rel="stylesheet" href="ds/orenzi-base.css">
<link rel="stylesheet" href="ds/orenzi-components.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Jost:wght@400;500;600;700&display=swap">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root {
    --color-bg: #f3ede4;
    --color-surface: #f7f1e8;
    --color-text: #2b2420;
    --color-accent: #b6784a;
    --color-accent-2: #b23a3a;
    --color-divider: rgba(43,36,32,0.14);
    --color-neutral-100: #f7f1e8;
    --color-neutral-200: #e8ddce;
    --color-neutral-300: #ddcfba;
    --color-neutral-600: #6b6053;
    --color-neutral-700: #5c4f42;
    --color-accent-100: #ecdcc9;
    --color-accent-600: #a1683f;
    --color-accent-700: #8a5a34;
    --color-accent-2-100: #f7e7e7;
    --color-accent-2-700: #8a2a2a;
    --font-heading: "Poppins", "Jost", system-ui, sans-serif;
    --font-body: "Jost", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--color-bg); color: var(--color-text);
    /* 100px, não 84: o rodapé cresceu com os ícones (~77px de altura, era
       ~57), senão o fim do conteúdo ficava encoberto por ele. */
    font-family: var(--font-body); padding-bottom: 100px;
  }
  /* .global-header-inner é o wrapper interno do <header>; herdado da versão
     com cabeçalho colapsável (removida), mantido porque o padding vive nele. */
  .global-header-inner {
    padding: 14px 20px 2px; display: flex; align-items: center; justify-content: space-between;
  }
  header .greeting { font-family: var(--font-heading); font-weight: 600; font-size: 24px; }
  header .greeting-sub { font-size: 13px; color: var(--color-neutral-600); margin-top: 2px; }
  header .mark {
    width: 36px; height: 36px; border-radius: 50%; background: var(--color-accent);
    color: var(--color-bg); display: flex; align-items: center; justify-content: center;
    font-family: var(--font-heading); font-style: normal; font-weight: 600; font-size: 16px;
  }
  main { max-width: 480px; margin: 0 auto; padding: 8px 20px 0; }
  h2 { font-family: var(--font-heading); font-weight: 600; font-size: 20px; margin: 20px 0 10px; }
  .section-label {
    font-size: 11px; letter-spacing: 0.08em; color: var(--color-neutral-600);
    font-weight: 700; margin: 4px 0 10px;
  }
  /* ── HOME · DASHBOARD EXECUTIVO ─────────────────────────────── */
  @keyframes homeFadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .home-block { opacity: 0; }
  .home-block.in {
    animation: homeFadeUp 0.5s cubic-bezier(.22,.61,.36,1) forwards;
  }

  .home-section { margin-top: 30px; }
  .home-section-head {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px;
  }
  .home-section-head h2 { margin: 0; }
  .home-section-head .home-section-hint { font-size: 12px; color: var(--color-neutral-600); }


  /* ── PANORAMA DA AGENDA (Home operacional) ─────────────────── */
  .panorama-card {
    background: var(--color-surface); border: 1px solid var(--color-divider);
    border-radius: 22px; padding: 18px 18px 16px; margin-bottom: 12px;
  }
  .pc-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 8px; }
  .pc-title { font-family: var(--font-heading); font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .pc-title .pc-icon { color: var(--color-accent-600); display: flex; flex-shrink: 0; }
  .pc-title .pc-icon svg { width: 16px; height: 16px; }
  .pc-status {
    font-size: 10.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; flex-shrink: 0;
    background: var(--color-accent-100); color: var(--color-accent-700); white-space: nowrap;
  }
  .pc-status.is-busy { background: var(--color-accent-2-100); color: var(--color-accent-2-700); }
  .pc-status.is-quiet { background: var(--color-neutral-200); color: var(--color-neutral-600); }
  .adc-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 14px; }
  .adc-stats .as-item { text-align: center; }
  .adc-stats .as-val { font-family: var(--font-heading); font-weight: 600; font-size: 16px; }
  .adc-stats .as-lbl { font-size: 9.5px; color: var(--color-neutral-600); margin-top: 2px; letter-spacing: 0.02em; }
  .adc-bar-track { height: 6px; border-radius: 999px; background: var(--color-accent-100); overflow: hidden; }
  .adc-bar-fill { height: 100%; border-radius: 999px; background: var(--color-accent-600); width: 0%; transition: width .7s cubic-bezier(.22,.61,.36,1); }
  .pc-note { font-size: 12px; color: var(--color-neutral-600); margin-top: 10px; }
  .pc-empty { font-size: 13px; color: var(--color-neutral-600); }

  .week-summary-split { display: flex; gap: 10px; }
  .wss-item { flex: 1; background: var(--color-accent-100); border-radius: 16px; padding: 14px; text-align: center; }
  .wss-item.is-weak { background: var(--color-neutral-200); }
  .wss-emoji { font-size: 20px; margin-bottom: 6px; }
  .wss-day { font-family: var(--font-heading); font-weight: 600; font-size: 13.5px; text-transform: capitalize; }
  .wss-count { font-size: 12px; color: var(--color-neutral-700); margin-top: 2px; }

  .dist-row { display: flex; align-items: center; gap: 12px; padding: 7px 0; }
  .dist-row .dr-label {
    flex: 0 0 76px; width: 76px; font-size: 12px; color: var(--color-neutral-600);
    text-transform: capitalize; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dist-row .dr-track { flex: 1; height: 7px; border-radius: 999px; background: var(--color-accent-100); overflow: hidden; }
  .dist-row .dr-fill {
    height: 100%; border-radius: 999px; background: var(--color-accent-600);
    width: 0%; transition: width .7s cubic-bezier(.22,.61,.36,1);
  }
  .dist-row.is-current .dr-fill { background: var(--color-accent-700); }
  .dist-row.is-current .dr-label { color: var(--color-text); font-weight: 700; }
  .dist-row .dr-val { width: 60px; text-align: right; font-size: 12.5px; font-weight: 700; flex-shrink: 0; }

  .opportunity-grid { display: flex; align-items: stretch; gap: 12px; }
  .opp-item { flex: 1; min-width: 0; }
  .opp-item .opp-lbl { font-size: 10.5px; color: var(--color-neutral-600); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.03em; }
  .opp-item .opp-val { font-family: var(--font-heading); font-weight: 600; font-size: 16px; }
  .opp-item .opp-sub { font-size: 12px; color: var(--color-neutral-600); margin-top: 2px; }
  .opp-divider { width: 1px; background: var(--color-divider); flex-shrink: 0; }

  .trend-block { display: flex; align-items: center; gap: 14px; }
  .trend-emoji { font-size: 26px; flex-shrink: 0; line-height: 1; }
  .trend-headline { font-family: var(--font-heading); font-weight: 600; font-size: 14.5px; }
  .trend-phrase { font-size: 12px; color: var(--color-neutral-600); margin-top: 3px; }



  /* ── Padrão de linha (modelo: Início/Insights) ─────────────────
     Base que toda lista do app usa: cartão em --color-surface com borda
     e leve elevação ao toque, não o cinza plano de --color-neutral-100
     que Clientes/Estoque/Agenda ainda tinham. `.appt-modern-card` (Início)
     e `.list-row` (as outras abas) partem do mesmo bloco de propósito —
     mudar aqui muda a família inteira. */
  .appt-modern-card, .list-row {
    display: flex; align-items: center; gap: 12px; background: var(--color-surface);
    border: 1px solid var(--color-divider); border-radius: 16px; padding: 12px 14px; margin-bottom: 8px;
    transition: transform .2s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
  }
  .appt-modern-card:hover, .list-row:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(43,36,32,0.06); }
  .appt-modern-card .am-time-col { width: 46px; flex-shrink: 0; text-align: center; }
  .appt-modern-card .am-time { font-family: var(--font-heading); font-weight: 600; font-size: 13.5px; }
  .appt-modern-card .am-bar { width: 3px; align-self: stretch; border-radius: 3px; flex-shrink: 0; min-height: 34px; }
  .appt-modern-card .am-body { flex: 1; min-width: 0; }
  .appt-modern-card .am-client { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .appt-modern-card .am-meta { font-size: 12px; color: var(--color-neutral-600); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .appt-modern-card .am-status {
    font-size: 10.5px; font-weight: 700; padding: 4px 9px; border-radius: 999px; flex-shrink: 0;
    background: var(--color-accent-2-100); color: var(--color-accent-2-700); white-space: nowrap;
  }
  .appt-modern-card .am-status.st-confirmed { background: var(--color-accent-100); color: var(--color-accent-700); }
  .appt-modern-card .am-status.st-done { background: var(--color-neutral-200); color: var(--color-neutral-600); }

  @media (max-width: 360px) {
    .adc-stats { grid-template-columns: repeat(2, 1fr); row-gap: 10px; }
  }

  /* ── INSIGHTS (arquitetura de 07/08/2026, refinada no R4) ──────
     Tudo aqui usa token de app/ds/orenzi-tokens.css. Nenhum hex, raio,
     sombra, duração ou tamanho tipográfico novo entrou.
     Ritmo vertical em dois degraus: --space-6 dentro de um assunto,
     --space-8 entre assuntos (docs/02 §3). */
  .ins-period {
    position: relative; display: flex; gap: 2px; padding: 3px;
    margin: var(--space-3-5) 0 var(--space-6);
    background: var(--color-accent-100); border-radius: var(--radius-full);
  }
  /* Cápsula física única — desliza entre as três posições em vez de
     apagar um botão pintado e pintar outro. translateX(i*100%) usa a
     LARGURA DA PRÓPRIA cápsula como referência (1/3 do trilho), por
     isso i=0/1/2 já produz os três passos certos. */
  .ins-period-pill {
    position: absolute; top: 3px; bottom: 3px; left: 3px;
    width: calc((100% - 6px) / 3);
    background: var(--color-accent-700); border-radius: var(--radius-full);
    transition: transform var(--motion-standard) var(--ease-standard);
    z-index: 0;
  }
  .ins-period button {
    position: relative; z-index: 1;
    flex: 1; border: none; background: transparent; cursor: pointer;
    font-family: var(--font-body); font-size: var(--text-caption-size); font-weight: 600;
    color: var(--color-accent-700); padding: 0; height: 38px; border-radius: var(--radius-full);
    transition: color var(--motion-fast) var(--ease-standard),
                transform var(--motion-instant) var(--ease-standard);
  }
  /* Alvo de 44px sem engordar o desenho (docs/07 §4). */
  .ins-period button::after { content: ''; position: absolute; inset: -3px 0; }
  .ins-period button[aria-pressed="true"] { color: var(--color-bg); }
  .ins-period button:active { transform: scale(0.97); }
  .ins-period button:focus-visible { box-shadow: var(--focus-ring); }

  .ins-floor { margin-top: var(--space-8); padding-top: var(--space-2); }
  .ins-title {
    font-family: var(--font-heading); font-size: var(--text-title-3-size);
    font-weight: var(--text-title-3-weight); margin: 0 0 var(--space-3); letter-spacing: -0.005em;
  }
  .ins-read { font-size: var(--text-body-size); line-height: var(--leading-normal); margin: 0 0 var(--space-3-5); }
  .ins-read em { font-style: normal; font-weight: 600; }

  /* Conteúdo trocável (Hero..Canais) — troca de período faz um cross-fade
     curto com deslocamento mínimo, nunca um blink de innerHTML instantâneo. */
  #insContent { min-height: 40px; }

  /* Hero — o número realizado é o maior elemento tipográfico da tela.
     Os títulos de seção usam title-3 (17px) justamente para não competir. */
  .ins-answer { padding-top: var(--space-1); }
  .ins-eyebrow {
    font-size: var(--text-micro-size); font-weight: var(--text-micro-weight);
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-neutral-600); margin: 0;
  }
  .ins-answer-row { display: flex; align-items: baseline; gap: var(--space-3); margin-top: var(--space-2-5); flex-wrap: wrap; }
  .ins-answer-value {
    font-family: var(--font-heading); font-size: var(--text-display-size); font-weight: 600;
    line-height: var(--leading-tight); letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
  }
  .ins-answer-word { font-size: var(--text-body-size); color: var(--color-neutral-700); }
  .ins-answer-vs { font-size: var(--text-caption-size); color: var(--color-neutral-600); margin: var(--space-2) 0 0; }
  .ins-answer-ahead {
    display: flex; align-items: center; gap: var(--space-2);
    margin-top: var(--space-4); padding-top: var(--space-3);
    border-top: var(--border-width) solid var(--color-divider);
    font-size: var(--text-caption-size); color: var(--color-neutral-700);
  }
  .ins-answer-ahead strong {
    font-family: var(--font-heading); font-weight: 600; font-size: var(--text-body-strong-size);
    color: var(--color-text); font-variant-numeric: tabular-nums;
  }
  .ins-ahead-ic { display: flex; color: var(--color-neutral-600); flex-shrink: 0; }
  .ins-ahead-ic svg { width: 15px; height: 15px; }

  .ins-delta {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: var(--text-caption-size); font-weight: 700; padding: 3px 9px;
    border-radius: var(--radius-full); white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .ins-delta.is-up { background: var(--color-success-100); color: var(--color-success-700); }
  .ins-delta.is-down { background: var(--color-accent-2-100); color: var(--color-accent-2-700); }

  /* Considerações — empilhado, nunca em carrossel: uma leitura que exige
     rolagem lateral para ser descoberta não cumpre o papel do bloco. */
  .ins-stack { display: flex; flex-direction: column; gap: var(--space-2); }
  .ins-alert {
    display: flex; align-items: flex-start; gap: var(--space-3);
    background: var(--color-accent-100); border: var(--border-width) solid var(--color-accent);
    border-radius: var(--radius-md); padding: var(--space-3) var(--space-3-5);
  }
  .ins-alert-ic {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 28px; height: 28px; border-radius: var(--radius-sm);
    background: var(--color-surface); color: var(--color-accent-700);
  }
  .ins-alert-ic svg { width: 15px; height: 15px; }
  .ins-alert-body { flex: 1; min-width: 0; }
  .ins-alert-head { display: block; font-size: var(--text-body-strong-size); font-weight: 600; line-height: 1.3; }
  .ins-alert-sub {
    display: block; font-size: var(--text-caption-size); color: var(--color-neutral-700);
    margin-top: 3px; font-variant-numeric: tabular-nums;
  }

  /* Sugestões — carrossel de UM card centralizado por vez. O card ocupa
     a largura útil inteira (nada de peek do próximo: o peek fazia o
     primeiro card parecer cortado na borda). */
  .ins-rail-wrap { position: relative; }
  .ins-rail {
    display: flex; gap: var(--space-3); overflow-x: auto;
    scroll-snap-type: x mandatory; scroll-behavior: smooth;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .ins-rail::-webkit-scrollbar { display: none; }
  .ins-card {
    flex: 0 0 100%; scroll-snap-align: center; min-width: 0; min-height: 132px;
    display: flex; flex-direction: column; gap: var(--space-2-5); text-align: left;
    background: var(--color-surface); border: var(--border-width) solid var(--color-divider);
    border-radius: var(--radius-md); padding: var(--space-4);
    font-family: var(--font-body); color: var(--color-text);
  }
  .ins-card.is-actionable { cursor: pointer; transition: transform var(--motion-fast) var(--ease-spring), box-shadow var(--motion-fast) var(--ease-standard); }
  .ins-card.is-actionable:active { transform: scale(0.98); box-shadow: var(--elevation-hover); }
  .ins-card:focus-visible { box-shadow: var(--focus-ring); }
  .ins-card-ic {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 30px; height: 30px; border-radius: var(--radius-sm);
    background: var(--color-accent-100); color: var(--color-accent-700);
  }
  .ins-card-ic svg { width: 16px; height: 16px; }
  .ins-card-body { flex: 1; display: flex; flex-direction: column; gap: var(--space-1); }
  .ins-card-head { display: block; font-size: 16px; font-weight: 600; line-height: 1.28; }
  .ins-card-sub { display: block; font-size: var(--text-caption-size); color: var(--color-neutral-600); font-variant-numeric: tabular-nums; }
  .ins-card-impact { display: block; font-size: var(--text-caption-size); font-weight: 700; color: var(--color-accent-700); font-variant-numeric: tabular-nums; }
  .ins-card-go {
    display: inline-flex; align-items: center; gap: 5px; margin-top: auto; padding-top: var(--space-1);
    font-size: var(--text-caption-size); font-weight: 700; color: var(--color-accent-700);
  }
  .ins-card-go svg { width: 14px; height: 14px; }

  /* Indicação de "tem mais" — chevron discreto na borda direita do
     carrossel, visível enquanto não é o último card. Ensina com um aceno
     curto (2–3 repetições) só na primeira exposição da sessão. */
  .ins-rail-hint {
    position: absolute; top: 50%; right: 2px; transform: translateY(-50%);
    display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: var(--radius-circle);
    background: var(--color-surface); color: var(--color-accent-700);
    box-shadow: var(--elevation-hover); pointer-events: none;
    opacity: 0; transition: opacity var(--motion-fast) var(--ease-standard);
  }
  .ins-rail-hint svg { width: 14px; height: 14px; }
  .ins-rail-hint.is-visible { opacity: 0.92; }
  @keyframes insHintNudge {
    0%, 100% { transform: translateY(-50%) translateX(0); }
    50% { transform: translateY(-50%) translateX(5px); }
  }
  .ins-rail-hint.is-teaching { animation: insHintNudge 700ms var(--ease-standard) 3; }

  .ins-dots { display: flex; gap: 6px; justify-content: center; margin-top: var(--space-3); }
  .ins-dots i {
    width: 6px; height: 6px; border-radius: var(--radius-circle); background: var(--color-neutral-300);
    transition: background var(--motion-fast) var(--ease-standard), width var(--motion-fast) var(--ease-standard);
  }
  .ins-dots i.is-on { background: var(--color-accent-700); width: 16px; border-radius: var(--radius-full); }

  /* Indicadores — sem moldura: rótulo, valor e variação. A terceira
     linha ("28 no mesmo ponto de julho") saiu de propósito. */
  .ins-kpis { display: grid; grid-template-columns: 1fr 1fr; column-gap: var(--space-4); row-gap: var(--space-6); }
  .ins-kpi { min-width: 0; }
  .ins-kpi-lbl { display: flex; align-items: center; gap: var(--space-1); font-size: var(--text-caption-size); color: var(--color-neutral-600); }
  .ins-kpi-row { display: flex; align-items: baseline; gap: var(--space-2); margin-top: 3px; flex-wrap: wrap; }
  .ins-kpi-val {
    font-family: var(--font-heading); font-size: var(--text-title-2-size); font-weight: 600;
    line-height: var(--leading-tight); font-variant-numeric: tabular-nums;
  }
  .ins-kpi-delta { font-size: 12px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ins-kpi-delta.is-up { color: var(--color-success-700); }
  .ins-kpi-delta.is-down { color: var(--color-accent-2-700); }

  /* Ajuda dos indicadores — 16px de desenho + área estendida invisível
     até 44px (docs/07 §4). Nunca repetir o "?" de 18px sem extensão da
     Insights V1. */
  .ins-kpi-help {
    position: relative; display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: var(--radius-circle); flex-shrink: 0;
    background: var(--color-neutral-200); color: var(--color-neutral-600);
    border: none; cursor: pointer; padding: 0; font-size: 10px; font-weight: 700; line-height: 1;
    font-family: var(--font-body); transition: background var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
  }
  .ins-kpi-help::after { content: ''; position: absolute; inset: -14px; }
  .ins-kpi-help:hover, .ins-kpi-help:active { background: var(--color-accent-700); color: var(--color-bg); }
  .ins-kpi-help:focus-visible { box-shadow: var(--focus-ring); }

  .ins-chart-card {
    background: var(--color-surface); border: var(--border-width) solid var(--color-divider);
    border-radius: var(--radius-lg); padding: var(--space-4) var(--space-3) var(--space-3);
  }
  .ins-chart-card svg { width: 100%; height: auto; display: block; overflow: visible; }
  .ins-chart-foot {
    font-size: var(--text-caption-size); color: var(--color-neutral-600);
    margin: var(--space-3) 0 0; padding-top: var(--space-3);
    border-top: var(--border-width) solid var(--color-divider); font-variant-numeric: tabular-nums;
  }
  .ins-chart-foot strong { color: var(--color-text); font-family: var(--font-heading); font-weight: 600; }

  /* Onde há espaço — fractal por timeframe. Três degraus discretos em
     token existente; ratio ABSOLUTO (não relativo ao máximo do conjunto),
     pra um único vazio grande não espremer o resto no mesmo degrau
     "cheio". O número em toda célula garante que a leitura não dependa
     só de cor (docs/07 §12). */
  .ins-map { width: 100%; border-collapse: separate; border-spacing: 3px; margin-top: var(--space-1); }
  .ins-map th {
    font-family: var(--font-body); font-size: var(--text-micro-size); font-weight: var(--text-micro-weight);
    color: var(--color-neutral-600); padding: 0 0 2px; text-align: center;
  }
  .ins-map th.ins-map-lbl {
    font-size: 12px; font-weight: 400; color: var(--color-neutral-600);
    text-align: left; white-space: nowrap; padding: 0 var(--space-1) 0 0; width: 1%;
  }
  .ins-map-cell {
    text-align: center; font-size: 12px; font-weight: 700; height: 40px;
    border-radius: var(--radius-sm); font-variant-numeric: tabular-nums;
    background: var(--color-neutral-200); color: var(--color-neutral-700);
  }
  .ins-map-cell.is-livre { background: var(--color-accent-100); color: var(--color-text); }
  .ins-map-cell.is-muito-livre { background: var(--color-accent-700); color: var(--color-bg); }
  /* R4.1: dia encerrado esmaece — a cor do degrau continua correta (é um
     fato histórico), só perde destaque visual pra não competir com o que
     ainda é oportunidade. Token existente (opacity), nada novo. */
  .ins-map th.is-passado { opacity: 0.5; }
  .ins-map-cell.is-passado { opacity: 0.6; }
  .ins-map-legend { font-size: var(--text-micro-size); font-weight: var(--text-micro-weight); color: var(--color-neutral-600); margin: var(--space-3) 0 0; }

  /* Nível Mês (semanas, uma linha) e Ano (meses, grade 6×2) — mesma
     paleta tonal das células da semana, geometria própria de cada nível. */
  .ins-space-row { display: flex; gap: var(--space-2); }
  .ins-space-row .ins-space-tile { flex: 1; }
  .ins-space-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: var(--space-2); }
  .ins-space-tile {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    border-radius: var(--radius-sm); padding: var(--space-2) 2px; min-height: 48px;
    background: var(--color-neutral-200); color: var(--color-neutral-700);
  }
  .ins-space-tile .ist-lbl { font-size: var(--text-micro-size); font-weight: var(--text-micro-weight); opacity: 0.85; }
  .ins-space-tile .ist-val { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ins-space-tile.is-livre { background: var(--color-accent-100); color: var(--color-text); }
  .ins-space-tile.is-muito-livre { background: var(--color-accent-700); color: var(--color-bg); }
  /* R4.1: em Mês/Ano a leitura principal é histórica (retrospectiva), então
     aqui é o FUTURO que esmaece — o oposto da Semana, e de propósito: a
     pergunta que cada nível responde primeiro muda (ver docs da entrega). */
  .ins-space-tile.is-futuro { opacity: 0.5; }
  .ins-space-tile.is-atual { box-shadow: inset 0 0 0 var(--border-width-emphasis) var(--color-accent-700); }

  /* Onde está o dinheiro */
  .ins-svc { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2-5) 0; }
  .ins-svc + .ins-svc { border-top: var(--border-width) solid var(--color-divider); }
  .ins-svc-body { flex: 1; min-width: 0; }
  .ins-svc-name { font-size: var(--text-body-strong-size); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ins-svc-track { display: block; height: 5px; border-radius: var(--radius-full); background: var(--color-accent-100); overflow: hidden; margin-top: 6px; }
  .ins-svc-fill {
    display: block; height: 100%; border-radius: var(--radius-full); background: var(--color-accent-600);
    width: 0; transition: width var(--motion-emphasized) var(--ease-out);
  }
  .ins-svc-meta { font-size: 12px; color: var(--color-neutral-600); margin-top: 5px; font-variant-numeric: tabular-nums; }
  .ins-svc-right { text-align: right; flex-shrink: 0; }
  .ins-svc-rev { font-family: var(--font-heading); font-size: var(--text-body-strong-size); font-weight: 600; font-variant-numeric: tabular-nums; }
  .ins-svc-hour {
    display: inline-block; margin-top: 4px; font-size: var(--text-micro-size); font-weight: var(--text-micro-weight);
    padding: 2px 7px; border-radius: var(--radius-full); font-variant-numeric: tabular-nums;
    background: var(--color-neutral-200); color: var(--color-neutral-700);
  }

  /* Como as clientes chegam */
  .ins-ch-bar { display: flex; height: 8px; border-radius: var(--radius-full); overflow: hidden; }
  .ins-ch-bar span { display: block; }
  .ins-ch-keys { display: flex; gap: var(--space-4); flex-wrap: wrap; margin-top: var(--space-2-5); font-size: var(--text-caption-size); color: var(--color-neutral-600); }
  .ins-ch-keys span { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .ins-ch-keys i { width: 8px; height: 8px; border-radius: var(--radius-circle); display: block; flex-shrink: 0; }
  .ins-ch-conv { font-size: var(--text-caption-size); color: var(--color-neutral-600); margin: var(--space-3) 0 0; font-variant-numeric: tabular-nums; }
  .ins-ch-conv strong { color: var(--color-text); font-family: var(--font-heading); font-weight: 600; }

  @media (max-width: 360px) {
    .ins-kpis { column-gap: var(--space-3); }
    .ins-map { border-spacing: 2px; }
    .ins-map-cell { height: 36px; font-size: var(--text-micro-size); }
    .ins-map th.ins-map-lbl { font-size: var(--text-micro-size); font-weight: 400; }
    .ins-space-tile { min-height: 42px; }
  }

  /* Help dos indicadores — R4.1: micro-diálogo centralizado, não a folha
     de largura cheia do ConfirmationDialog. Mesmo raio e mesma sombra do
     `.month-cal-card` que a Agenda já usa pro calendário de mês — nenhuma
     geometria nova, só a mesma família aplicada a um card menor. */
  .ins-help-overlay {
    position: fixed; inset: 0; z-index: var(--z-overlay-top);
    background: rgba(43, 36, 32, 0.45); backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center; padding: var(--space-5);
    opacity: 0; transition: opacity var(--motion-emphasized) var(--ease-out);
  }
  .ins-help-overlay.is-open { opacity: 1; }
  .ins-help-overlay.is-closing { transition-duration: var(--motion-fast); transition-timing-function: var(--ease-in); opacity: 0; }
  .ins-help-card {
    position: relative; width: 100%; max-width: 320px;
    background: var(--color-bg); border-radius: var(--radius-lg);
    padding: var(--space-6) var(--space-5); box-shadow: var(--elevation-overlay);
    transform: scale(0.96); transition: transform var(--motion-emphasized) var(--ease-out);
  }
  .ins-help-overlay.is-open .ins-help-card { transform: scale(1); }
  .ins-help-overlay.is-closing .ins-help-card { transition-duration: var(--motion-fast); transition-timing-function: var(--ease-in); transform: scale(0.98); }
  .ins-help-title {
    font-family: var(--font-heading); font-size: var(--text-title-3-size);
    font-weight: var(--text-title-3-weight); color: var(--color-text); margin: 0 var(--space-6) var(--space-2) 0;
  }
  .ins-help-text { font-family: var(--font-body); font-size: var(--text-body-size); color: var(--color-neutral-700); line-height: var(--leading-relaxed); margin: 0; }
  .ins-help-close {
    position: absolute; top: var(--space-3); right: var(--space-3);
    width: var(--touch-target-min); height: var(--touch-target-min);
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; border-radius: var(--radius-circle); color: var(--color-neutral-600); cursor: pointer;
    transition: background var(--motion-fast) var(--ease-standard);
  }
  .ins-help-close svg { width: 16px; height: 16px; }
  .ins-help-close:hover { background: var(--color-neutral-200); }
  .ins-help-close:focus-visible { box-shadow: var(--focus-ring); }

  @media (prefers-reduced-motion: reduce) {
    .ins-period-pill, .ins-period button, .ins-card.is-actionable, .ins-svc-fill, .ins-dots i, .ins-rail-hint { transition: none; }
    .ins-period button:active, .ins-card.is-actionable:active { transform: none; }
    .ins-rail { scroll-behavior: auto; }
    .ins-rail-hint.is-teaching { animation: none; }
    #insContent { transition: none !important; transform: none !important; }
    /* Help: sem scale — o fade do overlay/card continua (é curto e não é
       posicional), só o "surgir" cresce fica de fora, como pedido. */
    .ins-help-card { transition: none; transform: none !important; }
  }

  /* ── Clientes: filtro contextual vindo do drill-through de Insights ── */
  .cli-context-banner {
    display: flex; align-items: center; gap: var(--space-3);
    background: var(--color-accent-100); border: var(--border-width) solid var(--color-accent);
    border-radius: var(--radius-md); padding: var(--space-3) var(--space-3-5);
    margin-bottom: var(--space-3);
  }
  .cli-context-ic {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 28px; height: 28px; border-radius: var(--radius-sm);
    background: var(--color-surface); color: var(--color-accent-700);
  }
  .cli-context-ic svg { width: 15px; height: 15px; }
  .cli-context-label { flex: 1; min-width: 0; font-size: var(--text-caption-size); font-weight: 600; color: var(--color-text); }
  .cli-context-clear {
    flex-shrink: 0; background: none; border: none; cursor: pointer; padding: var(--space-1) var(--space-2);
    font-family: var(--font-body); font-size: var(--text-caption-size); font-weight: 700; color: var(--color-accent-700);
  }
  .cli-context-clear:focus-visible { box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }

  .card {
    background: var(--color-neutral-100); border-radius: 16px; padding: 14px 16px;
    margin-bottom: 10px; display: flex; align-items: center; gap: 12px;
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; color: #fff; background: var(--color-accent);
  }
  .card .title { font-weight: 700; font-size: 15px; }
  .card .sub { font-size: 13px; color: var(--color-neutral-600); margin-top: 2px; }
  .card .time { font-size: 13px; font-weight: 700; color: var(--color-accent-700); white-space: nowrap; }
  .empty { font-size: 13px; color: var(--color-neutral-600); padding: 12px 0; }
  .badge {
    font-size: 11px; font-weight: 700; background: var(--color-accent-2-100);
    color: var(--color-accent-2-700); padding: 3px 8px; border-radius: 999px;
  }
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--color-neutral-100);
    display: none; justify-content: space-around; padding: 8px 0 20px;
    box-shadow: 0 -1px 0 var(--color-divider);
  }
  /* Ícone empilhado sobre o texto — troca o rodapé de texto puro pelo
     modelo de tab bar da referência. currentColor faz o SVG herdar a cor
     do botão sozinho, sem JS extra pra estado ativo/inativo. */
  nav button {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: none; font-family: var(--font-body); font-size: 10.5px;
    color: var(--color-neutral-600); cursor: pointer; padding: 5px 4px; white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    transition: transform var(--motion-instant) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
  }
  /* PRESS (:active, físico, todo botão) é distinto de SELECTED (.active,
     qual aba está ligada) — o toque nativo fica invisível por causa do
     -webkit-tap-highlight-color acima, então sem isso o dedo não sente
     nada até a tela trocar. */
  nav button:active { transform: scale(0.98); }
  nav button svg { width: 21px; height: 21px; flex-shrink: 0; }
  nav button.active { color: var(--color-accent-700); font-weight: 700; }
  #toast {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%) translateY(-60px);
    background: var(--color-accent); color: #fff; padding: 12px 18px; border-radius: 999px;
    font-size: 13px; font-weight: 700; transition: transform .25s ease; z-index: 100;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* Header inspirado no princípio do Calendar da Apple: mês em pílula
     (setas dentro, com borda) à esquerda, + à direita — não é cópia, é o
     mesmo tipo de hierarquia aplicado aos tokens do Orenzi. Cabeçalho e
     faixa de dias ficam próximos (gap pequeno abaixo) pra ler como UM
     sistema de navegação; o respiro "de verdade" fica pro título de data,
     que é onde a tela muda de assunto (controle → conteúdo). */
  /* UMA linha só de controle: mês (com setas de semana) à esquerda, Hoje e
     + à direita. Tudo o que antes ocupava três blocos verticais (day-nav,
     título grande de data, e o "Hoje" flutuante) cabe aqui — é o que libera
     a tela pra grade, que é o conteúdo de verdade desta aba. */
  .day-nav {
    display: flex; align-items: center; gap: 8px;
    margin: 6px 0 6px;
  }
  .day-nav-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .month-pill {
    display: flex; align-items: center; gap: 2px; min-width: 0;
    background: var(--color-surface); border: 1.5px solid var(--color-divider);
    border-radius: 999px; padding: 2px 4px 2px 2px;
  }
  .month-pill .day-label {
    font-family: var(--font-heading); font-weight: 600; font-size: 15px; padding: 0 2px;
    /* Última linha de defesa em telas muito estreitas ou com fonte de
       sistema aumentada: o mês trunca em vez de empurrar "Hoje" e o "+"
       pra fora da linha. */
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .month-pill .day-label-btn {
    display: flex; align-items: center; gap: 6px; background: none; border: none;
    cursor: pointer; padding: 4px 2px; color: inherit; min-width: 0;
  }
  .month-pill .day-label-btn svg { width: 10px; height: 10px; color: var(--color-neutral-600); flex-shrink: 0; }
  .month-pill .day-label-btn:hover .day-label { color: var(--color-accent-700); }
  .month-pill button.arrow {
    width: 28px; height: 28px; border-radius: 50%; border: none;
    background: none; color: var(--color-text);
    font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: background .15s ease;
  }
  .month-pill button.arrow:hover { background: var(--color-neutral-100); }
  /* + da agenda: squircle no topo, ao lado da pílula do mês — troca o FAB
     circular flutuante que só o Estoque continua usando. */
  .agenda-add-btn {
    width: 38px; height: 38px; border-radius: 12px; border: none; flex-shrink: 0;
    background: var(--color-accent); color: var(--color-bg); font-size: 20px; line-height: 1;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: transform .18s cubic-bezier(.34,1.56,.64,1); -webkit-tap-highlight-color: transparent;
  }
  .agenda-add-btn:active { transform: scale(0.9); }
  /* "Hoje" saiu do botão flutuante e virou pílula aqui na linha de controle
     (referência do Raphael). Linguagem neutra/contornada de propósito — é
     navegação, não a ação de destaque da tela (essa é o +). */
  .agenda-today-btn {
    height: 38px; padding: 0 14px; border-radius: 999px; flex-shrink: 0;
    background: var(--color-surface); color: var(--color-text);
    border: 1.5px solid var(--color-divider); cursor: pointer;
    font-family: var(--font-body); font-weight: 700; font-size: 13px;
    -webkit-tap-highlight-color: transparent;
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), background .15s ease;
  }
  .agenda-today-btn:active { transform: scale(0.95); background: var(--color-neutral-200); }

  .week-strip {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
    margin-bottom: 2px;
  }
  .week-day {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    padding: 5px 2px; border-radius: 10px; cursor: pointer;
    border: 1.5px solid var(--color-divider);
    background: var(--color-surface); font-family: var(--font-body);
    /* border-color/background em .2s: é a seleção "deslizando" de um dia
       pro outro quando os botões continuam os mesmos elementos (ver
       updateWeekStripSelection). transform tem easing "com molinha" —
       retorno elástico discreto no toque, não instantâneo. */
    transition: border-color .2s ease, background .2s ease,
      transform .14s cubic-bezier(.34,1.56,.64,1), opacity .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .week-day:hover { border-color: var(--color-neutral-300); }
  .week-day:active { transform: scale(0.97); opacity: 0.85; }
  .week-day .wd-label {
    font-size: 9px; font-weight: 700; text-transform: uppercase; color: var(--color-neutral-600);
    letter-spacing: 0.03em; line-height: 1.3;
  }
  .week-day .wd-num {
    width: 24px; height: 24px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
    font-size: 13.5px; font-weight: 700; color: var(--color-text);
  }
  .week-day.selected { background: var(--color-text); border-color: var(--color-text); }
  .week-day.selected .wd-num { background: transparent; color: var(--color-bg); }
  .week-day.selected .wd-label { color: var(--color-neutral-300); }
  .week-day.is-today:not(.selected) { border-color: var(--color-accent-700); }
  .week-day.is-today:not(.selected) .wd-num { color: var(--color-accent-700); }
  .week-day.is-today:not(.selected) .wd-label { color: var(--color-accent-700); }
  .week-day .wd-dot {
    width: 4px; height: 4px; border-radius: 50%; background: var(--color-accent-2);
    visibility: hidden;
  }
  .week-day.has-appts .wd-dot { visibility: visible; }
  .week-day.selected .wd-dot { background: var(--color-accent-2); }
  .month-cal-overlay {
    position: fixed; inset: 0; background: rgba(43,36,32,0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; padding: 20px; backdrop-filter: blur(2px);
  }
  .month-cal-card {
    background: var(--color-bg); border-radius: 20px; padding: 22px;
    width: 100%; max-width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .month-cal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .month-cal-header .day-label {
    font-family: var(--font-heading); font-weight: 600; font-size: 17px;
  }
  .month-cal-weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr);
    margin-bottom: 6px;
  }
  .month-cal-weekdays div {
    text-align: center; font-size: 11px; font-weight: 700; color: var(--color-neutral-600);
    text-transform: uppercase;
  }
  .month-cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
  }
  .month-cal-day {
    aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; border: none; border-radius: 10px; background: transparent; cursor: pointer;
    font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--color-text);
  }
  .month-cal-day:hover { background: var(--color-neutral-200); }
  .month-cal-day.is-outside { color: var(--color-neutral-300); }
  .month-cal-day.is-today { color: var(--color-accent-700); }
  .month-cal-day.selected { background: var(--color-text); color: var(--color-bg); }
  .month-cal-day .wd-dot {
    width: 4px; height: 4px; border-radius: 50%; background: var(--color-accent-2);
    visibility: hidden;
  }
  .month-cal-day.has-appts .wd-dot { visibility: visible; }
  .month-cal-day.selected .wd-dot { background: var(--color-accent-2); }
  /* Fundo/borda no padrão de cartão do resto do app (Início/Insights) —
     antes era o cinza chapado sem borda que só a Agenda ainda usava. O
     padding-left de 52px é geometria, não estilo: hour-label é ancorado
     em -52px pra encostar no início do conteúdo, então não mexe aqui. */
  /* Envolve .timeline só durante o slide de dia — o resto do tempo é
     transparente, sem efeito no layout. */
  .agenda-viewport { position: relative; overflow: hidden; }
  .agenda-pane { position: absolute; top: 0; left: 0; width: 100%; will-change: transform; }

  /* ── Pager de dias (Agenda v2, 15/08/2026) ───────────────────────────
     Três páginas irmãs — anterior · atual · seguinte — dentro de um
     viewport com overflow hidden. Só a ATUAL fica no fluxo: é ela que dá
     altura ao trilho. As outras duas são absolutas e já nascem deslocadas
     ±100%, então não custam layout enquanto ninguém arrasta e não há tela
     vazia pra revelar quando o dedo encosta.
     Durante o gesto quem se move é SÓ o trilho, e só por `transform` —
     nada de top/left/width, nada de re-render por pixel. */
  .agenda-pager { position: relative; overflow: hidden; }
  .agenda-pager-track { position: relative; }
  /* `will-change` só enquanto o dedo está na tela: fora disso segurar uma
     camada de composição à toa custa memória em celular. */
  .agenda-pager-track.is-dragging { will-change: transform; }
  .agenda-page.is-prev, .agenda-page.is-next {
    position: absolute; top: 0; left: 0; width: 100%;
  }
  .agenda-page.is-prev { transform: translateX(-100%); }
  .agenda-page.is-next { transform: translateX(100%); }
  /* Sem card: a grade fica "solta" (referência: Apple Calendar) — só linhas
     de hora extremamente discretas, sem fundo nem borda envolvendo tudo.

     ── Geometria da timeline (Agenda v2) ────────────────────────────────
     Uma escala só governa a grade inteira: PX_PER_MINUTE no JS
     (HOUR_HEIGHT/60). Todo `top` e toda `height` de card saem dela — nada
     é posicionado "por aproximação", e nenhum padding vertical entra na
     conta (o espaço vertical É o tempo).

     `--tl-gutter` é a ÚNICA coluna reservada à esquerda: só os rótulos de
     hora vivem nela. O card começa `--tl-card-left` depois — 4px, não os
     58px acumulados da versão anterior (gutter de 52 + 6 de recuo). Evento
     ancorado na linha do tempo, não cartão flutuando na página.

     Camadas (z-index), de baixo pra cima — a lista completa mora aqui,
     nenhum valor solto espalhado pelo arquivo:
       0   linhas de hora (.hour-row, fluxo normal)
       4   bloqueio manual (.timeline-block)
       10  appointment principal, +1 por nível de encaixe (Z_APPT no JS)
       30  linha do horário atual (.current-time-line)
       200 overlays/sheets (.modal-overlay, .month-cal-overlay) */
  .timeline {
    --tl-gutter: 40px;
    --tl-card-left: 4px;
    --tl-card-right: 6px;
    position: relative;
    padding: 0 0 0 var(--tl-gutter); margin-top: 4px;
    /* 62vh -> 72vh: o cabeçalho encolheu ~130px (saiu o título grande de
       data, a linha de controle virou uma só e a faixa de dias ficou
       compacta), então a grade fica com a folga que ele deixou. */
    max-height: 72vh; overflow-y: auto; overflow-x: hidden;
    scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
    /* O gesto não "vaza" pro documento quando a grade chega no topo/fundo. */
    overscroll-behavior: contain;
    /* `pan-y` é o que faz o scroll vertical e o pager horizontal
       conviverem: o navegador continua dono do eixo Y (com momentum, sem
       nenhum preventDefault da nossa parte) e devolve o eixo X pros
       handlers de pointer. Sem isso a alternativa seria preventDefault
       indiscriminado, que mataria o momentum do scroll. */
    touch-action: pan-y;
    /* Some por padrão, só aparece durante a rolagem (classe .is-scrolling,
       ligada/desligada por JS — CSS não tem "faz 1s que parou de rolar"). */
    scrollbar-width: thin; scrollbar-color: transparent transparent;
  }
  .timeline::-webkit-scrollbar { width: 5px; }
  .timeline::-webkit-scrollbar-track { background: transparent; }
  .timeline::-webkit-scrollbar-thumb { background: transparent; border-radius: 999px; transition: background .3s ease; }
  .timeline.is-scrolling { scrollbar-color: var(--color-neutral-300) transparent; }
  .timeline.is-scrolling::-webkit-scrollbar-thumb { background: var(--color-neutral-300); }
  .hour-row {
    position: relative; height: 60px;
    /* Linha extremamente discreta, derivada do token de texto (não um
       cinza arbitrário) — a grade é fundo, nunca o elemento principal. */
    border-top: 1px solid color-mix(in srgb, var(--color-text) 6%, transparent);
  }
  .hour-row:first-child { border-top: none; }
  /* Hierarquia da timeline: hora é o elemento de MENOR peso (só orienta),
     evento é o de destaque, linha do horário atual é o mais importante de
     todos — ver z-index e cor abaixo. Opacidade baixa de propósito: a hora
     orienta, não compete pela atenção com os agendamentos. */
  .hour-label {
    position: absolute; left: calc(-1 * var(--tl-gutter)); top: -8px;
    width: calc(var(--tl-gutter) - 6px); text-align: right;
    font-size: 10.5px; color: var(--color-neutral-600); opacity: 0.5; letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }
  .timeline-body { position: relative; }
  /* Linha do horário atual — cor de marca (marrom/caramelo), não vermelho.
     Só existe no dia de hoje; updateCurrentTimeLine() reposiciona a cada
     30s. transition:top faz o reposicionamento deslizar suave (parecer
     contínuo) em vez de saltar de 30 em 30s. */
  .current-time-line {
    position: absolute; left: calc(-1 * var(--tl-gutter)); right: 0; display: flex; align-items: center;
    z-index: 30; pointer-events: none; animation: currentTimeFadeIn .22s ease;
    transition: top 1s linear;
    /* `top` marca o instante exato, mas a caixa cresce pra baixo a partir
       dele (a altura vem do badge, o filho mais alto) — sem isto o centro
       visual do selo/ponto/linha ficava ~9px abaixo da hora real. */
    transform: translateY(-50%);
  }
  /* Traço fino de propósito — a linha orienta, o selo é que carrega a
     informação; um traço grosso competiria com os agendamentos. */
  .current-time-line::after {
    content: ''; flex: 1; height: 1px; background: var(--color-accent-700); margin-left: 5px;
  }
  .current-time-badge {
    font-family: var(--font-body); font-size: 10.5px; font-weight: 700; color: var(--color-bg);
    background: var(--color-accent-700); padding: 2px 6px; border-radius: 999px;
    width: 38px; text-align: center; flex-shrink: 0; font-variant-numeric: tabular-nums;
  }
  /* Marcador circular do horário atual — respira sozinho, sem depender de
     nenhum toque, pra reforçar "isto é agora" com o mínimo de ruído. */
  .current-time-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--color-accent-700);
    flex-shrink: 0; margin-left: 5px;
    animation: currentTimeBreathe 4s ease-in-out infinite;
  }
  @keyframes currentTimeFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes currentTimeBreathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  /* Destaque de um instante, disparado pelo botão "Hoje" — pulso discreto,
     não pisca nem muda de cor. */
  @keyframes currentTimePulse { 0% { transform: scale(1); } 35% { transform: scale(1.22); } 100% { transform: scale(1); } }
  .current-time-line.is-highlighted .current-time-badge,
  .current-time-line.is-highlighted .current-time-dot { animation: currentTimePulse .6s ease; }
  /* Evento: sem sombra parada (o contraste de cor já separa do fundo),
     cantos no raio compacto do Design System (--radius-sm) e padding nos
     tokens de espaçamento — não valores soltos. Leitura em primeiro lugar. */
  .timeline-appt {
    /* Faixa de título reservada no topo do card (tiers ricos): nada
       desenhado dentro do card — faixa de pausa, encaixe sobreposto —
       pode pintar aqui. O nome da cliente é a primeira informação do
       card e não pode ser coberto por nada. Espelha APPT_HEAD_SAFE no
       JS: mudar um exige mudar o outro. A conta que fecha nos 44px está
       nas line-heights de .title/.sub logo abaixo. */
    --appt-head-h: 40px;
    /* Largura da barra de destaque (ver ::before). Vive aqui e não como
       número solto porque três coisas dependem dela: o padding-left do
       conteúdo, o `left` da faixa de pausa e a própria barra. */
    --appt-bar-w: 5px;
    position: absolute; left: var(--tl-card-left); right: var(--tl-card-right);
    border-radius: var(--radius-sm, 12px);
    /* Densidade de calendário (Agenda v2): 8px em cima/embaixo, não os 12
       de cartão de lista. Padding não muda a altura do card (ela é setada
       em px pela duração), mas empurrava o nome pra longe do topo e
       roubava as duas linhas de texto dos cards médios. */
    padding: 8px 10px 8px calc(var(--appt-bar-w) + 9px); overflow: hidden;
    cursor: pointer;
    transition: transform var(--motion-instant, 80ms) var(--ease-out, ease-out),
      opacity var(--motion-fast, 160ms) ease, box-shadow var(--motion-instant, 80ms) var(--ease-out, ease-out);
    -webkit-tap-highlight-color: transparent;
  }
  /* Barra de destaque na extrema esquerda — substitui o `border-left: 3px`
     de antes. Não é borda de propósito: é um elemento pintado, mais
     saturado que o fundo do card (--appt-bar sai da mesma cor de categoria,
     puxada pro tom escuro da própria família — nenhuma cor nova), e corre a
     ALTURA INTEIRA, atravessando a faixa de pausa. É essa continuidade que
     faz work_before + pausa + work_after lerem como UMA reserva, e não como
     três cards empilhados. */
  .timeline-appt::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: var(--appt-bar-w); background: var(--appt-bar, currentColor);
    border-radius: var(--radius-sm, 12px) 0 0 var(--radius-sm, 12px);
    pointer-events: none;
  }
  .timeline-appt:active { transform: scale(0.98); opacity: 0.92; }
  /* Cabeçalho em linha (avatar + texto + status) — tier standard/expanded,
     onde sobra altura de verdade pro avatar de 22px + duas linhas de texto.
     `position: relative` SEM z-index: põe o cabeçalho na mesma camada de
     pintura da faixa de pausa (que é absoluta) e, por vir depois no DOM,
     ele fica por cima. É ordem de documento, não empilhamento arbitrário —
     e é só a segunda linha de defesa: a primeira é a faixa de pausa nunca
     entrar em --appt-head-h. */
  .timeline-appt .appt-head {
    position: relative;
    display: flex; align-items: center; gap: var(--space-2, 8px); min-width: 0;
  }
  .timeline-appt .appt-body { min-width: 0; flex: 1; }
  /* Extensão proposta do Avatar (docs/04) — .o-avatar hoje só tem sm(40)/lg(72);
     a Agenda precisa de selos de identidade bem menores, em dois tamanhos
     (xs pro tier rico, 2xs pro tier compacto de 30-59min). Mesmos hooks
     --avatar-bg/--avatar-color do componente — não uma cor ou raio novo.
     Fica local até virar §Avatar. */
  .timeline-appt .o-avatar.o-avatar-xs { width: 22px; height: 22px; font-size: 8.5px; flex-shrink: 0; }
  .timeline-appt .o-avatar-xs .o-avatar-badge { width: 10px; height: 10px; border-width: 1.5px; }
  .timeline-appt .o-avatar-xs .o-avatar-badge svg { width: 6px; height: 6px; }
  .timeline-appt .o-avatar.o-avatar-2xs { width: 16px; height: 16px; font-size: 7px; flex-shrink: 0; }
  .timeline-appt .title, .timeline-appt .sub {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* line-height fixa (não `normal`) nas duas linhas: é ela que faz o
     cabeçalho caber dentro de --appt-head-h de forma determinística —
     8px de padding + 15.6 (título) + 13.2 (subtítulo) = 36.8px, com
     folga até os 40px reservados. Com `normal` dava 42.4px e a faixa de
     pausa mordia a última linha. (Os 44px anteriores caíram para 40 junto
     com o padding, na densidade de calendário da Agenda v2 — o número
     espelha APPT_HEAD_SAFE no JS e os dois mudam juntos.) */
  .timeline-appt .title { font-weight: 700; font-size: 12.5px; line-height: 1.25; letter-spacing: -0.01em; }
  /* Hierarquia cliente → serviço vem de peso e tamanho de fonte (title é
     700/12.5px, sub é 400/11px), não de opacidade — testado no navegador:
     com o fundo mais saturado, opacidade abaixo de 1 no .sub derrubava o
     contraste da categoria Coloração pra 4,17:1 (abaixo do mínimo AA), até
     em 0.85. Texto legível pesa mais que hierarquia por transparência. */
  .timeline-appt .sub { font-size: 11px; line-height: 1.2; }
  /* Faixa de horário ("9:00–11:30"), que substituiu a duração em
     15/08/2026. tabular-nums pra os dígitos não dançarem de card pra card. */
  .timeline-appt .sub .hours { font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* ── Tier is-micro (<30min): uma linha só, sem avatar ─────────────────
     Padding mínimo real (não é o padrão escondendo linha) — o card mais
     baixo desse tier mede ~16px, e o padrão de 12/14px sozinho já
     estouraria essa altura. */
  .timeline-appt.is-micro {
    display: flex; align-items: center; padding: 1px 8px 1px calc(var(--appt-bar-w) + 6px);
  }
  .micro-row {
    display: flex; align-items: center; gap: 5px; width: 100%; min-width: 0;
  }
  .micro-row .micro-name {
    font-weight: 700; font-size: 10.5px; letter-spacing: -0.01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0;
  }
  /* Horário nunca trunca — é a segunda informação mais importante do
     tier (logo depois do nome) e precisa continuar sempre visível. */
  .micro-row .micro-hours {
    font-size: 9.5px; font-variant-numeric: tabular-nums; flex-shrink: 0; opacity: 0.9;
    white-space: nowrap;
  }
  /* ── Tier is-compact (30-59min): nome + serviço + duração + status,
     também numa linha só (a de 30min mede ~26px, sem sobra pra duas). ── */
  .timeline-appt.is-compact {
    display: flex; align-items: center; padding: 2px 9px 2px calc(var(--appt-bar-w) + 7px);
  }
  .compact-row {
    display: flex; align-items: center; gap: 6px; width: 100%; min-width: 0;
  }
  .compact-row .compact-info {
    font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0;
  }
  .compact-row .compact-info b { font-weight: 700; }
  .compact-row .compact-hours {
    font-size: 10px; font-variant-numeric: tabular-nums; flex-shrink: 0; opacity: 0.9;
    white-space: nowrap;
  }
  /* `.status-dot` (o ponto colorido de status em is-micro/is-compact) foi
     REMOVIDO em 10/08/2026 junto com o selo "Confirmado". Aparecia em todo
     card e, como statusClass() cai em 'st-confirmed' por omissão, era quase
     sempre o mesmo ponto — cor sem legenda, sem nada que a explicasse em
     lugar nenhum do app. A regra agora está em timelineStatusBadge(): só o
     excepcional aparece, e sempre com texto. O ponto de status da LISTA DE
     CLIENTES é outra coisa e continua onde estava.
     Selo de status na agenda — reaproveita os mesmos tokens de cor do card
     da Home (.am-status), só um pouco menor pra caber dentro do bloco.
     Deixou de ser selo ABSOLUTO no canto: agora é o terceiro item do
     flex do cabeçalho, com flex-shrink:0. Antes ele flutuava por cima e
     o nome só escapava por causa de um `padding-right: 56px` chutado —
     status mais largo que isso ("Não compareceu") passava por cima do
     nome. Em fluxo, quem cede espaço é o nome (ellipsis), nunca o
     contrário: o status ocupa o que precisa e o resto sobra pro nome. */
  .timeline-appt .am-status {
    flex-shrink: 0;
    /* Teto pro selo: o nome da cliente é prioridade 1, o status é a última
       da lista — então ele é que fica sem espaço primeiro, não o contrário.
       Vale mesmo com um único selo possível hoje: o dia em que voltar um
       rótulo mais comprido, o nome já está protegido. */
    max-width: 40%; overflow: hidden; text-overflow: ellipsis;
    font-size: 9px; font-weight: 700; padding: 2px 7px;
    border-radius: var(--radius-full, 999px); white-space: nowrap;
    background: var(--color-accent-2-100); color: var(--color-accent-2-700);
  }
  /* Só no tier rico o selo sobe pro alto: lá o cabeçalho tem duas linhas e
     `center` deixaria a pílula boiando no meio delas. Em micro/compact a
     linha é única e o padrão (center) é o certo. */
  .timeline-appt .appt-head > .am-status { align-self: flex-start; }
  /* Nos tiers baixos o card inteiro tem 16-26px de altura: o selo perde o
     padding vertical e um pouco de corpo pra caber sem estourar a linha. */
  .micro-row .am-status, .compact-row .am-status { padding: 0 5px; font-size: 8.5px; }
  /* st-urgent é redundante com o fundo base do .am-status de propósito —
     deixa explícito que no-show usa a MESMA cor de alerta do resto do app
     (estoque baixo, agenda lotada), não uma nova. As variantes st-confirmed
     e st-done saíram junto com os selos "Confirmado"/"Concluído" — a Home
     (.appt-modern-card) continua com as dela, que é outra tela e outra
     regra. */
  .timeline-appt .am-status.st-urgent { background: var(--color-accent-2-100); color: var(--color-accent-2-700); }
  /* Toque-e-eleva antes de navegar pro detalhe (bindTimelineApptClicks) —
     dá tempo do dedo perceber que tocou ANTES da tela trocar, em vez de sumir
     na hora. Puramente JS (classe ligada/desligada por setTimeout), não CSS
     :active — o :active já solta antes do timeout de 80-120ms terminar.
     Sombra é o token de elevação de toque em cartão (--elevation-hover), não
     um valor novo. */
  .timeline-appt.is-lifting { transform: translateY(-2px); box-shadow: var(--elevation-hover, 0 8px 20px rgba(43,36,32,0.16)); }
  /* Nasce suave, não "estala" na tela — só o agendamento recém-criado no
     mesmo dia ganha a classe (state.enteringApptId, consumida uma vez em
     buildAgendaGrid). */
  .timeline-appt.is-entering { animation: apptEnter var(--motion-emphasized, 240ms) var(--ease-spring, cubic-bezier(.34,1.56,.64,1)); }
  @keyframes apptEnter { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
  /* Some suave — preparado pro dia em que existir cancelamento/exclusão de
     agendamento (hoje não existe esse fluxo no app; a classe fica pronta,
     sem nada que a dispare ainda). */
  .timeline-appt.is-leaving { animation: apptLeave var(--motion-standard, 200ms) var(--ease-standard, ease) forwards; }
  @keyframes apptLeave { to { opacity: 0; } }
  /* `.agenda-free-slot` (o card tracejado "Xh livres", verde, com o + no
     meio) SAIU em 15/08/2026, junto com o rótulo da pausa. A ausência de
     card já significa disponibilidade — num calendário de verdade ninguém
     desenha o vazio. Só o CSS e o desenho saíram: computeFreeGaps() e
     freeSlotLabel() continuam existindo intactos, ver o comentário delas
     no JS. */
  /* Pausa: a profissional está livre aqui, então o bloco clareia — mesma
     cor-base do atendimento, só com um véu branco por cima, e o véu entra
     e sai em fade de 6px nas duas pontas. Bloco de trabalho → transição
     suave → pausa mais clara → transição suave → bloco de trabalho.
     Nada de listra diagonal nem borda tracejada (saíram em 10/08/2026):
     rachurado é linguagem de "área bloqueada / indisponível", e pausa é o
     oposto disso — é justamente o tempo em que cabe encaixar alguém.
     Sem cor nova: o clareamento é a própria cor do card com branco por
     cima, exatamente como o resto do app deriva tom de um mesmo token.

     É um nó VAZIO (15/08/2026): saiu o `.gap-label` ("⏱ pausa · 70min").
     A pausa se comunica só pelo fade — sem texto, sem duração, sem
     horário, sem ícone. Nada de flex/centralização aqui, porque não há
     mais filho pra centralizar. */
  .appt-gap {
    /* Começa DEPOIS da barra de destaque: a barra é o que segura a leitura
       de "uma reserva só" e não pode ser clareada no meio (item de
       continuidade da Agenda v2). */
    position: absolute; left: var(--appt-bar-w); right: 0; pointer-events: none;
    background: linear-gradient(
      to bottom,
      rgba(255,255,255,0) 0,
      rgba(255,255,255,0.52) 6px,
      rgba(255,255,255,0.52) calc(100% - 6px),
      rgba(255,255,255,0) 100%);
  }

  /* Bloqueio manual de agenda — entidade própria, não appointment. Rachurado
     é a linguagem certa aqui, ao contrário da pausa (que fica clara, sem
     listra, de propósito — ver comentário em cima de .appt-gap): pausa
     significa "cabe encaixar alguém", bloqueio significa o oposto exato.
     Neutro, nunca --color-accent-2 — essa é a cor de "isso precisa de
     atenção" (estoque baixo, agenda lotada); um bloqueio é uma decisão da
     própria profissional, não um alerta do sistema. */
  .timeline-block {
    /* Alinhado ao mesmo eixo esquerdo dos appointments (--tl-card-left) pra
       harmonizar com a grade nova, mas o resto continua deliberadamente
       diferente: rachurado, neutro, sem barra de destaque. Bloqueio não é
       appointment e não pode passar a parecer um. */
    position: absolute; left: var(--tl-card-left); right: var(--tl-card-right);
    border-radius: var(--radius-sm, 12px);
    padding: var(--space-2, 8px) var(--space-3, 12px);
    background: repeating-linear-gradient(
      135deg,
      var(--color-neutral-200) 0px, var(--color-neutral-200) 7px,
      var(--color-neutral-100) 7px, var(--color-neutral-100) 14px
    );
    border: 1.5px solid var(--color-divider);
    color: var(--color-neutral-700);
    cursor: pointer; overflow: hidden; z-index: 4;
    transition: transform var(--motion-instant, 80ms) var(--ease-out, ease-out), opacity var(--motion-fast, 160ms) ease;
    -webkit-tap-highlight-color: transparent;
  }
  .timeline-block:active { transform: scale(0.98); opacity: 0.9; }
  .timeline-block .tb-row { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 11.5px; }
  .timeline-block .tb-row svg { width: 14px; height: 14px; flex-shrink: 0; }
  .timeline-block .tb-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .timeline-block .tb-time { display: block; font-size: 10px; margin-top: 2px; font-variant-numeric: tabular-nums; opacity: 0.85; }
  @media (prefers-reduced-motion: reduce) { .timeline-block { transition: none; } .timeline-block:active { transform: none; } }

  /* Faixa de dia bloqueado — fora da grade de propósito, nunca um card de
     00:00-24:00 (mentiria sobre proporção do dia). Vive dentro do html que
     #timelineEl recebe, então acompanha o mesmo slide de troca de dia sem
     precisar de coreografia própria. */
  .day-blocked-banner {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    margin: 0 0 10px; padding: 10px 14px; border-radius: var(--radius-sm, 12px);
    background: var(--color-neutral-200); color: var(--color-neutral-700);
    font-size: 12.5px; font-weight: 600;
  }
  .day-blocked-banner svg { width: 16px; height: 16px; flex-shrink: 0; }

  .block-detail-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 0;
    font-size: 13.5px; color: var(--color-text);
  }
  .block-detail-row svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--color-neutral-600); }

  /* ── LOGIN — "cartão de recepção" (15/08/2026) ────────────────────
     Direção B. A tela deixou de ser uma coluna solta sobre o fundo e
     virou um cartão de --color-surface sobre --color-bg. Os campos e o
     CTA saíram do CSS local e passaram para os primitivos do DS
     (.o-field / .o-input / .o-btn.o-btn-primary) — o botão antigo usava
     --color-accent, que reprova AA (3,12:1); .o-btn-primary é
     --color-accent-700 (5,02:1), a correção que docs/03 §6 já tinha
     feito e que esta tela nunca recebeu.

     CONTINUIDADE COM A SPLASH — feita por MOVIMENTO, não por offset
     (16/08/2026). A primeira versão punha o wordmark do Login no mesmo
     ponto em que a splash o deixava (`50dvh − 29px`), para a marca ficar
     parada na troca. Funcionava, mas a transição continuava sendo um
     corte: a splash sumia e o Login aparecia inteiro de uma vez.
     Hoje a marca SOBE da posição da splash até a posição natural do
     Login (conjunto marca + cartão centrado) e o formulário se revela
     durante a subida — ver "SHARED MOTION" abaixo. O destino é medido em
     runtime com FLIP; não existe mais coordenada cravada, e por isso o
     offset de 29px saiu daqui.

     O conjunto centraliza com margens `auto` — e não com
     `justify-content: center` — porque com o conteúdo maior que a
     viewport o center esconde o topo atrás da borda e ele fica
     inalcançável mesmo com rolagem. */
  /* O #app tem 8px de padding no topo para todas as telas do painel. Aqui
     ele deslocaria o Login (e só ele) e ainda daria 8px de rolagem numa
     tela que cabe inteira. A classe entra e sai junto com o Login, em
     setAuthedChrome(). */
  body.is-login #app { padding-top: 0; }
  /* Ancorado na VIEWPORT, como a splash — e não no fluxo do #app. A
     splash é `position: fixed; inset: 0`, então qualquer coisa acima do
     #app (o padding do main, a tarja de DEMO, o #toast do espelho)
     deslocaria só o Login, e origem e destino do movimento deixariam de
     estar no mesmo sistema de coordenadas. Medido no demo: 26px. O
     overflow fica no próprio container, para tela baixa continuar
     rolando. */
  .login-screen {
    position: fixed; inset: 0; overflow-y: auto;
    min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
    gap: var(--space-6);
    padding: var(--space-8) var(--gutter);
  }
  .login-mark { text-align: center; margin-top: auto; }
  .login-screen .login-card { margin-bottom: auto; }
  .login-card {
    width: 100%; max-width: 340px;
    display: flex; flex-direction: column; gap: var(--space-4);
    padding: var(--space-6) var(--space-5) var(--space-5);
    background: var(--color-surface);
    border: var(--border-width) solid var(--color-divider);
    border-radius: var(--radius-xl);
    box-shadow: var(--elevation-hover);
  }
  .login-title {
    margin: 0; text-align: center;
    font-family: var(--font-heading);
    font-size: var(--text-title-1-size); font-weight: var(--text-title-1-weight);
    line-height: var(--leading-tight);
  }
  /* Duas correções locais no campo, ambas declaradas de propósito:
     · 16px — abaixo disso o Safari do iPhone dá zoom ao focar e a tela
       salta logo na primeira interação do dia. O corpo do produto
       continua 15px (--text-body-size); adotar 16px em TODO campo é
       decisão do DS e está pendente em docs/04 §Input.
     · o raio — o painel tem uma regra antiga `input[type="email"]
       { border-radius: 999px }` que, por ser seletor de atributo, vence
       a classe do DS e transformava o campo numa pílula.
     As duas viram dívida registrada, não exceção silenciosa. */
  .login-card .o-input { font-size: 16px; border-radius: var(--radius-sm); }
  /* Classe própria, e não a `.login-error` genérica: aquela é usada por
     três formulários do painel (#ncError, #prodError, #wizNcError) e
     mudar cor ou margem lá seria mexer em tela que ninguém pediu. */
  .login-form-error {
    margin: 0;
    font-size: var(--text-caption-size); line-height: var(--leading-normal);
    color: var(--color-accent-2-700);
  }
  .login-form-error[hidden] { display: none; }
  /* Sessão expirada: aviso de contexto, não erro. Fundo de marca em vez
     de vermelho — nada deu errado, a sessão só acabou. */
  .login-note {
    margin: 0; padding: var(--space-3) var(--space-3-5);
    border-radius: var(--radius-sm);
    background: var(--color-accent-100); color: var(--color-neutral-700);
    font-size: var(--text-caption-size); line-height: var(--leading-normal);
  }
  .login-note[hidden] { display: none; }

  /* ── SHARED MOTION — Splash → Login (16/08/2026) ───────────────────
     A splash não é removida e substituída pelo Login: ela VIRA o Login.
     O wordmark é o elemento compartilhado — sobe da posição da splash
     até a posição final do Login enquanto título, campos e CTA se
     revelam por baixo dele.

     Quem se move é a marca DO LOGIN, não a da splash (FLIP: mede-se o
     destino real, aplica-se o deslocamento inverso e solta-se). No fim
     do movimento não há troca de elemento nenhuma — o que está na tela
     já é o Login. A marca da splash é apagada no mesmo frame em que a
     do Login aparece na posição dela, então não existe frame com as
     duas nem salto de tipografia: são o mesmo desenho, no mesmo ponto.

     O fundo da splash fica transparente durante a passagem. Isso não
     revela nada: `#splash` e `body` são os dois `--color-bg`, e é
     exatamente por isso que dá para desligar a cobertura sem um único
     frame de piscada.

     Durações locais, pelo mesmo motivo de `--splash-in`: abertura de
     marca não é transição rotineira de estado (docs/05 §3 fala do teto
     de 350ms para essas). Ficam no escopo do componente, nunca no
     :root, e espelhadas em SPLASH_MORPH_MS / LOGIN_REVEAL_START_MS no
     JS — mudar de um lado exige mudar do outro. */
  .login-screen {
    --login-morph: 460ms;         /* subida do wordmark */
    --login-reveal-start: 150ms;  /* ~1/3 do caminho: o form entra durante a subida */
  }
  /* Estado inicial: o Login está montado e medível, mas invisível. Ele
     precisa estar PINTADO nesta condição um frame antes, senão não há
     de onde a transição partir. */
  .login-screen.is-preparing .login-mark,
  .login-screen.is-preparing [data-reveal] { opacity: 0; }
  .login-screen.is-preparing [data-reveal] { transform: translateY(var(--reveal-shift, 10px)); }
  /* A marca aparece SEM transição de opacidade: ela troca de lugar com
     a marca da splash no mesmo frame, e um crossfade aqui produziria
     justamente o instante de duas marcas que não pode existir. */
  .login-screen.is-morphing .login-mark {
    opacity: 1;
    transition: transform var(--login-morph) var(--ease-standard);
  }
  .login-screen.is-revealing [data-reveal] {
    opacity: 1; transform: none;
    transition: opacity var(--motion-route) var(--ease-out),
                transform var(--motion-route) var(--ease-out);
    transition-delay: calc(var(--login-reveal-start) + var(--reveal-delay, 0ms));
  }
  #splash.is-morphing { background: transparent; pointer-events: none; }
  #splash.is-morphing .splash-mark { opacity: 0; transition: none; }
  /* A barra já chegou a 100% quando a saída é autorizada: ela sai cedo,
     sozinha, e não acompanha o wordmark — quem terminou de carregar não
     precisa continuar dizendo isso durante a passagem. */
  #splash.is-morphing .splash-line {
    opacity: 0;
    transition: opacity var(--motion-fast) var(--ease-out);
  }
  /* Movimento reduzido: a marca não percorre distância (o JS não aplica
     deslocamento) e o conteúdo entra só por opacidade, sem stagger. A
     continuidade continua existindo — o que sai é o deslocamento, não a
     transição. O piso de branding não é afetado. */
  @media (prefers-reduced-motion: reduce) {
    .login-screen.is-preparing [data-reveal] { transform: none; }
    /* Sem deslocamento, a troca vira cross-fade: as duas marcas mudam de
       opacidade ao mesmo tempo. Se a da splash sumisse no ato (como faz
       no caminho normal, onde a do Login já ocupa o lugar dela no mesmo
       frame), sobraria um intervalo com nenhuma das duas — exatamente o
       piscar que esta rodada existe para eliminar. */
    #splash.is-morphing .splash-mark {
      opacity: 0;
      transition: opacity var(--motion-route) var(--ease-out);
    }
    .login-screen.is-morphing .login-mark {
      opacity: 1;
      transition: opacity var(--motion-route) var(--ease-out);
    }
    .login-screen.is-revealing [data-reveal] {
      transform: none;
      transition: opacity var(--motion-route) var(--ease-out);
      transition-delay: 0ms;
    }
  }

  /* ESPELHA .splash-word / .splash-sub, logo abaixo. Os dois pares
     precisam continuar idênticos — é a mesma marca em duas telas que se
     sucedem, e qualquer diferença de tamanho ou espaçamento vira um
     salto visível no instante em que a splash sai. Mudar um exige mudar
     o outro. */
  .wordmark {
    font-family: var(--font-body); font-weight: 600; font-size: 22px; letter-spacing: 0.14em;
    color: var(--color-accent-700); line-height: var(--leading-tight);
  }
  .wordmark-sub {
    font-family: var(--font-body); font-size: 11px; letter-spacing: 0.28em;
    color: var(--color-neutral-600); margin-top: 2px;
  }

  /* ── SPLASH — "papel e assinatura" (15/08/2026) ───────────────────
     A abertura usa a MESMA marca do Login (.wordmark/.wordmark-sub, logo
     acima) e do rodapé da landing: wordmark tipográfico sobre --color-bg.

     O que saiu: um anel escuro de 220px (#16151a de fundo, #26242a/#3a383e
     no anel, fita roxa, filete dourado #b8933c). Seis cores, zero tokens —
     roxo não existe no DS e o dourado registrado é token de LANDING, não do
     produto. Além disso invertia o tema duas vezes (splash nativa bege →
     splash preta → app bege) num app cujo tema escuro foi recusado pela
     cliente (ADR 0001), e concorria com as outras três representações da
     marca. O anel continua vivo nos ícones do PWA — trocá-los muda o que a
     Juliane vê na tela inicial do celular e depende de aprovação dela.

     Nenhum valor novo aqui: todas as cores, durações e curvas são tokens.
     A saída é comandada por markReady() — ver "SPLASH — CICLO DE VIDA" no
     fim do script. Não existe mais timer cego. */
  #splash {
    /* Entrada do wordmark. Fora da escala de docs/05 (teto de 350ms para
       transição ROTINEIRA) de propósito e com aprovação explícita do dono do
       produto em 15/08/2026: a splash não é transição de estado, é abertura
       de marca, e o ritmo pedido foi 300–400ms de entrada. Fica no escopo do
       componente, não no :root — nenhuma outra tela herda isto. Se a splash
       virar padrão reaproveitável, promover a token em docs/03. */
    --splash-in: 340ms;
    position: fixed; inset: 0; background: var(--color-bg); z-index: 500;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: var(--space-3);
    transition: opacity var(--motion-route, 280ms) var(--ease-in, ease);
  }
  #splash.fade-out { opacity: 0; pointer-events: none; }

  /* O wordmark NASCE OCULTO e só entra quando Jost estiver utilizável (ou
     no teto de SPLASH_FONTE_MS). O CSS de fonte usa display=swap, então
     pintar de imediato faria a marca trocar de tipografia no meio da
     splash — numa tela cuja única função é a marca, é o defeito mais caro.
     A espera pela fonte VIRA o delay de entrada em vez de virar um FOUT. */
  .splash-mark {
    opacity: 0; transform: translateY(8px); text-align: center;
    transition: opacity var(--splash-in) var(--ease-out, ease),
                transform var(--splash-in) var(--ease-out, ease);
  }
  .splash-mark.is-in { opacity: 1; transform: none; }
  .splash-word {
    font-family: var(--font-body); font-weight: 600; font-size: 22px;
    letter-spacing: 0.14em; color: var(--color-accent-700);
    line-height: var(--leading-tight);
  }
  .splash-sub {
    font-family: var(--font-body); font-size: 11px; letter-spacing: 0.28em;
    color: var(--color-neutral-600); margin-top: 2px;
  }
  /* Progresso honesto: 12% no boot, 80% quando a marca aparece, 100% quando
     o app fica pronto de verdade. Nunca uma barra indeterminada fingindo
     saber quanto falta. */
  .splash-line {
    width: 42px; height: 2px; border-radius: 2px;
    background: var(--color-divider); overflow: hidden;
  }
  .splash-line i {
    display: block; width: 0%; height: 100%; border-radius: 2px;
    background: var(--color-accent);
    transition: width var(--motion-standard, 200ms) var(--ease-out, ease);
  }

  /* Estado neutro do carregamento inicial da Home — ver renderHome().
     Aparece só quando o teto da splash revela o painel antes de loadAll()
     voltar. NÃO é skeleton: não finge a forma do conteúdo, só diz que os
     dados ainda não chegaram. */
  .home-boot {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: var(--space-3); padding: 72px var(--gutter) 0; text-align: center;
  }
  .home-boot-line {
    width: 42px; height: 2px; border-radius: 2px;
    background: var(--color-divider); overflow: hidden;
  }
  .home-boot-line i {
    display: block; width: 40%; height: 100%; border-radius: 2px;
    background: var(--color-accent);
    animation: bootSlide 1200ms var(--ease-standard) infinite;
  }
  .home-boot-text {
    font-family: var(--font-body); font-size: var(--text-caption-size);
    color: var(--color-neutral-600);
  }
  @keyframes bootSlide {
    from { transform: translateX(-100%); }
    to   { transform: translateX(250%); }
  }

  /* Reduced motion: some o deslocamento e some o crescimento — a linha
     aparece completa e parada, e resta só a opacidade. O piso e o teto
     continuam valendo: acessibilidade não é motivo pra marca piscar. */
  @media (prefers-reduced-motion: reduce) {
    .splash-mark, .splash-mark.is-in { transform: none; }
    /* Barra completa e parada — mesmo tratamento do .home-boot-line. O piso
       de branding continua valendo: só o movimento sai, não o tempo. */
    .splash-line i { transition: none; width: 100%; }
    .home-boot-line i { animation: none; width: 100%; }
  }
  /* `.login-wrap` e suas regras saíram no Login V2 (15/08/2026): campo,
     botão e título agora são .o-field/.o-input/.o-btn e .login-title,
     definidos junto do resto do Login logo acima. `.login-error` fica —
