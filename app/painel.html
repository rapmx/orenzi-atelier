// ── Contador: toque simples, segurar e edição manual ─────────
const HOLD_INICIO_MS = 420;  // antes disso ainda é um toque simples
const HOLD_PASSO_MS = 110;   // depois, um passo a cada

// Segurar não pode virar uma gravação por passo: os passos são acumulados na
// tela e só o total vai pro banco quando o dedo solta — uma escrita, uma
// movimentação. Por isso o número é atualizado no DOM direto: re-renderizar a
// lista no meio do gesto destruiria o próprio botão que está sendo apertado.
function bindQtyHold(btn, produtoId, sinal) {
  let inicio = null, repete = null, acumulado = 0;

  const passo = () => {
    const p = state.products.find(x => x.id === produtoId);
    if (!p) return;
    if (sinal < 0 && Number(p.quantity) + acumulado <= 0) return;
    acumulado += sinal;
    const alvo = document.querySelector(`[data-qty-for="${produtoId}"]`);
    if (alvo) alvo.textContent = fmtQtd(Number(p.quantity) + acumulado);
  };

  const soltar = () => {
    clearTimeout(inicio); clearInterval(repete);
    inicio = repete = null;
    if (!acumulado) return;
    const delta = acumulado;
    acumulado = 0;
    ajustarQuantidade(produtoId, delta);
  };

  btn.onpointerdown = (e) => {
    e.preventDefault();
    passo();
    inicio = setTimeout(() => { repete = setInterval(passo, HOLD_PASSO_MS); }, HOLD_INICIO_MS);
  };
  btn.onpointerup = soltar;
  btn.onpointercancel = soltar;
  btn.onpointerleave = soltar;
}

// Ajuste do balcão: usou um, tira um. A tela já mostra o valor novo (o gesto
// atualizou o DOM); aqui confirma no banco e volta atrás se falhar.
async function ajustarQuantidade(id, delta) {
  const p = state.products.find(x => x.id === id);
  if (!p) return;
  const anterior = Number(p.quantity);
  const nova = Math.max(0, anterior + delta);
  if (nova === anterior) { renderStockList(); return; }
  p.quantity = nova;
  renderStockList();

  // O .select() é o que prova que gravou: com a sessão expirada a RLS deixa o
  // update passar sem tocar em nenhuma linha, e sem isso a tela mentiria.
  const { data, error } = await sb.from('products')
    .update({ quantity: nova, updated_at: new Date().toISOString() }).eq('id', id).select('id');
  if (error || !data || !data.length) {
    p.quantity = anterior;
    renderStockList();
    showToast(error ? 'Não deu pra salvar: ' + error.message : 'Não foi possível salvar — faça login novamente.');
    return;
  }
  await registrarMovimento(p, delta > 0 ? 'entrada' : 'saida', Math.abs(nova - anterior), nova, null);
  renderStockInsights();
  if (precisaRepor(p)) showToast(`${p.name} chegou no mínimo — hora de repor`);
}

async function alternarFavorito(id) {
  const p = state.products.find(x => x.id === id);
  if (!p) return;
  const novo = !p.favorite;
  p.favorite = novo;
  renderStockList();
  const { data, error } = await sb.from('products')
    .update({ favorite: novo, updated_at: new Date().toISOString() }).eq('id', id).select('id');
  if (error || !data || !data.length) {
    p.favorite = !novo;
    renderStockList();
    showToast('Não foi possível salvar — faça login novamente.');
    return;
  }
  // O chip "Favoritos" só existe quando há algum favorito: marcar o primeiro
  // (ou desmarcar o último) muda a faixa de chips, não só a lista.
  if (novo || !state.products.some(x => x.favorite)) render();
}

// Toque no número abre a edição manual. É toque simples, não duplo: em tela
// sensível o duplo toque disputa com o zoom do navegador e falha metade das
// vezes — e o número é um alvo próprio, entre o − e o +.
function openQtyEditSheet(id) {
  const p = state.products.find(x => x.id === id);
  if (!p) return;
  modalContainer.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-sheet">
        <h2>${esc(p.name)}</h2>
        <div class="modal-section">
          <div class="modal-field-label">Quantidade em ${esc(p.unit)}</div>
          <input type="number" id="qtyEditInput" min="0" step="0.5" inputmode="decimal" value="${fmtQtd(p.quantity).replace(',', '.')}">
          <div class="modal-field-label">Motivo (opcional)</div>
          <input type="text" id="qtyEditNote" placeholder="Ex.: contagem do mês" autocomplete="off">
        </div>
        <div class="slot-note">Entra no histórico como ajuste manual, não como consumo.</div>
        <button class="btn btn-primary" id="qtyEditSave">Salvar quantidade</button>
        <button class="btn btn-ghost" id="modalClose">Cancelar</button>
      </div>
    </div>
  `;
  document.getElementById('modalClose').onclick = closeModal;
  document.getElementById('modalOverlay').onclick = (e) => { if (e.target.id === 'modalOverlay') closeModal(); };
  const campo = document.getElementById('qtyEditInput');
  campo.focus();
  campo.select();

  document.getElementById('qtyEditSave').onclick = async () => {
    const btn = document.getElementById('qtyEditSave');
    const nova = Math.max(0, Number(campo.value) || 0);
    const anterior = Number(p.quantity);
    if (nova === anterior) { closeModal(); return; }
    orenziUI.setButtonBusy(btn, 'Salvando…');
    const { data, error } = await sb.from('products')
      .update({ quantity: nova, updated_at: new Date().toISOString() }).eq('id', p.id).select('id');
    if (error || !data || !data.length) {
      if (error) console.error('products.update quantity', error);
      orenziUI.resetButton(btn);
      showToast(error ? 'Não foi possível salvar. Tente de novo.' : 'Não foi possível salvar — faça login novamente.');
      return;
    }
    p.quantity = nova;
    await registrarMovimento(p, 'ajuste', Math.abs(nova - anterior), nova,
      document.getElementById('qtyEditNote').value.trim() || null);
    await orenziUI.setButtonSuccess(btn, 'Salvo');
    closeModal();
    showToast('Quantidade atualizada');
    renderStockList();
    renderStockInsights();
  };
}

  modalContainer.innerHTML = `

        <div class="modal-section">

          </select>
          <div class="modal-field-label">Quantidade</div>
          <input type="number" id="mvQty" min="0" step="0.5" inputmode="decimal" value="1">
          <div class="modal-field-label">Observação (opcional)</div>
          <input type="text" id="mvNote" placeholder="${entrada ? 'Ex.: compra do fornecedor' : 'Ex.: usado na coloração'}" autocomplete="off">
        </div>
        <div class="slot-note" id="mvHint"></div>
        <button class="btn btn-primary" id="mvSave">${entrada ? 'Registrar entrada' : 'Registrar saída'}</button>
        <button class="btn btn-ghost" id="modalClose">Cancelar</button>
      </div>
    </div>
  `;
  document.getElementById('modalClose').onclick = closeModal;
  document.getElementById('modalOverlay').onclick = (e) => { if (e.target.id === 'modalOverlay') closeModal(); };

  const sel = document.getElementById('mvProduct');
  const hint = document.getElementById('mvHint');
  const atualizarHint = () => {
    const p = state.products.find(x => x.id === sel.value);
    hint.textContent = p ? `Agora: ${fmtQtd(p.quantity)} ${p.unit} · mínimo ${fmtQtd(p.min_quantity)} ${p.unit}` : '';
  };
  sel.onchange = atualizarHint;
  atualizarHint();

  document.getElementById('mvSave').onclick = async () => {
    const btn = document.getElementById('mvSave');
    const p = state.products.find(x => x.id === sel.value);
    const qtd = Math.abs(Number(document.getElementById('mvQty').value) || 0);
    if (!p || !qtd) { showToast('Informe uma quantidade'); return; }
    const anterior = Number(p.quantity);
    const nova = Math.max(0, entrada ? anterior + qtd : anterior - qtd);

    orenziUI.setButtonBusy(btn, 'Registrando…');
    const { data, error } = await sb.from('products')
      .update({ quantity: nova, updated_at: new Date().toISOString() }).eq('id', p.id).select('id');
    if (error || !data || !data.length) {
      if (error) console.error('products.update movimento', error);
      orenziUI.resetButton(btn);
      showToast(error ? 'Não foi possível salvar. Tente de novo.' : 'Não foi possível salvar — faça login novamente.');
      return;
    }
    p.quantity = nova;
    await registrarMovimento(p, kind, Math.abs(nova - anterior), nova,
      document.getElementById('mvNote').value.trim() || null);
    await orenziUI.setButtonSuccess(btn, 'Registrado');
    closeModal();
    showToast(`${entrada ? 'Entrada' : 'Saída'} registrada · ${p.name}`);
    renderStockList();
    renderStockInsights();
    if (precisaRepor(p)) showToast(`${p.name} chegou no mínimo — hora de repor`);
  };
}

// Foto do produto. Bucket próprio (product-photos), mesma compressão das fotos
// de cliente — frasco não precisa de mais resolução que cabelo.
async function uploadProductPhoto(produtoId, file) {
  showToast('Enviando foto…');
  const compressed = await compressImage(file, 900, 0.8);
  const path = `${produtoId}/${Date.now()}.jpg`;
  const { error: upErr } = await sb.storage.from('product-photos').upload(path, compressed, { contentType: 'image/jpeg' });
  if (upErr) { showToast('Erro ao enviar foto: ' + upErr.message); return null; }
  const { data: pub } = sb.storage.from('product-photos').getPublicUrl(path);
  if (!pub || !pub.publicUrl) { showToast('Foto não disponível nesta versão'); return null; }
  return pub.publicUrl;
}

function render() {
  // Guard central de capability. Esconder o botao nao e proteger: `state.tab`
  // e alcancavel por codigo (caminho novo, bug, rota interna) e sem esta linha
  // a Insights desenharia para a assistente com os dados ja em memoria. O
  // rodape e redesenhado junto para os dois nunca discordarem.
  aplicarNavPorPapel();
  if (!canAccess(state.tab)) {
    const destino = primeiraTabPermitida();
    if (!destino) { renderSemAcesso(); return; }
    state.tab = destino;
  }
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === state.tab));
  // O + flutuante é do Estoque e da lista de Clientes — a Agenda tem o dela
  // embutido na pílula do mês (#agendaAddBtn, dentro de renderAgenda()).
  // Em Clientes ele some no perfil, que é outra tela dentro da mesma aba.
  const mostraFab = !state.selectedApptId && (
    state.tab === 'estoque' ||
    (state.tab === 'clients' && !state.selectedClientId && !state.viewQuestionnaire)
  );
  document.getElementById('fabNewAppt').style.display = mostraFab ? 'flex' : 'none';
  if (state.selectedApptId) { renderApptDetail(); return; }
  if (state.tab === 'inicio') renderHome();
  else if (state.tab === 'insights') renderInsights();
  else if (state.tab === 'agenda') renderAgenda();
  else if (state.tab === 'clients') renderClients();
  else if (state.tab === 'estoque') renderStock();
  else if (state.tab === 'questionario') renderQuestionario();
}

document.querySelectorAll('nav button').forEach(btn => {
  btn.onclick = () => {
    state.tab = btn.dataset.tab;
    state.selectedClientId = null;
    state.selectedApptId = null;
    state.viewQuestionnaire = null;
    state.clientContext = null;
    quizResetAll();
    // Sair do quiosque tem que ser explicito: `render()` so chama
    // setKioskMode() dentro de renderQuestionario(), entao trocar de aba a

    // nova. Hoje a nav esta display:none nesse estado (o dedo nao alcanca),

    setKioskMode(false);

// ── AUTENTICAÇÃO ─────────────────────────────────────────────
// Login V2 — "cartão de recepção" (15/08/2026). O que mudou, e por quê:
//
//  · A tela virou <form> com rótulos visíveis e primitivos do DS. Sem
//    <form> não havia submit por Enter, e o rótulo era o placeholder —
//    que some justamente quando se digita (docs/04 §Input).
//  · Erro NÃO re-renderiza mais a tela. A versão anterior chamava
//    renderLogin(error.message) e recriava tudo: o e-mail já digitado
//    era apagado, o foco caía no <body> e a mensagem vinha crua do
//    Supabase, em inglês. Hoje só o #loginError muda.
//  · Fim de sessão passou a ter um caminho só (encerrarSessaoUI), que
//    limpa o que o Login sozinho não alcança: folha aberta, diálogo do
//    DS e modo quiosque do Questionário.
//
// A splash não foi tocada: a continuidade da marca é geométrica e vive
// no CSS (ver "LOGIN — cartão de recepção" no <style>).

const LOGIN_MSG_CREDENCIAL = 'E-mail ou senha incorretos. Verifique os dados e tente novamente.';
const LOGIN_MSG_VAZIO      = 'Preencha e-mail e senha para entrar.';
const LOGIN_MSG_REDE       = 'Não foi possível conectar. Verifique a internet e tente de novo.';
const LOGIN_MSG_EXPIRADA   = 'Sua sessão expirou. Entre novamente para continuar.';

let loginEmCurso = false;
let logoutIntencional = false;

// Header, nav, "Sair" e o padding que existe por causa da nav. O FAB não
// entra aqui: quem decide se ele aparece é render(), por aba.
function setAuthedChrome(visivel) {
  document.querySelector('header').style.display = visivel ? 'flex' : 'none';
  document.querySelector('nav').style.display = visivel ? 'flex' : 'none';
  document.getElementById('logoutBtn').style.display = visivel ? 'inline' : 'none';
  if (!visivel) document.getElementById('fabNewAppt').style.display = 'none';
  document.body.classList.toggle('is-login', !visivel);
  // Sem isto o Login carrega 100px de espaço reservado a uma nav que não
  // está na tela — e o cartão fica descentrado no eixo vertical.
  document.body.style.paddingBottom = visivel ? '' : '0';
}

// ── RBAC · papel resolvido no boot (18/08/2026) ───────────────
// Sempre pela RPC, nunca pela tabela: `app_accounts` não tem grant para o
// browser, e é isso que impede alguém de se promover editando a própria
// linha. Erro de rede ou papel desconhecido devolvem `null` e caem no
// fail-closed abaixo — negar por omissão é o comportamento correto aqui.
// Tratar falha como `staff` daria painel a quem talvez não devesse ter
// nenhum, e é exatamente o erro que este RBAC existe para não cometer.
async function resolverPapel() {
  try {
    const { data, error } = await sb.rpc('current_app_role');
    if (error) { console.error(error); return null; }
    return (data === 'owner' || data === 'staff') ? data : null;
  } catch (e) { console.error(e); return null; }
}

// Conta autenticada sem linha em `app_accounts`, ou com `active = false`.
// Não é erro de login: as credenciais valem: o que falta é concessão de
// acesso. Por isso a copy fala em liberar acesso e não em senha errada —
// mandar a pessoa tentar a senha de novo seria mentira.
//
// NENHUM dado chega à tela antes daqui: `loadAll()` só roda depois do papel
// resolvido, então esta tela não é uma aba escondida com dados por trás —
// é a ausência de painel. O "Sair" vive dentro do cartão porque
// `setAuthedChrome(false)` esconde o header inteiro, e sem ele a pessoa
// ficaria presa sem caminho para trocar de conta.
function renderSemAcesso() {
  setAuthedChrome(false);
  app.innerHTML = `
    <div class="login-screen">
      <div class="login-mark">
        <div class="wordmark">ORENZI</div>
        <div class="wordmark-sub">ATELIER</div>
      </div>
      <div class="login-card">
        <h1 class="login-title">Acesso não liberado</h1>
        <p class="login-note" role="status">Esta conta ainda não tem acesso ao painel. Peça para a Juliane liberar.</p>
        <button class="o-btn o-btn-secondary" type="button" id="semAcessoSair">Sair</button>
      </div>
    </div>`;
  const sair = document.getElementById('semAcessoSair');
  if (sair) sair.onclick = async () => {
    logoutIntencional = true;
    try { await sb.auth.signOut(); } catch (e) { /* sair é local de qualquer forma */ }
    state.role = undefined;
    encerrarSessaoUI({ expirada: false });
  };
}

function renderLogin(opts) {
  opts = opts || {};
  setAuthedChrome(false);
  // Nenhum texto entra por interpolação: o aviso nasce no markup, vazio e
  // hidden, e é preenchido por textContent logo abaixo. Mensagem de tela é
  // conteúdo, não HTML — e assim não existe caminho para injeção nenhuma.
  // `data-reveal` marca o que entra na passagem da splash (e só nela: sem
  // as classes de estado, esses atributos não pintam nada). O cartão entra
  // sem deslocamento próprio — com ele, cada filho subiria duas vezes.
  app.innerHTML = `
    <div class="login-screen">
      <div class="login-mark">
        <div class="wordmark">ORENZI</div>
        <div class="wordmark-sub">ATELIER</div>
      </div>
      <form class="login-card" id="loginForm" novalidate
            data-reveal style="--reveal-shift:0px">
        <h1 class="login-title" data-reveal>Entrar</h1>
        <p class="login-note" id="loginNote" role="status" hidden data-reveal></p>
        <div class="o-field" id="loginEmailField" data-reveal style="--reveal-delay:40ms">
          <label class="o-field-label" for="loginEmail">E-mail</label>
          <input class="o-input" type="email" id="loginEmail" name="email" required
                 autocomplete="username" inputmode="email" autocapitalize="none"
                 spellcheck="false" aria-describedby="loginError">
        </div>
        <div class="o-field" id="loginPasswordField" data-reveal style="--reveal-delay:80ms">
          <label class="o-field-label" for="loginPassword">Senha</label>
          <input class="o-input" type="password" id="loginPassword" name="password" required
                 autocomplete="current-password" aria-describedby="loginError">
        </div>
        <p class="login-form-error" id="loginError" role="alert" hidden data-reveal></p>
        <button class="o-btn o-btn-primary" type="submit" id="loginBtn"
                data-reveal style="--reveal-delay:120ms">Entrar</button>
      </form>
    </div>
  `;
  // A passagem compartilhada pertence ao BOOT, e só a ele: se a splash
  // ainda está no ar, o Login nasce invisível e espera por ela. Logout e
  // sessão expirada desenham a tela pronta — repetir a abertura de marca
  // ali seria uma splash falsa, e o Raphael foi explícito sobre isso.
  if (!splashState.done && document.getElementById('splash')) {
    document.querySelector('.login-screen').classList.add('is-preparing');
  }
  if (opts.expirada) {
    const nota = document.getElementById('loginNote');
    nota.textContent = LOGIN_MSG_EXPIRADA;
    nota.hidden = false;
  }
  const form = document.getElementById('loginForm');
  // `submit` (e não onclick do botão) é o que faz o Enter funcionar em
  // qualquer um dos dois campos, de graça e sem handler de teclado.
  form.addEventListener('submit', submeterLogin);
  // Digitar é a correção do erro: apaga a mensagem e a borda vermelha no
  // primeiro toque, sem esperar o próximo envio. O aviso de sessão
  // expirada NÃO é afetado — é contexto, não erro do que se está fazendo.
  form.addEventListener('input', loginLimparErro);
}

// Só o #loginError e os atributos ARIA mudam — o formulário fica de pé,
// com o e-mail preservado. `campos` recebe os ids que ficam inválidos:
// numa credencial errada são os dois, num campo vazio é só ele.
function loginErro(msg, opts) {
  opts = opts || {};
  const el = document.getElementById('loginError');
  if (!el) return;
  // textContent, nunca innerHTML: mensagem de erro é conteúdo dinâmico.
  el.textContent = msg;
  el.hidden = false;
  (opts.campos || []).forEach(id => {
    const campo = document.getElementById(id);
    if (campo) campo.setAttribute('aria-invalid', 'true');
    const field = document.getElementById(id + 'Field');
    if (field) field.classList.add('o-field-error');
  });
  if (opts.limparSenha) {
    const senha = document.getElementById('loginPassword');
    if (senha) senha.value = '';
  }
  if (opts.focar) {
    const alvo = document.getElementById(opts.focar);
    if (alvo) alvo.focus();
  }
}

function loginLimparErro() {
  const el = document.getElementById('loginError');
  if (el) { el.textContent = ''; el.hidden = true; }
  ['loginEmail', 'loginPassword'].forEach(id => {
    const campo = document.getElementById(id);
    if (campo) campo.removeAttribute('aria-invalid');
    const field = document.getElementById(id + 'Field');
    if (field) field.classList.remove('o-field-error');
  });
}

async function submeterLogin(ev) {
  ev.preventDefault();
  // Enter repetido, clique duplo e toque duplo caem todos aqui.
  if (loginEmCurso) return;
  const emailEl = document.getElementById('loginEmail');
  const senhaEl = document.getElementById('loginPassword');
  const btn = document.getElementById('loginBtn');
  const email = emailEl.value.trim();
  const senha = senhaEl.value;

  // Validação local antes de bater no servidor: campo vazio não merece uma
  // viagem de rede nem uma mensagem em inglês de volta.
  if (!email || !senha) {
    loginErro(LOGIN_MSG_VAZIO, {
      campos: [!email ? 'loginEmail' : null, !senha ? 'loginPassword' : null].filter(Boolean),
      focar: !email ? 'loginEmail' : 'loginPassword',
    });
    return;
  }

  loginEmCurso = true;
  loginLimparErro();
  orenziUI.setButtonBusy(btn, 'Entrando…');
  emailEl.disabled = true;
  senhaEl.disabled = true;

  let error = null;
  try {
    const r = await sb.auth.signInWithPassword({ email, password: senha });
    error = (r && r.error) || null;
  } catch (e) {
    error = e || new Error('falha de rede');
  }

  if (!error) {
    // Sucesso: o botão FICA busy de propósito. Quem troca a tela é
    // checkSession(), e devolver o botão ao normal aqui daria um piscar de
    // "pronto pra clicar de novo" logo antes de tudo ser substituído.
    // Chamada direta em vez de esperar SIGNED_IN — o evento também chega,
    // e a guarda de state.painelAtivo impede o loadAll() duplicado.
    loginEmCurso = false;
    checkSession();
    return;
  }

  loginEmCurso = false;
  emailEl.disabled = false;
  senhaEl.disabled = false;
  orenziUI.resetButton(btn);

  // A mensagem do Supabase nunca vai para a tela — só decide qual copy
  // nossa aparece. Rede fora e credencial errada pedem ações diferentes.
  const bruta = String((error && error.message) || '');
  const falhaDeRede = !navigator.onLine || /fetch|network|timeout/i.test(bruta) ||
                      (error && error.name === 'AuthRetryableFetchError');
  if (falhaDeRede) {
    loginErro(LOGIN_MSG_REDE, { focar: 'loginBtn' });
    return;
  }
  // Senha limpa e foco nela: o e-mail costuma estar certo, e é a senha que
  // precisa ser redigitada. O e-mail é preservado sempre.
  loginErro(LOGIN_MSG_CREDENCIAL, {
    campos: ['loginEmail', 'loginPassword'],
    focar: 'loginPassword',
    limparSenha: true,
  });
}

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    // Guarda contra entrada dupla: onAuthStateChange emite SIGNED_IN durante
    // o boot do supabase-js (já documentado no ciclo da splash) e chamaria
    // isto de novo — com loadAll() junto, que são 8 consultas.
    if (state.painelAtivo) return;
    state.painelAtivo = true;
    // Quem registrou a movimentação. Só existe uma conta hoje, mas o histórico
    // guarda o nome mesmo assim — sem isso, "quem tirou 2 luvas?" fica sem
    // resposta no dia em que houver uma segunda pessoa.
    const email = (session.user && session.user.email) || '';
    const apelido = email.split('@')[0].replace(/[._-]+/g, ' ').trim();
    state.userLabel = apelido ? apelido.charAt(0).toUpperCase() + apelido.slice(1) : 'Painel';
    // ── RBAC: o papel e resolvido ANTES de qualquer dado entrar na tela.
    // A ordem importa. `loadAll()` sao 8 consultas e a Home desenha no
    // `finally`; resolver o papel depois deixaria a assistente ver o painel
    // montado com o rodape completo por uma fracao de segundo — e vazamento
    // de fracao de segundo continua sendo vazamento. Sem papel, nada carrega.
    const papel = await resolverPapel();
    if (!papel) { renderSemAcesso(); markReady('READY_PANEL'); return; }
    state.role = papel;
    setAuthedChrome(true);
    aplicarNavPorPapel();
    // O painel ainda não tem dado nenhum. Enquanto isso a Home não pode
    // afirmar "Nenhum atendimento hoje" — o que se sabe é que ainda não se
    // sabe. loadAll() desliga no `finally`.
    state.booting = true;
    loadAll();
  } else {
    state.painelAtivo = false;
    renderLogin();
    markReady('READY_LOGIN');
  }
}

// Caminho central de fim de sessão — um só para os dois motivos (tocou em
// "Sair" ou a sessão morreu), porque a limpeza é idêntica e só a copy muda.
//
// O que ele limpa, e por que o Login sozinho não bastava: renderLogin()
// troca só o #app, e tanto o #modalContainer quanto o diálogo do DS são
// IRMÃOS dele — um wizard aberto ou um confirm continuavam por cima da tela
// de entrar. O quiosque do Questionário é o terceiro caso: ele esconde
// header e nav por conta própria, e sem desligá-lo a volta traria um painel
// sem chrome nenhum.
//
// A aba (state.tab) é preservada de propósito: ao entrar de novo, a Juliane
// volta para onde estava. Conteúdo não salvo de formulário ou wizard NÃO é
// preservado — e a tela não promete que seja.
function encerrarSessaoUI(opts) {
  opts = opts || {};
  if (!state.painelAtivo) return;
  state.painelAtivo = false;
  state.booting = false;
  // O papel morre com a sessao. Sem isto, entrar com OUTRA conta na mesma
  // aba herdaria o papel da anterior ate o proximo resolverPapel() voltar.
  state.role = undefined;
  closeModal();
  document.querySelectorAll('.o-dialog-overlay').forEach(el => el.remove());
  setKioskMode(false);
  renderLogin({ expirada: !!opts.expirada });
  window.scrollTo(0, 0);
}

// Gancho central de sessão expirada nas ESCRITAS. Toda escrita autenticada
// do painel termina com `.select()` e, quando a RLS não toca linha nenhuma,
// mostra um toast terminado em "faça login novamente." — este é o único
// ponto por onde todas passam, e é por isso que ele está aqui em vez de
// espalhado por 14 handlers.
//
// A string não decide nada: ela só dispara uma CONFIRMAÇÃO real em
// getSession(). Se a sessão estiver viva, nada acontece. Se a copy mudar um
// dia, o pior caso é voltar ao comportamento antigo (toast sem caminho de
// volta) — nunca um logout falso.
async function confirmarSessaoExpirada() {
  if (!state.painelAtivo) return;
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session) return;
  } catch (e) {
    return; // falha de rede não é sessão expirada
  }
  encerrarSessaoUI({ expirada: true });
}

document.getElementById('logoutBtn').onclick = async () => {
  logoutIntencional = true;
  try { await sb.auth.signOut(); } catch (e) { /* sair é local de qualquer forma */ }
  encerrarSessaoUI({ expirada: false });
};

sb.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_IN') checkSession();
  if (event === 'SIGNED_OUT') {
    // Só é "expirou" quando ninguém pediu para sair. O clique em "Sair"
    // marca a intenção antes de chamar signOut().
    const expirada = !logoutIntencional;
    logoutIntencional = false;
    encerrarSessaoUI({ expirada });
  }
});

// Substitui o formulário único por um assistente guiado de 5 etapas —

// (nunca outro modal/popup: sub-telas como "Novo cliente" também deslizam

// `appointments` continuam exatamente as mesmas de antes; só a experiência
// mudou. `wiz` é recriado a cada abertura — não sobrevive ao fechar.
const modalContainer = document.getElementById('modalContainer');

};

// `source`/`slotStart`/`slotEnd` são o contexto de entrada, integrados a
// este mesmo objeto (nunca uma variável global solta): 'button' é o modo
// normal (5 etapas, Data incluída); 'free-slot' é o modo contextual aberto
// a partir do card "Xh livres" da Agenda (4 etapas, sem Data), com
// slotStart/slotEnd em ms epoch marcando o buraco real clicado — usados só
// pra filtrar os horários da etapa Horário, nunca pra recalcular disponibilidade.
function newWizState(prefillDate, prefillTime, freeSlot) {
  const ativos = profissionaisAtivos();
  const base = prefillDate ? new Date(`${prefillDate}T00:00:00`) : new Date();
  return {

    slotEnd: freeSlot ? freeSlot.end : null,

}

// ── Motor da folha de tela cheia (13/08/2026) ────────────────
// Corrige a semântica de movimento: subir do rodapé é o gesto de ENTRAR no
// fluxo, e só isso. Antes, toda troca de tela e toda etapa do wizard
// recriavam o sheet inteiro e reaplicavam bottom→top, então cada passo
// parecia uma modal nova abrindo em cima da anterior.
//
// Agora há três movimentos distintos, cada um dizendo uma coisa diferente:
//   entrar no fluxo   → vertical  (bottom→top), uma única vez
//   navegar dentro    → horizontal (avançar ←, voltar →), navigation stack
//   sair do fluxo     → vertical  (top→bottom)
//
// O shell (fundo, altura, largura) fica parado o tempo todo; quem desliza é
// o palco `.o-fullsheet-stage`, que carrega head + body + footer de uma tela.
const FULLSHEET_NAV_MS = 260;

function fullSheetEl() {
  return modalContainer.querySelector('.o-fullsheet, .o-wizard-sheet');
}
function fullSheetIsOpen() { return !!fullSheetEl(); }

// Única porta de entrada com movimento vertical. `drawFn` desenha a tela.
function openFullSheet(drawFn) {
  drawFn();
  if (prefersReducedMotion()) return;
  const sheet = fullSheetEl();
  if (!sheet) return;
  sheet.classList.add('is-entering');
  const limpar = () => sheet.classList.remove('is-entering');
  sheet.addEventListener('animationend', limpar, { once: true });
  // Rede de segurança: em aba sem composição a animação não corre e o
  // `animationend` nunca dispara — mesma armadilha já documentada em
  // morphAvatar(). A classe presa não quebraria nada, mas re-animaria numa
  // eventual volta de foco.
  setTimeout(limpar, 600);
}

// Navegação interna: o palco antigo sai, o novo entra, o shell não se mexe.
// `direction` é 'forward' (avançar) ou 'back' (voltar).
// O clone é tirado ANTES de drawFn() e anexado DEPOIS — drawFn reescreve o
// modalContainer inteiro, e o palco antigo morreria junto (mesma lição de
// slidePane() na Agenda).
function fullSheetNavigate(direction, drawFn) {
  const palcoAntigo = modalContainer.querySelector('.o-fullsheet-stage');
  if (!palcoAntigo || prefersReducedMotion()) { drawFn(); return; }

  const clone = palcoAntigo.cloneNode(true);
  // O clone é decorativo: sem ids duplicados (quebrariam getElementById da
  // tela nova) e invisível para leitor de tela.
  clone.removeAttribute('id');
  clone.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));
  clone.setAttribute('aria-hidden', 'true');

  drawFn();

  const sheet = fullSheetEl();
  const palcoNovo = modalContainer.querySelector('.o-fullsheet-stage');
  if (!sheet || !palcoNovo) return;

  clone.classList.add('is-sliding');
  palcoNovo.classList.add('is-sliding');
  sheet.appendChild(clone);

  const avancar = direction !== 'back';
  const entrada = avancar ? 'pageInFromRight' : 'pageInFromLeft';
  const saida = avancar ? 'pageOutToLeft' : 'pageOutToRight';
  const easing = 'cubic-bezier(0, 0, .2, 1)';   // --ease-out
  palcoNovo.style.animation = `${entrada} ${FULLSHEET_NAV_MS}ms ${easing}`;
  clone.style.animation = `${saida} ${FULLSHEET_NAV_MS}ms ${easing} forwards`;

  let limpo = false;
  const limpar = () => {
    if (limpo) return;
    limpo = true;
    clone.remove();
    palcoNovo.classList.remove('is-sliding');
    palcoNovo.style.animation = '';
  };
  palcoNovo.addEventListener('animationend', limpar, { once: true });
  setTimeout(limpar, FULLSHEET_NAV_MS + 240);
}

// Fecha com o movimento inverso da entrada. `closeModal()` continua sendo o
// caminho seco (usado quando outra tela toma o lugar, ou em reduced motion).
function closeFullSheet() {
  const sheet = fullSheetEl();
  const overlay = document.getElementById('modalOverlay');
  if (!sheet || prefersReducedMotion()) { closeModal(); return; }
  sheet.classList.add('is-leaving');
  if (overlay) overlay.classList.add('is-leaving');
  let fechado = false;
  const fechar = () => { if (fechado) return; fechado = true; closeModal(); };
  sheet.addEventListener('animationend', fechar, { once: true });
  setTimeout(fechar, 500);
}

// ── Bloqueio manual de agenda ────────────────────────────────

// Só os campos que dependem do tipo de bloqueio. Tudo acima do segmented
// (cabeçalho, data, o próprio segmented) fica fora daqui de propósito — é o

function blockDynamicFieldsHtml() {

function blockCtaLabel() {
  const f = blockForm;
  return f.id ? 'Salvar alterações' : (f.allDay ? 'Bloquear dia' : 'Bloquear horário');
}

// Troca do segmented: NÃO re-renderiza a folha (era isso que disparava um
// slide vertical da tela inteira a cada toque). Move o indicador, troca só a
// região dinâmica e anima a altura de um valor medido para o outro — `auto`
// não interpola, e sem isso o rodapé daria um salto.
function setBlockAllDay(valor) {
  const f = blockForm;
  if (f.allDay === valor) return;
  f.allDay = valor;

  const thumb = document.querySelector('.blk-seg-thumb');
  if (thumb) thumb.classList.toggle('is-right', valor);
  document.querySelectorAll('#blkAllDayToggle button').forEach(btn => {
    const ativo = (btn.dataset.val === '1') === valor;
    btn.classList.toggle('is-active', ativo);
    btn.setAttribute('aria-pressed', String(ativo));
  });

  const cta = document.getElementById('blkSave');
  if (cta) cta.textContent = blockCtaLabel();

  const zona = document.getElementById('blkDynamic');
  if (!zona) return;
  if (prefersReducedMotion()) { zona.innerHTML = blockDynamicFieldsHtml(); bindBlockDynamicFields(); return; }

  const alturaAntes = zona.offsetHeight;
  zona.style.height = alturaAntes + 'px';
  zona.innerHTML = blockDynamicFieldsHtml();
  bindBlockDynamicFields();
  const alturaDepois = zona.firstElementChild ? zona.firstElementChild.offsetHeight : 0;
  // Reflow síncrono de propósito: requestAnimationFrame não dispara em aba
  // sem composição e a altura ficaria presa no valor antigo — mesma
  // armadilha já documentada no dropdown do diagnóstico da cliente.
  void zona.offsetHeight;
  zona.style.height = alturaDepois + 'px';

  let solto = false;
  const soltar = () => {
    if (solto) return;
    solto = true;
    zona.style.height = 'auto';   // preso em px, cortaria se o texto quebrasse
  };
  zona.addEventListener('transitionend', soltar, { once: true });
  setTimeout(soltar, 400);
}

// Rebinda os campos que vivem na região dinâmica — eles nascem de novo a
// cada troca de tipo, então os handlers antigos morrem com o innerHTML.
function bindBlockDynamicFields() {
  const f = blockForm;
  const startEl = document.getElementById('blkStart');
  const endEl = document.getElementById('blkEnd');
  if (startEl) startEl.onchange = (e) => { f.startTime = e.target.value; };
  if (endEl) endEl.onchange = (e) => { f.endTime = e.target.value; };
  const reasonEl = document.getElementById('blkReason');
  if (reasonEl) reasonEl.oninput = (e) => { f.reason = e.target.value; };
}

function renderBlockModal() {

  modalContainer.innerHTML = `
    <div class="modal-overlay is-fullsheet" id="modalOverlay">
      <div class="o-fullsheet" role="dialog" aria-modal="true" aria-label="${f.id ? 'Editar bloqueio' : 'Bloquear horário'}">
        <div class="o-fullsheet-stage">
          <div class="o-fullsheet-head">
            ${voltarAoMenu ? `<button class="o-icon-btn o-wizard-back" id="blkBack" aria-label="Voltar">${ICONS.chevron}</button>` : ''}
            <div class="o-fullsheet-titles">
              <div class="o-fullsheet-title">${f.id ? 'Editar bloqueio' : 'Bloquear horário'}</div>
              <div class="o-fullsheet-subtitle">Defina um período indisponível na agenda</div>

            <button class="o-icon-btn" id="modalClose" aria-label="Fechar">${ICONS.close}</button>
          </div>

          <div class="o-fullsheet-body">
            <div class="blk-group">
              <div class="blk-group-label" id="blkDateLabel">Data</div>
              <div class="blk-row">
                <span class="blk-row-icon">${ICONS.calendar}</span>
                <span class="blk-row-label">Dia</span>
                <input type="date" id="blkDate" value="${f.date}" aria-labelledby="blkDateLabel">
              </div>
            </div>

            ${ativos.length > 1 ? `
            <div class="blk-group">
              <div class="blk-group-label" id="blkStaffLabel">Profissional</div>
              <select class="o-select" id="blkStaff" aria-labelledby="blkStaffLabel">
                ${ativos.map(s => `<option value="${s.id}" ${s.id === f.staffId ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}
              </select>
            </div>` : ''}

            <div class="blk-group">
              <div class="blk-group-label" id="blkTipoLabel">Tipo de bloqueio</div>
              <div class="blk-seg" id="blkAllDayToggle" role="group" aria-labelledby="blkTipoLabel">
                <span class="blk-seg-thumb ${f.allDay ? 'is-right' : ''}" aria-hidden="true"></span>
                <button type="button" data-val="0" class="${!f.allDay ? 'is-active' : ''}" aria-pressed="${!f.allDay}">Horário específico</button>
                <button type="button" data-val="1" class="${f.allDay ? 'is-active' : ''}" aria-pressed="${f.allDay}">Dia inteiro</button>
              </div>
            </div>

            <!-- Tudo daqui pra baixo troca com o segmented; tudo acima fica
                 parado. É a fronteira que garante zero movimento no topo. -->
            <div class="blk-dynamic" id="blkDynamic">${blockDynamicFieldsHtml()}</div>

            ${f.error ? `<div class="blk-error" role="alert">${esc(f.error)}</div>` : ''}
          </div>

          <div class="o-fullsheet-footer">
            <button class="o-btn o-btn-primary" id="blkSave">${blockCtaLabel()}</button>
            ${f.id ? `<button class="o-btn o-btn-destructive" id="blkDelete">Remover bloqueio</button>` : ''}
            <button class="o-btn o-btn-ghost" id="blkCancel">Cancelar</button>
          </div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('blkCancel').onclick = closeFullSheet;
  document.getElementById('modalClose').onclick = closeFullSheet;
  document.getElementById('modalOverlay').onclick = (e) => { if (e.target.id === 'modalOverlay') closeFullSheet(); };
  const backBtn = document.getElementById('blkBack');
  if (backBtn) backBtn.onclick = () => { blockForm = null; fullSheetNavigate('back', paintAgendaAddMenu); };
  document.getElementById('blkDate').onchange = (e) => { f.date = e.target.value; };
  const staffSel = document.getElementById('blkStaff');
  if (staffSel) staffSel.onchange = (e) => { f.staffId = e.target.value; };
  // O toggle NÃO re-renderiza a folha (era isso que deslizava a tela inteira
  // pra cima a cada toque): setBlockAllDay() move o indicador e troca só a
  // região dinâmica.
  document.querySelectorAll('#blkAllDayToggle button').forEach(btn => {
    btn.onclick = () => setBlockAllDay(btn.dataset.val === '1');
  });
  bindBlockDynamicFields();
  document.getElementById('blkSave').onclick = saveScheduleBlock;
  const delBtn = document.getElementById('blkDelete');
  if (delBtn) delBtn.onclick = () => { const id = f.id; closeModal(); confirmDeleteScheduleBlock(id); };
}

// Mesma convenção de horário do resto do painel: componentes LOCAIS do
// aparelho, não salonTimeToInstant() — o painel roda com a Juliane
// fisicamente em Dublin, não no telefone de uma cliente em outro fuso (essa
// é a armadilha que salonTimeToInstant existe pra evitar em agendar.html).
// "Dia inteiro" é literalmente 00:00 do dia escolhido até 00:00 do dia
// seguinte, nunca 09:00-18:00: se o expediente mudar no futuro, um bloqueio
// de dia inteiro continua significando dia inteiro.
async function saveScheduleBlock() {
  const f = blockForm;
  const btn = document.getElementById('blkSave');
  if (!f.staffId || !f.date) { f.error = 'Selecione data e profissional.'; renderBlockModal(); return; }

  let startsAt, endsAt;
  if (f.allDay) {
    startsAt = new Date(`${f.date}T00:00:00`);
    endsAt = new Date(startsAt.getTime() + 86400000);
  } else {
    if (!f.startTime || !f.endTime) { f.error = 'Informe início e fim.'; renderBlockModal(); return; }
    const [sh, sm] = f.startTime.split(':').map(Number);
    const [eh, em] = f.endTime.split(':').map(Number);
    startsAt = new Date(`${f.date}T00:00:00`); startsAt.setHours(sh, sm, 0, 0);
    endsAt = new Date(`${f.date}T00:00:00`); endsAt.setHours(eh, em, 0, 0);
    if (endsAt <= startsAt) { f.error = 'O fim precisa ser depois do início.'; renderBlockModal(); return; }
  }

  orenziUI.setButtonBusy(btn, f.id ? 'Salvando…' : 'Bloqueando…');
  const payload = {
    staff_id: f.staffId,
    starts_at: startsAt.toISOString(),
    ends_at: endsAt.toISOString(),
    all_day: f.allDay,
    reason: f.reason.trim() || null,
  };
  const query = f.id
    ? sb.from('schedule_blocks').update(payload).eq('id', f.id).select('id')
    : sb.from('schedule_blocks').insert(payload).select('id');
  const { data, error } = await query;

  if (error || !data || !data.length) {
    orenziUI.resetButton(btn);
    // 23P01 é o mesmo código que BOOKING_CONFLICT usa pra appointment — aqui
    // é schedule_blocks_guard_conflict() recusando por causa de um
    // atendimento existente (ver migration schedule_blocks_foundation).
    if (error?.code === '23P01') {
      f.error = error.details || 'Já existe atendimento nesse horário. Resolva o agendamento antes de bloquear.';
    } else if (error) {
      console.error('schedule_blocks.save', error);
      f.error = 'Não foi possível salvar o bloqueio. Tente de novo.';
    } else {
      f.error = 'Não foi possível salvar — faça login novamente.';
    }
    renderBlockModal();
    return;
  }

  // Monta o registro a partir do que a própria tela já sabe (payload), não
  // do retorno cru do `.select()`: mesmo espírito de "o que aparece é o que
  // o painel já pôs no state antes de chamar" que o resto do app segue (ver
  // painel_demo.html) — o `.select()` real devolve as mesmas colunas de
  // volta, então não perde nada no banco real, e sobrevive ao mock do demo,
  // que só garante `data[0].id`.
  const saved = { id: (f.id || data[0].id), ...payload };
  if (f.id) {
    const idx = state.scheduleBlocks.findIndex(b => b.id === f.id);
    if (idx >= 0) state.scheduleBlocks[idx] = saved; else state.scheduleBlocks.push(saved);
  } else {
    state.scheduleBlocks.push(saved);
  }
  await orenziUI.setButtonSuccess(btn, f.id ? 'Salvo' : 'Bloqueado');
  closeModal();
  showToast(f.id ? 'Bloqueio atualizado' : 'Horário bloqueado');
  if (state.tab === 'agenda') renderAgenda(); else render();
}

// Toque num bloqueio (card parcial ou faixa de dia inteiro) — sheet simples,
// não a tela de Appointment Detail: é outra entidade, com outro conjunto de
// ações (Editar / Remover bloqueio, nunca "cancelar").
function openBlockDetailSheet(blockId) {
  const b = state.scheduleBlocks.find(x => x.id === blockId);
  if (!b) return;
  const dateLabel = fmtDate(b.starts_at);
  const timeLabel = b.all_day ? 'Dia inteiro' : `${fmtTime(b.starts_at)} – ${fmtTime(b.ends_at)}`;
  modalContainer.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-sheet">
        <h2>Bloqueio</h2>
        <div class="modal-section">
          <div class="block-detail-row">${ICONS.calendar}<span>${esc(dateLabel)}</span></div>
          <div class="block-detail-row">${ICONS.clock}<span>${esc(timeLabel)}</span></div>
          ${b.reason ? `<div class="block-detail-row">${ICONS.tag}<span>${esc(b.reason)}</span></div>` : ''}
        </div>
        <div class="blk-detail-actions">
          <button class="o-btn o-btn-primary" id="blkEditBtn">Editar</button>
          <button class="o-btn o-btn-destructive" id="blkRemoveBtn">Remover bloqueio</button>
          <button class="o-btn o-btn-ghost" id="modalClose">Fechar</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modalClose').onclick = closeModal;
  document.getElementById('modalOverlay').onclick = (e) => { if (e.target.id === 'modalOverlay') closeModal(); };
  document.getElementById('blkEditBtn').onclick = () => { closeModal(); openBlockModal(b); };
  document.getElementById('blkRemoveBtn').onclick = () => { closeModal(); confirmDeleteScheduleBlock(b.id); };
}

// Wording "Remover bloqueio", nunca "Cancelar" — não é appointment, é uma
// indisponibilidade que some. O horário volta a participar da
// disponibilidade assim que a linha sai de schedule_blocks (staff_work_blocks
// e get_busy_slots leem a tabela direto, sem cache).
function confirmDeleteScheduleBlock(blockId) {
  orenziUI.confirm({
    title: 'Remover bloqueio?',
    message: 'O horário volta a ficar disponível imediatamente.',
    confirmLabel: 'Remover bloqueio',
    destructive: true,
    successLabel: 'Removido',
    onConfirm: async () => {
      const { error } = await sb.from('schedule_blocks').delete().eq('id', blockId);
      if (error) { console.error('schedule_blocks.delete', error); throw new Error('Não foi possível remover o bloqueio. Tente de novo.'); }
      state.scheduleBlocks = state.scheduleBlocks.filter(x => x.id !== blockId);
      if (state.tab === 'agenda') renderAgenda(); else render();
    },
  });
}

function openNewApptModal() {
  wiz = newWizState(null, null);
  renderWizard();
}

// Aberto pelo toque no card de horário livre da Agenda — chega com o dia e
// o intervalo real (slotStartMs/slotEndMs) já resolvidos, então o wizard
// pula a etapa Data inteira (ver newWizState). O horário sugerido
// (preferredTime) só se confirma na etapa Horário, depois que o serviço
// escolhido define a duração.
function openNewApptModalAt(dateStr, timeStr, slotStartMs, slotEndMs) {
  const freeSlot = (Number.isFinite(slotStartMs) && Number.isFinite(slotEndMs))
    ? { start: slotStartMs, end: slotEndMs }
    : null;
  wiz = newWizState(dateStr, timeStr, freeSlot);
  renderWizard();
}

// Blocos ocupados da profissional no dia — só o trabalho (wb/wa), a pausa
// fica de fora de propósito, igual a RPC get_busy_slots que o agendar.html
// usa: durante a pausa a profissional está livre pra atender outra cliente.
function busyBlocksForStaffOnDate(staffId, dayDate) {
  const apptBlocks = state.appointments
    .filter(a => a.staff?.id === staffId && a.status !== 'cancelled' && sameDay(new Date(a.starts_at), dayDate))
    .flatMap(a => {
      const seg = segmentsOf(a);
      const start = new Date(a.starts_at);
      const end = new Date(a.ends_at);
      const blocks = [];
      if (seg.wb > 0) blocks.push([start, new Date(start.getTime() + seg.wb * 60000)]);
      if (seg.wa > 0) blocks.push([new Date(end.getTime() - seg.wa * 60000), end]);
      return blocks;
    });
  // Bloqueio manual é opaco — ocupa o intervalo inteiro, sem distinção de
  // trabalho/pausa. Mesmo espírito do UNION ALL de schedule_blocks dentro de
  // staff_work_blocks/get_busy_slots no banco (ver migration
  // schedule_blocks_availability_integration): aqui é a cópia em memória
  // que o modal de novo agendamento do painel lê.
  const blockBlocks = state.scheduleBlocks
    .filter(b => b.staff_id === staffId && scheduleBlockOverlapsDay(b, dayDate))
    .map(b => [new Date(b.starts_at), new Date(b.ends_at)]);

  // Hold de pagamento (14/08/2026): não aparece na agenda, mas OCUPA. Sem
  // isto o modal de novo agendamento ofereceria um horário que o banco vai
  // recusar — `staff_work_blocks` conta o hold vivo, e a Juliane levaria um
  // erro de conflito depois de preencher o formulário inteiro.
  // Opaco por inteiro, como um bloqueio manual: um hold nunca tem pausa.
  const holdBlocks = (state.paymentHolds || [])
    .filter(h => h.staff?.id === staffId && sameDay(new Date(h.starts_at), dayDate))
    .map(h => [new Date(h.starts_at), new Date(h.ends_at)]);

  return apptBlocks.concat(blockBlocks, holdBlocks);
}

function scheduleBlockOverlapsDay(b, dayDate) {
  const dayStart = new Date(dayDate); dayStart.setHours(0, 0, 0, 0);
  const dayEnd = new Date(dayStart.getTime() + 86400000);
  return new Date(b.starts_at) < dayEnd && new Date(b.ends_at) > dayStart;
}

// Bloqueios que tocam o dia (dia inteiro ou parcial), independente da
// profissional — mesma simplificação que dayAppts já assume em
// computeFreeGaps (só a Juliane atende hoje; ver profissionaisAtivos()).
function scheduleBlocksForDay(dayDate) {
  return state.scheduleBlocks.filter(b => scheduleBlockOverlapsDay(b, dayDate));
}

// Horários "HH:MM" livres pra um serviço, profissional e dia — mesma regra
// do agendar.html (expediente + grade de 30 min), só que lendo
// state.appointments direto em vez de RPC, já que aqui a sessão é
// autenticada e os dados já estão carregados.
function computeAvailableSlots(staffId, dateStr, durationMin) {
  if (!staffId || !dateStr || !durationMin) return [];
  const dayDate = new Date(`${dateStr}T00:00:00`);
  const busy = busyBlocksForStaffOnDate(staffId, dayDate);

  const slots = [];
  for (let m = OPEN_HOUR * 60; m + durationMin <= CLOSE_HOUR * 60; m += SLOT_MINUTES) {
    const slotStart = new Date(dayDate);
    slotStart.setHours(0, m, 0, 0); // setHours rola o overflow de minuto pra hora sozinho
    const slotEnd = new Date(slotStart.getTime() + durationMin * 60000);
    const overlaps = busy.some(([bs, be]) => slotStart < be && slotEnd > bs);
    if (!overlaps) {
      const hh = String(Math.floor(m / 60)).padStart(2, '0');
      const mm = String(m % 60).padStart(2, '0');
      slots.push(`${hh}:${mm}`);
    }
  }
  return slots;
}

// Nível de disponibilidade de um dia pro calendário da Etapa 3 (indicador
// verde/amarelo/cinza/vermelho) — só calculável depois que o serviço
// (duração) já foi escolhido na Etapa 2. `null` = ainda não dá pra saber.
function dayAvailabilityLevel(dateStr, staffId, durationMin) {
  const d = new Date(`${dateStr}T00:00:00`);
  if (!isSalonOpenDay(d)) return 'indisponivel';
  if (!staffId || !durationMin) return null;
  const total = Math.max(1, Math.floor((CLOSE_HOUR - OPEN_HOUR) * 60 / SLOT_MINUTES));
  const slots = computeAvailableSlots(staffId, dateStr, durationMin);
  if (!slots.length) return 'nenhum';
  if (slots.length / total <= 0.3) return 'poucos';
  return 'muitos';
}

function wizClient() { return state.clients.find(c => c.id === wiz.clientId) || null; }
function wizService() { return state.services.find(s => s.id === wiz.serviceId) || null; }
function wizStaffId() {
  if (wiz.staffId) return wiz.staffId;
  const ativos = profissionaisAtivos();
  return ativos.length === 1 ? ativos[0].id : null;
}
function wizStaff() { return state.staff.find(s => s.id === wizStaffId()) || null; }

// ── Modo de entrada (Fase 2b) ─────────────────────────────────────────
// Duas etapas (Cliente, Serviço) são sempre 1 e 2 nos dois modos — só o que
// vem depois muda de número de tela conforme wiz.source, por isso o
// dispatch é por NOME de etapa (wizStepName), não por número cru. Isso
// evita ter duas tabelas de step separadas: normal e contextual compartilham
// o mesmo `wiz.step` incremental, só a leitura difere.
const WIZ_TOTAL_STEPS = 5;
const WIZ_TOTAL_STEPS_CONTEXTUAL = 4;
function wizIsContextual() { return wiz.source === 'free-slot'; }
function wizTotalSteps() { return wizIsContextual() ? WIZ_TOTAL_STEPS_CONTEXTUAL : WIZ_TOTAL_STEPS; }
function wizStepName() {
  if (wiz.step === 1) return 'client';
  if (wiz.step === 2) return 'service';
  if (wizIsContextual()) return wiz.step === 3 ? 'time' : 'confirm';
  if (wiz.step === 3) return 'date';
  return wiz.step === 4 ? 'time' : 'confirm';
}

// "Alterar" (banner de contexto) e "Escolher outra data" (etapa Horário,
// quando o serviço não cabe no intervalo) fazem exatamente a mesma coisa:
// voltam ao fluxo completo de 5 etapas a partir de Data, sem perder
// cliente/serviço já escolhidos. Depois de nova data, o fluxo segue normal
// (wizGoToStep(4) do calendário já aponta pra Horário no modo de 5 etapas).
function wizSwitchToFullFlowAtDate() {
  wiz.source = 'button';
  wiz.slotStart = null;
  wiz.slotEnd = null;
  wiz.time = null;
  wizGoToStep(3);
}

function wizContextBannerHtml() {
  if (!wizIsContextual()) return '';
  const [y, m, d] = wiz.date.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const dateLabel = `${WEEKDAY_FULL_LABELS[(dt.getDay() + 6) % 7]}, ${dt.getDate()} ${MONTH_ABBR[dt.getMonth()]}`;
  const hasInterval = wiz.slotStart && wiz.slotEnd;
  const timeLabel = hasInterval
    ? `${new Date(wiz.slotStart).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}–${new Date(wiz.slotEnd).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`
    : '';
  const spoken = `Agendando em ${dateLabel}${timeLabel ? `, ${timeLabel}` : ''}`;
  return `
    <div class="o-wizard-context-banner" role="note" aria-label="${spoken}">
      <div class="o-wizard-context-banner-text" aria-hidden="true">
        Agendando em <b>${dateLabel}</b>${timeLabel ? `<br>${timeLabel}` : ''}
      </div>
      <button class="o-btn o-btn-ghost o-btn-inline" id="wizContextAlterBtn" type="button">Alterar</button>
    </div>
  `;
}

// Desenha o SHELL do wizard (cabeçalho, dots, palco vazio). Chamada só ao
// entrar no fluxo — nunca na troca de etapa, que agora é paintWizStep() +
// updateWizChrome(). Era essa chamada por etapa que reaplicava bottom→top e
// fazia cada passo parecer uma modal nova.
function paintWizardShell() {
  const total = wizTotalSteps();
  modalContainer.innerHTML = `
    <div class="modal-overlay is-fullsheet" id="modalOverlay">
      <div class="o-wizard-sheet" role="dialog" aria-modal="true" aria-label="Novo agendamento">
        <div class="o-fullsheet-stage">
          <div class="o-wizard-head">
            <button class="o-icon-btn o-wizard-back" id="wizBack" aria-label="Voltar"
              style="visibility:${wizCanGoBack() ? 'visible' : 'hidden'}">${ICONS.chevron}</button>
            <div class="o-wizard-titles"></div>
            <button class="o-icon-btn" id="wizCloseBtn" aria-label="Fechar">${ICONS.close}</button>
          </div>
          <div class="o-wizard-dots" id="wizDots" role="progressbar" aria-valuemin="1" aria-valuemax="${total}"
            aria-valuenow="${wiz.step}" aria-label="Etapa ${wiz.step} de ${total}">
            ${Array.from({ length: total }, (_, i) => i + 1).map(n => `
              <span class="o-wizard-dot ${n === wiz.step ? 'is-active' : ''} ${n < wiz.step ? 'is-done' : ''}"></span>
            `).join('')}
          </div>
          ${wizContextBannerHtml()}
          <div class="o-wizard-body" id="wizBody"></div>
          <div class="o-wizard-footer" id="wizFooter"></div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('wizCloseBtn').onclick = closeFullSheet;
  document.getElementById('modalOverlay').onclick = (e) => { if (e.target.id === 'modalOverlay') closeFullSheet(); };
  document.getElementById('wizBack').onclick = wizGoBack;
  const alterBtn = document.getElementById('wizContextAlterBtn');
  if (alterBtn) alterBtn.onclick = wizSwitchToFullFlowAtDate;
  paintWizStep();
}

// Compatibilidade: quem chamava renderWizard() para ABRIR o fluxo continua
// funcionando, agora com a entrada vertical no lugar certo.
function renderWizard() {
  if (fullSheetIsOpen()) { paintWizardShell(); return; }
  openFullSheet(paintWizardShell);
}

// Há para onde voltar? Dentro do wizard, ou de volta ao menu do + quando foi
// por ele que se chegou aqui.
function wizCanGoBack() {
  return !!(wiz && (wiz.step > 1 || wiz.sub || wiz.fromMenu));
}

// Dots e botão de voltar são o "chrome" do wizard: mudam de estado a cada
// etapa, mas NÃO deslizam junto com o conteúdo — é o que dá a leitura de
// progresso contínuo dentro da mesma tela, em vez de telas empilhadas.
function updateWizChrome() {
  const total = wizTotalSteps();
  const dots = document.getElementById('wizDots');
  if (dots) {
    dots.setAttribute('aria-valuemax', total);
    dots.setAttribute('aria-valuenow', wiz.step);
    dots.setAttribute('aria-label', `Etapa ${wiz.step} de ${total}`);
    dots.innerHTML = Array.from({ length: total }, (_, i) => i + 1).map(n => `
      <span class="o-wizard-dot ${n === wiz.step ? 'is-active' : ''} ${n < wiz.step ? 'is-done' : ''}"></span>
    `).join('');
  }
  const back = document.getElementById('wizBack');
  if (back) back.style.visibility = wizCanGoBack() ? 'visible' : 'hidden';
}

function wizGoBack() {
  if (wiz.sub) { wiz.sub = null; wiz.back = true; paintWizStep(); updateWizChrome(); return; }
  if (wiz.step > 1) { wiz.step -= 1; wiz.back = true; paintWizStep(); updateWizChrome(); return; }
  // Etapa 1 e veio do menu: o voltar sai do wizard e devolve o menu,
  // deslizando para a direita — é o topo da pilha de navegação.
  if (wiz.fromMenu) { wiz = null; fullSheetNavigate('back', paintAgendaAddMenu); }
}

function wizGoToStep(n) {
  wiz.step = n; wiz.back = false; wiz.sub = null;
  paintWizStep();
  updateWizChrome();
}

// Preenche cabeçalho + corpo + rodapé da etapa atual. Chamada só na troca
// de etapa/sub-tela — buscas (cliente/serviço) atualizam apenas a própria
// lista via wizRenderClientList()/wizRenderServiceList(), nunca isto,
// senão o <input> perderia o foco a cada letra (mesma armadilha já
// documentada na lista de Clientes/Estoque).
function paintWizStep() {
  const titlesEl = document.querySelector('.o-wizard-titles');
  const bodyEl = document.getElementById('wizBody');
  const footEl = document.getElementById('wizFooter');
  if (!bodyEl) return;

  // Nome de etapa, não número cru: no modo contextual "3" é Horário, no
  // normal "3" é Data. wizStepName() é a única fonte dessa tradução.
  const name = wiz.sub === 'quickAddClient' ? null : wizStepName();
  let step;
  if (wiz.sub === 'quickAddClient') step = wizStepQuickAddClient();
  else if (name === 'client') step = wizStepClient();
  else if (name === 'service') step = wizStepService();
  else if (name === 'date') step = wizStepDate();
  else if (name === 'time') step = wizStepTime();
  else step = wizStepConfirm();

  titlesEl.innerHTML = `
    <div class="o-wizard-title">${step.title}</div>
    ${step.subtitle ? `<div class="o-wizard-subtitle">${step.subtitle}</div>` : ''}
  `;
  bodyEl.innerHTML = `<div class="o-wizard-step ${wiz.back ? 'is-back' : ''}">${step.bodyHtml}</div>`;
  footEl.innerHTML = step.footHtml || '';
  wiz.back = false;

  if (wiz.sub === 'quickAddClient') wizBindQuickAddClient();
  else if (name === 'client') wizBindStepClient();
  else if (name === 'service') wizBindStepService();
  else if (name === 'date') wizBindStepDate();
  else if (name === 'time') wizBindStepTime();
  else wizBindStepConfirm();
}

// ── Etapa 1 · Cliente ──────────────────────────────────────────
function wizRecentClients() {
  // "Clientes recentes" = últimos 6 pela última visita; sem histórico
  // nenhum entra por cadastro mais novo, pra lista nunca ficar vazia à toa.
  return state.clients
    .map(c => ({ c, lastVisitIso: clientStats(c.id).lastVisitIso }))
    .sort((a, b) => {
      if (a.lastVisitIso && b.lastVisitIso) return new Date(b.lastVisitIso) - new Date(a.lastVisitIso);
      if (a.lastVisitIso) return -1;
      if (b.lastVisitIso) return 1;
      return new Date(b.c.created_at || 0) - new Date(a.c.created_at || 0);
    })
    .slice(0, 6)
    .map(r => r.c);
}
function wizFilteredClients() {
  const q = (wiz.clientQuery || '').trim().toLowerCase();
  if (!q) return null; // null = mostra "recentes" em vez de resultado de busca
  return state.clients.filter(c => `${c.name || ''} ${c.phone || ''}`.toLowerCase().includes(q));
}

    const { data: clientId, error } = await sb.rpc('find_or_create_client', {
