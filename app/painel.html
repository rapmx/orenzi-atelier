// ── Evolução da receita: componente de gráfico único e persistente ───
// Sempre trabalhamos com os 12 meses "por baixo do capó"; o modo 6 meses é só
// um estado visual (6 pontos escondidos) — trocar de modo nunca troca o SVG,
// só anima os mesmos elementos entre dois estados.
const TREND_FULL_MONTHS = 12;
const TREND_SHORT_MONTHS = 6;
const TREND_W = 320, TREND_H = 106, TREND_TOP_PAD = 26, TREND_BOTTOM_PAD = 10;
let trendFullHistoryCache = null;

function trendXAt(count, idx) {
  return count > 1 ? (idx / (count - 1)) * TREND_W : TREND_W / 2;
}
function trendYAt(value, maxValue) {
  const chartH = TREND_H - TREND_TOP_PAD - TREND_BOTTOM_PAD;
  return TREND_TOP_PAD + (1 - value / Math.max(1, maxValue)) * chartH;
}
function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

// Posição de cada mês (índice 0..11 do histórico completo) dentro de um
// determinado "modo" (6 ou 12 meses visíveis). Os 6 mais recentes (índices
// 6..11) existem nos dois modos e só mudam de x; os 6 mais antigos (0..5)
// só existem fisicamente no modo de 12 meses.
function trendPosFor(fullHistory, idx, visibleMonths, maxValue) {
  const fullCount = fullHistory.length;
  const addedCount = fullCount - TREND_SHORT_MONTHS;
  const x = idx < addedCount
    ? trendXAt(fullCount, idx)
    : trendXAt(visibleMonths, idx - (fullCount - visibleMonths));
  const y = trendYAt(fullHistory[idx].total, maxValue);
  const visible = idx >= addedCount || visibleMonths === fullCount;
  return { x, y, visible };
}

// Constrói a marcação (repouso, sem animação) para um determinado modo.
function buildTrendChartMarkup(fullHistory, visibleMonths) {
  const fullCount = fullHistory.length;
  const addedCount = fullCount - TREND_SHORT_MONTHS;
  const visibleValues = fullHistory.slice(fullCount - visibleMonths).map(m => m.total);
  const maxValue = Math.max(1, ...visibleValues);
  const labelSize = visibleMonths > 8 ? 8 : 9.5;

  const positions = fullHistory.map((m, idx) => trendPosFor(fullHistory, idx, visibleMonths, maxValue));

  // Linha: sempre os 12 pontos, em ordem invertida (mais recente → mais antigo),
  // pra que o "desenho" (dashoffset) fique ancorado no lado direito (presente).
  let lineD = '';
  for (let idx = fullCount - 1; idx >= 0; idx--) {
    const p = positions[idx];
    lineD += `${idx === fullCount - 1 ? 'M' : 'L'}${p.x.toFixed(1)},${p.y.toFixed(1)} `;
  }

  // Preenchimento: só os pontos visíveis no modo atual.
  const areaIdxs = [];
  for (let idx = 0; idx < fullCount; idx++) if (positions[idx].visible) areaIdxs.push(idx);
  const areaLineD = areaIdxs.map((idx, i) => {
    const p = positions[idx];
    return `${i === 0 ? 'M' : 'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`;
  }).join(' ');
  const firstAP = positions[areaIdxs[0]], lastAP = positions[areaIdxs[areaIdxs.length - 1]];
  const areaD = `${areaLineD} L${lastAP.x.toFixed(1)},${TREND_H - TREND_BOTTOM_PAD} L${firstAP.x.toFixed(1)},${TREND_H - TREND_BOTTOM_PAD} Z`;

  const dotsHtml = fullHistory.map((m, idx) => {
    const p = positions[idx];
    const color = m.isCurrent ? 'var(--color-accent-700)' : 'var(--color-accent-600)';
    return `<circle id="trendDot-${idx}" class="trend-dot${p.visible ? '' : ' is-hidden'}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="${color}"><title>${m.label} · ${formatCurrency(m.total)}</title></circle>`;
  }).join('');

  const labelsHtml = fullHistory.map((m, idx) => {
    const p = positions[idx];
    return `<text id="trendLabel-${idx}" class="trend-label${p.visible ? '' : ' is-hidden'}" x="${p.x.toFixed(1)}" y="${Math.max(9, p.y - 9).toFixed(1)}" text-anchor="middle" font-size="${labelSize}" font-weight="700" fill="${m.isCurrent ? 'var(--color-accent-700)' : 'var(--color-neutral-600)'}" font-family="Jost, system-ui, sans-serif">${m.label}</text>`;
  }).join('');

  return `
    <svg viewBox="0 0 ${TREND_W} ${TREND_H}" preserveAspectRatio="none">
      <path id="trendAreaPath" d="${areaD}" fill="var(--color-accent-100)" opacity="0.6" stroke="none"/>
      <path id="trendLinePath" d="${lineD.trim()}" fill="none" stroke="var(--color-accent-600)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${labelsHtml}
      ${dotsHtml}
    </svg>
  `;
}

// Aplica o "recorte" (stroke-dasharray/dashoffset) que ancora a linha no
// modo de repouso atual, sem trocar nada visualmente.
function settleTrendPath(pathEl, visibleMonths) {
  if (!pathEl) return;
  const totalLen = pathEl.getTotalLength();
  const revealFraction = (visibleMonths - 1) / (TREND_FULL_MONTHS - 1);
  pathEl.style.transition = 'none';
  pathEl.style.strokeDasharray = `${totalLen}`;
  pathEl.style.strokeDashoffset = `${totalLen * (1 - revealFraction)}`;
}

// ── Indicadores: formatação/animação por tipo, e recálculo Mês/Semana ──
function formatIndicatorValue(type, raw) {
  if (raw === null || raw === undefined || !isFinite(raw)) return '--';
  switch (type) {
    case 'currency': return formatCurrency(raw);
    case 'percent': return `${Math.round(raw)}%`;
    case 'hours': return `${raw.toFixed(1)}h`;
    default: return String(Math.round(raw));
  }
}

// Anima um indicador "descendo" até zero e depois "subindo" até o novo valor —
// dá a sensação de recálculo, sem precisar recarregar a seção inteira.
function animateIndicatorValue(el, type, fromRaw, toRaw) {
  if (toRaw === null || toRaw === undefined || !isFinite(toRaw)) { el.textContent = '--'; return; }
  const from = (fromRaw === null || fromRaw === undefined || !isFinite(fromRaw)) ? 0 : fromRaw;
  if (from === toRaw) { el.textContent = formatIndicatorValue(type, toRaw); return; }
  const downMs = 240, upMs = 420;
  const downStart = performance.now();
  function tickDown(now) {
    const p = Math.min(1, (now - downStart) / downMs);
    const eased = 1 - Math.pow(1 - p, 2);
    el.textContent = formatIndicatorValue(type, from * (1 - eased));
    if (p < 1) requestAnimationFrame(tickDown);
    else requestAnimationFrame(tickUpStart);
  }
  function tickUpStart(now0) {
    const upStart = now0;
    function tickUp(now) {
      const p = Math.min(1, (now - upStart) / upMs);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = formatIndicatorValue(type, toRaw * eased);
      if (p < 1) requestAnimationFrame(tickUp);
      else el.textContent = formatIndicatorValue(type, toRaw);
    }
    requestAnimationFrame(tickUp);
  }
  requestAnimationFrame(tickDown);
}

// Anima a transição 6 ⇄ 12 meses no MESMO gráfico: os 6 meses recentes
// deslizam de posição, a linha se desenha/retrai a partir da âncora (o mês
// atual, à direita) e os meses extras entram/saem em cascata.
function animateTrendTransition(targetMonths) {
  const wrap = document.getElementById('trendChartWrap');
  if (!wrap) return;
  const prevMonths = Number(wrap.dataset.months) || targetMonths;
  if (prevMonths === targetMonths) return;

  const fullHistory = trendFullHistoryCache || monthlyRevenueHistory(TREND_FULL_MONTHS);
  const fullCount = fullHistory.length;
  const addedCount = fullCount - TREND_SHORT_MONTHS;
  const expanding = targetMonths > prevMonths;

  const pathEl = wrap.querySelector('#trendLinePath');
  const areaEl = wrap.querySelector('#trendAreaPath');
  if (!pathEl) { renderTrendChartSection(); return; }

  const dotEls = Array.from({ length: fullCount }, (_, idx) => wrap.querySelector(`#trendDot-${idx}`));
  const labelEls = Array.from({ length: fullCount }, (_, idx) => wrap.querySelector(`#trendLabel-${idx}`));

  const fromMax = Math.max(1, ...fullHistory.slice(fullCount - prevMonths).map(m => m.total));
  const toMax = Math.max(1, ...fullHistory.slice(fullCount - targetMonths).map(m => m.total));
  const revealFrom = (prevMonths - 1) / (fullCount - 1);
  const revealTo = (targetMonths - 1) / (fullCount - 1);

  // Esconde o preenchimento durante a transição (a área só volta, com fade,
  // quando o traçado final estiver correto — evita uma geometria "errada" no meio do caminho).
  if (areaEl) { areaEl.style.transition = 'none'; areaEl.style.opacity = 0; }

  // Dispara o pop/fade dos meses "extras", em cascata e na ordem certa:
  // ao expandir, entram do mês mais próximo do presente pro mais antigo;
  // ao encolher, saem do mais antigo pro mais próximo do presente.
  for (let idx = 0; idx < addedCount; idx++) {
    const order = expanding ? (addedCount - 1 - idx) : idx;
    const delay = 60 + order * 55;
    if (dotEls[idx]) dotEls[idx].style.transitionDelay = `${delay}ms`;
    if (labelEls[idx]) labelEls[idx].style.transitionDelay = `${delay}ms`;
  }
  requestAnimationFrame(() => {
    for (let idx = 0; idx < addedCount; idx++) {
      if (dotEls[idx]) dotEls[idx].classList.toggle('is-hidden', !expanding);
      if (labelEls[idx]) labelEls[idx].classList.toggle('is-hidden', !expanding);
    }
  });

  const duration = 620;
  const start = performance.now();

  function frame(now) {
    const t = Math.min(1, (now - start) / duration);
    const te = easeInOutCubic(t);
    const currentMax = fromMax + (toMax - fromMax) * te;

    const positions = new Array(fullCount);
    for (let idx = 0; idx < fullCount; idx++) {
      let x;
      if (idx < addedCount) {
        x = trendXAt(fullCount, idx); // meses extras: x fixo, só entram/saem de opacidade
      } else {
        const xFrom = trendXAt(prevMonths, idx - (fullCount - prevMonths));
        const xTo = trendXAt(targetMonths, idx - (fullCount - targetMonths));
        x = xFrom + (xTo - xFrom) * te;
      }
      const y = trendYAt(fullHistory[idx].total, currentMax);
      positions[idx] = { x, y };
      if (dotEls[idx]) { dotEls[idx].setAttribute('cx', x.toFixed(1)); dotEls[idx].setAttribute('cy', y.toFixed(1)); }
      if (labelEls[idx]) { labelEls[idx].setAttribute('x', x.toFixed(1)); labelEls[idx].setAttribute('y', Math.max(9, y - 9).toFixed(1)); }
    }

    let d = '';
    for (let idx = fullCount - 1; idx >= 0; idx--) {
      const p = positions[idx];
      d += `${idx === fullCount - 1 ? 'M' : 'L'}${p.x.toFixed(1)},${p.y.toFixed(1)} `;
    }
    pathEl.setAttribute('d', d.trim());
    const totalLen = pathEl.getTotalLength();
    const revealFraction = revealFrom + (revealTo - revealFrom) * te;
    pathEl.style.strokeDasharray = `${totalLen}`;
    pathEl.style.strokeDashoffset = `${totalLen * (1 - revealFraction)}`;

    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      // Reconstrói a marcação "limpa" pro estado final — mesma geometria da
      // última frame, então não há salto visual, só garante precisão/hover.
      wrap.innerHTML = buildTrendChartMarkup(fullHistory, targetMonths);
      wrap.dataset.months = targetMonths;
      settleTrendPath(wrap.querySelector('#trendLinePath'), targetMonths);
      const finalArea = wrap.querySelector('#trendAreaPath');
      if (finalArea) {
        finalArea.style.opacity = 0;
        requestAnimationFrame(() => {
          finalArea.style.transition = 'opacity .35s ease';
          requestAnimationFrame(() => { finalArea.style.opacity = 0.6; });
        });
      }
    }
  }
  requestAnimationFrame(frame);
}

function bookingConversionThisMonth() {
  const now = new Date();
  const isThisMonth = (iso) => {
    const d = new Date(iso);
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  };
  const visits = (state.bookingVisits || []).filter(v => isThisMonth(v.created_at)).length;
  const conversions = state.appointments.filter(a => a.source === 'online' && a.created_at && isThisMonth(a.created_at)).length;
  const pct = visits > 0 ? Math.round((conversions / visits) * 100) : null;
  return { visits, conversions, pct };
}

  const indicatorsGridEl = document.getElementById('indicatorsGrid');
  if (indicatorsGridEl) indicatorsGridEl.querySelectorAll('.ic-help-btn').forEach(btn => {
    btn.onclick = (e) => { e.stopPropagation(); showIndicatorHelp(btn.dataset.helpLabel); };
  });
}

// ── gráfico semanal (SVG minimalista, usado em Insights) ──────
function weekChartSvg(values, days) {
  const w = 320, chartH = 84, labelH = 22, h = chartH + labelH;
  const max = Math.max(1, ...values);
  const gap = 10;
  const barW = (w - gap * (values.length - 1)) / values.length;
  const today = new Date();
  const bars = values.map((v, i) => {
    const barH = Math.max(3, Math.round((v / max) * (chartH - 6)));
    const x = i * (barW + gap);
    const y = chartH - barH;
    const isToday = sameDay(days[i], today);
    const fill = isToday ? 'var(--color-accent-700)' : 'var(--color-accent-100)';
    return `
      <rect class="week-bar" x="${x}" y="${y}" width="${barW}" height="${barH}" rx="${Math.min(6, barW / 2.4)}" fill="${fill}">
        <title>${WEEKDAY_FULL_LABELS[i]} · ${formatCurrency(v)}</title>
      </rect>
      <text x="${x + barW / 2}" y="${chartH + 16}" text-anchor="middle" font-size="10" font-weight="700"
        fill="${isToday ? 'var(--color-accent-700)' : 'var(--color-neutral-600)'}"
        font-family="Jost, system-ui, sans-serif">${WEEKDAY_FULL_LABELS[i]}</text>
    `;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${bars}</svg>`;
}

// A grade da timeline vai das 8h às 19h de propósito: dá uma hora de respiro
// antes e depois do expediente, pro encaixe e pro atendimento que atrasou
// aparecerem na tela em vez de ficarem cortados fora dela.
// Janela ampliada (5h–21h) só pra dar folga visual na rolagem — não é o
// expediente (OPEN_HOUR/CLOSE_HOUR, 9h–18h), que é o que manda nas contas
// de ocupação e nos horários oferecidos. HOUR_HEIGHT desceu de 68 pra 56
// (meio-termo: mais compacto que antes, mas não tão apertado quanto a
// referência) porque a janela ficou bem maior.
const AGENDA_START_HOUR = 5;
const AGENDA_END_HOUR = 22;
const HOUR_HEIGHT = 56;
const WEEKDAY_LABELS = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];

// Expediente de verdade — o que o agendar.html oferece à cliente. Ocupação e
// capacidade se medem contra ISTO, não contra a grade acima: usar as 11h da
// timeline dava um denominador que o formulário nunca consegue preencher (ele
// só oferece 9h), e a ocupação saía estruturalmente baixa. Mesmos valores de
// shared/salon.js — ao religar aquele arquivo, desestruturar de lá e apagar
// estas duas linhas.
const OPEN_HOUR = 9;
const CLOSE_HOUR = 18;
const WORK_MINUTES_PER_DAY = (CLOSE_HOUR - OPEN_HOUR) * 60;
// Mesma granularidade do agendar.html — o dropdown de horário do modal de
// novo agendamento usa essa grade.
const SLOT_MINUTES = 30;

function sameDay(a, b) {
  return a.toDateString() === b.toDateString();
}

function startOfWeek(date) {
  const d = new Date(date);
  d.setDate(d.getDate() - d.getDay()); // volta até domingo
  d.setHours(0, 0, 0, 0);
  return d;
}

// Segmentos do atendimento: trabalho inicial / pausa / trabalho final.
// O agendamento pode sobrescrever o padrão do serviço (cabelo que demorou mais).
function segmentsOf(a) {
  const s = a.service || {};
  const total = Math.round((new Date(a.ends_at) - new Date(a.starts_at)) / 60000);
  const wb = a.work_before_minutes ?? s.work_before_minutes ?? total;
  const gp = a.gap_minutes ?? s.gap_minutes ?? 0;
  const wa = a.work_after_minutes ?? s.work_after_minutes ?? 0;
  return { wb, gp, wa };
}

// Sobreposição empilhada, como no calendário do iPhone: o atendimento mais
// longo fica de fundo ocupando a faixa inteira e o encaixe entra por cima,
// recuado à esquerda. Dividir em colunas espremia os dois e escondia a pausa.
const NIVEL_RECUO = 18;   // px que cada camada entra pra dentro
const NIVEL_MAX = 3;      // além disso o bloco ficaria fino demais pra ler

function layoutAppts(appts) {
  const itens = appts
    .map(a => ({ a, s: new Date(a.starts_at).getTime(), e: new Date(a.ends_at).getTime() }))
    // Quem começa antes vai pro fundo; empatou, o mais longo é o fundo.
    .sort((x, y) => x.s - y.s || y.e - x.e);

  itens.forEach((it, i) => {
    // Quantos atendimentos já desenhados ainda estavam abertos quando este
    // começou — é o que faz o encaixe subir por cima da pausa.
    const nivel = itens.slice(0, i).filter(o => o.s <= it.s && o.e > it.s).length;
    it.nivel = Math.min(nivel, NIVEL_MAX);
  });
  return itens;
}

// Posição (px) e rótulo da linha do horário atual dentro da grade, ou null
// se agora estiver fora da janela desenhada (AGENDA_START_HOUR–END_HOUR).
function currentTimeInfo() {
  const now = new Date();
  const minsFromStart = (now.getHours() - AGENDA_START_HOUR) * 60 + now.getMinutes();
  const totalMins = (AGENDA_END_HOUR - AGENDA_START_HOUR) * 60;
  if (minsFromStart < 0 || minsFromStart > totalMins) return null;
  return {
    top: (minsFromStart / 60) * HOUR_HEIGHT,
    label: now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
  };
}

// Reposiciona a linha existente sem re-renderizar a agenda inteira — chamado
// no intervalo de 30s. A transição de `top` em CSS (ver .current-time-line)
// é que faz ela deslizar suave entre uma posição e outra, em vez de saltar.
function updateCurrentTimeLine() {
  if (state.tab !== 'agenda' || !sameDay(state.agendaDate, new Date())) return;
  const el = document.getElementById('currentTimeLine');
  if (!el) return;
  const info = currentTimeInfo();
  if (!info) { el.remove(); return; }
  el.style.top = info.top + 'px';
  el.querySelector('.current-time-badge').textContent = info.label;
}

// Destaca a linha do horário atual por um instante — usado pelo botão
// "Hoje", que precisa de algum feedback mesmo quando o dia já é hoje e não
// há troca de tela pra animar.
function highlightCurrentTimeLine() {
  requestAnimationFrame(() => {
    const line = document.getElementById('currentTimeLine');
    if (!line) return;
    line.classList.add('is-highlighted');
    setTimeout(() => line.classList.remove('is-highlighted'), 700);
  });
}

// Horário mais relevante pra abrir a grade: se for hoje, perto de agora; se
// tiver atendimento, perto do primeiro; senão, perto da abertura do salão.
// Sempre com ~1h30 de contexto acima, pra não colar o alvo na borda de cima.
function computeRelevantScrollTop(day, dayAppts) {
  if (sameDay(day, new Date())) {
    const info = currentTimeInfo();
    if (info) return Math.max(0, info.top - HOUR_HEIGHT * 1.5);
  }
  if (dayAppts.length) {
    const first = dayAppts.slice().sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at))[0];
    const fs = new Date(first.starts_at);
    const startMins = (fs.getHours() - AGENDA_START_HOUR) * 60 + fs.getMinutes();
    return Math.max(0, (startMins / 60) * HOUR_HEIGHT - HOUR_HEIGHT * 1.5);
  }
  return Math.max(0, (OPEN_HOUR - AGENDA_START_HOUR) * HOUR_HEIGHT - HOUR_HEIGHT * 0.5);
}

// `animate:false` (padrão): pula direto pra posição, sem herdar o
// scroll-behavior:smooth do CSS — é assim que a grade "já abre no lugar
// certo" sem parecer que rolou sozinha. `animate:true` é só pro botão
// "Hoje", que pede explicitamente um scroll visível.
function scrollTimelineTo(el, top, opts) {
  const animate = !!(opts && opts.animate);
  if (!el) return;
  if (!animate || prefersReducedMotion()) {
    const prev = el.style.scrollBehavior;
    el.style.scrollBehavior = 'auto';
    el.scrollTop = Math.max(0, top);
    el.style.scrollBehavior = prev;
  } else {
    el.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  }
}

// Miolo da grade (linhas de hora + eventos + linha do horário atual), sem o
// wrapper .timeline em volta — extraído pra ser recalculado sozinho quando
// só o dia muda dentro da mesma semana (renderAgendaGridTransition), sem
// precisar refazer a faixa de dias e o cabeçalho do mês.
function buildAgendaGrid(day) {
  const dayAppts = state.appointments.filter(a => sameDay(new Date(a.starts_at), day));
  const hours = [];
  for (let h = AGENDA_START_HOUR; h < AGENDA_END_HOUR; h++) hours.push(h);
  const currentTime = sameDay(day, new Date()) ? currentTimeInfo() : null;

  const blocksHtml = layoutAppts(dayAppts).map(it => {
    const a = it.a;
    const start = new Date(a.starts_at);
    const end = new Date(a.ends_at);
    const startMins = (start.getHours() - AGENDA_START_HOUR) * 60 + start.getMinutes();
    const durMins = Math.max(20, (end - start) / 60000);
    const top = (startMins / 60) * HOUR_HEIGHT;
    const height = (durMins / 60) * HOUR_HEIGHT - 4;
    const c = colorForService(a.service?.id);

    // Cada camada de sobreposição entra um pouco mais pra dentro; a borda
    // direita continua alinhada, então o bloco de baixo aparece à esquerda.
    const recuo = 6 + it.nivel * NIVEL_RECUO;

    // Faixa de pausa, quando o serviço tiver uma: é ela que mostra por que
    // cabe um encaixe no meio de um atendimento longo.
    const seg = segmentsOf(a);
    let gapHtml = '';
    if (seg.gp > 0) {
      const gapTop = (seg.wb / 60) * HOUR_HEIGHT;
      const gapH = (seg.gp / 60) * HOUR_HEIGHT;
      gapHtml = `<div class="appt-gap" style="top:${gapTop}px; height:${gapH}px;">
        ${gapH >= 22 ? `<span class="gap-label">pausa · ${seg.gp}min</span>` : ''}
      </div>`;
    }

    return `
      <div class="timeline-appt" data-appt-id="${a.id}" style="top:${top}px; height:${height}px; left:${recuo}px; width:calc(100% - ${recuo + 6}px); right:auto; z-index:${10 + it.nivel}; background:${c.bg}; border-left:3px solid ${c.border};">
        ${gapHtml}
        <div class="title" style="color:${c.text}">${a.client?.name || 'Cliente'}</div>
        <div class="sub" style="color:${c.text}">${a.service?.name || ''} · ${a.staff?.name || ''}</div>
      </div>
    `;
  }).join('');

  const html = `
    <div class="timeline-body" style="height:${(AGENDA_END_HOUR - AGENDA_START_HOUR) * HOUR_HEIGHT}px;">
      ${hours.map((h, i) => `
        <div class="hour-row" style="position:absolute; top:${i * HOUR_HEIGHT}px; left:0; right:0; height:${HOUR_HEIGHT}px;">
          <div class="hour-label">${String(h).padStart(2, '0')}:00</div>
        </div>
      `).join('')}
      ${blocksHtml}
      ${currentTime ? `
        <div class="current-time-line" id="currentTimeLine" style="top:${currentTime.top}px;">
          <span class="current-time-badge">${currentTime.label}</span>
          <span class="current-time-dot"></span>
        </div>
      ` : ''}
    </div>
  `;
  return { html, dayAppts };
}

function weekDayButtonHtml(d, selectedDay) {
  const selected = sameDay(d, selectedDay);
  const today = sameDay(d, new Date());
  const hasAppts = state.appointments.some(a => sameDay(new Date(a.starts_at), d));
  return `
    <button class="week-day ${selected ? 'selected' : ''} ${today ? 'is-today' : ''} ${hasAppts ? 'has-appts' : ''}" data-date="${d.toISOString()}">
      <div class="wd-label">${WEEKDAY_LABELS[d.getDay()]}</div>
      <div class="wd-num">${d.getDate()}</div>
      <div class="wd-dot"></div>
    </button>
  `;
}

// Toca só a classe .selected nos botões que já existem — nada de refazer o
// HTML da faixa. É isso que deixa a transição de background/border já
// declarada em .week-day animar de verdade, em vez de nascer pronta.
function updateWeekStripSelection(newDay) {
  document.querySelectorAll('.week-day').forEach(b => {
    const bd = new Date(b.dataset.date);
    b.classList.toggle('selected', sameDay(bd, newDay));
    b.classList.toggle('is-today', sameDay(bd, new Date()));
  });
}

function updateAgendaDateTitle(newDay) {
  const el = document.getElementById('agendaDateTitle');
  if (!el) return;
  const raw = newDay.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  el.textContent = raw.charAt(0).toUpperCase() + raw.slice(1);
}

function bindTimelineApptClicks() {
  app.querySelectorAll('.timeline-appt[data-appt-id]').forEach(block => {
    block.onclick = async () => {
      const apptId = block.dataset.apptId;
      if (!state.apptPhotos[apptId]) await loadApptPhotos(apptId);
      state.selectedApptId = apptId;
      render();
    };
  });
}

function renderAgenda() {
  document.getElementById('greeting').textContent = 'Agenda';
  document.getElementById('greetingSub').textContent = '';
  const day = state.agendaDate;
  // Só a primeira letra maiúscula (mesmo padrão de currentMonthLabel()) — o
  // text-transform:capitalize que existia antes maiusculizava o "De" também,
  // errado em português.
  const monthLabelRaw = day.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  const monthLabel = monthLabelRaw.charAt(0).toUpperCase() + monthLabelRaw.slice(1);
  const dateTitleRaw = day.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const dateTitle = dateTitleRaw.charAt(0).toUpperCase() + dateTitleRaw.slice(1);

  const weekStart = startOfWeek(day);
  const weekDays = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    return d;
  });

  const { html: gridHtml, dayAppts } = buildAgendaGrid(day);

  app.innerHTML = `
    <div class="day-nav">
      <div class="month-pill">
        <button class="arrow" id="prevWeek">‹</button>
        <button class="day-label-btn" id="openMonthView">
          <div class="day-label">${monthLabel}</div>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <button class="arrow" id="nextWeek">›</button>
      </div>
      <button class="agenda-add-btn" id="agendaAddBtn" aria-label="Novo agendamento">+</button>
    </div>
    <div class="agenda-viewport" id="agendaWeekViewport">
      <div id="agendaWeekPane">
        <div class="week-strip" id="weekStrip">
          ${weekDays.map(d => weekDayButtonHtml(d, day)).join('')}
        </div>
        <div class="agenda-date-title" id="agendaDateTitle">${dateTitle}</div>
        <div class="agenda-viewport" id="agendaViewport">
          <div class="timeline" id="timelineEl">${gridHtml}</div>
        </div>
      </div>
    </div>
  `;

  // prevWeek/nextWeek/Hoje trocam a semana inteira, então deslizam o bloco
  // faixa+título+grade junto — ver renderAgendaTransition().
  document.getElementById('prevWeek').onclick = () => {
    state.agendaDate = new Date(day.getTime() - 7 * 86400000);
    renderAgendaTransition('back');
  };
  document.getElementById('nextWeek').onclick = () => {
    state.agendaDate = new Date(day.getTime() + 7 * 86400000);
    renderAgendaTransition('forward');
  };
  document.getElementById('openMonthView').onclick = () => openMonthCalendar(day);
  document.getElementById('agendaAddBtn').onclick = openNewApptModal;

  // Toque num dia dentro da MESMA semana: a faixa continua com as mesmas 7
  // datas, só a seleção muda (updateWeekStripSelection, sem refazer o HTML),
  // e só a grade desliza (renderAgendaGridTransition) — não tem por que
  // mover o cabeçalho se ele não mudou.
  app.querySelectorAll('.week-day').forEach(btn => {
    btn.onclick = () => {
      // Lê state.agendaDate na hora, não a variável `day` capturada aqui:
      // no caminho leve (mesma semana) esses onclick não são reamarrados a
      // cada toque, então `day` ficaria presa no dia do último render cheio.
      const novaData = new Date(btn.dataset.date);
      const diaAtual = state.agendaDate;
      if (sameDay(novaData, diaAtual)) return;
      const direction = novaData > diaAtual ? 'forward' : 'back';
      state.agendaDate = novaData;
      updateWeekStripSelection(novaData);
      updateAgendaDateTitle(novaData);
      renderAgendaGridTransition(direction);
    };
  });

  bindTimelineApptClicks();
  attachTimelineScrollbarFade(document.getElementById('timelineEl'));
  scrollTimelineTo(document.getElementById('timelineEl'), computeRelevantScrollTop(day, dayAppts), { animate: false });
}

// #timelineEl é recriado a cada renderAgenda(), então o listener é
// reamarrado toda vez — mesmo padrão dos outros binds desta função.
function attachTimelineScrollbarFade(el) {
  if (!el) return;
  let hideTimer = null;
  el.addEventListener('scroll', () => {
    el.classList.add('is-scrolling');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => el.classList.remove('is-scrolling'), 1000);
  });
}

// Motor genérico do slide: clona o painel antigo (por id), deixa uma função
// desenhar o novo conteúdo, anima os dois por cima um do outro. Mesma
// técnica de agendar.html, parametrizada pra servir dois níveis diferentes
// — ver as duas funções abaixo. O clone é tirado ANTES de drawFn() e só
// anexado DEPOIS: se drawFn() reescrever o innerHTML de um ancestral (caso
// da semana), o viewport antigo (e o clone nele) morreria junto.
function slidePane(direction, viewportId, paneId, drawFn) {
  if (prefersReducedMotion()) { drawFn(); return; }
  const oldPane = document.getElementById(paneId);
  const oldHeight = oldPane ? oldPane.offsetHeight : null;
  const clone = oldPane ? oldPane.cloneNode(true) : null;
  if (clone) clone.removeAttribute('id');

  drawFn();

  const viewport = document.getElementById(viewportId);
  const newPane = document.getElementById(paneId);
  if (!clone || !viewport || !newPane) return;

  clone.classList.add('agenda-pane');
  viewport.appendChild(clone);

  const newHeight = newPane.offsetHeight;
  viewport.style.height = Math.max(oldHeight, newHeight) + 'px';

  const enterFrom = direction === 'back' ? '-100%' : '100%';
  const exitTo = direction === 'back' ? '100%' : '-100%';

  newPane.classList.add('agenda-pane');
  newPane.style.transition = 'none';
  newPane.style.transform = `translateX(${enterFrom})`;
  clone.style.transform = 'translateX(0)';

  void newPane.offsetWidth;

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      newPane.style.transition = 'transform .22s cubic-bezier(.22,.61,.36,1)';
      clone.style.transition = 'transform .22s cubic-bezier(.22,.61,.36,1)';
      newPane.style.transform = 'translateX(0)';
      clone.style.transform = `translateX(${exitTo})`;
    });
  });

  let cleaned = false;
  function cleanup() {
    if (cleaned) return;
    cleaned = true;
    newPane.removeEventListener('transitionend', onTransitionEnd);
    newPane.classList.remove('agenda-pane');
    newPane.style.transition = '';
    newPane.style.transform = '';
    viewport.style.height = '';
    clone.remove();
  }
  function onTransitionEnd(e) {
    if (e.target === newPane && e.propertyName === 'transform') cleanup();
  }
  newPane.addEventListener('transitionend', onTransitionEnd);
  setTimeout(cleanup, 500);
}

// Semana muda (prevWeek/nextWeek/Hoje pra outro dia/escolha no calendário de
// mês): a faixa de dias inteira troca de data, então desliza junto com a
// grade — o cabeçalho de setas/mês fica de fora (é controle, não conteúdo).
function renderAgendaTransition(direction) {
  slidePane(direction, 'agendaWeekViewport', 'agendaWeekPane', renderAgenda);
}

// Toque num dia dentro da mesma semana: só a grade precisa deslizar — a
// faixa de dias já foi atualizada no lugar por updateWeekStripSelection().
function renderAgendaGridTransition(direction) {
  slidePane(direction, 'agendaViewport', 'timelineEl', () => {
    const day = state.agendaDate;
    const { html, dayAppts } = buildAgendaGrid(day);
    const el = document.getElementById('timelineEl');
    el.innerHTML = html;
    bindTimelineApptClicks();
    scrollTimelineTo(el, computeRelevantScrollTop(day, dayAppts), { animate: false });
  });
}

function openMonthCalendar(initialDate) {
  let viewDate = new Date(initialDate);
  viewDate.setDate(1);

  const overlay = document.createElement('div');
  overlay.className = 'month-cal-overlay';
  document.body.appendChild(overlay);

  function closeCal() {
    overlay.remove();
  }

  function renderCal() {
    const monthLabelRaw = viewDate.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
    const monthLabel = monthLabelRaw.charAt(0).toUpperCase() + monthLabelRaw.slice(1);
    const firstOfMonth = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
    const gridStart = startOfWeek(firstOfMonth);
    const cells = Array.from({ length: 42 }, (_, i) => {
      const d = new Date(gridStart);
      d.setDate(d.getDate() + i);
      return d;
    });

    overlay.innerHTML = `
      <div class="month-cal-card">
        <div class="month-cal-header">
          <button class="arrow" id="calPrevMonth">‹</button>
          <div class="day-label">${monthLabel}</div>
          <button class="arrow" id="calNextMonth">›</button>
        </div>
        <div class="month-cal-weekdays">
          ${WEEKDAY_LABELS.map(l => `<div>${l}</div>`).join('')}
        </div>
        <div class="month-cal-grid">
          ${cells.map(d => {
            const inMonth = d.getMonth() === viewDate.getMonth();
            const today = sameDay(d, new Date());
            const selected = sameDay(d, initialDate);
            const hasAppts = state.appointments.some(a => sameDay(new Date(a.starts_at), d));
            return `
              <button class="month-cal-day ${selected ? 'selected' : ''} ${today ? 'is-today' : ''} ${hasAppts ? 'has-appts' : ''} ${!inMonth ? 'is-outside' : ''}" data-date="${d.toISOString()}">
                <span>${d.getDate()}</span>
                <div class="wd-dot"></div>
              </button>
            `;
          }).join('')}
        </div>
      </div>
    `;

    overlay.querySelector('#calPrevMonth').onclick = (e) => {
      e.stopPropagation();
      viewDate.setMonth(viewDate.getMonth() - 1);
      renderCal();
    };
    overlay.querySelector('#calNextMonth').onclick = (e) => {
      e.stopPropagation();
      viewDate.setMonth(viewDate.getMonth() + 1);
      renderCal();
    };
    overlay.querySelectorAll('.month-cal-day').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        state.agendaDate = new Date(btn.dataset.date);
        closeCal();
        render();
      };
    });
  }

  overlay.onclick = closeCal;
  renderCal();
}

function clientStats(clientId) {
  const client = state.clients.find(c => c.id === clientId);
  const history = state.appointments
    .filter(a => a.client?.id === clientId)
    .sort((a, b) => new Date(b.starts_at) - new Date(a.starts_at));
  const visits = history.length;
  const spent = history.reduce((sum, a) => sum + Number(a.service?.price || 0), 0);
  const lastVisit = history[0] ? fmtDate(history[0].starts_at) : '—';
  const lastVisitIso = history[0]?.starts_at || null;
  const isVip = !!client?.vip;

  const freq = {};
  history.forEach(a => {
    const name = a.service?.name;
    if (name) freq[name] = (freq[name] || 0) + 1;
  });
  const favoriteServices = Object.entries(freq)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 3)
    .map(([name]) => name);

  return { history, visits, spent, lastVisit, lastVisitIso, isVip, favoriteServices };
}

async function abrirCliente(clientId, avatarEl) {
  state.clientsScrollTop = window.scrollY;
  const origem = avatarEl ? avatarEl.getBoundingClientRect() : null;

  state.selectedClientId = clientId;
  state.clientHistoryExpanded = false;
  state.clientDiagCollapsed = true;
  if (!state.clientPhotos[clientId]) await loadClientPhotos(clientId);
  render();
  window.scrollTo(0, 0);

  if (origem && !prefersReducedMotion()) morphAvatar(origem);
}

// Shared element: o avatar da lista "vira" o avatar do perfil. Um clone
// posicionado sobre o antigo é animado até a posição do novo — a técnica é a
// mesma do slide da agenda (clonar, animar por cima, descartar), porque o
// #app é reescrito inteiro e o elemento original deixa de existir.
const MORPH_MS = 260;
function morphAvatar(origem) {
  // Sobras de uma animação anterior que não chegou ao fim (toque rápido em
  // sequência, app minimizado no meio) — se ficarem, viram avatares soltos.
  document.querySelectorAll('.avatar-morph').forEach(el => el.remove());

  const destinoEl = document.querySelector('.ph-avatar-wrap .avatar-round');
  if (!destinoEl) return;
  const destino = destinoEl.getBoundingClientRect();

  const clone = destinoEl.cloneNode(true);
  clone.classList.add('avatar-morph');
  clone.style.left = origem.left + 'px';
  clone.style.top = origem.top + 'px';
  clone.style.width = origem.width + 'px';
  clone.style.height = origem.height + 'px';
  clone.style.fontSize = '15px';
  document.body.appendChild(clone);
  destinoEl.style.opacity = '0';

  let limpo = false;
  const limpar = () => {
    if (limpo) return;
    limpo = true;
    clone.remove();
    destinoEl.style.opacity = '';
  };

  const anim = clone.animate(
    [
      { left: origem.left + 'px', top: origem.top + 'px', width: origem.width + 'px', height: origem.height + 'px', fontSize: '15px' },
      { left: destino.left + 'px', top: destino.top + 'px', width: destino.width + 'px', height: destino.height + 'px', fontSize: '24px' },
    ],
    { duration: MORPH_MS, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' }
  );
  anim.onfinish = limpar;
  anim.oncancel = limpar;
  // Rede de segurança: em aba sem composição a animação não corre e
  // `onfinish` nunca dispara — sem isso o avatar de verdade ficaria
  // invisível (opacity 0) e o clone preso na tela pra sempre.
  setTimeout(limpar, MORPH_MS + 120);
}

function bindClientsToolbar() {
  const field = document.getElementById('searchField');
  const input = document.getElementById('clientSearchInput');
  const clear = document.getElementById('clientSearchClear');

  if (input) {
    field.classList.toggle('has-text', !!input.value);
    input.oninput = () => {
      state.clientSearch = input.value;
      field.classList.toggle('has-text', !!input.value);
      renderClientsList();
    };
    input.onfocus = () => field.classList.add('is-focused');
    input.onblur = () => field.classList.remove('is-focused');
  }
  if (clear) {
    // mousedown, não click: o blur do input dispararia antes do click e o
    // botão já teria sumido junto com a classe .has-text.
    clear.onmousedown = (e) => {
      e.preventDefault();
      state.clientSearch = '';
      input.value = '';
      field.classList.remove('has-text');
      input.focus();
      renderClientsList();
    };
  }

  document.querySelectorAll('#clientFilterChips .filter-chip').forEach(chip => {
    chip.onclick = () => {
      state.clientFilter = chip.dataset.filter;
      document.querySelectorAll('#clientFilterChips .filter-chip')
        .forEach(c => c.classList.toggle('active', c === chip));
      renderClientsList();
    };
  });

  const sortBtn = document.getElementById('clientSortBtn');
  if (sortBtn) sortBtn.onclick = openClientSortSheet;
}

    };
  });

  if (seeMoreBtn) {
    seeMoreBtn.onclick = () => {
      state.clientHistoryExpanded = true;
      render();
    };
  }

  const photoInput = document.getElementById('photoInput');
  if (photoInput) {
    photoInput.onchange = () => {
      const file = photoInput.files[0];
      if (file) uploadClientPhoto(c.id, file);
    };
  }
  const diagCardHead = document.getElementById('diagCardHead');
  const diagCardBodyWrap = document.getElementById('diagCardBodyWrap');
  if (diagCardHead && diagCardBodyWrap) {
    diagCardHead.onclick = () => {
      const opening = !diagCardHead.classList.contains('is-open');
      state.clientDiagCollapsed = !opening;
      diagCardHead.classList.toggle('is-open', opening);
      if (opening) {
        if (prefersReducedMotion()) { diagCardBodyWrap.style.maxHeight = 'none'; return; }
        diagCardBodyWrap.style.maxHeight = diagCardBodyWrap.scrollHeight + 'px';
        // Solta o limite quando a animação acaba: preso em px, o conteúdo
        // ficaria cortado se os chips passassem a quebrar em mais linhas
        // (rotação de tela, fonte maior do sistema).
        diagCardBodyWrap.addEventListener('transitionend', function done(e) {
          if (e.propertyName !== 'max-height') return;
          diagCardBodyWrap.removeEventListener('transitionend', done);
          if (!state.clientDiagCollapsed) diagCardBodyWrap.style.maxHeight = 'none';
        });
      } else {
        // Sai de 'none' pra um valor concreto e força reflow antes de ir a
        // zero — sem isso o navegador não tem de onde animar. Reflow síncrono
        // em vez de requestAnimationFrame: rAF não dispara em aba oculta e o
        // menu ficaria travado aberto.

function renderQuestionario() {
  document.getElementById('greeting').textContent = 'Questionário';
  document.getElementById('greetingSub').textContent = '';

  const step = state.quiz.step;
  setKioskMode(step >= 1);

  if (step === 0) {
    app.innerHTML = `
      <h2>Questionário</h2>
      <label>Cliente</label>
      <select id="quizClientSelect">
        <option value="">Selecione…</option>
        ${state.clients.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
      </select>
    `;
    document.getElementById('quizClientSelect').onchange = (e) => {
      if (!e.target.value) return;
      const clientId = e.target.value;
      quizTransitionTo(() => {
        state.quiz.clientId = clientId;
        state.quiz.step = 1;
      });
    };
    return;
  }

  if (step === 1) {
    renderQuizMessage('Queremos conhecer você melhor', 'Começar', () => { state.quiz.step = 2; });
    return;
  }

  if (step === 2) {
    renderQuizQuestion('Você já fez descoloração?', ['Sim', 'Não'], 'had_bleaching', 3);
    return;
  }

  if (step === 3) {
    renderQuizQuestion('Já fez progressiva, botox ou alisamento?', ['Progressiva', 'Botox', 'Alisamento', 'Nenhum desses'], 'chemical_treatment', 4);
    return;
  }

  if (step === 4) {
    renderQuizMessage('Certo, para poder fazer o melhor atendimento possível, precisamos saber mais algumas informações...', 'Vamos lá', () => { state.quiz.step = 5; });
    return;
  }

  if (step === 5) {
    renderQuizQuestion('Quando foi a última química?', ['Últimos 3 meses', 'De 3 a 6 meses', 'Mais de um ano', 'Nunca fiz química'], 'last_chemical', 6);

  }

  if (step === 6) {
    renderQuizQuestion('Já teve corte químico ou quebra?', ['Corte químico', 'Quebra', 'Nenhum desses'], 'chemical_cut_or_breakage', 7);
    return;
  }

  if (step === 7) {
    renderQuizMessage('Agora só mais um detalhe....', 'Continuar', () => { state.quiz.step = 8; });
    return;
  }

  if (step === 8) {
    renderQuizQuestion('Usa hena ou tintura preta?', ['Hena', 'Tintura', 'Nenhum desses'], 'henna_or_black_dye', 9);
    return;
  }

  if (step === 9) {
    renderQuizMessage('Essas perguntas ajudam a evitar problemas na descoloração...', 'Continuar', () => { state.quiz.step = 10; });
    return;
  }

  if (step === 10) {
    app.innerHTML = `
      <div class="quiz-fullscreen">
        <div class="quiz-goal-content">
          <h2>Objetivo da cliente</h2>
          <div class="quiz-subtitle">Conte-nos como você quer o seu cabelo</div>
          <textarea id="quizGoal" placeholder="Ex. Ficar mais loira, Manter morena iluminada, recuperar saúde do cabelo" style="min-height:120px;">${state.quiz.answers.goal || ''}</textarea>
        </div>
        <button class="btn btn-primary" id="quizFinishBtn">Concluir</button>
      </div>
    `;
    document.getElementById('quizFinishBtn').onclick = () => {
      const goal = document.getElementById('quizGoal').value.trim();
      quizTransitionTo(() => {
        state.quiz.answers.goal = goal;
        state.quiz.step = 11;
      });
    };
    return;
  }

  if (step === 11) {
    app.innerHTML = `
      <div class="quiz-fullscreen">
        <div style="display:flex; justify-content:flex-end;">
          <button id="quizCloseBtn" style="background:none; border:none; font-size:22px; color:var(--color-neutral-600); cursor:pointer;">✕</button>
        </div>
        <div class="quiz-message">Obrigado pelas informações, vamos preparar o melhor atendimento para você</div>
      </div>
    `;
    document.getElementById('quizCloseBtn').onclick = async () => {
      const payload = {
        client_id: state.quiz.clientId,
        had_bleaching: state.quiz.answers.had_bleaching || null,
        chemical_treatment: state.quiz.answers.chemical_treatment || null,
        last_chemical: state.quiz.answers.last_chemical || null,
        chemical_cut_or_breakage: state.quiz.answers.chemical_cut_or_breakage || null,
        henna_or_black_dye: state.quiz.answers.henna_or_black_dye || null,
        goal: state.quiz.answers.goal || null,
      };
      const { data: inserted, error } = await sb.from('client_questionnaires').insert(payload).select();
      if (error) { showToast('Erro ao salvar: ' + error.message); return; }
      if (!inserted || !inserted.length) { showToast('Não foi possível salvar — faça login novamente.'); return; }
      showToast('Questionário salvo');
      quizTransitionTo(() => {
        state.quiz = { step: 0, clientId: null, answers: {} };
      });
    };
    return;
  }

// ── ESTOQUE ──────────────────────────────────────────────────
// Ocupou o lugar da aba Equipe: com uma profissional só, "Profissionais" era
// uma tela de uma linha, e o que falta no balcão é decisão de todo dia.

const UNIDADES = ['un', 'ml', 'g', 'cx'];

// ── Parâmetros do painel de estoque ──────────────────────────
// Quanto olhar pra trás pra estimar quanto sai por dia.
const CONSUMO_JANELA_DIAS = 60;
// Abaixo disso a média é ruído, não tendência: a tela prefere dizer "ainda sem
// histórico" a mostrar uma previsão inventada.
const CONSUMO_MIN_SAIDAS = 2;
const CONSUMO_MIN_DIAS = 7;
// Uma sugestão de compra cobre este tanto de dias acima do mínimo.
const SUGESTAO_COBERTURA_DIAS = 30;
// Acima do mínimo mas ainda perto dele → "baixo estoque".
const ESTOQUE_BAIXO_FATOR = 1.5;
// A partir daqui a validade vira aviso na tela.
const VALIDADE_ALERTA_DIAS = 30;
// Quantas movimentações ficam à vista antes do "ver mais". Mesmo número e
// mesmo padrão do histórico de visitas no perfil da cliente.
const MOV_PREVIEW_COUNT = 3;

// Quantidade sem casas decimais à toa: 3 em vez de 3.00, mas 2.5 continua 2,5.
function fmtQtd(n) {
  const v = Number(n);
  return (Number.isInteger(v) ? v : v.toFixed(2).replace(/0$/, '')).toString().replace('.', ',');
}

// Nome de produto é texto digitado pela Juliane e agora aparece em muito mais
// lugares (cartão, sugestão, timeline, aria-label) — escapar aqui é mais barato
// que lembrar de escapar em cada um.
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function precisaRepor(p) {
  return Number(p.quantity) <= Number(p.min_quantity);
}

// Quatro degraus, do pior pro melhor. Sem estoque vem antes do "no mínimo"
// porque zero é a única situação em que o atendimento simplesmente para.
function stockStatus(p) {
  const q = Number(p.quantity), m = Number(p.min_quantity);
  if (q <= 0) return 'sem';
  if (q <= m) return 'critico';
  if (m > 0 && q <= m * ESTOQUE_BAIXO_FATOR) return 'baixo';
  return 'ok';
}
const STOCK_STATUS_LABEL = {
  ok: 'Em estoque', baixo: 'Baixo estoque', critico: 'Reposição urgente', sem: 'Sem estoque',
};
const STOCK_STATUS_ORDEM = { sem: 0, critico: 1, baixo: 2, ok: 3 };

// Ícone por categoria. As categorias são texto livre no banco, então o mapa
// cobre as que existem hoje e qualquer nova cai no ícone genérico — categoria
// nova nunca quebra a tela.
const STOCK_CATEGORY_ICONS = {
  'coloração': 'drop', 'coloracao': 'drop',
  'descoloração': 'flask', 'descoloracao': 'flask',
  'tratamento': 'sparkle', 'tratamentos': 'sparkle',
  'finalização': 'spray', 'finalizacao': 'spray', 'finalizadores': 'spray',
  'oxidantes': 'flask',
  'descartáveis': 'glove', 'descartaveis': 'glove',
  'equipamentos': 'scissors',
};
function iconeDaCategoria(cat) {
  return ICONS[STOCK_CATEGORY_ICONS[String(cat || '').trim().toLowerCase()] || 'box'];
}

async function loadProducts() {
  const { data, error } = await sb.from('products').select('*').eq('active', true).order('name');
  if (error) { console.error(error); return; }
  state.products = data;
}

// Histórico de movimentação. É daqui que saem consumo médio, previsão de
// duração e sugestão de compra — sem essa leitura, esses números seriam chute.
async function loadMovements() {
  const { data, error } = await sb.from('product_movements')
    .select('*').order('created_at', { ascending: false }).limit(400);
  if (error) { console.error(error); return; }
  state.movements = data || [];
}

// Toda mudança de quantidade passa por aqui. Grava o saldo resultante junto:
// o histórico precisa dizer em quanto ficou naquele momento, e recalcular isso
// depois seria impossível se um produto for editado à mão.
async function registrarMovimento(produto, kind, quantidade, saldo, note) {
  const linha = {
    product_id: produto.id, kind, quantity: Math.abs(Number(quantidade)),
    resulting_quantity: saldo, actor: state.userLabel || null, note: note || null,
  };
  const { data, error } = await sb.from('product_movements').insert(linha).select();
  if (error) { console.error(error); return false; }
  // O demo devolve um registro simbólico, então a linha que entra no state é
  // montada aqui e não copiada da resposta — assim a timeline funciona nos dois.
  state.movements.unshift({
    ...linha,
    id: (data && data[0] && data[0].id) || ('tmp-' + Date.now()),
    created_at: (data && data[0] && data[0].created_at) || new Date().toISOString(),
  });
  return true;
}

// ── Consumo, previsão e sugestão ─────────────────────────────
function movimentosDoProduto(id) {
  return state.movements.filter(m => m.product_id === id);
}

// Quanto sai por dia. Só 'saida' conta: entrada é compra e ajuste é correção de
// contagem — nenhum dos dois é consumo, e somá-los inflaria a previsão.
function consumoDiario(p) {
  const limite = Date.now() - CONSUMO_JANELA_DIAS * 86400000;
  const saidas = movimentosDoProduto(p.id)
    .filter(m => m.kind === 'saida' && new Date(m.created_at).getTime() >= limite);
  if (saidas.length < CONSUMO_MIN_SAIDAS) return null;
  const total = saidas.reduce((s, m) => s + Number(m.quantity), 0);
  if (total <= 0) return null;
  const maisAntigo = Math.min(...saidas.map(m => new Date(m.created_at).getTime()));
  // Piso de dias: duas saídas na mesma tarde não podem virar "consome isso tudo
  // por dia" e prever que o estoque acaba amanhã.
  const dias = Math.max(CONSUMO_MIN_DIAS, (Date.now() - maisAntigo) / 86400000);
  return total / dias;
}

function diasRestantes(p) {
  const taxa = consumoDiario(p);
  if (!taxa) return null;
  return Math.floor(Number(p.quantity) / taxa);
}

// Repor até cobrir SUGESTAO_COBERTURA_DIAS acima do mínimo. Unidade contável
// arredonda pra cima; ml/g arredondam pra dezena, que é como se compra.
function sugestaoCompra(p) {
  const taxa = consumoDiario(p);
  if (!taxa) return null;
  const falta = Number(p.min_quantity) + taxa * SUGESTAO_COBERTURA_DIAS - Number(p.quantity);
  if (falta <= 0) return null;
  return (p.unit === 'un' || p.unit === 'cx') ? Math.ceil(falta) : Math.ceil(falta / 10) * 10;
}

// Meio-dia, não meia-noite: com 'T00:00:00' a data vira meia-noite no fuso do
// aparelho e um celular a oeste de Dublin lê o dia anterior. Mesma armadilha
// que salonTimeToInstant() cobre no agendamento.
function validadeInfo(p) {
  if (!p.expires_at) return null;
  const dias = Math.ceil((new Date(p.expires_at + 'T12:00:00').getTime() - Date.now()) / 86400000);
  if (dias < 0) return { dias, vencido: true, label: 'Produto vencido' };
  if (dias > VALIDADE_ALERTA_DIAS) return { dias, vencido: false, label: null };
  return { dias, vencido: false, label: dias === 0 ? 'Vence hoje' : `Vence em ${dias} dia${dias === 1 ? '' : 's'}` };
}

function valorDoEstoque() {
  return state.products.reduce((s, p) => s + (p.cost != null ? Number(p.cost) * Number(p.quantity) : 0), 0);
}

// "Atualizado" é o instante real mais recente entre edição de produto e
// movimentação — não a hora de abrir a tela.
function estoqueAtualizadoEm() {
  const ts = state.products.map(p => p.updated_at)
    .concat(state.movements.map(m => m.created_at))
    .filter(Boolean).map(t => new Date(t).getTime()).filter(t => !isNaN(t));
  return ts.length ? new Date(Math.max(...ts)) : null;
}

// ── Busca, filtros e ordenação ───────────────────────────────
const STOCK_SORTS = [
  { key: 'atencao', label: 'Prioridade (padrão)' },
  { key: 'nome', label: 'Nome (A–Z)' },
  { key: 'quantidade', label: 'Menor quantidade' },
  { key: 'valor', label: 'Maior valor em estoque' },
  { key: 'validade', label: 'Validade mais próxima' },
];

// Os chips de status são fixos; os de categoria nascem do que existe no banco.
// Chip de categoria vazia seria um filtro que nunca acha nada.
function stockFilters() {
  const chips = [
    { key: 'todos', label: 'Todos', icon: 'box' },
    { key: 'critico', label: 'Reposição', icon: 'warning' },
    { key: 'baixo', label: 'Baixo estoque', icon: 'bars' },
  ];
  if (state.products.some(p => p.favorite)) chips.push({ key: 'favoritos', label: 'Favoritos', icon: 'starFilled' });
  if (state.products.some(p => validadeInfo(p))) chips.push({ key: 'vencendo', label: 'Validade', icon: 'clock' });
  const cats = [...new Set(state.products.map(p => (p.category || '').trim()).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, 'pt-BR'));
  cats.forEach(c => chips.push({ key: 'cat:' + c, label: c, icon: STOCK_CATEGORY_ICONS[c.toLowerCase()] || 'box' }));
  return chips;
}

function filteredSortedProducts() {
  const termo = (state.stockSearch || '').trim().toLowerCase();
  let rows = state.products.map(p => ({ p, status: stockStatus(p) }));

  if (termo) {
    rows = rows.filter(({ p }) =>
      `${p.name || ''} ${p.brand || ''} ${p.category || ''} ${p.code || ''} ${p.supplier || ''}`
        .toLowerCase().includes(termo));
  }

  const f = state.stockFilter || 'todos';
  if (f === 'critico') rows = rows.filter(r => r.status === 'critico' || r.status === 'sem');
  else if (f === 'baixo') rows = rows.filter(r => r.status === 'baixo');
  else if (f === 'favoritos') rows = rows.filter(r => r.p.favorite);
  else if (f === 'vencendo') rows = rows.filter(r => { const v = validadeInfo(r.p); return v && v.label; });
  else if (f.startsWith('cat:')) rows = rows.filter(r => (r.p.category || '').trim() === f.slice(4));

  const porNome = (a, b) => (a.p.name || '').localeCompare(b.p.name || '', 'pt-BR');
  const ordem = state.stockSort || 'atencao';
  rows.sort((a, b) => {
    if (ordem === 'nome') return porNome(a, b);
    if (ordem === 'quantidade') return Number(a.p.quantity) - Number(b.p.quantity) || porNome(a, b);
    if (ordem === 'valor') {
      const val = r => (r.p.cost != null ? Number(r.p.cost) * Number(r.p.quantity) : 0);
      return val(b) - val(a) || porNome(a, b);
    }
    if (ordem === 'validade') {
      // Sem validade cadastrada vai pro fim: não é urgência, é ausência de dado.
      const d = r => (r.p.expires_at ? new Date(r.p.expires_at + 'T12:00:00').getTime() : Infinity);
      return d(a) - d(b) || porNome(a, b);
    }
    return STOCK_STATUS_ORDEM[a.status] - STOCK_STATUS_ORDEM[b.status] || porNome(a, b);
  });
  return rows;
}

// ── A tela ───────────────────────────────────────────────────
function renderStock() {

    { key: 'todos', st: 'ok', val: total, lbl: 'Produtos' },

    { key: 'baixo', st: 'baixo', val: contagem.baixo, lbl: 'Baixo estoque' },

    <h2 style="margin-top:8px;">Resumo do estoque</h2>

        <button type="button" class="stk-sum-card st-${r.st} ${state.stockFilter === r.key && i > 1 ? 'active' : ''}" data-sum="${r.key}">
          <span class="ssc-dot"></span>
          <span>
            <span class="ssc-val">${r.val}</span>
            <span class="ssc-lbl">${r.lbl}</span>
          </span>
        </button>
      `).join('')}
    </div>

    <div class="stock-value-card stk-enter" style="animation-delay:40ms;">
      <span class="svc-icon">${ICONS.money}</span>
      <span class="svc-body">
        <span class="svc-val">€${valorDoEstoque().toFixed(0)}</span>
        <span class="svc-lbl">Valor total do estoque</span>
      </span>
      ${atualizado ? `
        <span class="svc-upd">
          Atualizado ${daysAgoLabel(atualizado.toISOString())}
          <strong>${fmtTime(atualizado)}</strong>
        </span>` : ''}
    </div>

    <div class="clients-toolbar stk-enter" style="animation-delay:100ms;">
      <label class="search-field" id="stockSearchField">
        <span class="sf-icon">${ICONS.search}</span>
        <input type="search" id="stockSearchInput" placeholder="Buscar produto, marca ou categoria…"
               autocomplete="off" aria-label="Buscar produto" value="${esc(state.stockSearch || '')}">
        <button class="search-clear" id="stockSearchClear" type="button" aria-label="Limpar busca">${ICONS.close}</button>
      </label>

          ${ICONS[f.icon] || ICONS.box}<span>${esc(f.label)}</span>
        </button>
      `).join('')}

    <div id="stockListWrap" class="stk-enter" style="animation-delay:220ms;"></div>

// Só a lista — chamada a cada tecla digitada na busca e a cada troca de chip.
// Não pode passar por render(): o <input> seria recriado e perderia o foco.
function renderStockList() {
  const wrap = document.getElementById('stockListWrap');
  if (!wrap) return;

  if (!state.products.length) {
    wrap.innerHTML = '<div class="empty">Nenhum produto cadastrado. Use o + para incluir o primeiro.</div>';
    return;
  }
  const rows = filteredSortedProducts();
  if (!rows.length) {
    wrap.innerHTML = `<div class="empty">${(state.stockSearch || '').trim()
      ? 'Nenhum produto encontrado para essa busca.'
      : 'Nenhum produto neste filtro.'}</div>`;
    return;
  }

  // Os rótulos de grupo só fazem sentido na ordenação por prioridade — em
  // "Nome (A–Z)" a lista não está agrupada e o título mentiria.
  const agrupar = (state.stockSort || 'atencao') === 'atencao';
  let html = agrupar ? '' : `<div class="stock-count-label">${rows.length} ${rows.length === 1 ? 'produto' : 'produtos'}</div>`;
  const grupos = [
    { st: 'critico', chaves: ['sem', 'critico'], label: 'Precisam de atenção' },
    { st: 'baixo', chaves: ['baixo'], label: 'Estoque baixo' },
    { st: 'ok', chaves: ['ok'], label: 'Em dia' },
  ];

  if (agrupar) {
    grupos.forEach(g => {
      const doGrupo = rows.filter(r => g.chaves.includes(r.status));
      if (!doGrupo.length) return;
      html += `<div class="stock-group-label st-${g.st}"><span class="sgl-dot"></span>${g.label} · ${doGrupo.length}</div>`;
      html += doGrupo.map(productCardHtml).join('');
    });
  } else {
    html += rows.map(productCardHtml).join('');
  }

  wrap.innerHTML = html;
  bindStockCards(wrap);
}

function productCardHtml({ p, status }) {
  const val = validadeInfo(p);
  const dias = diasRestantes(p);
  const notas = [];
  if (val && val.label) {
    notas.push(`<span class="pd-note ${val.vencido ? 'is-alert' : 'is-soft'}">${ICONS.clock}${esc(val.label)}</span>`);
  }
  if (dias != null) {
    notas.push(`<span class="pd-note ${dias <= 7 ? 'is-alert' : ''}">${ICONS.trendUp}≈ ${dias} ${dias === 1 ? 'dia' : 'dias'} de estoque</span>`);
  }
  const identidade = [p.brand, p.category].filter(Boolean).map(esc).join(' · ') || 'Sem marca';
  const codigo = p.code ? ` · <span class="pd-code">${esc(p.code)}</span>` : '';

  return `
    <div class="product-card st-${status} is-${status}" data-card="${p.id}">
      <div class="pd-top">
        <button type="button" class="pd-open" data-edit="${p.id}" aria-label="Abrir ${esc(p.name)}">
          <span class="pd-thumb">${p.image_url
            ? `<img src="${esc(p.image_url)}" alt="">`
            : iconeDaCategoria(p.category)}</span>
          <span class="pd-head">
            <span class="pd-name">${esc(p.name)}</span>
            <span class="pd-sub">${identidade}${codigo}</span>
          </span>
        </button>
        <button type="button" class="pd-fav ${p.favorite ? 'is-on' : ''}" data-fav="${p.id}"
                aria-label="${p.favorite ? 'Tirar' : 'Marcar'} ${esc(p.name)} dos favoritos"
                aria-pressed="${p.favorite ? 'true' : 'false'}">${p.favorite ? ICONS.starFilled : ICONS.star}</button>
      </div>
      <div class="pd-bottom">
        <div class="pd-meta">
          <span class="stk-badge"><span class="sb-dot"></span>${STOCK_STATUS_LABEL[status]}</span>
          <div class="pd-min">Mínimo ${fmtQtd(p.min_quantity)} ${esc(p.unit)}</div>
        </div>
        <div class="stock-qty">
          <button type="button" class="qty-btn" data-dec="${p.id}" aria-label="Tirar 1 de ${esc(p.name)}" ${Number(p.quantity) <= 0 ? 'disabled' : ''}>−</button>
          <button type="button" class="qty-num" data-qtyedit="${p.id}" aria-label="Editar quantidade de ${esc(p.name)}">
            <span data-qty-for="${p.id}">${fmtQtd(p.quantity)}</span>
            <span class="qty-unit">${esc(p.unit)}</span>
          </button>
          <button type="button" class="qty-btn" data-inc="${p.id}" aria-label="Adicionar 1 em ${esc(p.name)}">+</button>
        </div>
      </div>
      ${notas.length ? `<div class="pd-notes">${notas.join('')}</div>` : ''}
    </div>
  `;
}

function bindStockCards(wrap) {
  wrap.querySelectorAll('[data-edit]').forEach(el => { el.onclick = () => openProductModal(el.dataset.edit); });
  wrap.querySelectorAll('[data-fav]').forEach(el => { el.onclick = () => alternarFavorito(el.dataset.fav); });
  wrap.querySelectorAll('[data-qtyedit]').forEach(el => { el.onclick = () => openQtyEditSheet(el.dataset.qtyedit); });
  wrap.querySelectorAll('[data-inc]').forEach(el => bindQtyHold(el, el.dataset.inc, 1));
  wrap.querySelectorAll('[data-dec]').forEach(el => bindQtyHold(el, el.dataset.dec, -1));
}

// ── Sugestões, movimentações e estatísticas ──────────────────
function renderStockInsights() {
  const wrap = document.getElementById('stockInsightsWrap');
  if (!wrap || !state.products.length) return;
  wrap.innerHTML = statsHtml() + suggestionsHtml() + movementsHtml();
  wrap.querySelectorAll('[data-edit]').forEach(el => { el.onclick = () => openProductModal(el.dataset.edit); });
  const verMais = document.getElementById('stockMovToggle');
  if (verMais) verMais.onclick = () => {
    state.stockMovExpanded = !state.stockMovExpanded;
    renderStockInsights();
    // Ao recolher, o botão "ver menos" some junto com a lista e a tela salta
    // pro fim do documento — sem isso o dedo fica apontando pro nada. Volta
    // pro título da seção.
    if (!state.stockMovExpanded) {
      const titulo = document.getElementById('stockMovTitle');
      if (titulo) titulo.scrollIntoView({ block: 'start', behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
    }
  };
}

function suggestionsHtml() {
  const criticos = state.products
    .filter(p => ['critico', 'sem', 'baixo'].includes(stockStatus(p)))
    .map(p => ({ p, dias: diasRestantes(p), comprar: sugestaoCompra(p) }))
    .filter(s => s.comprar != null)
    .sort((a, b) => (a.dias == null ? Infinity : a.dias) - (b.dias == null ? Infinity : b.dias))
    .slice(0, 3);

  const vencendo = state.products.map(p => ({ p, v: validadeInfo(p) })).filter(x => x.v && x.v.label).slice(0, 2);

  if (!criticos.length && !vencendo.length) {
    // Sem histórico não existe sugestão possível. Dizer isso é melhor que
    // esconder a seção — a Juliane fica sabendo que o número vai aparecer.
    const semHistorico = state.products.some(p => precisaRepor(p)) && !state.movements.length;
    if (!semHistorico) return '';
    return `
      <div class="stock-section">
        <div class="stock-section-title"><span class="sst-icon">${ICONS.bulb}</span>Sugestões</div>
        <div class="stock-empty-note">
          <span class="sen-icon">${ICONS.history}</span>
          <span>Ainda sem histórico de consumo. Conforme você registrar entradas e saídas, a previsão de duração e a quantidade sugerida de compra aparecem aqui.</span>
        </div>
      </div>`;
  }

  const cards = [
    ...criticos.map(({ p, dias, comprar }) => {
      const st = stockStatus(p);
      return `
        <button type="button" class="suggestion-card st-${st}" data-edit="${p.id}" style="width:100%;text-align:left;font-family:inherit;color:inherit;cursor:pointer;">
          <span class="sc-icon">${ICONS.warning}</span>
          <span class="sc-body">
            <span class="sc-name">${esc(p.name)}</span>
            <span class="sc-text">${dias != null
              ? `Pelo consumo médio, restam cerca de <strong>${dias} ${dias === 1 ? 'dia' : 'dias'}</strong>. `
              : ''}Sugestão: comprar <strong>${fmtQtd(comprar)} ${esc(p.unit)}</strong>.</span>
          </span>
        </button>`;
    }),
    ...vencendo.map(({ p, v }) => `
      <button type="button" class="suggestion-card ${v.vencido ? 'st-critico' : 'st-baixo'}" data-edit="${p.id}" style="width:100%;text-align:left;font-family:inherit;color:inherit;cursor:pointer;">
        <span class="sc-icon">${ICONS.clock}</span>
        <span class="sc-body">
          <span class="sc-name">${esc(p.name)}</span>
          <span class="sc-text">${v.vencido
            ? 'Produto <strong>vencido</strong> — vale conferir antes de usar.'
            : `<strong>${esc(v.label)}</strong>. Priorize o uso deste antes de abrir outro.`}</span>
        </span>
      </button>`),
  ];

  return `
    <div class="stock-section">
      <div class="stock-section-title"><span class="sst-icon">${ICONS.bulb}</span>Sugestões</div>
      ${cards.join('')}
    </div>`;
}

const MOV_META = {
  entrada: { st: 'ok', icon: 'arrowIn', sinal: '+', label: 'Entrada' },
  saida: { st: 'critico', icon: 'arrowOut', sinal: '−', label: 'Saída' },
  ajuste: { st: 'baixo', icon: 'sliders', sinal: '', label: 'Ajuste' },
};
const DIAS_SEMANA = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];

function rotuloDoDia(d) {
  const dias = Math.floor((new Date().setHours(0, 0, 0, 0) - new Date(d).setHours(0, 0, 0, 0)) / 86400000);
  if (dias <= 0) return 'Hoje';
  if (dias === 1) return 'Ontem';
  if (dias < 7) return DIAS_SEMANA[new Date(d).getDay()];
  const { day, mon } = fmtDateShort(new Date(d).toISOString());
  return `${day} ${mon}`;
}

function movementsHtml() {
  if (!state.movements.length) {
    return `
      <div class="stock-section">
        <div class="stock-section-title"><span class="sst-icon">${ICONS.history}</span>Movimentações recentes</div>
        <div class="stock-empty-note">
          <span class="sen-icon">${ICONS.history}</span>
          <span>Nenhuma movimentação registrada ainda. Cada − e + no contador, e cada entrada ou saída pelo botão +, entra nesta lista.</span>
        </div>
      </div>`;
  }

  const escondidas = Math.max(0, state.movements.length - MOV_PREVIEW_COUNT);
  const recentes = state.stockMovExpanded ? state.movements : state.movements.slice(0, MOV_PREVIEW_COUNT);
  let ultimoDia = null;
  const itens = recentes.map(m => {
    const p = state.products.find(x => x.id === m.product_id);
    const meta = MOV_META[m.kind] || MOV_META.ajuste;
    const dia = rotuloDoDia(m.created_at);
    const cabecalho = dia !== ultimoDia ? `<div class="mv-day-label">${dia}</div>` : '';
    ultimoDia = dia;
    const quem = [meta.label, m.actor].filter(Boolean).join(' · ');
    return `
      ${cabecalho}
      <div class="mv-item st-${meta.st}">
        <div class="mv-rail"><span class="mv-icon">${ICONS[meta.icon]}</span><span class="mv-line"></span></div>
        <div class="mv-body">
          <div class="mv-top">
            <span class="mv-qty">${meta.sinal}${fmtQtd(m.quantity)}</span>
            <span class="mv-name">${esc(p ? p.name : 'Produto removido')}</span>
          </div>
          <div class="mv-sub">${esc(quem)} · ${fmtTime(new Date(m.created_at))}${
            m.resulting_quantity != null ? ` · ficou em ${fmtQtd(m.resulting_quantity)}${p ? ' ' + esc(p.unit) : ''}` : ''}</div>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="stock-section">
      <div class="stock-section-title" id="stockMovTitle">
        <span class="sst-icon">${ICONS.history}</span>Movimentações recentes
        <span class="sst-count">${state.movements.length} no total</span>
      </div>
      ${itens}
      ${escondidas ? `<button class="see-more-btn ${state.stockMovExpanded ? 'is-less' : ''}" id="stockMovToggle">${
        state.stockMovExpanded ? 'Ver menos' : `Ver mais (${escondidas})`} ${ICONS.chevron}</button>` : ''}
    </div>`;
}

function statsHtml() {
  const saidas = state.movements.filter(m => m.kind === 'saida');
  const reposicao = state.products
    .filter(p => ['critico', 'sem', 'baixo'].includes(stockStatus(p)))
    .reduce((s, p) => {
      const q = sugestaoCompra(p) ?? Math.max(0, Number(p.min_quantity) * ESTOQUE_BAIXO_FATOR - Number(p.quantity));
      return s + (p.cost != null ? q * Number(p.cost) : 0);
    }, 0);

  // Sem saída registrada não há "mais usado" nem "categoria que mais consome" —
  // a seção mostra só o que dá pra afirmar (valor e gasto estimado).
  let usoHtml = '';
  if (saidas.length) {
    const porProduto = {}, porCategoria = {};
    saidas.forEach(m => {
      const p = state.products.find(x => x.id === m.product_id);
      if (!p) return;
      porProduto[p.name] = (porProduto[p.name] || 0) + Number(m.quantity);
      const cat = (p.category || 'Sem categoria').trim();
      porCategoria[cat] = (porCategoria[cat] || 0) + Number(m.quantity);
    });
    const topProduto = Object.entries(porProduto).sort((a, b) => b[1] - a[1])[0];
    const topCategoria = Object.entries(porCategoria).sort((a, b) => b[1] - a[1])[0];
    if (topProduto) {
      usoHtml = `
        <div class="stock-stats">
          <div class="ss-head">No consumo dos últimos ${CONSUMO_JANELA_DIAS} dias</div>
          <div class="ss-pair">
            <div class="ss-cell">
              <div class="ss-val" style="font-size:15px;">${esc(topProduto[0])}</div>
              <div class="ss-lbl">Produto mais usado</div>
            </div>
            <div class="ss-cell">
              <div class="ss-val" style="font-size:15px;">${esc(topCategoria ? topCategoria[0] : '—')}</div>
              <div class="ss-lbl">Categoria com maior consumo</div>
            </div>
          </div>
        </div>`;
    }
  }

  return `
    <div class="stock-section">
      <div class="stock-section-title"><span class="sst-icon">${ICONS.bars}</span>Estatísticas</div>
      <div class="stock-stats">
        <div class="ss-pair">
          <div class="ss-cell">
            <div class="ss-val">€${valorDoEstoque().toFixed(0)}</div>
            <div class="ss-lbl">Valor total parado em estoque</div>
          </div>
          <div class="ss-cell">
            <div class="ss-val">€${reposicao.toFixed(0)}</div>
            <div class="ss-lbl">Gasto estimado pra repor o que falta</div>
          </div>
        </div>
      </div>
      ${usoHtml}
    </div>`;
}

// ── Toolbar (busca, chips, ordenação) ────────────────────────
function bindStockToolbar() {
  const field = document.getElementById('stockSearchField');
  const input = document.getElementById('stockSearchInput');
  const clear = document.getElementById('stockSearchClear');

  if (input) {
    field.classList.toggle('has-text', !!input.value);
    input.oninput = () => {
      state.stockSearch = input.value;
      field.classList.toggle('has-text', !!input.value);
      renderStockList();
    };
    input.onfocus = () => field.classList.add('is-focused');
    input.onblur = () => field.classList.remove('is-focused');
  }
  if (clear) {
    // mousedown, não click: o blur do input dispararia antes e o botão já teria
    // sumido junto com a classe .has-text.
    clear.onmousedown = (e) => {
      e.preventDefault();
      state.stockSearch = '';
      input.value = '';
      field.classList.remove('has-text');
      input.focus();
      renderStockList();
    };
  }

  document.querySelectorAll('#stockFilterChips .filter-chip').forEach(chip => {
    chip.onclick = () => { aplicarFiltroEstoque(chip.dataset.filter); };
  });
  document.querySelectorAll('[data-sum]').forEach(btn => {
    btn.onclick = () => aplicarFiltroEstoque(btn.dataset.sum);
  });
  const sortBtn = document.getElementById('stockSortBtn');
  if (sortBtn) sortBtn.onclick = openStockSortSheet;
}

// Troca de filtro sem passar por render(): só as classes .active mudam e a
// lista é redesenhada. Se o render cheio rodasse, a animação de entrada
// tocaria de novo a cada chip — e a busca perderia o foco.
function aplicarFiltroEstoque(key) {
  state.stockFilter = key;
  document.querySelectorAll('#stockFilterChips .filter-chip')
    .forEach(c => c.classList.toggle('active', c.dataset.filter === key));
  document.querySelectorAll('[data-sum]')
    .forEach((c, i) => c.classList.toggle('active', i > 1 && c.dataset.sum === key));
  renderStockList();
}

function openStockSortSheet() {
  modalContainer.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-sheet">
        <h2>Ordenar por</h2>
        ${STOCK_SORTS.map(s => `
          <button class="sheet-option ${state.stockSort === s.key ? 'is-selected' : ''}" data-sort="${s.key}">
            <span>${s.label}</span>
            <span class="so-check">${ICONS.check}</span>
          </button>
        `).join('')}
      </div>
    </div>
  `;
  document.getElementById('modalOverlay').onclick = (e) => { if (e.target.id === 'modalOverlay') closeModal(); };

// ── Contador: toque simples, segurar e edição manual ─────────
const HOLD_INICIO_MS = 420;  // antes disso ainda é um toque simples
const HOLD_PASSO_MS = 110;   // depois, um passo a cada

// Segurar não pode virar uma gravação por passo: os passos são acumulados na
// tela e só o total vai pro banco quando o dedo solta — uma escrita, uma
// movimentação. Por isso o número é atualizado no DOM direto: re-renderizar a
// lista no meio do gesto destruiria o próprio botão que está sendo apertado.
function bindQtyHold(btn, produtoId, sinal) {
  let inicio = null, repete = null, acumulado = 0;

  const passo = () => {
    const p = state.products.find(x => x.id === produtoId);
    if (!p) return;
    if (sinal < 0 && Number(p.quantity) + acumulado <= 0) return;
    acumulado += sinal;
    const alvo = document.querySelector(`[data-qty-for="${produtoId}"]`);
    if (alvo) alvo.textContent = fmtQtd(Number(p.quantity) + acumulado);
  };

  const soltar = () => {
    clearTimeout(inicio); clearInterval(repete);
    inicio = repete = null;
    if (!acumulado) return;
    const delta = acumulado;
    acumulado = 0;
    ajustarQuantidade(produtoId, delta);
  };

  btn.onpointerdown = (e) => {
    e.preventDefault();
    passo();
    inicio = setTimeout(() => { repete = setInterval(passo, HOLD_PASSO_MS); }, HOLD_INICIO_MS);
  };
  btn.onpointerup = soltar;
  btn.onpointercancel = soltar;
  btn.onpointerleave = soltar;
}

// Ajuste do balcão: usou um, tira um. A tela já mostra o valor novo (o gesto
// atualizou o DOM); aqui confirma no banco e volta atrás se falhar.
async function ajustarQuantidade(id, delta) {
  const p = state.products.find(x => x.id === id);
  if (!p) return;
  const anterior = Number(p.quantity);
  const nova = Math.max(0, anterior + delta);
  if (nova === anterior) { renderStockList(); return; }
  p.quantity = nova;
  renderStockList();

  // O .select() é o que prova que gravou: com a sessão expirada a RLS deixa o
  // update passar sem tocar em nenhuma linha, e sem isso a tela mentiria.
  const { data, error } = await sb.from('products')
    .update({ quantity: nova, updated_at: new Date().toISOString() }).eq('id', id).select('id');
  if (error || !data || !data.length) {
    p.quantity = anterior;
    renderStockList();
    showToast(error ? 'Não deu pra salvar: ' + error.message : 'Não foi possível salvar — faça login novamente.');
    return;
  }
  await registrarMovimento(p, delta > 0 ? 'entrada' : 'saida', Math.abs(nova - anterior), nova, null);
  renderStockInsights();
  if (precisaRepor(p)) showToast(`${p.name} chegou no mínimo — hora de repor`);
}

async function alternarFavorito(id) {
  const p = state.products.find(x => x.id === id);
  if (!p) return;
  const novo = !p.favorite;
  p.favorite = novo;
  renderStockList();
  const { data, error } = await sb.from('products')
    .update({ favorite: novo, updated_at: new Date().toISOString() }).eq('id', id).select('id');
  if (error || !data || !data.length) {
    p.favorite = !novo;
    renderStockList();
    showToast('Não foi possível salvar — faça login novamente.');
    return;
  }
  // O chip "Favoritos" só existe quando há algum favorito: marcar o primeiro
  // (ou desmarcar o último) muda a faixa de chips, não só a lista.
  if (novo || !state.products.some(x => x.favorite)) render();
}

// Foto do produto. Bucket próprio (product-photos), mesma compressão das fotos
// de cliente — frasco não precisa de mais resolução que cabelo.
async function uploadProductPhoto(produtoId, file) {
  showToast('Enviando foto…');
  const compressed = await compressImage(file, 900, 0.8);
  const path = `${produtoId}/${Date.now()}.jpg`;
  const { error: upErr } = await sb.storage.from('product-photos').upload(path, compressed, { contentType: 'image/jpeg' });
  if (upErr) { showToast('Erro ao enviar foto: ' + upErr.message); return null; }
  const { data: pub } = sb.storage.from('product-photos').getPublicUrl(path);
  if (!pub || !pub.publicUrl) { showToast('Foto não disponível nesta versão'); return null; }
  return pub.publicUrl;
}
