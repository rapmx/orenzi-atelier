<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orenzi</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orenzi">
<meta name="theme-color" content="#f7f3ea">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Jost:wght@400;500;600;700&display=swap">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root {
    --color-bg: #f3ede4;
    --color-surface: #f7f1e8;
    --color-text: #2b2420;
    --color-accent: #b6784a;
    --color-accent-2: #b23a3a;
    --color-divider: rgba(43,36,32,0.14);
    --color-neutral-100: #f7f1e8;
    --color-neutral-200: #e8ddce;
    --color-neutral-300: #ddcfba;
    --color-neutral-600: #6b6053;
    --color-neutral-700: #5c4f42;
    --color-accent-100: #ecdcc9;
    --color-accent-600: #a1683f;
    --color-accent-700: #8a5a34;
    --color-accent-2-100: #f7e7e7;
    --color-accent-2-700: #8a2a2a;
    --font-heading: "Poppins", "Jost", system-ui, sans-serif;
    --font-body: "Jost", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--color-bg); color: var(--color-text);
    /* 100px, não 84: o rodapé cresceu com os ícones (~77px de altura, era
       ~57), senão o fim do conteúdo ficava encoberto por ele. */
    font-family: var(--font-body); padding-bottom: 100px;
  }
  header {
    padding: 24px 20px 8px; display: flex; align-items: center; justify-content: space-between;
  }
  header .greeting { font-family: var(--font-heading); font-weight: 600; font-size: 24px; }
  header .greeting-sub { font-size: 13px; color: var(--color-neutral-600); margin-top: 2px; }
  header .mark {
    width: 36px; height: 36px; border-radius: 50%; background: var(--color-accent);
    color: var(--color-bg); display: flex; align-items: center; justify-content: center;
    font-family: var(--font-heading); font-style: normal; font-weight: 600; font-size: 16px;
  }
  main { max-width: 480px; margin: 0 auto; padding: 8px 20px 0; }
  h2 { font-family: var(--font-heading); font-weight: 600; font-size: 20px; margin: 20px 0 10px; }
  .section-label {
    font-size: 11px; letter-spacing: 0.08em; color: var(--color-neutral-600);
    font-weight: 700; margin: 4px 0 10px;
  }
  /* ── HOME · DASHBOARD EXECUTIVO ─────────────────────────────── */
  @keyframes homeFadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .home-block { opacity: 0; }
  .home-block.in {
    animation: homeFadeUp 0.5s cubic-bezier(.22,.61,.36,1) forwards;
  }
  .home-hero { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
  .home-hero.is-triple { grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .home-hero-card {
    background: var(--color-surface); border-radius: 22px; padding: 20px 18px;
    border: 1px solid var(--color-divider);
    display: flex; flex-direction: column; gap: 14px; min-height: 128px;
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .home-hero.is-triple .home-hero-card { padding: 16px 14px; min-height: 96px; gap: 10px; }
  .home-hero.is-triple .home-hero-card .hh-num { font-size: 20px; }
  .home-hero-card:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(43,36,32,0.08); }
  .home-hero-card .hh-icon {
    width: 34px; height: 34px; border-radius: 11px; background: var(--color-accent-100);
    color: var(--color-accent-700); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .home-hero-card .hh-icon svg { width: 17px; height: 17px; }
  .home-hero-card.is-revenue .hh-icon { background: var(--color-accent-2-100); color: var(--color-accent-2-700); }
  .home-hero-card .hh-num {
    font-family: var(--font-heading); font-weight: 600; font-size: 28px; letter-spacing: -0.01em;
    line-height: 1.05;
  }
  .home-hero-card .hh-label { font-size: 12.5px; color: var(--color-neutral-600); }

  .home-section { margin-top: 30px; }
  .home-section-head {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px;
  }
  .home-section-head h2 { margin: 0; }
  .home-section-head .home-section-hint { font-size: 12px; color: var(--color-neutral-600); }
  .home-section-caption { font-size: 12px; color: var(--color-neutral-600); margin: -8px 0 14px; }

  .seg-toggle { display: flex; background: var(--color-accent-100); border-radius: 999px; padding: 3px; gap: 2px; flex-shrink: 0; }
  .seg-toggle button {
    border: none; background: transparent; font-family: var(--font-body); font-size: 11px; font-weight: 700;
    color: var(--color-accent-700); padding: 5px 12px; border-radius: 999px; cursor: pointer;
    transition: background .2s ease, color .2s ease;
  }
  .seg-toggle button.active { background: var(--color-accent-700); color: var(--color-bg); }

  /* ── PANORAMA DA AGENDA (Home operacional) ─────────────────── */
  .panorama-card {
    background: var(--color-surface); border: 1px solid var(--color-divider);
    border-radius: 22px; padding: 18px 18px 16px; margin-bottom: 12px;
  }
  .pc-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 8px; }
  .pc-title { font-family: var(--font-heading); font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .pc-title .pc-icon { color: var(--color-accent-600); display: flex; flex-shrink: 0; }
  .pc-title .pc-icon svg { width: 16px; height: 16px; }
  .pc-status {
    font-size: 10.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; flex-shrink: 0;
    background: var(--color-accent-100); color: var(--color-accent-700); white-space: nowrap;
  }
  .pc-status.is-busy { background: var(--color-accent-2-100); color: var(--color-accent-2-700); }
  .pc-status.is-quiet { background: var(--color-neutral-200); color: var(--color-neutral-600); }
  .adc-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 14px; }
  .adc-stats .as-item { text-align: center; }
  .adc-stats .as-val { font-family: var(--font-heading); font-weight: 600; font-size: 16px; }
  .adc-stats .as-lbl { font-size: 9.5px; color: var(--color-neutral-600); margin-top: 2px; letter-spacing: 0.02em; }
  .adc-bar-track { height: 6px; border-radius: 999px; background: var(--color-accent-100); overflow: hidden; }
  .adc-bar-fill { height: 100%; border-radius: 999px; background: var(--color-accent-600); width: 0%; transition: width .7s cubic-bezier(.22,.61,.36,1); }
  .pc-note { font-size: 12px; color: var(--color-neutral-600); margin-top: 10px; }
  .pc-empty { font-size: 13px; color: var(--color-neutral-600); }

  .week-summary-split { display: flex; gap: 10px; }
  .wss-item { flex: 1; background: var(--color-accent-100); border-radius: 16px; padding: 14px; text-align: center; }
  .wss-item.is-weak { background: var(--color-neutral-200); }
  .wss-emoji { font-size: 20px; margin-bottom: 6px; }
  .wss-day { font-family: var(--font-heading); font-weight: 600; font-size: 13.5px; text-transform: capitalize; }
  .wss-count { font-size: 12px; color: var(--color-neutral-700); margin-top: 2px; }

  .dist-row { display: flex; align-items: center; gap: 12px; padding: 7px 0; }
  .dist-row .dr-label {
    flex: 0 0 76px; width: 76px; font-size: 12px; color: var(--color-neutral-600);
    text-transform: capitalize; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dist-row .dr-track { flex: 1; height: 7px; border-radius: 999px; background: var(--color-accent-100); overflow: hidden; }
  .dist-row .dr-fill {
    height: 100%; border-radius: 999px; background: var(--color-accent-600);
    width: 0%; transition: width .7s cubic-bezier(.22,.61,.36,1);
  }
  .dist-row.is-current .dr-fill { background: var(--color-accent-700); }
  .dist-row.is-current .dr-label { color: var(--color-text); font-weight: 700; }
  .dist-row .dr-val { width: 60px; text-align: right; font-size: 12.5px; font-weight: 700; flex-shrink: 0; }

  .opportunity-grid { display: flex; align-items: stretch; gap: 12px; }
  .opp-item { flex: 1; min-width: 0; }
  .opp-item .opp-lbl { font-size: 10.5px; color: var(--color-neutral-600); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.03em; }
  .opp-item .opp-val { font-family: var(--font-heading); font-weight: 600; font-size: 16px; }
  .opp-item .opp-sub { font-size: 12px; color: var(--color-neutral-600); margin-top: 2px; }
  .opp-divider { width: 1px; background: var(--color-divider); flex-shrink: 0; }

  .trend-block { display: flex; align-items: center; gap: 14px; }
  .trend-emoji { font-size: 26px; flex-shrink: 0; line-height: 1; }
  .trend-headline { font-family: var(--font-heading); font-weight: 600; font-size: 14.5px; }
  .trend-phrase { font-size: 12px; color: var(--color-neutral-600); margin-top: 3px; }

  .comparison-row { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--color-divider); }
  .comparison-row:last-child { border-bottom: none; }
  .comparison-row .cr-label { flex: 1; font-size: 13px; font-weight: 700; }
  .comparison-row .cr-values { font-size: 12px; color: var(--color-neutral-600); margin-top: 2px; }
  .comparison-row .cr-delta { font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; flex-shrink: 0; }
  .comparison-row .cr-delta.is-up { background: #e7f0e9; color: #3f6b4c; }
  .comparison-row .cr-delta.is-down { background: #f7e7e7; color: #a13a3a; }
  .comparison-row .cr-delta.is-flat { background: var(--color-neutral-200); color: var(--color-neutral-600); }

  .perf-card {
    background: var(--color-surface); border: 1px solid var(--color-divider);
    border-radius: 22px; padding: 20px 18px 16px;
  }
  .perf-top { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 18px; }
  .perf-top-label { font-size: 11px; letter-spacing: 0.06em; color: var(--color-neutral-600); font-weight: 700; text-transform: uppercase; }
  .perf-top-num { font-family: var(--font-heading); font-weight: 600; font-size: 26px; margin-top: 4px; }
  .perf-top-badge {
    font-size: 11px; font-weight: 700; color: var(--color-accent-700); background: var(--color-accent-100);
    padding: 4px 10px; border-radius: 999px; white-space: nowrap;
  }
  .week-chart-wrap { width: 100%; }
  .week-chart-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
  .week-bar { transition: opacity .2s ease; }
  .week-bar:hover { opacity: 0.72; }
  .perf-foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--color-divider);
  }
  .perf-foot .pf-item .pf-val { font-family: var(--font-heading); font-weight: 600; font-size: 16px; }
  .perf-foot .pf-item .pf-lbl { font-size: 11px; color: var(--color-neutral-600); margin-top: 1px; }
  .perf-foot .pf-item:last-child { text-align: right; }

  .trend-chart-wrap { width: 100%; }
  .trend-chart-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
  .trend-dot {
    transition: opacity .32s cubic-bezier(.34,1.56,.64,1), transform .32s cubic-bezier(.34,1.56,.64,1);
    transform-box: fill-box; transform-origin: center;
  }
  .trend-dot.is-hidden { opacity: 0; transform: scale(0.25); }
  .trend-label {
    transition: opacity .28s ease, transform .28s ease;
    transform-box: fill-box; transform-origin: center;
  }
  .trend-label.is-hidden { opacity: 0; transform: translateY(4px); }

  .history-card {
    background: var(--color-surface); border: 1px solid var(--color-divider);
    border-radius: 22px; padding: 18px 18px 14px;
  }
  .btn-see-more {
    width: 100%; margin-top: 10px; padding: 11px; border-radius: 999px; border: 1px solid var(--color-divider);
    background: transparent; color: var(--color-accent-700); font-family: var(--font-body);
    font-size: 13px; font-weight: 700; cursor: pointer; transition: background .2s ease;
  }
  .btn-see-more:hover { background: var(--color-accent-100); }

  .insights-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .insight-card {
    background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: 18px;
    padding: 16px 14px; transition: transform .2s ease, box-shadow .2s ease; position: relative;
  }
  .insight-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(43,36,32,0.07); }
  .insight-card .ic-icon { color: var(--color-accent-600); margin-bottom: 10px; }
  .insight-card .ic-icon svg { width: 16px; height: 16px; }
  .insight-card .ic-val { font-family: var(--font-heading); font-weight: 600; font-size: 20px; line-height: 1.1; }
  .insight-card .ic-lbl { font-size: 11.5px; color: var(--color-neutral-600); margin-top: 3px; }
  .ic-help-btn {
    position: absolute; top: 10px; right: 10px; width: 18px; height: 18px; border-radius: 50%;
    border: none; background: var(--color-accent-100); color: var(--color-accent-700);
    font-size: 10.5px; font-weight: 700; cursor: pointer; padding: 0; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s ease, color .2s ease;
  }
  .ic-help-btn:hover { background: var(--color-accent-700); color: var(--color-bg); }

  .help-popup-overlay {
    position: fixed; inset: 0; background: rgba(43,36,32,0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 250; padding: 24px; backdrop-filter: blur(2px);
    animation: helpFadeIn .2s ease;
  }
  @keyframes helpFadeIn { from { opacity: 0; } to { opacity: 1; } }
  .help-popup-card {
    background: var(--color-bg); border-radius: 20px; padding: 22px 20px;
    width: 100%; max-width: 320px; box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    position: relative; animation: helpPopIn .25s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes helpPopIn { from { opacity: 0; transform: scale(.92) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .help-popup-card .hp-title { font-family: var(--font-heading); font-weight: 600; font-size: 16px; margin: 0 24px 8px 0; }
  .help-popup-card .hp-text { font-size: 13.5px; line-height: 1.55; color: var(--color-neutral-700); }
  .help-popup-close {
    position: absolute; top: 18px; right: 18px; background: none; border: none; font-size: 17px;
    color: var(--color-neutral-600); cursor: pointer; line-height: 1; padding: 0;
  }

  /* ── Padrão de linha (modelo: Início/Insights) ─────────────────
     Base que toda lista do app usa: cartão em --color-surface com borda
     e leve elevação ao toque, não o cinza plano de --color-neutral-100
     que Clientes/Estoque/Agenda ainda tinham. `.appt-modern-card` (Início)
     e `.list-row` (as outras abas) partem do mesmo bloco de propósito —
     mudar aqui muda a família inteira. */
  .appt-modern-card, .list-row {
    display: flex; align-items: center; gap: 12px; background: var(--color-surface);
    border: 1px solid var(--color-divider); border-radius: 16px; padding: 12px 14px; margin-bottom: 8px;
    transition: transform .2s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
  }
  .appt-modern-card:hover, .list-row:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(43,36,32,0.06); }
  .appt-modern-card .am-time-col { width: 46px; flex-shrink: 0; text-align: center; }
  .appt-modern-card .am-time { font-family: var(--font-heading); font-weight: 600; font-size: 13.5px; }
  .appt-modern-card .am-bar { width: 3px; align-self: stretch; border-radius: 3px; flex-shrink: 0; min-height: 34px; }
  .appt-modern-card .am-body { flex: 1; min-width: 0; }
  .appt-modern-card .am-client { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .appt-modern-card .am-meta { font-size: 12px; color: var(--color-neutral-600); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .appt-modern-card .am-status {
    font-size: 10.5px; font-weight: 700; padding: 4px 9px; border-radius: 999px; flex-shrink: 0;
    background: var(--color-accent-2-100); color: var(--color-accent-2-700); white-space: nowrap;
  }
  .appt-modern-card .am-status.st-confirmed { background: var(--color-accent-100); color: var(--color-accent-700); }
  .appt-modern-card .am-status.st-done { background: var(--color-neutral-200); color: var(--color-neutral-600); }

  @media (max-width: 360px) {
    .home-hero { grid-template-columns: 1fr; }
    .home-hero.is-triple { grid-template-columns: 1fr; }
    .insights-grid { grid-template-columns: 1fr 1fr; }
    .adc-stats { grid-template-columns: repeat(2, 1fr); row-gap: 10px; }
  }

  .card {
    background: var(--color-neutral-100); border-radius: 16px; padding: 14px 16px;
    margin-bottom: 10px; display: flex; align-items: center; gap: 12px;
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; color: #fff; background: var(--color-accent);
  }
  .card .title { font-weight: 700; font-size: 15px; }
  .card .sub { font-size: 13px; color: var(--color-neutral-600); margin-top: 2px; }
  .card .time { font-size: 13px; font-weight: 700; color: var(--color-accent-700); white-space: nowrap; }
  .empty { font-size: 13px; color: var(--color-neutral-600); padding: 12px 0; }
  .badge {
    font-size: 11px; font-weight: 700; background: var(--color-accent-2-100);
    color: var(--color-accent-2-700); padding: 3px 8px; border-radius: 999px;
  }
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--color-neutral-100);
    display: none; justify-content: space-around; padding: 8px 0 20px;
    box-shadow: 0 -1px 0 var(--color-divider);
  }
  /* Ícone empilhado sobre o texto — troca o rodapé de texto puro pelo
     modelo de tab bar da referência. currentColor faz o SVG herdar a cor
     do botão sozinho, sem JS extra pra estado ativo/inativo. */
  nav button {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: none; font-family: var(--font-body); font-size: 10.5px;
    color: var(--color-neutral-600); cursor: pointer; padding: 5px 4px; white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  nav button svg { width: 21px; height: 21px; flex-shrink: 0; }
  nav button.active { color: var(--color-accent-700); font-weight: 700; }
  #toast {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%) translateY(-60px);
    background: var(--color-accent); color: #fff; padding: 12px 18px; border-radius: 999px;
    font-size: 13px; font-weight: 700; transition: transform .25s ease; z-index: 100;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* Header inspirado no princípio do Calendar da Apple: mês em pílula
     (setas dentro, com borda) à esquerda, + à direita — não é cópia, é o
     mesmo tipo de hierarquia aplicado aos tokens do Orenzi. Cabeçalho e
     faixa de dias ficam próximos (gap pequeno abaixo) pra ler como UM
     sistema de navegação; o respiro "de verdade" fica pro título de data,
     que é onde a tela muda de assunto (controle → conteúdo). */
  .day-nav {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin: 22px 0 14px;
  }
  .month-pill {
    display: flex; align-items: center; gap: 2px;
    background: var(--color-surface); border: 1.5px solid var(--color-divider);
    border-radius: 999px; padding: 4px 6px 4px 4px;
  }
  .month-pill .day-label { font-family: var(--font-heading); font-weight: 600; font-size: 16px; padding: 0 2px; }
  .month-pill .day-label-btn {
    display: flex; align-items: center; gap: 6px; background: none; border: none;
    cursor: pointer; padding: 4px 2px; color: inherit;
  }
  .month-pill .day-label-btn svg { width: 10px; height: 10px; color: var(--color-neutral-600); flex-shrink: 0; }
  .month-pill .day-label-btn:hover .day-label { color: var(--color-accent-700); }
  .month-pill button.arrow {
    width: 28px; height: 28px; border-radius: 50%; border: none;
    background: none; color: var(--color-text);
    font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: background .15s ease;
  }
  .month-pill button.arrow:hover { background: var(--color-neutral-100); }
  /* + da agenda: squircle no topo, ao lado da pílula do mês — troca o FAB
     circular flutuante que só o Estoque continua usando. */
  .agenda-add-btn {
    /* 42px, não 38 — bate com a altura real da .month-pill ao lado (o
       conteúdo dela mede ~41.6px), senão os dois ficam ligeiramente
       descasados na mesma linha. */
    width: 42px; height: 42px; border-radius: 13px; border: none; flex-shrink: 0;
    background: var(--color-accent); color: var(--color-bg); font-size: 22px; line-height: 1;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: transform .18s cubic-bezier(.34,1.56,.64,1); -webkit-tap-highlight-color: transparent;
  }
  .agenda-add-btn:active { transform: scale(0.9); }

  /* Título entre a faixa de dias e a agenda — hierarquia própria, não
     duplica o "Agenda" do cabeçalho nem o mês do day-nav. É o único respiro
     grande da zona de navegação, de propósito: marca onde o controle acaba
     e o conteúdo começa. */
  .agenda-date-title {
    font-family: var(--font-heading); font-weight: 600; font-size: 17px;
    color: var(--color-text); margin: 22px 2px 18px;
  }

  .week-strip {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px;
    margin-bottom: 10px;
  }
  .week-day {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    padding: 12px 4px; border-radius: 12px; cursor: pointer;
    border: 1.5px solid var(--color-divider);
    background: var(--color-surface); font-family: var(--font-body);
    /* border-color/background em .2s: é a seleção "deslizando" de um dia
       pro outro quando os botões continuam os mesmos elementos (ver
       updateWeekStripSelection). transform tem easing "com molinha" —
       retorno elástico discreto no toque, não instantâneo. */
    transition: border-color .2s ease, background .2s ease,
      transform .14s cubic-bezier(.34,1.56,.64,1), opacity .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .week-day:hover { border-color: var(--color-neutral-300); }
  .week-day:active { transform: scale(0.97); opacity: 0.85; }
  .week-day .wd-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--color-neutral-600);
    letter-spacing: 0.03em;
  }
  .week-day .wd-num {
    width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: var(--color-text);
  }
  .week-day.selected { background: var(--color-text); border-color: var(--color-text); }
  .week-day.selected .wd-num { background: transparent; color: var(--color-bg); }
  .week-day.selected .wd-label { color: var(--color-neutral-300); }
  .week-day.is-today:not(.selected) { border-color: var(--color-accent-700); }
  .week-day.is-today:not(.selected) .wd-num { color: var(--color-accent-700); }
  .week-day.is-today:not(.selected) .wd-label { color: var(--color-accent-700); }
  .week-day .wd-dot {
    width: 4px; height: 4px; border-radius: 50%; background: var(--color-accent-2);
    visibility: hidden;
  }
  .week-day.has-appts .wd-dot { visibility: visible; }
  .week-day.selected .wd-dot { background: var(--color-accent-2); }
  .month-cal-overlay {
    position: fixed; inset: 0; background: rgba(43,36,32,0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; padding: 20px; backdrop-filter: blur(2px);
  }
  .month-cal-card {
    background: var(--color-bg); border-radius: 20px; padding: 22px;
    width: 100%; max-width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .month-cal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .month-cal-header .day-label {
    font-family: var(--font-heading); font-weight: 600; font-size: 17px;
  }
  .month-cal-weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr);
    margin-bottom: 6px;
  }
  .month-cal-weekdays div {
    text-align: center; font-size: 11px; font-weight: 700; color: var(--color-neutral-600);
    text-transform: uppercase;
  }
  .month-cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
  }
  .month-cal-day {
    aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; border: none; border-radius: 10px; background: transparent; cursor: pointer;
    font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--color-text);
  }
  .month-cal-day:hover { background: var(--color-neutral-200); }
  .month-cal-day.is-outside { color: var(--color-neutral-300); }
  .month-cal-day.is-today { color: var(--color-accent-700); }
  .month-cal-day.selected { background: var(--color-text); color: var(--color-bg); }
  .month-cal-day .wd-dot {
    width: 4px; height: 4px; border-radius: 50%; background: var(--color-accent-2);
    visibility: hidden;
  }
  .month-cal-day.has-appts .wd-dot { visibility: visible; }
  .month-cal-day.selected .wd-dot { background: var(--color-accent-2); }
  /* Fundo/borda no padrão de cartão do resto do app (Início/Insights) —
     antes era o cinza chapado sem borda que só a Agenda ainda usava. O
     padding-left de 52px é geometria, não estilo: hour-label é ancorado
     em -52px pra encostar no início do conteúdo, então não mexe aqui. */
  /* Envolve .timeline só durante o slide de dia — o resto do tempo é
     transparente, sem efeito no layout. */
  .agenda-viewport { position: relative; overflow: hidden; }
  .agenda-pane { position: absolute; top: 0; left: 0; width: 100%; will-change: transform; }
  /* Sem card: a grade fica "solta" (referência: Apple Calendar) — só linhas
     de hora extremamente discretas, sem fundo nem borda envolvendo tudo.
     O padding-left de 52px continua sendo geometria, não estilo. */
  .timeline {
    position: relative;
    padding: 0 0 0 52px; margin-top: 4px;
    max-height: 62vh; overflow-y: auto; overflow-x: hidden;
    scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
    /* Some por padrão, só aparece durante a rolagem (classe .is-scrolling,
       ligada/desligada por JS — CSS não tem "faz 1s que parou de rolar"). */
    scrollbar-width: thin; scrollbar-color: transparent transparent;
  }
  .timeline::-webkit-scrollbar { width: 5px; }
  .timeline::-webkit-scrollbar-track { background: transparent; }
  .timeline::-webkit-scrollbar-thumb { background: transparent; border-radius: 999px; transition: background .3s ease; }
  .timeline.is-scrolling { scrollbar-color: var(--color-neutral-300) transparent; }
  .timeline.is-scrolling::-webkit-scrollbar-thumb { background: var(--color-neutral-300); }
  .hour-row {
    position: relative; height: 68px; border-top: 1px solid rgba(43,36,32,0.07);
  }
  .hour-row:first-child { border-top: none; }
  /* Hierarquia da timeline: hora é o elemento de MENOR peso (só orienta),
     evento é o de destaque, linha do horário atual é o mais importante de
     todos — ver z-index e cor abaixo. */
  .hour-label {
    position: absolute; left: -52px; top: -8px; width: 46px; text-align: right;
    font-size: 10.5px; color: var(--color-neutral-600); opacity: 0.8;
    font-variant-numeric: tabular-nums;
  }
  .timeline-body { position: relative; }
  /* Linha do horário atual — cor de marca (marrom/caramelo), não vermelho.
     Só existe no dia de hoje; updateCurrentTimeLine() reposiciona a cada
     30s. transition:top faz o reposicionamento deslizar suave (parecer
     contínuo) em vez de saltar de 30 em 30s. */
  .current-time-line {
    position: absolute; left: -52px; right: 0; display: flex; align-items: center;
    z-index: 30; pointer-events: none; animation: currentTimeFadeIn .22s ease;
    transition: top 1s linear;
    /* `top` marca o instante exato, mas a caixa cresce pra baixo a partir
       dele (a altura vem do badge, o filho mais alto) — sem isto o centro
       visual do selo/ponto/linha ficava ~9px abaixo da hora real. */
    transform: translateY(-50%);
  }
  .current-time-line::after {
    content: ''; flex: 1; height: 1.5px; background: var(--color-accent-700); margin-left: 5px;
  }
  .current-time-badge {
    font-family: var(--font-body); font-size: 10.5px; font-weight: 700; color: var(--color-bg);
    background: var(--color-accent-700); padding: 2px 6px; border-radius: 999px;
    width: 38px; text-align: center; flex-shrink: 0; font-variant-numeric: tabular-nums;
  }
  .current-time-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--color-accent-700);
    flex-shrink: 0; margin-left: 5px;
  }
  @keyframes currentTimeFadeIn { from { opacity: 0; } to { opacity: 1; } }
  /* Destaque de um instante, disparado pelo botão "Hoje" — pulso discreto,
     não pisca nem muda de cor. */
  @keyframes currentTimePulse { 0% { transform: scale(1); } 35% { transform: scale(1.22); } 100% { transform: scale(1); } }
  .current-time-line.is-highlighted .current-time-badge,
  .current-time-line.is-highlighted .current-time-dot { animation: currentTimePulse .6s ease; }
  /* Evento: sem sombra (o contraste de cor já separa do fundo), cantos mais
     soltos e padding mais confortável — leitura em primeiro lugar. */
  .timeline-appt {
    position: absolute; left: 6px; right: 6px; border-radius: 12px;
    padding: 8px 12px; overflow: hidden;
    cursor: pointer; transition: transform .16s cubic-bezier(.34,1.56,.64,1), opacity .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .timeline-appt:active { transform: scale(0.98); opacity: 0.92; }
  .timeline-appt .title { font-weight: 700; font-size: 12.5px; }
  .timeline-appt .sub { font-size: 11px; opacity: 0.85; }
  /* Pausa: a profissional está livre aqui, então o bloco fica "vazado" —
     listrado e sem fundo cheio, pra ler como buraco e não como atendimento. */
  .appt-gap {
    position: absolute; left: 0; right: 0; pointer-events: none;
    background: repeating-linear-gradient(
      -45deg, transparent, transparent 5px,
      rgba(255,255,255,0.55) 5px, rgba(255,255,255,0.55) 10px);
    border-top: 1px dashed rgba(0,0,0,0.18);
    border-bottom: 1px dashed rgba(0,0,0,0.18);
    display: flex; align-items: center; justify-content: center;
  }
  .gap-label {
    font-size: 9.5px; font-weight: 600; letter-spacing: 0.03em;
    color: var(--color-neutral-600); background: var(--color-bg);
    padding: 1px 6px; border-radius: 999px; white-space: nowrap;
  }

  .login-wrap {

  }

  .fab {
    position: fixed; bottom: 100px; right: 20px; width: 54px; height: 54px; border-radius: 50%;
    background: var(--color-accent); color: var(--color-bg); border: none; cursor: pointer;
    font-size: 26px; box-shadow: var(--shadow-md, 0 3px 10px rgba(0,0,0,0.18));
    display: flex; align-items: center; justify-content: center; z-index: 50; line-height: 1;
    /* Curva "com molinha": o retorno ao soltar tem uma leve sobreposta
       elástica, não só volta linear — pequena, "nada exagerado". */
    transition: transform .18s cubic-bezier(.34,1.56,.64,1); -webkit-tap-highlight-color: transparent;
  }
  .fab:active { transform: scale(0.93); }
  /* Botão fixo "Hoje", espelhado no + (mesma posição/tamanho de toque, lado
     oposto) mas na linguagem secundária (accent-100/700) — o + é a ação
     principal da tela, "Hoje" é navegação, não cadastro. */
  /* Mesma altura do .fab (54px) — os dois ficam nas pontas opostas da
     mesma linha de base, e um par com alturas diferentes lê como
     desalinhado mesmo com o bottom idêntico. */
  /* Neutro/contornado (modelo: referência) em vez de preenchido na cor de
     marca — "Hoje" é navegação, não uma ação de destaque como o +. */
  .fab-today {
    position: fixed; bottom: 100px; left: 20px; height: 54px; padding: 0 18px;
    border-radius: 999px; background: var(--color-surface); color: var(--color-text);
    border: 1.5px solid var(--color-divider); cursor: pointer;
    font-family: var(--font-body); font-weight: 700; font-size: 13.5px;
    box-shadow: var(--shadow-md, 0 3px 10px rgba(0,0,0,0.12));
    display: flex; align-items: center; justify-content: center; z-index: 50;
    transition: transform .18s cubic-bezier(.34,1.56,.64,1); -webkit-tap-highlight-color: transparent;
  }
  .fab-today:active { transform: scale(0.95); }
  @media (prefers-reduced-motion: reduce) {
    .week-day, .timeline-appt, .fab, .fab-today, .agenda-add-btn { transition: none; }
    .week-day:active, .timeline-appt:active, .fab:active, .fab-today:active, .agenda-add-btn:active { transform: none; }
    .week-day:active, .timeline-appt:active { opacity: 1; }
    .modal-overlay, .modal-sheet { animation: none; }
    .current-time-line { animation: none; transition: none; }
    .current-time-line.is-highlighted .current-time-badge,
    .current-time-line.is-highlighted .current-time-dot { animation: none; }
    .diag-card-body-wrap, .diag-card-head .dc-chevron { transition: none; }
  }
  .modal-overlay {
    position: fixed; inset: 0; background: color-mix(in srgb, #201e1d 45%, transparent);
    display: flex; align-items: flex-end; justify-content: center; z-index: 200;
    animation: modalOverlayIn .2s ease;
  }
  @keyframes modalOverlayIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-sheet {
    background: var(--color-bg); border-radius: 24px 24px 0 0; width: 100%; max-width: 480px;
    max-height: 88vh; overflow-y: auto; padding: 20px 20px 28px;
    /* Mesmo espírito do pop-up de ajuda dos indicadores (Insights) — fade +
       scale com a mesma curva "com molinha" — só que subindo de baixo, porque
       aqui é uma folha inteira de formulário, não um balão curto centralizado. */
    animation: modalSheetIn .3s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes modalSheetIn {
    from { opacity: 0; transform: translateY(28px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal-sheet h2 { margin-top: 0; }
  /* ── Agrupamento no padrão de cartão (modelo: Início/Insights), usado no
     modal de novo agendamento ── */
  .modal-section {

  .modal-field-label {

  .modal-close {

  }
  select {

  .quiz-fullscreen {

  /* ══ Aba Clientes: busca, filtros, resumo e cartões ═══════════
     Refinamento de 03/08/2026. A regra que governa tudo aqui: a lista é
     redesenhada sozinha (renderClientsList) sem passar por render(), senão
     o campo de busca perde o foco a cada tecla digitada. */
  .clients-toolbar { display: flex; gap: 10px; margin-bottom: 14px; }
  .search-field {
    flex: 1; display: flex; align-items: center; gap: 9px; background: var(--color-surface);
    border: 1px solid var(--color-divider); border-radius: 14px; padding: 0 13px; height: 46px;
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  .search-field.is-focused { border-color: var(--color-accent-600); box-shadow: 0 0 0 3px var(--color-accent-100); }
  .search-field .sf-icon { color: var(--color-neutral-600); display: flex; flex-shrink: 0; }
  .search-field .sf-icon svg { width: 17px; height: 17px; }
  .search-field input {
    flex: 1; min-width: 0; border: none; background: none; padding: 0; margin: 0;
    font-family: var(--font-body); font-size: 15px; color: var(--color-text); outline: none;
  }
  .search-field input::placeholder { color: var(--color-neutral-600); transition: opacity .18s ease; }
  .search-field.is-focused input::placeholder { opacity: 0; }
  .search-clear {
    display: none; border: none; background: none; padding: 0; cursor: pointer;
    color: var(--color-neutral-600); flex-shrink: 0; align-items: center;
  }
  .search-clear svg { width: 15px; height: 15px; }
  .search-field.has-text .search-clear { display: flex; }
  .sort-btn {
    flex-shrink: 0; width: 46px; height: 46px; border-radius: 14px; cursor: pointer;
    background: var(--color-accent-700); border: none; color: var(--color-bg);
    display: flex; align-items: center; justify-content: center;
    transition: transform .18s ease, background .15s ease;
  }
  .sort-btn svg { width: 18px; height: 18px; }
  .sort-btn:active { transform: scale(0.94); }

  /* Faixa de chips: rola na horizontal, nunca quebra linha. As margens
     negativas sangram até a borda da tela pra faixa não parecer cortada. */
  .filter-chips {
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    margin: 0 -20px 18px; padding: 2px 20px;
  }
  .filter-chips::-webkit-scrollbar { display: none; }
  .filter-chip {
    flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    padding: 8px 14px; border-radius: 999px; cursor: pointer; font-family: var(--font-body);
    font-size: 12.5px; font-weight: 600; background: var(--color-surface);
    border: 1px solid var(--color-divider); color: var(--color-neutral-600);
    transition: transform .12s ease, background .18s ease, color .18s ease, border-color .18s ease;
  }
  .filter-chip svg { width: 13px; height: 13px; }
  .filter-chip.active { background: var(--color-accent-700); border-color: var(--color-accent-700); color: var(--color-bg); }
  .filter-chip:active { transform: scale(0.96); }

  .clients-summary {
    display: flex; background: var(--color-surface); border: 1px solid var(--color-divider);
    border-radius: 16px; padding: 14px 4px; margin-bottom: 20px;
  }
  .clients-summary .cs-item { flex: 1; text-align: center; min-width: 0; }
  .clients-summary .cs-icon { display: flex; justify-content: center; color: var(--color-accent-600); margin-bottom: 5px; }
  .clients-summary .cs-icon svg { width: 15px; height: 15px; }
  .clients-summary .cs-val {
    font-family: var(--font-heading); font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .clients-summary .cs-lbl {
    font-size: 9.5px; color: var(--color-neutral-600); margin-top: 2px; line-height: 1.25;
    padding: 0 4px;
  }

  .clients-list-label {
    font-size: 11.5px; color: var(--color-neutral-600); font-weight: 500; margin-bottom: 10px;
  }

  /* Cartão de cliente: mesma base .list-row (surface + borda + raio 16),
     mas empilhado — cabeçalho em cima, métricas embaixo. */
  .client-card {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: var(--color-surface); border: 1px solid var(--color-divider);
    border-radius: 16px; padding: 14px; margin-bottom: 10px; font-family: var(--font-body);
    color: var(--color-text); transition: transform .18s ease, box-shadow .18s ease;
  }
  .client-card:active { transform: scale(0.985); }
  .cc-top { display: flex; align-items: center; gap: 12px; }
  .cc-avatar-wrap { position: relative; flex-shrink: 0; }
  .cc-vip-badge {
    position: absolute; bottom: -1px; right: -1px; width: 17px; height: 17px; border-radius: 50%;
    background: var(--color-accent-700); color: #fff; display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--color-surface);
  }
  .cc-vip-badge svg { width: 8px; height: 8px; }
  .cc-head { flex: 1; min-width: 0; }
  .cc-name-row { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .cc-name {
    font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cc-name-row .tag { flex-shrink: 0; font-size: 9.5px; padding: 3px 8px; letter-spacing: 0.03em; }
  .cc-sub { font-size: 12px; color: var(--color-neutral-600); margin-top: 2px; }
  .cc-chevron { color: var(--color-neutral-600); display: flex; flex-shrink: 0; }
  .cc-chevron svg { width: 15px; height: 15px; }
  .cc-metrics {
    display: flex; align-items: center; gap: 20px; margin-top: 12px; padding-top: 12px;
    border-top: 1px solid var(--color-divider);
  }
  .cc-metric { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .cc-metric .ccm-icon { color: var(--color-accent-600); display: flex; flex-shrink: 0; }
  .cc-metric .ccm-icon svg { width: 14px; height: 14px; }
  .cc-metric .ccm-val { font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc-metric .ccm-lbl { font-size: 11px; color: var(--color-neutral-600); }
  .cc-status {
    margin-left: auto; display: flex; align-items: center; gap: 5px; flex-shrink: 0;
    font-size: 11.5px; font-weight: 600; color: var(--color-neutral-600);
  }
  /* Ponto discreto em vez de badge — e o rótulo em texto ao lado, pra não
     depender só da cor (daltonismo). */
  .cc-status .ccs-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--color-neutral-300); }
  .cc-status.is-ativa .ccs-dot { background: #4f8a5b; }
  .cc-status.is-nova .ccs-dot { background: var(--color-accent-600); }
  .cc-status.is-inativa .ccs-dot { background: var(--color-neutral-300); }

  /* Folha de opções (ordenação, novo cliente) — reaproveita .modal-overlay/
     .modal-sheet, só acrescenta a lista de opções. */
  .sheet-option {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 4px;
    background: none; border: none; border-bottom: 1px solid var(--color-divider);
    font-family: var(--font-body); font-size: 14.5px; color: var(--color-text);
    cursor: pointer; text-align: left; transition: background .15s ease;
  }
  .sheet-option:last-child { border-bottom: none; }
  .sheet-option:active { background: var(--color-neutral-100); }
  .sheet-option .so-check { margin-left: auto; color: var(--color-accent-700); display: none; }
  .sheet-option .so-check svg { width: 16px; height: 16px; }
  .sheet-option.is-selected { font-weight: 700; }
  .sheet-option.is-selected .so-check { display: flex; }

  /* FAB da aba Clientes gira 45° quando a folha está aberta — o "+" vira "×"
     sem trocar de ícone. */
  .fab.is-open { transform: rotate(45deg); }
  .fab.is-open:active { transform: rotate(45deg) scale(0.93); }

  /* Clone do avatar que viaja da lista pro perfil (shared element). */
  .avatar-morph { position: fixed; z-index: 250; pointer-events: none; border-radius: 50%; }

  /* ══ Aba Estoque: painel de gestão ═══════════════════════════
     Redesenho de 03/08/2026. Mesma regra da lista de clientes: a lista é
     redesenhada sozinha (renderStockList) sem passar por render(), senão o
     campo de busca perde o foco a cada tecla digitada.

     Os quatro estados de estoque saem todos da paleta que já existe — não
     entrou cor nova. Cada estado só declara duas variáveis (--stk-color e
     --stk-bg) e todo o resto (ponto, badge, borda do cartão) lê delas. */
  /* O verde do ponto de "cliente ativa" (#4f8a5b) só valia como ponto: como
     TEXTO de badge sobre o próprio fundo tingido ele dava 3,2:1, abaixo do
     mínimo legível. Mesmo verde, escurecido até 5,0:1 — medido, não chutado. */
  .st-ok      { --stk-color: #3b6744; --stk-bg: rgba(79,138,91,0.14); }
  .st-baixo   { --stk-color: var(--color-accent-700); --stk-bg: var(--color-accent-100); }
  .st-critico { --stk-color: var(--color-accent-2-700); --stk-bg: var(--color-accent-2-100); }
  .st-sem     { --stk-color: var(--color-neutral-600); --stk-bg: var(--color-neutral-200); }

  /* Resumo em quatro cartões. Cada um é um atalho pro filtro correspondente —
     número que não leva a lugar nenhum seria enfeite. */
  .stock-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .stk-sum-card {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: var(--color-surface); border: 1px solid var(--color-divider);
    border-radius: 16px; padding: 12px; cursor: pointer;
    font-family: var(--font-body); color: var(--color-text);
    transition: transform .16s ease, background .18s ease, border-color .18s ease;
  }
  .stk-sum-card:active { transform: scale(0.98); }
  .stk-sum-card.active { border-color: var(--stk-color); background: var(--stk-bg); }
  .stk-sum-card .ssc-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--stk-color); }
  .stk-sum-card .ssc-val {
    font-family: var(--font-heading); font-weight: 600; font-size: 20px; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .stk-sum-card .ssc-lbl { font-size: 10.5px; color: var(--color-neutral-600); margin-top: 3px; line-height: 1.25; }

  .stock-value-card {
    display: flex; align-items: center; gap: 14px; background: var(--color-surface);
    border: 1px solid var(--color-divider); border-radius: 16px; padding: 16px; margin-bottom: 20px;
  }
  .stock-value-card .svc-icon {
    width: 36px; height: 36px; border-radius: 12px; background: var(--color-accent-100);
    color: var(--color-accent-700); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .stock-value-card .svc-icon svg { width: 18px; height: 18px; }
  .stock-value-card .svc-body { flex: 1; min-width: 0; }
  .stock-value-card .svc-val {
    font-family: var(--font-heading); font-weight: 600; font-size: 26px; line-height: 1.1;
    letter-spacing: -0.01em; font-variant-numeric: tabular-nums;
  }
  .stock-value-card .svc-lbl { font-size: 12px; color: var(--color-neutral-600); margin-top: 3px; }
  .stock-value-card .svc-upd {
    text-align: right; flex-shrink: 0; font-size: 10.5px; color: var(--color-neutral-600); line-height: 1.4;
  }
  .stock-value-card .svc-upd strong { display: block; font-size: 12.5px; color: var(--color-text); font-variant-numeric: tabular-nums; }

  .stock-group-label {
    display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-neutral-600);
    margin: 20px 0 10px;
  }
  .stock-group-label:first-child { margin-top: 0; }
  .stock-group-label .sgl-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--stk-color); }
  .stock-count-label { font-size: 11.5px; color: var(--color-neutral-600); font-weight: 500; margin-bottom: 10px; }

  /* Cartão de produto: mesma base do .client-card (surface + borda + raio 16),
     empilhado — identificação em cima, números embaixo. Só o urgente ganha a
     barra colorida na lateral; tingir o cartão inteiro, como a versão antiga
     fazia, competia com o badge e com a própria lista. */
  .product-card {
    background: var(--color-surface); border: 1px solid var(--color-divider);
    border-radius: 16px; padding: 12px; margin-bottom: 8px;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .product-card.is-critico, .product-card.is-sem { border-left: 3px solid var(--stk-color); }
  .product-card:active { transform: scale(0.985); }
  .pd-top { display: flex; align-items: center; gap: 12px; }
  .pd-open {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px;
    background: none; border: none; padding: 0; font-family: inherit; color: inherit;
    text-align: left; cursor: pointer;
  }
  .pd-thumb {
    width: 44px; height: 44px; border-radius: 13px; flex-shrink: 0; overflow: hidden;
    background: var(--color-accent-100); color: var(--color-accent-700);
    display: flex; align-items: center; justify-content: center;
  }
  .pd-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pd-thumb svg { width: 20px; height: 20px; }
  .pd-head { flex: 1; min-width: 0; }
  .pd-name { font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pd-sub {
    font-size: 11.5px; color: var(--color-neutral-600); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pd-code { font-variant-numeric: tabular-nums; }
  /* Estrela de favorito: 44px de área de toque com um ícone de 17px dentro. */
  .pd-fav {
    flex-shrink: 0; width: 44px; height: 44px; margin: -6px -6px -6px 0; border: none;
    background: none; cursor: pointer; color: var(--color-neutral-300);
    display: flex; align-items: center; justify-content: center;
    transition: transform .16s cubic-bezier(.34,1.56,.64,1), color .18s ease;
  }
  .pd-fav svg { width: 17px; height: 17px; }
  .pd-fav.is-on { color: var(--color-accent-700); }
  .pd-fav:active { transform: scale(0.88); }

  .pd-bottom {
    display: flex; align-items: center; gap: 10px; margin-top: 12px; padding-top: 12px;
    border-top: 1px solid var(--color-divider);
  }
  .pd-meta { flex: 1; min-width: 0; }
  .stk-badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700;
    padding: 4px 9px; border-radius: 999px; background: var(--stk-bg); color: var(--stk-color);
    white-space: nowrap;
  }
  .stk-badge .sb-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pd-min { font-size: 11px; color: var(--color-neutral-600); margin-top: 5px; }
  .pd-notes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pd-note {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
    padding: 4px 9px; border-radius: 999px; background: var(--color-neutral-200);
    color: var(--color-neutral-700);
  }
  .pd-note svg { width: 12px; height: 12px; }
  .pd-note.is-alert { background: var(--color-accent-2-100); color: var(--color-accent-2-700); }
  .pd-note.is-soft { background: var(--color-accent-100); color: var(--color-accent-700); }

  /* Contador: botões de 38px com a área de toque esticada pra 46 pelo ::after
     (o alvo mínimo confortável), e o número no meio é ele próprio um botão —
     é por ali que se digita a quantidade à mão. */
  .stock-qty { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .qty-btn {
    position: relative; width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--color-divider); background: var(--color-bg);
    color: var(--color-neutral-700); font-size: 19px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: transform .14s ease, background .14s ease, border-color .14s ease;
  }
  .qty-btn::after { content: ''; position: absolute; inset: -4px; }
  .qty-btn:active { background: var(--color-accent-100); border-color: var(--color-accent-600); transform: scale(0.9); }
  .qty-btn:disabled { opacity: .35; cursor: not-allowed; }
  .qty-num {
    min-width: 56px; height: 38px; padding: 0 2px; border: none; background: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: var(--font-body); color: var(--color-text);
    font-weight: 700; font-size: 16px; line-height: 1; font-variant-numeric: tabular-nums;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: transform .14s ease;
  }
  .qty-num:active { transform: scale(0.94); }
  .qty-unit { font-size: 9.5px; font-weight: 600; color: var(--color-neutral-600); margin-top: 3px; letter-spacing: 0.03em; }

  /* Sugestões, movimentações e estatísticas — blocos de fim de tela, todos no
     mesmo cartão surface+borda do resto do app. */
  .stock-section { margin-top: 32px; }
  .stock-section-title {
    display: flex; align-items: center; gap: 8px; font-family: var(--font-heading);
    font-weight: 600; font-size: 16px; margin-bottom: 12px;
  }
  .stock-section-title .sst-icon { color: var(--color-accent-600); display: flex; flex-shrink: 0; }
  .stock-section-title .sst-icon svg { width: 17px; height: 17px; }
  .stock-section-title .sst-count { margin-left: auto; font-family: var(--font-body); font-size: 11.5px; font-weight: 500; color: var(--color-neutral-600); }

  .suggestion-card {
    display: flex; gap: 12px; background: var(--color-surface); border: 1px solid var(--color-divider);
    border-radius: 16px; padding: 14px; margin-bottom: 8px;
  }
  .suggestion-card .sc-icon {
    width: 32px; height: 32px; border-radius: 11px; flex-shrink: 0;
    background: var(--stk-bg); color: var(--stk-color);
    display: flex; align-items: center; justify-content: center;
  }
  .suggestion-card .sc-icon svg { width: 16px; height: 16px; }
  .suggestion-card .sc-body { flex: 1; min-width: 0; }
  .suggestion-card .sc-name { font-size: 14px; font-weight: 700; }
  .suggestion-card .sc-text { font-size: 12.5px; color: var(--color-neutral-600); margin-top: 4px; line-height: 1.45; }
  .suggestion-card .sc-text strong { color: var(--color-text); font-weight: 700; }

  /* Timeline de movimentação: mesma linguagem da timeline de visitas do perfil
     da cliente (ponto + linha conectora), com o ícone dizendo o sentido. */
  .mv-day-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--color-neutral-600); margin: 16px 0 8px;
  }
  .mv-day-label:first-child { margin-top: 0; }
  .mv-item { display: flex; gap: 12px; }
  .mv-rail { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
  .mv-icon {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    background: var(--stk-bg); color: var(--stk-color);
    display: flex; align-items: center; justify-content: center;
  }
  .mv-icon svg { width: 15px; height: 15px; }
  .mv-line { flex: 1; width: 1px; background: var(--color-divider); margin: 4px 0; min-height: 10px; }
  .mv-item:last-child .mv-line { display: none; }
  .mv-body { flex: 1; min-width: 0; padding-bottom: 14px; }
  .mv-item:last-child .mv-body { padding-bottom: 0; }
  .mv-top { display: flex; align-items: baseline; gap: 8px; }
  .mv-qty { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--stk-color); flex-shrink: 0; }
  .mv-name { font-size: 14px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mv-sub { font-size: 11.5px; color: var(--color-neutral-600); margin-top: 2px; }

  .stock-stats {
    background: var(--color-surface); border: 1px solid var(--color-divider);
    border-radius: 16px; padding: 16px;
  }
  .stock-stats + .stock-stats { margin-top: 8px; }
  .stock-stats .ss-head { font-size: 11.5px; font-weight: 700; color: var(--color-neutral-600); margin-bottom: 12px; }
  .stock-stats .ss-pair { display: flex; gap: 12px; }
  .stock-stats .ss-cell { flex: 1; min-width: 0; }
  .stock-stats .ss-val {
    font-family: var(--font-heading); font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums;
  }
  .stock-stats .ss-lbl { font-size: 10.5px; color: var(--color-neutral-600); margin-top: 3px; line-height: 1.3; }

  .stock-empty-note {
    display: flex; gap: 10px; align-items: flex-start; background: var(--color-surface);
    border: 1px dashed var(--color-divider); border-radius: 16px; padding: 14px;
    font-size: 12.5px; color: var(--color-neutral-600); line-height: 1.45;
  }
  .stock-empty-note .sen-icon { color: var(--color-neutral-600); display: flex; flex-shrink: 0; margin-top: 1px; }
  .stock-empty-note .sen-icon svg { width: 16px; height: 16px; }

  /* Entrada em sequência: resumo → busca → filtros → lista. Cada bloco leva a
     própria classe com um delay inline; nada além de 220ms no último. */
  @keyframes stkEnter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .stk-enter { animation: stkEnter .2s cubic-bezier(.22,.61,.36,1) both; }

  @media (prefers-reduced-motion: reduce) {
    .stk-enter { animation: none; }
    .stk-sum-card, .qty-btn, .qty-num, .pd-fav, .product-card { transition: none; }
    .stk-sum-card:active, .qty-btn:active, .qty-num:active, .pd-fav:active, .product-card:active { transform: none; }
  }
  .avatar-round {
    border-radius: 50%; color: var(--color-bg); font-family: var(--font-heading); font-style: normal; font-weight: 600;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .profile-back {
    background: none; border: none; color: var(--color-neutral-600); font-family: var(--font-body);
    font-size: 13px; cursor: pointer; padding: 0 0 14px; display: flex; align-items: center; gap: 4px;
  }
  .profile-back svg { width: 15px; height: 15px; transform: rotate(180deg); }

  /* ── Perfil da cliente: header premium (03/08/2026) ────────────
     Avatar maior, nome como elemento tipográfico principal, tag VIP
     clicável abaixo do nome, "cliente desde" como meta discreta. */
  .profile-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .profile-header .name {
    font-family: var(--font-heading); font-weight: 600; font-size: 22px; letter-spacing: -0.01em; line-height: 1.15;
  }
  .vip-pill {
    display: inline-flex; align-items: center; gap: 5px; margin-top: 7px; border: none; cursor: pointer;
    padding: 4px 10px 4px 8px; border-radius: 999px; font-family: var(--font-body);

<script>
// ── CONFIGURAÇÃO ─────────────────────────────────────────────
const SUPABASE_URL = 'https://gsagtsxkhqlpxuvrijgw.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_c2b9NNovCdvQ64_Sfiiecg_H_5M0FIg';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const state = { tab: 'inicio', appointments: [], clients: [], staff: [], services: [], products: [], bookingVisits: [], agendaDate: new Date(), selectedClientId: null, selectedApptId: null, clientPhotos: {}, apptPhotos: {}, viewQuestionnaire: null, quiz: { step: 0, clientId: null, answers: {} }, insightsTrendMonths: 6, insightsIndicatorPeriod: 'month', clientSearch: '', clientFilter: 'todos', clientSort: 'recentes', clientsScrollTop: 0, movements: [], stockMovExpanded: false, stockSearch: '', stockFilter: 'todos', stockSort: 'atencao', userLabel: '' };

const STAFF_COLORS = [
  { bg: '#edefe4', border: '#7c8468', text: '#4c5439' },
  { bg: '#f7e7e7', border: '#b23a3a', text: '#8a2a2a' },
  { bg: '#efe9db', border: '#a89572', text: '#5f5238' },
  { bg: '#e4e8e1', border: '#5f7a6b', text: '#39493f' },
];
function colorForId(id) {
  if (!id) return STAFF_COLORS[0];
  let hash = 0;
  for (const ch of id) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
  return STAFF_COLORS[hash % STAFF_COLORS.length];
}
// Cor do booking por categoria do serviço — não mais por profissional. Com
// só a Juliane atendendo, colorar por `staff.id` sempre devolvia a mesma cor
// pra tudo (o id da profissional nunca muda), e a agenda inteira saía
// monocromática. Paleta fixa por categoria (não hash), pra ela aprender a
// reconhecer de relance — evita o vermelho de --color-accent-2, que já é a
// cor de "isso precisa de atenção" no resto do painel (estoque baixo, agenda
// lotada).
const CATEGORY_COLORS = {
  'Coloração':   { bg: '#f5e6d3', border: '#c4863a', text: '#8f5f26' },
  'Corte':       { bg: '#e4e8e1', border: '#5f7a6b', text: '#39493f' },
  'Alisamento':  { bg: '#efe9db', border: '#a89572', text: '#5f5238' },
  'Tratamentos': { bg: '#edefe4', border: '#7c8468', text: '#4c5439' },
  'Outros':      { bg: '#ede4ea', border: '#8a6b8f', text: '#5a4560' },
};
const CATEGORY_COLOR_FALLBACK = Object.values(CATEGORY_COLORS);
function colorForService(serviceId) {
  const category = state.services.find(s => s.id === serviceId)?.category;
  if (category && CATEGORY_COLORS[category]) return CATEGORY_COLORS[category];
  if (!category) return CATEGORY_COLOR_FALLBACK[0];
  // Categoria nova que ainda não ganhou cor fixa na tabela acima: cai num
  // hash estável, pra não quebrar nem repetir a cor de outra à toa.
  let hash = 0;
  for (const ch of category) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
  return CATEGORY_COLOR_FALLBACK[hash % CATEGORY_COLOR_FALLBACK.length];
}
// Usado pelas animações feitas em JS (slide da agenda, pop-up de modal) —

// Redimensiona pra no máximo 1600px no lado maior e converte pra JPEG (qualidade 82%) —
// reduz bastante o tamanho do arquivo sem perda visível de qualidade.
async function compressImage(file, maxDim = 1600, quality = 0.82) {
  const bitmap = await createImageBitmap(file);
  let { width, height } = bitmap;
  if (width > maxDim || height > maxDim) {
    const scale = maxDim / Math.max(width, height);
    width = Math.round(width * scale);
    height = Math.round(height * scale);
  }
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  canvas.getContext('2d').drawImage(bitmap, 0, 0, width, height);
  return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
}

async function uploadClientPhoto(clientId, file) {
  showToast('Enviando foto…');
  const compressed = await compressImage(file);

function todayAppointments() {

  return state.appointments.filter(a => new Date(a.starts_at).toDateString() === todayStr);
}

function apptCard(a) {
  const clientName = a.client?.name || 'Cliente';
  return `

      <div style="flex:1">

      </div>
      <div class="time">${fmtTime(a.starts_at)}</div>
    </div>
  `;
}

function minutesUntil(iso) {
  const diff = (new Date(iso) - new Date()) / 60000;
  return Math.max(0, Math.round(diff));
}

function occupancyPct(staffId, dayAppts) {
  const workingMinutes = WORK_MINUTES_PER_DAY;
  const bookedMinutes = dayAppts
    .filter(a => a.staff?.id === staffId)
    .reduce((sum, a) => sum + (new Date(a.ends_at) - new Date(a.starts_at)) / 60000, 0);
  return Math.min(100, Math.round((bookedMinutes / workingMinutes) * 100));
}

function formatCurrency(n) {
  const v = Number(n) || 0;
  return '€' + v.toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function appointmentRevenue(a) {
  return Number(a.service?.price || 0);
}

function serviceDurationMinutes(serviceId) {
  const svc = state.services.find(s => s.id === serviceId);
  return svc ? Number(svc.duration_minutes || 0) : 0;
}

function startOfWeekMonday(date) {
  const d = new Date(date);
  const day = d.getDay(); // 0 dom .. 6 sáb
  const diff = (day === 0 ? -6 : 1) - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

function appointmentsOnDate(date) {
  const ds = date.toDateString();
  return state.appointments.filter(a => new Date(a.starts_at).toDateString() === ds);
}

function tomorrowAppointments() {
  const t = new Date();
  t.setDate(t.getDate() + 1);
  return appointmentsOnDate(t);
}

// ── Aba Clientes: status, filtros e ordenação ────────────────
// Nada disso vem do banco — é tudo derivado de `appointments` e de
// `clients.created_at`, pra não inventar coluna nova.
const CLIENT_NEW_DAYS = 30;      // cadastrada há pouco → "Nova"
const CLIENT_INACTIVE_DAYS = 60; // sem aparecer há tempo → "Inativa"
const CLIENT_FREQUENT_VISITS = 5;

function daysSince(iso) {
  if (!iso) return Infinity;
  return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
}

function clientStatus(client, lastVisitIso) {
  if (daysSince(client.created_at) <= CLIENT_NEW_DAYS) return 'nova';
  if (daysSince(lastVisitIso) > CLIENT_INACTIVE_DAYS) return 'inativa';
  return 'ativa';
}

const CLIENT_FILTERS = [
  { key: 'todos', label: 'Todos', icon: 'users' },
  { key: 'vip', label: 'VIP', icon: 'starFilled' },
  { key: 'recentes', label: 'Recentes', icon: 'clock' },
  { key: 'frequentes', label: 'Mais frequentes', icon: 'trendUp' },
  { key: 'inativos', label: 'Inativos', icon: 'moon' },
];

const CLIENT_SORTS = [
  { key: 'recentes', label: 'Última visita' },
  { key: 'nome', label: 'Nome (A–Z)' },
  { key: 'gasto', label: 'Maior gasto' },
  { key: 'visitas', label: 'Mais frequentes' },
  { key: 'vip', label: 'VIP primeiro' },
];

// Junta cliente + métricas uma vez só: filtrar, ordenar e desenhar o cartão
// precisam dos mesmos números, e clientStats() varre todos os agendamentos.
function clientsWithStats() {
  return state.clients.map(c => {
    const s = clientStats(c.id);
    return { c, ...s, status: clientStatus(c, s.lastVisitIso) };
  });
}

function filteredSortedClients() {
  const termo = (state.clientSearch || '').trim().toLowerCase();
  let rows = clientsWithStats();

  if (termo) {
    rows = rows.filter(r => {
      const alvo = `${r.c.name || ''} ${r.c.phone || ''} ${r.c.email || ''}`.toLowerCase();
      return alvo.includes(termo);
    });
  }

  const filtro = state.clientFilter || 'todos';
  if (filtro === 'vip') rows = rows.filter(r => r.isVip);
  else if (filtro === 'recentes') rows = rows.filter(r => daysSince(r.lastVisitIso) <= CLIENT_NEW_DAYS);
  else if (filtro === 'frequentes') rows = rows.filter(r => r.visits >= CLIENT_FREQUENT_VISITS);
  else if (filtro === 'inativos') rows = rows.filter(r => r.status === 'inativa');

  const ordem = state.clientSort || 'recentes';
  const porNome = (a, b) => (a.c.name || '').localeCompare(b.c.name || '', 'pt-BR');
  rows.sort((a, b) => {
    if (ordem === 'nome') return porNome(a, b);
    if (ordem === 'gasto') return b.spent - a.spent || porNome(a, b);
    if (ordem === 'visitas') return b.visits - a.visits || porNome(a, b);
    if (ordem === 'vip') return (b.isVip ? 1 : 0) - (a.isVip ? 1 : 0) || porNome(a, b);
    // 'recentes': quem veio por último primeiro; quem nunca veio vai pro fim.
    return daysSince(a.lastVisitIso) - daysSince(b.lastVisitIso) || porNome(a, b);
  });
  return rows;
}
const MONTH_ABBR = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
function fmtDateShort(iso) {
  const d = new Date(iso);
  return { day: String(d.getDate()).padStart(2, '0'), mon: MONTH_ABBR[d.getMonth()], year: String(d.getFullYear()) };
}
function daysAgoLabel(iso) {
  const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if (days <= 0) return 'hoje';
  if (days === 1) return 'há 1 dia';
  return `há ${days} dias`;
}

// ── componente genérico: lista de barras horizontais ─────────
function distributionBarsHtml(rows, opts = {}) {
  const { formatValue = v => String(v) } = opts;
  const max = Math.max(1, ...rows.map(r => r.value));
  return rows.map(r => `
    <div class="dist-row ${r.highlight ? 'is-current' : ''}">
      <div class="dr-label">${r.label}</div>
      <div class="dr-track"><div class="dr-fill" data-target-width="${Math.round((r.value / max) * 100)}"></div></div>
      <div class="dr-val">${formatValue(r.value)}</div>
    </div>
  `).join('');
}

function animateCounters(root) {
  root.querySelectorAll('[data-count-to]').forEach(el => {
    const to = Number(el.dataset.countTo);
    const prefix = el.dataset.countPrefix || '';
    const suffix = el.dataset.countSuffix || '';
    if (!isFinite(to) || to === 0) { el.textContent = prefix + '0' + suffix; return; }
    const duration = 600;
    const start = performance.now();
    function tick(now) {
      const p = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      const val = Math.round(to * eased);
      el.textContent = prefix + val.toLocaleString('pt-BR') + suffix;
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}
function animateFills(root) {
  root.querySelectorAll('.dr-fill, .adc-bar-fill').forEach(el => {
    requestAnimationFrame(() => { el.style.width = el.dataset.targetWidth + '%'; });
  });
}

// HOME · painel operacional — "Como está minha agenda hoje e
// como será minha semana?"
// ══════════════════════════════════════════════════════════════
function dayAggregate(dateAppts) {
  const sorted = dateAppts.slice().sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
  const count = dateAppts.length;
  const first = sorted.length ? fmtTime(sorted[0].starts_at) : '—';
  const last = sorted.length ? fmtTime(sorted[sorted.length - 1].starts_at) : '—';
  const staffCount = Math.max(1, profissionaisAtivos().length);
  const capacityMinutes = staffCount * WORK_MINUTES_PER_DAY;
  const bookedMinutes = dateAppts.reduce((sum, a) => sum + serviceDurationMinutes(a.service?.id), 0);
  const freeMinutes = Math.max(0, capacityMinutes - bookedMinutes);
  const freeSlots = Math.floor(freeMinutes / 60);
  const occPct = capacityMinutes ? Math.min(100, Math.round((bookedMinutes / capacityMinutes) * 100)) : 0;
  let statusText = 'Agenda saudável', statusClassName = '';
  if (occPct >= 80) { statusText = 'Agenda praticamente lotada'; statusClassName = 'is-busy'; }
  else if (occPct <= 30) { statusText = 'Muitos horários disponíveis'; statusClassName = 'is-quiet'; }
  return { count, first, last, freeSlots, occPct, statusText, statusClassName };
}

const WEEKDAY_FULL_LABELS = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
const WEEKDAY_LONG_LABELS = ['Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado', 'Domingo'];
// Dias em que o salão não abre (0 = domingo, 1 = segunda) — mesma regra usada no agendamento online.
const CLOSED_WEEKDAYS = [0, 1];
function isSalonOpenDay(date) {
  return !CLOSED_WEEKDAYS.includes(date.getDay());
}

function weekAppointmentCounts(weekStart) {
  const days = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    return d;
  });
  const counts = days.map(d => appointmentsOnDate(d).length);
  return { days, counts };
}

function strongestWeakestDay(days, counts) {
  const openIdx = days.map((d, i) => i).filter(i => isSalonOpenDay(days[i]));
  if (!openIdx.some(i => counts[i] > 0)) return null;
  let strongIdx = openIdx[0], weakIdx = openIdx[0];
  openIdx.forEach(i => {
    if (counts[i] > counts[strongIdx]) strongIdx = i;
    if (counts[i] < counts[weakIdx]) weakIdx = i;
  });
  return {
    strong: { label: WEEKDAY_LONG_LABELS[strongIdx], count: counts[strongIdx] },
    weak: { label: WEEKDAY_LONG_LABELS[weakIdx], count: counts[weakIdx] },
  };
}

function bestDayForEncaixe(days) {
  const startOfToday = new Date(); startOfToday.setHours(0, 0, 0, 0);
  let best = null;
  days.forEach((d, i) => {
    if (d < startOfToday || !isSalonOpenDay(d)) return;
    const agg = dayAggregate(appointmentsOnDate(d));
    if (!best || agg.freeSlots > best.freeSlots) {
      best = { label: WEEKDAY_LONG_LABELS[i], freeSlots: agg.freeSlots, occPct: agg.occPct };
    }
  });
  return best;
}

function formatDurationShort(min) {
  if (min <= 0) return '0min';
  const h = Math.floor(min / 60), m = min % 60;
  if (h && m) return `${h}h${m}min`;
  if (h) return `${h}h`;
  return `${m}min`;
}

function nextAvailableSlot() {
  const now = new Date();
  if (!isSalonOpenDay(now)) return null;
  const staffCount = Math.max(1, profissionaisAtivos().length);
  const dayAppts = appointmentsOnDate(now);
  // Expediente, não a grade: este horário é sugerido pra ser oferecido à
  // cliente, e o agendar.html não aceita nada antes das 9h nem depois das 18h.
  const dayStart = new Date(now); dayStart.setHours(OPEN_HOUR, 0, 0, 0);
  const dayEnd = new Date(now); dayEnd.setHours(CLOSE_HOUR, 0, 0, 0);
  let cursor = now > dayStart ? new Date(now) : new Date(dayStart);
  cursor.setSeconds(0, 0);
  cursor.setMinutes(Math.ceil(cursor.getMinutes() / 15) * 15);
  if (cursor >= dayEnd) return null;
  const stepMs = 15 * 60000;
  let slotStart = null;
  for (let t = new Date(cursor); t < dayEnd; t = new Date(t.getTime() + stepMs)) {
    const busy = dayAppts.filter(a => new Date(a.starts_at) <= t && new Date(a.ends_at) > t).length;
    if (busy < staffCount) { slotStart = new Date(t); break; }
  }
  if (!slotStart) return null;
  let slotEnd = new Date(slotStart);
  for (; slotEnd < dayEnd; slotEnd = new Date(slotEnd.getTime() + stepMs)) {
    const busy = dayAppts.filter(a => new Date(a.starts_at) <= slotEnd && new Date(a.ends_at) > slotEnd).length;
    if (busy >= staffCount) break;
  }
  return { start: slotStart, durationMin: Math.round((slotEnd - slotStart) / 60000) };
}

function weekTrend() {
  const curStart = startOfWeekMonday(new Date());
  const prevStart = new Date(curStart); prevStart.setDate(prevStart.getDate() - 7);
  const cur = weekAppointmentCounts(curStart).counts.reduce((a, b) => a + b, 0);
  const prev = weekAppointmentCounts(prevStart).counts.reduce((a, b) => a + b, 0);
  const diff = cur - prev;
  if (diff === 0) {
    return { icon: '➖', headline: 'Mesmo volume da semana anterior', phrase: 'O ritmo de agendamentos se manteve estável.' };
  }
  if (prev === 0) {
    return {
      icon: '📈', headline: `+${diff} agendamento${diff === 1 ? '' : 's'} em relação à semana passada`,
      phrase: 'Você está atendendo mais clientes do que na semana passada.',
    };
  }
  const pct = Math.round((diff / prev) * 100);
  if (pct > 0) {
    return {
      icon: '📈', headline: `+${pct}% em agendamentos em relação à semana passada`,
      phrase: 'Você está atendendo mais clientes do que na semana passada.',
    };
  }
  return {
    icon: '📉', headline: `${pct}% em agendamentos em relação à semana passada`,
    phrase: 'Esta semana apresenta menor ocupação. Considere divulgar horários disponíveis.',
  };
}

function currentWeekRevenue() {
  const start = startOfWeekMonday(new Date());
  const days = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    return d;
  });
  const values = days.map(d => appointmentsOnDate(d).reduce((sum, a) => sum + appointmentRevenue(a), 0));
  return { days, values };
}

function weekRevenueForStart(start) {
  const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(start); d.setDate(d.getDate() + i); return d; });
  return days.reduce((sum, d) => sum + appointmentsOnDate(d).reduce((s, a) => s + appointmentRevenue(a), 0), 0);
}

function monthlyRevenueHistory(months = 6) {
  const now = new Date();
  const result = [];
  for (let i = months - 1; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const total = state.appointments
      .filter(a => {
        const s = new Date(a.starts_at);
        return s.getFullYear() === d.getFullYear() && s.getMonth() === d.getMonth();
      })
      .reduce((sum, a) => sum + appointmentRevenue(a), 0);
    result.push({
      label: d.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', ''),
      total,
      isCurrent: d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth(),
    });
  }
  return result;
}

function monthlyRevenueForOffset(monthsAgo) {
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth() - monthsAgo, 1);
  return state.appointments
    .filter(a => { const s = new Date(a.starts_at); return s.getFullYear() === d.getFullYear() && s.getMonth() === d.getMonth(); })
    .reduce((sum, a) => sum + appointmentRevenue(a), 0);
}

function currentMonthAppointments() {
  const now = new Date();
  return state.appointments.filter(a => {
    const s = new Date(a.starts_at);
    return s.getFullYear() === now.getFullYear() && s.getMonth() === now.getMonth();
  });
}

function newClientsThisMonth() {
  const now = new Date();
  const withDates = state.clients.filter(c => c.created_at);
  if (!withDates.length) return null;
  return withDates.filter(c => {
    const d = new Date(c.created_at);
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  }).length;
}

function monthOccupancyPct(monthAppts) {
  if (!profissionaisAtivos().length) return null;
  const totalMinutes = monthAppts.reduce((sum, a) => sum + serviceDurationMinutes(a.service?.id), 0);
  const now = new Date();
  // Só os dias que o salão abriu entram na capacidade — contar domingo e segunda
  // como dia de trabalho inflava o denominador e derrubava a ocupação do mês.
  // Mesma conta que weekOccupancyPct já fazia.
  let openDaysElapsed = 0;
  for (let d = 1; d <= now.getDate(); d++) {
    if (isSalonOpenDay(new Date(now.getFullYear(), now.getMonth(), d))) openDaysElapsed++;
  }
  openDaysElapsed = Math.max(1, openDaysElapsed);
  const capacity = profissionaisAtivos().length * WORK_MINUTES_PER_DAY * openDaysElapsed;
  if (!capacity) return null;
  return Math.min(100, Math.round((totalMinutes / capacity) * 100));
}

function topServicesThisMonth(monthAppts, limit = 5) {
  const map = new Map();
  monthAppts.forEach(a => {
    const name = a.service?.name || 'Outro';
    map.set(name, (map.get(name) || 0) + 1);
  });
  return Array.from(map.entries())
    .map(([label, value]) => ({ label, value }))
    .sort((a, b) => b.value - a.value)
    .slice(0, limit);
}

function demandProfileThisMonth(monthAppts) {
  const buckets = {};
  for (let h = AGENDA_START_HOUR; h < AGENDA_END_HOUR; h++) buckets[h] = 0;
  monthAppts.forEach(a => {
    const h = new Date(a.starts_at).getHours();
    if (buckets[h] !== undefined) buckets[h]++;
  });
  return Object.keys(buckets).map(h => ({ label: `${h}h`, value: buckets[h] }));
}

function recentBookingHistory(limit = 6) {
  const now = new Date();

    .filter(a => new Date(a.starts_at) < now)

}

function deltaInfo(cur, prev) {

  const pct = Math.round((diff / prev) * 100);

}

function weekOccupancyPct(weekAppts, weekStart) {
  if (!profissionaisAtivos().length) return null;
  const totalMinutes = weekAppts.reduce((sum, a) => sum + serviceDurationMinutes(a.service?.id), 0);
  const now = new Date();
  let openDaysElapsed = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart); d.setDate(d.getDate() + i);
    if (d > now) break;
    if (isSalonOpenDay(d)) openDaysElapsed++;
  }
  openDaysElapsed = Math.max(1, openDaysElapsed);
  const capacity = profissionaisAtivos().length * WORK_MINUTES_PER_DAY * openDaysElapsed;
  if (!capacity) return null;
  return Math.min(100, Math.round((totalMinutes / capacity) * 100));
}

function weekRangeLabel() {
