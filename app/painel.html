          <div class="o-field" style="margin-top:var(--space-3)">
            <label class="o-field-label" for="ncEmail">E-mail (opcional)</label>
            <input type="email" id="ncEmail" class="o-input" placeholder="email@exemplo.com" autocomplete="off">
            <div class="o-field-help">Usaremos para lembretes e confirmações.</div>
          </div>
        </div>

        <div class="nc-section-label">Anotações (opcional)</div>
        <div class="o-card nc-card">
          <div class="o-field">
            <textarea id="ncNotes" class="o-textarea" maxlength="120" placeholder="Alguma observação sobre este cliente..."></textarea>
            <div class="o-field-help nc-notes-count" id="ncNotesCount">0/120</div>
          </div>
        </div>

        <div class="nc-protect-card">
          <span class="nc-protect-icon" aria-hidden="true">${ICONS.check}</span>
          <div>
            <div class="nc-protect-title">Dados protegidos</div>
            <div class="nc-protect-text">As informações deste cliente são utilizadas apenas para gestão de atendimentos e relacionamento.</div>
          </div>
        </div>

        <div id="ncError" class="login-error" style="display:none"></div>

        <div style="display:flex;flex-direction:column;gap:var(--space-2);margin-top:var(--space-4)">
          <button class="o-btn o-btn-primary" id="ncSave"><span aria-hidden="true">${ICONS.plus}</span><span>Cadastrar cliente</span></button>
          <button class="o-btn o-btn-ghost" id="ncCancelBtn">Cancelar</button>
        </div>
      </div>
    </div>
  `;
  const fechar = () => { if (fab) fab.classList.remove('is-open'); closeModal(); };
  document.getElementById('ncCloseBtn').onclick = fechar;
  document.getElementById('ncCancelBtn').onclick = fechar;
  document.getElementById('modalOverlay').onclick = (e) => { if (e.target.id === 'modalOverlay') fechar(); };

  const notesEl = document.getElementById('ncNotes');
  const notesCountEl = document.getElementById('ncNotesCount');
  notesEl.oninput = () => { notesCountEl.textContent = `${notesEl.value.length}/120`; };

  const phoneLocalEl = document.getElementById('ncPhoneLocal');
  phoneLocalEl.oninput = () => {
    const digits = phoneLocalEl.value.replace(/[^0-9]/g, '');
    if (digits !== phoneLocalEl.value) phoneLocalEl.value = digits;
  };

  document.getElementById('ncSave').onclick = async () => {
    const errEl = document.getElementById('ncError');
    const btn = document.getElementById('ncSave');
    errEl.style.display = 'none';

    const name = document.getElementById('ncName').value.trim();
    const phoneLocal = phoneLocalEl.value.trim();
    const email = document.getElementById('ncEmail').value.trim();
    if (!name || !phoneLocal) {
      errEl.textContent = 'Informe nome e telefone.';
      errEl.style.display = 'block';
      return;
    }

    orenziUI.setButtonBusy(btn, 'Cadastrando…');

    // Mesma regra de duplicidade do agendamento online (find_or_create_client
    // + normalize_ie_phone): telefone já cadastrado reaproveita a cliente
    // existente em vez de criar uma segunda entrada pro mesmo número.
    const normalizedPhone = normalizeIePhone('353' + phoneLocal);
    const { data: existing } = await sb.from('clients').select('id').eq('phone', normalizedPhone).maybeSingle();
    if (existing) {
      orenziUI.resetButton(btn);
      fechar();
      showToast('Esse telefone já pertence a uma cliente cadastrada — abrindo o perfil dela.');
      await abrirCliente(existing.id, null);
      return;
    }

    const { data: clientId, error } = await sb.rpc('find_or_create_client', {
      p_name: name,
      p_phone: normalizedPhone,
      p_email: email || null,
    });
    if (error || !clientId) {
      if (error) console.error('find_or_create_client', error);
      errEl.textContent = error
        ? 'Não foi possível cadastrar. Tente de novo.'
        : 'Não foi possível cadastrar — faça login novamente.';
      errEl.style.display = 'block';
      orenziUI.resetButton(btn);
      return;
    }

    await orenziUI.setButtonSuccess(btn, 'Cadastrada');
    fechar();
    await loadClients();
    showToast('Cliente cadastrada');
    render();
  };
}

        <div class="diag-card-body">

        <div class="visit-timeline">
          ${visibleHistory.map(a => {
            const d = fmtDateShort(a.starts_at);
            return `
            <div class="timeline-item" data-appt-id="${a.id}">
              <div class="ti-date"><span class="ti-day">${d.day}</span><span class="ti-mon">${d.mon}</span><span class="ti-year">${d.year}</span></div>

  document.getElementById('backToClients').onclick = () => {
    state.selectedClientId = null;
    render();
  };

  document.getElementById('vipToggleBtn').onclick = async () => {
    const newValue = !isVip;
    const { data: updated, error } = await sb.from('clients').update({ vip: newValue }).eq('id', c.id).select();
    if (error) { showToast('Erro ao salvar: ' + error.message); return; }
    if (!updated || !updated.length) { showToast('Não foi possível salvar — faça login novamente.'); return; }
    c.vip = newValue;
    showToast(newValue ? 'Cliente marcada como VIP' : 'VIP removida');
    render();
  };

  // Leitura: a lista já está em memória (loadClientQuestionnaires), então
  // abrir um questionário — o último ou um antigo — não custa consulta.
  // O leitor (`state.viewQuestionnaire`) aceita qualquer linha; é o mesmo
  // de sempre, e continua em pt-BR mesmo quando a cliente respondeu em
  // outro idioma (o valor gravado é canônico, a tradução é de apresentação).
  app.querySelectorAll('[data-quiz]').forEach(btn => {
    btn.onclick = () => {
      const lista = state.clientQuestionnaires[c.id] || [];
      const alvo = lista.find(q => q.id === btn.dataset.quiz);
      // Estado vazio é tela, não toast: um aviso que some sozinho e não
      // muda nada era indistinguível de botão quebrado.
      state.viewQuestionnaire = alvo || { __empty: true };
      render();
    };
  });

  const cqOlder = document.getElementById('cqOlder');
  if (cqOlder) cqOlder.onclick = () => {
    const lista = document.getElementById('cqOlderList');
    const aberto = !lista.hidden;
    lista.hidden = aberto;
    cqOlder.setAttribute('aria-expanded', String(!aberto));
    cqOlder.textContent = aberto
      ? `Ver anteriores (${(state.clientQuestionnaires[c.id] || []).length - 1})`
      : 'Ocultar anteriores';
  };

  // ── Entrada do fluxo, com a cliente JÁ definida ──
  // A Juliane não escolhe a cliente de novo: o `client_id` vem do perfil
  // aberto, nunca do nome exibido. O fluxo começa direto no idioma, que
  // é a primeira tela que pertence à cliente — e é aí que o quiosque
  // liga, exatamente como já era quando a escolha vinha da aba.
  const cqStart = document.getElementById('cqStart');
  if (cqStart) cqStart.onclick = () => {
    quizStopWelcomeLoop();
    state.quiz = quizFreshState();
    state.quiz.clientId = c.id;
    state.quiz.phase = 'lang';
    state.quiz.origin = 'client-profile';
    state.quiz.originClientId = c.id;

    // rodapé, não do roteador — duplicar o Questionário numa segunda tela
    // seria manter dois questionários vivos.
    state.tab = 'questionario';
    state.clientsScrollTop = 0;
    render();
  };

  app.querySelectorAll('.timeline-item[data-appt-id]').forEach(row => {

      const apptId = row.dataset.apptId;
      if (!state.apptPhotos[apptId]) await loadApptPhotos(apptId);
      state.selectedApptId = apptId;
      render();
    };
  });

  const seeMoreBtn = document.getElementById('seeMoreHistoryBtn');
  if (seeMoreBtn) {
    seeMoreBtn.onclick = () => {
      state.clientHistoryExpanded = true;
      render();
    };
  }

  const photoInput = document.getElementById('photoInput');
  if (photoInput) {
    photoInput.onchange = () => {
      const file = photoInput.files[0];
      if (file) uploadClientPhoto(c.id, file);
    };
  }
  const diagCardHead = document.getElementById('diagCardHead');
  const diagCardBodyWrap = document.getElementById('diagCardBodyWrap');
  if (diagCardHead && diagCardBodyWrap) {
    diagCardHead.onclick = () => {
      const opening = !diagCardHead.classList.contains('is-open');
      state.clientDiagCollapsed = !opening;
      diagCardHead.classList.toggle('is-open', opening);
      if (opening) {
        if (prefersReducedMotion()) { diagCardBodyWrap.style.maxHeight = 'none'; return; }
        diagCardBodyWrap.style.maxHeight = diagCardBodyWrap.scrollHeight + 'px';
        // Solta o limite quando a animação acaba: preso em px, o conteúdo
        // ficaria cortado se os chips passassem a quebrar em mais linhas
        // (rotação de tela, fonte maior do sistema).
        diagCardBodyWrap.addEventListener('transitionend', function done(e) {
          if (e.propertyName !== 'max-height') return;
          diagCardBodyWrap.removeEventListener('transitionend', done);
          if (!state.clientDiagCollapsed) diagCardBodyWrap.style.maxHeight = 'none';
        });
      } else {
        // Sai de 'none' pra um valor concreto e força reflow antes de ir a
        // zero — sem isso o navegador não tem de onde animar. Reflow síncrono
        // em vez de requestAnimationFrame: rAF não dispara em aba oculta e o
        // menu ficaria travado aberto.
        diagCardBodyWrap.style.maxHeight = diagCardBodyWrap.scrollHeight + 'px';
        void diagCardBodyWrap.offsetHeight;
        diagCardBodyWrap.style.maxHeight = '0px';
      }
    };
  }

  app.querySelectorAll('.hair-chip-row[data-hair-field] .hair-chip').forEach(btn => {
    btn.onclick = async () => {
      const field = btn.closest('.hair-chip-row').dataset.hairField;
      const value = btn.classList.contains('active') ? null : btn.dataset.value;
      const { data: updated, error } = await sb.from('clients').update({ [field]: value }).eq('id', c.id).select();
      if (error) { showToast('Erro ao salvar: ' + error.message); return; }
      if (!updated || !updated.length) { showToast('Não foi possível salvar — faça login novamente.'); return; }
      c[field] = value;
      showToast('Diagnóstico atualizado');
      render();
    };
  });

  app.querySelectorAll('.photo-tile[data-photo-id]').forEach(tile => {
    tile.onclick = () => openLightbox(tile.dataset.url);
  });
  app.querySelectorAll('.photo-delete-btn[data-photo-id]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      deleteClientPhoto(c.id, btn.dataset.photoId);
    };
  });
}

// ── Valor do atendimento (17/08/2026) ────────────────────────
// O bloco vive AQUI, no atendimento dentro do perfil da cliente, e não
// numa tela nova nem na Agenda: definir o valor é algo que acontece com
// a cliente na cadeira, olhando o cabelo, e este é o único lugar do app
// que já é sobre um atendimento específico.
//
// Dois estados. Sem valor final, o número é o do agendamento e o convite
// é discreto; com valor final, ele vira o número principal e o snapshot
// desce a linha secundária. Nenhum dos dois usa cor de alerta — não há
// nada errado em qualquer um dos casos.
//
// A ação existe para QUALQUER atendimento, não só para `price_varies`:
// atendimento antigo sem snapshot, multi-serviço cujo `service_id`
// legado guarda um serviço só, e ajuste excepcional são todos motivos
// legítimos, e nenhum deles depende do serviço variar de preço.
function apptValorSectionHtml(a) {
  const temFinal = valorSeDefinido(a.final_price) !== null;
  const valor = appointmentRevenue(a);
  const agendado = appointmentBookedValue(a);
  return `
    <div class="appt-valor" id="apptValorBloco">
      <div class="section-label" style="margin-bottom:4px;">VALOR DO ATENDIMENTO</div>
      <div class="av-num">${formatCurrency(valor)}</div>
      <div class="av-tag">${temFinal ? 'Valor final' : 'Valor do agendamento'}</div>
      ${temFinal ? `<div class="av-orig">Valor no agendamento: ${formatCurrency(agendado)}</div>` : ''}
      <button type="button" class="av-btn" id="apptValorBtn">
        ${temFinal ? 'Editar valor' : 'Definir valor final'}
      </button>
    </div>`;
}

// Folha curta, não tela cheia: é um campo só. A regra do DS é a de
// sempre — fluxo de várias etapas ou formulário longo é tela; uma
// escolha ou um campo é folha (docs/04 §BottomSheet).
function openApptValorSheet(apptId) {
  const a = state.appointments.find(x => x.id === apptId);
  if (!a) return;
  const temFinal = valorSeDefinido(a.final_price) !== null;
  const agendado = appointmentBookedValue(a);
  const atual = temFinal ? valorSeDefinido(a.final_price) : '';

  modalContainer.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-sheet">
        <h2>Valor final do atendimento</h2>
        <div class="av-field">
          <span class="av-cur" aria-hidden="true">€</span>
          <input id="avInput" class="av-input" type="text" inputmode="decimal"
            autocomplete="off" enterkeyhint="done"
            aria-label="Valor final do atendimento, em euros"
            placeholder="${agendado}" value="${atual === '' ? '' : atual}">
        </div>
        <p class="av-hint">Valor considerado no agendamento: ${formatCurrency(agendado)}</p>
        <p class="av-error" id="avError" role="alert" hidden></p>
        <button class="btn btn-primary" id="avSave">Salvar valor</button>
        ${temFinal ? '<button type="button" class="av-reset" id="avReset">Usar valor do agendamento</button>' : ''}
      </div>
    </div>`;

  const input = document.getElementById('avInput');
  const erroEl = document.getElementById('avError');
  const btnSalvar = document.getElementById('avSave');

  document.getElementById('modalOverlay').onclick = (e) => { if (e.target.id === 'modalOverlay') closeModal(); };
  // Foco só depois da entrada da folha: focar durante a animação faz o
  // teclado do iPhone subir junto e a folha chegar torta.
  setTimeout(() => { input.focus(); input.select(); }, 260);

  function erro(msg) {
    erroEl.textContent = msg;
    erroEl.hidden = false;
    input.setAttribute('aria-invalid', 'true');
    input.focus();
  }

  async function gravar(valor, btn) {
    orenziUI.setButtonBusy(btn);
    // Escrita pela RPC, nunca por `update()` direto: é ela que garante
    // que `total_price` não é tocado e que o negativo morre no servidor.
    const { data, error } = await sb.rpc('set_appointment_final_price', {
      p_appointment_id: apptId,
      p_final_price: valor,
    });
    if (error) {
      console.error('set_appointment_final_price', error);
      orenziUI.resetButton(btn);
      showToast(error.message && error.message.includes('AUTH_REQUIRED')
        ? 'Sessão expirada — faça login novamente.'
        : 'Não foi possível salvar o valor. Tente de novo.');
      return;
    }
    // A linha devolvida pela RPC é a verdade; o state copia dela, não do
    // que foi enviado. Se o banco tiver arredondado ou recusado em
    // silêncio, a tela concorda com o banco em vez de com o formulário.
    const linha = Array.isArray(data) ? data[0] : data;
    a.final_price = linha ? linha.final_price : valor;
    a.final_price_updated_at = linha ? linha.final_price_updated_at : null;
    closeModal();
    renderApptDetail();
    showToast(valor === null ? 'Voltou ao valor do agendamento' : 'Valor final salvo');
  }

  btnSalvar.onclick = () => {
    // Aceita "370", "370,50" e "370.50" — a vírgula é o separador que a
    // Juliane digita, e o teclado decimal do iPhone entrega vírgula.
    const bruto = String(input.value).trim().replace(/\s/g, '').replace(',', '.');
    if (bruto === '') return erro('Digite um valor, ou toque em "Usar valor do agendamento".');
    const n = Number(bruto);
    if (!isFinite(n)) return erro('Valor inválido. Use apenas números.');
    if (n < 0) return erro('O valor não pode ser negativo.');
    gravar(n, btnSalvar);
  };
  input.oninput = () => { erroEl.hidden = true; input.removeAttribute('aria-invalid'); };
  input.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); btnSalvar.click(); } };

  const btnReset = document.getElementById('avReset');
  // Reset NÃO é destrutivo e não pede confirmação: nada se perde, o
  // `total_price` continua onde sempre esteve e a ação é reversível
  // digitando o valor de novo. Por isso não é vermelha nem tem diálogo.
  if (btnReset) btnReset.onclick = () => gravar(null, btnReset);
}

  document.getElementById('greetingSub').textContent = '';

    state.selectedApptId = null;
    render();
  };

  document.querySelectorAll('.apptPhotoInput').forEach(input => {
    input.onchange = () => {
      const file = input.files[0];
      if (file) uploadApptPhoto(a.client?.id, a.id, input.dataset.kind, file);
    };
  });
  app.querySelectorAll('.photo-tile[data-photo-id]').forEach(tile => {
    tile.onclick = () => openLightbox(tile.dataset.url);
  });

    btn.onclick = (e) => {
      e.stopPropagation();
      deleteApptPhoto(a.id, btn.dataset.photoId);
    };
  });

  document.getElementById('apptSave').onclick = async () => {
    const btn = document.getElementById('apptSave');
    const payload = {
      technique: document.getElementById('apptTechnique').value || null,
      product_used: document.getElementById('apptProduct').value.trim() || null,
      oxidant_used: document.getElementById('apptOxidant').value.trim() || null,
      color_formula: document.getElementById('apptColorFormula').value.trim() || null,

    state.selectedApptId = null;
    render();
  };
}

// ── Estado e traduções ────────────────────────────────────────
function quizFreshState() {
  return {
    phase: 'client', index: 0, language: null, welcomeIndex: 0, welcomeTimer: null,
    clientId: null, clientQuery: '', answers: {}, refs: [], saving: false,
    // De onde o fluxo foi aberto, e para onde ele devolve o painel.
    // 'client-profile' = veio do perfil da cliente (entrada principal desde
    // 17/08/2026) e volta para lá. `null` = caminho legado, que volta para
    // a escolha de cliente. Um fluxo só, dois pontos de entrada e saída.
    origin: null, originClientId: null,
    // Ligado quando o passo foi aberto pelo "Alterar" da revisão: corrigir
    // uma resposta tem que devolver pra revisão, não recomeçar a fila.
    returnToReview: false,
  };
}

function quizLang() {
  return (state.quiz && state.quiz.language) || QUIZ_LANG_DEFAULT;
}

// Texto de interface no idioma corrente, com o português como rede.
function qt(key, ...args) {
  const dict = QUIZ_UI[quizLang()] || QUIZ_UI[QUIZ_LANG_DEFAULT];
  const val = dict[key] != null ? dict[key] : QUIZ_UI[QUIZ_LANG_DEFAULT][key];
  return typeof val === 'function' ? val(...args) : (val || '');
}

// Texto de conteúdo (pergunta, opção, referência) — recebe o mapa por
// idioma. `lang` explícito serve ao relatório, que lê sempre em português.
function qtr(map, lang) {
  if (!map) return '';
  const code = lang || quizLang();
  return map[code] != null ? map[code] : (map[QUIZ_LANG_DEFAULT] || '');
}

// Rótulo de uma resposta gravada. O banco guarda o canônico em português;
// aqui ele volta a ser texto de tela no idioma pedido.
function quizAnswerLabel(question, value, lang) {
  if (!value) return '';
  if (question.type !== 'choice') return value;
  const opt = (question.options || []).find(o => o.value === value);
  return opt ? qtr(opt.label, lang) : value;
}

// ── Motor da tela ─────────────────────────────────────────────
function quizStopWelcomeLoop() {
  if (state.quiz && state.quiz.welcomeTimer) {
    clearInterval(state.quiz.welcomeTimer);
    state.quiz.welcomeTimer = null;
  }
}

// Zera tudo — usado na troca de aba, no "Sair" e depois de salvar. Precisa
// passar por aqui (e não por um objeto literal solto) porque o loop da tela
// de idioma é um setInterval: sem o clear, ele sobrevive à troca de aba e
// fica procurando um elemento que não existe mais.
function quizResetAll() {
  quizStopWelcomeLoop();
  state.quiz = quizFreshState();
}

// Saída contextual do fluxo. Lê a origem ANTES de zerar o state — depois
// de `quizResetAll()` ela não existe mais, e o painel voltaria para o
// lugar errado sem nenhum erro visível.
//
// Vale para as três saídas: o CTA do Sucesso, o "Sair" do cabeçalho e o
// "Voltar" da tela de idioma. Ter uma função só é o que garante que as
// três concordem.
function quizSair() {
  const origem = state.quiz.origin;
  const clienteId = state.quiz.originClientId;
  quizResetAll();
  setKioskMode(false);
  state.viewQuestionnaire = null;
  if (origem === 'client-profile' && clienteId) {
    state.tab = 'clients';
    // ⚠ Renderiza por `abrirCliente()`, e nao por `render()` direto: e ela
    // que RECARREGA os questionarios da cliente. Sem isso, ao voltar de um
    // questionario recem-salvo o perfil mostraria o ANTERIOR como ultimo,
    // ou nenhum — a tela mentiria sobre algo que a Juliane acabou de fazer.
    abrirCliente(clienteId, null);
    return;
  }
  // Caminho legado: devolve a escolha de cliente, como sempre foi.
  state.tab = 'questionario';
  renderQuestionario();
}

function quizGo(mutateFn) {
  quizStopWelcomeLoop();
  if (mutateFn) mutateFn();
  renderQuestionario();
}

// A anatomia é sempre a mesma — head → corpo rolável → rodapé — e é isso
// que faz as 11 telas do fluxo lerem como um produto só.
function quizShellHtml({ kiosk = true, exit = kiosk, back = false, title = '', subtitle = '', progress = null, body, footer = '' }) {
  const total = QUIZ_QUESTIONS.length;
  return `
    <section class="quiz-screen${kiosk ? '' : ' is-inline'}">
      <header class="quiz-head">
        ${back
          ? `<button type="button" class="o-icon-btn quiz-back" id="quizBack" aria-label="${esc(qt('back'))}">${ICONS.chevron}</button>`
          : '<span class="quiz-head-spacer"></span>'}
        <div class="quiz-head-titles">
          ${title ? `<div class="quiz-head-title">${esc(title)}</div>` : ''}
          ${subtitle ? `<div class="quiz-head-sub">${esc(subtitle)}</div>` : ''}
        </div>
        ${exit
          ? `<button type="button" class="o-btn o-btn-ghost o-btn-inline" id="quizExit">${esc(qt('exit'))}</button>`
          : '<span class="quiz-head-spacer"></span>'}
      </header>
      ${progress == null ? '' : `
        <div class="quiz-progress">
          <div class="quiz-progress-track" role="progressbar"
               aria-valuemin="1" aria-valuemax="${total}" aria-valuenow="${progress}"
               aria-label="${esc(qt('progress', progress, total))}">
            <div class="quiz-progress-fill" style="width:${Math.round((progress / total) * 100)}%"></div>
          </div>
          <div class="quiz-progress-label">${esc(qt('progress', progress, total))}</div>
        </div>`}
      <div class="quiz-body"><div class="quiz-page">${body}</div></div>
      <footer class="quiz-footer">${footer}</footer>
    </section>`;
}

// Foco no título do passo (docs/07 §6): sem isso o innerHTML novo joga o
// foco no <body> e o leitor de tela recomeça do topo do documento a cada
// pergunta. `preventScroll` porque o corpo já nasce no topo.
function quizFocusStep() {
  const el = document.getElementById('quizStepTitle');
  if (el) el.focus({ preventScroll: true });
}

function quizBindShell({ onBack } = {}) {
  const back = document.getElementById('quizBack');
  if (back) back.onclick = onBack;
  const exit = document.getElementById('quizExit');
  if (exit) exit.onclick = quizConfirmExit;
}

function quizConfirmExit() {
  orenziUI.confirm({
    title: qt('exitTitle'),
    message: qt('exitMsg'),
    confirmLabel: qt('exitConfirm'),
    cancelLabel: qt('exitCancel'),
    successLabel: qt('exitDone'),
    destructive: true,
    onConfirm: () => { quizSair(); },
  });
}

// ── Passo: idioma ─────────────────────────────────────────────
function quizRenderLanguage() {
  const reduced = prefersReducedMotion();
  const first = QUIZ_LANGS[state.quiz.welcomeIndex] || QUIZ_LANGS[0];
  // O nome no subtítulo é para a Juliane conferir a quem está entregando o
  // tablet — a cliente já foi escolhida na tela anterior.
  const client = (state.clients || []).find(c => c.id === state.quiz.clientId);

  // Com movimento reduzido as três saudações aparecem juntas e paradas —
  // é a mesma informação sem loop nenhum, e não uma versão pobre da tela.
  const headline = reduced
    ? `<h2 class="quiz-welcome-static" id="quizStepTitle" tabindex="-1">
         ${QUIZ_LANGS.map(l => `<span lang="${l.code}">${esc(l.welcome)}</span>`).join('')}
       </h2>`
    : `<h2 class="quiz-welcome-word-wrap" id="quizStepTitle" tabindex="-1">
         <span class="quiz-welcome-word is-in" id="quizWelcomeWord" lang="${first.code}">${esc(first.welcome)}</span>
       </h2>`;

  app.innerHTML = quizShellHtml({
    back: true,
    subtitle: client ? client.name : '',
    body: `
      <div class="quiz-welcome">
        ${headline}
        <p class="quiz-welcome-prompt">
          ${QUIZ_LANGS.map(l => `<span lang="${l.code}">${esc(QUIZ_UI[l.code].langPrompt)}</span>`).join('<br>')}
        </p>
        <div class="quiz-lang-list">
          ${QUIZ_LANGS.map(l => `
            <button type="button" class="o-btn o-btn-secondary" data-lang="${esc(l.code)}" lang="${l.code}">
              ${esc(l.name)}
            </button>`).join('')}
        </div>
      </div>`,
  });

  // Voltar daqui devolve o tablet para a Juliane (sai do quiosque) e zera o
  // idioma: quem escolhe é a cliente, e a próxima pode não ser a mesma.
  quizBindShell({ onBack: () => {
    // Aberto pelo perfil, voltar daqui sai do fluxo e devolve o perfil —
    // mandar para a escolha de cliente levaria a Juliane a uma tela que
    // nao foi por onde ela entrou.
    if (state.quiz.origin === 'client-profile') return quizSair();
    quizGo(() => {
      state.quiz.language = null;
      state.quiz.phase = 'client';
    });
  } });

  app.querySelectorAll('[data-lang]').forEach(btn => {
    btn.onclick = () => quizGo(() => {
      state.quiz.language = btn.dataset.lang;
      state.quiz.phase = 'questions';
      state.quiz.index = 0;
    });
  });

  quizFocusStep();
  if (!reduced) quizStartWelcomeLoop();
}

// A palavra sobe e some, a próxima entra por baixo. Mexe só no
// `#quizWelcomeWord` — nada de re-render, senão os botões de idioma
// nasceriam de novo a cada 2,6s e um toque no meio da troca se perderia.
function quizStartWelcomeLoop() {
  quizStopWelcomeLoop();
  state.quiz.welcomeTimer = setInterval(() => {
    const el = document.getElementById('quizWelcomeWord');
    // A tela saiu de baixo do timer (troca de aba, escolha de idioma):
    // o próprio loop se desliga em vez de depender de quem saiu.
    if (!el) { quizStopWelcomeLoop(); return; }
    state.quiz.welcomeIndex = (state.quiz.welcomeIndex + 1) % QUIZ_LANGS.length;
    const next = QUIZ_LANGS[state.quiz.welcomeIndex];
    el.classList.remove('is-in');
    el.classList.add('is-out');
    setTimeout(() => {
      const still = document.getElementById('quizWelcomeWord');
      if (!still) return;
      still.textContent = next.welcome;
      still.setAttribute('lang', next.code);
      still.classList.remove('is-out');
      still.classList.add('is-in');
    }, QUIZ_WORD_SWAP_MS);
  }, QUIZ_WELCOME_DWELL_MS);
}

// ── Passo: cliente ────────────────────────────────────────────
function quizClientMatches() {
  const q = (state.quiz.clientQuery || '').trim().toLowerCase();
  const list = (state.clients || []).slice().sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  if (!q) return list;
  return list.filter(c => (c.name || '').toLowerCase().includes(q) || (c.phone || '').includes(q));
}

function quizClientListHtml() {
  const list = quizClientMatches();
  if (!list.length) {
    return emptyStateHtml({ icon: ICONS.users, compact: true, title: qt('clientEmpty') });
  }
  return list.map(c => `
    <button type="button" class="quiz-client o-card o-card-interactive" data-client="${esc(c.id)}">
      <span class="avatar-round" aria-hidden="true">${esc(initials(c.name))}</span>
      <span class="quiz-client-name">${esc(c.name)}</span>
      <span class="quiz-client-chev" aria-hidden="true">${ICONS.chevron}</span>
    </button>`).join('');
}

function quizRenderClientPicker() {
  app.innerHTML = quizShellHtml({
    kiosk: false,
    body: `
      <h2 class="quiz-question" id="quizStepTitle" tabindex="-1">${esc(qt('clientTitle'))}</h2>
      <p class="quiz-helper">${esc(qt('clientHelper'))}</p>
      <label class="o-search-field${state.quiz.clientQuery ? ' has-text' : ''}" id="quizSearchField">
        <span class="o-search-field-icon" aria-hidden="true">${ICONS.search}</span>
        <input type="search" id="quizClientSearch" value="${esc(state.quiz.clientQuery)}"
               placeholder="${esc(qt('clientSearch'))}" aria-label="${esc(qt('clientSearch'))}"
               autocomplete="off">
        <button type="button" class="o-search-clear" id="quizClientClear" aria-label="${esc(qt('clear'))}">${ICONS.close}</button>
      </label>
      <div class="quiz-client-list" id="quizClientList">${quizClientListHtml()}</div>`,
  });

  // Primeira tela do fluxo: não há para onde voltar, e não há "Sair" —
  // sair daqui é tocar em outra aba, que é o que a Juliane já faria.
  const input = document.getElementById('quizClientSearch');
  const field = document.getElementById('quizSearchField');
  // A busca não passa por renderQuestionario(): o <input> seria recriado a
  // cada tecla e perderia o foco com o cursor voltando pro começo. Mesma
  // armadilha já documentada na lista de clientes e no Estoque.
  input.oninput = () => {
    state.quiz.clientQuery = input.value;
    field.classList.toggle('has-text', !!input.value);
    quizPaintClientList();
  };
  // mousedown, não click: o blur do input dispararia primeiro e o botão já
  // teria sumido junto com a classe .has-text.
  document.getElementById('quizClientClear').onmousedown = (e) => {
    e.preventDefault();
    state.quiz.clientQuery = '';
    input.value = '';
    field.classList.remove('has-text');
    quizPaintClientList();
    input.focus();
  };
  quizBindClientRows();
  quizFocusStep();
}

function quizPaintClientList() {
  const wrap = document.getElementById('quizClientList');
  if (!wrap) return;
  wrap.innerHTML = quizClientListHtml();
  quizBindClientRows();
}

function quizBindClientRows() {
  app.querySelectorAll('[data-client]').forEach(row => {
    row.onclick = () => quizGo(() => {
      state.quiz.clientId = row.dataset.client;
      // Daqui em diante é quiosque: a próxima tela (idioma) já é da cliente.
      state.quiz.phase = 'lang';
    });
  });
}

// ── Passo: pergunta ───────────────────────────────────────────
function quizQuestionBodyHtml(q) {
  const answer = state.quiz.answers[q.field];

  if (q.type === 'choice') {
    return `
      <div class="quiz-options" role="radiogroup" aria-labelledby="quizStepTitle">
        ${q.options.map(o => {
          const on = answer === o.value;
          return `
            <button type="button" class="quiz-option o-card o-card-interactive" role="radio"
                    aria-checked="${on}" data-value="${esc(o.value)}">
              <span class="quiz-option-label">${esc(qtr(o.label))}</span>
              <span class="quiz-option-mark" aria-hidden="true"></span>
            </button>`;
        }).join('')}
      </div>`;
  }

  if (q.type === 'text') {
    // O rótulo programático é o próprio título do passo (aria-labelledby):
    // um <label> visível repetiria a pergunta que já está logo acima em
    // corpo maior. O que a V1 não tinha era o vínculo, não o texto.
    return `
      <div class="o-field">
        <textarea class="o-textarea" id="quizText" rows="5" aria-labelledby="quizStepTitle"
                  placeholder="${esc(qtr(q.placeholder))}">${esc(answer || '')}</textarea>
      </div>`;
  }

  // refs
  const chosen = state.quiz.refs;
  const full = chosen.length >= QUIZ_MAX_REFS;
  return `
    <div class="quiz-refs" role="group" aria-labelledby="quizStepTitle">
      ${QUIZ_REFERENCES.map(r => {
        const on = chosen.includes(r.id);
        const off = !on && full;
        return `
          <button type="button" class="quiz-ref o-card o-card-interactive" data-ref="${esc(r.id)}"
                  aria-pressed="${on}" aria-disabled="${off}">
            <span class="quiz-ref-swatch" style="--ref-1:${r.tone[0]};--ref-2:${r.tone[1]}">
              ${r.imageUrl ? `<img src="${esc(r.imageUrl)}" alt="">` : ''}
              ${r.imageUrl ? '' : `<span class="quiz-ref-tag">${esc(qt('refPlaceholder'))}</span>`}
              <span class="quiz-ref-check" aria-hidden="true">${ICONS.check}</span>
            </span>
            <span class="quiz-ref-name">${esc(qtr(r.name))}</span>
          </button>`;
      }).join('')}
    </div>
    <p class="quiz-ref-counter" id="quizRefCounter" role="status" aria-live="polite">
      ${esc(qt('refCounter', chosen.length, QUIZ_MAX_REFS))}
    </p>`;
}

function quizRenderQuestion() {
  const i = state.quiz.index;
  const q = QUIZ_QUESTIONS[i];
  const client = (state.clients || []).find(c => c.id === state.quiz.clientId);

  app.innerHTML = quizShellHtml({
    back: true,
    subtitle: client ? client.name : '',
    progress: i + 1,
    body: `
      <h2 class="quiz-question" id="quizStepTitle" tabindex="-1">${esc(qtr(q.title))}</h2>
      ${q.helper ? `<p class="quiz-helper">${esc(qtr(q.helper))}</p>` : ''}
      ${quizQuestionBodyHtml(q)}`,
    footer: `<button type="button" class="o-btn o-btn-primary" id="quizNext">${esc(qt('continue'))}</button>`,
  });

  quizBindShell({ onBack: quizBack });

  if (q.type === 'choice') {
    // Sem auto-advance: a V1 pulava de tela no `onchange` do <select> e não
    // havia como revisar. Selecionar e confirmar é mais previsível, que foi
    // o que o Raphael pediu — e o toque duplo (escolher + Continuar) num
    // tablet custa menos que uma resposta errada sem volta.
    app.querySelectorAll('.quiz-option').forEach(btn => {
      btn.onclick = () => {
        state.quiz.answers[q.field] = btn.dataset.value;
        app.querySelectorAll('.quiz-option').forEach(o => {
          o.setAttribute('aria-checked', String(o === btn));
        });
      };
    });
  }

  if (q.type === 'refs') {
    app.querySelectorAll('.quiz-ref').forEach(btn => {
      btn.onclick = () => {
        const id = btn.dataset.ref;
        const at = state.quiz.refs.indexOf(id);
        if (at >= 0) state.quiz.refs.splice(at, 1);
        else if (state.quiz.refs.length < QUIZ_MAX_REFS) state.quiz.refs.push(id);
        else return;
        quizPaintRefs();
      };
    });
  }

  const next = document.getElementById('quizNext');
  next.onclick = () => {
    if (q.type === 'text') {
      const el = document.getElementById('quizText');
      state.quiz.answers[q.field] = el.value.trim();
    }
    quizGo(() => {
      if (state.quiz.returnToReview) { state.quiz.returnToReview = false; state.quiz.phase = 'review'; return; }
      if (state.quiz.index < QUIZ_QUESTIONS.length - 1) state.quiz.index += 1;
      else state.quiz.phase = 'review';
    });
  };

  quizFocusStep();
}

// Estado dos tiles sem re-render: a grade rolada não pode saltar pro topo a
// cada toque, e o botão sob o dedo não pode ser destruído no meio do gesto.
function quizPaintRefs() {
  const chosen = state.quiz.refs;
  const full = chosen.length >= QUIZ_MAX_REFS;
  app.querySelectorAll('.quiz-ref').forEach(btn => {
    const on = chosen.includes(btn.dataset.ref);
    btn.setAttribute('aria-pressed', String(on));
    btn.setAttribute('aria-disabled', String(!on && full));
  });
  const counter = document.getElementById('quizRefCounter');
  if (counter) counter.textContent = qt('refCounter', chosen.length, QUIZ_MAX_REFS);
}

function quizBack() {
  quizGo(() => {
    if (state.quiz.returnToReview) { state.quiz.returnToReview = false; state.quiz.phase = 'review'; return; }
    if (state.quiz.phase === 'review') { state.quiz.index = QUIZ_QUESTIONS.length - 1; state.quiz.phase = 'questions'; return; }
    if (state.quiz.index > 0) { state.quiz.index -= 1; return; }
    state.quiz.phase = 'lang';
  });
}

// ── Passo: revisão ────────────────────────────────────────────
function quizRenderReview() {
  const client = (state.clients || []).find(c => c.id === state.quiz.clientId);

  const items = QUIZ_QUESTIONS.map((q, i) => {
    let answerHtml;
    if (q.type === 'refs') {
      answerHtml = state.quiz.refs.length
        ? `<div class="quiz-review-refs">${state.quiz.refs.map(id => {
            const r = quizReference(id);
            if (!r) return '';
            return `<span class="quiz-review-ref"><i style="--ref-1:${r.tone[0]};--ref-2:${r.tone[1]}"></i>${esc(qtr(r.name))}</span>`;
          }).join('')}</div>`
        : `<div class="quiz-review-a is-empty">${esc(qt('none'))}</div>`;
    } else {
      const val = state.quiz.answers[q.field];
      answerHtml = val
        ? `<div class="quiz-review-a">${esc(quizAnswerLabel(q, val))}</div>`
        : `<div class="quiz-review-a is-empty">${esc(qt('unanswered'))}</div>`;
    }
    return `
      <div class="quiz-review-item o-card">
        <div class="quiz-review-head">
          <span class="quiz-review-q">${esc(qtr(q.title))}</span>
          <button type="button" class="o-btn o-btn-inline" data-edit="${i}">${esc(qt('edit'))}</button>
        </div>
        ${answerHtml}
      </div>`;
  }).join('');

  app.innerHTML = quizShellHtml({
    back: true,
    subtitle: client ? client.name : '',
    body: `
      <h2 class="quiz-question" id="quizStepTitle" tabindex="-1">${esc(qt('reviewTitle'))}</h2>
      <p class="quiz-helper">${esc(qt('reviewHelper'))}</p>
      <div class="quiz-review-list">${items}</div>`,
    footer: `
      <div class="quiz-error" id="quizError" role="alert" hidden></div>
      <button type="button" class="o-btn o-btn-primary" id="quizSave">${esc(qt('save'))}</button>`,
  });

  quizBindShell({ onBack: quizBack });

  app.querySelectorAll('[data-edit]').forEach(btn => {
    btn.onclick = () => quizGo(() => {
      state.quiz.index = Number(btn.dataset.edit);
      state.quiz.phase = 'questions';
      state.quiz.returnToReview = true;
    });
  });

  document.getElementById('quizSave').onclick = (e) => quizSave(e.currentTarget);
  quizFocusStep();
}

// ── Gravação ──────────────────────────────────────────────────
// A migration que traz `language` e `reference_images` é a etapa B deste
// trabalho e ainda não foi aplicada. Enquanto ela não entrar, o INSERT
// completo volta com "coluna não existe" — aqui isso é detectado e o
// registro é gravado sem os dois campos novos, em vez de a cliente ver um
// erro por uma dívida de banco. Quando a migration entrar, o primeiro
// INSERT passa e este caminho deixa de ser usado sozinho.
function quizMissingColumn(error) {
  if (!error) return false;
  if (error.code === '42703' || error.code === 'PGRST204') return true;
  return /could not find the .* column|column .* does not exist/i.test(error.message || '');
}

async function quizSave(btn) {
  if (state.quiz.saving) return;
  state.quiz.saving = true;

  const errorEl = document.getElementById('quizError');
  if (errorEl) errorEl.hidden = true;
  orenziUI.setButtonBusy(btn, qt('saving'));

  const legacy = {
    client_id: state.quiz.clientId,
    had_bleaching: state.quiz.answers.had_bleaching || null,
    chemical_treatment: state.quiz.answers.chemical_treatment || null,
    last_chemical: state.quiz.answers.last_chemical || null,
    chemical_cut_or_breakage: state.quiz.answers.chemical_cut_or_breakage || null,
    henna_or_black_dye: state.quiz.answers.henna_or_black_dye || null,
    goal: state.quiz.answers.goal || null,
  };
  const payload = {
    ...legacy,
    language: state.quiz.language || QUIZ_LANG_DEFAULT,
    reference_images: state.quiz.refs.slice(),
  };

  function fail(msg, err) {
    if (err) console.error('client_questionnaires.insert', err);
    state.quiz.saving = false;
    orenziUI.resetButton(btn);
    if (errorEl) { errorEl.textContent = msg; errorEl.hidden = false; }
  }

  let { data, error } = await sb.from('client_questionnaires').insert(payload).select();

  if (error && quizMissingColumn(error)) {
    console.warn('client_questionnaires: colunas language/reference_images ainda não existem — gravando sem elas (migration da etapa B pendente).', error);
    ({ data, error } = await sb.from('client_questionnaires').insert(legacy).select());
  }

  if (error) return fail(qt('saveError'), error);
  // Escrita autenticada sempre confere o retorno do .select(): com a sessão
  // expirada a RLS deixa o insert passar sem tocar em linha nenhuma, e a
  // tela mentiria dizendo que salvou.
  if (!data || !data.length) return fail(qt('saveErrorAuth'));

  await orenziUI.setButtonSuccess(btn, qt('saved'));
  state.quiz.saving = false;
  // A lista em memória do perfil ficou velha no instante deste INSERT.
  // Invalidar é obrigatório: sem isto a Juliane volta ao perfil e vê o
  // questionário ANTERIOR como "último" — a tela mentiria sobre algo que
  // ela acabou de fazer. Apagar a chave faz o perfil recarregar sozinho.
  if (state.quiz.clientId) delete state.clientQuestionnaires[state.quiz.clientId];
  quizGo(() => { state.quiz.phase = 'success'; });
}

// ── Sucesso ───────────────────────────────────────────────────
function quizRenderSuccess() {
  app.innerHTML = quizShellHtml({
    exit: false,
    body: `
      <div class="quiz-success">
        <span class="quiz-success-mark" aria-hidden="true">${ICONS.check}</span>
        <h2 class="quiz-success-title" id="quizStepTitle" tabindex="-1">${esc(qt('successTitle'))}</h2>
        <p class="quiz-success-msg">${esc(qt('successMsg'))}</p>
      </div>`,
    footer: `<button type="button" class="o-btn o-btn-primary" id="quizDone">${esc(qt('successCta'))}</button>`,
  });
  // O CTA devolve o painel para a Juliane, fora do quiosque e sem cliente,
  // idioma, respostas ou referências da sessão anterior em memória. PARA
  // ONDE ele devolve depende da origem: aberto pelo perfil, volta ao perfil
  // da mesma cliente; pelo caminho legado, volta à escolha de cliente.
  document.getElementById('quizDone').onclick = () => quizSair();
  quizFocusStep();
}

// ── Roteador da aba ───────────────────────────────────────────
function renderQuestionario() {
  document.getElementById('greeting').textContent = QUIZ_UI[QUIZ_LANG_DEFAULT].tab;
  document.getElementById('greetingSub').textContent = '';

  const phase = state.quiz.phase;
  // A escolha da cliente é a PRIMEIRA tela e pertence ao painel da Juliane:
  // header e nav continuam à vista, porque é ela quem opera. O quiosque
  // começa no instante em que a cliente é escolhida — a partir daí o tablet
  // está conceitualmente na mão da cliente, e a tela de idioma já é dela.
  // Ao contrário da V1, sempre existe saída: o botão "Sair" no cabeçalho.
  setKioskMode(phase !== 'client');

  if (phase === 'lang') return quizRenderLanguage();
  if (phase === 'client') return quizRenderClientPicker();
  if (phase === 'review') return quizRenderReview();
  if (phase === 'success') return quizRenderSuccess();
  return quizRenderQuestion();
}

function setKioskMode(active) {
  document.querySelector('header').style.display = active ? 'none' : 'flex';
  document.querySelector('nav').style.display = active ? 'none' : 'flex';
  document.body.style.paddingBottom = active ? '0' : '';
}

// ── Relatório no perfil da cliente ────────────────────────────
// Consulta manual da Juliane, e só isso: nenhuma análise, nenhum alerta,
// nenhuma recomendação derivada das respostas (decisão de produto de
// 15/08/2026 — o questionário é arquivo, não motor).
//
// As respostas são exibidas SEMPRE em português, mesmo quando a cliente
// respondeu em inglês ou espanhol: quem lê esta tela é a Juliane. O idioma
// usado aparece como etiqueta, porque é informação sobre o atendimento.
function quizLanguageName(code) {
  const l = QUIZ_LANGS.find(x => x.code === code);
  return l ? l.name : (code || '—');
}

function renderQuestionnaireReport() {
  const q = state.viewQuestionnaire;
  document.getElementById('greeting').textContent = QUIZ_UI[QUIZ_LANG_DEFAULT].tab;
  document.getElementById('greetingSub').textContent = '';

  if (q && q.__empty) {
    app.innerHTML = `
      ${back}
      ${emptyStateHtml({
        icon: ICONS.clipboard,
        title: 'Nenhum questionário preenchido ainda.',
        caption: 'Abra a aba Questionário e entregue o tablet para a cliente — as respostas aparecem aqui assim que ela terminar.',
      })}`;
    document.getElementById('backToClientFromQuiz').onclick = () => {
      state.viewQuestionnaire = null;
      render();
    };
    return;
  }

  const refs = Array.isArray(q.reference_images) ? q.reference_images : [];
  const rows = QUIZ_QUESTIONS.map(question => {
    if (question.type === 'refs') {
      const body = refs.length
        ? `<div class="quiz-review-refs">${refs.map(id => {
            const r = quizReference(id);
            return r
              ? `<span class="quiz-review-ref"><i style="--ref-1:${r.tone[0]};--ref-2:${r.tone[1]}"></i>${esc(qtr(r.name, QUIZ_LANG_DEFAULT))}</span>`
              // Referência que saiu do catálogo continua legível pelo id —
              // o dado é do banco, não do arquivo que desenha a grade.
              : `<span class="quiz-review-ref">${esc(id)}</span>`;
          }).join('')}</div>`
        : `<div class="quiz-review-a is-empty">—</div>`;
      return `
        <div class="quiz-review-item o-card">
          <div class="quiz-review-q">${esc(qtr(question.title, QUIZ_LANG_DEFAULT))}</div>
          ${body}
        </div>`;
    }
    const val = q[question.field];
    return `
      <div class="quiz-review-item o-card">
        <div class="quiz-review-q">${esc(qtr(question.title, QUIZ_LANG_DEFAULT))}</div>
        <div class="quiz-review-a${val ? '' : ' is-empty'}">${esc(val ? quizAnswerLabel(question, val, QUIZ_LANG_DEFAULT) : '—')}</div>
      </div>`;
  }).join('');

  app.innerHTML = `
    ${back}

    </div>
    <div class="quiz-review-list">${rows}</div>`;

  document.getElementById('backToClientFromQuiz').onclick = () => {
    state.viewQuestionnaire = null;
    render();
  };
}

// ── ESTOQUE ──────────────────────────────────────────────────
// Ocupou o lugar da aba Equipe: com uma profissional só, "Profissionais" era
// uma tela de uma linha, e o que falta no balcão é decisão de todo dia.

const UNIDADES = ['un', 'ml', 'g', 'cx'];

// ── Parâmetros do painel de estoque ──────────────────────────
// Quanto olhar pra trás pra estimar quanto sai por dia.
const CONSUMO_JANELA_DIAS = 60;
// Abaixo disso a média é ruído, não tendência: a tela prefere dizer "ainda sem
// histórico" a mostrar uma previsão inventada.
const CONSUMO_MIN_SAIDAS = 2;
const CONSUMO_MIN_DIAS = 7;
// Uma sugestão de compra cobre este tanto de dias acima do mínimo.
const SUGESTAO_COBERTURA_DIAS = 30;
// Acima do mínimo mas ainda perto dele → "baixo estoque".
const ESTOQUE_BAIXO_FATOR = 1.5;
// A partir daqui a validade vira aviso na tela.
const VALIDADE_ALERTA_DIAS = 30;
// Quantas movimentações ficam à vista antes do "ver mais". Mesmo número e
// mesmo padrão do histórico de visitas no perfil da cliente.
const MOV_PREVIEW_COUNT = 3;

// Quantidade sem casas decimais à toa: 3 em vez de 3.00, mas 2.5 continua 2,5.
function fmtQtd(n) {
  const v = Number(n);
  return (Number.isInteger(v) ? v : v.toFixed(2).replace(/0$/, '')).toString().replace('.', ',');
}

// Nome de produto é texto digitado pela Juliane e agora aparece em muito mais
// lugares (cartão, sugestão, timeline, aria-label) — escapar aqui é mais barato
// que lembrar de escapar em cada um.
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function precisaRepor(p) {
  return Number(p.quantity) <= Number(p.min_quantity);
}

// Quatro degraus, do pior pro melhor. Sem estoque vem antes do "no mínimo"
// porque zero é a única situação em que o atendimento simplesmente para.
function stockStatus(p) {
  const q = Number(p.quantity), m = Number(p.min_quantity);
  if (q <= 0) return 'sem';
  if (q <= m) return 'critico';
  if (m > 0 && q <= m * ESTOQUE_BAIXO_FATOR) return 'baixo';
  return 'ok';
}
const STOCK_STATUS_LABEL = {
  ok: 'Em estoque', baixo: 'Baixo estoque', critico: 'Reposição urgente', sem: 'Sem estoque',
};
const STOCK_STATUS_ORDEM = { sem: 0, critico: 1, baixo: 2, ok: 3 };

// Ícone por categoria. As categorias são texto livre no banco, então o mapa
// cobre as que existem hoje e qualquer nova cai no ícone genérico — categoria
// nova nunca quebra a tela.
const STOCK_CATEGORY_ICONS = {
  'coloração': 'drop', 'coloracao': 'drop',
  'descoloração': 'flask', 'descoloracao': 'flask',
  'tratamento': 'sparkle', 'tratamentos': 'sparkle',
  'finalização': 'spray', 'finalizacao': 'spray', 'finalizadores': 'spray',
  'oxidantes': 'flask',
  'descartáveis': 'glove', 'descartaveis': 'glove',
  'equipamentos': 'scissors',
};
function iconeDaCategoria(cat) {
  return ICONS[STOCK_CATEGORY_ICONS[String(cat || '').trim().toLowerCase()] || 'box'];
}

async function loadProducts() {
  const { data, error } = await sb.from('products').select('*').eq('active', true).order('name');
  if (error) { console.error(error); return; }
  state.products = data;
}

// Histórico de movimentação. É daqui que saem consumo médio, previsão de
// duração e sugestão de compra — sem essa leitura, esses números seriam chute.
async function loadMovements() {
  const { data, error } = await sb.from('product_movements')
    .select('*').order('created_at', { ascending: false }).limit(400);
  if (error) { console.error(error); return; }
  state.movements = data || [];
}

// Toda mudança de quantidade passa por aqui. Grava o saldo resultante junto:
// o histórico precisa dizer em quanto ficou naquele momento, e recalcular isso
// depois seria impossível se um produto for editado à mão.
async function registrarMovimento(produto, kind, quantidade, saldo, note) {
  const linha = {
    product_id: produto.id, kind, quantity: Math.abs(Number(quantidade)),
    resulting_quantity: saldo, actor: state.userLabel || null, note: note || null,
  };
  const { data, error } = await sb.from('product_movements').insert(linha).select();
  if (error) { console.error(error); return false; }
  // O demo devolve um registro simbólico, então a linha que entra no state é
  // montada aqui e não copiada da resposta — assim a timeline funciona nos dois.
  state.movements.unshift({
    ...linha,
    id: (data && data[0] && data[0].id) || ('tmp-' + Date.now()),
    created_at: (data && data[0] && data[0].created_at) || new Date().toISOString(),
  });
  return true;
}

// ── Consumo, previsão e sugestão ─────────────────────────────
function movimentosDoProduto(id) {
  return state.movements.filter(m => m.product_id === id);
}

// Quanto sai por dia. Só 'saida' conta: entrada é compra e ajuste é correção de
// contagem — nenhum dos dois é consumo, e somá-los inflaria a previsão.
function consumoDiario(p) {
  const limite = Date.now() - CONSUMO_JANELA_DIAS * 86400000;
  const saidas = movimentosDoProduto(p.id)
    .filter(m => m.kind === 'saida' && new Date(m.created_at).getTime() >= limite);
  if (saidas.length < CONSUMO_MIN_SAIDAS) return null;
  const total = saidas.reduce((s, m) => s + Number(m.quantity), 0);
  if (total <= 0) return null;
  const maisAntigo = Math.min(...saidas.map(m => new Date(m.created_at).getTime()));
  // Piso de dias: duas saídas na mesma tarde não podem virar "consome isso tudo
  // por dia" e prever que o estoque acaba amanhã.
  const dias = Math.max(CONSUMO_MIN_DIAS, (Date.now() - maisAntigo) / 86400000);
  return total / dias;
}

function diasRestantes(p) {
  const taxa = consumoDiario(p);
  if (!taxa) return null;
  return Math.floor(Number(p.quantity) / taxa);
}

// Repor até cobrir SUGESTAO_COBERTURA_DIAS acima do mínimo. Unidade contável
// arredonda pra cima; ml/g arredondam pra dezena, que é como se compra.
function sugestaoCompra(p) {
  const taxa = consumoDiario(p);
  if (!taxa) return null;
  const falta = Number(p.min_quantity) + taxa * SUGESTAO_COBERTURA_DIAS - Number(p.quantity);
  if (falta <= 0) return null;
  return (p.unit === 'un' || p.unit === 'cx') ? Math.ceil(falta) : Math.ceil(falta / 10) * 10;
}

// Meio-dia, não meia-noite: com 'T00:00:00' a data vira meia-noite no fuso do
// aparelho e um celular a oeste de Dublin lê o dia anterior. Mesma armadilha
// que salonTimeToInstant() cobre no agendamento.
function validadeInfo(p) {
  if (!p.expires_at) return null;
  const dias = Math.ceil((new Date(p.expires_at + 'T12:00:00').getTime() - Date.now()) / 86400000);
  if (dias < 0) return { dias, vencido: true, label: 'Produto vencido' };
  if (dias > VALIDADE_ALERTA_DIAS) return { dias, vencido: false, label: null };
  return { dias, vencido: false, label: dias === 0 ? 'Vence hoje' : `Vence em ${dias} dia${dias === 1 ? '' : 's'}` };
}

function valorDoEstoque() {
  return state.products.reduce((s, p) => s + (p.cost != null ? Number(p.cost) * Number(p.quantity) : 0), 0);
}

// "Atualizado" é o instante real mais recente entre edição de produto e
// movimentação — não a hora de abrir a tela.
function estoqueAtualizadoEm() {
  const ts = state.products.map(p => p.updated_at)
    .concat(state.movements.map(m => m.created_at))
    .filter(Boolean).map(t => new Date(t).getTime()).filter(t => !isNaN(t));
  return ts.length ? new Date(Math.max(...ts)) : null;
}

// ── Busca, filtros e ordenação ───────────────────────────────
const STOCK_SORTS = [
  { key: 'atencao', label: 'Prioridade (padrão)' },
  { key: 'nome', label: 'Nome (A–Z)' },
  { key: 'quantidade', label: 'Menor quantidade' },
  { key: 'valor', label: 'Maior valor em estoque' },
  { key: 'validade', label: 'Validade mais próxima' },
];

// Os chips de status são fixos; os de categoria nascem do que existe no banco.
// Chip de categoria vazia seria um filtro que nunca acha nada.
function stockFilters() {
  const chips = [
    { key: 'todos', label: 'Todos', icon: 'box' },
    { key: 'critico', label: 'Reposição', icon: 'warning' },
    { key: 'baixo', label: 'Baixo estoque', icon: 'bars' },
  ];
  if (state.products.some(p => p.favorite)) chips.push({ key: 'favoritos', label: 'Favoritos', icon: 'starFilled' });
  if (state.products.some(p => validadeInfo(p))) chips.push({ key: 'vencendo', label: 'Validade', icon: 'clock' });
  const cats = [...new Set(state.products.map(p => (p.category || '').trim()).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, 'pt-BR'));
  cats.forEach(c => chips.push({ key: 'cat:' + c, label: c, icon: STOCK_CATEGORY_ICONS[c.toLowerCase()] || 'box' }));
  return chips;
}

function filteredSortedProducts() {
  const termo = (state.stockSearch || '').trim().toLowerCase();
  let rows = state.products.map(p => ({ p, status: stockStatus(p) }));

  if (termo) {
    rows = rows.filter(({ p }) =>
      `${p.name || ''} ${p.brand || ''} ${p.category || ''} ${p.code || ''} ${p.supplier || ''}`
        .toLowerCase().includes(termo));
  }

  const f = state.stockFilter || 'todos';
  if (f === 'critico') rows = rows.filter(r => r.status === 'critico' || r.status === 'sem');
  else if (f === 'baixo') rows = rows.filter(r => r.status === 'baixo');
  else if (f === 'favoritos') rows = rows.filter(r => r.p.favorite);
  else if (f === 'vencendo') rows = rows.filter(r => { const v = validadeInfo(r.p); return v && v.label; });
  else if (f.startsWith('cat:')) rows = rows.filter(r => (r.p.category || '').trim() === f.slice(4));

  const porNome = (a, b) => (a.p.name || '').localeCompare(b.p.name || '', 'pt-BR');
  const ordem = state.stockSort || 'atencao';
  rows.sort((a, b) => {
    if (ordem === 'nome') return porNome(a, b);
    if (ordem === 'quantidade') return Number(a.p.quantity) - Number(b.p.quantity) || porNome(a, b);
    if (ordem === 'valor') {
      const val = r => (r.p.cost != null ? Number(r.p.cost) * Number(r.p.quantity) : 0);
      return val(b) - val(a) || porNome(a, b);
    }
    if (ordem === 'validade') {
      // Sem validade cadastrada vai pro fim: não é urgência, é ausência de dado.
      const d = r => (r.p.expires_at ? new Date(r.p.expires_at + 'T12:00:00').getTime() : Infinity);
      return d(a) - d(b) || porNome(a, b);
    }
    return STOCK_STATUS_ORDEM[a.status] - STOCK_STATUS_ORDEM[b.status] || porNome(a, b);
  });
  return rows;
}

// ── A tela ───────────────────────────────────────────────────
function renderStock() {
  const total = state.products.length;
  const contagem = { ok: 0, baixo: 0, critico: 0, sem: 0 };
  state.products.forEach(p => { contagem[stockStatus(p)]++; });
  const emEstoque = contagem.ok + contagem.baixo;
  const urgentes = contagem.critico + contagem.sem;

  document.getElementById('greeting').textContent = 'Estoque';
  document.getElementById('greetingSub').textContent =
    total ? `${total} produto${total === 1 ? '' : 's'} cadastrado${total === 1 ? '' : 's'}` : 'Nenhum produto ainda';

  const atualizado = estoqueAtualizadoEm();
  const resumo = [
    { key: 'todos', st: 'ok', val: total, lbl: 'Produtos' },
    { key: 'todos', st: 'ok', val: emEstoque, lbl: 'Em estoque' },
    { key: 'baixo', st: 'baixo', val: contagem.baixo, lbl: 'Baixo estoque' },
    { key: 'critico', st: 'critico', val: urgentes, lbl: 'Reposição urgente' },
  ];

  app.innerHTML = `
    <h2 style="margin-top:8px;">Resumo do estoque</h2>
    <div class="stock-summary stk-enter" style="animation-delay:0ms;">
      ${resumo.map((r, i) => `
        <button type="button" class="stk-sum-card st-${r.st} ${state.stockFilter === r.key && i > 1 ? 'active' : ''}" data-sum="${r.key}">
          <span class="ssc-dot"></span>
          <span>
            <span class="ssc-val">${r.val}</span>
            <span class="ssc-lbl">${r.lbl}</span>
          </span>
        </button>
      `).join('')}
    </div>

    <div class="stock-value-card stk-enter" style="animation-delay:40ms;">
      <span class="svc-icon">${ICONS.money}</span>
      <span class="svc-body">
        <span class="svc-val">€${valorDoEstoque().toFixed(0)}</span>
        <span class="svc-lbl">Valor total do estoque</span>
      </span>
      ${atualizado ? `
        <span class="svc-upd">
          Atualizado ${daysAgoLabel(atualizado.toISOString())}
          <strong>${fmtTime(atualizado)}</strong>
        </span>` : ''}
    </div>

    <div class="o-search-filter-bar stk-enter" style="animation-delay:100ms;">
      <label class="o-search-field" id="stockSearchField">
        <span class="o-search-field-icon" aria-hidden="true">${ICONS.search}</span>
        <input type="search" id="stockSearchInput" placeholder="Buscar produto, marca ou categoria…"
               autocomplete="off" aria-label="Buscar produto" value="${esc(state.stockSearch || '')}">
        <button class="o-search-clear" id="stockSearchClear" type="button" aria-label="Limpar busca">${ICONS.close}</button>
      </label>
      <button class="o-icon-btn o-icon-btn-solid o-icon-btn-squircle" id="stockSortBtn" aria-label="Filtrar e ordenar">${ICONS.sliders}</button>
    </div>

    <div class="o-chip-group-scroll stk-enter" id="stockFilterChips" style="animation-delay:160ms;" role="group" aria-label="Filtrar produtos">
      ${stockFilters().map(f => `
        <button class="o-chip" aria-pressed="${state.stockFilter === f.key}" data-filter="${esc(f.key)}">
          <span aria-hidden="true">${ICONS[f.icon] || ICONS.box}</span><span>${esc(f.label)}</span>
        </button>
      `).join('')}
    </div>

    <div id="stockListWrap" class="stk-enter" style="animation-delay:220ms;"></div>
    <div id="stockInsightsWrap"></div>
  `;

  renderStockList();
  renderStockInsights();
  bindStockToolbar();
}

// Só a lista — chamada a cada tecla digitada na busca e a cada troca de chip.
// Não pode passar por render(): o <input> seria recriado e perderia o foco.
function renderStockList() {
  const wrap = document.getElementById('stockListWrap');
  if (!wrap) return;

  if (!state.products.length) {
    wrap.innerHTML = emptyStateHtml({
      icon: ICONS.box,
      glow: true,
      title: 'Seu estoque está começando.',
      caption: 'Cadastre o que você usa no dia a dia e acompanhe o consumo sem esforço.',
      cta: '<button class="btn btn-primary" id="emptyStockCta">Cadastrar produto</button>',
    });
    document.getElementById('emptyStockCta').onclick = () => openProductModal();
    return;
  }
  const rows = filteredSortedProducts();
  if (!rows.length) {
    const buscandoProduto = !!(state.stockSearch || '').trim();
    wrap.innerHTML = buscandoProduto
      ? emptyStateHtml({
          icon: ICONS.search,
          title: 'Não encontramos esse produto no seu estoque.',
          caption: 'Ele pode estar guardado em outra categoria.',
          cta: '<button type="button" class="see-more-btn" id="emptyStockClearSearch">Limpar busca</button>',
        })
      : '<div class="empty">Nenhum produto neste filtro.</div>';
    if (buscandoProduto) document.getElementById('emptyStockClearSearch').onclick = clearStockSearch;
    return;
  }

  // Os rótulos de grupo só fazem sentido na ordenação por prioridade — em
  // "Nome (A–Z)" a lista não está agrupada e o título mentiria.
  const agrupar = (state.stockSort || 'atencao') === 'atencao';
  let html = agrupar ? '' : `<div class="stock-count-label">${rows.length} ${rows.length === 1 ? 'produto' : 'produtos'}</div>`;
  const grupos = [
    { st: 'critico', chaves: ['sem', 'critico'], label: 'Precisam de atenção' },
    { st: 'baixo', chaves: ['baixo'], label: 'Estoque baixo' },
    { st: 'ok', chaves: ['ok'], label: 'Em dia' },
  ];

  if (agrupar) {
    grupos.forEach(g => {
      const doGrupo = rows.filter(r => g.chaves.includes(r.status));
      if (!doGrupo.length) return;
      html += `<div class="stock-group-label st-${g.st}"><span class="sgl-dot"></span>${g.label} · ${doGrupo.length}</div>`;
      html += doGrupo.map(productCardHtml).join('');
    });
  } else {
    html += rows.map(productCardHtml).join('');
  }

  wrap.innerHTML = html;
  bindStockCards(wrap);
}

function productCardHtml({ p, status }) {
  const val = validadeInfo(p);
  const dias = diasRestantes(p);
  const notas = [];
  if (val && val.label) {
    notas.push(`<span class="pd-note ${val.vencido ? 'is-alert' : 'is-soft'}">${ICONS.clock}${esc(val.label)}</span>`);
  }
  if (dias != null) {
    notas.push(`<span class="pd-note ${dias <= 7 ? 'is-alert' : ''}">${ICONS.trendUp}≈ ${dias} ${dias === 1 ? 'dia' : 'dias'} de estoque</span>`);
  }
  const identidade = [p.brand, p.category].filter(Boolean).map(esc).join(' · ') || 'Sem marca';
  const codigo = p.code ? ` · <span class="pd-code">${esc(p.code)}</span>` : '';

  return `
    <div class="product-card st-${status} is-${status}" data-card="${p.id}">
      <div class="pd-top">
        <button type="button" class="pd-open" data-edit="${p.id}" aria-label="Abrir ${esc(p.name)}">
          <span class="pd-thumb">${p.image_url
            ? `<img src="${esc(p.image_url)}" alt="">`
            : iconeDaCategoria(p.category)}</span>
          <span class="pd-head">
            <span class="pd-name">${esc(p.name)}</span>
            <span class="pd-sub">${identidade}${codigo}</span>
          </span>
        </button>
        <button type="button" class="pd-fav ${p.favorite ? 'is-on' : ''}" data-fav="${p.id}"
                aria-label="${p.favorite ? 'Tirar' : 'Marcar'} ${esc(p.name)} dos favoritos"
                aria-pressed="${p.favorite ? 'true' : 'false'}">${p.favorite ? ICONS.starFilled : ICONS.star}</button>

function bindStockCards(wrap) {
  wrap.querySelectorAll('[data-edit]').forEach(el => { el.onclick = () => openProductModal(el.dataset.edit); });

// ── Sugestões, movimentações e estatísticas ──────────────────
function renderStockInsights() {
  const wrap = document.getElementById('stockInsightsWrap');
  if (!wrap || !state.products.length) return;
  wrap.innerHTML = statsHtml() + suggestionsHtml() + movementsHtml();
  wrap.querySelectorAll('[data-edit]').forEach(el => { el.onclick = () => openProductModal(el.dataset.edit); });
  const verMais = document.getElementById('stockMovToggle');
  if (verMais) verMais.onclick = () => {
    state.stockMovExpanded = !state.stockMovExpanded;
    renderStockInsights();
    // Ao recolher, o botão "ver menos" some junto com a lista e a tela salta
    // pro fim do documento — sem isso o dedo fica apontando pro nada. Volta
    // pro título da seção.
    if (!state.stockMovExpanded) {
      const titulo = document.getElementById('stockMovTitle');
      if (titulo) titulo.scrollIntoView({ block: 'start', behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
    }
  };
}

function suggestionsHtml() {
  const criticos = state.products
    .filter(p => ['critico', 'sem', 'baixo'].includes(stockStatus(p)))
    .map(p => ({ p, dias: diasRestantes(p), comprar: sugestaoCompra(p) }))
    .filter(s => s.comprar != null)
    .sort((a, b) => (a.dias == null ? Infinity : a.dias) - (b.dias == null ? Infinity : b.dias))
    .slice(0, 3);

  const vencendo = state.products.map(p => ({ p, v: validadeInfo(p) })).filter(x => x.v && x.v.label).slice(0, 2);

  if (!criticos.length && !vencendo.length) {
    // Sem histórico não existe sugestão possível. Dizer isso é melhor que
    // esconder a seção — a Juliane fica sabendo que o número vai aparecer.
    const semHistorico = state.products.some(p => precisaRepor(p)) && !state.movements.length;
    if (!semHistorico) return '';
    return `
      <div class="stock-section">
        <div class="stock-section-title"><span class="sst-icon">${ICONS.bulb}</span>Sugestões</div>
        <div class="stock-empty-note">
          <span class="sen-icon">${ICONS.history}</span>
          <span>Ainda sem histórico de consumo. Conforme você registrar entradas e saídas, a previsão de duração e a quantidade sugerida de compra aparecem aqui.</span>
        </div>
      </div>`;
  }

  const cards = [
    ...criticos.map(({ p, dias, comprar }) => {
      const st = stockStatus(p);
      return `
        <button type="button" class="suggestion-card st-${st}" data-edit="${p.id}" style="width:100%;text-align:left;font-family:inherit;color:inherit;cursor:pointer;">
          <span class="sc-icon">${ICONS.warning}</span>
          <span class="sc-body">
            <span class="sc-name">${esc(p.name)}</span>
            <span class="sc-text">${dias != null
              ? `Pelo consumo médio, restam cerca de <strong>${dias} ${dias === 1 ? 'dia' : 'dias'}</strong>. `
              : ''}Sugestão: comprar <strong>${fmtQtd(comprar)} ${esc(p.unit)}</strong>.</span>
          </span>
        </button>`;
    }),
    ...vencendo.map(({ p, v }) => `
      <button type="button" class="suggestion-card ${v.vencido ? 'st-critico' : 'st-baixo'}" data-edit="${p.id}" style="width:100%;text-align:left;font-family:inherit;color:inherit;cursor:pointer;">
        <span class="sc-icon">${ICONS.clock}</span>
        <span class="sc-body">
          <span class="sc-name">${esc(p.name)}</span>
          <span class="sc-text">${v.vencido
            ? 'Produto <strong>vencido</strong> — vale conferir antes de usar.'
            : `<strong>${esc(v.label)}</strong>. Priorize o uso deste antes de abrir outro.`}</span>
        </span>
      </button>`),
  ];

  return `
    <div class="stock-section">
      <div class="stock-section-title"><span class="sst-icon">${ICONS.bulb}</span>Sugestões</div>
      ${cards.join('')}
    </div>`;
}

const MOV_META = {
  entrada: { st: 'ok', icon: 'arrowIn', sinal: '+', label: 'Entrada' },
  saida: { st: 'critico', icon: 'arrowOut', sinal: '−', label: 'Saída' },
  ajuste: { st: 'baixo', icon: 'sliders', sinal: '', label: 'Ajuste' },
};
const DIAS_SEMANA = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];

function rotuloDoDia(d) {
  const dias = Math.floor((new Date().setHours(0, 0, 0, 0) - new Date(d).setHours(0, 0, 0, 0)) / 86400000);
  if (dias <= 0) return 'Hoje';
  if (dias === 1) return 'Ontem';
  if (dias < 7) return DIAS_SEMANA[new Date(d).getDay()];
  const { day, mon } = fmtDateShort(new Date(d).toISOString());
  return `${day} ${mon}`;
}

function movementsHtml() {
  if (!state.movements.length) {
    return `
      <div class="stock-section">
        <div class="stock-section-title"><span class="sst-icon">${ICONS.history}</span>Movimentações recentes</div>
        <div class="stock-empty-note">
          <span class="sen-icon">${ICONS.history}</span>
          <span>Nenhuma movimentação registrada ainda. Cada − e + no contador, e cada entrada ou saída pelo botão +, entra nesta lista.</span>
        </div>
      </div>`;
  }

  const escondidas = Math.max(0, state.movements.length - MOV_PREVIEW_COUNT);
  const recentes = state.stockMovExpanded ? state.movements : state.movements.slice(0, MOV_PREVIEW_COUNT);
  let ultimoDia = null;
  const itens = recentes.map(m => {
    const p = state.products.find(x => x.id === m.product_id);
    const meta = MOV_META[m.kind] || MOV_META.ajuste;
    const dia = rotuloDoDia(m.created_at);
    const cabecalho = dia !== ultimoDia ? `<div class="mv-day-label">${dia}</div>` : '';
    ultimoDia = dia;
    const quem = [meta.label, m.actor].filter(Boolean).join(' · ');
    return `
      ${cabecalho}
      <div class="mv-item st-${meta.st}">
        <div class="mv-rail"><span class="mv-icon">${ICONS[meta.icon]}</span><span class="mv-line"></span></div>
        <div class="mv-body">
          <div class="mv-top">
            <span class="mv-qty">${meta.sinal}${fmtQtd(m.quantity)}</span>
            <span class="mv-name">${esc(p ? p.name : 'Produto removido')}</span>
          </div>
          <div class="mv-sub">${esc(quem)} · ${fmtTime(new Date(m.created_at))}${
            m.resulting_quantity != null ? ` · ficou em ${fmtQtd(m.resulting_quantity)}${p ? ' ' + esc(p.unit) : ''}` : ''}</div>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="stock-section">
      <div class="stock-section-title" id="stockMovTitle">
        <span class="sst-icon">${ICONS.history}</span>Movimentações recentes
        <span class="sst-count">${state.movements.length} no total</span>
      </div>
      ${itens}
      ${escondidas ? `<button class="see-more-btn ${state.stockMovExpanded ? 'is-less' : ''}" id="stockMovToggle">${
        state.stockMovExpanded ? 'Ver menos' : `Ver mais (${escondidas})`} ${ICONS.chevron}</button>` : ''}
    </div>`;
}

function statsHtml() {
  const saidas = state.movements.filter(m => m.kind === 'saida');
  const reposicao = state.products
    .filter(p => ['critico', 'sem', 'baixo'].includes(stockStatus(p)))
    .reduce((s, p) => {
      const q = sugestaoCompra(p) ?? Math.max(0, Number(p.min_quantity) * ESTOQUE_BAIXO_FATOR - Number(p.quantity));
      return s + (p.cost != null ? q * Number(p.cost) : 0);
    }, 0);

  // Sem saída registrada não há "mais usado" nem "categoria que mais consome" —
  // a seção mostra só o que dá pra afirmar (valor e gasto estimado).
  let usoHtml = '';
  if (saidas.length) {
    const porProduto = {}, porCategoria = {};
    saidas.forEach(m => {
      const p = state.products.find(x => x.id === m.product_id);
      if (!p) return;
      porProduto[p.name] = (porProduto[p.name] || 0) + Number(m.quantity);
      const cat = (p.category || 'Sem categoria').trim();
      porCategoria[cat] = (porCategoria[cat] || 0) + Number(m.quantity);
    });
    const topProduto = Object.entries(porProduto).sort((a, b) => b[1] - a[1])[0];
    const topCategoria = Object.entries(porCategoria).sort((a, b) => b[1] - a[1])[0];
    if (topProduto) {
      usoHtml = `
        <div class="stock-stats">
          <div class="ss-head">No consumo dos últimos ${CONSUMO_JANELA_DIAS} dias</div>
          <div class="ss-pair">
            <div class="ss-cell">
              <div class="ss-val" style="font-size:15px;">${esc(topProduto[0])}</div>
              <div class="ss-lbl">Produto mais usado</div>
            </div>
            <div class="ss-cell">
              <div class="ss-val" style="font-size:15px;">${esc(topCategoria ? topCategoria[0] : '—')}</div>
              <div class="ss-lbl">Categoria com maior consumo</div>
            </div>
          </div>
        </div>`;
    }
  }

  return `
    <div class="stock-section">
      <div class="stock-section-title"><span class="sst-icon">${ICONS.bars}</span>Estatísticas</div>
      <div class="stock-stats">
        <div class="ss-pair">
          <div class="ss-cell">
            <div class="ss-val">€${valorDoEstoque().toFixed(0)}</div>
            <div class="ss-lbl">Valor total parado em estoque</div>
          </div>
          <div class="ss-cell">
            <div class="ss-val">€${reposicao.toFixed(0)}</div>
            <div class="ss-lbl">Gasto estimado pra repor o que falta</div>
          </div>
        </div>
      </div>
      ${usoHtml}
    </div>`;
}

// ── Toolbar (busca, chips, ordenação) ────────────────────────
function bindStockToolbar() {
  const field = document.getElementById('stockSearchField');
  const input = document.getElementById('stockSearchInput');
  const clear = document.getElementById('stockSearchClear');

  // O anel de foco e o placeholder que some usam :focus-within do próprio
  // .o-search-field — não precisam mais de classe amarrada em onfocus/onblur
  // (docs/04 §SearchField). .has-text continua em JS porque CSS não sabe "o
  // campo tem texto" sem :has(), que não é usado em mais nenhum lugar do projeto.
  if (input) {
    field.classList.toggle('has-text', !!input.value);
    input.oninput = () => {
      state.stockSearch = input.value;
      field.classList.toggle('has-text', !!input.value);
      renderStockList();
    };
  }
  if (clear) {
    // mousedown, não click: o blur do input dispararia antes e o botão já teria
    // sumido junto com a classe .has-text.
    clear.onmousedown = (e) => {
      e.preventDefault();
      clearStockSearch();
    };
  }

  document.querySelectorAll('#stockFilterChips .o-chip').forEach(chip => {
    chip.onclick = () => { aplicarFiltroEstoque(chip.dataset.filter); };
  });
  document.querySelectorAll('[data-sum]').forEach(btn => {
    btn.onclick = () => aplicarFiltroEstoque(btn.dataset.sum);
  });
  const sortBtn = document.getElementById('stockSortBtn');
  if (sortBtn) sortBtn.onclick = openStockSortSheet;
}

// Troca de filtro sem passar por render(): só aria-pressed/.active mudam e a
// lista é redesenhada. Se o render cheio rodasse, a animação de entrada
// tocaria de novo a cada chip — e a busca perderia o foco.
function aplicarFiltroEstoque(key) {
  state.stockFilter = key;
  document.querySelectorAll('#stockFilterChips .o-chip')
    .forEach(c => c.setAttribute('aria-pressed', String(c.dataset.filter === key)));
  document.querySelectorAll('[data-sum]')
    .forEach((c, i) => c.classList.toggle('active', i > 1 && c.dataset.sum === key));
  renderStockList();
}

function openStockSortSheet() {
