     apesar do nome, quem a usa hoje são #ncError, #prodError e
     #wizNcError; o Login tem a sua (.login-form-error). */
  .login-error { font-size: 13px; color: var(--color-accent-700); margin-top: 10px; }
  .logout-link {
    font-size: 12px; color: var(--color-neutral-600); cursor: pointer; text-decoration: underline;
  }

  .fab {
    position: fixed; bottom: 100px; right: 20px; width: 54px; height: 54px; border-radius: 50%;
    background: var(--color-accent); color: var(--color-bg); border: none; cursor: pointer;
    font-size: 26px; box-shadow: var(--shadow-md, 0 3px 10px rgba(0,0,0,0.18));
    display: flex; align-items: center; justify-content: center; z-index: 50; line-height: 1;
    /* Curva "com molinha": o retorno ao soltar tem uma leve sobreposta
       elástica, não só volta linear — pequena, "nada exagerado". */
    transition: transform .18s cubic-bezier(.34,1.56,.64,1); -webkit-tap-highlight-color: transparent;
  }
  .fab:active { transform: scale(0.93); }
  @media (prefers-reduced-motion: reduce) {
    .week-day, .timeline-appt, .fab, .agenda-today-btn, .agenda-add-btn { transition: none; }
    .week-day:active, .timeline-appt:active, .fab:active, .agenda-today-btn:active, .agenda-add-btn:active { transform: none; }
    .week-day:active, .timeline-appt:active { opacity: 1; }
    .modal-overlay, .modal-sheet { animation: none; }
    .current-time-line { animation: none; transition: none; }
    .current-time-line.is-highlighted .current-time-badge,
    .current-time-line.is-highlighted .current-time-dot { animation: none; }
    .current-time-dot { animation: none; }
    .timeline-appt.is-entering, .timeline-appt.is-leaving { animation: none; }
    .timeline-appt.is-lifting { transform: none; box-shadow: none; }
    .diag-card-body-wrap, .diag-card-head .dc-chevron { transition: none; }
  }
  .modal-overlay {
    position: fixed; inset: 0; background: color-mix(in srgb, #201e1d 45%, transparent);
    display: flex; align-items: flex-end; justify-content: center; z-index: 200;
    animation: modalOverlayIn .2s ease;
  }
  @keyframes modalOverlayIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-sheet {
    background: var(--color-bg); border-radius: 24px 24px 0 0; width: 100%; max-width: 480px;
    max-height: 88vh; overflow-y: auto; padding: 20px 20px 28px;
    /* Mesmo espírito do pop-up de ajuda dos indicadores (Insights) — fade +
       scale com a mesma curva "com molinha" — só que subindo de baixo, porque
       aqui é uma folha inteira de formulário, não um balão curto centralizado. */
    animation: modalSheetIn .3s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes modalSheetIn {
    from { opacity: 0; transform: translateY(28px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal-sheet h2 { margin-top: 0; }
  /* ── Agrupamento no padrão de cartão (modelo: Início/Insights), usado no
     modal de novo agendamento ── */
  .modal-section {
    background: var(--color-surface); border: 1px solid var(--color-divider);
    border-radius: 16px; padding: 14px 14px 2px; margin-bottom: 14px;
  }
  .modal-field-label {
    display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--color-neutral-600); margin: 4px 0 6px;
  }
  .modal-close {
    background: none; border: none; font-size: 20px; color: var(--color-neutral-600);
    cursor: pointer; float: right; line-height: 1;
  }
  /* ── "Novo cliente" (aba Clientes) — redesign (06/08/2026), no padrão
     premium do wizard de agendamento. .modal-sheet continua o container
     (mesmo slide-up já usado em todo sheet do app), só o conteúdo interno
     passa a usar o vocabulário do Design System (.o-card/.o-field) em vez
     do antigo .modal-section solto. ── */
  .nc-sheet { padding-top: 10px; }
  .nc-handle {
    width: 36px; height: 4px; border-radius: var(--radius-full);
    background: var(--color-neutral-300); margin: 0 auto 14px;
  }
  .nc-head { display: flex; align-items: flex-start; gap: var(--space-2); margin-bottom: var(--space-4); }
  .nc-titles { flex: 1; min-width: 0; }
  .nc-title {
    font-family: var(--font-heading); font-size: var(--text-title-2-size);
    font-weight: var(--text-title-2-weight); color: var(--color-text); margin: 0;
  }
  .nc-subtitle { font-size: var(--text-caption-size); color: var(--color-neutral-600); margin-top: 3px; }
  .nc-section-label {
    font-size: 11px; letter-spacing: 0.08em; color: var(--color-neutral-600);
    font-weight: 700; text-transform: uppercase; margin: 0 0 var(--space-2);
  }
  /* 20px — dentro da faixa de 16-24px pedida, .nc-card precisa da classe no
     markup pro seletor bater (bug do PR anterior: a classe nunca foi
     aplicada, então o card e o título de "Anotações" ficavam colados). */
  .nc-card + .nc-section-label { margin-top: var(--space-5); }
  /* Ícone ao lado do rótulo só no campo Nome (pedido explícito do PR) —
     mesmo padrão de "icone+texto agrupado" de .pst-left/.ar-icon, não um
     componente novo de campo-com-ícone. */
  .nc-field-label-icon { display: flex; align-items: center; gap: var(--space-2); }
  .nc-field-label-icon svg { width: 15px; height: 15px; color: var(--color-neutral-600); flex-shrink: 0; }
  /* Telefone com +353 fixo: é o MESMO .o-input (borda, raio, fundo únicos),
     o prefixo é só texto fixo dentro da caixa, separado por um traço fino —
     não duas áreas visuais (correção 06/08/2026: a versão anterior dava um
     fundo/borda próprios ao prefixo, lendo como campo quadrado colado num
     campo redondo). */
  .nc-phone-field {
    display: flex; align-items: center; min-height: var(--touch-target-min);
    padding: 0 var(--space-3-5);
    border: var(--border-width) solid var(--color-divider); border-radius: var(--radius-sm);
    background: var(--color-surface);
    transition: border-color var(--motion-fast) var(--ease-standard), box-shadow var(--motion-fast) var(--ease-standard);
  }
  .nc-phone-field:focus-within { border-color: var(--color-accent-600); box-shadow: var(--focus-ring); }
  .nc-phone-prefix {
    font-size: var(--text-body-size); font-weight: var(--text-body-strong-weight);
    color: var(--color-neutral-700); flex-shrink: 0;
  }
  .nc-phone-divider {
    width: var(--border-width); align-self: stretch; margin: var(--space-2) var(--space-3);
    background: var(--color-divider); flex-shrink: 0;
  }
  /* Seletor de id (não .nc-phone-field input): input[type=tel] tem uma
     regra legada global (linha ~922 — pílula própria com fundo, borda,
     raio, margin-bottom, usada por telefone/data/e-mail soltos no resto
     do painel) com a MESMA especificidade de ".nc-phone-field input";
     quem vence é só quem vem depois no arquivo, e a global vem depois —
     por isso o input desenhava a segunda cápsula por cima mesmo com
     border:none/background:none aqui. Um id sempre vence sem precisar de
     !important nem tocar a regra global (que outras telas ainda usam). */
  #ncPhoneLocal {
    flex: 1; width: auto; min-width: 0; margin-bottom: 0;
    padding: var(--space-3) 0; border: none; border-radius: 0; background: none;
    font-family: var(--font-body); font-size: var(--text-body-size); color: var(--color-text);
  }
  #ncPhoneLocal:focus { outline: none; box-shadow: none; }
  .nc-notes-count { margin-top: var(--space-1); text-align: right; }
  .nc-protect-card {
    display: flex; align-items: flex-start; gap: var(--space-2-5);
    background: var(--color-accent-100); border-radius: var(--radius-md);
    padding: var(--space-3) var(--space-3-5); margin-top: var(--space-4);
  }
  .nc-protect-icon { color: var(--color-accent-700); flex-shrink: 0; margin-top: 2px; }
  .nc-protect-icon svg { width: 17px; height: 17px; }
  .nc-protect-title {
    font-size: var(--text-body-strong-size); font-weight: var(--text-body-strong-weight);
    color: var(--color-text); margin-bottom: 2px;
  }
  .nc-protect-text { font-size: var(--text-caption-size); color: var(--color-neutral-700); line-height: var(--leading-normal); }
  select {
    width: 100%; padding: 12px 14px; border-radius: 999px; border: 1px solid var(--color-divider);
    background: var(--color-neutral-100); font-family: var(--font-body); font-size: 14px;
    margin-bottom: 10px; color: var(--color-text); appearance: none;
  }
  select:disabled { opacity: 0.55; cursor: not-allowed; }
  textarea {
    width: 100%; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--color-divider);
    background: var(--color-neutral-100); font-family: var(--font-body); font-size: 14px;
    margin-bottom: 10px; color: var(--color-text); resize: vertical; min-height: 70px;
  }
  input[type=date], input[type=text], input[type=tel], input[type=email] {
    width: 100%; padding: 12px 14px; border-radius: 999px; border: 1px solid var(--color-divider);
    background: var(--color-neutral-100); font-family: var(--font-body); font-size: 14px;
    margin-bottom: 10px; color: var(--color-text);
  }
  .btn {
    width: 100%; padding: 14px; border-radius: 999px; border: none; cursor: pointer;
    font-family: var(--font-body); font-weight: 700; font-size: 15px; margin-top: 8px;
  }
  .btn-primary { background: var(--color-accent); color: var(--color-bg); }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--color-neutral-700); }

  /* ── QUESTIONÁRIO V2 (15/08/2026) ──────────────────────────────────────
     A tela mais antiga do painel foi reconstruída sobre a anatomia do
     FullScreenSheet (docs/04 §FullScreenSheet): head → corpo rolável →
     rodapé fixo. Não é o `.o-fullsheet` literal porque aquele é uma folha
     que sobe por cima de outra tela; aqui o questionário É a tela da aba.
     O que se repete é a anatomia, que é o que faz parecer o mesmo produto.

     Dois modos:
     - `.is-inline` — idioma e escolha da cliente. Quem opera é a Juliane,
       com o rodapé de navegação à vista: ainda não é quiosque.
     - padrão (fixed) — do primeiro passo do questionário em diante, com o
       tablet já na mão da cliente.

     `100dvh`, nunca `100vh`: no Safari do iPhone o `100vh` conta a barra de
     endereço que some ao rolar e o CTA do rodapé cairia atrás do chrome do
     navegador. Mesma regra do `.o-fullsheet`. */
  .quiz-screen {
    position: fixed; top: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: var(--canvas-max-width);
    height: 100vh; height: 100dvh;
    background: var(--color-bg); z-index: var(--z-sheet);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .quiz-screen.is-inline {
    position: static; transform: none; max-width: none;
    height: auto; min-height: 58vh; z-index: auto; background: none;
  }

  .quiz-head {
    flex-shrink: 0; display: flex; align-items: center; gap: var(--space-2);
    padding: calc(var(--space-3) + var(--safe-top)) var(--space-4) var(--space-3);
  }
  .quiz-screen.is-inline .quiz-head { padding: 0 0 var(--space-3); }
  .quiz-head-titles { flex: 1; min-width: 0; padding: 0 var(--space-1); }
  .quiz-head-title {
    font-family: var(--font-heading); font-size: var(--text-title-3-size);
    font-weight: var(--text-title-3-weight); color: var(--color-text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .quiz-head-sub { font-size: var(--text-caption-size); color: var(--color-neutral-600); margin-top: 1px; }
  .quiz-head-spacer { width: var(--touch-target-min); flex-shrink: 0; }
  .quiz-back svg { transform: rotate(180deg); }

  /* Progresso discreto: barra fina + contagem em texto. A barra sozinha não
     serve pra leitor de tela e o texto sozinho não dá noção de quanto falta
     num relance — os dois juntos custam uma linha. */
  .quiz-progress { flex-shrink: 0; padding: 0 var(--space-5) var(--space-3); }
  .quiz-progress-track {
    height: 3px; border-radius: var(--radius-full);
    background: var(--color-neutral-200); overflow: hidden;
  }
  .quiz-progress-fill {
    height: 100%; border-radius: var(--radius-full); background: var(--color-accent);
    transition: width var(--motion-standard) var(--ease-standard);
  }
  .quiz-progress-label {
    margin-top: var(--space-2); font-size: var(--text-caption-size);
    color: var(--color-neutral-600);
  }

  .quiz-body { flex: 1 1 auto; overflow-y: auto; padding: 0 var(--space-5) var(--space-4); }
  .quiz-screen.is-inline .quiz-body { overflow: visible; padding: 0; }
  .quiz-footer {
    flex-shrink: 0; display: flex; flex-direction: column; gap: var(--space-2);
    padding: var(--space-3) var(--space-5) calc(var(--space-4) + var(--safe-bottom));
  }
  .quiz-screen.is-inline .quiz-footer { padding: var(--space-4) 0 0; }

  /* Entrada de cada passo. Anima o conteúdo, nunca o shell — mesma razão
     documentada no `.o-fullsheet`: enquanto a animação vivia no container,
     todo re-render a reaplicava e cada toque parecia abrir uma tela nova. */
  .quiz-page { animation: quizPageIn var(--motion-standard) var(--ease-out); }
  @keyframes quizPageIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .quiz-question {
    font-family: var(--font-heading); font-size: var(--text-title-2-size);
    font-weight: var(--text-title-2-weight); line-height: var(--leading-tight);
    color: var(--color-text); margin: var(--space-2) 0 var(--space-2);
  }
  .quiz-question:focus { outline: none; }
  .quiz-question:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }
  .quiz-helper {
    font-size: var(--text-body-size); color: var(--color-neutral-600);
    line-height: var(--leading-relaxed); margin-bottom: var(--space-5);
  }

  /* Option card (docs/04 §Card + §Chip): 2 a 4 opções curtas viram alvos
     grandes, não um dropdown. É o mesmo movimento que o Diagnóstico do
     cabelo já fez ao trocar `<select>` por chips — aqui em cartão porque a
     tela é de uma pergunta só e há espaço vertical de sobra. */
  .quiz-options { display: flex; flex-direction: column; gap: var(--space-3); }
  .quiz-option {
    display: flex; align-items: center; gap: var(--space-3);
    width: 100%; min-height: 56px; text-align: left;
    padding: var(--space-4); cursor: pointer;
    font-family: var(--font-body); font-size: var(--text-body-size);
    color: var(--color-text);
  }
  .quiz-option-label { flex: 1; min-width: 0; }
  .quiz-option-mark {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: var(--radius-circle);
    border: var(--border-width-emphasis) solid var(--color-neutral-300);
    position: relative;
    transition: border-color var(--motion-fast) var(--ease-standard);
  }
  .quiz-option[aria-checked="true"] {
    border-color: var(--color-accent);
    background: var(--color-accent-100);
  }
  .quiz-option[aria-checked="true"] .quiz-option-mark { border-color: var(--color-accent); }
  .quiz-option[aria-checked="true"] .quiz-option-mark::after {
    content: ''; position: absolute; inset: 4px;
    border-radius: var(--radius-circle); background: var(--color-accent);
  }

  /* Galeria de referências. As imagens reais ainda vêm da Juliane: cada
     tile é um `placeholder` declarado, com o id do catálogo por baixo —
     trocar por foto é preencher `imageUrl` no catálogo, sem tocar aqui. */
  .quiz-refs { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3); }
  .quiz-ref {
    display: flex; flex-direction: column; gap: var(--space-2);
    padding: var(--space-2); cursor: pointer; text-align: left;
    font-family: var(--font-body);
  }
  .quiz-ref-swatch {
    position: relative; display: block; width: 100%; aspect-ratio: 3 / 4;
    border-radius: var(--radius-sm); overflow: hidden;
    background: linear-gradient(160deg, var(--ref-1) 0%, var(--ref-2) 100%);
  }
  .quiz-ref-swatch img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .quiz-ref-tag {
    position: absolute; left: var(--space-2); bottom: var(--space-2);
    padding: 2px var(--space-2); border-radius: var(--radius-full);
    background: rgba(247, 241, 232, 0.88); color: var(--color-neutral-700);
    font-size: var(--text-micro-size); font-weight: var(--text-micro-weight);
    letter-spacing: 0.04em;
  }
  .quiz-ref-name {
    font-size: var(--text-caption-size); color: var(--color-text);
    padding: 0 var(--space-1) var(--space-1);
  }
  .quiz-ref-check {
    position: absolute; top: var(--space-2); right: var(--space-2);
    width: 26px; height: 26px; border-radius: var(--radius-circle);
    background: var(--color-surface); border: var(--border-width-emphasis) solid var(--color-divider);
    display: flex; align-items: center; justify-content: center;
    color: var(--color-bg);
    transition: background var(--motion-fast) var(--ease-standard),
                border-color var(--motion-fast) var(--ease-standard);
  }
  .quiz-ref-check svg { width: 15px; height: 15px; opacity: 0; }
  .quiz-ref[aria-pressed="true"] { border-color: var(--color-accent); background: var(--color-accent-100); }
  .quiz-ref[aria-pressed="true"] .quiz-ref-check {
    background: var(--color-accent); border-color: var(--color-accent);
  }
  .quiz-ref[aria-pressed="true"] .quiz-ref-check svg { opacity: 1; }
  /* No limite de seleção o que sobra fica inerte em vez de recusar o toque
     em silêncio — o contador logo abaixo explica por quê. */
  .quiz-ref[aria-disabled="true"] { opacity: 0.45; cursor: default; }
  .quiz-ref-counter {
    margin-top: var(--space-4); font-size: var(--text-caption-size);
    color: var(--color-neutral-600); text-align: center;
  }

  /* ── Tela de idioma ────────────────────────────────────────────────────
     A palavra sobe, perde opacidade e a próxima entra por baixo. O tempo de
     permanência (QUIZ_WELCOME_DWELL_MS) é leitura, não transição — mesma
     natureza do SUCCESS_HOLD_MS de orenzi-ui.js, por isso fora da escala de
     docs/05 §3. O movimento em si usa --motion-route, o degrau mais lento
     que a escala tem. */
  .quiz-welcome { display: flex; flex-direction: column; justify-content: center; min-height: 46vh; }
  .quiz-welcome-word-wrap {
    height: 1.3em; overflow: hidden; text-align: center;
    font-family: var(--font-heading); font-size: var(--text-display-size);
    font-weight: var(--text-display-weight); color: var(--color-text);
  }
  .quiz-welcome-word { display: block; line-height: 1.3; }
  .quiz-welcome-word.is-out {
    animation: quizWordOut var(--motion-route) var(--ease-in) forwards;
  }
  .quiz-welcome-word.is-in {
    animation: quizWordIn var(--motion-route) var(--ease-out);
  }
  @keyframes quizWordOut {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(-0.5em); }
  }
  @keyframes quizWordIn {
    from { opacity: 0; transform: translateY(0.5em); }
    to { opacity: 1; transform: translateY(0); }
  }
  /* Sem movimento: as três saudações ficam à vista de uma vez. Nada pisca,
     nada faz loop, e a tela continua dizendo o que é (docs/05 §16). */
  .quiz-welcome-static { text-align: center; }
  .quiz-welcome-static span { display: block; line-height: 1.35; }
  .quiz-welcome-static span + span { color: var(--color-neutral-600); font-size: 0.8em; }
  .quiz-welcome-prompt {
    text-align: center; margin-top: var(--space-3);
    font-size: var(--text-body-size); color: var(--color-neutral-600);
  }
  .quiz-lang-list { display: flex; flex-direction: column; gap: var(--space-3); margin-top: var(--space-8); }

  /* ── Escolha da cliente ────────────────────────────────────────────── */
  .quiz-client-list { display: flex; flex-direction: column; gap: var(--space-2); margin-top: var(--space-4); }
  .quiz-client {
    display: flex; align-items: center; gap: var(--space-3);
    width: 100%; padding: var(--space-3); text-align: left; cursor: pointer;
    font-family: var(--font-body); font-size: var(--text-body-size); color: var(--color-text);
  }
  .quiz-client-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* .avatar-round não declara tamanho (cada tela dá o seu) e .ar-chevron é
     escopado em .action-row — os dois precisam de regra própria aqui. */
  .quiz-client .avatar-round {
    width: 38px; height: 38px; font-size: 14px; background: var(--color-neutral-300);
  }
  .quiz-client-chev { display: flex; flex-shrink: 0; color: var(--color-neutral-600); }
  .quiz-client-chev svg { width: 14px; height: 14px; }

  /* ── Revisão ───────────────────────────────────────────────────────── */
  .quiz-review-list { display: flex; flex-direction: column; gap: var(--space-3); margin-top: var(--space-4); }
  .quiz-review-item { padding: var(--space-4); }
  .quiz-review-head { display: flex; align-items: flex-start; gap: var(--space-3); }
  .quiz-review-q {
    flex: 1; min-width: 0; font-size: var(--text-caption-size);
    color: var(--color-neutral-600); line-height: var(--leading-normal);
  }
  .quiz-review-a {
    margin-top: var(--space-2); font-size: var(--text-body-size);
    font-weight: var(--text-body-strong-weight); color: var(--color-text);
    line-height: var(--leading-relaxed); white-space: pre-wrap;
  }
  .quiz-review-a.is-empty { font-weight: var(--text-body-weight); color: var(--color-neutral-600); }
  .quiz-review-refs { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2); }
  .quiz-review-ref {
    display: flex; align-items: center; gap: var(--space-2);
    padding: var(--space-1) var(--space-2-5) var(--space-1) var(--space-1);
    border-radius: var(--radius-full); background: var(--color-neutral-200);
    font-size: var(--text-caption-size); color: var(--color-text);
  }
  .quiz-review-ref i {
    width: 22px; height: 22px; border-radius: var(--radius-circle); flex-shrink: 0;
    background: linear-gradient(160deg, var(--ref-1) 0%, var(--ref-2) 100%);
  }

  /* Erro de gravação: fica na tela, junto do botão, e é anunciado. Toast
     some sozinho e é a última coisa que serve quando a ação falhou. */
  .quiz-error {
    padding: var(--space-3) var(--space-3-5); border-radius: var(--radius-sm);
    background: var(--color-accent-2-100); color: var(--color-accent-2-700);
    font-size: var(--text-caption-size); line-height: var(--leading-normal);
  }
  .quiz-error[hidden] { display: none; }

  /* ── Sucesso ───────────────────────────────────────────────────────── */
  .quiz-success { display: flex; flex-direction: column; justify-content: center; min-height: 52vh; text-align: center; gap: var(--space-3); }
  .quiz-success-mark {
    width: 56px; height: 56px; margin: 0 auto var(--space-2);
    border-radius: var(--radius-circle); background: var(--color-success-100);
    color: var(--color-success-700);
    display: flex; align-items: center; justify-content: center;
  }
  .quiz-success-mark svg { width: 26px; height: 26px; }
  .quiz-success-title {
    font-family: var(--font-heading); font-size: var(--text-title-1-size);
    font-weight: var(--text-title-1-weight); color: var(--color-text);
  }
  .quiz-success-msg {
    font-size: var(--text-body-size); color: var(--color-neutral-600);
    line-height: var(--leading-relaxed);
  }

  /* ── Relatório no perfil da cliente ────────────────────────────────── */
  .quiz-report-meta { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-5); }

  @media (prefers-reduced-motion: reduce) {
    .quiz-page, .quiz-welcome-word.is-in, .quiz-welcome-word.is-out { animation: none; }
    .quiz-progress-fill, .quiz-option-mark, .quiz-ref-check { transition: none; }
  }
  /* margin-bottom em 18px, não 14: precisa bater com o respiro antes do
     primeiro rótulo da outra seção do modal (padding 14px do cartão + 4px
     do margin-top do label = 18px) — com 14 o gap colapsava pro valor
     menor e o "Cliente" ficava mais colado que o "Serviço". */
  .toggle-row { display: flex; gap: 8px; margin-bottom: 18px; }
  .toggle-row button {
    flex: 1; padding: 9px; border-radius: 999px; border: none; cursor: pointer;
    font-family: var(--font-body); font-size: 13px; font-weight: 700;
    background: var(--color-neutral-100); color: var(--color-neutral-700);
  }
  .toggle-row button.active { background: var(--color-accent); color: var(--color-bg); }

  .tag {
    display: inline-flex; align-items: center; font-size: 11px; font-weight: 700;
    padding: 4px 10px; border-radius: 999px;
  }
  .tag-accent { background: var(--color-accent-100); color: var(--color-accent-700); }
  .tag-accent-2 { background: var(--color-accent-2-100, #f0fae1); color: var(--color-accent-2-700, #56633f); }

  /* ── Wizard "Novo agendamento" (Fase 2, 06/08/2026) ────────────────────
     Substitui o formulário único por 5 etapas em tela cheia dentro da
     mesma folha — nunca outro modal/popup. Reaproveita .modal-overlay como
     scrim/BottomSheet; .o-wizard-sheet é a variante de altura cheia com
     cabeçalho fixo + corpo rolável + rodapé fixo. Primitivos vêm de
     app/ds/orenzi-components.css (.o-btn, .o-card, .o-search-field,
     .o-chip, .o-avatar, .o-divider, .o-field, .o-badge) — o que segue é só
     a anatomia própria do wizard. */
  /* Full-screen desde 13/08/2026 (era `min(92vh, 800px)` com raio no topo,
     que no celular lia como cartão alto encostado no rodapé). A anatomia
     interna — head, dots, body rolável, footer fixo — não mudou; só o
     container passou a ir até o topo da viewport, no mesmo padrão de
     .o-fullsheet que o menu do + e o bloqueio usam. Ver o comentário do
     FullScreenSheet abaixo pro porquê de `100dvh` e da ausência de raio. */
  .o-wizard-sheet {
    display: flex; flex-direction: column;
    background: var(--color-bg);
    width: 100%; max-width: var(--canvas-max-width); margin: 0 auto;
    height: 100vh; height: 100dvh;
    overflow: hidden; position: relative;
  }
  .o-wizard-head {
    display: flex; align-items: center; gap: var(--space-2);
    padding: calc(var(--space-3) + var(--safe-top)) var(--space-4) 0; flex-shrink: 0;
  }
  .o-wizard-back svg { transform: rotate(180deg); }
  .o-wizard-titles { flex: 1; min-width: 0; padding: 0 var(--space-1); }
  .o-wizard-title {
    font-family: var(--font-heading); font-size: var(--text-title-3-size);
    font-weight: var(--text-title-3-weight); color: var(--color-text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .o-wizard-subtitle {
    font-size: var(--text-caption-size); color: var(--color-neutral-600); margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .o-wizard-dots {
    display: flex; justify-content: center; align-items: center; gap: 6px;
    padding: var(--space-3) 0 var(--space-2); flex-shrink: 0;
  }
  .o-wizard-dot {
    width: 6px; height: 6px; border-radius: var(--radius-full);
    background: var(--color-neutral-300);
    transition: background-color var(--motion-fast) var(--ease-standard), width var(--motion-fast) var(--ease-standard);
  }
  .o-wizard-dot.is-active { width: 16px; background: var(--color-accent-700); }
  .o-wizard-dot.is-done { background: var(--color-accent-600); }
  .o-wizard-body { flex: 1 1 auto; overflow-y: auto; padding: 0 var(--space-5) var(--space-4); }
  .o-wizard-footer { flex-shrink: 0; padding: var(--space-3) var(--space-5) calc(var(--space-5) + var(--safe-bottom)); }

  .o-wizard-step { animation: wizStepInNext var(--motion-emphasized) var(--ease-out); }
  .o-wizard-step.is-back { animation-name: wizStepInBack; }
  @keyframes wizStepInNext {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes wizStepInBack {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .o-wizard-sheet, .o-wizard-step { animation: none; }
  }

  /* ── FullScreenSheet (13/08/2026) ──────────────────────────────────────
     Extensão do BottomSheet para o que docs/04 §BottomSheet já mandava não
     ser folha parcial: "não usar para fluxo de várias etapas — é tela".
     Os três níveis da Agenda (menu do +, novo agendamento, bloquear
     horário) passam a subir do rodapé até o topo da viewport, em vez de
     pararem em 88vh como um cartão no pé da tela.

     Anatomia idêntica em todos: head (voltar/fechar + títulos) → body
     rolável → footer fixo com o CTA. É essa repetição que faz os três
     níveis parecerem o mesmo produto.

     `100dvh` (não `100vh`) porque no Safari do iPhone `100vh` conta a
     barra de endereço que some ao rolar — a folha ficaria mais alta que a
     tela e o CTA do rodapé cairia atrás do chrome do navegador. O `100vh`
     antes dele é o fallback pra quem não tem dvh.

     A folha não tem raio no topo de propósito: raio superior é o sinal de
     "ainda há tela atrás de mim", e aqui não há — ela É a tela. */
  .modal-overlay.is-fullsheet { align-items: stretch; }
  .o-fullsheet {
    display: flex; flex-direction: column;
    background: var(--color-bg);
    width: 100%; max-width: var(--canvas-max-width); margin: 0 auto;
    height: 100vh; height: 100dvh;
    overflow: hidden; position: relative;
  }
  /* A entrada vertical é uma CLASSE, não uma regra do container (13/08/2026).
     Enquanto vivia no `.o-fullsheet`, qualquer re-render reaplicava
     bottom→top e cada etapa do wizard parecia uma modal nova abrindo. Agora
     só `openFullSheet()` põe `.is-entering`, e navegação interna nunca põe. */
  .o-fullsheet.is-entering, .o-wizard-sheet.is-entering {
    animation: fullSheetIn var(--motion-emphasized) var(--ease-out);
  }
  .o-fullsheet.is-leaving, .o-wizard-sheet.is-leaving {
    animation: fullSheetOut var(--motion-fast) var(--ease-in) forwards;
  }
  @keyframes fullSheetIn {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  @keyframes fullSheetOut {
    from { transform: translateY(0); }
    to { transform: translateY(100%); }
  }
  .modal-overlay.is-fullsheet.is-leaving { animation: modalOverlayOut var(--motion-fast) var(--ease-in) forwards; }
  @keyframes modalOverlayOut { from { opacity: 1; } to { opacity: 0; } }

  /* ── Palco de páginas (navigation stack) ───────────────────────────────
     O shell (fundo, altura, largura) fica parado; quem desliza é o palco,
     que carrega head + body + footer de UMA tela. Durante a transição os
     dois palcos viram absolutos e se cruzam — por isso `position: relative`
     no shell acima. Fora da transição o palco é um flex normal, senão o
     `overflow-y: auto` do corpo não teria altura de referência. */
  .o-fullsheet-stage { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
  .o-fullsheet-stage.is-sliding { position: absolute; inset: 0; }
  /* Saída com recuo parcial (-28%), não -100%: é o parallax do navigation
     stack do iOS — a tela que sai anda menos que a que entra, o que dá a
     leitura de camada por baixo em vez de duas telas empurrando uma à
     outra. */
  @keyframes pageInFromRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
  @keyframes pageOutToLeft   { from { transform: translateX(0); } to { transform: translateX(-28%); opacity: .6; } }
  @keyframes pageInFromLeft  { from { transform: translateX(-28%); opacity: .6; } to { transform: translateX(0); opacity: 1; } }
  @keyframes pageOutToRight  { from { transform: translateX(0); } to { transform: translateX(100%); } }
  .o-fullsheet-head {
    flex-shrink: 0; display: flex; align-items: center; gap: var(--space-2);
    padding: calc(var(--space-3) + var(--safe-top)) var(--space-4) var(--space-3);
  }
  .o-fullsheet-titles { flex: 1; min-width: 0; padding: 0 var(--space-1); }
  .o-fullsheet-title {
    font-family: var(--font-heading); font-size: var(--text-title-3-size);
    font-weight: var(--text-title-3-weight); color: var(--color-text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .o-fullsheet-subtitle {
    font-size: var(--text-caption-size); color: var(--color-neutral-600); margin-top: 1px;
  }
  .o-fullsheet-body { flex: 1 1 auto; overflow-y: auto; padding: 0 var(--space-5) var(--space-4); }
  .o-fullsheet-footer {
    flex-shrink: 0; display: flex; flex-direction: column; gap: var(--space-2);
    padding: var(--space-3) var(--space-5) calc(var(--space-4) + var(--safe-bottom));
  }
  @media (prefers-reduced-motion: reduce) { .o-fullsheet { animation: none; } }

  /* ── Menu do + da Agenda ───────────────────────────────────────────────
     Duas ações grandes, não uma lista de linhas: são os dois caminhos que
     saem da Agenda e merecem peso igual. Ícone + título + uma linha de
     apoio dizendo o que cada um faz — sem isso "Bloquear horário" é
     ambíguo pra quem abre pela primeira vez. */
  .agenda-menu-actions { display: flex; flex-direction: column; gap: var(--space-3); margin-top: var(--space-2); }
  .agenda-menu-action {
    display: flex; align-items: center; gap: var(--space-4); width: 100%; text-align: left;
    padding: var(--space-5); border-radius: var(--radius-lg);
    background: var(--color-surface); border: var(--border-width) solid var(--color-divider);
    cursor: pointer; font-family: var(--font-body);
    transition: transform var(--motion-instant) var(--ease-out),
                background-color var(--motion-fast) var(--ease-standard);
    -webkit-tap-highlight-color: transparent;
  }
  .agenda-menu-action:active { transform: scale(0.98); background: var(--color-neutral-100); }
  .agenda-menu-action:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .ama-icon {
    width: 46px; height: 46px; border-radius: var(--radius-md); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--color-accent-100); color: var(--color-accent-700);
  }
  .ama-icon svg { width: 22px; height: 22px; }
  /* Bloqueio é o caminho neutro (a profissional se retirando da agenda),
     não uma ação de destaque como criar atendimento — daí o ícone em tom
     neutro em vez do accent da marca. Nunca --color-accent-2: essa é a cor
     de alerta do sistema, e bloquear não é um problema. */
  .ama-icon.is-neutral { background: var(--color-neutral-200); color: var(--color-neutral-700); }
  .ama-body { flex: 1; min-width: 0; }
  .ama-title {
    font-size: var(--text-body-strong-size); font-weight: var(--text-body-strong-weight);
    color: var(--color-text);
  }
  .ama-desc { font-size: var(--text-caption-size); color: var(--color-neutral-600); margin-top: 2px; }
  .ama-chevron { color: var(--color-neutral-600); flex-shrink: 0; }
  .ama-chevron svg { width: 18px; height: 18px; }

  /* ── Bloquear horário — repaginação (13/08/2026) ───────────────────────
     Os campos deixaram de ser <input> soltos empilhados e viraram linhas
     de cartão com rótulo à esquerda e valor à direita, no mesmo padrão de
     .o-card do resto do painel. O <input type="date"/"time"> nativo
     CONTINUA sendo o controle — só perdeu a moldura e ganhou o tamanho de
     um alvo de toque de verdade. Trocar por um picker próprio seria
     reescrever comportamento que o sistema operacional já faz melhor (e
     mudaria a lógica, que aqui está fora de escopo). */
  .blk-group { margin-top: var(--space-5); }
  .blk-group-label {
    font-size: var(--text-caption-size); font-weight: var(--text-body-strong-weight);
    letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--color-neutral-600); margin-bottom: var(--space-2);
  }
  .blk-row {
    display: flex; align-items: center; gap: var(--space-3);
    padding: var(--space-3-5) var(--space-4); min-height: 58px;
    background: var(--color-surface); border: var(--border-width) solid var(--color-divider);
    border-radius: var(--radius-md);
  }
  .blk-row-icon { color: var(--color-neutral-600); flex-shrink: 0; display: flex; }
  .blk-row-icon svg { width: 19px; height: 19px; }
  .blk-row-label { font-size: var(--text-body-size); color: var(--color-text); flex-shrink: 0; }
  /* O input nativo encosta na direita e é o alvo de toque: `width:auto` +
     `margin-left:auto` deixam o picker abrir do valor, que é onde o dedo
     naturalmente vai. `min-height` herda o 58px da linha inteira. */
  .blk-row input[type="date"], .blk-row input[type="time"] {
    margin-left: auto; width: auto; border: none; background: transparent;
    padding: var(--space-2) 0; color: var(--color-text);
    font-family: var(--font-body); font-size: var(--text-body-strong-size);
    font-weight: var(--text-body-strong-weight); font-variant-numeric: tabular-nums;
    cursor: pointer; -webkit-appearance: none; appearance: none; min-width: 0;
  }
  .blk-row input:focus { outline: none; }
  .blk-row input:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-xs, 8px); }
  .blk-row input::-webkit-calendar-picker-indicator { opacity: 0.55; cursor: pointer; }

  /* Início e Fim lado a lado: são um par (um intervalo), e empilhados
     pareceriam dois campos independentes. */
  .blk-time-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
  .blk-time-card {
    display: flex; flex-direction: column; gap: 2px;
    padding: var(--space-3) var(--space-4); min-height: 68px; justify-content: center;
    background: var(--color-surface); border: var(--border-width) solid var(--color-divider);
    border-radius: var(--radius-md);
  }
  .blk-time-card .btc-label {
    font-size: var(--text-caption-size); color: var(--color-neutral-600);
  }
  .blk-time-card input[type="time"] {
    width: 100%; border: none; background: transparent; padding: 0; color: var(--color-text);
    font-family: var(--font-body); font-size: var(--text-title-3-size); font-weight: 600;
    font-variant-numeric: tabular-nums; cursor: pointer; -webkit-appearance: none; appearance: none;
  }
  .blk-time-card input:focus { outline: none; }
  .blk-time-card input:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-xs, 8px); }
  .blk-time-card input::-webkit-calendar-picker-indicator { display: none; }

  /* Segmented control: trilho único com o indicador deslizando por baixo
     do rótulo — o estado selecionado é sólido e o outro é texto puro, sem
     meio-termo. `.toggle-row` (o par de pílulas antigo) não foi tocado:
     ele continua servindo as outras telas. */
  /* Segmented control com indicador que DESLIZA entre as opções, em vez de
     apagar de um lado e acender do outro (13/08/2026). O indicador é um
     elemento próprio (`.blk-seg-thumb`) posicionado por transform — não o
     fundo do botão: fundo não interpola posição, só cor, e é isso que
     produzia o "pisca-pisca" de antes. Largura fixa em 50% porque são
     sempre duas opções; se um dia forem três, a conta vira 100/n. */
  .blk-seg {
    position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-1);
    padding: var(--space-1); border-radius: var(--radius-full);
    background: var(--color-neutral-200);
  }
  .blk-seg-thumb {
    position: absolute; top: var(--space-1); bottom: var(--space-1);
    left: var(--space-1); width: calc(50% - var(--space-1));
    border-radius: var(--radius-full); background: var(--color-surface);
    box-shadow: var(--shadow-sm, 0 1px 3px rgba(43,36,32,0.12));
    transition: transform var(--motion-fast) var(--ease-standard);
    pointer-events: none;
  }
  /* `calc(100% + gap)`: o trilho tem gap entre as duas células, então o
     deslocamento até a segunda não é exatamente a largura do polegar. */
  .blk-seg-thumb.is-right { transform: translateX(calc(100% + var(--space-1))); }
  .blk-seg button {
    position: relative; z-index: 1;
    padding: var(--space-2-5) var(--space-2); border: none; border-radius: var(--radius-full);
    background: transparent; color: var(--color-neutral-700); cursor: pointer;
    font-family: var(--font-body); font-size: var(--text-body-size); font-weight: 600;
    transition: color var(--motion-fast) var(--ease-standard);
    -webkit-tap-highlight-color: transparent;
  }
  .blk-seg button.is-active { color: var(--color-text); font-weight: var(--text-body-strong-weight); }
  .blk-seg button:focus-visible { outline: none; box-shadow: var(--focus-ring); }

  /* Região que troca com o segmented. `height` é animada a partir do valor
     medido em JS (auto não interpola) e volta pra `auto` no fim, senão o
     bloco ficaria preso em px e cortaria se o texto quebrasse em mais
     linhas (rotação de tela, fonte grande do sistema) — mesma armadilha já
     documentada no dropdown do diagnóstico. */
  .blk-dynamic { overflow: hidden; transition: height var(--motion-fast) var(--ease-standard); }
  .blk-dynamic-inner { animation: blkFieldsIn var(--motion-fast) var(--ease-out); }
  @keyframes blkFieldsIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .blk-seg button, .agenda-menu-action, .blk-seg-thumb, .blk-dynamic { transition: none; }
    .agenda-menu-action:active { transform: none; }
    .o-fullsheet.is-entering, .o-wizard-sheet.is-entering,
    .o-fullsheet.is-leaving, .o-wizard-sheet.is-leaving,
    .modal-overlay.is-fullsheet.is-leaving, .blk-dynamic-inner { animation: none; }
  }

  .blk-reason-input {
    width: 100%; min-height: 58px; padding: var(--space-3-5) var(--space-4);
    background: var(--color-surface); border: var(--border-width) solid var(--color-divider);
    border-radius: var(--radius-md); color: var(--color-text);
    font-family: var(--font-body); font-size: var(--text-body-size);
    transition: border-color var(--motion-fast) var(--ease-standard),
                box-shadow var(--motion-fast) var(--ease-standard);
  }
  .blk-reason-input::placeholder { color: var(--color-neutral-600); }
  .blk-reason-input:focus { outline: none; }
  .blk-reason-input:focus-visible {
    outline: none; border-color: var(--color-accent-600); box-shadow: var(--focus-ring);
  }
  .blk-error {
    margin-top: var(--space-4); padding: var(--space-3) var(--space-4);
    border-radius: var(--radius-md); font-size: var(--text-caption-size);
    background: var(--color-accent-2-100); color: var(--color-accent-2-700);
  }
  /* O detalhe do bloqueio CONTINUA folha parcial de propósito: é leitura
     curta com duas ações, não fluxo de várias etapas — exatamente o caso
     que docs/04 §BottomSheet manda manter como folha. Só a linguagem dos
     botões passou pro vocabulário .o-btn, pra bater com o resto. */
  .blk-detail-actions { display: flex; flex-direction: column; gap: var(--space-2); margin-top: var(--space-4); }

  /* Etapa 1 · lista de clientes */
  .o-wizard-list { display: flex; flex-direction: column; gap: var(--space-2); margin-top: var(--space-3); }
  .o-wizard-section-label {
    font-size: var(--text-micro-size); font-weight: var(--text-micro-weight);
    letter-spacing: 0.04em; text-transform: uppercase; color: var(--color-neutral-600);
    margin: var(--space-3) 0 var(--space-1);
  }
  .o-wizard-client-row { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2-5) var(--space-2); }
  .o-wizard-client-row .wcr-body { flex: 1; min-width: 0; text-align: left; }
  .o-wizard-client-row .wcr-name {
    font-size: var(--text-body-strong-size); font-weight: var(--text-body-strong-weight);
    color: var(--color-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .o-wizard-client-row .wcr-phone { font-size: var(--text-caption-size); color: var(--color-neutral-600); }
  .o-wizard-client-row .wcr-chevron { color: var(--color-neutral-600); flex-shrink: 0; }
  .o-wizard-client-row .wcr-chevron svg { width: 16px; height: 16px; }

  .o-wizard-add-client {
    display: flex; align-items: center; justify-content: center; gap: var(--space-2);
    padding: var(--space-3-5); margin-top: var(--space-2); min-height: var(--touch-target-min);
    border: 1.5px dashed var(--color-divider); border-radius: var(--radius-md);
    background: transparent; color: var(--color-accent-700);
    font-family: var(--font-body); font-size: var(--text-body-strong-size); font-weight: var(--text-body-strong-weight);
    cursor: pointer; width: 100%;
    transition: background-color var(--motion-fast) var(--ease-standard), transform var(--motion-instant) var(--ease-standard);
  }
  .o-wizard-add-client:active { transform: scale(0.98); background: var(--color-accent-100); }
  .o-wizard-add-client:focus-visible { outline: none; box-shadow: var(--focus-ring); }

  /* Sub-tela "Novo cliente" (cadastro rápido) — mesmo ícone-em-círculo
     tingido que o resto do produto usa pra dar boas-vindas a uma tela
     curta (selo VIP, badge de avatar), e os campos agrupados num .o-card
     em vez de soltos na folha, batendo com o resto do wizard. */
  .o-wizard-nc-icon {
    width: 64px; height: 64px; border-radius: var(--radius-circle);
    background: var(--color-accent-100); color: var(--color-accent-700);
    display: flex; align-items: center; justify-content: center;
    margin: var(--space-3) auto var(--space-5);
  }
  .o-wizard-nc-icon svg { width: 28px; height: 28px; }

  /* Etapa 2 · serviços */
  .o-wizard-service-row { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2-5) var(--space-2); }
  .o-wizard-service-icon {
    width: 40px; height: 40px; border-radius: var(--radius-sm); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--svc-bg, var(--color-accent-100)); color: var(--svc-color, var(--color-accent-700));
  }
  .o-wizard-service-icon svg { width: 19px; height: 19px; }
  .o-wizard-service-row .wsr-body { flex: 1; min-width: 0; text-align: left; }
  .o-wizard-service-row .wsr-name { font-size: var(--text-body-strong-size); font-weight: var(--text-body-strong-weight); color: var(--color-text); }
  .o-wizard-service-row .wsr-meta { font-size: var(--text-caption-size); color: var(--color-neutral-600); }
  .o-wizard-service-row .wsr-price {
    font-family: var(--font-heading); font-weight: 700; font-size: var(--text-body-strong-size); color: var(--color-text); flex-shrink: 0;
  }

  /* Etapa 3 · calendário */
  .o-wizard-cal-head { display: flex; align-items: center; justify-content: space-between; margin: var(--space-4) 0 var(--space-3); }
  .o-wizard-cal-title { font-family: var(--font-heading); font-weight: 600; font-size: var(--text-title-3-size); color: var(--color-text); }
  .o-wizard-cal-weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr); text-align: center;
    font-size: var(--text-micro-size); color: var(--color-neutral-600); margin-bottom: var(--space-1);
  }
  .o-wizard-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .o-wizard-cal-day {
    position: relative; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; border: none; border-radius: var(--radius-sm); background: transparent; color: var(--color-text);
    font-family: var(--font-body); font-size: var(--text-caption-size); cursor: pointer;
    transition: background-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
  }
  .o-wizard-cal-day:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .o-wizard-cal-day:disabled { color: var(--color-neutral-300); cursor: not-allowed; }
  .o-wizard-cal-day.is-outside { visibility: hidden; pointer-events: none; }
  .o-wizard-cal-day.is-today { font-weight: 700; }
  .o-wizard-cal-day.is-selected { background: var(--color-accent-700); color: var(--color-bg); }
  .o-wizard-cal-day .wcd-dot { width: 5px; height: 5px; border-radius: var(--radius-full); background: transparent; }
  .o-wizard-cal-day .wcd-dot.lvl-muitos { background: var(--color-success); }
  .o-wizard-cal-day .wcd-dot.lvl-poucos { background: var(--color-accent-600); }
  .o-wizard-cal-day .wcd-dot.lvl-nenhum { background: var(--color-neutral-300); }
  .o-wizard-cal-day .wcd-dot.lvl-indisponivel { background: var(--color-accent-2); }
  .o-wizard-cal-day.is-selected .wcd-dot { background: var(--color-bg); }
  .o-wizard-cal-legend {
    display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-3); margin-top: var(--space-4);
    font-size: var(--text-micro-size); color: var(--color-neutral-600);
  }
  .o-wizard-cal-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .o-wizard-cal-legend i { width: 6px; height: 6px; border-radius: var(--radius-full); display: inline-block; }
  .o-wizard-cal-legend i.lvl-muitos { background: var(--color-success); }
  .o-wizard-cal-legend i.lvl-poucos { background: var(--color-accent-600); }
  .o-wizard-cal-legend i.lvl-nenhum { background: var(--color-neutral-300); }
  .o-wizard-cal-legend i.lvl-indisponivel { background: var(--color-accent-2); }

  /* Etapa 4 · horários */
  .o-wizard-slot-card { margin-bottom: var(--space-3); padding: var(--space-3-5) var(--space-4); animation: wizSlotIn var(--motion-standard) var(--ease-out) backwards; }
  .o-wizard-slot-card:nth-child(1) { animation-delay: 0ms; }
  .o-wizard-slot-card:nth-child(2) { animation-delay: 30ms; }
  .o-wizard-slot-card:nth-child(3) { animation-delay: 60ms; }
  .o-wizard-slot-card:nth-child(4) { animation-delay: 90ms; }
  .o-wizard-slot-card:nth-child(n+5) { animation-delay: 110ms; }
  @keyframes wizSlotIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .o-wizard-slot-card { animation: none; } }
  .o-wizard-slot-card.is-selected { border-color: var(--color-accent-700); background: var(--color-accent-100); box-shadow: var(--elevation-hover); }
  .o-wizard-slot-top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
  .o-wizard-slot-time {
    font-family: var(--font-heading); font-size: var(--text-title-2-size); font-weight: 700; color: var(--color-text);
    font-variant-numeric: tabular-nums;
  }
  .o-wizard-slot-check {
    width: 22px; height: 22px; border-radius: var(--radius-circle); border: 1.5px solid var(--color-divider);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: transparent;
    transition: background-color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
  }
  .o-wizard-slot-check svg { width: 13px; height: 13px; }
  .o-wizard-slot-card.is-selected .o-wizard-slot-check { background: var(--color-accent-700); border-color: var(--color-accent-700); color: var(--color-bg); }
  .o-wizard-slot-msg { font-size: var(--text-caption-size); color: var(--color-neutral-600); margin-top: 2px; }
  .o-wizard-slot-badge { margin-bottom: var(--space-1); }

  .o-wizard-daypreview { margin-top: var(--space-2); }
  .o-wizard-daypreview-track { position: relative; height: 28px; border-radius: var(--radius-full); background: var(--color-neutral-200); overflow: hidden; }
  .o-wizard-daypreview-busy { position: absolute; top: 0; bottom: 0; background: var(--color-neutral-300); }
  .o-wizard-daypreview-mark { position: absolute; top: -3px; bottom: -3px; width: 3px; border-radius: var(--radius-full); background: var(--color-accent-700); }
  .o-wizard-daypreview-labels { display: flex; justify-content: space-between; font-size: var(--text-micro-size); color: var(--color-neutral-600); margin-top: var(--space-1); }

  /* Etapa 5 · confirmação */
  .o-wizard-summary-row { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-2-5) 0; }
  .o-wizard-summary-row + .o-wizard-summary-row { border-top: 1px solid var(--color-divider); }
  .o-wizard-summary-icon { width: 20px; height: 20px; color: var(--color-neutral-600); flex-shrink: 0; margin-top: 1px; }
  .o-wizard-summary-icon svg { width: 100%; height: 100%; }
  .o-wizard-summary-label {
    font-size: var(--text-micro-size); font-weight: var(--text-micro-weight); letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--color-neutral-600);
  }
  .o-wizard-summary-value { font-size: var(--text-body-size); color: var(--color-text); margin-top: 1px; }
  .o-wizard-notice {
    display: flex; gap: var(--space-2); align-items: flex-start; margin-top: var(--space-4);
    padding: var(--space-3) var(--space-3-5); background: var(--color-accent-100); border-radius: var(--radius-md);
    font-size: var(--text-caption-size); color: var(--color-accent-700);
  }
  .o-wizard-notice svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }

  .o-wizard-empty { padding: var(--space-6) var(--space-3); text-align: center; color: var(--color-neutral-600); font-size: var(--text-body-size); }

  /* Entrada contextual pelo "Xh livres" da Agenda (Fase 2b, 06/08/2026) —
     tira a etapa Data quando ela já é conhecida. Banner discreto (superfície
     neutra, sem cor de destaque) pra não competir com o conteúdo da etapa;
     "Alterar" reaproveita .o-btn-ghost.o-btn-inline, nada novo. */
  .o-wizard-context-banner {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
    margin: 0 var(--space-5) var(--space-2); padding: var(--space-2-5) var(--space-3-5);
    background: var(--color-surface); border: var(--border-width) solid var(--color-divider);
    border-radius: var(--radius-md); flex-shrink: 0;
  }
  .o-wizard-context-banner-text { font-size: var(--text-caption-size); color: var(--color-neutral-600); line-height: 1.4; }
  .o-wizard-context-banner-text b { color: var(--color-text); font-weight: 600; }
  .o-wizard-context-banner .o-btn-inline { padding: 0 var(--space-3); flex-shrink: 0; }

  /* ══ Abas Clientes (03/08/2026) e Estoque (04/08/2026) — toolbar e chips
     migrados para o Design System ═══ docs/04_COMPONENT_LIBRARY.md.
     Fundo, borda, raio, cor e tipografia vêm dos primitivos (.o-card,
     .o-avatar, .o-badge, .o-chip, .o-divider, .o-search-field,
     .o-search-filter-bar, .o-chip-group-scroll, .o-card-metric-summary,
     .o-icon-btn) em app/ds/orenzi-components.css. O que segue é só a
     anatomia própria de cada tela.

     .search-field / .sort-btn / .filter-chips / .filter-chip perderam o
     último consumidor com a migração do Estoque e saíram daqui.
     .clients-toolbar e .search-clear ficam órfãs — nenhuma tela usa mais
     essas duas, mas remover classe fora do escopo explícito deste PR (só
     toolbar/chips do Estoque) fica pra próxima limpeza.

     A regra que segue valendo: a lista é redesenhada sozinha
     (renderClientsList / renderStockList) sem passar por render(), senão o
     campo de busca perde o foco a cada tecla digitada. */
  .clients-toolbar { display: flex; gap: 10px; margin-bottom: 14px; }
  .search-clear {
    display: none; border: none; background: none; padding: 0; cursor: pointer;
    color: var(--color-neutral-600); flex-shrink: 0; align-items: center;
  }
  .search-clear svg { width: 15px; height: 15px; }

  /* Resumo de 4 métricas — usa .o-card-metric-summary (padding próprio
     pra layout em coluna, ver orenzi-components.css) em vez do padding
     padrão do Card. Isto aqui é só o layout dos 4 itens dentro dele. */
  .cli-summary { display: flex; }
  .cli-summary .cs-item { flex: 1; text-align: center; min-width: 0; }
  .cli-summary .cs-icon { display: flex; justify-content: center; color: var(--color-accent-600); margin-bottom: var(--space-1); }
  .cli-summary .cs-icon svg { width: 15px; height: 15px; }
  .cli-summary .cs-val {
    font-family: var(--font-heading); font-size: var(--text-title-2-size); font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .cli-summary .cs-lbl {
    font-size: var(--text-caption-size); color: var(--color-neutral-600); margin-top: 4px; line-height: 1.3;
    padding: 0 var(--space-1);
  }

  .clients-list-label {
    font-size: var(--text-caption-size); color: var(--color-neutral-600); font-weight: 500;
    margin-bottom: var(--space-3);
  }

  /* ClientCard (docs/04 §ClientCard) — a estrutura vem de .o-card +
     .o-card-interactive (fundo, borda, raio 16, pressed, focus-visible,
     hover). Padding e separação entre cartões são mais generosos que o
     padrão do Card: correção de densidade de 04/08/2026 — o cartão
     empilha várias linhas (nome, datas, telefone, métricas) e precisa
     de mais respiro que uma linha de texto comum pra não ler como lista
     comprimida. Escopado só em .client-card — não muda .o-card em
     nenhum outro lugar do app. */
  .client-card.o-card {
    padding: var(--space-4);
    margin-bottom: var(--space-4);
  }
  .cc-top { display: flex; align-items: center; gap: var(--space-3); }
  .cc-head { flex: 1; min-width: 0; }
  .cc-name-row { display: flex; align-items: center; gap: var(--space-1); min-width: 0; }
  .cc-name {
    font-size: var(--text-body-strong-size); font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cc-name-row .o-badge { flex-shrink: 0; }
  .cc-sub {
    display: flex; align-items: center; gap: 4px;
    font-size: var(--text-caption-size); color: var(--color-neutral-600); margin-top: 3px;
  }
  .cc-sub svg { width: 12px; height: 12px; flex-shrink: 0; }
  /* Telefone é a informação mais auxiliar da linha de cima — mesmo
     tamanho e cor de .cc-sub, só um pouco mais discreto (opacidade), e
     fica por último na ordem visual: nome → datas → telefone. */
  .cc-phone { opacity: 0.85; }
  .cc-chevron { color: var(--color-neutral-600); display: flex; flex-shrink: 0; }
  .cc-chevron svg { width: 15px; height: 15px; }
  .cc-metrics { display: flex; align-items: center; gap: var(--space-5); }
  .o-divider.cc-divider { margin: var(--space-4) 0; }
  .cc-metric { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .cc-metric .ccm-icon { color: var(--color-accent-600); display: flex; flex-shrink: 0; }
  .cc-metric .ccm-icon svg { width: 14px; height: 14px; }
  .cc-metric .ccm-val { font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc-metric .ccm-lbl { font-size: var(--text-micro-size); color: var(--color-neutral-600); }
  /* Status: ponto + rótulo em texto, sempre juntos — nunca só cor
     (docs/02 §7, docs/07 §12). Preservado como está: docs/04 já chama
     esta implementação de "modelo", não converter para Badge aqui
     descaracterizaria o padrão que o resto do app deve seguir. */
  .cc-status {
    margin-left: auto; display: flex; align-items: center; gap: 5px; flex-shrink: 0;
    font-size: var(--text-caption-size); font-weight: 600; color: var(--color-neutral-600);
  }
  .cc-status .ccs-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--color-neutral-300); }
  .cc-status.is-ativa .ccs-dot { background: var(--color-success); }
  .cc-status.is-nova .ccs-dot { background: var(--color-accent-600); }
  .cc-status.is-inativa .ccs-dot { background: var(--color-neutral-300); }

  /* Folha de opções (ordenação, novo cliente) — reaproveita .modal-overlay/
     .modal-sheet, só acrescenta a lista de opções. */
  /* ── Questionário no perfil da cliente (17/08/2026) ─────────────
     Seção compacta dentro do perfil, não card destacado: é uma
     ferramenta do perfil, não um assunto concorrente. Reaproveita
     .profile-section / .action-row / .o-btn — nada de componente novo. */
  .cq-sec .cq-empty {
    font-size: 13px; color: var(--color-neutral-600);
    margin: 0 0 12px; line-height: 1.4;
  }
  .cq-last { margin-bottom: 12px; }
  .cq-last-lbl { font-size: 12px; color: var(--color-neutral-600); }
  .cq-last-date {
    font-family: var(--font-heading); font-size: 15px; font-weight: 600;
    margin-top: 2px; font-variant-numeric: tabular-nums;
  }
  /* Ação secundária em texto: "novo questionário" não pode competir com
     "ver o que já existe", que é o que a Juliane faz mais vezes. */
  .cq-link {
    display: inline-flex; align-items: center; min-height: 44px;
    margin-top: 4px; padding: 0; background: none; border: none;
    font-family: var(--font-body); font-size: 13px; font-weight: 600;
    color: var(--color-accent-700); cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s var(--ease-standard);
  }
  .cq-link:active { transform: scale(0.98); }
  .cq-link:focus-visible { box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }
  .cq-cta { width: 100%; }
  .cq-older { margin-top: 2px; }
  .cq-older-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; min-height: 44px; padding: 8px 0;
    background: none; border: none; border-top: 1px solid var(--color-divider);
    font-family: var(--font-body); font-size: 13px; color: var(--color-text);
    cursor: pointer; font-variant-numeric: tabular-nums;
    -webkit-tap-highlight-color: transparent;
  }
  .cq-older-row .ar-chevron { display: flex; color: var(--color-neutral-600); }
  .cq-older-row .ar-chevron svg { width: 16px; height: 16px; }
  @media (prefers-reduced-motion: reduce) {
    .cq-link:active { transform: none; }
  }

  /* ── Valor do atendimento (17/08/2026) ──────────────────────────
     Só tokens existentes. Nenhuma cor de estado: nem ter valor final
     nem não ter é problema, e pintar isso de verde/vermelho inventaria
     um julgamento que o produto não faz. */
  .appt-valor {
    margin-bottom: 20px; padding-bottom: 16px;
    border-bottom: 1px solid var(--color-divider);
  }
  .av-num {
    font-family: var(--font-heading); font-size: 26px; font-weight: 600;
    line-height: 1.2; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
  }
  .av-tag { font-size: 12px; color: var(--color-neutral-600); margin-top: 2px; }
  .av-orig { font-size: 12px; color: var(--color-neutral-600); margin-top: 6px; font-variant-numeric: tabular-nums; }
  /* Convite discreto: texto, não botão preenchido. Alvo de 44px pela
     altura real, sem engordar o desenho. */
  .av-btn {
    display: inline-flex; align-items: center; min-height: 44px;
    margin-top: 4px; padding: 0; background: none; border: none;
    font-family: var(--font-body); font-size: 13px; font-weight: 600;
    color: var(--color-accent-700); cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s var(--ease-standard);
  }
  .av-btn:active { transform: scale(0.98); }
  .av-btn:focus-visible { box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }

  .av-field {
    display: flex; align-items: center; gap: 8px; margin-top: 4px;
    background: var(--color-surface); border: 1px solid var(--color-divider);
    border-radius: var(--radius-sm); padding: 0 14px;
  }
  .av-cur { font-family: var(--font-heading); font-size: 18px; font-weight: 600; color: var(--color-neutral-600); }
  /* ⚠ DUAS armadilhas neste seletor, e as duas já morderam antes.
     1. `input[type=text]` (linha ~1558) é seletor de ATRIBUTO e vence
        `.av-input` na especificidade — exatamente o que a nota do Login
        V2 descreve sobre `input[type=email]`. Por isso o seletor aqui é
        `.av-field input.av-input`, e por isso a regra reanula
        explicitamente `border-radius`, `background`, `padding`,
        `border` e `margin-bottom`, que viriam da regra global.
     2. Sem isso o campo herdava `font-size: 14px`, e abaixo de 16px o
        Safari do iPhone dá ZOOM ao focar — a folha sai do lugar com o
        teclado aberto. 22px é folgado acima do piso. */
  .av-field input.av-input {
    flex: 1; min-width: 0; width: auto;
    border: none; border-radius: 0; background: none; outline: none;
    margin-bottom: 0;
    font-family: var(--font-heading); font-size: 22px; font-weight: 600;
    color: var(--color-text); padding: 14px 0; font-variant-numeric: tabular-nums;
  }
  .av-input::placeholder { color: var(--color-neutral-300); font-weight: 400; }
  .av-field:focus-within { border-color: var(--color-accent); box-shadow: var(--focus-ring); }
  .av-hint { font-size: 12px; color: var(--color-neutral-600); margin: 10px 0 0; font-variant-numeric: tabular-nums; }
  .av-error { font-size: 12px; color: var(--color-accent-2-700); margin: 8px 0 0; }
  /* Reset não é ação destrutiva — nada se perde e é reversível. Sem
     vermelho, sem confirmação. */
  .av-reset {
    display: block; width: 100%; min-height: 44px; margin-top: 4px;
    background: none; border: none; font-family: var(--font-body);
    font-size: 13px; font-weight: 600; color: var(--color-neutral-700); cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .av-reset:active { transform: scale(0.98); }
  .av-reset:focus-visible { box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }
  @media (prefers-reduced-motion: reduce) {
    .av-btn:active, .av-reset:active { transform: none; }
  }

  .sheet-option {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 4px;
    background: none; border: none; border-bottom: 1px solid var(--color-divider);
    font-family: var(--font-body); font-size: 14.5px; color: var(--color-text);
    cursor: pointer; text-align: left; transition: background .15s ease;
  }
  .sheet-option:last-child { border-bottom: none; }
  .sheet-option:active { background: var(--color-neutral-100); }
  .sheet-option .so-check { margin-left: auto; color: var(--color-accent-700); display: none; }
  .sheet-option .so-check svg { width: 16px; height: 16px; }
  .sheet-option.is-selected { font-weight: 700; }
  .sheet-option.is-selected .so-check { display: flex; }

  /* FAB da aba Clientes gira 45° quando a folha está aberta — o "+" vira "×"
     sem trocar de ícone. */
  .fab.is-open { transform: rotate(45deg); }
  .fab.is-open:active { transform: rotate(45deg) scale(0.93); }

  /* Clone do avatar que viaja da lista pro perfil (shared element). */
  .avatar-morph { position: fixed; z-index: 250; pointer-events: none; border-radius: 50%; }

  /* ══ Aba Estoque: painel de gestão ═══════════════════════════
     Redesenho de 03/08/2026. Mesma regra da lista de clientes: a lista é
     redesenhada sozinha (renderStockList) sem passar por render(), senão o
     campo de busca perde o foco a cada tecla digitada.

     Os quatro estados de estoque saem todos da paleta que já existe — não
     entrou cor nova. Cada estado só declara duas variáveis (--stk-color e
     --stk-bg) e todo o resto (ponto, badge, borda do cartão) lê delas. */
  /* O verde do ponto de "cliente ativa" (#4f8a5b) só valia como ponto: como
     TEXTO de badge sobre o próprio fundo tingido ele dava 3,2:1, abaixo do
     mínimo legível. Mesmo verde, escurecido até 5,0:1 — medido, não chutado. */
  .st-ok      { --stk-color: #3b6744; --stk-bg: rgba(79,138,91,0.14); }
  .st-baixo   { --stk-color: var(--color-accent-700); --stk-bg: var(--color-accent-100); }
  .st-critico { --stk-color: var(--color-accent-2-700); --stk-bg: var(--color-accent-2-100); }
  .st-sem     { --stk-color: var(--color-neutral-600); --stk-bg: var(--color-neutral-200); }

  /* Resumo em quatro cartões. Cada um é um atalho pro filtro correspondente —
     número que não leva a lugar nenhum seria enfeite. */
  .stock-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .stk-sum-card {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: var(--color-surface); border: 1px solid var(--color-divider);
    border-radius: 16px; padding: 12px; cursor: pointer;
    font-family: var(--font-body); color: var(--color-text);
    transition: transform .16s ease, background .18s ease, border-color .18s ease;
  }
  .stk-sum-card:active { transform: scale(0.98); }
  .stk-sum-card.active { border-color: var(--stk-color); background: var(--stk-bg); }
  .stk-sum-card .ssc-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--stk-color); }
  .stk-sum-card .ssc-val {
    font-family: var(--font-heading); font-weight: 600; font-size: 20px; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .stk-sum-card .ssc-lbl { font-size: 10.5px; color: var(--color-neutral-600); margin-top: 3px; line-height: 1.25; }

  .stock-value-card {
    display: flex; align-items: center; gap: 14px; background: var(--color-surface);
    border: 1px solid var(--color-divider); border-radius: 16px; padding: 16px; margin-bottom: 20px;
  }
  .stock-value-card .svc-icon {
    width: 36px; height: 36px; border-radius: 12px; background: var(--color-accent-100);
    color: var(--color-accent-700); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .stock-value-card .svc-icon svg { width: 18px; height: 18px; }
  .stock-value-card .svc-body { flex: 1; min-width: 0; }
  .stock-value-card .svc-val {
    font-family: var(--font-heading); font-weight: 600; font-size: 26px; line-height: 1.1;
    letter-spacing: -0.01em; font-variant-numeric: tabular-nums;
  }
  .stock-value-card .svc-lbl { font-size: 12px; color: var(--color-neutral-600); margin-top: 3px; }
  .stock-value-card .svc-upd {
    text-align: right; flex-shrink: 0; font-size: 10.5px; color: var(--color-neutral-600); line-height: 1.4;
  }
  .stock-value-card .svc-upd strong { display: block; font-size: 12.5px; color: var(--color-text); font-variant-numeric: tabular-nums; }

  .stock-group-label {
    display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-neutral-600);
    margin: 20px 0 10px;
  }
  .stock-group-label:first-child { margin-top: 0; }
  .stock-group-label .sgl-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--stk-color); }
  .stock-count-label { font-size: 11.5px; color: var(--color-neutral-600); font-weight: 500; margin-bottom: 10px; }

  /* Cartão de produto: mesma base do .client-card (surface + borda + raio 16),
     empilhado — identificação em cima, números embaixo. Só o urgente ganha a
     barra colorida na lateral; tingir o cartão inteiro, como a versão antiga
     fazia, competia com o badge e com a própria lista. */
  .product-card {
    background: var(--color-surface); border: 1px solid var(--color-divider);
    border-radius: 16px; padding: 12px; margin-bottom: 8px;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .product-card.is-critico, .product-card.is-sem { border-left: 3px solid var(--stk-color); }
  .product-card:active { transform: scale(0.985); }
  .pd-top { display: flex; align-items: center; gap: 12px; }
  .pd-open {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px;
    background: none; border: none; padding: 0; font-family: inherit; color: inherit;
    text-align: left; cursor: pointer;
  }
  .pd-thumb {
    width: 44px; height: 44px; border-radius: 13px; flex-shrink: 0; overflow: hidden;
    background: var(--color-accent-100); color: var(--color-accent-700);
    display: flex; align-items: center; justify-content: center;
  }
  .pd-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pd-thumb svg { width: 20px; height: 20px; }
  .pd-head { flex: 1; min-width: 0; }
  .pd-name { font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pd-sub {
    font-size: 11.5px; color: var(--color-neutral-600); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pd-code { font-variant-numeric: tabular-nums; }
  /* Estrela de favorito: 44px de área de toque com um ícone de 17px dentro. */
  .pd-fav {
    flex-shrink: 0; width: 44px; height: 44px; margin: -6px -6px -6px 0; border: none;
    background: none; cursor: pointer; color: var(--color-neutral-300);
    display: flex; align-items: center; justify-content: center;
    transition: transform .16s cubic-bezier(.34,1.56,.64,1), color .18s ease;
  }
  .pd-fav svg { width: 17px; height: 17px; }
  .pd-fav.is-on { color: var(--color-accent-700); }
  .pd-fav:active { transform: scale(0.9); } /* era 0.88 — migrado pro degrau oficial de icon-button (mesmo peso de .o-icon-btn/.qty-btn) */

  .pd-bottom {
    display: flex; align-items: center; gap: 10px; margin-top: 12px; padding-top: 12px;
    border-top: 1px solid var(--color-divider);
  }
  .pd-meta { flex: 1; min-width: 0; }
  .stk-badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700;
    padding: 4px 9px; border-radius: 999px; background: var(--stk-bg); color: var(--stk-color);
    white-space: nowrap;
  }
  .stk-badge .sb-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pd-min { font-size: 11px; color: var(--color-neutral-600); margin-top: 5px; }
  .pd-notes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pd-note {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
    padding: 4px 9px; border-radius: 999px; background: var(--color-neutral-200);
    color: var(--color-neutral-700);
  }
  .pd-note svg { width: 12px; height: 12px; }
  .pd-note.is-alert { background: var(--color-accent-2-100); color: var(--color-accent-2-700); }
  .pd-note.is-soft { background: var(--color-accent-100); color: var(--color-accent-700); }

  /* Contador: botões de 38px com a área de toque esticada pra 46 pelo ::after
     (o alvo mínimo confortável), e o número no meio é ele próprio um botão —
     é por ali que se digita a quantidade à mão. */
  .stock-qty { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .qty-btn {
    position: relative; width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--color-divider); background: var(--color-bg);
    color: var(--color-neutral-700); font-size: 19px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: transform .14s ease, background .14s ease, border-color .14s ease;
  }
  .qty-btn::after { content: ''; position: absolute; inset: -4px; }
  .qty-btn:active { background: var(--color-accent-100); border-color: var(--color-accent-600); transform: scale(0.9); }
  .qty-btn:disabled { opacity: .35; cursor: not-allowed; }
  .qty-num {
    min-width: 56px; height: 38px; padding: 0 2px; border: none; background: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: var(--font-body); color: var(--color-text);
    font-weight: 700; font-size: 16px; line-height: 1; font-variant-numeric: tabular-nums;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: transform .14s ease;
  }
  .qty-num:active { transform: scale(0.9); } /* era 0.94 — migrado pro mesmo degrau do .qty-btn irmão, consistência dentro do stepper */
  .qty-unit { font-size: 9.5px; font-weight: 600; color: var(--color-neutral-600); margin-top: 3px; letter-spacing: 0.03em; }

  /* Sugestões, movimentações e estatísticas — blocos de fim de tela, todos no
     mesmo cartão surface+borda do resto do app. */
  .stock-section { margin-top: 32px; }
  .stock-section-title {
    display: flex; align-items: center; gap: 8px; font-family: var(--font-heading);
    font-weight: 600; font-size: 16px; margin-bottom: 12px;
  }
  .stock-section-title .sst-icon { color: var(--color-accent-600); display: flex; flex-shrink: 0; }
  .stock-section-title .sst-icon svg { width: 17px; height: 17px; }
  .stock-section-title .sst-count { margin-left: auto; font-family: var(--font-body); font-size: 11.5px; font-weight: 500; color: var(--color-neutral-600); }

  .suggestion-card {
    display: flex; gap: 12px; background: var(--color-surface); border: 1px solid var(--color-divider);
    border-radius: 16px; padding: 14px; margin-bottom: 8px;
  }
  .suggestion-card .sc-icon {
    width: 32px; height: 32px; border-radius: 11px; flex-shrink: 0;
    background: var(--stk-bg); color: var(--stk-color);
    display: flex; align-items: center; justify-content: center;
  }
  .suggestion-card .sc-icon svg { width: 16px; height: 16px; }
  .suggestion-card .sc-body { flex: 1; min-width: 0; }
  .suggestion-card .sc-name { font-size: 14px; font-weight: 700; }
  .suggestion-card .sc-text { font-size: 12.5px; color: var(--color-neutral-600); margin-top: 4px; line-height: 1.45; }
  .suggestion-card .sc-text strong { color: var(--color-text); font-weight: 700; }

  /* Timeline de movimentação: mesma linguagem da timeline de visitas do perfil
     da cliente (ponto + linha conectora), com o ícone dizendo o sentido. */
  .mv-day-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--color-neutral-600); margin: 16px 0 8px;
  }
  .mv-day-label:first-child { margin-top: 0; }
  .mv-item { display: flex; gap: 12px; }
  .mv-rail { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
  .mv-icon {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    background: var(--stk-bg); color: var(--stk-color);
    display: flex; align-items: center; justify-content: center;
  }
  .mv-icon svg { width: 15px; height: 15px; }
  .mv-line { flex: 1; width: 1px; background: var(--color-divider); margin: 4px 0; min-height: 10px; }
  .mv-item:last-child .mv-line { display: none; }
  .mv-body { flex: 1; min-width: 0; padding-bottom: 14px; }
  .mv-item:last-child .mv-body { padding-bottom: 0; }
  .mv-top { display: flex; align-items: baseline; gap: 8px; }
  .mv-qty { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--stk-color); flex-shrink: 0; }
  .mv-name { font-size: 14px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mv-sub { font-size: 11.5px; color: var(--color-neutral-600); margin-top: 2px; }

  .stock-stats {
    background: var(--color-surface); border: 1px solid var(--color-divider);
    border-radius: 16px; padding: 16px;
  }
  .stock-stats + .stock-stats { margin-top: 8px; }
  .stock-stats .ss-head { font-size: 11.5px; font-weight: 700; color: var(--color-neutral-600); margin-bottom: 12px; }
  .stock-stats .ss-pair { display: flex; gap: 12px; }
  .stock-stats .ss-cell { flex: 1; min-width: 0; }
  .stock-stats .ss-val {
    font-family: var(--font-heading); font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums;
  }
  .stock-stats .ss-lbl { font-size: 10.5px; color: var(--color-neutral-600); margin-top: 3px; line-height: 1.3; }

  .stock-empty-note {
    display: flex; gap: 10px; align-items: flex-start; background: var(--color-surface);
    border: 1px dashed var(--color-divider); border-radius: 16px; padding: 14px;
    font-size: 12.5px; color: var(--color-neutral-600); line-height: 1.45;
  }
  .stock-empty-note .sen-icon { color: var(--color-neutral-600); display: flex; flex-shrink: 0; margin-top: 1px; }
  .stock-empty-note .sen-icon svg { width: 16px; height: 16px; }

  /* Entrada em sequência: resumo → busca → filtros → lista. Cada bloco leva a
     própria classe com um delay inline; nada além de 220ms no último. */
  @keyframes stkEnter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .stk-enter { animation: stkEnter .2s cubic-bezier(.22,.61,.36,1) both; }

  @media (prefers-reduced-motion: reduce) {
    .stk-enter { animation: none; }
    .stk-sum-card, .qty-btn, .qty-num, .pd-fav, .product-card { transition: none; }
    .stk-sum-card:active, .qty-btn:active, .qty-num:active, .pd-fav:active, .product-card:active { transform: none; }
  }
  .avatar-round {
    border-radius: 50%; color: var(--color-bg); font-family: var(--font-heading); font-style: normal; font-weight: 600;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .profile-back {
