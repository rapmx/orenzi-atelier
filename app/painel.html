async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    // Quem registrou a movimentação. Só existe uma conta hoje, mas o histórico
    // guarda o nome mesmo assim — sem isso, "quem tirou 2 luvas?" fica sem
    // resposta no dia em que houver uma segunda pessoa.
    const email = (session.user && session.user.email) || '';
    const apelido = email.split('@')[0].replace(/[._-]+/g, ' ').trim();
    state.userLabel = apelido ? apelido.charAt(0).toUpperCase() + apelido.slice(1) : 'Painel';
    document.querySelector('nav').style.display = 'flex';
    document.getElementById('logoutBtn').style.display = 'inline';
    loadAll();
  } else {
    renderLogin();
  }
}

document.getElementById('logoutBtn').onclick = async () => {
  await sb.auth.signOut();
};

sb.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_IN') checkSession();
  if (event === 'SIGNED_OUT') renderLogin();
});

// ── NOVO AGENDAMENTO MANUAL (botão +) ────────────────────────
const modalContainer = document.getElementById('modalContainer');
let newApptClientMode = 'existing'; // 'existing' | 'new'

function closeModal() {
  modalContainer.innerHTML = '';
}

function openNewApptModal() {
  newApptClientMode = 'existing';
  renderNewApptModal();
}

// Blocos ocupados da profissional no dia — só o trabalho (wb/wa), a pausa
// fica de fora de propósito, igual a RPC get_busy_slots que o agendar.html
// usa: durante a pausa a profissional está livre pra atender outra cliente.
function busyBlocksForStaffOnDate(staffId, dayDate) {
  return state.appointments
    .filter(a => a.staff?.id === staffId && a.status !== 'cancelled' && sameDay(new Date(a.starts_at), dayDate))
    .flatMap(a => {
      const seg = segmentsOf(a);
      const start = new Date(a.starts_at);
      const end = new Date(a.ends_at);
      const blocks = [];
      if (seg.wb > 0) blocks.push([start, new Date(start.getTime() + seg.wb * 60000)]);
      if (seg.wa > 0) blocks.push([new Date(end.getTime() - seg.wa * 60000), end]);
      return blocks;
    });
}

// Horários "HH:MM" livres pra um serviço, profissional e dia — mesma regra
// do agendar.html (expediente + grade de 30 min), só que lendo
// state.appointments direto em vez de RPC, já que aqui a sessão é
// autenticada e os dados já estão carregados.
function computeAvailableSlots(staffId, dateStr, durationMin) {
  if (!staffId || !dateStr || !durationMin) return [];
  const dayDate = new Date(`${dateStr}T00:00:00`);
  const busy = busyBlocksForStaffOnDate(staffId, dayDate);

  const slots = [];
  for (let m = OPEN_HOUR * 60; m + durationMin <= CLOSE_HOUR * 60; m += SLOT_MINUTES) {
    const slotStart = new Date(dayDate);
    slotStart.setHours(0, m, 0, 0); // setHours rola o overflow de minuto pra hora sozinho
    const slotEnd = new Date(slotStart.getTime() + durationMin * 60000);
    const overlaps = busy.some(([bs, be]) => slotStart < be && slotEnd > bs);
    if (!overlaps) {
      const hh = String(Math.floor(m / 60)).padStart(2, '0');
      const mm = String(m % 60).padStart(2, '0');
      slots.push(`${hh}:${mm}`);
    }
  }
  return slots;
}

// Profissional em uso no modal: o campo, se existir, ou a única ativa
// quando o campo nem é desenhado — mesma lógica do onclick de "Salvar".
function currentModalStaffId() {
  const staffEl = document.getElementById('staffSelect');
  if (staffEl) return staffEl.value;
  const ativos = profissionaisAtivos();
  return ativos.length === 1 ? ativos[0].id : '';
}

// Recalcula o dropdown de horário sempre que serviço, profissional ou data
// mudam no modal. Tenta manter o horário já escolhido se ele continuar
// disponível na nova combinação; senão volta pro placeholder.
function refreshApptTimeOptions() {
  const timeEl = document.getElementById('apptTime');
  if (!timeEl) return;
  const service = state.services.find(s => s.id === document.getElementById('serviceSelect').value);
  const staffId = currentModalStaffId();
  const dateStr = document.getElementById('apptDate').value;
  const previous = timeEl.value;

  if (!service || !staffId || !dateStr) {
    timeEl.innerHTML = '<option value="">Escolha serviço e data…</option>';
    timeEl.disabled = true;
    return;
  }

  const slots = computeAvailableSlots(staffId, dateStr, service.duration_minutes);
  timeEl.disabled = false;
  if (!slots.length) {
    timeEl.innerHTML = '<option value="">Sem horário livre nesse dia</option>';
    return;
  }
  timeEl.innerHTML = `
    <option value="">Selecione…</option>
    ${slots.map(t => `<option value="${t}" ${t === previous ? 'selected' : ''}>${t}</option>`).join('')}
  `;
}

function renderNewApptModal(errorMsg) {
  const now = new Date();
  const todayStr = now.toISOString().split('T')[0];

  modalContainer.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-sheet">
        <button class="modal-close" id="modalClose">✕</button>
        <h2>Novo agendamento</h2>

        <div class="modal-section">
          <div class="toggle-row">
            <button id="modeExisting" class="${newApptClientMode === 'existing' ? 'active' : ''}">Cliente existente</button>
            <button id="modeNew" class="${newApptClientMode === 'new' ? 'active' : ''}">Novo cliente</button>
          </div>
          <div id="clientFields"></div>
        </div>

        <div class="modal-section">
          <label class="modal-field-label">Serviço</label>
          <select id="serviceSelect">
            <option value="">Selecione…</option>
            ${state.services.map(s => `<option value="${s.id}">${s.name} (${s.duration_minutes} min)</option>`).join('')}
          </select>

          ${profissionaisAtivos().length > 1 ? `
            <label class="modal-field-label">Profissional</label>
            <select id="staffSelect">
              <option value="">Selecione…</option>
              ${profissionaisAtivos().map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
            </select>
          ` : ''}

          <label class="modal-field-label">Data</label>
          <input type="date" id="apptDate" value="${todayStr}">
          <label class="modal-field-label">Horário</label>
          <select id="apptTime" disabled>
            <option value="">Escolha serviço e data…</option>
          </select>
        </div>

        <button class="btn btn-primary" id="saveAppt">Salvar agendamento</button>
        ${errorMsg ? `<div class="login-error">${errorMsg}</div>` : ''}
      </div>
    </div>
  `;

  function renderClientFields() {
    const wrap = document.getElementById('clientFields');
    if (newApptClientMode === 'existing') {
      wrap.innerHTML = `
        <label class="modal-field-label">Cliente</label>
        <select id="clientSelect">
          <option value="">Selecione…</option>
          ${state.clients.map(c => `<option value="${c.id}">${c.name}${c.phone ? ' · ' + c.phone : ''}</option>`).join('')}
        </select>
      `;
    } else {
      wrap.innerHTML = `
        <label class="modal-field-label">Nome do cliente</label>
        <input type="text" id="newClientName" placeholder="Nome completo">
        <label class="modal-field-label">Telefone</label>
        <input type="tel" id="newClientPhone" placeholder="+353 ...">
        <label class="modal-field-label">E-mail</label>
        <input type="email" id="newClientEmail" placeholder="cliente@email.com">
      `;
    }
  }
  renderClientFields();

  // Horário depende de serviço (duração), profissional e data — recalcula
  // sempre que um desses três muda, e uma vez já de cara pro caso de o
  // errorMsg ter trazido tudo de volta preenchido.
  document.getElementById('serviceSelect').onchange = refreshApptTimeOptions;
  document.getElementById('apptDate').onchange = refreshApptTimeOptions;
  const staffSelectForRefresh = document.getElementById('staffSelect');
  if (staffSelectForRefresh) staffSelectForRefresh.onchange = refreshApptTimeOptions;
  refreshApptTimeOptions();

  document.getElementById('modalClose').onclick = closeModal;
  document.getElementById('modalOverlay').onclick = (e) => { if (e.target.id === 'modalOverlay') closeModal(); };
  document.getElementById('modeExisting').onclick = () => { newApptClientMode = 'existing'; renderClientFields(); document.getElementById('modeExisting').classList.add('active'); document.getElementById('modeNew').classList.remove('active'); };
  document.getElementById('modeNew').onclick = () => { newApptClientMode = 'new'; renderClientFields(); document.getElementById('modeNew').classList.add('active'); document.getElementById('modeExisting').classList.remove('active'); };

  document.getElementById('saveAppt').onclick = async () => {
    try {
      const serviceId = document.getElementById('serviceSelect').value;
      const ativos = profissionaisAtivos();
      // Com uma profissional só o campo nem é desenhado: o agendamento sai no
      // nome dela.
      const staffEl = document.getElementById('staffSelect');
      const staffId = staffEl ? staffEl.value : (ativos.length === 1 ? ativos[0].id : '');
      const date = document.getElementById('apptDate').value;
      const time = document.getElementById('apptTime').value.trim();

      if (!serviceId || !staffId || !date || !/^\d{1,2}:\d{2}$/.test(time)) {
        renderNewApptModal(staffEl
          ? 'Preencha serviço, profissional, data e escolha um horário.'
          : 'Preencha serviço, data e escolha um horário.');
        return;
      }

      let clientId;
      if (newApptClientMode === 'existing') {
        clientId = document.getElementById('clientSelect').value;
        if (!clientId) { renderNewApptModal('Selecione um cliente.'); return; }
      } else {
        const name = document.getElementById('newClientName').value.trim();
        const phone = document.getElementById('newClientPhone').value.trim();
        const email = document.getElementById('newClientEmail').value.trim();
        if (!name || !phone) { renderNewApptModal('Preencha nome e telefone do novo cliente.'); return; }
        const normalizedPhone = phone.replace(/[^\d]/g, '');
        const { data: existing } = await sb.from('clients').select('id').eq('phone', normalizedPhone).maybeSingle();
        if (existing) {
          clientId = existing.id;
        } else {
          const { data: created, error: createErr } = await sb
            .from('clients').insert({ name, phone: normalizedPhone, email: email || null }).select('id').single();
          if (createErr) throw createErr;
          clientId = created.id;
        }
      }

      const service = state.services.find(s => s.id === serviceId);
      const [hh, mm] = time.split(':').map(Number);
      const startsAt = new Date(`${date}T00:00:00`);
      startsAt.setHours(hh, mm, 0, 0);
      const endsAt = new Date(startsAt.getTime() + service.duration_minutes * 60000);

      const { error: apptErr } = await sb.from('appointments').insert({
        client_id: clientId,
        staff_id: staffId,
        service_id: serviceId,
        starts_at: startsAt.toISOString(),
        ends_at: endsAt.toISOString(),
        status: 'confirmed',
        source: 'manual',
      });
      if (apptErr) throw apptErr;

      closeModal();
      showToast('Agendamento criado');
      await loadAll();
    } catch (e) {
      renderNewApptModal(e.message);
    }
  };
}

// O mesmo botão fixo serve duas abas — o que ele cadastra depende de onde
// está. A Agenda ganhou o próprio + na pílula do mês (#agendaAddBtn).
document.getElementById('fabNewAppt').onclick = () => {
  if (state.tab === 'clients') openNewClientSheet();
  else openStockFabSheet();
};

// "Hoje" é elemento fixo fora do #app, então o clique é amarrado uma vez só
// aqui — diferente de prevWeek/nextWeek/week-day, que são recriados a cada
// renderAgenda() e precisam ser reamarrados toda vez.
document.getElementById('gotoTodayFab').onclick = () => {
  if (state.tab !== 'agenda') return;
  const hoje = new Date();
  if (!sameDay(state.agendaDate, hoje)) {
    const direction = hoje > state.agendaDate ? 'forward' : 'back';
    state.agendaDate = hoje;
    renderAgendaTransition(direction);
    highlightCurrentTimeLine();
    return;
  }
  // Já é hoje: não tem o que deslizar, então o feedback é recentralizar a
  // grade no agora com scroll animado + destacar a linha — senão o toque
  // no botão pareceria não ter feito nada.
  const el = document.getElementById('timelineEl');
  const info = currentTimeInfo();
  if (el && info) scrollTimelineTo(el, info.top - HOUR_HEIGHT * 1.5, { animate: true });
  highlightCurrentTimeLine();
};

// A cada 30s, se a agenda de hoje estiver na tela, reposiciona a linha do
// horário atual sem re-renderizar a tela inteira.
setInterval(updateCurrentTimeLine, 30000);

checkSession();

setTimeout(() => {
  const splash = document.getElementById('splash');
  splash.classList.add('fade-out');
  setTimeout(() => splash.remove(), 500);
}, 1300);
</script>
