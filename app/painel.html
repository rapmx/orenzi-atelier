// ══════════════════════════════════════════════════════════════
// INSIGHTS · "Como o negócio está indo — e o que dá para fazer"
//
// Arquitetura aprovada nas Fases 1–3 (preview/insights-v2-r2.html),
// refinada no R4. Cada bloco responde UMA pergunta, nesta ordem:
//   Hero .............. como estou indo?
//   Considerações ..... o que merece ser observado?   (condicional)
//   Sugestões ......... o que posso fazer agora?
//   Indicadores ....... como está minha operação?
//   Tendência ......... estou crescendo?
//   Onde há espaço .... onde ainda posso vender mais / onde ficou ocioso?
//   Onde está o dinheiro  o que está gerando receita?
//   Como as clientes chegam  qual canal está funcionando?
//
// Um único seletor (Semana · Mês · Ano) governa a aba inteira — não
// existe toggle local. Dois períodos simultâneos na mesma tela
// impedem qualquer comparação de significar alguma coisa.
//
// R4: "Precisa de atenção" virou "Considerações" (nem tudo ali é
// urgência — é o que merece ser observado). Todo card de Sugestão com
// destino real ganhou CTA, inclusive Clientes (filtro contextual por
// IDs). O carrossel passou a mostrar um card por vez, centralizado, com
// um aceno de descoberta na primeira exposição. "Onde há espaço" ficou
// fractal (Semana→dias, Mês→semanas, Ano→meses) e separa passado
// (ocioso, um fato) de futuro (ainda disponível, uma oportunidade) em
// vez de comparar os dois como se fossem a mesma métrica (R4.1). A troca
// de período ganhou uma cápsula que desliza e conteúdo que não pisca.
// ══════════════════════════════════════════════════════════════

const INSIGHTS_PERIODS = [
  { key: 'semana', label: 'Semana' },
  { key: 'mes', label: 'Mês' },
  { key: 'ano', label: 'Ano' },
];

// Amostras mínimas. Abaixo destes pisos a tela DIZ que não tem
// histórico em vez de mostrar um número frágil — mesma regra que o
// Estoque já aplica em CONSUMO_MIN_SAIDAS/CONSUMO_MIN_DIAS.
const INS_MIN_APPTS_PERIODO = 5;   // nada é concluído abaixo disso
const INS_MIN_SERVICO = 4;         // volume mínimo pra falar de um serviço
const INS_MIN_SERVICO_QUEDA = 8;   // base pra DECLARAR queda: 4→3 numa semana é oscilação, não tendência
// R4.1 — a base de "queda de serviço" precisa por timeframe: 8 atendimentos
// é razoável de exigir num MÊS, mas quase nunca acontece numa SEMANA (o
// detector ficaria sempre calado ali) e é baixo demais pro ANO (deixaria
// passar ruído). Sem isso o detector não é "elegível" nos três — é só
// tecnicamente presente e praticamente mudo fora do Mês.
function insMinQuedaServico(kind) {
  if (kind === 'semana') return 4;
  if (kind === 'ano') return 20;
  return INS_MIN_SERVICO_QUEDA;
}
const INS_MIN_VISITAS_CLIENTE = 3; // visitas pra ela ter "intervalo habitual"
const INS_MIN_SEMANAS_MEDIA = 4;   // semanas fechadas pra existir "sua média"
const INS_MIN_HORAS_LIVRES = 2;    // abaixo disso "espaço livre" é ruído
const INS_ATRASO_FATOR = 1.5;      // 1,5× o intervalo dela = passou do ponto
const INS_MIN_CLIENTES_RITMO_ANO = 8; // amostra mínima pra falar de ritmo de retorno no Ano

// ── Janela do período ─────────────────────────────────────────
// `cut` é o "mesmo ponto" do período: para o atual é agora; para o
// anterior é agora deslocado um período para trás. Comparar mês
// parcial com mês inteiro deixaria o delta estruturalmente negativo
// todo começo de mês — ruído vermelho por construção.
function insPeriodStart(date, kind) {
  const d = new Date(date);
  if (kind === 'semana') return startOfWeekMonday(d);
  d.setHours(0, 0, 0, 0);
  if (kind === 'mes') { d.setDate(1); return d; }
  d.setMonth(0, 1);
  return d;
}
function insPeriodEnd(start, kind) {
  const d = new Date(start);
  if (kind === 'semana') d.setDate(d.getDate() + 7);
  else if (kind === 'mes') d.setMonth(d.getMonth() + 1);
  else d.setFullYear(d.getFullYear() + 1);
  return d;
}
function insShiftBack(date, kind, n) {
  const d = new Date(date);
  if (kind === 'semana') { d.setDate(d.getDate() - 7 * n); return d; }
  if (kind === 'ano') { d.setFullYear(d.getFullYear() - n); return d; }
  // Mês: 31/03 menos um mês tem que virar 28/02, não 03/03.
  const dia = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() - n);
  const ultimo = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(dia, ultimo));
  return d;
}
function insWindow(kind, offset) {
  const cut = offset ? insShiftBack(new Date(), kind, offset) : new Date();
  const start = insPeriodStart(cut, kind);
  return { start, end: insPeriodEnd(start, kind), cut };
}
function insApptsBetween(from, to) {
  return state.appointments.filter(a => {
    const s = new Date(a.starts_at);
    return s >= from && s < to;
  });
}
// Duração real reservada na agenda (ends_at − starts_at), com a duração
// do serviço como reserva se o par vier inconsistente. Toda conta de
// ocupação de Insights usa ESTA função — antes conviviam duas fórmulas
// diferentes na mesma tela.
function insApptMinutes(a) {
  const m = (new Date(a.ends_at) - new Date(a.starts_at)) / 60000;
  return isFinite(m) && m > 0 ? m : serviceDurationMinutes(a.service && a.service.id);
}
function insSumRevenue(list) {
  return list.reduce((s, a) => s + appointmentRevenue(a), 0);
}
// Capacidade = só dias em que o salão abre, só profissionais ativas, e
// contra o expediente real (OPEN_HOUR–CLOSE_HOUR), nunca contra a janela
// de desenho da agenda.
function insOpenDays(from, to) {
  const dias = [];
  const d = new Date(from); d.setHours(0, 0, 0, 0);
  const fim = new Date(to);
  while (d < fim) {
    if (isSalonOpenDay(d)) dias.push(new Date(d));
    d.setDate(d.getDate() + 1);
  }
  return dias;
}
function insCapacityMinutes(from, to) {
  const staff = Math.max(1, profissionaisAtivos().length);
  return insOpenDays(from, to).length * WORK_MINUTES_PER_DAY * staff;
}
function insOccupancy(list, from, to) {
  const cap = insCapacityMinutes(from, to);
  if (!cap) return null;
  const usados = list.reduce((s, a) => s + insApptMinutes(a), 0);
  return Math.min(100, Math.round((usados / cap) * 100));
}
function insNewClients(from, to) {
  const comData = state.clients.filter(c => c.created_at);
  if (!comData.length) return null;
  return comData.filter(c => { const d = new Date(c.created_at); return d >= from && d < to; }).length;
}

const INS_PERIOD_WORD = { semana: 'semana', mes: 'mês', ano: 'ano' };
function insPeriodLabels(kind) {
  const w = insWindow(kind, 0);
  const fmtDia = d => d.toLocaleDateString('pt-BR', { day: 'numeric', month: 'long' });
  // Duas formas do mesmo rótulo, porque a regência muda: `vs` vem logo
  // depois de um valor ("€1.010 na semana passada") e `rel` vem depois de
  // "em relação" ("em relação à semana passada").
  if (kind === 'semana') {
    return { header: `${fmtDia(w.start)} – ${fmtDia(new Date(w.end - 1))}`, eyebrow: 'Esta semana',
      vs: 'na semana passada', rel: 'à semana passada', restante: 'no restante da semana' };
  }
  if (kind === 'mes') {
    const s = w.start.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
    return { header: s.charAt(0).toUpperCase() + s.slice(1),
      eyebrow: `1 – ${w.cut.getDate()} de ${w.start.toLocaleDateString('pt-BR', { month: 'long' })}`,
      vs: 'no mesmo ponto do mês passado', rel: 'ao mesmo ponto do mês passado', restante: 'no restante do mês' };
  }
  return { header: String(w.start.getFullYear()), eyebrow: `1 de janeiro – ${fmtDia(w.cut)}`,
    vs: 'no mesmo ponto do ano passado', rel: 'ao mesmo ponto do ano passado', restante: 'no restante do ano' };
}

// ── Dados do período ──────────────────────────────────────────
// Um único objeto alimenta a tela inteira. `realizado` é derivado por
// TEMPO (starts_at já passou) — o produto ainda não tem fluxo para
// marcar concluído/não compareceu, então nenhum status é inventado.
function insComputePeriod(kind) {
  const atual = insWindow(kind, 0);
  const anterior = insWindow(kind, 1);

  const realizados = insApptsBetween(atual.start, atual.cut);
  const agendados = insApptsBetween(atual.cut, atual.end);
  const antRealizados = insApptsBetween(anterior.start, anterior.cut);

  const receita = insSumRevenue(realizados);
  const antReceita = insSumRevenue(antRealizados);

  const ticket = realizados.length ? receita / realizados.length : null;
  const antTicket = antRealizados.length ? antReceita / antRealizados.length : null;
  const ocup = insOccupancy(realizados, atual.start, atual.cut);
  const antOcup = insOccupancy(antRealizados, anterior.start, anterior.cut);
  const novas = insNewClients(atual.start, atual.cut);
  const antNovas = insNewClients(anterior.start, anterior.cut);

  return {
    kind, atual, anterior, realizados, agendados, antRealizados,
    receita, antReceita, ticket, antTicket, ocup, antOcup, novas, antNovas,
    agendado: insSumRevenue(agendados),
    labels: insPeriodLabels(kind),
    suficiente: realizados.length >= INS_MIN_APPTS_PERIODO,
  };
}

// ── Variação ──────────────────────────────────────────────────
// Sem base anterior não existe variação — devolve null e a tela não
// mostra delta nenhum, em vez de inventar "+100%".
function insDelta(cur, prev, tipo) {
  if (cur === null || cur === undefined || prev === null || prev === undefined) return null;
  if (tipo === 'pp') {
    const diff = Math.round(cur - prev);
    if (!diff) return null;
    return { dir: diff > 0 ? 'up' : 'down', text: `${Math.abs(diff)} p.p.` };
  }
  if (!prev) return null;
  if (tipo === 'abs') {
    const diff = Math.round(cur - prev);
    if (!diff) return null;
    return { dir: diff > 0 ? 'up' : 'down', text: String(Math.abs(diff)) };
  }
  const pct = Math.round(((cur - prev) / prev) * 100);
  if (!pct) return null;
  return { dir: pct > 0 ? 'up' : 'down', text: `${Math.abs(pct)}%` };
}
function insDeltaHtml(d, classe) {
  if (!d) return '';
  return `<span class="${classe} is-${d.dir}">${d.dir === 'up' ? '↑' : '↓'} ${d.text}</span>`;
}

// ── Faixas do dia ─────────────────────────────────────────────
// Três faixas do expediente REAL. Nunca as 17 linhas da janela de
// desenho da agenda (AGENDA_START_HOUR–AGENDA_END_HOUR).
function insFaixas() {
  const passo = (CLOSE_HOUR - OPEN_HOUR) / 3;
  return [
    { nome: 'Manhã', ini: OPEN_HOUR, fim: OPEN_HOUR + passo },
    { nome: 'Início da tarde', ini: OPEN_HOUR + passo, fim: OPEN_HOUR + 2 * passo },
    { nome: 'Fim da tarde', ini: OPEN_HOUR + 2 * passo, fim: CLOSE_HOUR },
  ];
}

// ── Tendência ─────────────────────────────────────────────────
// Só períodos FECHADOS entram na geometria. O período em curso ao lado
// de períodos inteiros desenha uma queda que não aconteceu; ele vive em
// texto, abaixo do gráfico.
function insTrendSeries(kind) {
  const n = kind === 'ano' ? 4 : 6;
  const agora = new Date();
  const out = [];
  for (let i = n; i >= 1; i--) {
    const start = insPeriodStart(insShiftBack(agora, kind, i), kind);
    const end = insPeriodEnd(start, kind);
    const lista = insApptsBetween(start, end);
    let label;
    if (kind === 'semana') label = `${start.getDate()}/${start.getMonth() + 1}`;
    else if (kind === 'mes') { const m = start.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', ''); label = m.charAt(0).toUpperCase() + m.slice(1); }
    else label = String(start.getFullYear());
    out.push({ label, total: insSumRevenue(lista), count: lista.length });
  }
  return out;
}

const INS_CHART = { W: 320, H: 132, PT: 30, PB: 22, PL: 10, PR: 10 };
function insTrendSvg(serie) {
  const { W, H, PT, PB, PL, PR } = INS_CHART;
  const n = serie.length;
  const vals = serie.map(p => p.total);
  const topo = Math.max(...vals);
  const base = Math.min(...vals);
  const max = topo * 1.12 || 1;
  const min = topo === base ? 0 : base * 0.74;
  const x = i => n > 1 ? PL + (i / (n - 1)) * (W - PL - PR) : W / 2;
  const y = v => PT + (1 - (v - min) / Math.max(1, max - min)) * (H - PT - PB);
  const iMax = vals.indexOf(topo);

  const d = serie.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.total).toFixed(1)}`).join(' ');
  const area = `${d} L${x(n - 1).toFixed(1)},${H - PB} L${x(0).toFixed(1)},${H - PB} Z`;

  // Destaque do melhor período: ponto maior + valor em --color-text, sem
  // introduzir marca visual nova (nada de estrela ou selo).
  const rotulos = serie.map((p, i) => {
    const vx = Math.min(W - 20, Math.max(20, x(i)));
    return `<text x="${vx.toFixed(1)}" y="${(y(p.total) - 12).toFixed(1)}" text-anchor="middle"
      font-family="Poppins, sans-serif" font-size="11" font-weight="600"
      fill="${i === iMax ? 'var(--color-text)' : 'var(--color-neutral-600)'}"
      style="font-variant-numeric:tabular-nums">${formatCurrency(p.total)}</text>`;
  }).join('');
  const pontos = serie.map((p, i) =>
    `<circle cx="${x(i).toFixed(1)}" cy="${y(p.total).toFixed(1)}" r="${i === iMax ? 4.2 : 2.8}" fill="var(--color-accent-600)"/>`).join('');
  const eixo = serie.map((p, i) =>
    `<text x="${x(i).toFixed(1)}" y="${H - 5}" text-anchor="middle" font-family="Jost, sans-serif"
      font-size="11" font-weight="600" fill="var(--color-neutral-600)">${esc(p.label)}</text>`).join('');

  const resumo = serie.map(p => `${p.label}: ${formatCurrency(p.total)}`).join('. ');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img"
      aria-label="Receita por período fechado. ${esc(resumo)}. Melhor: ${esc(serie[iMax].label)}.">
    <path d="${area}" fill="var(--color-accent-100)" opacity=".5"/>
    <path id="insTrendLine" d="${d}" fill="none" stroke="var(--color-accent-600)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${pontos}${rotulos}${eixo}
  </svg>`;
}

function insServicos(list) {
  const mapa = new Map();
  list.forEach(a => {
    const nome = (a.service && a.service.name) || 'Outro';
    if (!mapa.has(nome)) mapa.set(nome, { nome, receita: 0, qtd: 0, minutos: 0 });
    const r = mapa.get(nome);
    r.receita += appointmentRevenue(a);
    r.qtd += 1;
    r.minutos += insApptMinutes(a);
  });
  return Array.from(mapa.values())
    .map(r => ({ ...r, hora: r.minutos > 0 ? r.receita / (r.minutos / 60) : null }))
    .sort((a, b) => b.receita - a.receita);
}

const INS_DIA_NOME = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];

// ══════════════════════════════════════════════════════════════
// "ONDE SOBRA ESPAÇO" · fractal
//
// Cada timeframe mostra a decomposição imediatamente inferior:
//   Semana → dias (com faixas do dia como segunda dimensão)
//   Mês    → semanas do mês
//   Ano    → meses do ano
//
// "Espaço" é sempre `capacidade − usado` do intervalo, sem distinguir
// passado de futuro: para um dia que já passou isso é um fato histórico
// (quanto ficou sem atendimento), para um dia futuro é oportunidade
// disponível. A mesma fórmula serve aos dois — é o que permite mostrar
// a SEMANA inteira (inclusive os dias que já aconteceram) em vez de
// zerar dias passados como "lotados" só por não terem futuro restante.
// ══════════════════════════════════════════════════════════════

// Matriz dia×faixa para uma lista EXPLÍCITA de dias (cada um à meia-noite).
// Reaproveitada tanto pelo bloco de exibição (Semana, semana inteira)
// quanto pela Sugestão de espaço (só dias futuros, ver insSugestaoEspaco).
function insDayFaixaMatrix(dias) {
  const faixas = insFaixas();
  const staff = Math.max(1, profissionaisAtivos().length);
  const horasFaixa = (CLOSE_HOUR - OPEN_HOUR) / 3;
  const celulas = faixas.map((fx, fi) => dias.map(d => {
    const ini0 = new Date(d); ini0.setHours(Math.floor(fx.ini), (fx.ini % 1) * 60, 0, 0);
    const fim0 = new Date(d); fim0.setHours(Math.floor(fx.fim), (fx.fim % 1) * 60, 0, 0);
    const diaSeguinte = new Date(d); diaSeguinte.setDate(diaSeguinte.getDate() + 1);
    let usado = 0;
    insApptsBetween(d, diaSeguinte).forEach(a => {
      const ini = new Date(a.starts_at), fimA = new Date(a.ends_at);
      const sobrepos = Math.max(0, Math.min(fimA, fim0) - Math.max(ini, ini0)) / 3600000;
      usado += sobrepos;
    });
    const cap = horasFaixa * staff;
    return { dia: d.getDay(), data: new Date(d), faixa: fi, livre: Math.max(0, Math.round(cap - usado)), cap: Math.round(cap) };
  }));
  return { faixas, celulas };
}

// Nível MÊS → semanas: cada bucket é a fatia do mês pertencente àquela
// semana (a primeira e a última podem ser parciais).
function insFractalSemanas(atual) {
  const semanas = [];
  let cursor = new Date(atual.start);
  let n = 1;
  while (cursor < atual.end) {
    const seg = startOfWeekMonday(cursor);
    const fimSemanaCheia = new Date(seg); fimSemanaCheia.setDate(fimSemanaCheia.getDate() + 7);
    const ate = fimSemanaCheia < atual.end ? fimSemanaCheia : atual.end;
    semanas.push({ label: `Sem ${n}`, labelCompleto: `Semana ${n}`, de: new Date(cursor), ate: new Date(ate) });
    cursor = ate;
    n++;
  }
  return semanas;
}
// Nível ANO → meses: os 12 do ano selecionado. `label` fica abreviado
// (cabe no tile de 6×2); `labelCompleto` existe pra frases narrativas —
// "Ago ainda tem 146h disponíveis" lê como telegrama, "Agosto..." não.
const MONTH_FULL = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
  'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
function insFractalMeses(atual) {
  const ano = atual.start.getFullYear();
  return Array.from({ length: 12 }, (_, m) => ({
    label: MONTH_ABBR[m], labelCompleto: MONTH_FULL[m],
    de: new Date(ano, m, 1), ate: new Date(ano, m + 1, 1),
  }));
}

// Três degraus em token existente, por RATIO absoluto (não relativo ao
// máximo do conjunto) — um único vazio grande não pode mais espremer
// todas as outras células no mesmo degrau "cheio".
function insMapStep(livre, cap) {
  if (!cap || livre <= 0) return 'is-cheio';
  const r = livre / cap;
  if (r >= 0.55) return 'is-muito-livre';
  if (r >= 0.20) return 'is-livre';
  return 'is-cheio';
}

// R4.1 — correção semântica: a versão anterior misturava capacidade
// HISTÓRICA (ociosa, um fato — o dia/semana/mês já aconteceu) com
// capacidade FUTURA (ainda disponível, uma oportunidade) como se fossem
// a mesma métrica. No Ano isso produzia frases como "Outubro é onde mais
// houve espaço" em agosto — Outubro não tinha acontecido ainda. As duas
// nunca são comparadas entre si a partir de agora: cada segmento (dia,
// semana ou mês) recebe um status e só entra no ranking que faz sentido
// pra ele.
function insSegStatus(s, hoje) {
  if (s.ate <= hoje) return 'encerrado';
  if (s.de > hoje) return 'futuro';
  return 'atual';
}

// Monta o bloco "Onde há espaço" — HTML pronto por nível fractal.
function insSpaceBlock(P) {
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);

  if (P.kind === 'semana') {
    const dias = insOpenDays(P.atual.start, P.atual.end); // semana inteira, passada + futura
    const m = insDayFaixaMatrix(dias);
    const flat = m.celulas.flat();
    if (!flat.some(c => c.cap > 0)) return { temEspaco: false };

    // "Ainda disponível" (hoje + futuro, bookável de verdade) e "já
    // aconteceu" (só dias estritamente antes de hoje) respondem perguntas
    // diferentes — oportunidade vs. fato histórico — e nunca viram uma
    // frase só.
    let melhorDisp = null, melhorPassado = null;
    flat.forEach(c => {
      if (c.data >= hoje) { if (!melhorDisp || c.livre > melhorDisp.livre) melhorDisp = c; }
      else { if (!melhorPassado || c.livre > melhorPassado.livre) melhorPassado = c; }
    });

    let leitura;
    if (melhorDisp && melhorDisp.livre >= INS_MIN_HORAS_LIVRES) {
      leitura = `Você ainda tem espaço nesta semana — o maior é <em>${m.faixas[melhorDisp.faixa].nome.toLowerCase()} de ${INS_DIA_NOME[melhorDisp.dia]}</em>, ${melhorDisp.livre}h livres.`;
    } else if (melhorPassado && melhorPassado.livre >= INS_MIN_HORAS_LIVRES) {
      leitura = `Esta semana já fechou. <em>${m.faixas[melhorPassado.faixa].nome.toLowerCase()} de ${INS_DIA_NOME[melhorPassado.dia]}</em> foi onde mais sobrou tempo ocioso — ${melhorPassado.livre}h.`;
    } else {
      leitura = 'A agenda desta semana está cheia.';
    }

    const html = `
      <table class="ins-map">
        <thead><tr><th></th>${dias.map(d => `<th scope="col" class="${d < hoje ? 'is-passado' : ''}">${WEEKDAY_LABELS_3[d.getDay()]}</th>`).join('')}</tr></thead>
        <tbody>
          ${m.celulas.map((linha, fi) => `<tr>
            <th scope="row" class="ins-map-lbl">${m.faixas[fi].nome}</th>
            ${linha.map(c => `<td class="ins-map-cell ${insMapStep(c.livre, c.cap)}${c.data < hoje ? ' is-passado' : ''}">${c.livre}h</td>`).join('')}
          </tr>`).join('')}
        </tbody>
      </table>
      <p class="ins-map-legend">Dias já encerrados aparecem esmaecidos · quanto mais escuro, mais espaço</p>`;
    return { temEspaco: true, leitura, html };
  }

  const mensal = P.kind === 'mes';
  const segs = mensal ? insFractalSemanas(P.atual) : insFractalMeses(P.atual);
  const linha = segs.map(s => {
    const cap = insCapacityMinutes(s.de, s.ate);
    const usados = insApptsBetween(s.de, s.ate).reduce((sum, a) => sum + insApptMinutes(a), 0);
    return { label: s.label, labelCompleto: s.labelCompleto, cap: Math.round(cap / 60), livre: Math.round(Math.max(0, cap - usados) / 60), status: insSegStatus(s, hoje) };
  });
  if (!linha.some(c => c.cap > 0)) return { temEspaco: false };

  // O ranking histórico usa SÓ segmentos encerrados — o atual ainda está
  // em andamento (menos tempo passado = "livre" artificialmente alto) e o
  // futuro nunca aconteceu. Nenhum dos dois entra na comparação.
  const encerrados = linha.filter(c => c.status === 'encerrado' && c.cap > 0);
  const atualSeg = linha.find(c => c.status === 'atual' && c.cap > 0);
  let melhorHistorico = null;
  encerrados.forEach(c => { if (!melhorHistorico || c.livre > melhorHistorico.livre) melhorHistorico = c; });

  const verbo = mensal ? 'sobrou' : 'houve'; // Ano é retrospectivo por natureza — a própria pergunta aprovada já vem no passado
  const partes = [];
  if (melhorHistorico && melhorHistorico.livre >= INS_MIN_HORAS_LIVRES) {
    // Nome completo em frase narrativa ("Agosto", não "Ago") — abreviação
    // só nos tiles, onde o espaço é compacto de propósito (R4.2).
    partes.push(`<em>${esc(melhorHistorico.labelCompleto)}</em> é onde mais ${verbo} espaço ${mensal ? 'este mês' : 'este ano'} — ${melhorHistorico.livre}h livres.`);
  } else if (!encerrados.length) {
    partes.push(mensal ? 'O mês ainda está no começo — sem semanas encerradas para comparar.' : 'O ano ainda está no começo — sem meses encerrados para comparar.');
  } else {
    partes.push(`A agenda ficou cheia em ${mensal ? 'todas as semanas encerradas deste mês' : 'todos os meses encerrados deste ano'}.`);
  }
  // Disponibilidade futura é uma frase À PARTE, explicitamente rotulada —
  // nunca dentro do ranking histórico acima.
  if (atualSeg && atualSeg.livre >= INS_MIN_HORAS_LIVRES) {
    partes.push(`${esc(atualSeg.labelCompleto)} ainda tem ${atualSeg.livre}h disponíveis.`);
  }
  const leitura = partes.join(' ');

  const tiles = linha.map(c => `<div class="ins-space-tile ${insMapStep(c.livre, c.cap)}${c.status === 'futuro' ? ' is-futuro' : ''}${c.status === 'atual' ? ' is-atual' : ''}"><span class="ist-lbl">${esc(c.label)}</span><span class="ist-val">${c.livre}h</span></div>`).join('');
  const html = `
    <div class="${mensal ? 'ins-space-row' : 'ins-space-grid'}">${tiles}</div>
    <p class="ins-map-legend">${mensal ? 'Semanas futuras' : 'Meses futuros'} aparecem esmaecidos · o atual tem contorno · quanto mais escuro, mais espaço</p>`;
  return { temEspaco: true, leitura, html };
}

// Só para a Sugestão de espaço: sempre olha ~30 dias PRA FRENTE,
// independente do timeframe selecionado — igual à Sugestão de agenda
// (regra 1), que também ignora P.kind. "Ofereça X" só faz sentido para
// um horário que ainda não aconteceu; o bloco de exibição acima é quem
// pode (e deve) mostrar o passado.
function insSugestaoEspaco(P) {
  const agora = new Date();
  const fim = new Date(Math.min(P.atual.end.getTime(), agora.getTime() + 30 * 86400000));
  const hojeMeiaNoite = new Date(agora); hojeMeiaNoite.setHours(0, 0, 0, 0);
  const dias = insOpenDays(hojeMeiaNoite, fim);
  if (!dias.length) return null;
  const m = insDayFaixaMatrix(dias);
  let melhor = null;
  m.celulas.forEach((linha, fi) => linha.forEach(c => {
    const fimFaixa = new Date(c.data);
    const fx = m.faixas[fi];
    fimFaixa.setHours(Math.floor(fx.fim), (fx.fim % 1) * 60, 0, 0);
    if (fimFaixa <= agora) return; // faixa de hoje já encerrada
    if (!melhor || c.livre > melhor.livre) melhor = { ...c, faixaNome: fx.nome };
  }));
  return melhor;
}

// ══════════════════════════════════════════════════════════════
// MOTOR DE SUGESTÕES E DE CONSIDERAÇÕES
//
// Nada é armazenado: candidatos → elegibilidade (amostra mínima) →
// impacto estimado → as 3 melhores. Determinístico: os mesmos dados
// produzem sempre a mesma lista. Um agendamento novo pode derrubar
// uma sugestão, e é isso que se espera.
//
// "Considerações" aponta um problema ou desvio já ocorrido.
// "Sugestão" recomenda uma próxima ação. Os dois não se misturam.
// ══════════════════════════════════════════════════════════════

// Intervalo habitual de cada cliente e há quanto tempo ela não vem.
// Só entra quem tem histórico suficiente pra ter um "habitual".
function insClientesAtrasadas() {
  const agora = Date.now();
  const porCliente = new Map();
  state.appointments.forEach(a => {
    if (!a.client || !a.client.id) return;
    if (new Date(a.starts_at) > agora) return;
    if (!porCliente.has(a.client.id)) porCliente.set(a.client.id, { id: a.client.id, nome: a.client.name || 'Cliente', datas: [], receita: 0 });
    const r = porCliente.get(a.client.id);
    r.datas.push(new Date(a.starts_at).getTime());
    r.receita += appointmentRevenue(a);
  });
  const futuros = new Set(state.appointments
    .filter(a => new Date(a.starts_at) > agora && a.client && a.client.id)
    .map(a => a.client.id));

  const out = [];
  porCliente.forEach((r, id) => {
    if (r.datas.length < INS_MIN_VISITAS_CLIENTE) return;
    if (futuros.has(id)) return; // já tem retorno marcado: não está sumida
    r.datas.sort((a, b) => a - b);
    let soma = 0;
    for (let i = 1; i < r.datas.length; i++) soma += r.datas[i] - r.datas[i - 1];
    const intervalo = soma / (r.datas.length - 1);
    const desde = agora - r.datas[r.datas.length - 1];
    if (intervalo > 0 && desde > intervalo * INS_ATRASO_FATOR) {
      out.push({
        id, nome: r.nome, receita: r.receita,
        semanas: Math.floor(desde / 604800000),
        intervaloSemanas: Math.max(1, Math.round(intervalo / 604800000)),
      });
    }
  });
  return out.sort((a, b) => b.receita - a.receita);
}

// R4.1 — "N clientes passaram do intervalo" era uma fotografia GLOBAL
// (quem está atrasada agora), idêntica em Semana/Mês/Ano — o mesmo número
// não pode significar três perguntas diferentes. Esta versão só conta
// quem CRUZOU o limite (última visita + intervalo habitual × fator)
// DENTRO da janela pedida — "ficou atrasada NESTA semana/mês", não "está
// atrasada agora". Usada só em Considerações; a Sugestão "Ligue para..."
// continua com o snapshot global (ver insClientesAtrasadas) porque uma
// ação é sempre sobre agora, não sobre uma janela de relatório.
function insClientesForaCadenciaNaJanela(de, ate) {
  const agora = Date.now();
  const porCliente = new Map();
  state.appointments.forEach(a => {
    if (!a.client || !a.client.id) return;
    if (new Date(a.starts_at) > agora) return;
    if (!porCliente.has(a.client.id)) porCliente.set(a.client.id, { id: a.client.id, nome: a.client.name || 'Cliente', datas: [] });
    porCliente.get(a.client.id).datas.push(new Date(a.starts_at).getTime());
  });
  const futuros = new Set(state.appointments
    .filter(a => new Date(a.starts_at) > agora && a.client && a.client.id)
    .map(a => a.client.id));

  const out = [];
  porCliente.forEach((r, id) => {
    if (r.datas.length < INS_MIN_VISITAS_CLIENTE) return;
    if (futuros.has(id)) return;
    r.datas.sort((a, b) => a - b);
    let soma = 0;
    for (let i = 1; i < r.datas.length; i++) soma += r.datas[i] - r.datas[i - 1];
    const intervalo = soma / (r.datas.length - 1);
    if (intervalo <= 0) return;
    const ultima = r.datas[r.datas.length - 1];
    const vencimento = ultima + intervalo * INS_ATRASO_FATOR;
    if (vencimento >= de.getTime() && vencimento < ate.getTime() && agora >= vencimento) {
      out.push({ id, nome: r.nome, intervaloSemanas: Math.max(1, Math.round(intervalo / 604800000)) });
    }
  });
  return out;
}

// R4.1 — Ano não pode repetir uma fotografia ("N atrasadas agora") como se
// fosse uma leitura anual: uma fotografia de hoje não é insight sobre o
// ano inteiro. Em vez disso, mede se o RITMO de retorno das clientes
// recorrentes desacelerou — compara o intervalo mais recente de cada uma
// (a última visita precisa estar dentro do ano selecionado) contra a
// PRÓPRIA média histórica dela. Só entra com amostra mínima; sem isso, é
// "presunçoso" (doc 01 §7) e a tela fica calada.
function insRitmoRetornoAno(P) {
  const porCliente = new Map();
  state.appointments.forEach(a => {
    if (!a.client || !a.client.id) return;
    if (new Date(a.starts_at) > Date.now()) return;
    if (!porCliente.has(a.client.id)) porCliente.set(a.client.id, []);
    porCliente.get(a.client.id).push(new Date(a.starts_at).getTime());
  });
  let piorou = 0, total = 0;
  porCliente.forEach(datas => {
    if (datas.length < INS_MIN_VISITAS_CLIENTE + 1) return; // precisa de histórico ANTES do último intervalo
    datas.sort((a, b) => a - b);
    const ultima = datas[datas.length - 1];
    if (ultima < P.atual.start.getTime() || ultima >= P.atual.cut.getTime()) return;
    const penultima = datas[datas.length - 2];
    const gapRecente = ultima - penultima;
    const historicos = datas.slice(0, -1);
    let soma = 0;
    for (let i = 1; i < historicos.length; i++) soma += historicos[i] - historicos[i - 1];
    const mediaHistorica = soma / (historicos.length - 1);
    if (mediaHistorica <= 0) return;
    total++;
    if (gapRecente > mediaHistorica * 1.3) piorou++;
  });
  if (total < INS_MIN_CLIENTES_RITMO_ANO) return null;
  return { pct: Math.round((piorou / total) * 100), total };
}

// Média de atendimentos por semana fechada, e o que já está marcado
// para a próxima. Base do "abra N horários".
function insProximaSemana() {
  const agora = new Date();
  const inicioAtual = startOfWeekMonday(agora);
  const semanas = [];
  for (let i = INS_MIN_SEMANAS_MEDIA + 3; i >= 1; i--) {
    const s = new Date(inicioAtual); s.setDate(s.getDate() - 7 * i);
    const e = new Date(s); e.setDate(e.getDate() + 7);
    semanas.push(insApptsBetween(s, e).length);
  }
  const comMovimento = semanas.filter(n => n > 0);
  if (comMovimento.length < INS_MIN_SEMANAS_MEDIA) return null;
  const media = Math.round(comMovimento.reduce((a, b) => a + b, 0) / comMovimento.length);
  const prox = new Date(inicioAtual); prox.setDate(prox.getDate() + 7);
  const fimProx = new Date(prox); fimProx.setDate(fimProx.getDate() + 7);
  const marcados = insApptsBetween(prox, fimProx).length;
  return { media, marcados, faltam: Math.max(0, media - marcados), inicio: prox };
}

// ══════════════════════════════════════════════════════════════
// MODELO DE CANDIDATO (R4.2) — Considerações e Sugestões compartilham a
// mesma forma, o que permite um único mecanismo de seleção pros dois:
//   categoria   assunto (deduplica: só 1 categoria por vez no top 3)
//   valencia    'positive' | 'negative' | 'neutral' — só Considerações
//   sinal       sourceSignal, código curto e estável, pra auditoria
//   timeframe   P.kind no momento em que o candidato foi gerado
//   confianca   0–1, derivado de "quão longe do piso mínimo" o sinal está
//   peso        relevância bruta (Considerações) — usada pra ordenar
//   impacto     € estimado (Sugestões) — usada pra ordenar; 0 quando
//               não há como estimar em euro
// ══════════════════════════════════════════════════════════════

// Converte "quanto passou do piso de amostra" em confiança 0–1, sem
// fingir precisão: exatamente no piso = 0.5, no dobro do piso ou mais = 1.
function insConfianca(valor, piso) {
  if (!piso) return 1;
  return Math.max(0, Math.min(1, 0.5 + (valor - piso) / (piso * 2)));
}

// Seleciona até 3 candidatos por: relevância (campo) → diversidade de
// assunto (uma categoria por vez) → em Considerações, tenta incluir ao
// menos 1 positivo SE existir um genuinamente relevante — nunca troca por
// um positivo fraco só pra equilibrar o tom (R4.2 §5: "o sistema não é
// motivacional, é analítico"). Compartilhado por Considerações e
// Sugestões — não existe um segundo motor.
function insSelecionarTop3(candidatos, campo, comValencia) {
  const elegiveis = candidatos.filter(Boolean).sort((a, b) => b[campo] - a[campo]);
  const escolhidos = [];
  const usadas = new Set();
  for (const c of elegiveis) {
    if (escolhidos.length >= 3) break;
    if (usadas.has(c.categoria)) continue;
    usadas.add(c.categoria);
    escolhidos.push(c);
  }
  // Sobrou vaga e não há mais assunto novo elegível: melhor um ângulo
  // repetido do que um card a menos.
  for (const c of elegiveis) {
    if (escolhidos.length >= 3) break;
    if (!escolhidos.includes(c)) escolhidos.push(c);
  }
  if (comValencia) {
    const temPositivo = escolhidos.some(c => c.valencia === 'positive');
    if (!temPositivo) {
      const melhorPositivo = elegiveis.find(c => c.valencia === 'positive' && !escolhidos.includes(c));
      if (melhorPositivo && escolhidos.length) {
        let piorIdx = 0;
        escolhidos.forEach((c, i) => { if (c[campo] < escolhidos[piorIdx][campo]) piorIdx = i; });
        // Só troca se o positivo for genuinamente relevante perto do que
        // ele substitui — sem isso seria fabricar boa notícia.
        if (melhorPositivo[campo] >= escolhidos[piorIdx][campo] * 0.4) escolhidos[piorIdx] = melhorPositivo;
      }
    }
  }
  return escolhidos.sort((a, b) => b[campo] - a[campo]);
}

// ══════════════════════════════════════════════════════════════
// CONSIDERAÇÕES — "fatos relevantes sobre o negócio no timeframe
// selecionado que valem a atenção da usuária." R4.2: deixou de ser uma
// lista de más notícias. Procura sinais positivos e fatos neutros com o
// mesmo rigor que procura problemas — nunca fabrica positividade, nunca
// esconde um problema real, e só fala com amostra suficiente.
// ══════════════════════════════════════════════════════════════
function insBuildAtencao(P) {
  const cand = [];
  const push = c => { if (c) cand.push({ ...c, timeframe: P.kind }); };

  // Receita, ocupação, gasto médio, clientes novas — os quatro comparam
  // SEMPRE P contra o mesmo ponto do período anterior, então já são
  // timeframe-aware por construção. Cada um vira consideração positiva
  // OU negativa, nunca as duas ao mesmo tempo.
  const metricas = [
    { d: insDelta(P.receita, P.antReceita, 'pct'), categoria: 'receita', sinal: 'receita', piso: 10,
      icone: ICONS.trendUp, iconeNeg: ICONS.trendDown,
      up: v => `A receita cresceu ${v} em relação ${P.labels.rel}`,
      down: v => `A receita caiu ${v} em relação ${P.labels.rel}`,
      ev: () => `${formatCurrency(P.receita)} contra ${formatCurrency(P.antReceita)}` },
    { d: insDelta(P.ocup, P.antOcup, 'pp'), categoria: 'ocupacao', sinal: 'ocupacao', piso: 5,
      icone: ICONS.target, iconeNeg: ICONS.target,
      up: v => `A ocupação melhorou ${v}`,
      down: v => `A ocupação caiu ${v}`,
      ev: () => `${P.ocup}% agora, contra ${P.antOcup}% ${P.labels.vs}` },
    { d: insDelta(P.ticket, P.antTicket, 'pct'), categoria: 'gasto_medio', sinal: 'gasto_medio', piso: 10,
      icone: ICONS.money, iconeNeg: ICONS.money,
      up: v => `O gasto médio subiu ${v}`,
      down: v => `O gasto médio caiu ${v}`,
      ev: () => `${formatCurrency(P.ticket)} contra ${formatCurrency(P.antTicket)} ${P.labels.vs}` },
    { d: insDelta(P.novas, P.antNovas, 'abs'), categoria: 'clientes_novas', sinal: 'clientes_novas', piso: 2,
      icone: ICONS.userPlus, iconeNeg: ICONS.userPlus,
      up: v => `Clientes novas aumentaram — mais ${v} que ${P.labels.vs}`,
      down: v => `Clientes novas caíram — menos ${v} que ${P.labels.vs}`,
      ev: () => `${P.novas} novas neste período, contra ${P.antNovas} ${P.labels.vs}` },
  ];
  metricas.forEach(m => {
    if (!m.d || !P.suficiente) return;
    const mag = parseFloat(m.d.text);
    if (m.d.dir === 'up' && mag >= m.piso) {
      push({ categoria: m.categoria, valencia: 'positive', sinal: m.sinal + '_alta', peso: mag,
        confianca: insConfianca(mag, m.piso), icone: m.icone, titulo: m.up(m.d.text), evidencia: m.ev() });
    } else if (m.d.dir === 'down' && mag >= m.piso) {
      push({ categoria: m.categoria, valencia: 'negative', sinal: m.sinal + '_queda', peso: mag,
        confianca: insConfianca(mag, m.piso), icone: m.iconeNeg, titulo: m.down(m.d.text), evidencia: m.ev() });
    }
  });

  // Serviço em queda / em crescimento — mesmo cruzamento de dados, duas
  // direções possíveis. O piso de amostra já escala por timeframe.
  const atuais = insServicos(P.realizados);
  const antesServ = insServicos(P.antRealizados);
  const pisoServico = insMinQuedaServico(P.kind);
  atuais.concat(antesServ.filter(a => !atuais.some(b => b.nome === a.nome)).map(a => ({ ...a, qtd: 0, receita: 0 })))
    .forEach(s => {
      const ant = antesServ.find(a => a.nome === s.nome);
      if (!ant || ant.qtd < pisoServico) return;
      const variacao = Math.round(((s.qtd - ant.qtd) / ant.qtd) * 100);
      if (variacao <= -25) {
        push({ categoria: 'servico_' + s.nome, valencia: 'negative', sinal: 'servico_demand_decline',
          peso: Math.abs(variacao), confianca: insConfianca(Math.abs(variacao), 25), icone: ICONS.trendDown,
          titulo: `${s.nome} caiu ${Math.abs(variacao)}% em relação ${P.labels.rel}`,
          evidencia: `${s.qtd} atendimento${s.qtd === 1 ? '' : 's'} · eram ${ant.qtd}` });
      } else if (variacao >= 25) {
        push({ categoria: 'servico_' + s.nome, valencia: 'positive', sinal: 'servico_demand_growth',
          peso: variacao, confianca: insConfianca(variacao, 25), icone: ICONS.trendUp,
          titulo: `${s.nome} cresceu ${variacao}% em relação ${P.labels.rel}`,
          evidencia: `${s.qtd} atendimentos · eram ${ant.qtd}` });
      }
    });

  // Clientes fora da cadência — só existe versão negativa: "voltou mais
  // rápido que o habitual" não muda nenhuma decisão, não vale inventar
  // simetria onde não há utilidade real. Semana/Mês contam quem CRUZOU o
  // limite dentro da janela; Ano troca a fotografia por leitura estrutural.
  if (P.kind === 'ano') {
    const ritmo = insRitmoRetornoAno(P);
    if (ritmo && ritmo.pct >= 25) {
      push({ categoria: 'retencao', valencia: 'negative', sinal: 'retorno_desacelerou', peso: ritmo.pct,
        confianca: insConfianca(ritmo.pct, 25), icone: ICONS.users,
        titulo: `${ritmo.pct}% das clientes recorrentes demoraram mais para voltar este ano`,
        evidencia: `Comparado ao intervalo habitual de cada uma · ${ritmo.total} clientes analisadas` });
    }
  } else {
    const foraCadencia = insClientesForaCadenciaNaJanela(P.atual.start, P.atual.cut);
    const piso = P.kind === 'semana' ? 2 : 3;
    if (foraCadencia.length >= piso) {
      push({ categoria: 'retencao', valencia: 'negative', sinal: 'clientes_fora_cadencia',
        peso: foraCadencia.length * 3, confianca: insConfianca(foraCadencia.length, piso), icone: ICONS.users,
        titulo: `${foraCadencia.length} cliente${foraCadencia.length === 1 ? '' : 's'} passou${foraCadencia.length === 1 ? '' : 'ram'} do intervalo habitual ${P.kind === 'semana' ? 'nesta semana' : 'neste mês'}`,
        evidencia: `Cada uma vinha, em média, a cada ${foraCadencia[0].intervaloSemanas} semanas` });
    }
  }

  // Neutros — fatos notáveis, sem sinal de bom ou ruim. Só entram com
  // amostra do período inteira (P.suficiente).
  if (P.suficiente) {
    const faixas = insFaixas();
    const porFaixa = faixas.map(() => 0);
    P.realizados.forEach(a => {
      const h = new Date(a.starts_at).getHours() + new Date(a.starts_at).getMinutes() / 60;
      const idx = faixas.findIndex(fx => h >= fx.ini && h < fx.fim);
      if (idx >= 0) porFaixa[idx]++;
    });
    const totalFaixado = porFaixa.reduce((a, b) => a + b, 0);
    if (totalFaixado) {
      let maxIdx = 0;
      porFaixa.forEach((v, i) => { if (v > porFaixa[maxIdx]) maxIdx = i; });
      const pct = Math.round((porFaixa[maxIdx] / totalFaixado) * 100);
      // Com 3 faixas, uniforme seria ~33% cada — 45% já é concentração real.
      if (pct >= 45) {
        const nomeFaixa = faixas[maxIdx].nome;
        push({ categoria: 'concentracao_horario', valencia: 'neutral', sinal: 'concentracao_faixa',
          peso: pct * 0.6, confianca: insConfianca(pct, 45), icone: ICONS.clock,
          titulo: nomeFaixa === 'Manhã' ? 'As manhãs concentram boa parte da demanda' : `${nomeFaixa} concentra boa parte da demanda`,
          evidencia: `${pct}% dos atendimentos do período caem nessa faixa` });
      }
    }

    const svcTop = insServicos(P.realizados)[0];
    if (svcTop && P.realizados.length >= INS_MIN_SERVICO) {
      const pct = Math.round((svcTop.qtd / P.realizados.length) * 100);
      if (pct >= 40) {
        push({ categoria: 'servico_' + svcTop.nome, valencia: 'neutral', sinal: 'concentracao_servico',
          peso: pct * 0.5, confianca: insConfianca(pct, 40), icone: ICONS.tag,
          titulo: `${svcTop.nome} concentra boa parte do seu mix`,
          evidencia: `${pct}% dos atendimentos do período` });
      }
    }

    const canaisAgora = insCanais(P.realizados);
    const naoManual = canaisAgora.find(c => c.key !== 'manual');
    if (naoManual && naoManual.pct >= 25) {
      push({ categoria: 'canal', valencia: 'neutral', sinal: 'canal_relevante',
        peso: naoManual.pct * 0.5, confianca: insConfianca(naoManual.pct, 25), icone: ICONS.bolt,
        titulo: `${naoManual.label} já responde por parte real das suas entradas`,
        evidencia: `${naoManual.pct}% dos atendimentos do período vieram por ali` });
    }
  }

  return insSelecionarTop3(cand, 'peso', true);
}

// ══════════════════════════════════════════════════════════════
// SUGESTÕES — "o que faz sentido considerar/fazer A PARTIR do que este
// timeframe revelou?" R4.2: deixou de ser global. Muda de NATUREZA por
// timeframe, não só de número — Semana é operacional/imediata, Mês é
// tática, Ano é estratégica. Nenhuma família aparece fora do nível dela.
// ══════════════════════════════════════════════════════════════
function insBuildSugestoes(P) {
  if (P.kind === 'semana') return insSugestoesSemana(P);
  if (P.kind === 'mes') return insSugestoesMes(P);
  return insSugestoesAno(P);
}

function insReceitaHora(P) {
  const min = P.realizados.reduce((s, a) => s + insApptMinutes(a), 0);
  return min > 0 ? P.receita / (min / 60) : null;
}

// SEMANA · operacional — "o que eu faço agora ou nos próximos dias?"
// As três famílias de sempre (agenda, clientes, espaço): CTA aceitável
// porque a ação é sobre agora, que é exatamente a pergunta da Semana.
function insSugestoesSemana(P) {
  const cand = [];
  const push = c => { if (c) cand.push({ ...c, timeframe: 'semana' }); };
  const receitaHora = insReceitaHora(P);

  const prox = insProximaSemana();
  if (prox && prox.faltam > 0 && P.ticket) {
    const impacto = prox.faltam * P.ticket;
    push({ categoria: 'agenda', sinal: 'semana_abaixo_da_media', impacto,
      confianca: insConfianca(prox.faltam, 1), icone: ICONS.calendar,
      titulo: `Abra ${prox.faltam} horário${prox.faltam === 1 ? '' : 's'} na próxima semana`,
      evidencia: `Ela tem ${prox.marcados} atendimento${prox.marcados === 1 ? '' : 's'} · sua média é ${prox.media}`,
      impactoTexto: `Potencial estimado: +${formatCurrency(impacto)}`,
      acao: 'Abrir agenda', destino: { tipo: 'agenda', data: prox.inicio } });
  }

  const atrasadas = insClientesAtrasadas();
  if (atrasadas.length) {
    const top = atrasadas.slice(0, 2);
    const nomes = top.map(c => c.nome.split(' ')[0]).join(' e ');
    const impacto = atrasadas.slice(0, 4).reduce((s, c) => s + (P.ticket || 0), 0);
    const titulo = atrasadas.length <= 2 ? `Ligue para ${nomes}` : `Ligue para ${atrasadas.length} clientes que não voltaram`;
    push({ categoria: 'clientes', sinal: 'clientes_atrasadas_agora', impacto,
      confianca: insConfianca(atrasadas.length, 1), icone: ICONS.phone, titulo,
      evidencia: `Passaram mais tempo que o padrão delas sem voltar — ${top[0].semanas} semanas, contra as ${top[0].intervaloSemanas} habituais`,
      impactoTexto: P.ticket ? `Potencial estimado: +${formatCurrency(impacto)}` : '',
      acao: 'Ver clientes',
      destino: { tipo: 'clientes', ids: atrasadas.map(c => c.id), label: `${atrasadas.length} cliente${atrasadas.length === 1 ? '' : 's'} que ${atrasadas.length === 1 ? 'passou' : 'passaram'} do intervalo habitual` } });
  }

  const melhor = insSugestaoEspaco(P);
  if (melhor && melhor.livre >= INS_MIN_HORAS_LIVRES && P.suficiente) {
    const nomeFaixa = melhor.faixaNome.toLowerCase();
    const nomeDia = INS_DIA_NOME[melhor.dia];
    const impacto = receitaHora ? melhor.livre * receitaHora : 0;
    push({ categoria: 'espaco', sinal: 'vazio_proximos_dias', impacto,
      confianca: insConfianca(melhor.livre, INS_MIN_HORAS_LIVRES), icone: ICONS.clock,
      titulo: `Ofereça ${nomeFaixa === 'manhã' ? 'a manhã' : 'o ' + nomeFaixa} de ${nomeDia}`,
      evidencia: `É o seu maior vazio nos próximos dias — ${melhor.livre}h livres`,
      impactoTexto: impacto ? `Potencial estimado: +${formatCurrency(impacto)}` : '',
      acao: 'Abrir agenda', destino: { tipo: 'agenda', data: melhor.data } });
  }

  return insSelecionarTop3(cand, 'impacto', false);
}

// MÊS · tático — "o que os padrões deste mês sugerem que eu deveria
// ajustar?" Nunca reutiliza os cards da Semana. Sem CTA — são hipóteses
// operacionais/táticas, não têm destino no produto, e não fingimos que têm.
function insSugestoesMes(P) {
  const cand = [];
  const push = c => { if (c) cand.push({ ...c, timeframe: 'mes' }); };
  if (!P.suficiente) return [];

  const servicos = insServicos(P.realizados).filter(s => s.qtd >= INS_MIN_SERVICO && s.hora);

  // A · bom €/h e baixa participação — oportunidade de complemento.
  if (servicos.length >= 2) {
    const porHora = servicos.slice().sort((a, b) => b.hora - a.hora);
    const campeaoHora = porHora[0];
    const maisVendido = servicos.slice().sort((a, b) => b.qtd - a.qtd)[0];
    const participacao = campeaoHora.qtd / P.realizados.length;
    if (campeaoHora.nome !== maisVendido.nome && participacao <= 0.15 && campeaoHora.hora >= maisVendido.hora * 1.3) {
      push({ categoria: 'servico_' + campeaoHora.nome, sinal: 'servico_oportunidade', impacto: campeaoHora.hora * 3,
        confianca: insConfianca(campeaoHora.hora / maisVendido.hora, 1.3), icone: ICONS.drop,
        titulo: `Teste ${campeaoHora.nome} como complemento`,
        evidencia: `Rende ${formatCurrency(campeaoHora.hora)}/h, mas aparece em ${Math.round(participacao * 100)}% dos atendimentos`,
        impactoTexto: `Pode funcionar bem junto de ${maisVendido.nome}.`,
        acao: '', destino: null });
    }
  }

  // B · dia da semana concentrando muita ocupação — proteger.
  const porDia = {};
  P.realizados.forEach(a => {
    const d = new Date(a.starts_at).getDay();
    porDia[d] = (porDia[d] || 0) + insApptMinutes(a);
  });
  const minutosTotal = Object.values(porDia).reduce((a, b) => a + b, 0);
  if (minutosTotal > 0) {
    let diaTop = null;
    Object.entries(porDia).forEach(([d, min]) => { if (!diaTop || min > diaTop.min) diaTop = { dia: Number(d), min }; });
    const pct = Math.round((diaTop.min / minutosTotal) * 100);
    if (pct >= 30) {
      push({ categoria: 'dia_' + diaTop.dia, sinal: 'concentracao_dia_mes', impacto: pct * (P.ticket || 20),
        confianca: insConfianca(pct, 30), icone: ICONS.calendar,
        titulo: `Proteja suas ${INS_DIA_NOME[diaTop.dia]}s`,
        evidencia: `Concentraram ${pct}% da ocupação do mês`,
        impactoTexto: 'Evite cancelamentos ou remarcações nesse dia — é onde seu mês mais rende.',
        acao: '', destino: null });
    }
  }

  // C · serviço em queda mas valioso — vale entender antes de deixar cair.
  const antesMes = insServicos(P.antRealizados);
  const emQueda = insServicos(P.realizados).find(s => {
    const ant = antesMes.find(a => a.nome === s.nome);
    return ant && ant.qtd >= insMinQuedaServico('mes') && s.hora && ((s.qtd - ant.qtd) / ant.qtd) <= -0.25;
  });
  if (emQueda) {
    const ant = antesMes.find(a => a.nome === emQueda.nome);
    const queda = Math.round(((ant.qtd - emQueda.qtd) / ant.qtd) * 100);
    push({ categoria: 'servico_' + emQueda.nome, sinal: 'servico_queda_valiosa', impacto: emQueda.hora * emQueda.qtd,
      confianca: insConfianca(queda, 25), icone: ICONS.flask,
      titulo: `Trabalhe a procura de ${emQueda.nome}`,
      evidencia: `Demanda caiu ${queda}% neste mês, apesar de render ${formatCurrency(emQueda.hora)}/h`,
      impactoTexto: 'Vale entender o porquê antes de assumir que é só sazonal.',
      acao: '', destino: null });
  }

  return insSelecionarTop3(cand, 'impacto', false);
}

// ANO · estratégico — "o que os dados acumulados sugerem como decisão
// estrutural?" Proibido aqui: tarefa de amanhã, buraco específico de um
// dia, fotografia atual de clientes atrasadas. Hipótese, nunca promessa.
function insSugestoesAno(P) {
  const cand = [];
  const push = c => { if (c) cand.push({ ...c, timeframe: 'ano' }); };
  if (!P.suficiente) return [];

  const servicos = insServicos(P.realizados).filter(s => s.qtd >= INS_MIN_SERVICO && s.hora);

  // A · o líder de receita não é o líder de €/h — revisar o papel dele no mix.
  if (servicos.length >= 2) {
    const liderReceita = servicos.slice().sort((a, b) => b.receita - a.receita)[0];
    const liderHora = servicos.slice().sort((a, b) => b.hora - a.hora)[0];
    if (liderReceita.nome !== liderHora.nome && liderHora.hora >= liderReceita.hora * 1.3) {
      const participacao = Math.round((liderReceita.qtd / P.realizados.length) * 100);
      push({ categoria: 'servico_' + liderReceita.nome, sinal: 'mix_servico_vs_valor', impacto: liderReceita.receita * 0.08,
        confianca: insConfianca(liderHora.hora / liderReceita.hora, 1.3), icone: ICONS.tag,
        titulo: `Revise o papel de ${liderReceita.nome} no seu mix`,
        evidencia: `${participacao}% dos atendimentos e ${formatCurrency(liderReceita.receita)} de receita, mas ${formatCurrency(liderReceita.hora)}/h contra ${formatCurrency(liderHora.hora)}/h de ${liderHora.nome}`,
        impactoTexto: 'Não é sobre subir ou baixar preço — é sobre o que esse número já diz.',
        acao: '', destino: null });
    }
  }

  // B · canal de aquisição já relevante — decisão estrutural, não acidente.
  const canais = insCanais(P.realizados);
  const naoManual = canais.find(c => c.key !== 'manual' && c.pct >= 25);
  if (naoManual) {
    push({ categoria: 'canal', sinal: 'canal_estrutural', impacto: (P.receita * naoManual.pct / 100) * 0.05,
      confianca: insConfianca(naoManual.pct, 25), icone: ICONS.bolt,
      titulo: `${naoManual.label} já é parte estrutural da sua aquisição`,
      evidencia: `${naoManual.pct}% dos atendimentos do ano vieram por ali · ${naoManual.n} no total`,
      impactoTexto: 'Vale decidir se isso merece investimento deliberado, não só acontecer.',
      acao: '', destino: null });
  }

  // C · ritmo de retorno das recorrentes — piso mais brando que o da
  // Consideração equivalente (15% aqui, 25% lá): uma sugestão pode ser
  // mais especulativa que uma afirmação declarada.
  const ritmo = insRitmoRetornoAno(P);
  if (ritmo && ritmo.pct >= 15) {
    push({ categoria: 'retencao', sinal: 'retencao_estrutural', impacto: ritmo.pct * (P.ticket || 20) * 0.5,
      confianca: insConfianca(ritmo.pct, 15), icone: ICONS.users,
      titulo: 'Fortaleça o relacionamento com quem já é cliente',
      evidencia: `${ritmo.pct}% das clientes recorrentes espaçaram mais as visitas este ano · ${ritmo.total} analisadas`,
      impactoTexto: 'Reter custa menos que conquistar, e composta mais no longo prazo.',
      acao: '', destino: null });
  }

  return insSelecionarTop3(cand, 'impacto', false);
}

// ── Canais ────────────────────────────────────────────────────
// Só os canais que o banco REALMENTE grava. `appointments.source` tem
// um CHECK constraint que hoje libera 'online' | 'manual' | 'ai' |
// 'whatsapp' — auditado em 08/2026 (ver docs, item de atribuição do R4).
// 'whatsapp' passou a ser capturado de verdade pelo agendar.html;
// Instagram, Google e Website ainda não têm valor liberado no schema —
// entram em 'online' até a constraint mudar (não é inferência, é o
// mesmo "online" que a página já representava antes de existir tracker).
// Não são inferidos nem inventados. Ver "gaps de dados" na entrega.
const INS_CANAIS = [
  { key: 'online', label: 'Booking System', cor: 'var(--color-accent-600)' },
  { key: 'whatsapp', label: 'WhatsApp', cor: 'var(--color-success)' },
  { key: 'manual', label: 'Marcados por você', cor: 'var(--color-neutral-300)' },
];
function insCanais(list) {
  const cont = {};
  list.forEach(a => {
    const k = a.source === 'whatsapp' ? 'whatsapp' : (a.source === 'online' ? 'online' : 'manual');
    cont[k] = (cont[k] || 0) + 1;
  });
  const total = list.length;
  return INS_CANAIS.map(c => ({ ...c, n: cont[c.key] || 0, pct: total ? Math.round((cont[c.key] || 0) / total * 100) : 0 }))
    .filter(c => c.n > 0);
}
// Conversão da página: visitas e agendamentos contados na MESMA janela.
// Um total histórico contra um período parcial daria uma taxa falsa.
function insConversao(P) {
  const naJanela = iso => { const d = new Date(iso); return d >= P.atual.start && d < P.atual.cut; };
  const visitas = (state.bookingVisits || []).filter(v => naJanela(v.created_at)).length;
  // Conta o que foi MARCADO na janela, não o que aconteceu nela: uma visita
  // de hoje que gera um atendimento pra semana que vem é conversão de hoje.
  // Por isso este número pode divergir do "N pela página" da barra acima,
  // que é sobre atendimentos realizados — e a frase diz qual é qual.
  const agendamentos = state.appointments.filter(a =>
    (a.source === 'online' || a.source === 'whatsapp') && a.created_at && naJanela(a.created_at)).length;
  if (visitas < 10) return null; // amostra pequena demais pra virar taxa
  return { visitas, agendamentos, pct: Math.round((agendamentos / visitas) * 100) };
}

// renderInsights() é a entrada de aba: monta a barra de período (com a
// cápsula persistente) uma única vez e delega o miolo a insContentHtml().
// A troca Semana/Mês/Ano NÃO passa mais por aqui — ver insTransitionContent.
function renderInsights() {
  document.getElementById('greeting').textContent = 'Insights';
  const P = insComputePeriod(state.insightsPeriod);
  document.getElementById('greetingSub').textContent = P.labels.header;

  app.innerHTML = `

  const espaco = insSpaceBlock(P);
  const canais = insCanais(P.realizados);
  const conv = insConversao(P);
  const totalCanal = canais.reduce((s, c) => s + c.n, 0);

  const dReceita = insDelta(P.receita, P.antReceita, 'pct');

  return `
    <section class="ins-answer" aria-label="Receita realizada">
      <p class="ins-eyebrow">${esc(P.labels.eyebrow)}</p>
      <div class="ins-answer-row">
        <span class="ins-answer-value">${formatCurrency(P.receita)}</span>
        <span class="ins-answer-word">realizados</span>
        ${dReceita ? `<span class="ins-delta is-${dReceita.dir}">${dReceita.dir === 'up' ? '↑' : '↓'} ${dReceita.text}</span>` : ''}
      </div>
      ${dReceita ? `<p class="ins-answer-vs">${formatCurrency(P.antReceita)} ${esc(P.labels.vs)}</p>` : ''}
      ${P.agendado > 0 ? `
        <div class="ins-answer-ahead">

        <div class="ins-alert">
          <span class="ins-alert-ic" aria-hidden="true">${a.icone}</span>
          <span class="ins-alert-body">

            <span class="ins-alert-sub">${esc(a.evidencia)}</span>
          </span>
        </div>`).join('')}
      </div>
    </section>` : ''}

    ${sugestoes.length ? `
    <section class="ins-floor">
      <h2 class="ins-title">Sugestões</h2>

        ${sugestoes.length > 1 ? `<span class="ins-rail-hint" id="insRailHint" aria-hidden="true">${ICONS.chevron}</span>` : ''}
      </div>
      ${sugestoes.length > 1 ? `<div class="ins-dots" id="insDots" aria-hidden="true">${sugestoes.map((_, i) => `<i class="${i ? '' : 'is-on'}"></i>`).join('')}</div>` : ''}
    </section>` : ''}

    <section class="ins-floor">

      <div class="ins-kpis">
        ${kpis.map((k, i) => `
          <div class="ins-kpi">
            <div class="ins-kpi-lbl">${k.l}${k.help ? ` <button type="button" class="ins-kpi-help" data-help-label="${esc(k.l)}" data-help-text="${esc(k.help)}" aria-label="O que é ${esc(k.l)}">?</button>` : ''}</div>
            <div class="ins-kpi-row">
              <span class="ins-kpi-val">${k.v}</span>

    </section>

    <section class="ins-floor">
      <h2 class="ins-title">Tendência</h2>
      ${temSerie ? `

          icon: ICONS.users, compact: true,
