function insEmCursoLabel(kind) {
  if (kind === 'semana') return 'Esta semana';
  if (kind === 'mes') return 'Este mês';
  return 'Este ano';
}
const WEEKDAY_LABELS_3 = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

function insServicosLeitura(servicos) {
  const comHora = servicos.filter(s => s.hora !== null && s.qtd >= INS_MIN_SERVICO);
  if (comHora.length < 2) return '';
  const porHora = comHora.slice().sort((a, b) => b.hora - a.hora);
  const campeao = porHora[0], maisVendido = comHora[0];
  if (campeao.nome === maisVendido.nome) return '';
  return `<p class="ins-read"><em>${esc(campeao.nome)}</em> rende ${formatCurrency(campeao.hora)} por hora de cadeira — ${esc(maisVendido.nome.toLowerCase())} rende ${formatCurrency(maisVendido.hora)}.</p>`;
}

// ── Ajuda dos indicadores ───────────────────────────────────────
// R4.1: o ConfirmationDialog (.o-dialog-*) é uma FOLHA que sobe do rodapé
// em largura cheia — pesado demais pra uma frase. Reconstruído aqui como
// micro-diálogo centralizado, no mesmo espírito do `.month-cal-card` que
// já existe na Agenda (mesmo raio, mesma sombra — `--elevation-overlay`
// é literalmente o valor que aquele componente já usava, só que agora
// como token). Continua reutilizando `orenziUI.trapFocus` — é o único
// pedaço genuinamente compartilhável entre os dois padrões de diálogo.
// "?" de 18px sem foco/Esc/área de toque nunca volta: alvo do fechar é
// 44px via largura/altura reais (não extensão invisível, cabe folgado).
function insShowHelp(titulo, texto, trigger) {
  const overlay = document.createElement('div');
  overlay.className = 'ins-help-overlay';
  overlay.innerHTML = `
    <div class="ins-help-card" role="dialog" aria-modal="true" aria-labelledby="insHelpTitle" aria-describedby="insHelpMsg">
      <button type="button" class="ins-help-close" aria-label="Fechar">${ICONS.close}</button>
      <p class="ins-help-title" id="insHelpTitle">${esc(titulo)}</p>
      <p class="ins-help-text" id="insHelpMsg">${esc(texto)}</p>
    </div>`;
  document.body.appendChild(overlay);
  const card = overlay.querySelector('.ins-help-card');
  const closeBtn = overlay.querySelector('.ins-help-close');
  const release = orenziUI.trapFocus(card);

  let fechado = false;
  function fechar() {
    if (fechado) return;
    fechado = true;
    overlay.classList.remove('is-open');
    overlay.classList.add('is-closing');
    release();
    document.removeEventListener('keydown', onKey);
    let removido = false;
    const remove = () => {
      if (removido) return;
      removido = true;
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      if (trigger && document.contains(trigger)) trigger.focus();
    };
    overlay.addEventListener('transitionend', e => { if (e.target === overlay) remove(); });
    // Rede de segurança: aba em segundo plano nunca compõe frames, e o
    // transitionend correspondente não dispara — mesmo padrão do resto do app.
    setTimeout(remove, 260);
  }
  function onKey(e) { if (e.key === 'Escape') fechar(); }
  document.addEventListener('keydown', onKey);
  overlay.onclick = e => { if (e.target === overlay) fechar(); };
  closeBtn.onclick = fechar;

  requestAnimationFrame(() => requestAnimationFrame(() => overlay.classList.add('is-open')));
  closeBtn.focus();
}

// ── Ligações do conteúdo (Sugestões, gráfico, help) ─────────────
// Chamada tanto pela entrada de aba quanto pela troca de período —
// tudo aqui opera dentro de #insContent, nunca na barra de período.
function insRenderContentExtras(P) {
  animateFills(document.getElementById('insContent') || app);
  insBindRail(insBuildSugestoes(P));
  insBindHelp();
  insAnimateChart();
}

function insBindHelp() {
  document.querySelectorAll('.ins-kpi-help').forEach(btn => {
    btn.onclick = () => insShowHelp(btn.dataset.helpLabel, btn.dataset.helpText, btn);
  });
}

// ── Ligações ──────────────────────────────────────────────────
// A barra de período é montada só na entrada de aba (renderInsights) —
// os botões e a cápsula persistem como os MESMOS nós entre trocas de
// período, o que é o que permite a cápsula deslizar em vez de reaparecer.
function insBindPeriod() {
  document.querySelectorAll('#insPeriod button').forEach(b => {
    b.onclick = () => {
      const novo = b.dataset.period;
      if (novo === state.insightsPeriod) return;
      document.querySelectorAll('#insPeriod button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      insPositionPill(novo, true);
      insTransitionContent(novo);
    };
  });
}

// Posiciona a cápsula do segmented control. `animar=false` é usado só na
// entrada de aba (não pode animar a partir do nada) — no resto do tempo
// a transição CSS já cuida do deslize.
function insPositionPill(kind, animar) {
  const pill = document.getElementById('insPeriodPill');
  if (!pill) return;
  const i = INSIGHTS_PERIODS.findIndex(p => p.key === kind);
  if (!animar || prefersReducedMotion()) {
    pill.style.transition = 'none';
    pill.style.transform = `translateX(${i * 100}%)`;
    void pill.offsetHeight; // aplica antes de qualquer repaint, sem deixar a transição "vazar"
    pill.style.transition = '';
  } else {
    pill.style.transform = `translateX(${i * 100}%)`;
  }
}

// Troca de conteúdo sem blink: sai com fade+deslocamento mínimo, troca o
// HTML já pronto (o cálculo é local e síncrono — não há "carregando" pra
// esconder), entra do lado oposto. Direção segue a ordem Semana·Mês·Ano.
function insTransitionContent(novoPeriodo) {
  const idxAtual = INSIGHTS_PERIODS.findIndex(p => p.key === state.insightsPeriod);
  const idxNovo = INSIGHTS_PERIODS.findIndex(p => p.key === novoPeriodo);
  const dir = idxNovo > idxAtual ? 1 : -1;
  state.insightsPeriod = novoPeriodo;

  const P = insComputePeriod(novoPeriodo);
  document.getElementById('greetingSub').textContent = P.labels.header;
  const content = document.getElementById('insContent');

  if (!content || prefersReducedMotion()) {
    if (content) content.innerHTML = insContentHtml(P);
    insRenderContentExtras(P);
    return;
  }

  const AMPL = 8; // px — mínima, não é slide de apresentação
  let trocado = false;
  const trocar = () => {
    if (trocado) return;
    trocado = true;
    content.removeEventListener('transitionend', trocar);
    content.innerHTML = insContentHtml(P);
    content.style.transition = 'none';
    content.style.opacity = '0';
    content.style.transform = `translateX(${dir * AMPL}px)`;
    void content.offsetHeight;
    requestAnimationFrame(() => {
      content.style.transition = `opacity var(--motion-standard) var(--ease-standard), transform var(--motion-standard) var(--ease-standard)`;
      content.style.opacity = '1';
      content.style.transform = 'translateX(0)';
    });
    insRenderContentExtras(P);
  };
  content.style.transition = `opacity var(--motion-standard) var(--ease-standard), transform var(--motion-standard) var(--ease-standard)`;
  content.style.opacity = '0';
  content.style.transform = `translateX(${-dir * AMPL}px)`;
  content.addEventListener('transitionend', trocar);
  // Rede de segurança: aba em segundo plano nunca compõe frames, e o
  // transitionend correspondente não dispara — mesmo padrão do resto do app.
  setTimeout(trocar, 260);
}

// Carrossel: um card centralizado por vez.
//
// R4.1 — causa raiz do chevron ficar aceso pra sempre: duas falhas
// empilhadas.
//   1) O índice do card visível vinha de `scrollWidth / children.length`,
//      que ignora o `gap` entre cards — como o ÚLTIMO card não tem gap à
//      direita, essa média fica maior que o passo real entre pontos de
//      snap, e o arredondamento às vezes nunca alcançava "é o último".
//      Corrigido medindo o passo de verdade: largura do primeiro card + gap.
//   2) Mesmo com o índice certo, o código só escondia a ANIMAÇÃO (a classe
//      `is-teaching`) depois da primeira interação — a VISIBILIDADE
//      continuava sendo recalculada pela posição a cada scroll, pra
//      sempre. Ou seja, o chevron nunca se aposentava: ele podia voltar a
//      aparecer (parado) toda vez que a pessoa voltasse pro primeiro
//      card. O pedido aprovado é que ele seja uma pista de DESCOBERTA,
//      não um indicador permanente de "tem mais" — essa função já existe
//      e é dos pontinhos. Agora `state.insightsSugestoesEnsinado` aposenta
//      o chevron de vez (visibilidade incluída) assim que a animação
//      termina sozinha OU a pessoa interage (scroll ou toque no carrossel).
function insBindRail(sugestoes) {
  const rail = document.getElementById('insRail');
  const dots = document.getElementById('insDots');
  const hint = document.getElementById('insRailHint');
  if (rail) {
    rail.querySelectorAll('[data-sug]').forEach(btn => {
      btn.onclick = () => insDrill(sugestoes[Number(btn.dataset.sug)].destino);
    });
  }
  if (!rail) return;

  // Passo real entre pontos de snap: largura de um card + gap. Não usar
  // scrollWidth/children.length — o último card não tem gap à direita e
  // isso puxa a média pra cima, atrasando o índice calculado.
  function passo() {
    const primeiro = rail.children[0];
    if (!primeiro) return rail.clientWidth || 1;
    const cs = getComputedStyle(rail);
    const gap = parseFloat(cs.columnGap || cs.gap || '0') || 0;
    return primeiro.getBoundingClientRect().width + gap;
  }
  function indiceAtual() {
    const p = passo();
    return p ? Math.round(rail.scrollLeft / p) : 0;
  }
  function atualizarDots() {
    if (!dots) return;
    const i = indiceAtual();
    Array.from(dots.children).forEach((d, k) => d.classList.toggle('is-on', k === i));
  }
  // Visível só enquanto NÃO foi ensinado (independente de posição, uma vez
  // aposentado nunca mais volta) E existe próximo card a partir daqui.
  function atualizarHint() {
    if (!hint) return;
    if (state.insightsSugestoesEnsinado) { hint.classList.remove('is-visible', 'is-teaching'); return; }
    hint.classList.toggle('is-visible', indiceAtual() < rail.children.length - 1);
  }
  function ensinar() {
    if (state.insightsSugestoesEnsinado) return;
    state.insightsSugestoesEnsinado = true;
    if (hint) hint.classList.remove('is-visible', 'is-teaching');
  }

  atualizarDots();
  atualizarHint();

  // R4.2 — causa raiz da regressão (chevron nunca aparecia): os listeners
  // de scroll/toque eram anexados no MESMO tick da criação do DOM. Com
  // `scroll-snap-type: x mandatory`, o navegador pode disparar um evento
  // de "scroll" sintético assim que o carrossel entra em layout — ele
  // reassenta a posição de snap sem nenhum toque da pessoa. Esse scroll
  // fantasma caía no listener e chamava `ensinar()` antes da primeira
  // pintura, aposentando o chevron antes de qualquer usuária real vê-lo.
  // Correção: só passar a OUVIR interação depois que o layout inicial
  // assentou (dois quadros de folga — mesmo padrão de "espera o navegador
  // pintar" já usado em insAnimateChart/insShowHelp). O estado visual
  // inicial (atualizarDots/atualizarHint acima) continua síncrono — só a
  // ESCUTA de interação é adiada.
  const semReducaoDeMovimento = !prefersReducedMotion();
  if (hint && sugestoes.length > 1 && !state.insightsSugestoesEnsinado && indiceAtual() < rail.children.length - 1 && semReducaoDeMovimento) {
    hint.classList.add('is-teaching');
    hint.addEventListener('animationend', ensinar, { once: true });
  }

  requestAnimationFrame(() => requestAnimationFrame(() => {
    rail.addEventListener('scroll', () => { atualizarDots(); atualizarHint(); ensinar(); }, { passive: true });
    // Tocar num card também conta como interação, mesmo sem arrastar.
    if (hint) rail.addEventListener('pointerdown', ensinar, { once: true, passive: true });
  }));
}

// Drill-through: reutiliza os caminhos que a própria Agenda e Clientes já
// usam. Nenhuma arquitetura de navegação nova.
function insDrill(destino) {
  if (!destino) return;
  if (destino.tipo === 'agenda') {
    state.agendaDate = new Date(destino.data);
    state.tab = 'agenda';
  } else if (destino.tipo === 'clientes') {
    // Filtro contextual e transitório: só existe em memória, nasce aqui e
    // morre ao trocar de aba pelo rodapé ou recarregar a sessão — nunca
    // sobrescreve o clientFilter salvo da aba.
    state.clientContext = { ids: destino.ids, label: destino.label };
    state.selectedClientId = null;
    state.tab = 'clients';
  } else {
    return;
  }
  render();
  window.scrollTo(0, 0);
}

// Entrada única por sessão: a linha se desenha na primeira visita e
// assenta direto nas seguintes. Verificação de movimento reduzido em
// JS, porque a sequência é orquestrada aqui e o @media não a alcança.
function insAnimateChart() {
  const path = document.getElementById('insTrendLine');
  if (!path) return;
  if (state.insightsChartEntered || prefersReducedMotion()) return;
  state.insightsChartEntered = true;
  const len = path.getTotalLength();
  path.style.transition = 'none';
  path.style.strokeDasharray = String(len);
  path.style.strokeDashoffset = String(len);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    path.style.transition = 'stroke-dashoffset var(--motion-route) var(--ease-out)';
    path.style.strokeDashoffset = '0';
  }));
}

const AGENDA_START_HOUR = 5;
const AGENDA_END_HOUR = 22;
const HOUR_HEIGHT = 60;
// A escala ÚNICA da timeline. Toda posição vertical (linha de hora, topo de
// card, altura de card, faixa de pausa, linha do horário atual) sai daqui —
// nenhum elemento é posicionado "por aproximação". 09:30 cai exatamente na
// metade entre 09:00 e 10:00 porque 30 * PX_PER_MINUTE é metade de 60 *
// PX_PER_MINUTE, e não porque alguém arredondou.
const PX_PER_MINUTE = HOUR_HEIGHT / 60;
// Converte "minutos desde AGENDA_START_HOUR" em pixels. Uma função só, usada
// por todos os desenhos da grade.
function minutesToPx(mins) { return mins * PX_PER_MINUTE; }
// Minutos decorridos entre AGENDA_START_HOUR e um Date, em horário LOCAL da
// agenda (Europe/Dublin no aparelho da Juliane) — nunca via toISOString(),
// que devolveria UTC e deslocaria a grade inteira no horário de verão.
function agendaOffsetMinutes(d) {
  return (d.getHours() - AGENDA_START_HOUR) * 60 + d.getMinutes();
}
// Fio de separação entre um card e o que começa no instante seguinte. É uma
// CONSTANTE em px, não uma fração da duração: o topo continua exato e todos
// os cards perdem os mesmos 2px no rodapé, então a proporção entre durações
// fica intacta. 4px antes — dois cards encostados abriam uma fresta visível
// demais pro padrão de calendário.
const GRID_HAIRLINE = 2;
// Piso de altura só pra garantir alvo de toque; NÃO é piso de duração. Em
// px (14px ≈ 14min na escala atual), abaixo do menor serviço do salão
// (SLOT_MINUTES = 30), então na prática nunca dispara. A versão anterior
// forçava `Math.max(20, durMins)` em MINUTOS, o que esticava a duração
// desenhada de um atendimento curto e mentia sobre a escala.
const APPT_MIN_HEIGHT = 14;
// Camadas da timeline — a lista completa está no comentário de .timeline no
// CSS. Aqui só as que o JS escreve inline.
const Z_APPT = 10;
const WEEKDAY_LABELS = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];

// Expediente de verdade — o que o agendar.html oferece à cliente. Ocupação e
// capacidade se medem contra ISTO, não contra a grade acima: usar as 11h da
// timeline dava um denominador que o formulário nunca consegue preencher (ele
// só oferece 9h), e a ocupação saía estruturalmente baixa. OPEN_HOUR/CLOSE_HOUR/
// SLOT_MINUTES vêm de window.OrenziSalon (shared/salon.js), desestruturados lá
// em cima junto com CLOSED_WEEKDAYS.
const WORK_MINUTES_PER_DAY = (CLOSE_HOUR - OPEN_HOUR) * 60;
// Abaixo disso o "Xh livres" seria ruído — encaixe de meia hora já aparece
// como espaço em branco na própria grade, não precisa de rótulo.
const AGENDA_FREE_MIN_MINUTES = 45;
// Em MINUTOS de duração, não em pixels — desacoplado de HOUR_HEIGHT de
// propósito, senão qualquer ajuste fino da grade (respiro, "premium")
// precisaria recalibrar os tiers junto. Só preparação visual — nenhuma
// regra de negócio muda com isso.
//
// Quatro tiers, validados no celular real (a versão anterior só tinha
// dois — abaixo/acima de 60min — e deixava 30-59min ilegível, sem
// duração nem status visíveis):
//   is-micro    < 30min  — nome curto + duração + ponto de status
//   is-compact  30-44min — nome + serviço + duração + ponto de status,
//                          tudo numa linha só (o card mais baixo desse
//                          tier mede ~28px; duas linhas não cabem)
//   is-standard 45-119min — layout rico de sempre (avatar, selo VIP,
//                          selo de status por extenso)
//   is-expanded >=120min — mesmo layout rico do standard; a altura
//                          sobrando já é suficiente, não precisa de
//                          composição própria
const AGENDA_APPT_MICRO_MAX_MINUTES = 30;
// 60 → 45 (Agenda v2). O limite não é gosto: é o ponto em que o cabeçalho
// rico passa a caber. Com o padding de calendário (8px), duas linhas de
// texto medem 8 + 15.6 + 13.2 = 36.8px, e um card de 45min mede
// 45 * PX_PER_MINUTE − GRID_HAIRLINE = 43px. Com os 12px de padding
// anteriores a mesma conta dava 40.8px e não cabia — daí os 60min de antes.
// Efeito prático: um corte de 45min (o encaixe do cenário Camila/Marina)
// deixa de ser uma linha só e volta a mostrar nome + serviço · duração.
const AGENDA_APPT_COMPACT_MAX_MINUTES = 45;
const AGENDA_APPT_STANDARD_MAX_MINUTES = 120;

function sameDay(a, b) {
  return a.toDateString() === b.toDateString();
}

// "YYYY-MM-DD" a partir dos componentes LOCAIS da data, não de
// toISOString() (que converte pra UTC e pode virar o dia anterior fora do
// fuso zero) — mesma armadilha de fuso que o projeto já documentou em
// outro lugar. Usado só pra alimentar o <input type="date"> do modal.
function dateInputValue(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function startOfWeek(date) {
  const d = new Date(date);
  d.setDate(d.getDate() - d.getDay()); // volta até domingo
  d.setHours(0, 0, 0, 0);
  return d;
}

// Segmentos do atendimento: trabalho inicial / pausa / trabalho final.
// O agendamento pode sobrescrever o padrão do serviço (cabelo que demorou mais).
function segmentsOf(a) {
  const s = a.service || {};
  const total = Math.round((new Date(a.ends_at) - new Date(a.starts_at)) / 60000);
  const wb = a.work_before_minutes ?? s.work_before_minutes ?? total;
  const gp = a.gap_minutes ?? s.gap_minutes ?? 0;
  const wa = a.work_after_minutes ?? s.work_after_minutes ?? 0;
  return { wb, gp, wa };
}

// Sobreposição empilhada, como no calendário do iPhone: o atendimento mais
// longo fica de fundo ocupando a faixa inteira e o encaixe entra por cima,
// recuado à esquerda. Dividir em colunas espremia os dois e escondia a pausa.
// Recuo por camada — 8px, não os 18 de antes. Com 18 o encaixe nascia a
// 24px do início da grade e lia como "card decorativo dentro de outro card";
// com 8 ele fica a 12px, praticamente no mesmo eixo esquerdo do principal, e
// lê como um segundo evento ocupando a mesma faixa de tempo (referência:
// Calendar do iPhone). A borda direita também recua um pouco por camada, pra
// deixar aparecer uma fatia do card de baixo — é ela que comunica sobreposição
// sem precisar encolher o encaixe.
const NIVEL_RECUO = 8;         // px que cada camada entra pela esquerda
const NIVEL_RECUO_DIR = 8;     // px que cada camada entra pela direita
const NIVEL_MAX = 3;           // além disso o bloco ficaria fino demais pra ler

// Altura (px) reservada pro título no topo de um card de tier rico. É a
// regra que garante que o nome da cliente nunca fique encoberto: nada
// desenhado por cima do card — nem a faixa de pausa dele, nem um encaixe
// sobreposto — começa antes dessa marca. Espelha --appt-head-h no CSS;
// mudar um exige mudar o outro.
const APPT_HEAD_SAFE = 40;

function layoutAppts(appts) {
  const itens = appts
    .map(a => ({ a, s: new Date(a.starts_at).getTime(), e: new Date(a.ends_at).getTime() }))
    // Quem começa antes vai pro fundo; empatou, o mais longo é o fundo.
    .sort((x, y) => x.s - y.s || y.e - x.e);

  itens.forEach((it, i) => {
    // Quantos atendimentos já desenhados ainda estavam abertos quando este
    // começou — é o que faz o encaixe subir por cima da pausa.
    const cobrindo = itens.slice(0, i).filter(o => o.s <= it.s && o.e > it.s);
    it.nivel = Math.min(cobrindo.length, NIVEL_MAX);
    // Card que fica logo por baixo deste (o mais recente dos que o cobrem).
    // Serve pra medir a área de título dele e não invadir.
    it.base = cobrindo.reduce((melhor, o) => (!melhor || o.s > melhor.s ? o : melhor), null);
  });
  return itens;
}

// ── Camada de disponibilidade da Agenda — SEM renderizador hoje ──────────
// computeFreeGaps() e freeSlotLabel() eram o que alimentava os cards
// tracejados de "Xh livres" na timeline. Os cards saíram em 15/08/2026 (a
// ausência de card já significa disponibilidade), mas o CÁLCULO fica: é ele
// que sabe mesclar atendimentos sobrepostos, tratar bloqueio e hold como
// intervalo ocupado e ignorar buraco menor que AGENDA_FREE_MIN_MINUTES.
// Nenhuma regra de conflito, booking ou busy slot passa por aqui — essas
// vivem no banco (staff_work_blocks / get_busy_slots) e em
// busyBlocksForStaffOnDate(), todas intactas.
//
// Janelas sem nenhum atendimento dentro do expediente real (OPEN_HOUR–
// CLOSE_HOUR, não a janela de desenho AGENDA_START/END_HOUR — fora do
// expediente é sempre "livre" e mostrar isso seria ruído). Mescla
// atendimentos sobrepostos (encaixe) antes de medir os buracos, senão dois
// atendimentos que se cruzam abririam um "buraco" falso entre eles.
function computeFreeGaps(day, dayAppts, dayBlocks) {
  const dayStart = new Date(day); dayStart.setHours(OPEN_HOUR, 0, 0, 0);
  const dayEnd = new Date(day); dayEnd.setHours(CLOSE_HOUR, 0, 0, 0);

  const busy = dayAppts
    .map(a => ({ s: new Date(a.starts_at).getTime(), e: new Date(a.ends_at).getTime() }))
    // Bloqueio ocupa o intervalo inteiro, igual a um appointment pra fins
    // deste cálculo — nenhum card "Xh livres" pode nascer dentro dele.
    .concat((dayBlocks || []).map(b => ({ s: new Date(b.starts_at).getTime(), e: new Date(b.ends_at).getTime() })))
    .sort((x, y) => x.s - y.s);
  const merged = [];
  busy.forEach(b => {
    const last = merged[merged.length - 1];
    if (last && b.s <= last.e) last.e = Math.max(last.e, b.e);
    else merged.push({ s: b.s, e: b.e });
  });

  const gaps = [];
  let cursor = dayStart.getTime();
  merged.forEach(b => {
    if (b.s > cursor) gaps.push({ s: cursor, e: Math.min(b.s, dayEnd.getTime()) });
    cursor = Math.max(cursor, b.e);
  });
  if (cursor < dayEnd.getTime()) gaps.push({ s: cursor, e: dayEnd.getTime() });

  return gaps
    .map(g => ({ ...g, mins: Math.round((g.e - g.s) / 60000) }))
    .filter(g => g.mins >= AGENDA_FREE_MIN_MINUTES);
}

function freeSlotLabel(mins) {
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  if (h === 0) return `${m} min livres`;
  if (m === 0) return `${h}h ${h === 1 ? 'livre' : 'livres'}`;
  return `${h}h${String(m).padStart(2, '0')} livres`;
}

function durationLabel(mins) {
  const total = Math.round(mins);
  const h = Math.floor(total / 60);
  const m = total % 60;
  if (h === 0) return `${m}min`;
  return m === 0 ? `${h}h` : `${h}h${m}`;
}

// Faixa de horário do atendimento — é o que o card mostra desde 15/08/2026,
// no lugar da duração ("Coloração · 9:00–11:30", não "Coloração · 2h30").
// A duração continua legível na própria altura do card, que é o que a grade
// sabe mostrar bem; o horário de início e fim é o número que só um rótulo
// pode dar.
//
// Formato 24h SEM zero à esquerda — exatamente o dos rótulos da coluna de
// hora logo à esquerda do card (`9:00`, `12:00`, `16:00`), então os dois lêem
// como a mesma escala. 12h com AM/PM sairia da referência americana do
// iPhone e não existe em nenhum outro lugar do painel; a Irlanda escreve
// horário em 24h e `fmtTime()` já é 24h no app inteiro. Travessão de
// intervalo (–, en dash), não hífen.
//
// Os dois lados saem do mesmo `Date` em horário LOCAL (Europe/Dublin no
// aparelho da Juliane), nunca de `toISOString()` — a mesma armadilha de fuso
// que a grade toda evita.
function apptTimeRange(startIso, endIso) {
  const hm = d => `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
  return `${hm(new Date(startIso))}–${hm(new Date(endIso))}`;
}

// Posição (px) e rótulo da linha do horário atual dentro da grade, ou null
// se agora estiver fora da janela desenhada (AGENDA_START_HOUR–END_HOUR).
function currentTimeInfo() {
  const now = new Date();
  const minsFromStart = agendaOffsetMinutes(now);
  const totalMins = (AGENDA_END_HOUR - AGENDA_START_HOUR) * 60;
  if (minsFromStart < 0 || minsFromStart > totalMins) return null;
  return {
    top: minutesToPx(minsFromStart),
    label: now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
  };
}

// Reposiciona a linha existente sem re-renderizar a agenda inteira — chamado
// no intervalo de 30s. A transição de `top` em CSS (ver .current-time-line)
// é que faz ela deslizar suave entre uma posição e outra, em vez de saltar.
function updateCurrentTimeLine() {
  if (state.tab !== 'agenda' || !sameDay(state.agendaDate, new Date())) return;
  const el = document.getElementById('currentTimeLine');
  if (!el) return;
  const info = currentTimeInfo();
  if (!info) { el.remove(); return; }
  el.style.top = info.top + 'px';
  el.querySelector('.current-time-badge').textContent = info.label;
}

// Destaca a linha do horário atual por um instante — usado pelo botão
// "Hoje", que precisa de algum feedback mesmo quando o dia já é hoje e não
// há troca de tela pra animar.
function highlightCurrentTimeLine() {
  requestAnimationFrame(() => {
    const line = document.getElementById('currentTimeLine');
    if (!line) return;
    line.classList.add('is-highlighted');
    setTimeout(() => line.classList.remove('is-highlighted'), 700);
  });
}

// Horário mais relevante pra abrir a grade: se for hoje, perto de agora; se
// tiver atendimento, perto do primeiro; senão, perto da abertura do salão.
// Sempre com ~1h30 de contexto acima, pra não colar o alvo na borda de cima.
function computeRelevantScrollTop(day, dayAppts) {
  if (sameDay(day, new Date())) {
    const info = currentTimeInfo();
    if (info) return Math.max(0, info.top - HOUR_HEIGHT * 1.5);
  }
  if (dayAppts.length) {
    const first = dayAppts.slice().sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at))[0];
    const fs = new Date(first.starts_at);
    return Math.max(0, minutesToPx(agendaOffsetMinutes(fs)) - HOUR_HEIGHT * 1.5);
  }
  return Math.max(0, (OPEN_HOUR - AGENDA_START_HOUR) * HOUR_HEIGHT - HOUR_HEIGHT * 0.5);
}

// `animate:false` (padrão): pula direto pra posição, sem herdar o
// scroll-behavior:smooth do CSS — é assim que a grade "já abre no lugar
// certo" sem parecer que rolou sozinha. `animate:true` é só pro botão
// "Hoje", que pede explicitamente um scroll visível.
function scrollTimelineTo(el, top, opts) {
  const animate = !!(opts && opts.animate);
  if (!el) return;
  if (!animate || prefersReducedMotion()) {
    const prev = el.style.scrollBehavior;
    el.style.scrollBehavior = 'auto';
    el.scrollTop = Math.max(0, top);
    el.style.scrollBehavior = prev;
  } else {
    el.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  }
}

// Miolo da grade (linhas de hora + eventos + linha do horário atual), sem o
// wrapper .timeline em volta — extraído pra ser recalculado sozinho quando
// só o dia muda dentro da mesma semana (renderAgendaGridTransition), sem
// precisar refazer a faixa de dias e o cabeçalho do mês.
// `opts.consumeEntering: false` desliga a única coisa que esta função grava
// no estado (a marca do agendamento recém-criado). O pager desenha três dias
// por vez e só a página ATUAL pode gastar essa marca — ver paintAgendaPage().
function buildAgendaGrid(day, opts) {
  // Cancelado não aparece na agenda operacional — não é trabalho a fazer, e
  // deixar o bloco lá faz a Juliane ler ocupação que não existe. É filtro de
  // RENDER, não de dado: nada é apagado, nada muda de status, o registro
  // continua inteiro pro histórico da cliente (ver app/CLAUDE.md,
  // "Client History"). No painel real ele quase nunca chega até aqui —
  // loadAppointments() já faz .neq('status','cancelled') na leitura — mas o
  // filtro fica na UI de propósito: é ele que segura um item cancelado que
  // ainda esteja em memória (cancelamento na sessão, mock do demo) sem
  // depender de como a lista foi carregada.
  const dayAppts = state.appointments.filter(a => sameDay(new Date(a.starts_at), day) && a.status !== 'cancelled');
  // Bloqueio manual: dia inteiro vira faixa no topo (não card 00:00-24:00
  // na grade — mentiria sobre proporção), parcial vira card próprio na
  // timeline, hachurado (linguagem de "indisponível", ao contrário da pausa
  // clara de um atendimento — ver comentário em cima de .timeline-block).
  const dayBlocks = scheduleBlocksForDay(day);
  const allDayBlocks = dayBlocks.filter(b => b.all_day);
  const partialBlocks = dayBlocks.filter(b => !b.all_day);
  const hours = [];
  for (let h = AGENDA_START_HOUR; h < AGENDA_END_HOUR; h++) hours.push(h);
  const currentTime = sameDay(day, new Date()) ? currentTimeInfo() : null;

  // Consumida uma vez só: o próximo full render depois de criar um
  // agendamento marca o bloco novo com a animação de entrada, e nenhum
  // render seguinte repete (senão tocaria de novo a cada troca de aba).
  const consumirEntering = !opts || opts.consumeEntering !== false;
  const enteringId = consumirEntering ? state.enteringApptId : null;
  if (consumirEntering) state.enteringApptId = null;

  const blocksHtml = layoutAppts(dayAppts).map(it => {
    const a = it.a;
    const start = new Date(a.starts_at);
    const end = new Date(a.ends_at);
    // Geometria pura: o topo é o instante de início e a altura é a duração,
    // as duas na escala única (PX_PER_MINUTE). Nada de piso em MINUTOS aqui —
    // esticar a duração desenhada de um atendimento curto distorceria a
    // escala do dia inteiro. O único piso é de PIXEL (APPT_MIN_HEIGHT),
    // aplicado depois, e só pra alvo de toque.
    const durMins = (end - start) / 60000;
    let top = minutesToPx(agendaOffsetMinutes(start));
    let height = Math.max(APPT_MIN_HEIGHT, minutesToPx(durMins) - GRID_HAIRLINE);
    const c = colorForService(a.service?.id);

    // Duração real decide o tier — em minutos, não em pixels, independe de
    // HOUR_HEIGHT. Puramente visual, não muda o que está gravado no
    // agendamento. Ver a explicação dos 4 tiers perto das constantes.
    const durTier = durMins < AGENDA_APPT_MICRO_MAX_MINUTES ? 'micro'
      : durMins < AGENDA_APPT_COMPACT_MAX_MINUTES ? 'compact'
      : durMins < AGENDA_APPT_STANDARD_MAX_MINUTES ? 'standard'
      : 'expanded';
    const richTier = durTier === 'standard' || durTier === 'expanded';

    // Cada camada de sobreposição entra um pouco mais pra dentro dos DOIS
    // lados: pela esquerda o encaixe fica logo ao lado do eixo do principal
    // (12px contra 4px — indent pequeno, não card centralizado), e pela
    // direita sobra uma fatia do card de baixo aparecendo. É o que faz o
    // encaixe ler como evento sobreposto na timeline em vez de card dentro
    // de card.
    const recuoEsq = it.nivel * NIVEL_RECUO;
    const recuoDir = it.nivel * NIVEL_RECUO_DIR;

    // Guarda de título do card de baixo: um encaixe nunca COMEÇA dentro da
    // faixa de título do atendimento que ele cobre. Encurta pelo topo e o
    // fim fica onde estava — nem a duração percebida nem o horário mudam.
    // Na prática quase nunca dispara: encaixe válido cai dentro da pausa, e
    // a pausa começa depois do primeiro bloco de trabalho, bem abaixo do
    // título (um corte de 09:50 sobre uma coloração de 09:00 passa intacto).
    //
    // O caso extremo é um bloco tão curto que não cabe abaixo da faixa —
    // aí ele ganha uma altura mínima e passa do próprio fim visualmente.
    // É distorção aceita de propósito: só se alcança com trabalho em cima
    // de trabalho, que as regras de conflito já proíbem, e entre distorcer
    // um bloco inválido ou cobrir o nome de uma cliente, o nome ganha.
    const base = it.base;
    if (base) {
      const baseDur = (base.e - base.s) / 60000;
      if (baseDur >= AGENDA_APPT_COMPACT_MAX_MINUTES) {
        const baseTop = minutesToPx(agendaOffsetMinutes(new Date(base.s)));
        const limite = baseTop + APPT_HEAD_SAFE;
        if (top < limite) {
          const fim = top + height;
          top = limite;
          height = Math.max(14, fim - top);
        }
      }
    }

    // Faixa de pausa, quando o serviço tiver uma: é ela que mostra por que
    // cabe um encaixe no meio de um atendimento longo.
    //
    // SEM RÓTULO NENHUM (15/08/2026). Saiu o "⏱ pausa · 70min": a região é
    // comunicada só pelo fade sobre a própria cor do card, com a barra
    // lateral atravessando inteira. Um texto ali brigava com o nome da
    // cliente pela leitura e, num card com encaixe por cima, ficava escondido
    // atrás dele metade das vezes — informação que aparece por acaso é pior
    // que informação nenhuma. A duração da pausa continua no dado
    // (`segmentsOf()`) e no detalhe do atendimento; a timeline mostra só a
    // proporção, que é o que ela sabe mostrar bem. Não substituir por outro
    // texto, ícone ou horário.
    const seg = segmentsOf(a);
    let gapHtml = '';
    if (seg.gp > 0) {
      const gapTopReal = minutesToPx(seg.wb);
      const gapFim = gapTopReal + minutesToPx(seg.gp);
      // Só o TOPO da faixa é aparado pela área de título; o fim continua no
      // instante real — é ele que mostra até onde cabe um encaixe, e mexer
      // nisso mentiria sobre a janela disponível. Com o fade de 8px do CSS
      // o corte não aparece: o que some é a parte mais transparente.
      const gapTop = richTier ? Math.min(Math.max(gapTopReal, APPT_HEAD_SAFE), gapFim) : gapTopReal;
      const gapH = gapFim - gapTop;
      gapHtml = `<div class="appt-gap" style="top:${gapTop}px; height:${gapH}px;"></div>`;
    }

    const clientName = a.client?.name || 'Cliente';
    const firstName = clientName.trim().split(/\s+/)[0];
    const serviceName = a.service?.name || '';
    const durLabel = durationLabel(durMins);
    const timeLabel = apptTimeRange(a.starts_at, a.ends_at);
    // Só o que foge do esperado vira selo — ver timelineStatusBadge().
    const badgeTxt = timelineStatusBadge(a.status);
    const badgeHtml = badgeTxt ? `<span class="am-status st-urgent">${badgeTxt}</span>` : '';
    // Rótulo acessível completo em todo tier — é o que garante que um card
    // reduzido a "Maria · 9:00–9:20" não perca informação nenhuma pra quem
    // usa leitor de tela. O status entra aqui pela MESMA regra do visual:
    // quando não há selo é porque não há nada a dizer, e anunciar
    // "Confirmado" em todo card seria ruído extra justamente pra quem já
    // navega mais devagar. A DURAÇÃO fica só aqui, e de propósito: no visual
    // ela é a altura do card, e quem não vê a altura não tem de onde tirá-la.
    const ariaLabel = `${clientName}, ${serviceName || 'serviço não definido'}, ${timeLabel}, ${durLabel}${badgeTxt ? ', ' + badgeTxt : ''}`;

    // Sem o nome da profissional (10/08/2026): só a Juliane atende, então
    // repetir "Juliane Orenzi" em todo card era ruído puro e roubava a
    // largura de que o serviço e o horário precisam. A arquitetura
    // multi-profissional continua inteira por baixo (staff_id,
    // profissionaisAtivos(), disponibilidade) — isto é só a UI resumida do
    // card. Se uma segunda profissional voltar a atender, este é o ponto
    // pra trazer o nome de volta, provavelmente condicionado à mesma regra
    // que já esconde o campo no modal.
    const subLabel = richTier
      ? `${esc(serviceName)} · <span class="hours">${timeLabel}</span>`
      : esc(serviceName);
    const classes = ['timeline-appt', `is-${durTier}`, enteringId === a.id ? 'is-entering' : ''].filter(Boolean).join(' ');

    // Fundo mais saturado que o tom pastel original — misturado com a própria
    // cor de borda da categoria (nada de cor nova), pra ler como "card vivo"
    // em vez de bloco monocromático suave. Medido no navegador: o texto que
    // já existia (c.text) foi calibrado pro pastel puro e caía pra 3,0:1
    // contra esse fundo mais escuro — abaixo do mínimo AA (4,5:1). Escurecer
    // o próprio texto em 35% (mesma técnica, sem cor nova) devolve ≥5,6:1
    // em todas as categorias.
    const bgStrong = `color-mix(in srgb, ${c.bg} 60%, ${c.border} 40%)`;
    const textStrong = `color-mix(in srgb, ${c.text} 65%, black 35%)`;
    // Barra de destaque: `c.border` é o membro MAIS saturado do trio da
    // categoria, então ela é a base — só um toque (15%) do tom escuro da
    // mesma família pra assentar. Puxar mais pro escuro subiria o contraste
    // contra o fundo do card, mas dessaturaria justo o que a barra existe
    // pra fazer: dar identidade viva de categoria. Medido no navegador:
    // 1,9–2,9:1 contra o fundo do próprio card, dependendo da categoria
    // (Coloração é o piso — os três tons dela são próximos de propósito).
    // Fica abaixo dos 3:1 de componente não-textual, e é aceito: a barra é
    // ênfase, não portadora de informação — a categoria já está no
    // preenchimento e no texto do card, e contra o fundo da PÁGINA (que é
    // o vizinho real da barra, na borda esquerda) o contraste é alto.
    const barColor = `color-mix(in srgb, ${c.border} 85%, ${c.text} 15%)`;

    let headHtml;
    if (durTier === 'micro') {
      // <30min: só o essencial — primeiro nome e faixa de horário (nunca
      // some). Nome completo e serviço ficam só no detalhe (aberto ao tocar
      // o card, que continua clicável inteiro). O selo só aparece no caso
      // excepcional (no-show), e aí ele vale mais que o nome completo:
      // quem trunca é o nome, que já era só o primeiro.
      headHtml = `
        <div class="micro-row" style="color:${textStrong}">
          <span class="micro-name">${esc(firstName)}</span>
          ${badgeHtml}
          <span class="micro-hours">${timeLabel}</span>
        </div>
      `;
    } else if (durTier === 'compact') {
      // 30-44min: nome + serviço + faixa de horário numa linha só — o card
      // mais baixo desse tier (30min) mede ~28px, sem sobra pra uma segunda
      // linha. Avatar reduzido (o-avatar-2xs, 16px) em vez de sumir —
      // ainda dá pra reconhecer de relance. Quem cede espaço é o serviço
      // (ellipsis no .compact-info), nunca o horário: a prioridade é nome →
      // serviço → horário, e o horário é curto e de largura fixa.
      headHtml = `
        <div class="compact-row" style="color:${textStrong}">
          <span class="o-avatar o-avatar-2xs" style="--avatar-bg:${c.border};--avatar-color:${c.bg}" aria-hidden="true">${initials(clientName)}</span>
          <span class="compact-info"><b>${esc(clientName)}</b> · ${esc(serviceName)}</span>
          ${badgeHtml}
          <span class="compact-hours">${timeLabel}</span>
        </div>
      `;
    } else {
      headHtml = `
        <div class="appt-head">
          <span class="o-avatar o-avatar-xs" style="--avatar-bg:${c.border};--avatar-color:${c.bg}" aria-hidden="true">
            ${initials(clientName)}
            ${a.client?.vip ? `<span class="o-avatar-badge">${ICONS.starFilled}</span>` : ''}
          </span>
          <div class="appt-body">
            <div class="title" style="color:${textStrong}">${esc(clientName)}</div>
            <div class="sub" style="color:${textStrong}">${subLabel}</div>
          </div>
          ${badgeHtml}
        </div>
      `;
    }

    // O cabeçalho vem DEPOIS da faixa de pausa no DOM de propósito: os dois
    // pintam na mesma camada e a ordem de documento é que põe o título por
    // cima, sem precisar de z-index. O selo (quando existe) vive dentro do
    // cabeçalho, não solto por cima do card.
    return `
      <div class="${classes}" data-appt-id="${a.id}" data-tier="${durTier}" aria-label="${esc(ariaLabel)}" style="top:${top}px; height:${height}px; left:calc(var(--tl-card-left) + ${recuoEsq}px); right:calc(var(--tl-card-right) + ${recuoDir}px); z-index:${Z_APPT + it.nivel}; background:${bgStrong}; --appt-bar:${barColor};">
        ${gapHtml}
        ${headHtml}
      </div>
    `;
  }).join('');

  // Card próprio na timeline — hachurado, largura cheia (não recuado como
  // um encaixe), z-index abaixo dos appointments: um bloqueio nunca invade
  // o trabalho de um appointment (o backend recusa isso na criação), só
  // pode coincidir visualmente com a faixa de PAUSA de um — e aí o card do
  // appointment, por vir depois no DOM/z-index mais alto, seria o que
  // ganhasse se algum dia colidissem no mesmo pixel.
  const scheduleBlocksHtml = partialBlocks.map(b => {
    const start = new Date(b.starts_at);
    const end = new Date(b.ends_at);
    // Mesma escala e mesmo fio de separação dos appointments — bloqueio muda
    // de linguagem visual (rachurado, neutro), nunca de geometria.
    const top = minutesToPx(agendaOffsetMinutes(start));
    const height = Math.max(APPT_MIN_HEIGHT, minutesToPx((end - start) / 60000) - GRID_HAIRLINE);
    const timeLabel = `${fmtTime(b.starts_at)}–${fmtTime(b.ends_at)}`;
    const label = b.reason ? esc(b.reason) : 'Bloqueado';
    const ariaLabel = `Bloqueio, ${timeLabel}${b.reason ? ', ' + b.reason : ''}`;
    return `
      <div class="timeline-block" data-block-id="${b.id}" aria-label="${esc(ariaLabel)}" style="top:${top}px; height:${height}px;">
        <div class="tb-row">${ICONS.block}<span class="tb-label">${label}</span></div>
        ${height >= 40 ? `<span class="tb-time">${timeLabel}</span>` : ''}
      </div>
    `;
  }).join('');

  // Os cards de "Xh livres" foram removidos da grade em 15/08/2026: num
  // calendário de verdade o vazio não é desenhado, e a ausência de card já
  // significa disponibilidade. Saiu SÓ o desenho — computeFreeGaps() (com
  // os holds entrando como intervalo ocupado), freeSlotLabel() e
  // AGENDA_FREE_MIN_MINUTES continuam de pé, e nenhuma regra de
  // disponibilidade, conflito ou booking foi tocada.

  // "Vazio temporário" (docs/02_DESIGN_PRINCIPLES.md §10): frase curta e
  // neutra, sem ícone, sem ação — o toque em qualquer hora livre da própria
  // grade já é o caminho pra agendar. Fica dentro do html de #timelineEl (e
  // não no cabeçalho) de propósito: assim atualiza tanto no render cheio
  // quanto no caminho leve de troca de dia (renderAgendaGridTransition),
  // que só reescreve este nó.
  const emptyNoteHtml = (dayAppts.length || allDayBlocks.length)
    ? ''
    : `<p class="agenda-empty-note">${sameDay(day, new Date()) ? 'Hoje sua agenda está livre.' : 'Nenhum atendimento neste dia.'}</p>`;

  // Dia inteiro vira FAIXA, não card de 00:00-24:00 na grade — decisão
  // explícita (um card gigante mentiria sobre proporção do dia). Vive fora
  // de .timeline-body (que é 100% posicionamento absoluto por minuto), mas
  // dentro do html que #timelineEl recebe — então acompanha a mesma
  // animação de slide da troca de dia, sem coreografia própria.
  const allDayBannerHtml = allDayBlocks.map(b => `
    <div class="day-blocked-banner" data-block-id="${b.id}">
      ${ICONS.block}
      <span>${b.reason ? esc(b.reason) : 'Salão fechado'}</span>
    </div>
  `).join('');

  const html = `
    ${allDayBannerHtml}
    ${emptyNoteHtml}
    <div class="timeline-body" style="height:${(AGENDA_END_HOUR - AGENDA_START_HOUR) * HOUR_HEIGHT}px;">
      ${hours.map((h, i) => `
        <div class="hour-row" style="position:absolute; top:${minutesToPx(i * 60)}px; left:0; right:0; height:${HOUR_HEIGHT}px;">
          <div class="hour-label">${h}:00</div>
        </div>
      `).join('')}
      ${scheduleBlocksHtml}
      ${blocksHtml}
      ${currentTime ? `
        <div class="current-time-line" id="currentTimeLine" style="top:${currentTime.top}px;">
          <span class="current-time-badge">${currentTime.label}</span>
          <span class="current-time-dot"></span>
        </div>
      ` : ''}
    </div>
  `;
  return { html, dayAppts };
}

function weekDayButtonHtml(d, selectedDay) {
  const selected = sameDay(d, selectedDay);
  const today = sameDay(d, new Date());
  const hasAppts = state.appointments.some(a => sameDay(new Date(a.starts_at), d));
  return `
    <button class="week-day ${selected ? 'selected' : ''} ${today ? 'is-today' : ''} ${hasAppts ? 'has-appts' : ''}" data-date="${d.toISOString()}">
      <div class="wd-label">${WEEKDAY_LABELS[d.getDay()]}</div>
      <div class="wd-num">${d.getDate()}</div>
      <div class="wd-dot"></div>
    </button>
  `;
}

// Toca só a classe .selected nos botões que já existem — nada de refazer o
// HTML da faixa. É isso que deixa a transição de background/border já
// declarada em .week-day animar de verdade, em vez de nascer pronta.
function updateWeekStripSelection(newDay) {
  document.querySelectorAll('.week-day').forEach(b => {
    const bd = new Date(b.dataset.date);
    b.classList.toggle('selected', sameDay(bd, newDay));
    b.classList.toggle('is-today', sameDay(bd, new Date()));
  });
}

// ── Cabeçalho da Agenda ───────────────────────────────────────────────
// UMA linha de controle (mês + setas de semana + Hoje + novo agendamento)
// e a faixa de dias, e acabou — a grade começa logo abaixo. Não existe
// mais estado expandido/colapsado nem colapso por scroll: a decisão (do
// Raphael, 05/08/2026) foi um cabeçalho já compacto o tempo todo, em vez
// de um que encolhe ao rolar. O que foi embora: título grande de data
// ("Quarta-feira, 5 de agosto de 2026" — a faixa de dias já diz o dia) e o
// "Hoje" flutuante, que virou pílula aqui na linha.
// Mês por extenso ("Agosto") no ano corrente; fora dele o ano volta e o mês
// encolhe junto ("Set 2027"). Antes era sempre abreviado ("Ago 2026") pra
// caber em 320px — era o ano redundante que comia a largura. Sem ele o nome
// inteiro cabe (medido: "Setembro" deixa 8px de folga na linha de 320px), e
// o mês vira o rótulo grande que abre o calendário (Agenda v2, referência
// Calendar do iPhone). "Setembro 2027" por extenso NÃO cabe, daí a
// abreviação voltar exatamente no caso em que o ano precisa aparecer.
// Nunca escrever "Agenda" neste botão: a aba já diz onde a Juliane está, e
// o botão é sobre QUAL data ela vê.
function agendaMonthLabel(day) {
  const anoCorrente = day.getFullYear() === new Date().getFullYear();
  return anoCorrente
    ? MONTH_FULL[day.getMonth()]
    : `${MONTH_ABBR[day.getMonth()]} ${day.getFullYear()}`;
}

function agendaHeaderHtml(day) {
  const monthLabel = agendaMonthLabel(day);
  const weekStart = startOfWeek(day);
  const weekDays = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    return d;
  });
  return `
    <div class="day-nav">
      <div class="month-pill">
        <button class="arrow" id="prevWeek" aria-label="Semana anterior">‹</button>
        <button class="day-label-btn" id="openMonthView">
          <div class="day-label">${monthLabel}</div>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <button class="arrow" id="nextWeek" aria-label="Próxima semana">›</button>
      </div>
      <div class="day-nav-actions">
        <button class="agenda-today-btn" id="agendaTodayBtn">Hoje</button>
        <button class="agenda-add-btn" id="agendaAddBtn" aria-label="Adicionar — novo agendamento ou bloqueio">+</button>
      </div>
    </div>
    <div class="week-strip" id="weekStrip">
      ${weekDays.map(d => weekDayButtonHtml(d, day)).join('')}
    </div>
  `;
}

function bindAgendaHeader() {
  const day = state.agendaDate;
  // prevWeek/nextWeek trocam a semana inteira, então deslizam a grade — o
  // cabeçalho de setas/mês fica de fora (é controle, não conteúdo).
  document.getElementById('prevWeek').onclick = () => {
    state.agendaDate = new Date(day.getTime() - 7 * 86400000);
    renderAgendaTransition('back');
  };
  document.getElementById('nextWeek').onclick = () => {
    state.agendaDate = new Date(day.getTime() + 7 * 86400000);
    renderAgendaTransition('forward');
  };
  document.getElementById('openMonthView').onclick = () => openMonthCalendar(day);
  document.getElementById('agendaAddBtn').onclick = openAgendaAddMenu;
  document.getElementById('agendaTodayBtn').onclick = goToToday;
  bindWeekDayButtons();
}

// Toque num dia da faixa: passa pelo MESMO motor do gesto (pagerGoTo), então
// tocar num dia e arrastar até ele têm o mesmo movimento e o mesmo momento de
// commit. O cabeçalho não é refeito aqui — quem cuida dele é
// updateAgendaChrome(), depois que a navegação fecha.
// Extraído de bindAgendaHeader() porque updateAgendaChrome() precisa
// reamarrar os botões quando a faixa troca de semana.
function bindWeekDayButtons() {
  app.querySelectorAll('.week-day').forEach(btn => {
    btn.onclick = () => {
      // Lê state.agendaDate na hora, não uma variável capturada no render:
      // estes onclick não são reamarrados a cada toque, então uma data
      // capturada ficaria presa no dia do último render cheio.
      const novaData = new Date(btn.dataset.date);
      if (sameDay(novaData, state.agendaDate)) return;
      pagerGoTo(novaData);
    };
  });
}

function bindTimelineApptClicks() {
  app.querySelectorAll('.timeline-appt[data-appt-id]').forEach(block => {
    block.onclick = () => {
      const apptId = block.dataset.apptId;
      const abrir = async () => {
        if (!state.apptPhotos[apptId]) await loadApptPhotos(apptId);
        state.selectedApptId = apptId;
        render();
      };
      // Eleva antes de trocar de tela — dá tempo do toque "assentar" antes do
      // conteúdo mudar debaixo do dedo. Sem isso a tela trocava instantânea
      // demais, quase parecendo que o toque não foi reconhecido.
      if (prefersReducedMotion()) { abrir(); return; }
      block.classList.add('is-lifting');
      setTimeout(abrir, 100);
    };
  });
}

// `bindFreeSlotClicks()` saiu em 15/08/2026 junto com os cards de "Xh
// livres": não existe mais nenhum `.agenda-free-slot` no DOM pra amarrar.
// `openNewApptModalAt()` continua onde estava, intocada — é caminho do
// wizard de agendamento (pula a etapa Data com wiz.source='free-slot'), e
// mexer nela seria mexer em booking. Se um dia voltar uma entrada por vão
// livre, é ela que o novo gatilho chama.

// Toque num bloqueio (card parcial ou faixa de dia inteiro) abre o sheet de
// detalhe — não a tela de Appointment Detail, é outra entidade.
function bindTimelineBlockClicks() {
  app.querySelectorAll('[data-block-id]').forEach(el => {
    el.onclick = () => openBlockDetailSheet(el.dataset.blockId);
  });
}

function renderAgenda() {
  document.getElementById('greeting').textContent = 'Agenda';
  document.getElementById('greetingSub').textContent = '';
  const day = state.agendaDate;
  const { html: gridHtml, dayAppts } = buildAgendaGrid(day);

  // Três páginas: a atual no fluxo (é ela que dá altura ao trilho) e as
  // vizinhas absolutas, já deslocadas ±100% pelo CSS. O conteúdo delas é
  // pintado logo abaixo, em paintAgendaSidePages() — assim o gesto nunca
  // revela tela vazia.
  app.innerHTML = `
    <div class="agenda-screen" id="agendaScreen">
      ${agendaHeaderHtml(day)}
      <div class="agenda-viewport" id="agendaWeekViewport">
        <div id="agendaWeekPane">
          <div class="agenda-pager" id="agendaViewport">
            <div class="agenda-pager-track" id="agendaPagerTrack">
              <div class="timeline agenda-page is-prev" data-page="prev"></div>
              <div class="timeline agenda-page is-current" data-page="current" data-date="${day.toISOString()}" id="timelineEl">${gridHtml}</div>
              <div class="timeline agenda-page is-next" data-page="next"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;

  bindAgendaHeader();
  paintAgendaSidePages();
  bindTimelineApptClicks();
  bindTimelineBlockClicks();
  bindAgendaPager();
  app.querySelectorAll('.agenda-page').forEach(attachTimelineScrollbarFade);
  scrollTimelineTo(document.getElementById('timelineEl'), computeRelevantScrollTop(day, dayAppts), { animate: false });
}

// #timelineEl é recriado a cada renderAgenda(), então o listener é
// reamarrado toda vez — mesmo padrão dos outros binds desta função.
function attachTimelineScrollbarFade(el) {
  if (!el) return;
  let hideTimer = null;
  el.addEventListener('scroll', () => {
    el.classList.add('is-scrolling');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => el.classList.remove('is-scrolling'), 1000);
  });
}

// ── Pager de dias — gesto horizontal (15/08/2026) ────────────────────────
// Navegação por arrasto entre dias, no modelo de pager nativo: o conteúdo
// acompanha o dedo em tempo real (não é "swipe detectado → toca animação") e
// só no soltar decide se completa ou volta.
//
// Três decisões que sustentam o resto:
//
// 1. `touch-action: pan-y` na .timeline (CSS) entrega o eixo Y ao navegador
//    e o X aos handlers. Sem isso o pager precisaria de preventDefault, que
//    mataria o momentum do scroll vertical.
// 2. A DATA só muda no commit. Durante o arrasto o estado lógico continua no
//    dia atual — cancelar o gesto não deixa resíduo nenhum, e o cabeçalho
//    não é reconstruído a cada pixel.
// 3. As páginas vizinhas já estão desenhadas antes do primeiro movimento
//    (paintAgendaSidePages), então nada é renderizado durante o gesto.

const PAGER_INTENT_PX = 8;         // antes disso não é gesto, é tremor de dedo
const PAGER_INTENT_RATIO = 1.2;    // |dx| tem que ganhar de |dy| com folga
const PAGER_COMMIT_RATIO = 0.22;   // 22% da largura fecha a navegação
const PAGER_FLICK_VELOCITY = 0.45; // px/ms — um peteleco curto também fecha
const PAGER_FLICK_MIN_PX = 12;     // ...desde que tenha saído do lugar
const PAGER_SNAP_MS = 260;

const pagerState = {
  ativo: false, eixo: null, pointerId: null,
  x0: 0, y0: 0, dx: 0, largura: 1,
  amostras: [], animando: false, arrastou: false,
};

function agendaPageEl(papel) {
  const track = document.getElementById('agendaPagerTrack');
  return track ? track.querySelector(`[data-page="${papel}"]`) : null;
}

function addDaysTo(dia, n) {
  const d = new Date(dia);
  d.setDate(d.getDate() + n);
  return d;
}

// Desenha uma página do pager. `consumeEntering: false` é obrigatório nas
// vizinhas: buildAgendaGrid() zera state.enteringApptId na primeira chamada,
// e sem isso a animação de entrada do agendamento recém-criado seria gasta
// numa página que ninguém está vendo.
function paintAgendaPage(papel, dia, opts) {
  const el = agendaPageEl(papel);
  if (!el) return;
  const { html } = buildAgendaGrid(dia, opts);
  el.innerHTML = html;
  el.dataset.date = dia.toISOString();
}

// As duas vizinhas do dia atual — sempre prontas antes de qualquer gesto.
// No painel real isso não custa consulta nenhuma: loadAppointments() já traz
// a agenda inteira pra memória, e buildAgendaGrid() só filtra state. Um dia
// sem dado carregado desenha a grade vazia na hora, sem travar o gesto.
function paintAgendaSidePages() {
  paintAgendaPage('prev', addDaysTo(state.agendaDate, -1), { consumeEntering: false });
  paintAgendaPage('next', addDaysTo(state.agendaDate, 1), { consumeEntering: false });
}

// Alinha o scroll vertical das vizinhas ao da página atual, no momento em que
// o gesto começa. É o que faz o arrasto ler como movimento puramente
// horizontal: sem isso o dia seguinte entraria numa altura diferente e a tela
// pareceria pular na diagonal.
function pagerSyncScroll() {
  const atual = agendaPageEl('current');
  if (!atual) return;
  ['prev', 'next'].forEach(p => {
    const el = agendaPageEl(p);
    if (el) el.scrollTop = atual.scrollTop;
  });
}

function pagerSetTransform(px) {
  const track = document.getElementById('agendaPagerTrack');
  if (track) track.style.transform = px ? `translate3d(${px}px,0,0)` : '';
}

// Volta o trilho ao repouso sem animação e solta o estado do gesto. Usada no
// fim de tudo e também como saída de emergência (resize no meio do arrasto).
function pagerCancelar() {
  const track = document.getElementById('agendaPagerTrack');
  if (track) {
    track.style.transition = 'none';
    track.style.transform = '';
    track.classList.remove('is-dragging');
  }
  pagerState.ativo = false;
  pagerState.eixo = null;
  pagerState.pointerId = null;
  pagerState.dx = 0;
  pagerState.amostras.length = 0;
  pagerState.animando = false;
}

// Anima o trilho até o destino e, ao chegar, troca o dia de verdade.
// `destino`: 'prev' | 'next' | null (null = volta pro lugar).
// `dataDestino` permite pular pra uma data qualquer (toque na faixa de dias),
// não só pro vizinho imediato.
function pagerSettle(destino, dataDestino) {
  const track = document.getElementById('agendaPagerTrack');
  if (!track) return;
  const alvo = destino === 'next' ? -pagerState.largura
    : destino === 'prev' ? pagerState.largura
    : 0;
  // Movimento reduzido: o dedo continua arrastando (feedback direto é
  // acessibilidade, não enfeite), mas o snap é instantâneo — nada de easing
  // prolongado depois de soltar.
  const dur = prefersReducedMotion() ? 0 : PAGER_SNAP_MS;

  let encerrado = false;
  const concluir = () => {
    if (encerrado) return;
    encerrado = true;
    track.removeEventListener('transitionend', aoFim);
    track.style.transition = 'none';
    track.style.transform = '';
    track.classList.remove('is-dragging');
    pagerState.animando = false;
    pagerState.dx = 0;
    if (destino) pagerCommit(dataDestino || addDaysTo(state.agendaDate, destino === 'next' ? 1 : -1));
  };
  function aoFim(e) {
    if (e.target !== track || e.propertyName !== 'transform') return;
    concluir();
  }

  pagerState.animando = true;
  if (dur === 0) { concluir(); return; }
  track.style.transition = `transform ${dur}ms cubic-bezier(.22,.61,.36,1)`;
  pagerSetTransform(alvo);
  track.addEventListener('transitionend', aoFim);
  // Rede de segurança pelo mesmo motivo já documentado no resto do arquivo:
  // sem composição de frames (aba em segundo plano) o transitionend nunca
  // dispara, e o trilho ficaria preso em translateX pra sempre.
  setTimeout(concluir, dur + 240);
}

// Efetiva a troca: a partir daqui o dia novo é o dia atual. É só aqui que a
// data, a faixa de dias e o mês do cabeçalho mudam.
function pagerCommit(novaData) {
  const anterior = state.agendaDate;
  const entrou = novaData > anterior ? agendaPageEl('next') : agendaPageEl('prev');
  const scroll = entrou ? entrou.scrollTop : 0;
  state.agendaDate = novaData;
  paintAgendaPage('current', novaData);
  paintAgendaSidePages();
  const atual = agendaPageEl('current');
  if (atual) atual.scrollTop = scroll;
  pagerSyncScroll();
  updateAgendaChrome(anterior, novaData);
  bindTimelineApptClicks();
  bindTimelineBlockClicks();
}

// Cabeçalho DEPOIS do commit (nunca durante o arrasto). Se o dia novo caiu na
// mesma semana, só a seleção muda — a faixa continua sendo os mesmos botões,
// que é o que deixa a transição de .week-day animar. Se mudou de semana (ou
// de mês, atravessando 31/08 → 01/09), a faixa é refeita e o rótulo do mês
// acompanha.
function updateAgendaChrome(diaAntigo, diaNovo) {
  const lbl = document.querySelector('.month-pill .day-label');
  if (lbl) lbl.textContent = agendaMonthLabel(diaNovo);
  const strip = document.getElementById('weekStrip');
  const mesmaSemana = startOfWeek(diaAntigo).getTime() === startOfWeek(diaNovo).getTime();
  if (strip && !mesmaSemana) {
    const ini = startOfWeek(diaNovo);
    strip.innerHTML = Array.from({ length: 7 }, (_, i) => weekDayButtonHtml(addDaysTo(ini, i), diaNovo)).join('');
    bindWeekDayButtons();
  } else {
    updateWeekStripSelection(diaNovo);
  }
}

// Navega pra uma data qualquer com o mesmo motion do gesto — usada pelo toque
// na faixa de dias. A página vizinha do lado certo é repintada com a data
// escolhida (que pode não ser o vizinho imediato) antes de deslizar.
function pagerGoTo(novaData) {
  const viewport = document.getElementById('agendaViewport');
  const track = document.getElementById('agendaPagerTrack');
  if (!viewport || !track || pagerState.animando) return;
  if (sameDay(novaData, state.agendaDate)) return;
  const destino = novaData > state.agendaDate ? 'next' : 'prev';
  paintAgendaPage(destino, novaData, { consumeEntering: false });
  bindTimelineApptClicks();
  bindTimelineBlockClicks();
  pagerSyncScroll();
  pagerState.largura = viewport.clientWidth || 1;
  track.style.transition = 'none';
  track.classList.add('is-dragging');
  // Reflow síncrono antes de ligar a transição: sem ele o navegador pode
  // juntar o `transition: none` e o transform de destino no mesmo estilo
  // calculado e a folha chegaria pronta, sem animar. É a mesma técnica (e o
  // mesmo motivo) do dropdown do diagnóstico da cliente — e é síncrona de
  // propósito, porque requestAnimationFrame não dispara sem composição.
  void track.offsetWidth;
  pagerSettle(destino, novaData);
}

let pagerResizeLigado = false;

// #agendaViewport nasce de novo a cada renderAgenda(), então estes listeners
// vêm junto com ele — nada se acumula entre renders. Só o resize é global, e
// esse é registrado uma vez só (pagerResizeLigado).
function bindAgendaPager() {
  const viewport = document.getElementById('agendaViewport');
  const track = document.getElementById('agendaPagerTrack');
  if (!viewport || !track) return;

  viewport.addEventListener('pointerdown', e => {
    if (pagerState.animando) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    pagerState.ativo = true;
    pagerState.eixo = null;
    pagerState.arrastou = false;
    pagerState.pointerId = e.pointerId;
    pagerState.x0 = e.clientX;
    pagerState.y0 = e.clientY;
    pagerState.dx = 0;
    pagerState.largura = viewport.clientWidth || 1;
    pagerState.amostras = [{ x: e.clientX, t: e.timeStamp }];
  });

  viewport.addEventListener('pointermove', e => {
    if (!pagerState.ativo || e.pointerId !== pagerState.pointerId) return;
    const dx = e.clientX - pagerState.x0;
    const dy = e.clientY - pagerState.y0;

    // Direction lock: enquanto o gesto não se declarou, nada acontece. Só
    // vira pager se a intenção horizontal for clara (|dx| ganha de |dy| com
    // margem); se o dedo foi pra vertical primeiro, o gesto é abandonado e o
    // scroll nativo segue intacto até o dedo levantar.
    if (pagerState.eixo === null) {
      if (Math.abs(dx) < PAGER_INTENT_PX && Math.abs(dy) < PAGER_INTENT_PX) return;
      if (Math.abs(dx) > Math.abs(dy) * PAGER_INTENT_RATIO) {
        pagerState.eixo = 'h';
        pagerSyncScroll();
        track.style.transition = 'none';
        track.classList.add('is-dragging');
        try { viewport.setPointerCapture(e.pointerId); } catch (_) { /* mouse fora da tela */ }
      } else {
        pagerState.eixo = 'v';
        pagerState.ativo = false;
        return;
      }
    }
    if (pagerState.eixo !== 'h') return;

    // A partir daqui o toque virou arrasto: o click que o navegador emitiria
    // no fim precisa ser engolido, senão soltar o dedo em cima de um card
    // abriria o atendimento.
    pagerState.arrastou = true;
    pagerState.dx = dx;
    pagerState.amostras.push({ x: e.clientX, t: e.timeStamp });
    if (pagerState.amostras.length > 6) pagerState.amostras.shift();
    // Escreve o transform direto, sem passar por requestAnimationFrame. O
    // navegador já entrega pointermove no ritmo do frame (e coalesce o
    // excedente), e escrever `transform` não força layout nem paint
    // sincronizado — o custo de agendar um rAF por movimento seria maior que
    // o que ele economizaria. Mais importante: rAF não dispara sem composição
    // de frames (armadilha já documentada neste arquivo), e ali ficaria um
    // `frame` pendente segurando os movimentos seguintes. Sem rAF não existe
    // esse estado pra travar.
    pagerSetTransform(dx);
  });

  const soltar = e => {
    if (!pagerState.ativo || (e.pointerId != null && e.pointerId !== pagerState.pointerId)) return;
    const eraHorizontal = pagerState.eixo === 'h';
    pagerState.ativo = false;
    pagerState.eixo = null;
    try { viewport.releasePointerCapture(pagerState.pointerId); } catch (_) { /* já solto */ }
    if (!eraHorizontal) return;

    const dx = pagerState.dx;
    const largura = pagerState.largura;

    // Velocidade da ÚLTIMA fração do gesto (~120ms), não do gesto inteiro:
    // é o que separa "arrastou devagar e parou" de "deu um peteleco".
    let v = 0;
    const s = pagerState.amostras;
    if (s.length >= 2) {
      const fim = s[s.length - 1];
      let ini = s[0];
      for (let i = s.length - 1; i >= 0; i--) {
        if (fim.t - s[i].t <= 120) ini = s[i]; else break;
      }
      const dt = fim.t - ini.t;
      if (dt > 0) v = (fim.x - ini.x) / dt;
    }

    const porDistancia = Math.abs(dx) > largura * PAGER_COMMIT_RATIO;
    // Peteleco: rápido, na mesma direção do deslocamento, e que ao menos
    // saiu do lugar. Sem o teste de direção, desacelerar voltando cancelaria
    // um arrasto que já tinha passado do limite.
    const porVelocidade = Math.abs(v) > PAGER_FLICK_VELOCITY
      && Math.abs(dx) > PAGER_FLICK_MIN_PX
      && Math.sign(v) === Math.sign(dx);

    if (porDistancia || porVelocidade) pagerSettle(dx < 0 ? 'next' : 'prev', null);
    else pagerSettle(null, null);
  };

  viewport.addEventListener('pointerup', soltar);
  viewport.addEventListener('pointercancel', e => {
    if (!pagerState.ativo) return;
    pagerState.ativo = false;
    pagerState.eixo = null;
    pagerSettle(null, null);
  });

  // Engole o click que fecha um arrasto. Fase de captura, pra chegar antes
  // do onclick do card. Um toque limpo (sem arrasto) nunca marca `arrastou`,
  // então abrir o atendimento continua funcionando normalmente.
  viewport.addEventListener('click', e => {
    if (!pagerState.arrastou) return;
    pagerState.arrastou = false;
    e.stopPropagation();
    e.preventDefault();
  }, true);

  if (!pagerResizeLigado) {
    pagerResizeLigado = true;
    // Rotação de tela / resize no meio do arrasto: a largura de referência
    // deixou de valer, então o gesto é abortado e o trilho recentralizado —
    // nunca preso num translateX de uma largura que não existe mais.
    window.addEventListener('resize', () => {
      if (!pagerState.ativo && !pagerState.animando) return;
      pagerCancelar();
    });
  }
}

// Motor genérico do slide: clona o painel antigo (por id), deixa uma função
// desenhar o novo conteúdo, anima os dois por cima um do outro. Mesma
// técnica de agendar.html, parametrizada pra servir dois níveis diferentes
// — ver as duas funções abaixo. O clone é tirado ANTES de drawFn() e só
// anexado DEPOIS: se drawFn() reescrever o innerHTML de um ancestral (caso
// da semana), o viewport antigo (e o clone nele) morreria junto.
function slidePane(direction, viewportId, paneId, drawFn) {
  if (prefersReducedMotion()) { drawFn(); return; }
  const oldPane = document.getElementById(paneId);
  const oldHeight = oldPane ? oldPane.offsetHeight : null;
  const clone = oldPane ? oldPane.cloneNode(true) : null;
  if (clone) clone.removeAttribute('id');

  drawFn();

  const viewport = document.getElementById(viewportId);
  const newPane = document.getElementById(paneId);
  if (!clone || !viewport || !newPane) return;

  clone.classList.add('agenda-pane');
  viewport.appendChild(clone);

  const newHeight = newPane.offsetHeight;
  viewport.style.height = Math.max(oldHeight, newHeight) + 'px';

  const enterFrom = direction === 'back' ? '-100%' : '100%';
  const exitTo = direction === 'back' ? '100%' : '-100%';

  newPane.classList.add('agenda-pane');
  newPane.style.transition = 'none';
  newPane.style.transform = `translateX(${enterFrom})`;
  clone.style.transform = 'translateX(0)';

  void newPane.offsetWidth;

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      // .24s (--motion-emphasized): refinamento visual pediu a troca de dia
      // "mais suave" — um tique acima do .22s anterior, mesma curva de saída.
      newPane.style.transition = 'transform .24s cubic-bezier(.22,.61,.36,1)';
      clone.style.transition = 'transform .24s cubic-bezier(.22,.61,.36,1)';
      newPane.style.transform = 'translateX(0)';
      clone.style.transform = `translateX(${exitTo})`;
    });
  });

  let cleaned = false;
  function cleanup() {
    if (cleaned) return;
    cleaned = true;
    newPane.removeEventListener('transitionend', onTransitionEnd);
    newPane.classList.remove('agenda-pane');
    newPane.style.transition = '';
    newPane.style.transform = '';
    viewport.style.height = '';
    clone.remove();
  }
  function onTransitionEnd(e) {
    if (e.target === newPane && e.propertyName === 'transform') cleanup();
  }
  newPane.addEventListener('transitionend', onTransitionEnd);
  setTimeout(cleanup, 500);
}

// Semana muda (prevWeek/nextWeek/Hoje pra outro dia/escolha no calendário de
// mês): a faixa de dias inteira troca de data, então desliza junto com a
// grade — o cabeçalho de setas/mês fica de fora (é controle, não conteúdo).
function renderAgendaTransition(direction) {
  slidePane(direction, 'agendaWeekViewport', 'agendaWeekPane', renderAgenda);
}

// continua sendo o motor da troca de SEMANA (renderAgendaTransition), que é

function openMonthCalendar(initialDate) {
  let viewDate = new Date(initialDate);
  viewDate.setDate(1);

  const overlay = document.createElement('div');
  overlay.className = 'month-cal-overlay';
  document.body.appendChild(overlay);

  function closeCal() {
    overlay.remove();
  }

  function renderCal() {
    const monthLabelRaw = viewDate.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
    const monthLabel = monthLabelRaw.charAt(0).toUpperCase() + monthLabelRaw.slice(1);
    const firstOfMonth = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
    const gridStart = startOfWeek(firstOfMonth);
    const cells = Array.from({ length: 42 }, (_, i) => {
      const d = new Date(gridStart);
      d.setDate(d.getDate() + i);
      return d;
    });

    overlay.innerHTML = `
      <div class="month-cal-card">
        <div class="month-cal-header">
          <button class="arrow" id="calPrevMonth">‹</button>
          <div class="day-label">${monthLabel}</div>
          <button class="arrow" id="calNextMonth">›</button>
        </div>
        <div class="month-cal-weekdays">
          ${WEEKDAY_LABELS.map(l => `<div>${l}</div>`).join('')}
        </div>
        <div class="month-cal-grid">
          ${cells.map(d => {
            const inMonth = d.getMonth() === viewDate.getMonth();
            const today = sameDay(d, new Date());
            const selected = sameDay(d, initialDate);
            const hasAppts = state.appointments.some(a => sameDay(new Date(a.starts_at), d));
            return `
              <button class="month-cal-day ${selected ? 'selected' : ''} ${today ? 'is-today' : ''} ${hasAppts ? 'has-appts' : ''} ${!inMonth ? 'is-outside' : ''}" data-date="${d.toISOString()}">
                <span>${d.getDate()}</span>
                <div class="wd-dot"></div>
              </button>
            `;
          }).join('')}
        </div>
      </div>
    `;

    overlay.querySelector('#calPrevMonth').onclick = (e) => {
      e.stopPropagation();
      viewDate.setMonth(viewDate.getMonth() - 1);
      renderCal();
    };
    overlay.querySelector('#calNextMonth').onclick = (e) => {
      e.stopPropagation();
      viewDate.setMonth(viewDate.getMonth() + 1);
      renderCal();
    };
    overlay.querySelectorAll('.month-cal-day').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        state.agendaDate = new Date(btn.dataset.date);
        closeCal();
        render();
      };
    });
  }

  overlay.onclick = closeCal;
  renderCal();
}

function clientStats(clientId) {
  const client = state.clients.find(c => c.id === clientId);
  const history = state.appointments
    .filter(a => a.client?.id === clientId)
    .sort((a, b) => new Date(b.starts_at) - new Date(a.starts_at));
  const visits = history.length;
  // Valor sempre por appointmentRevenue() — fonte canônica única. Somar
  // `service.price` cru aqui fazia o perfil discordar da Insights num
  // atendimento multi-serviço (o `service_id` legado guarda um serviço só).
  const spent = history.reduce((sum, a) => sum + appointmentRevenue(a), 0);
  const lastVisit = history[0] ? fmtDate(history[0].starts_at) : '—';
  const lastVisitIso = history[0]?.starts_at || null;
  const isVip = !!client?.vip;

  // Próximo atendimento: derivado do mesmo state.appointments já carregado,
  // sem coluna nova — mesmo espírito de lastVisit. Só usado no cartão da
  // lista (migração da tela Clientes pro Design System, 03/08/2026).
  const upcoming = state.appointments
    .filter(a => a.client?.id === clientId && new Date(a.starts_at) > new Date())
    .sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
  const nextVisitIso = upcoming[0]?.starts_at || null;

  const freq = {};
  history.forEach(a => {
    const name = a.service?.name;
    if (name) freq[name] = (freq[name] || 0) + 1;
  });
  const favoriteServices = Object.entries(freq)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 3)
    .map(([name]) => name);

  return { history, visits, spent, lastVisit, lastVisitIso, nextVisitIso, isVip, favoriteServices };
}

async function abrirCliente(clientId, avatarEl) {
  state.clientsScrollTop = window.scrollY;
  const origem = avatarEl ? avatarEl.getBoundingClientRect() : null;

  state.selectedClientId = clientId;
  state.clientHistoryExpanded = false;
  state.clientDiagCollapsed = true;
  if (!state.clientPhotos[clientId]) await loadClientPhotos(clientId);
  if (!state.clientQuestionnaires[clientId]) await loadClientQuestionnaires(clientId);

}

// Shared element: o avatar da lista "vira" o avatar do perfil. Um clone
// posicionado sobre o antigo é animado até a posição do novo — a técnica é a
// mesma do slide da agenda (clonar, animar por cima, descartar), porque o
// #app é reescrito inteiro e o elemento original deixa de existir.
const MORPH_MS = 260;
function morphAvatar(origem) {
  // Sobras de uma animação anterior que não chegou ao fim (toque rápido em
  // sequência, app minimizado no meio) — se ficarem, viram avatares soltos.
  document.querySelectorAll('.avatar-morph').forEach(el => el.remove());

  const destinoEl = document.querySelector('.ph-avatar-wrap .avatar-round');
  if (!destinoEl) return;
  const destino = destinoEl.getBoundingClientRect();

  const clone = destinoEl.cloneNode(true);
  clone.classList.add('avatar-morph');
  clone.style.left = origem.left + 'px';
  clone.style.top = origem.top + 'px';
  clone.style.width = origem.width + 'px';
  clone.style.height = origem.height + 'px';
  clone.style.fontSize = '15px';
  document.body.appendChild(clone);
  destinoEl.style.opacity = '0';

  let limpo = false;
  const limpar = () => {
    if (limpo) return;
    limpo = true;
    clone.remove();
    destinoEl.style.opacity = '';
  };

  const anim = clone.animate(
    [
      { left: origem.left + 'px', top: origem.top + 'px', width: origem.width + 'px', height: origem.height + 'px', fontSize: '15px' },
      { left: destino.left + 'px', top: destino.top + 'px', width: destino.width + 'px', height: destino.height + 'px', fontSize: '24px' },
    ],
    { duration: MORPH_MS, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' }
  );
  anim.onfinish = limpar;
  anim.oncancel = limpar;
  // Rede de segurança: em aba sem composição a animação não corre e
  // `onfinish` nunca dispara — sem isso o avatar de verdade ficaria
  // invisível (opacity 0) e o clone preso na tela pra sempre.
  setTimeout(limpar, MORPH_MS + 120);
}

function bindClientsToolbar() {
  const cliContextClear = document.getElementById('cliContextClear');
  if (cliContextClear) cliContextClear.onclick = () => { state.clientContext = null; renderClients(); };

  const field = document.getElementById('searchField');
  const input = document.getElementById('clientSearchInput');
  const clear = document.getElementById('clientSearchClear');

  // O anel de foco e o placeholder que some usam :focus-within do próprio
  // .o-search-field — não precisam mais de classe amarrada em onfocus/onblur
  // (docs/04 §SearchField corrigiu essa lacuna: antes o foco só funcionava
  // com JS). .has-text continua em JS porque CSS não sabe "o campo tem
  // texto" sem :has(), que não é usado em mais nenhum lugar do projeto.
  if (input) {
    field.classList.toggle('has-text', !!input.value);
    input.oninput = () => {
      state.clientSearch = input.value;
      field.classList.toggle('has-text', !!input.value);
      renderClientsList();
    };
  }
  if (clear) {
    // mousedown, não click: o blur do input dispararia antes do click e o
    // botão já teria sumido junto com a classe .has-text.
    clear.onmousedown = (e) => {
      e.preventDefault();
      clearClientSearch();
    };
  }

  document.querySelectorAll('#clientFilterChips .o-chip').forEach(chip => {
    chip.onclick = () => {
      state.clientFilter = chip.dataset.filter;
      document.querySelectorAll('#clientFilterChips .o-chip')

  if (sortBtn) sortBtn.onclick = openClientSortSheet;
}

// Espelha normalize_ie_phone() do banco (RPC find_or_create_client): tira
// tudo que não é dígito, remove 00353/353 se já vier com o código, remove
// zero(s) à esquerda e prepende 353. Garante que "087 123 4567",
// "+353 87 1234567" e "3538712 34567" apontem pro mesmo valor — é o valor
// usado pra achar duplicata ANTES de gravar (a checagem em si é só leitura;
// quem decide de fato find-or-create é sempre a RPC, no banco).
function normalizeIePhone(phone) {
  const digits = (phone || '').replace(/[^0-9]/g, '');
  if (!digits) return null;
  const semCodigo = digits.replace(/^(00353|353)/, '').replace(/^0+/, '');
  return '353' + semCodigo;
}
