<script>
// ── CONFIGURAÇÃO ─────────────────────────────────────────────
const SUPABASE_URL = 'https://gsagtsxkhqlpxuvrijgw.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_c2b9NNovCdvQ64_Sfiiecg_H_5M0FIg';
const { SALON_TZ, OPEN_HOUR, CLOSE_HOUR, SLOT_MINUTES, CLOSED_WEEKDAYS } = window.OrenziSalon;
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const SALON_ADDRESS = '54 Middle Abbey St, North City, Dublin 1, D01 E2X4';
const SALON_MAPS_URL = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(SALON_ADDRESS);
const SALON_WHATSAPP_URL = 'https://wa.me/353833287560';

// ── Fuso do salão — idêntico a agendar.html ───────────────────
function salonOffsetMinutes(date) {
  const dtf = new Intl.DateTimeFormat('en-US', { timeZone: SALON_TZ, hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const p = {}; for (const part of dtf.formatToParts(date)) p[part.type] = part.value;
  const asUTC = Date.UTC(+p.year, p.month - 1, +p.day, (+p.hour) % 24, +p.minute, +p.second);
  return (asUTC - Math.floor(date.getTime() / 1000) * 1000) / 60000;
}
function salonTimeToInstant(dateStr, minutesFromMidnight) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const naive = Date.UTC(y, m - 1, d, 0, 0, 0) + minutesFromMidnight * 60000;
  const off1 = salonOffsetMinutes(new Date(naive));
  let inst = new Date(naive - off1 * 60000);
  const off2 = salonOffsetMinutes(inst);
  if (off2 !== off1) inst = new Date(naive - off2 * 60000);
  return inst;
}
function salonClock(date) { return date.toLocaleTimeString('pt-BR', { timeZone: SALON_TZ, hour: '2-digit', minute: '2-digit' }); }
function salonToday() { return new Intl.DateTimeFormat('en-CA', { timeZone: SALON_TZ }).format(new Date()); }
const MONTHS_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DOW_SHORT = ['dom','seg','ter','qua','qui','sex','sáb'];
function addDaysIso(iso, n) { const [y,m,d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m-1, d+n)).toISOString().slice(0,10); }
function isoWeekday(iso) { const [y,m,d] = iso.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)).getUTCDay(); }
function fmtDayFull(iso) { if (!iso) return '—'; const [y,m,d] = iso.split('-').map(Number); const dow = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'][isoWeekday(iso)]; return `${dow}, ${d} de ${MONTHS_PT[m-1].toLowerCase()}`; }
function fmtDayShort(iso) { if (!iso) return '—'; const [,m,d] = iso.split('-').map(Number); return `${DOW_SHORT[isoWeekday(iso)]}, ${d} ${MONTHS_PT[m-1].slice(0,3).toLowerCase()}`; }
function formatMoney(n) { const num = Number(n); return num % 1 === 0 ? `€${num}` : `€${num.toFixed(2)}`; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const AVAILABILITY_DAYS = 60;
const PAST_TOLERANCE_MS = 5 * 60 * 1000;

// ── CARREGAMENTO ─────────────────────────────────────────────
async function loadBooking() {
  if (!MANAGE_TOKEN) { state.loading = false; state.loadError = 'invalid_token'; renderAll(); return; }
  state.loading = true; renderAll();
  const { data, error } = await sb.rpc('get_booking_by_token', { p_token: MANAGE_TOKEN });
  state.loading = false;
  if (error) {
    const code = (error.message || '').trim();
    state.loadError = (code === 'invalid_token' || code === 'expired_token') ? code : 'other';
    renderAll();
    return;
  }
  state.booking = data;
  renderAll();
}

// ── DISPONIBILIDADE (reagendar) — profissional e duração FIXAS ───────────
// Mesma get_busy_slots pública que agendar.html usa (nunca staff_work_blocks,
// que não é anon-executável). staff_id agora vem de get_booking_by_token.
async function fetchBusySlots(staffId, fromIso, toIso) {
  const from = salonTimeToInstant(fromIso, 0).toISOString();
  const to = salonTimeToInstant(toIso, 24 * 60).toISOString();
  const { data, error } = await sb.rpc('get_busy_slots', { p_staff_id: staffId, p_from: from, p_to: to });
  if (error) throw error;
  return (data || []).map(b => ({ start: new Date(b.busy_start).getTime(), end: new Date(b.busy_end).getTime() }));
}

const DAY_STATUS_LABEL = { available: 'Disponível', full: 'Lotado', closed: 'Fechado' };
const DAY_STATUS_MARK = { full: 'L', closed: 'F' };

// get_busy_slots público não exclui o próprio agendamento (só staff_work_blocks
// aceita p_exclude_id, e ela não é anon-executable). A exclusão é feita aqui,
// no frontend, por CONTENÇÃO — não por igualdade exata — usando o próprio
// starts_at/ends_at que get_booking_by_token já devolveu: qualquer bloco
// ocupado que caiba inteiramente dentro da janela atual do agendamento é o
// PRÓPRIO bloco, e é removido antes de calcular conflito. A RPC de commit
// (reschedule_booking_by_token) continua sendo a autoridade final — isto é
// só para a tela não mostrar o próprio horário como indisponível.
function buildAvailability(busy, fromIso, days, durationMin, ownStartMs, ownEndMs) {
  const filtered = busy.filter(b => !(b.start >= ownStartMs && b.end <= ownEndMs));
  const out = new Map();
  const nowMs = Date.now() - PAST_TOLERANCE_MS;
  for (let i = 0; i < days; i++) {
    const iso = addDaysIso(fromIso, i);
    if (CLOSED_WEEKDAYS.includes(isoWeekday(iso))) { out.set(iso, { status: 'closed', slots: [] }); continue; }
    const slots = [];
    for (let m = OPEN_HOUR * 60; m + durationMin <= CLOSE_HOUR * 60; m += SLOT_MINUTES) {
      const start = salonTimeToInstant(iso, m);
      const startMs = start.getTime();
      if (startMs < nowMs) continue;
      const endMs = startMs + durationMin * 60000;
      const conflict = filtered.some(b => startMs < b.end && endMs > b.start);
      if (!conflict) slots.push({ label: salonClock(start), minutes: m, start });
    }
    out.set(iso, { status: slots.length ? 'available' : 'full', slots });
  }
  return out;
}

function availabilityKey() { return state.booking ? state.booking.staff.id + '|' + state.booking.total_duration_minutes : null; }

async function ensureAvailability(force) {
  const key = availabilityKey();
  if (!key) return;
  if (!force && state.availability.key === key && state.availability.days) return;
  state.availability = { key, loading: true, error: null, days: null };
  renderStepBody(); renderCTA();

  const fromIso = salonToday();
  const toIso = addDaysIso(fromIso, AVAILABILITY_DAYS - 1);
  try {
    const busy = await fetchBusySlots(state.booking.staff.id, fromIso, toIso);
    if (availabilityKey() !== key) return;
    const days = buildAvailability(
      busy, fromIso, AVAILABILITY_DAYS, state.booking.total_duration_minutes,
      new Date(state.booking.starts_at).getTime(), new Date(state.booking.ends_at).getTime()
    );
    state.availability = { key, loading: false, error: null, days };
  } catch (e) {
    console.error('gerenciar.ensureAvailability', e);
    state.availability = { key, loading: false, error: e.message || 'erro', days: null };
  }
  renderStepBody(); renderCTA();
}

function dayInfo(iso) { const d = state.availability.days; if (!d) return { status: 'closed', slots: [] }; return d.get(iso) || { status: 'closed', slots: [] }; }
function slotAt(iso, label) { return dayInfo(iso).slots.find(s => s.label === label) || null; }
function nextAvailableIso(afterIso) {
  const d = state.availability.days; if (!d) return null;
  for (const [iso, info] of d) { if (info.status === 'available' && (!afterIso || iso > afterIso)) return iso; }
  return null;
}

function renderShell() {

  }
  const showBack = ['reschedule-intro', 'reschedule-picker', 'reschedule-review', 'cancel-intro'].includes(state.step);
  const titles = {
    manage: '', 'reschedule-intro': 'Reagendar', 'reschedule-picker': 'Nova data e horário',
    'reschedule-review': 'Confirmar', 'reschedule-success': '', 'cancel-intro': 'Cancelar',
    'cancel-success': '',
  };
  topbar.innerHTML = `
    <button class="bk-back${showBack ? '' : ' is-hidden'}" id="backBtn" aria-label="Voltar" ${showBack ? '' : 'tabindex="-1"'}>${ICONS.chevronLeft}</button>
    <span class="bk-sub-title">${esc(titles[state.step] || '')}</span>`;
  if (showBack) document.getElementById('backBtn').addEventListener('click', goBack);
}

function goBack() {
  if (state.step === 'reschedule-picker' || state.step === 'reschedule-intro') { state.step = 'manage'; state.conflict = null; }
  else if (state.step === 'reschedule-review') { state.step = 'reschedule-picker'; }
  else if (state.step === 'cancel-intro') { state.step = 'manage'; }
  renderAll();
  document.getElementById('main').scrollTop = 0;
}

function goTo(step) {
  state.step = step;
  state.commitError = null;
  renderAll();
  document.getElementById('main').scrollTop = 0;
  if (step === 'reschedule-picker') ensureAvailability();
}

// .ics a partir da resposta de get_booking_by_token — sem token dentro do
// arquivo, mesmo helper conceitual do Success de agendar.html (reimplementado
// aqui porque os dois arquivos não compartilham módulo — mesmo padrão de
// duplicação já aceito entre painel.html/painel_demo.html neste projeto).
function downloadIcs() {
  const b = state.booking;
  if (!b) return;
  const stamp = d => new Date(d).toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  const nomes = (b.services || []).map(s => s.name).join(' + ');
  const lines = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Orenzi Atelier//Booking//PT',
    'BEGIN:VEVENT',
    `UID:${b.booking_reference}@orenzi`,
    `DTSTAMP:${stamp(Date.now())}`,
    `DTSTART:${stamp(b.starts_at)}`,
    `DTEND:${stamp(b.ends_at)}`,
    `SUMMARY:Orenzi Ateliê — ${nomes}`,
    `DESCRIPTION:Agendamento ${b.booking_reference} com ${b.staff ? b.staff.name : ''}`,
    `LOCATION:${SALON_ADDRESS}`,
    'END:VEVENT', 'END:VCALENDAR',
  ];
  const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `orenzi-${b.booking_reference}.ics`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

const TIME_GROUPS = [{label:'Manhã',test:m=>m<12*60},{label:'Tarde',test:m=>m>=12*60&&m<18*60},{label:'Noite',test:m=>m>=18*60}];
function timeGridHtml() {

    const next = nextAvailableIso(iso);
    return `<div class="bk-state-block"><div class="sb-icon">${ICONS.calendar}</div>
      <p><strong style="color:var(--color-text)">Nenhum horário disponível</strong><br>em ${esc(fmtDayShort(iso))}.</p>

function renderReschedulePicker() {

function selectDate(iso) { state.selectedDateIso = iso; state.selectedTime = null; renderStepBody(); renderCTA(); }
function bindReschedulePicker() {

function openCalendar() { const base = state.selectedDateIso || salonToday(); const [y,m] = base.split('-').map(Number); state.calendarMonth = {y, m:m-1}; state.calFeedback=''; state.subview='calendar'; renderAll(); }
function closeCalendar() { state.subview = null; renderAll(); }
function renderCalendar() {
  const {y,m} = state.calendarMonth;
  const from = salonToday(); const to = addDaysIso(from, AVAILABILITY_DAYS-1);
  const startDow = new Date(Date.UTC(y,m,1)).getUTCDay();
  const daysInMonth = new Date(Date.UTC(y,m+1,0)).getUTCDate();
  let cells = '';
  for (let i=0;i<startDow;i++) cells += '<button class="mg-day is-empty" disabled aria-hidden="true"></button>';
  for (let d=1; d<=daysInMonth; d++) {
    const iso = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let status;
    if (iso < from || iso > to) status = 'closed'; else status = dayInfo(iso).status;
    const notAvail = status !== 'available';
    const isToday = iso === from, isSel = iso === state.selectedDateIso;
    cells += `<button type="button" class="mg-day${notAvail?' st-'+status:''}${isToday?' is-today':''}${isSel?' is-selected':''}" data-cal-day="${iso}" data-cal-status="${status}"
      aria-label="${fmtDayFull(iso)}${notAvail?', '+DAY_STATUS_LABEL[status]:''}">${d}${notAvail?`<span class="mg-mark">${DAY_STATUS_MARK[status]}</span>`:''}</button>`;
  }
  const prevDisabled = `${y}-${String(m+1).padStart(2,'0')}-01` <= from.slice(0,7)+'-01';
  const nextDisabled = `${y}-${String(m+1).padStart(2,'0')}` >= to.slice(0,7);
  return `<div class="bk-cal-legend"><span class="lg-item"><span class="lg-swatch avail">●</span>Disponível</span><span class="lg-item"><span class="lg-swatch full">L</span>Lotado</span><span class="lg-item"><span class="lg-swatch closed">F</span>Fechado</span></div>
    <div class="bk-month-nav"><button type="button" id="calPrevBtn" aria-label="Mês anterior" ${prevDisabled?'disabled':''}>${ICONS.chevronLeft}</button><span class="mn-label">${MONTHS_PT[m]} de ${y}</span><button type="button" id="calNextBtn" aria-label="Próximo mês" ${nextDisabled?'disabled':''}>${ICONS.chevronRight}</button></div>
    <div class="bk-month-grid">${DOW_SHORT.map(d=>`<div class="mg-dow">${d}</div>`).join('')}${cells}</div>
    <div class="bk-cal-feedback${state.calFeedback?' is-visible':''}" role="status">${esc(state.calFeedback)}</div>`;
}
function bindCalendar() {
  const prev = document.getElementById('calPrevBtn'), next = document.getElementById('calNextBtn');
  if (prev && !prev.disabled) prev.addEventListener('click', () => stepMonth(-1));
  if (next && !next.disabled) next.addEventListener('click', () => stepMonth(1));
  document.querySelectorAll('[data-cal-day]').forEach(b => b.addEventListener('click', () => {
    const st = b.dataset.calStatus, iso = b.dataset.calDay;
    if (st !== 'available') { state.calFeedback = st === 'closed' ? 'O salão não abre neste dia.' : `Sem horários disponíveis em ${fmtDayShort(iso)}.`; renderStepBody(); return; }
    selectDate(iso); closeCalendar();
  }));
}
function stepMonth(delta) { let {y,m}=state.calendarMonth; m+=delta; if(m<0){m=11;y--;}else if(m>11){m=0;y++;} state.calendarMonth={y,m}; state.calFeedback=''; renderStepBody(); }

// ── RESCHEDULE — REVIEW ───────────────────────────────────────
function renderRescheduleReview() {
  const b = state.booking;
  return `<h1 class="bk-title">Revise a alteração</h1>
    ${state.commitError ? `<div class="bk-commit-error" role="alert">${esc(state.commitError)}</div>` : ''}
    ${state.conflict ? renderConflictBlock() : `
    <span class="bk-eyebrow">De</span>
    <div class="bk-summary"><div class="bk-summary-row"><span class="sr-label">Data</span><span class="sr-value">${esc(fmtDayShort(b.starts_at.slice(0,10)))}</span></div>
      <div class="bk-summary-row"><span class="sr-label">Horário</span><span class="sr-value">${esc(salonClock(new Date(b.starts_at)))}</span></div></div>
    <span class="bk-eyebrow">Para</span>
    <div class="bk-summary"><div class="bk-summary-row"><span class="sr-label">Data</span><span class="sr-value">${esc(fmtDayShort(state.selectedDateIso))}</span></div>
      <div class="bk-summary-row"><span class="sr-label">Horário</span><span class="sr-value">${esc(state.selectedTime)}</span></div></div>
    <p class="bk-block-text" style="color:var(--color-neutral-600)">Profissional: ${esc(b.staff.name)} (não muda)</p>`}`;
}
function renderConflictBlock() {
  const alts = state.conflict.alternatives;
  return `<div role="alert"><div class="sb-icon" style="background:var(--color-accent-2-100);color:var(--color-accent-2-700)">${ICONS.warn}</div>
    <p style="font-weight:600;color:var(--color-text);margin-bottom:4px">Esse horário acabou de ser reservado.</p>
    <p class="bk-conflict-sub">Seus dados foram mantidos. Escolha outro horário para concluir.</p>
    ${alts.length ? `<div class="bk-alt-list">${alts.map(a => `<button type="button" class="bk-alt-row" data-alt-date="${a.iso}" data-alt-time="${a.time}">
      <span><span class="alt-time">${a.time}</span><span class="alt-day">${esc(fmtDayShort(a.iso))}</span></span><span class="alt-go">Usar horário</span></button>`).join('')}</div>` : ''}</div>`;
}
function bindRescheduleReview() {
  if (state.conflict) {
    document.querySelectorAll('[data-alt-date]').forEach(row => row.addEventListener('click', () => {
      state.selectedDateIso = row.dataset.altDate; state.selectedTime = row.dataset.altTime; state.conflict = null;
      renderStepBody(); renderCTA();
    }));
  }
}

async function commitReschedule() {
  if (state.committing) return;
  state.committing = true; state.commitError = null; state.conflict = null;
  renderStepBody(); renderCTA();

  const slot = slotAt(state.selectedDateIso, state.selectedTime);
  if (!state.rescheduleRequestKey) state.rescheduleRequestKey = crypto.randomUUID();

  let res, body;
  try {
    res = await sb.functions.invoke('booking-orchestrator', {
      body: { event_type: 'rescheduled', request_key: state.rescheduleRequestKey,
        payload: { token: MANAGE_TOKEN, new_starts_at: slot.start.toISOString() } },
    });
    body = res.data; if (res.error) throw res.error;
  } catch (e) {
    state.committing = false;
    state.commitError = 'Não foi possível concluir agora. Tente de novo em instantes.';
    console.error('gerenciar.commitReschedule', e && e.message);
    renderStepBody(); renderCTA();
    return;
  }
  state.committing = false;

  if (!body || !body.operation_success) {
    const code = body && body.code;
    if (code === 'slot_conflict') {
      await ensureAvailability(true);
      state.conflict = { alternatives: (dayInfo(state.selectedDateIso).slots || []).slice(0,3).map(s => ({ iso: state.selectedDateIso, time: s.label })) };
      renderStepBody(); renderCTA();
      return;
    }
    state.commitError = code === 'outside_booking_window'
      ? 'Esse horário não está mais dentro do expediente. Escolha outro.'
      : 'Não foi possível concluir agora. Tente de novo em instantes.';
    renderStepBody(); renderCTA();
    return;
  }

  state.rescheduleResult = { booking: body.booking, emailSuccess: body.email_success };
  state.rescheduleRequestKey = null;
  state.step = 'reschedule-success';
  renderAll();
}

function renderRescheduleSuccess() {
  const r = state.rescheduleResult;
  const emailNote = r.emailSuccess === true
    ? 'Você receberá os detalhes atualizados deste agendamento por e-mail.'
    : `Guarde a referência: <strong>${esc(state.booking.booking_reference)}</strong>.`;
  return `<div class="bk-success-wrap"><div class="bk-success-icon">${ICONS.check}</div>
    <h1 class="bk-success-title">Agendamento reagendado</h1>
    <div class="bk-success-email-note">${emailNote}</div>
    <div class="bk-summary" style="text-align:left">
      <div class="bk-summary-row"><span class="sr-label">Nova data</span><span class="sr-value">${esc(fmtDayShort(r.booking.starts_at.slice(0,10)))}</span></div>
      <div class="bk-summary-row"><span class="sr-label">Novo horário</span><span class="sr-value">${esc(salonClock(new Date(r.booking.starts_at)))}</span></div>
      <div class="bk-summary-row"><span class="sr-label">Profissional</span><span class="sr-value">${esc(r.booking.staff ? r.booking.staff.name : '')}</span></div>
    </div></div>`;
}

// ── CANCEL — INTRO ─────────────────────────────────────────────
function renderCancelIntro() {
  const b = state.booking;
  const svcs = b.services || [];
  const within = b.within_free_cancellation_window;
  return `<h1 class="bk-title">Cancelar este agendamento?</h1>
    ${state.commitError ? `<div class="bk-commit-error" role="alert">${esc(state.commitError)}</div>` : ''}
    <div class="bk-summary">
      <div class="bk-summary-row"><span class="sr-label">Serviço${svcs.length>1?'s':''}</span><span class="sr-value">${svcs.length>1?svcs.length+' serviços':esc((svcs[0]||{}).name||'—')}</span></div>
      <div class="bk-summary-row"><span class="sr-label">Data</span><span class="sr-value">${esc(fmtDayShort(b.starts_at.slice(0,10)))}</span></div>
      <div class="bk-summary-row"><span class="sr-label">Horário</span><span class="sr-value">${esc(salonClock(new Date(b.starts_at)))}</span></div>
      <div class="bk-summary-row"><span class="sr-label">Profissional</span><span class="sr-value">${esc(b.staff?b.staff.name:'—')}</span></div>
    </div>
    <div class="bk-block">
      <div class="bk-block-title">${within ? 'Cancelamento gratuito' : 'Fora do prazo de cancelamento gratuito'}</div>
      <div class="bk-block-text">${within
        ? 'Você está dentro do prazo de 12 horas. Nenhuma taxa será cobrada.'
        : 'Este cancelamento está fora do prazo gratuito definido na política aceita para este agendamento.'}</div>
    </div>
    <div class="bk-block">
      <div class="bk-block-title">Mudou de ideia?</div>
      <div class="bk-block-text">Você também pode entrar em contato diretamente com o Orenzi Ateliê.</div>
      <a class="bk-block-link" href="${SALON_WHATSAPP_URL}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block">Entrar em contato</a>
    </div>`;
}

async function commitCancel() {
  if (state.committing) return;
  state.committing = true; state.commitError = null;
  renderStepBody(); renderCTA();
  if (!state.cancelRequestKey) state.cancelRequestKey = crypto.randomUUID();

  let res, body;
  try {
    res = await sb.functions.invoke('booking-orchestrator', {
      body: { event_type: 'cancelled', request_key: state.cancelRequestKey, payload: { token: MANAGE_TOKEN } },
    });
    body = res.data; if (res.error) throw res.error;
  } catch (e) {
    state.committing = false;
    state.commitError = 'Não foi possível concluir agora. Tente de novo em instantes.';
    console.error('gerenciar.commitCancel', e && e.message);
    renderStepBody(); renderCTA();
    return;
  }
  state.committing = false;

  if (!body || !body.operation_success) {
    state.commitError = 'Não foi possível concluir agora. Tente de novo em instantes.';
    renderStepBody(); renderCTA();
    return;
  }

  state.cancelResult = { booking: body.booking, emailSuccess: body.email_success };
  state.cancelRequestKey = null;
  state.booking.status = 'cancelled';
  state.step = 'cancel-success';
  renderAll();
}

function renderCancelSuccess() {
  const r = state.cancelResult;
  const svcs = r.booking.services || [];
  const emailNote = r.emailSuccess === true
    ? 'Você receberá os detalhes deste cancelamento por e-mail.'
    : `Guarde a referência: <strong>${esc(r.booking.booking_reference)}</strong>.`;
  return `<div class="bk-success-wrap"><div class="bk-success-icon">${ICONS.check}</div>
    <h1 class="bk-success-title">Agendamento cancelado</h1>
    <div class="bk-success-email-note">${emailNote}</div>
    <div class="bk-summary" style="text-align:left">
      <div class="bk-summary-row"><span class="sr-label">Serviço${svcs.length>1?'s':''}</span><span class="sr-value">${svcs.length>1?svcs.length+' serviços':esc((svcs[0]||{}).name||'—')}</span></div>
      <div class="bk-summary-row"><span class="sr-label">Profissional</span><span class="sr-value">${esc(r.booking.staff?r.booking.staff.name:'')}</span></div>
      <div class="bk-summary-row"><span class="sr-label">Data</span><span class="sr-value">${esc(fmtDayShort(r.booking.starts_at.slice(0,10)))}</span></div>
      <div class="bk-summary-row"><span class="sr-label">Horário</span><span class="sr-value">${esc(salonClock(new Date(r.booking.starts_at)))}</span></div>
    </div>
    <div class="bk-booking-ref">Agendamento ${esc(r.booking.booking_reference)}</div></div>`;
}

// ── ROTEAMENTO ───────────────────────────────────────────────
function renderStepBody() {
  const steps = document.getElementById('steps');
  if (state.subview === 'calendar') { steps.innerHTML = renderCalendar(); bindCalendar(); return; }
  if (state.subview === 'policy') { steps.innerHTML = renderPolicyFull(); return; }

  if (state.loading) { steps.innerHTML = loadingHtml(); return; }
  if (state.loadError === 'invalid_token') { steps.innerHTML = invalidTokenHtml(); return; }
  if (state.loadError === 'expired_token') { steps.innerHTML = expiredTokenHtml(); return; }
  if (state.loadError) { steps.innerHTML = otherLoadErrorHtml(); document.getElementById('retryLoadBtn').addEventListener('click', loadBooking); return; }

  let html = '';
  if (state.step === 'manage') html = renderManage();
  else if (state.step === 'reschedule-intro') html = renderRescheduleIntro();
  else if (state.step === 'reschedule-picker') html = renderReschedulePicker();
  else if (state.step === 'reschedule-review') html = renderRescheduleReview();
  else if (state.step === 'reschedule-success') html = renderRescheduleSuccess();
  else if (state.step === 'cancel-intro') html = renderCancelIntro();
  else if (state.step === 'cancel-success') html = renderCancelSuccess();
  steps.innerHTML = html;
  steps.classList.remove('bk-step-enter'); void steps.offsetWidth; steps.classList.add('bk-step-enter');

  if (state.step === 'manage') bindManage();
  else if (state.step === 'reschedule-picker') bindReschedulePicker();
  else if (state.step === 'reschedule-review') bindRescheduleReview();
}

function renderCTA() {
  const wrap = document.getElementById('ctaWrap');
  if (state.subview || state.loading || state.loadError) { wrap.innerHTML = ''; return; }

  if (state.step === 'manage') {
    // Confirmado: as 3 ações. Cancelado: nenhuma (nem Add to Calendar — um
    // compromisso que não vai mais acontecer não deveria entrar na agenda
    // pessoal). "Agendar novamente" fica fora desta fase — pré-selecionar
    // serviços em agendar.html sem PII/token na querystring é plumbing real,
    // não um botão que eu deveria fingir que funciona.
    if (state.booking.status !== 'confirmed') { wrap.innerHTML = ''; return; }
    wrap.innerHTML = `
      <button type="button" class="bk-cta" id="reschedBtn">Reagendar</button>
      <button type="button" class="bk-cta secondary" id="addCalBtn">Adicionar ao calendário</button>
      <button type="button" class="bk-cta secondary" id="cancelBtn">Cancelar agendamento</button>`;
    document.getElementById('reschedBtn').addEventListener('click', () => goTo('reschedule-intro'));
    document.getElementById('addCalBtn').addEventListener('click', downloadIcs);
    document.getElementById('cancelBtn').addEventListener('click', () => goTo('cancel-intro'));
    return;
  }
  if (state.step === 'reschedule-intro') {
    wrap.innerHTML = `<button type="button" class="bk-cta" id="ctaBtn">Continuar</button><button type="button" class="bk-cta secondary" id="backBtn2">Voltar</button>`;
    document.getElementById('ctaBtn').addEventListener('click', () => goTo('reschedule-picker'));
    document.getElementById('backBtn2').addEventListener('click', goBack);
    return;
  }
  if (state.step === 'reschedule-picker') {
    const av = state.availability;
    const ready = !av.loading && !av.error && state.selectedDateIso && state.selectedTime;
    wrap.innerHTML = `<button type="button" class="bk-cta" id="ctaBtn" ${ready?'':'disabled'}>${av.loading ? 'Carregando…' : (ready ? 'Continuar' : 'Escolha um horário')}</button>`;
    if (ready) document.getElementById('ctaBtn').addEventListener('click', () => goTo('reschedule-review'));
    return;
  }
  if (state.step === 'reschedule-review') {
    if (state.conflict) { wrap.innerHTML = ''; return; }
    wrap.innerHTML = `<button type="button" class="bk-cta" id="ctaBtn" ${state.committing?'disabled':''} ${state.committing?'aria-busy="true"':''}>${state.committing?'Confirmando…':'Confirmar novo horário'}</button>`;
    if (!state.committing) document.getElementById('ctaBtn').addEventListener('click', commitReschedule);
    return;
  }
  if (state.step === 'reschedule-success') {
    wrap.innerHTML = `<button type="button" class="bk-cta" id="ctaBtn">Voltar para seu agendamento</button>`;
    document.getElementById('ctaBtn').addEventListener('click', async () => {
      state.step = 'manage'; state.selectedDateIso = null; state.selectedTime = null;
      state.availability = { key: null, loading: false, error: null, days: null };
      await loadBooking();   // refetch — status/was_rescheduled vêm do servidor, não do state local
    });
    return;
  }
  if (state.step === 'cancel-intro') {
    wrap.innerHTML = `<button type="button" class="bk-cta" id="ctaBtn" ${state.committing?'disabled':''} ${state.committing?'aria-busy="true"':''}>${state.committing?'Confirmando…':'Confirmar cancelamento'}</button><button type="button" class="bk-cta secondary" id="backBtn2">Voltar</button>`;
    if (!state.committing) document.getElementById('ctaBtn').addEventListener('click', commitCancel);
    document.getElementById('backBtn2').addEventListener('click', goBack);
    return;
  }
  wrap.innerHTML = '';
}

// ── INIT ─────────────────────────────────────────────────────
loadBooking();
</script>
</body>
</html>
