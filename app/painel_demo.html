  .nc-phone-field {
    display: flex; align-items: center; min-height: var(--touch-target-min);
    padding: 0 var(--space-3-5);
    border: var(--border-width) solid var(--color-divider); border-radius: var(--radius-sm);
    background: var(--color-surface);
    transition: border-color var(--motion-fast) var(--ease-standard), box-shadow var(--motion-fast) var(--ease-standard);
  }
  .nc-phone-field:focus-within { border-color: var(--color-accent-600); box-shadow: var(--focus-ring); }
  .nc-phone-prefix {
    font-size: var(--text-body-size); font-weight: var(--text-body-strong-weight);
    color: var(--color-neutral-700); flex-shrink: 0;
  }
  .nc-phone-divider {
    width: var(--border-width); align-self: stretch; margin: var(--space-2) var(--space-3);
    background: var(--color-divider); flex-shrink: 0;
  }
  /* Seletor de id (não .nc-phone-field input): input[type=tel] tem uma
     regra legada global (linha ~1198 — pílula própria com fundo, borda,
     raio, margin-bottom, usada por telefone/data/e-mail soltos no resto
     do painel) com a MESMA especificidade de ".nc-phone-field input";
     quem vence é só quem vem depois no arquivo, e a global vem depois —
     por isso o input desenhava a segunda cápsula por cima mesmo com
     border:none/background:none aqui. Um id sempre vence sem precisar de
     !important nem tocar a regra global (que outras telas ainda usam). */
  #ncPhoneLocal {
    flex: 1; width: auto; min-width: 0; margin-bottom: 0;
    padding: var(--space-3) 0; border: none; border-radius: 0; background: none;
    font-family: var(--font-body); font-size: var(--text-body-size); color: var(--color-text);
  }
  #ncPhoneLocal:focus { outline: none; box-shadow: none; }
  .nc-notes-count { margin-top: var(--space-1); text-align: right; }
  .nc-protect-card {
    display: flex; align-items: flex-start; gap: var(--space-2-5);
    background: var(--color-accent-100); border-radius: var(--radius-md);
    padding: var(--space-3) var(--space-3-5); margin-top: var(--space-4);
  }
  .nc-protect-icon { color: var(--color-accent-700); flex-shrink: 0; margin-top: 2px; }
  .nc-protect-icon svg { width: 17px; height: 17px; }
  .nc-protect-title {
    font-size: var(--text-body-strong-size); font-weight: var(--text-body-strong-weight);
    color: var(--color-text); margin-bottom: 2px;
  }
  .nc-protect-text { font-size: var(--text-caption-size); color: var(--color-neutral-700); line-height: var(--leading-normal); }
  select {
    width: 100%; padding: 12px 14px; border-radius: 999px; border: 1px solid var(--color-divider);
    background: var(--color-neutral-100); font-family: var(--font-body); font-size: 14px;
    margin-bottom: 10px; color: var(--color-text); appearance: none;
  }
  select:disabled { opacity: 0.55; cursor: not-allowed; }
  textarea {
    width: 100%; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--color-divider);
    background: var(--color-neutral-100); font-family: var(--font-body); font-size: 14px;
    margin-bottom: 10px; color: var(--color-text); resize: vertical; min-height: 70px;
  }
  input[type=date], input[type=text], input[type=tel], input[type=email] {
    width: 100%; padding: 12px 14px; border-radius: 999px; border: 1px solid var(--color-divider);
    background: var(--color-neutral-100); font-family: var(--font-body); font-size: 14px;
    margin-bottom: 10px; color: var(--color-text);
  }
  .btn {
    width: 100%; padding: 14px; border-radius: 999px; border: none; cursor: pointer;
    font-family: var(--font-body); font-weight: 700; font-size: 15px; margin-top: 8px;
  }
  .btn-primary { background: var(--color-accent); color: var(--color-bg); }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--color-neutral-700); }

  .quiz-fullscreen {
    position: fixed; top: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px; height: 100%;
    background: var(--color-bg); z-index: 20;
    display: flex; flex-direction: column; justify-content: center;
    padding: 60px 24px 40px; box-sizing: border-box;
  }
  .quiz-message {
    flex: 1; display: flex; align-items: center; justify-content: center;
    text-align: center; font-family: var(--font-heading); font-weight: 600;
    font-size: 22px; line-height: 1.4;
    animation: quizMessageIn 0.6s ease;
  }
  @keyframes quizMessageIn {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .quiz-center { margin: auto 0; width: 100%; }
  .quiz-goal-content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .quiz-subtitle { font-size: 14px; color: var(--color-neutral-600); margin-bottom: 14px; }
  /* margin-bottom em 18px, não 14: precisa bater com o respiro antes do
     primeiro rótulo da outra seção do modal (padding 14px do cartão + 4px
     do margin-top do label = 18px) — com 14 o gap colapsava pro valor
     menor e o "Cliente" ficava mais colado que o "Serviço". */
  .toggle-row { display: flex; gap: 8px; margin-bottom: 18px; }
  .toggle-row button {
    flex: 1; padding: 9px; border-radius: 999px; border: none; cursor: pointer;
    font-family: var(--font-body); font-size: 13px; font-weight: 700;
    background: var(--color-neutral-100); color: var(--color-neutral-700);
  }
  .toggle-row button.active { background: var(--color-accent); color: var(--color-bg); }

  .tag {
    display: inline-flex; align-items: center; font-size: 11px; font-weight: 700;
    padding: 4px 10px; border-radius: 999px;
  }
  .tag-accent { background: var(--color-accent-100); color: var(--color-accent-700); }
  .tag-accent-2 { background: var(--color-accent-2-100, #f0fae1); color: var(--color-accent-2-700, #56633f); }

  /* ── Wizard "Novo agendamento" (Fase 2, 06/08/2026) ────────────────────
     Substitui o formulário único por 5 etapas em tela cheia dentro da
     mesma folha — nunca outro modal/popup. Reaproveita .modal-overlay como
     scrim/BottomSheet; .o-wizard-sheet é a variante de altura cheia com
     cabeçalho fixo + corpo rolável + rodapé fixo. Primitivos vêm de
     app/ds/orenzi-components.css (.o-btn, .o-card, .o-search-field,
     .o-chip, .o-avatar, .o-divider, .o-field, .o-badge) — o que segue é só
     a anatomia própria do wizard. */
  .o-wizard-sheet {
    display: flex; flex-direction: column;
    background: var(--color-bg); border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    width: 100%; max-width: var(--canvas-max-width);
    height: min(92vh, 800px);
    overflow: hidden;
    animation: modalSheetIn .3s cubic-bezier(.34,1.56,.64,1);
  }
  .o-wizard-head {
    display: flex; align-items: center; gap: var(--space-2);
    padding: var(--space-4) var(--space-4) 0; flex-shrink: 0;
  }
  .o-wizard-back svg { transform: rotate(180deg); }
  .o-wizard-titles { flex: 1; min-width: 0; padding: 0 var(--space-1); }
  .o-wizard-title {
    font-family: var(--font-heading); font-size: var(--text-title-3-size);
    font-weight: var(--text-title-3-weight); color: var(--color-text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .o-wizard-subtitle {
    font-size: var(--text-caption-size); color: var(--color-neutral-600); margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .o-wizard-dots {
    display: flex; justify-content: center; align-items: center; gap: 6px;
    padding: var(--space-3) 0 var(--space-2); flex-shrink: 0;
  }
  .o-wizard-dot {
    width: 6px; height: 6px; border-radius: var(--radius-full);
    background: var(--color-neutral-300);
    transition: background-color var(--motion-fast) var(--ease-standard), width var(--motion-fast) var(--ease-standard);
  }
  .o-wizard-dot.is-active { width: 16px; background: var(--color-accent-700); }
  .o-wizard-dot.is-done { background: var(--color-accent-600); }
  .o-wizard-body { flex: 1 1 auto; overflow-y: auto; padding: 0 var(--space-5) var(--space-4); }
  .o-wizard-footer { flex-shrink: 0; padding: var(--space-3) var(--space-5) calc(var(--space-5) + var(--safe-bottom)); }

  .o-wizard-step { animation: wizStepInNext var(--motion-emphasized) var(--ease-out); }
  .o-wizard-step.is-back { animation-name: wizStepInBack; }
  @keyframes wizStepInNext {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes wizStepInBack {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .o-wizard-sheet, .o-wizard-step { animation: none; }
  }

  /* Etapa 1 · lista de clientes */
  .o-wizard-list { display: flex; flex-direction: column; gap: var(--space-2); margin-top: var(--space-3); }
  .o-wizard-section-label {
    font-size: var(--text-micro-size); font-weight: var(--text-micro-weight);
    letter-spacing: 0.04em; text-transform: uppercase; color: var(--color-neutral-600);
    margin: var(--space-3) 0 var(--space-1);
  }
  .o-wizard-client-row { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2-5) var(--space-2); }
  .o-wizard-client-row .wcr-body { flex: 1; min-width: 0; text-align: left; }
  .o-wizard-client-row .wcr-name {
    font-size: var(--text-body-strong-size); font-weight: var(--text-body-strong-weight);
    color: var(--color-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .o-wizard-client-row .wcr-phone { font-size: var(--text-caption-size); color: var(--color-neutral-600); }
  .o-wizard-client-row .wcr-chevron { color: var(--color-neutral-600); flex-shrink: 0; }
  .o-wizard-client-row .wcr-chevron svg { width: 16px; height: 16px; }

  .o-wizard-add-client {
    display: flex; align-items: center; justify-content: center; gap: var(--space-2);
    padding: var(--space-3-5); margin-top: var(--space-2); min-height: var(--touch-target-min);
    border: 1.5px dashed var(--color-divider); border-radius: var(--radius-md);
    background: transparent; color: var(--color-accent-700);
    font-family: var(--font-body); font-size: var(--text-body-strong-size); font-weight: var(--text-body-strong-weight);
    cursor: pointer; width: 100%;
    transition: background-color var(--motion-fast) var(--ease-standard), transform var(--motion-instant) var(--ease-standard);
  }
  .o-wizard-add-client:active { transform: scale(0.98); background: var(--color-accent-100); }
  .o-wizard-add-client:focus-visible { outline: none; box-shadow: var(--focus-ring); }

  /* Sub-tela "Novo cliente" (cadastro rápido) — mesmo ícone-em-círculo
     tingido que o resto do produto usa pra dar boas-vindas a uma tela
     curta (selo VIP, badge de avatar), e os campos agrupados num .o-card
     em vez de soltos na folha, batendo com o resto do wizard. */
  .o-wizard-nc-icon {
    width: 64px; height: 64px; border-radius: var(--radius-circle);
    background: var(--color-accent-100); color: var(--color-accent-700);
    display: flex; align-items: center; justify-content: center;
    margin: var(--space-3) auto var(--space-5);
  }
  .o-wizard-nc-icon svg { width: 28px; height: 28px; }

  /* Etapa 2 · serviços */
  .o-wizard-service-row { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2-5) var(--space-2); }
  .o-wizard-service-icon {
    width: 40px; height: 40px; border-radius: var(--radius-sm); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--svc-bg, var(--color-accent-100)); color: var(--svc-color, var(--color-accent-700));
  }
  .o-wizard-service-icon svg { width: 19px; height: 19px; }
  .o-wizard-service-row .wsr-body { flex: 1; min-width: 0; text-align: left; }
  .o-wizard-service-row .wsr-name { font-size: var(--text-body-strong-size); font-weight: var(--text-body-strong-weight); color: var(--color-text); }
  .o-wizard-service-row .wsr-meta { font-size: var(--text-caption-size); color: var(--color-neutral-600); }
  .o-wizard-service-row .wsr-price {
    font-family: var(--font-heading); font-weight: 700; font-size: var(--text-body-strong-size); color: var(--color-text); flex-shrink: 0;
  }

  /* Etapa 3 · calendário */
  .o-wizard-cal-head { display: flex; align-items: center; justify-content: space-between; margin: var(--space-4) 0 var(--space-3); }
  .o-wizard-cal-title { font-family: var(--font-heading); font-weight: 600; font-size: var(--text-title-3-size); color: var(--color-text); }
  .o-wizard-cal-weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr); text-align: center;
    font-size: var(--text-micro-size); color: var(--color-neutral-600); margin-bottom: var(--space-1);
  }
  .o-wizard-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .o-wizard-cal-day {
    position: relative; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; border: none; border-radius: var(--radius-sm); background: transparent; color: var(--color-text);
    font-family: var(--font-body); font-size: var(--text-caption-size); cursor: pointer;
    transition: background-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
  }
  .o-wizard-cal-day:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .o-wizard-cal-day:disabled { color: var(--color-neutral-300); cursor: not-allowed; }
  .o-wizard-cal-day.is-outside { visibility: hidden; pointer-events: none; }
  .o-wizard-cal-day.is-today { font-weight: 700; }
  .o-wizard-cal-day.is-selected { background: var(--color-accent-700); color: var(--color-bg); }
  .o-wizard-cal-day .wcd-dot { width: 5px; height: 5px; border-radius: var(--radius-full); background: transparent; }
  .o-wizard-cal-day .wcd-dot.lvl-muitos { background: var(--color-success); }
  .o-wizard-cal-day .wcd-dot.lvl-poucos { background: var(--color-accent-600); }
  .o-wizard-cal-day .wcd-dot.lvl-nenhum { background: var(--color-neutral-300); }
  .o-wizard-cal-day .wcd-dot.lvl-indisponivel { background: var(--color-accent-2); }
  .o-wizard-cal-day.is-selected .wcd-dot { background: var(--color-bg); }
  .o-wizard-cal-legend {
    display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-3); margin-top: var(--space-4);
    font-size: var(--text-micro-size); color: var(--color-neutral-600);
  }
  .o-wizard-cal-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .o-wizard-cal-legend i { width: 6px; height: 6px; border-radius: var(--radius-full); display: inline-block; }
  .o-wizard-cal-legend i.lvl-muitos { background: var(--color-success); }
  .o-wizard-cal-legend i.lvl-poucos { background: var(--color-accent-600); }
  .o-wizard-cal-legend i.lvl-nenhum { background: var(--color-neutral-300); }
  .o-wizard-cal-legend i.lvl-indisponivel { background: var(--color-accent-2); }

  /* Etapa 4 · horários */
  .o-wizard-slot-card { margin-bottom: var(--space-3); padding: var(--space-3-5) var(--space-4); animation: wizSlotIn var(--motion-standard) var(--ease-out) backwards; }
  .o-wizard-slot-card:nth-child(1) { animation-delay: 0ms; }
  .o-wizard-slot-card:nth-child(2) { animation-delay: 30ms; }
  .o-wizard-slot-card:nth-child(3) { animation-delay: 60ms; }
  .o-wizard-slot-card:nth-child(4) { animation-delay: 90ms; }
  .o-wizard-slot-card:nth-child(n+5) { animation-delay: 110ms; }
  @keyframes wizSlotIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .o-wizard-slot-card { animation: none; } }
  .o-wizard-slot-card.is-selected { border-color: var(--color-accent-700); background: var(--color-accent-100); box-shadow: var(--elevation-hover); }
  .o-wizard-slot-top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
  .o-wizard-slot-time {
    font-family: var(--font-heading); font-size: var(--text-title-2-size); font-weight: 700; color: var(--color-text);
    font-variant-numeric: tabular-nums;
  }
  .o-wizard-slot-check {
    width: 22px; height: 22px; border-radius: var(--radius-circle); border: 1.5px solid var(--color-divider);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: transparent;
    transition: background-color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
  }
  .o-wizard-slot-check svg { width: 13px; height: 13px; }
  .o-wizard-slot-card.is-selected .o-wizard-slot-check { background: var(--color-accent-700); border-color: var(--color-accent-700); color: var(--color-bg); }
  .o-wizard-slot-msg { font-size: var(--text-caption-size); color: var(--color-neutral-600); margin-top: 2px; }
  .o-wizard-slot-badge { margin-bottom: var(--space-1); }

  .o-wizard-daypreview { margin-top: var(--space-2); }
  .o-wizard-daypreview-track { position: relative; height: 28px; border-radius: var(--radius-full); background: var(--color-neutral-200); overflow: hidden; }
  .o-wizard-daypreview-busy { position: absolute; top: 0; bottom: 0; background: var(--color-neutral-300); }
  .o-wizard-daypreview-mark { position: absolute; top: -3px; bottom: -3px; width: 3px; border-radius: var(--radius-full); background: var(--color-accent-700); }
  .o-wizard-daypreview-labels { display: flex; justify-content: space-between; font-size: var(--text-micro-size); color: var(--color-neutral-600); margin-top: var(--space-1); }

  /* Etapa 5 · confirmação */
  .o-wizard-summary-row { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-2-5) 0; }
  .o-wizard-summary-row + .o-wizard-summary-row { border-top: 1px solid var(--color-divider); }
  .o-wizard-summary-icon { width: 20px; height: 20px; color: var(--color-neutral-600); flex-shrink: 0; margin-top: 1px; }
  .o-wizard-summary-icon svg { width: 100%; height: 100%; }
  .o-wizard-summary-label {
    font-size: var(--text-micro-size); font-weight: var(--text-micro-weight); letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--color-neutral-600);
  }
  .o-wizard-summary-value { font-size: var(--text-body-size); color: var(--color-text); margin-top: 1px; }
  .o-wizard-notice {
    display: flex; gap: var(--space-2); align-items: flex-start; margin-top: var(--space-4);
    padding: var(--space-3) var(--space-3-5); background: var(--color-accent-100); border-radius: var(--radius-md);
    font-size: var(--text-caption-size); color: var(--color-accent-700);
  }
  .o-wizard-notice svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }

  .o-wizard-empty { padding: var(--space-6) var(--space-3); text-align: center; color: var(--color-neutral-600); font-size: var(--text-body-size); }

  /* Entrada contextual pelo "Xh livres" da Agenda (Fase 2b, 06/08/2026) —
     tira a etapa Data quando ela já é conhecida. Banner discreto (superfície
     neutra, sem cor de destaque) pra não competir com o conteúdo da etapa;
     "Alterar" reaproveita .o-btn-ghost.o-btn-inline, nada novo. */
  .o-wizard-context-banner {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
    margin: 0 var(--space-5) var(--space-2); padding: var(--space-2-5) var(--space-3-5);
    background: var(--color-surface); border: var(--border-width) solid var(--color-divider);
    border-radius: var(--radius-md); flex-shrink: 0;
  }
  .o-wizard-context-banner-text { font-size: var(--text-caption-size); color: var(--color-neutral-600); line-height: 1.4; }
  .o-wizard-context-banner-text b { color: var(--color-text); font-weight: 600; }
  .o-wizard-context-banner .o-btn-inline { padding: 0 var(--space-3); flex-shrink: 0; }

  /* ══ Abas Clientes (03/08/2026) e Estoque (04/08/2026) — toolbar e chips
     migrados para o Design System ═══ docs/04_COMPONENT_LIBRARY.md.
     Fundo, borda, raio, cor e tipografia vêm dos primitivos (.o-card,
     .o-avatar, .o-badge, .o-chip, .o-divider, .o-search-field,
     .o-search-filter-bar, .o-chip-group-scroll, .o-card-metric-summary,
     .o-icon-btn) em app/ds/orenzi-components.css. O que segue é só a
     anatomia própria de cada tela.

     .search-field / .sort-btn / .filter-chips / .filter-chip perderam o
     último consumidor com a migração do Estoque e saíram daqui.
     .clients-toolbar e .search-clear ficam órfãs — nenhuma tela usa mais
     essas duas, mas remover classe fora do escopo explícito deste PR (só
     toolbar/chips do Estoque) fica pra próxima limpeza.

     A regra que segue valendo: a lista é redesenhada sozinha
     (renderClientsList / renderStockList) sem passar por render(), senão o
     campo de busca perde o foco a cada tecla digitada. */
  .clients-toolbar { display: flex; gap: 10px; margin-bottom: 14px; }
  .search-clear {
    display: none; border: none; background: none; padding: 0; cursor: pointer;
    color: var(--color-neutral-600); flex-shrink: 0; align-items: center;
  }
  .search-clear svg { width: 15px; height: 15px; }

  /* Resumo de 4 métricas — usa .o-card-metric-summary (padding próprio
     pra layout em coluna, ver orenzi-components.css) em vez do padding
     padrão do Card. Isto aqui é só o layout dos 4 itens dentro dele. */
  .cli-summary { display: flex; }
  .cli-summary .cs-item { flex: 1; text-align: center; min-width: 0; }
  .cli-summary .cs-icon { display: flex; justify-content: center; color: var(--color-accent-600); margin-bottom: var(--space-1); }
  .cli-summary .cs-icon svg { width: 15px; height: 15px; }
  .cli-summary .cs-val {
    font-family: var(--font-heading); font-size: var(--text-title-2-size); font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .cli-summary .cs-lbl {
    font-size: var(--text-caption-size); color: var(--color-neutral-600); margin-top: 4px; line-height: 1.3;
    padding: 0 var(--space-1);
  }

  .clients-list-label {
    font-size: var(--text-caption-size); color: var(--color-neutral-600); font-weight: 500;
    margin-bottom: var(--space-3);
  }

  /* ClientCard (docs/04 §ClientCard) — a estrutura vem de .o-card +
     .o-card-interactive (fundo, borda, raio 16, pressed, focus-visible,
     hover). Padding e separação entre cartões são mais generosos que o
     padrão do Card: correção de densidade de 04/08/2026 — o cartão
     empilha várias linhas (nome, datas, telefone, métricas) e precisa
     de mais respiro que uma linha de texto comum pra não ler como lista
     comprimida. Escopado só em .client-card — não muda .o-card em
     nenhum outro lugar do app. */
  .client-card.o-card {
    padding: var(--space-4);
    margin-bottom: var(--space-4);
  }
  .cc-top { display: flex; align-items: center; gap: var(--space-3); }
  .cc-head { flex: 1; min-width: 0; }
  .cc-name-row { display: flex; align-items: center; gap: var(--space-1); min-width: 0; }
  .cc-name {
    font-size: var(--text-body-strong-size); font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cc-name-row .o-badge { flex-shrink: 0; }
  .cc-sub {
    display: flex; align-items: center; gap: 4px;
    font-size: var(--text-caption-size); color: var(--color-neutral-600); margin-top: 3px;
  }
  .cc-sub svg { width: 12px; height: 12px; flex-shrink: 0; }
  /* Telefone é a informação mais auxiliar da linha de cima — mesmo
     tamanho e cor de .cc-sub, só um pouco mais discreto (opacidade), e
     fica por último na ordem visual: nome → datas → telefone. */
  .cc-phone { opacity: 0.85; }
  .cc-chevron { color: var(--color-neutral-600); display: flex; flex-shrink: 0; }
  .cc-chevron svg { width: 15px; height: 15px; }
  .cc-metrics { display: flex; align-items: center; gap: var(--space-5); }
  .o-divider.cc-divider { margin: var(--space-4) 0; }
  .cc-metric { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .cc-metric .ccm-icon { color: var(--color-accent-600); display: flex; flex-shrink: 0; }
  .cc-metric .ccm-icon svg { width: 14px; height: 14px; }
  .cc-metric .ccm-val { font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc-metric .ccm-lbl { font-size: var(--text-micro-size); color: var(--color-neutral-600); }
  /* Status: ponto + rótulo em texto, sempre juntos — nunca só cor
     (docs/02 §7, docs/07 §12). Preservado como está: docs/04 já chama
     esta implementação de "modelo", não converter para Badge aqui
     descaracterizaria o padrão que o resto do app deve seguir. */
  .cc-status {
    margin-left: auto; display: flex; align-items: center; gap: 5px; flex-shrink: 0;
    font-size: var(--text-caption-size); font-weight: 600; color: var(--color-neutral-600);
  }
  .cc-status .ccs-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--color-neutral-300); }
  .cc-status.is-ativa .ccs-dot { background: var(--color-success); }
  .cc-status.is-nova .ccs-dot { background: var(--color-accent-600); }
  .cc-status.is-inativa .ccs-dot { background: var(--color-neutral-300); }

  /* Folha de opções (ordenação, novo cliente) — reaproveita .modal-overlay/
     .modal-sheet, só acrescenta a lista de opções. */
  .sheet-option {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 4px;
    background: none; border: none; border-bottom: 1px solid var(--color-divider);
    font-family: var(--font-body); font-size: 14.5px; color: var(--color-text);
    cursor: pointer; text-align: left; transition: background .15s ease;
  }
  .sheet-option:last-child { border-bottom: none; }
  .sheet-option:active { background: var(--color-neutral-100); }
  .sheet-option .so-check { margin-left: auto; color: var(--color-accent-700); display: none; }
  .sheet-option .so-check svg { width: 16px; height: 16px; }
  .sheet-option.is-selected { font-weight: 700; }
  .sheet-option.is-selected .so-check { display: flex; }

  /* FAB da aba Clientes gira 45° quando a folha está aberta — o "+" vira "×"
     sem trocar de ícone. */
  .fab.is-open { transform: rotate(45deg); }
  .fab.is-open:active { transform: rotate(45deg) scale(0.93); }

  /* Clone do avatar que viaja da lista pro perfil (shared element). */
  .avatar-morph { position: fixed; z-index: 250; pointer-events: none; border-radius: 50%; }
  /* ══ Aba Estoque: painel de gestão ═══════════════════════════
     Redesenho de 03/08/2026. Mesma regra da lista de clientes: a lista é
     redesenhada sozinha (renderStockList) sem passar por render(), senão o
     campo de busca perde o foco a cada tecla digitada.

     Os quatro estados de estoque saem todos da paleta que já existe — não
     entrou cor nova. Cada estado só declara duas variáveis (--stk-color e
     --stk-bg) e todo o resto (ponto, badge, borda do cartão) lê delas. */
  /* O verde do ponto de "cliente ativa" (#4f8a5b) só valia como ponto: como
     TEXTO de badge sobre o próprio fundo tingido ele dava 3,2:1, abaixo do
     mínimo legível. Mesmo verde, escurecido até 5,0:1 — medido, não chutado. */
  .st-ok      { --stk-color: #3b6744; --stk-bg: rgba(79,138,91,0.14); }
  .st-baixo   { --stk-color: var(--color-accent-700); --stk-bg: var(--color-accent-100); }
  .st-critico { --stk-color: var(--color-accent-2-700); --stk-bg: var(--color-accent-2-100); }
  .st-sem     { --stk-color: var(--color-neutral-600); --stk-bg: var(--color-neutral-200); }

  /* Resumo em quatro cartões. Cada um é um atalho pro filtro correspondente —
     número que não leva a lugar nenhum seria enfeite. */
  .stock-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .stk-sum-card {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: var(--color-surface); border: 1px solid var(--color-divider);
    border-radius: 16px; padding: 12px; cursor: pointer;
    font-family: var(--font-body); color: var(--color-text);
    transition: transform .16s ease, background .18s ease, border-color .18s ease;
  }
  .stk-sum-card:active { transform: scale(0.98); }
  .stk-sum-card.active { border-color: var(--stk-color); background: var(--stk-bg); }
  .stk-sum-card .ssc-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--stk-color); }
  .stk-sum-card .ssc-val {
    font-family: var(--font-heading); font-weight: 600; font-size: 20px; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .stk-sum-card .ssc-lbl { font-size: 10.5px; color: var(--color-neutral-600); margin-top: 3px; line-height: 1.25; }

  .stock-value-card {
    display: flex; align-items: center; gap: 14px; background: var(--color-surface);
    border: 1px solid var(--color-divider); border-radius: 16px; padding: 16px; margin-bottom: 20px;
  }
  .stock-value-card .svc-icon {
    width: 36px; height: 36px; border-radius: 12px; background: var(--color-accent-100);
    color: var(--color-accent-700); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .stock-value-card .svc-icon svg { width: 18px; height: 18px; }
  .stock-value-card .svc-body { flex: 1; min-width: 0; }
  .stock-value-card .svc-val {
    font-family: var(--font-heading); font-weight: 600; font-size: 26px; line-height: 1.1;
    letter-spacing: -0.01em; font-variant-numeric: tabular-nums;
  }
  .stock-value-card .svc-lbl { font-size: 12px; color: var(--color-neutral-600); margin-top: 3px; }
  .stock-value-card .svc-upd {
    text-align: right; flex-shrink: 0; font-size: 10.5px; color: var(--color-neutral-600); line-height: 1.4;
  }
  .stock-value-card .svc-upd strong { display: block; font-size: 12.5px; color: var(--color-text); font-variant-numeric: tabular-nums; }

  .stock-group-label {
    display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-neutral-600);
    margin: 20px 0 10px;
  }
  .stock-group-label:first-child { margin-top: 0; }
  .stock-group-label .sgl-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--stk-color); }
  .stock-count-label { font-size: 11.5px; color: var(--color-neutral-600); font-weight: 500; margin-bottom: 10px; }

  /* Cartão de produto: mesma base do .client-card (surface + borda + raio 16),
     empilhado — identificação em cima, números embaixo. Só o urgente ganha a
     barra colorida na lateral; tingir o cartão inteiro, como a versão antiga
     fazia, competia com o badge e com a própria lista. */
  .product-card {
    background: var(--color-surface); border: 1px solid var(--color-divider);
    border-radius: 16px; padding: 12px; margin-bottom: 8px;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .product-card.is-critico, .product-card.is-sem { border-left: 3px solid var(--stk-color); }
  .product-card:active { transform: scale(0.985); }
  .pd-top { display: flex; align-items: center; gap: 12px; }
  .pd-open {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px;
    background: none; border: none; padding: 0; font-family: inherit; color: inherit;
    text-align: left; cursor: pointer;
  }
  .pd-thumb {
    width: 44px; height: 44px; border-radius: 13px; flex-shrink: 0; overflow: hidden;
    background: var(--color-accent-100); color: var(--color-accent-700);
    display: flex; align-items: center; justify-content: center;
  }
  .pd-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pd-thumb svg { width: 20px; height: 20px; }
  .pd-head { flex: 1; min-width: 0; }
  .pd-name { font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pd-sub {
    font-size: 11.5px; color: var(--color-neutral-600); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pd-code { font-variant-numeric: tabular-nums; }
  /* Estrela de favorito: 44px de área de toque com um ícone de 17px dentro. */
  .pd-fav {
    flex-shrink: 0; width: 44px; height: 44px; margin: -6px -6px -6px 0; border: none;
    background: none; cursor: pointer; color: var(--color-neutral-300);
    display: flex; align-items: center; justify-content: center;
    transition: transform .16s cubic-bezier(.34,1.56,.64,1), color .18s ease;
  }
  .pd-fav svg { width: 17px; height: 17px; }
  .pd-fav.is-on { color: var(--color-accent-700); }
  .pd-fav:active { transform: scale(0.88); }

  .pd-bottom {
    display: flex; align-items: center; gap: 10px; margin-top: 12px; padding-top: 12px;
    border-top: 1px solid var(--color-divider);
  }
  .pd-meta { flex: 1; min-width: 0; }
  .stk-badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700;
    padding: 4px 9px; border-radius: 999px; background: var(--stk-bg); color: var(--stk-color);
    white-space: nowrap;
  }
  .stk-badge .sb-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pd-min { font-size: 11px; color: var(--color-neutral-600); margin-top: 5px; }
  .pd-notes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pd-note {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
    padding: 4px 9px; border-radius: 999px; background: var(--color-neutral-200);
    color: var(--color-neutral-700);
  }
  .pd-note svg { width: 12px; height: 12px; }
  .pd-note.is-alert { background: var(--color-accent-2-100); color: var(--color-accent-2-700); }
  .pd-note.is-soft { background: var(--color-accent-100); color: var(--color-accent-700); }

  /* Contador: botões de 38px com a área de toque esticada pra 46 pelo ::after
     (o alvo mínimo confortável), e o número no meio é ele próprio um botão —
     é por ali que se digita a quantidade à mão. */
  .stock-qty { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .qty-btn {
    position: relative; width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--color-divider); background: var(--color-bg);
    color: var(--color-neutral-700); font-size: 19px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: transform .14s ease, background .14s ease, border-color .14s ease;
  }
  .qty-btn::after { content: ''; position: absolute; inset: -4px; }
  .qty-btn:active { background: var(--color-accent-100); border-color: var(--color-accent-600); transform: scale(0.9); }
  .qty-btn:disabled { opacity: .35; cursor: not-allowed; }
  .qty-num {
    min-width: 56px; height: 38px; padding: 0 2px; border: none; background: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: var(--font-body); color: var(--color-text);
    font-weight: 700; font-size: 16px; line-height: 1; font-variant-numeric: tabular-nums;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: transform .14s ease;
  }
  .qty-num:active { transform: scale(0.94); }
  .qty-unit { font-size: 9.5px; font-weight: 600; color: var(--color-neutral-600); margin-top: 3px; letter-spacing: 0.03em; }

  /* Sugestões, movimentações e estatísticas — blocos de fim de tela, todos no
     mesmo cartão surface+borda do resto do app. */
  .stock-section { margin-top: 32px; }
  .stock-section-title {
    display: flex; align-items: center; gap: 8px; font-family: var(--font-heading);
    font-weight: 600; font-size: 16px; margin-bottom: 12px;
  }
  .stock-section-title .sst-icon { color: var(--color-accent-600); display: flex; flex-shrink: 0; }
  .stock-section-title .sst-icon svg { width: 17px; height: 17px; }
  .stock-section-title .sst-count { margin-left: auto; font-family: var(--font-body); font-size: 11.5px; font-weight: 500; color: var(--color-neutral-600); }

  .suggestion-card {
    display: flex; gap: 12px; background: var(--color-surface); border: 1px solid var(--color-divider);
    border-radius: 16px; padding: 14px; margin-bottom: 8px;
  }
  .suggestion-card .sc-icon {
    width: 32px; height: 32px; border-radius: 11px; flex-shrink: 0;
    background: var(--stk-bg); color: var(--stk-color);
    display: flex; align-items: center; justify-content: center;
  }
  .suggestion-card .sc-icon svg { width: 16px; height: 16px; }
  .suggestion-card .sc-body { flex: 1; min-width: 0; }
  .suggestion-card .sc-name { font-size: 14px; font-weight: 700; }
  .suggestion-card .sc-text { font-size: 12.5px; color: var(--color-neutral-600); margin-top: 4px; line-height: 1.45; }
  .suggestion-card .sc-text strong { color: var(--color-text); font-weight: 700; }

  /* Timeline de movimentação: mesma linguagem da timeline de visitas do perfil
     da cliente (ponto + linha conectora), com o ícone dizendo o sentido. */
  .mv-day-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--color-neutral-600); margin: 16px 0 8px;
  }
  .mv-day-label:first-child { margin-top: 0; }
  .mv-item { display: flex; gap: 12px; }
  .mv-rail { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
  .mv-icon {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    background: var(--stk-bg); color: var(--stk-color);
    display: flex; align-items: center; justify-content: center;
  }
  .mv-icon svg { width: 15px; height: 15px; }
  .mv-line { flex: 1; width: 1px; background: var(--color-divider); margin: 4px 0; min-height: 10px; }
  .mv-item:last-child .mv-line { display: none; }
  .mv-body { flex: 1; min-width: 0; padding-bottom: 14px; }
  .mv-item:last-child .mv-body { padding-bottom: 0; }
  .mv-top { display: flex; align-items: baseline; gap: 8px; }
  .mv-qty { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--stk-color); flex-shrink: 0; }
  .mv-name { font-size: 14px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mv-sub { font-size: 11.5px; color: var(--color-neutral-600); margin-top: 2px; }

  .stock-stats {
    background: var(--color-surface); border: 1px solid var(--color-divider);
    border-radius: 16px; padding: 16px;
  }
  .stock-stats + .stock-stats { margin-top: 8px; }
  .stock-stats .ss-head { font-size: 11.5px; font-weight: 700; color: var(--color-neutral-600); margin-bottom: 12px; }
  .stock-stats .ss-pair { display: flex; gap: 12px; }
  .stock-stats .ss-cell { flex: 1; min-width: 0; }
  .stock-stats .ss-val {
    font-family: var(--font-heading); font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums;
  }
  .stock-stats .ss-lbl { font-size: 10.5px; color: var(--color-neutral-600); margin-top: 3px; line-height: 1.3; }

  .stock-empty-note {
    display: flex; gap: 10px; align-items: flex-start; background: var(--color-surface);
    border: 1px dashed var(--color-divider); border-radius: 16px; padding: 14px;
    font-size: 12.5px; color: var(--color-neutral-600); line-height: 1.45;
  }
  .stock-empty-note .sen-icon { color: var(--color-neutral-600); display: flex; flex-shrink: 0; margin-top: 1px; }
  .stock-empty-note .sen-icon svg { width: 16px; height: 16px; }

  /* Entrada em sequência: resumo → busca → filtros → lista. Cada bloco leva a
     própria classe com um delay inline; nada além de 220ms no último. */
  @keyframes stkEnter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .stk-enter { animation: stkEnter .2s cubic-bezier(.22,.61,.36,1) both; }

  @media (prefers-reduced-motion: reduce) {
    .stk-enter { animation: none; }
    .stk-sum-card, .qty-btn, .qty-num, .pd-fav, .product-card { transition: none; }
    .stk-sum-card:active, .qty-btn:active, .qty-num:active, .pd-fav:active, .product-card:active { transform: none; }
  }
  .avatar-round {
    border-radius: 50%; color: var(--color-bg); font-family: var(--font-heading); font-style: normal; font-weight: 600;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .profile-back {
    background: none; border: none; color: var(--color-neutral-600); font-family: var(--font-body);
    font-size: 13px; cursor: pointer; padding: 0 0 14px; display: flex; align-items: center; gap: 4px;
  }
  .profile-back svg { width: 15px; height: 15px; transform: rotate(180deg); }

  /* ── Perfil da cliente: header premium (03/08/2026) ────────────
     Avatar maior, nome como elemento tipográfico principal, tag VIP
     clicável abaixo do nome, "cliente desde" como meta discreta. */
  .profile-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .profile-header .name {
    font-family: var(--font-heading); font-weight: 600; font-size: 22px; letter-spacing: -0.01em; line-height: 1.15;
  }
  .vip-pill {
    display: inline-flex; align-items: center; gap: 5px; margin-top: 7px; border: none; cursor: pointer;
    padding: 4px 10px 4px 8px; border-radius: 999px; font-family: var(--font-body);
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
    background: var(--color-neutral-200); color: var(--color-neutral-600);
    transition: transform .18s ease, background .18s ease, color .18s ease;
  }
  .vip-pill svg { width: 11px; height: 11px; }
  .vip-pill.is-active { background: var(--color-accent-100); color: var(--color-accent-700); }
  .vip-pill:active { transform: scale(0.96); }
  .ph-meta { font-size: 12px; color: var(--color-neutral-600); margin-top: 7px; }

  .ph-avatar-wrap { position: relative; flex-shrink: 0; }
  .ph-vip-badge {
    position: absolute; bottom: -2px; right: -2px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--color-accent-700); color: #fff; display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--color-bg);
  }
  .ph-vip-badge svg { width: 10px; height: 10px; }

  .profile-actions { display: flex; gap: 10px; margin-bottom: 18px; }
  .profile-actions a {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px;
    padding: 12px; border-radius: 999px; background: var(--color-accent-100); border: none;
    color: var(--color-accent-700); font-size: 13px; font-weight: 700; text-decoration: none;
    transition: transform .18s ease, background .15s ease;
  }
  .profile-actions a svg { width: 15px; height: 15px; flex-shrink: 0; }
  .profile-actions a:active { transform: scale(0.98); background: var(--color-neutral-200); }

  .action-row {
    display: flex; align-items: center; gap: 10px; width: 100%; margin: 0 0 26px;
    background: var(--color-neutral-100); border: 1px solid var(--color-divider);
    border-radius: 14px; padding: 13px 14px; font-family: var(--font-body); font-size: 13.5px;
    font-weight: 600; color: var(--color-text); cursor: pointer;
    transition: transform .18s ease, background .15s ease;
  }
  .action-row:active { transform: scale(0.98); background: var(--color-neutral-200); }
  .action-row .ar-icon { color: var(--color-accent-700); display: flex; flex-shrink: 0; }
  .action-row .ar-icon svg { width: 17px; height: 17px; }
  .action-row .ar-text { flex: 1; text-align: left; }
  .action-row .ar-chevron { color: var(--color-neutral-600); display: flex; flex-shrink: 0; }
  .action-row .ar-chevron svg { width: 14px; height: 14px; }

  .stat-row {
    display: flex; background: var(--color-surface); border: 1px solid var(--color-divider);
    border-radius: 16px; padding: 18px 4px; margin-bottom: 8px;
  }
  .stat-row .stat { flex: 1; text-align: center; }
  .stat-row .stat .stat-icon { display: flex; justify-content: center; color: var(--color-accent-600); margin-bottom: 6px; }
  .stat-row .stat .stat-icon svg { width: 16px; height: 16px; }
  .stat-row .stat .val { font-family: var(--font-heading); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat-row .stat .lbl { font-size: 10.5px; font-weight: 500; color: var(--color-neutral-600); margin-top: 3px; letter-spacing: 0.01em; }
  .stat-row .stat .stat-sub { font-size: 9.5px; color: var(--color-neutral-600); margin-top: 1px; }
  .stat-row .divider { width: 1px; background: var(--color-divider); }

  /* ── Perfil: seções (Diagnóstico/Fotos/Favoritos/Histórico) ────
     Título uniforme (ícone + texto) pras quatro áreas, hierarquia por
     espaçamento vertical em vez de caixa por caixa ("menos caixas, mais
     hierarquia" — pedido do Raphael no redesign). */
  .profile-section { margin-top: 32px; }
  .profile-section:first-of-type { margin-top: 0; }
  .profile-section-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
  .profile-section-title .pst-left { display: flex; align-items: center; gap: 8px; }
  .profile-section-title .pst-icon { color: var(--color-accent-600); display: flex; flex-shrink: 0; }
  .profile-section-title .pst-icon svg { width: 17px; height: 17px; }
  .profile-section-title .pst-text { font-family: var(--font-heading); font-weight: 600; font-size: 15px; }
  .profile-section-title .pst-meta { font-size: 11.5px; color: var(--color-accent-700); font-weight: 700; flex-shrink: 0; }

  /* ── Diagnóstico: card tingido, colapsável, chips soltos ────── */
  /* ── Diagnóstico: cabeçalho no padrão de "Infos do questionário"
     (.action-row), dropdown que desliza aberto/fechado por JS — precisa
     ser JS porque o toggle não pode passar por render() (reescreve o
     innerHTML inteiro e mata qualquer transição CSS em andamento). */
  .diag-card-head.action-row { margin-bottom: 10px; }
  .diag-card-head .dc-chevron {
    color: var(--color-neutral-600); display: flex; flex-shrink: 0;
    transform: rotate(90deg); transition: transform .2s ease;
  }
  .diag-card-head .dc-chevron svg { width: 14px; height: 14px; }
  .diag-card-head.is-open .dc-chevron { transform: rotate(-90deg); }
  .diag-card-body-wrap { overflow: hidden; transition: max-height .3s cubic-bezier(.4,0,.2,1); }
  .diag-card-body { background: var(--color-neutral-100); border-radius: 16px; padding: 16px; }

  .hair-field { margin-bottom: 16px; }
  .hair-field:last-child { margin-bottom: 0; }
  .hair-field-label { font-size: 12.5px; color: var(--color-neutral-600); font-weight: 500; margin-bottom: 8px; }
  .hair-chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .hair-chip {
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--color-divider);
    background: var(--color-surface); color: var(--color-neutral-600); font-family: var(--font-body);
    font-size: 12.5px; font-weight: 600; cursor: pointer;
    transition: transform .12s ease, background .18s ease, color .18s ease, border-color .18s ease;
  }
  .hair-chip.active { background: var(--color-accent-100); border-color: var(--color-accent-100); color: var(--color-accent-700); }
  .hair-chip:active { transform: scale(0.96); }

  .fav-tags { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ── Histórico: timeline vertical ──────────────────────────── */
  .visit-timeline { display: flex; flex-direction: column; }
  .timeline-item {
    display: flex; align-items: flex-start; gap: 12px; position: relative; cursor: pointer;
    padding: 11px 8px; margin: 0 -8px; border-radius: 12px; transition: background-color .15s ease;

  .timeline-item:active { background: var(--color-neutral-100); }
  .ti-date {
    width: 40px; flex-shrink: 0; padding-top: 1px; display: flex; flex-direction: column; align-items: center;

  .ti-date .ti-day {

  .ti-date .ti-mon { font-size: 9.5px; font-weight: 700; letter-spacing: 0.04em; color: var(--color-accent-700); text-transform: uppercase; }
  .ti-date .ti-year { font-size: 9px; color: var(--color-neutral-600); margin-top: 1px; }
  .ti-marker { position: relative; width: 8px; align-self: stretch; display: flex; justify-content: center; flex-shrink: 0; }
  .ti-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--color-accent-600); margin-top: 6px; position: relative; z-index: 1; }
  .ti-line { position: absolute; top: 15px; bottom: -15px; width: 1px; background: var(--color-divider); left: 50%; transform: translateX(-50%); }
  .timeline-item:last-child .ti-line { display: none; }
  .ti-body { flex: 1; min-width: 0; }

  .see-more-btn {
    display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%;
    background: none; border: none; color: var(--color-accent-700); font-family: var(--font-body);
    font-size: 13px; font-weight: 700; padding: 14px 0 4px; cursor: pointer;
  }
  .see-more-btn svg { width: 13px; height: 13px; transform: rotate(90deg); }
  /* Recolher aponta pra cima — o chevron nasce apontando pra direita. */
  .see-more-btn.is-less svg { transform: rotate(-90deg); }

  /* ── Fotos do cabelo: galeria horizontal + estado vazio convidativo ── */
  .photo-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .photo-scroll::-webkit-scrollbar { display: none; }
  .photo-scroll .photo-tile { width: 92px; height: 92px; flex-shrink: 0; }
  .photo-add-chip {
    width: 92px; height: 92px; flex-shrink: 0; border-radius: 14px; cursor: pointer;
    border: 1.5px dashed var(--color-neutral-300); color: var(--color-neutral-600);
    display: flex; align-items: center; justify-content: center;
    transition: transform .18s ease, border-color .18s ease;
  }
  .photo-add-chip svg { width: 22px; height: 22px; }
  .photo-add-chip:active { transform: scale(0.96); }
  .photo-empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    padding: 32px 16px; border-radius: 16px; border: 1.5px dashed var(--color-neutral-300);
    background: var(--color-neutral-100); cursor: pointer; text-align: center;
    transition: transform .18s ease, border-color .18s ease;
  }
  .photo-empty-state:active { transform: scale(0.99); }

  /* ── EmptyState genérico (UX Polish Sprint 2) ──────────────────────
     Generaliza .photo-empty-state pra listas de primeira vez, busca sem
     resultado e outros vazios sem foto envolvida. Ver docs/04 §EmptyState
     e docs/09 §10/11. */
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: var(--space-6);
    padding: var(--space-8) var(--space-4) var(--space-4);
  }
  /* Dentro de um cartão que já tem padding próprio (ex.: .history-card em
     Insights) — sem isto o respiro somava e ficava desproporcional. */
  .empty-state.is-compact { padding: var(--space-2) var(--space-3) var(--space-1); gap: var(--space-4); }
  .es-icon { display: flex; align-items: center; justify-content: center; color: var(--color-neutral-700); }
  .es-icon svg { width: 24px; height: 24px; }
  /* Glow só nos EmptyStates com ação primária embaixo (Clientes, Estoque) —
     o calor baixo funciona como aceno silencioso pra ação; sem botão, o
     mesmo glow pareceria prometer algo que a tela não entrega. */
  .es-icon.is-glow { position: relative; width: 72px; height: 72px; color: var(--color-accent-700); }
  .es-icon.is-glow::before {
    content: ""; position: absolute; inset: 0; border-radius: var(--radius-circle);
    background: radial-gradient(circle, var(--color-accent-100) 0%, transparent 70%);
  }
  .es-icon.is-glow svg { position: relative; }
  .es-text { display: flex; flex-direction: column; gap: var(--space-2-5); max-width: 280px; }
  .es-title {
    font-family: var(--font-body); font-size: var(--text-body-strong-size); font-weight: 500;
    line-height: var(--leading-relaxed); color: var(--color-text); margin: 0;
  }
  .es-caption {
    font-size: var(--text-caption-size); line-height: var(--leading-relaxed);
    color: var(--color-neutral-600); margin: 0;
  }
  .empty-state .btn { max-width: 280px; margin-top: 0; }
  .empty-state .see-more-btn { margin-top: 0; padding-top: 0; width: auto; }

  /* Agenda vazia — "vazio temporário" (docs/02 §10): frase curta e neutra,
     sem ícone, sem ação. Fica dentro de #timelineEl (não no cabeçalho) de
     propósito — assim atualiza tanto no render cheio quanto no caminho leve
     de troca de dia (renderAgendaGridTransition), que só reescreve esse nó. */
  .agenda-empty-note {
    text-align: center; font-size: var(--text-caption-size); color: var(--color-neutral-600);
    padding: var(--space-8) 0 var(--space-2);

  .photo-empty-state .pes-icon { color: var(--color-neutral-600); margin-bottom: 4px; }
  .photo-empty-state .pes-icon svg { width: 26px; height: 26px; }
  .photo-empty-state .pes-title { font-size: 13.5px; font-weight: 700; color: var(--color-text); }
  .photo-empty-state .pes-sub { font-size: 11.5px; color: var(--color-neutral-600); }
  .photo-hint { font-size: 11.5px; color: var(--color-neutral-600); margin-top: 8px; text-align: center; }

  .photo-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px;
  }
  .photo-tile, .photo-add-tile {
    aspect-ratio: 1; border-radius: 14px; overflow: hidden; cursor: pointer; position: relative;
  }
  .photo-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-add-tile {
    background: var(--color-neutral-100); border: 2px dashed var(--color-neutral-300);

  }
  .photo-delete-btn {

    background: color-mix(in srgb, #201e1d 55%, transparent); border: none; color: #fff;
    font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .photo-delete-btn svg { width: 13px; height: 13px; }
  .lightbox-overlay {

  .lightbox-overlay img { max-width: 92vw; max-height: 88vh; border-radius: 10px; }

</style>

<script>
// ── CONFIGURAÇÃO ─────────────────────────────────────────────
const SUPABASE_URL = 'https://gsagtsxkhqlpxuvrijgw.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_c2b9NNovCdvQ64_Sfiiecg_H_5M0FIg';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const state = { tab: 'inicio', appointments: [], clients: [], staff: [], services: [], products: [], bookingVisits: [], agendaDate: new Date(), selectedClientId: null, selectedApptId: null, clientPhotos: {}, apptPhotos: {}, viewQuestionnaire: null, quiz: { step: 0, clientId: null, answers: {} }, insightsTrendMonths: 6, insightsIndicatorPeriod: 'month', clientSearch: '', clientFilter: 'todos', clientSort: 'recentes', clientsScrollTop: 0, movements: [], stockMovExpanded: false, stockSearch: '', stockFilter: 'todos', stockSort: 'atencao', userLabel: '', enteringApptId: null };

const STAFF_COLORS = [
  { bg: '#edefe4', border: '#7c8468', text: '#4c5439' },
  { bg: '#f7e7e7', border: '#b23a3a', text: '#8a2a2a' },
  { bg: '#efe9db', border: '#a89572', text: '#5f5238' },
  { bg: '#e4e8e1', border: '#5f7a6b', text: '#39493f' },
];
function colorForId(id) {
  if (!id) return STAFF_COLORS[0];
  let hash = 0;
  for (const ch of id) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
  return STAFF_COLORS[hash % STAFF_COLORS.length];
}
// Cor do booking por categoria do serviço — não mais por profissional. Com
// só a Juliane atendendo, colorar por `staff.id` sempre devolvia a mesma cor
// pra tudo (o id da profissional nunca muda), e a agenda inteira saía
// monocromática. Paleta fixa por categoria (não hash), pra ela aprender a
// reconhecer de relance — evita o vermelho de --color-accent-2, que já é a
// cor de "isso precisa de atenção" no resto do painel (estoque baixo, agenda
// lotada).
const CATEGORY_COLORS = {
  'Coloração':   { bg: '#f5e6d3', border: '#c4863a', text: '#8f5f26' },
  'Corte':       { bg: '#e4e8e1', border: '#5f7a6b', text: '#39493f' },
  'Alisamento':  { bg: '#efe9db', border: '#a89572', text: '#5f5238' },
  'Tratamentos': { bg: '#edefe4', border: '#7c8468', text: '#4c5439' },
  'Outros':      { bg: '#ede4ea', border: '#8a6b8f', text: '#5a4560' },
};
const CATEGORY_COLOR_FALLBACK = Object.values(CATEGORY_COLORS);
function colorForService(serviceId) {
  const category = state.services.find(s => s.id === serviceId)?.category;
  if (category && CATEGORY_COLORS[category]) return CATEGORY_COLORS[category];
  if (!category) return CATEGORY_COLOR_FALLBACK[0];
  // Categoria nova que ainda não ganhou cor fixa na tabela acima: cai num
  // hash estável, pra não quebrar nem repetir a cor de outra à toa.
  let hash = 0;
  for (const ch of category) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
  return CATEGORY_COLOR_FALLBACK[hash % CATEGORY_COLOR_FALLBACK.length];
}
// Usado pelas animações feitas em JS (slide da agenda, pop-up de modal) —
// as em CSS puro já respeitam @media (prefers-reduced-motion: reduce) sozinhas.
function prefersReducedMotion() {
  return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}
const app = document.getElementById('app');

// Lista de técnicas disponível pro seletor no detalhe do agendamento — expanda aqui conforme necessário.
const TECHNIQUE_OPTIONS = ['Morena iluminada', 'Babylights'];

// Opções do diagnóstico do cabelo, no perfil do cliente.
const HAIR_THICKNESS_OPTIONS = ['Fino', 'Médio', 'Grosso'];
const HAIR_DENSITY_OPTIONS = ['Pouco', 'Médio', 'Muito'];
const HAIR_POROSITY_OPTIONS = ['Baixa', 'Média', 'Alta'];
const HAIR_ELASTICITY_OPTIONS = ['Normal', 'Sensível'];

function hairSegmentedHtml(field, options, current) {
  return `
    <div class="hair-chip-row" data-hair-field="${field}">
      ${options.map(opt => `<button type="button" class="hair-chip ${current === opt ? 'active' : ''}" data-value="${opt}">${opt}</button>`).join('')}
    </div>
  `;
}

function initials(name) {
  return name.trim().split(/\s+/).slice(0, 2).map(w => w[0].toUpperCase()).join('');
}
function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

}

  const t = document.getElementById('toast');

  setTimeout(() => t.classList.remove('show'), 3200);
}

// ── CARREGAMENTO DE DADOS ────────────────────────────────────
async function loadAppointments() {
  const { data, error } = await sb
    .from('appointments')
    .select(`
      id, starts_at, ends_at, status, notes, technique, product_used, oxidant_used, pause_time, color_formula, created_at, source,
      client:client_id ( id, name, phone ),
      staff:staff_id ( id, name ),
      service:service_id ( id, name, price )
    `)
    .neq('status', 'cancelled')
    .order('starts_at');
  if (error) { console.error(error); return; }
  state.appointments = data;
}

async function loadBookingVisits() {
  const { data, error } = await sb.from('booking_visits').select('id, created_at').order('created_at');
  if (error) { console.error(error); return; }
  state.bookingVisits = data;
}

async function loadClients() {
  const { data, error } = await sb.from('clients').select('*').order('name');
  if (error) { console.error(error); return; }
  state.clients = data;
}

async function loadStaff() {
  const { data, error } = await sb.from('staff').select('*').order('name');
  if (error) { console.error(error); return; }
  state.staff = data;
}

// Quem realmente atende. `state.staff` traz as cinco porque as inativas são
// mantidas por causa do histórico de agendamentos — usar a lista crua pra medir
// capacidade dava um denominador cinco vezes maior que o salão, e no modal

// Redimensiona pra no máximo 1600px no lado maior e converte pra JPEG (qualidade 82%) —
// reduz bastante o tamanho do arquivo sem perda visível de qualidade.
async function compressImage(file, maxDim = 1600, quality = 0.82) {
  const bitmap = await createImageBitmap(file);
  let { width, height } = bitmap;
  if (width > maxDim || height > maxDim) {
    const scale = maxDim / Math.max(width, height);
    width = Math.round(width * scale);
    height = Math.round(height * scale);
  }
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  canvas.getContext('2d').drawImage(bitmap, 0, 0, width, height);
  return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
}

  showToast('Enviando foto…');

  const path = `${clientId}/${Date.now()}.jpg`;

  render();
}

    </div>
  `;
}

function minutesUntil(iso) {
  const diff = (new Date(iso) - new Date()) / 60000;
  return Math.max(0, Math.round(diff));
}

function occupancyPct(staffId, dayAppts) {
  const workingMinutes = WORK_MINUTES_PER_DAY;
  const bookedMinutes = dayAppts
    .filter(a => a.staff?.id === staffId)
    .reduce((sum, a) => sum + (new Date(a.ends_at) - new Date(a.starts_at)) / 60000, 0);
  return Math.min(100, Math.round((bookedMinutes / workingMinutes) * 100));
}

function formatCurrency(n) {
  const v = Number(n) || 0;
  return '€' + v.toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function appointmentRevenue(a) {
  return Number(a.service?.price || 0);
}

function serviceDurationMinutes(serviceId) {
  const svc = state.services.find(s => s.id === serviceId);
  return svc ? Number(svc.duration_minutes || 0) : 0;
}

function startOfWeekMonday(date) {
  const d = new Date(date);
  const day = d.getDay(); // 0 dom .. 6 sáb
  const diff = (day === 0 ? -6 : 1) - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

function appointmentsOnDate(date) {
  const ds = date.toDateString();
  return state.appointments.filter(a => new Date(a.starts_at).toDateString() === ds);
}

function tomorrowAppointments() {
  const t = new Date();
  t.setDate(t.getDate() + 1);
  return appointmentsOnDate(t);
}

const STATUS_LABELS = {
  confirmed: 'Confirmado',
  pending: 'Pendente',
  completed: 'Concluído',
  done: 'Concluído',
  no_show: 'Não compareceu',
  cancelled: 'Cancelado',
};
function statusLabel(status) {
  if (!status) return 'Confirmado';
  return STATUS_LABELS[status] || (status.charAt(0).toUpperCase() + status.slice(1));
}
function statusClass(status) {
  if (status === 'completed' || status === 'done') return 'st-done';
  // Cancelado/não-compareceu caíam no mesmo verde de "confirmado" por
  // omissão — inofensivo enquanto só existia texto, mas o novo indicador
  // por ponto (bookings curtos) depende dessa distinção pra não mentir
  // visualmente sobre um agendamento problemático. hoje `loadAppointments()`
  // já filtra `status != 'cancelled'` do banco, então isso só é alcançável
  // por no_show ou por um item cancelado que ainda esteja em memória.
  if (status === 'cancelled' || status === 'no_show') return 'st-urgent';
  return 'st-confirmed';
}

function emptyStateHtml({ icon, glow = false, compact = false, title, caption = '', cta = '' }) {

        ${caption ? `<p class="es-caption">${caption}</p>` : ''}
      </div>
      ${cta}

}

// ── Aba Clientes: status, filtros e ordenação ────────────────
// Nada disso vem do banco — é tudo derivado de `appointments` e de
// `clients.created_at`, pra não inventar coluna nova.
const CLIENT_NEW_DAYS = 30;      // cadastrada há pouco → "Nova"
const CLIENT_INACTIVE_DAYS = 60; // sem aparecer há tempo → "Inativa"
const CLIENT_FREQUENT_VISITS = 5;

function daysSince(iso) {
  if (!iso) return Infinity;
  return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
}

function clientStatus(client, lastVisitIso) {
  if (daysSince(client.created_at) <= CLIENT_NEW_DAYS) return 'nova';
  if (daysSince(lastVisitIso) > CLIENT_INACTIVE_DAYS) return 'inativa';
  return 'ativa';
}

// Junta cliente + métricas uma vez só: filtrar, ordenar e desenhar o cartão
// precisam dos mesmos números, e clientStats() varre todos os agendamentos.
function clientsWithStats() {
  return state.clients.map(c => {
    const s = clientStats(c.id);
    return { c, ...s, status: clientStatus(c, s.lastVisitIso) };
  });
}

function filteredSortedClients() {
  const termo = (state.clientSearch || '').trim().toLowerCase();
  let rows = clientsWithStats();

  if (termo) {
    rows = rows.filter(r => {
      const alvo = `${r.c.name || ''} ${r.c.phone || ''} ${r.c.email || ''}`.toLowerCase();
      return alvo.includes(termo);
    });
  }

  const filtro = state.clientFilter || 'todos';
  if (filtro === 'vip') rows = rows.filter(r => r.isVip);
  else if (filtro === 'recentes') rows = rows.filter(r => daysSince(r.lastVisitIso) <= CLIENT_NEW_DAYS);
  else if (filtro === 'frequentes') rows = rows.filter(r => r.visits >= CLIENT_FREQUENT_VISITS);
  else if (filtro === 'inativos') rows = rows.filter(r => r.status === 'inativa');

  const ordem = state.clientSort || 'recentes';
  const porNome = (a, b) => (a.c.name || '').localeCompare(b.c.name || '', 'pt-BR');
  rows.sort((a, b) => {
    if (ordem === 'nome') return porNome(a, b);
    if (ordem === 'gasto') return b.spent - a.spent || porNome(a, b);
    if (ordem === 'visitas') return b.visits - a.visits || porNome(a, b);
    if (ordem === 'vip') return (b.isVip ? 1 : 0) - (a.isVip ? 1 : 0) || porNome(a, b);
    // 'recentes': quem veio por último primeiro; quem nunca veio vai pro fim.
    return daysSince(a.lastVisitIso) - daysSince(b.lastVisitIso) || porNome(a, b);
  });
  return rows;
}
const MONTH_ABBR = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
function fmtDateShort(iso) {
  const d = new Date(iso);
  return { day: String(d.getDate()).padStart(2, '0'), mon: MONTH_ABBR[d.getMonth()], year: String(d.getFullYear()) };
}
function daysAgoLabel(iso) {
  const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if (days <= 0) return 'hoje';
  if (days === 1) return 'há 1 dia';
  return `há ${days} dias`;
}
// Par de daysAgoLabel pra data futura — usado no "Próximo atendimento" do
// cartão de cliente (migração da tela Clientes, 03/08/2026).
function daysUntilLabel(iso) {
  const days = Math.ceil((new Date(iso).getTime() - Date.now()) / 86400000);
  if (days <= 0) return 'hoje';
  if (days === 1) return 'amanhã';
  return `em ${days} dias`;
}

// ── componente genérico: lista de barras horizontais ─────────
function distributionBarsHtml(rows, opts = {}) {
  const { formatValue = v => String(v) } = opts;
  const max = Math.max(1, ...rows.map(r => r.value));
  return rows.map(r => `
    <div class="dist-row ${r.highlight ? 'is-current' : ''}">
      <div class="dr-label">${r.label}</div>
      <div class="dr-track"><div class="dr-fill" data-target-width="${Math.round((r.value / max) * 100)}"></div></div>
      <div class="dr-val">${formatValue(r.value)}</div>
    </div>
  `).join('');
}

function animateCounters(root) {
  root.querySelectorAll('[data-count-to]').forEach(el => {
    const to = Number(el.dataset.countTo);
    const prefix = el.dataset.countPrefix || '';
    const suffix = el.dataset.countSuffix || '';
    if (!isFinite(to) || to === 0) { el.textContent = prefix + '0' + suffix; return; }
    const duration = 600;
    const start = performance.now();
    function tick(now) {
      const p = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      const val = Math.round(to * eased);
      el.textContent = prefix + val.toLocaleString('pt-BR') + suffix;
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}
function animateFills(root) {
  root.querySelectorAll('.dr-fill, .adc-bar-fill').forEach(el => {
    requestAnimationFrame(() => { el.style.width = el.dataset.targetWidth + '%'; });
  });
}

// como será minha semana?"

function dayAggregate(dateAppts) {
  const sorted = dateAppts.slice().sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
  const count = dateAppts.length;
  const first = sorted.length ? fmtTime(sorted[0].starts_at) : '—';
  const last = sorted.length ? fmtTime(sorted[sorted.length - 1].starts_at) : '—';
  const staffCount = Math.max(1, profissionaisAtivos().length);
  const capacityMinutes = staffCount * WORK_MINUTES_PER_DAY;
  const bookedMinutes = dateAppts.reduce((sum, a) => sum + serviceDurationMinutes(a.service?.id), 0);
  const freeMinutes = Math.max(0, capacityMinutes - bookedMinutes);
  const freeSlots = Math.floor(freeMinutes / 60);
  const occPct = capacityMinutes ? Math.min(100, Math.round((bookedMinutes / capacityMinutes) * 100)) : 0;
  let statusText = 'Agenda saudável', statusClassName = '';
  if (occPct >= 80) { statusText = 'Agenda praticamente lotada'; statusClassName = 'is-busy'; }
  else if (occPct <= 30) { statusText = 'Muitos horários disponíveis'; statusClassName = 'is-quiet'; }
  return { count, first, last, freeSlots, occPct, statusText, statusClassName };
}

function dayPanoramaCardHtml({ title, icon, date, dateAppts, emptyNote, quietNote }) {
  if (date && !isSalonOpenDay(date)) {

  }
  const agg = dayAggregate(dateAppts);
  if (!agg.count) {

        <div class="pc-empty">${emptyNote}</div>
      </div>
    `;
  }
  return `
    <div class="panorama-card">
      <div class="pc-head">
        <div class="pc-title"><span class="pc-icon">${icon}</span>${title}</div>
        <div class="pc-status ${agg.statusClassName}">${agg.statusText}</div>

        <div class="as-item"><div class="as-val">${agg.freeSlots}</div><div class="as-lbl">Livres</div></div>
      </div>
      <div class="adc-bar-track"><div class="adc-bar-fill" data-target-width="${agg.occPct}"></div></div>
      ${quietNote && agg.occPct <= 30 ? `<div class="pc-note">${quietNote}</div>` : ''}
    </div>
  `;
}

const WEEKDAY_FULL_LABELS = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
const WEEKDAY_LONG_LABELS = ['Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado', 'Domingo'];
// Dias em que o salão não abre — window.OrenziSalon (shared/salon.js) é a
// fonte única, mesma usada pelo agendamento online.
const { CLOSED_WEEKDAYS, OPEN_HOUR, CLOSE_HOUR, SLOT_MINUTES } = window.OrenziSalon;
function isSalonOpenDay(date) {
  return !CLOSED_WEEKDAYS.includes(date.getDay());
}

function weekAppointmentCounts(weekStart) {
  const days = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    return d;
  });
  const counts = days.map(d => appointmentsOnDate(d).length);
  return { days, counts };
}

function strongestWeakestDay(days, counts) {
  const openIdx = days.map((d, i) => i).filter(i => isSalonOpenDay(days[i]));
  if (!openIdx.some(i => counts[i] > 0)) return null;
  let strongIdx = openIdx[0], weakIdx = openIdx[0];
  openIdx.forEach(i => {
    if (counts[i] > counts[strongIdx]) strongIdx = i;
    if (counts[i] < counts[weakIdx]) weakIdx = i;
  });
  return {
    strong: { label: WEEKDAY_LONG_LABELS[strongIdx], count: counts[strongIdx] },
    weak: { label: WEEKDAY_LONG_LABELS[weakIdx], count: counts[weakIdx] },
  };
}

function bestDayForEncaixe(days) {
  const startOfToday = new Date(); startOfToday.setHours(0, 0, 0, 0);
  let best = null;
  days.forEach((d, i) => {
    if (d < startOfToday || !isSalonOpenDay(d)) return;
    const agg = dayAggregate(appointmentsOnDate(d));
    if (!best || agg.freeSlots > best.freeSlots) {
      best = { label: WEEKDAY_LONG_LABELS[i], freeSlots: agg.freeSlots, occPct: agg.occPct };
    }
  });
  return best;
}

function formatDurationShort(min) {
  if (min <= 0) return '0min';
  const h = Math.floor(min / 60), m = min % 60;
  if (h && m) return `${h}h${m}min`;
  if (h) return `${h}h`;
  return `${m}min`;
}

function nextAvailableSlot() {
  const now = new Date();
  if (!isSalonOpenDay(now)) return null;
  const staffCount = Math.max(1, profissionaisAtivos().length);
  const dayAppts = appointmentsOnDate(now);
  // Expediente, não a grade: este horário é sugerido pra ser oferecido à
  // cliente, e o agendar.html não aceita nada antes das 9h nem depois das 18h.
  const dayStart = new Date(now); dayStart.setHours(OPEN_HOUR, 0, 0, 0);
  const dayEnd = new Date(now); dayEnd.setHours(CLOSE_HOUR, 0, 0, 0);
  let cursor = now > dayStart ? new Date(now) : new Date(dayStart);
  cursor.setSeconds(0, 0);
  cursor.setMinutes(Math.ceil(cursor.getMinutes() / 15) * 15);
  if (cursor >= dayEnd) return null;
  const stepMs = 15 * 60000;
  let slotStart = null;
  for (let t = new Date(cursor); t < dayEnd; t = new Date(t.getTime() + stepMs)) {
    const busy = dayAppts.filter(a => new Date(a.starts_at) <= t && new Date(a.ends_at) > t).length;
    if (busy < staffCount) { slotStart = new Date(t); break; }
  }
  if (!slotStart) return null;
  let slotEnd = new Date(slotStart);
  for (; slotEnd < dayEnd; slotEnd = new Date(slotEnd.getTime() + stepMs)) {
    const busy = dayAppts.filter(a => new Date(a.starts_at) <= slotEnd && new Date(a.ends_at) > slotEnd).length;
    if (busy >= staffCount) break;
  }
  return { start: slotStart, durationMin: Math.round((slotEnd - slotStart) / 60000) };
}

function weekTrend() {
  const curStart = startOfWeekMonday(new Date());
  const prevStart = new Date(curStart); prevStart.setDate(prevStart.getDate() - 7);
  const cur = weekAppointmentCounts(curStart).counts.reduce((a, b) => a + b, 0);
  const prev = weekAppointmentCounts(prevStart).counts.reduce((a, b) => a + b, 0);
  const diff = cur - prev;
  if (diff === 0) {
    return { icon: '➖', headline: 'Mesmo volume da semana anterior', phrase: 'O ritmo de agendamentos se manteve estável.' };
  }
  if (prev === 0) {
    return {
      icon: '📈', headline: `+${diff} agendamento${diff === 1 ? '' : 's'} em relação à semana passada`,
      phrase: 'Você está atendendo mais clientes do que na semana passada.',
    };
  }
  const pct = Math.round((diff / prev) * 100);
  if (pct > 0) {
    return {
      icon: '📈', headline: `+${pct}% em agendamentos em relação à semana passada`,
      phrase: 'Você está atendendo mais clientes do que na semana passada.',
    };
  }
  return {
    icon: '📉', headline: `${pct}% em agendamentos em relação à semana passada`,
    phrase: 'Esta semana apresenta menor ocupação. Considere divulgar horários disponíveis.',
  };
}
