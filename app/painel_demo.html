// Troca de tela do questionário com fade-out do conteúdo atual, seguido de fade-in do novo.
function quizTransitionTo(mutateFn) {
  app.style.transition = 'opacity 0.22s ease';
  app.style.opacity = '0';
  setTimeout(() => {
    mutateFn();
    render();
    setTimeout(() => { app.style.opacity = '1'; }, 20);
  }, 220);
}

function renderQuizMessage(text, buttonLabel, onNext) {
  app.innerHTML = `
    <div class="quiz-fullscreen">
      <div class="quiz-message">${text}</div>
      <button class="btn btn-primary" id="quizNextBtn">${buttonLabel}</button>
    </div>
  `;
  document.getElementById('quizNextBtn').onclick = () => quizTransitionTo(onNext);
}

function renderQuizQuestion(question, options, field, nextStep) {
  app.innerHTML = `
    <div class="quiz-fullscreen">
      <div class="quiz-center">
        <h2 style="text-align:center;">${question}</h2>
        <select id="quizAnswerSelect">
          <option value="">Selecione…</option>
          ${options.map(o => `<option value="${o}" ${state.quiz.answers[field] === o ? 'selected' : ''}>${o}</option>`).join('')}
        </select>
      </div>
    </div>
  `;
  document.getElementById('quizAnswerSelect').onchange = (e) => {
    if (!e.target.value) return;
    const value = e.target.value;
    quizTransitionTo(() => {
      state.quiz.answers[field] = value;
      state.quiz.step = nextStep;
    });
  };
}

function renderQuestionario() {
  document.getElementById('greeting').textContent = 'Questionário';
  document.getElementById('greetingSub').textContent = '';

  const step = state.quiz.step;
  setKioskMode(step >= 1);

  if (step === 0) {
    app.innerHTML = `
      <h2>Questionário</h2>
      <label>Cliente</label>
      <select id="quizClientSelect">
        <option value="">Selecione…</option>
        ${state.clients.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
      </select>
    `;
    document.getElementById('quizClientSelect').onchange = (e) => {
      if (!e.target.value) return;
      const clientId = e.target.value;
      quizTransitionTo(() => {
        state.quiz.clientId = clientId;
        state.quiz.step = 1;
      });
    };
    return;
  }

  if (step === 1) {
    renderQuizMessage('Queremos conhecer você melhor', 'Começar', () => { state.quiz.step = 2; });
    return;
  }

  if (step === 2) {
    renderQuizQuestion('Você já fez descoloração?', ['Sim', 'Não'], 'had_bleaching', 3);
    return;
  }

  if (step === 3) {
    renderQuizQuestion('Já fez progressiva, botox ou alisamento?', ['Progressiva', 'Botox', 'Alisamento', 'Nenhum desses'], 'chemical_treatment', 4);
    return;
  }

  if (step === 4) {
    renderQuizMessage('Certo, para poder fazer o melhor atendimento possível, precisamos saber mais algumas informações...', 'Vamos lá', () => { state.quiz.step = 5; });
    return;
  }

  if (step === 5) {
    renderQuizQuestion('Quando foi a última química?', ['Últimos 3 meses', 'De 3 a 6 meses', 'Mais de um ano', 'Nunca fiz química'], 'last_chemical', 6);
    return;
  }

  if (step === 6) {
    renderQuizQuestion('Já teve corte químico ou quebra?', ['Corte químico', 'Quebra', 'Nenhum desses'], 'chemical_cut_or_breakage', 7);
    return;
  }

  if (step === 7) {
    renderQuizMessage('Agora só mais um detalhe....', 'Continuar', () => { state.quiz.step = 8; });
    return;
  }

  if (step === 8) {
    renderQuizQuestion('Usa hena ou tintura preta?', ['Hena', 'Tintura', 'Nenhum desses'], 'henna_or_black_dye', 9);
    return;
  }

  if (step === 9) {
    renderQuizMessage('Essas perguntas ajudam a evitar problemas na descoloração...', 'Continuar', () => { state.quiz.step = 10; });
    return;
  }

  if (step === 10) {
    app.innerHTML = `
      <div class="quiz-fullscreen">
        <div class="quiz-goal-content">
          <h2>Objetivo da cliente</h2>
          <div class="quiz-subtitle">Conte-nos como você quer o seu cabelo</div>
          <textarea id="quizGoal" placeholder="Ex. Ficar mais loira, Manter morena iluminada, recuperar saúde do cabelo" style="min-height:120px;">${state.quiz.answers.goal || ''}</textarea>
        </div>
        <button class="btn btn-primary" id="quizFinishBtn">Concluir</button>
      </div>
    `;
    document.getElementById('quizFinishBtn').onclick = () => {
      const goal = document.getElementById('quizGoal').value.trim();
      quizTransitionTo(() => {
        state.quiz.answers.goal = goal;
        state.quiz.step = 11;
      });
    };
    return;
  }

  if (step === 11) {
    app.innerHTML = `
      <div class="quiz-fullscreen">
        <div style="display:flex; justify-content:flex-end;">
          <button id="quizCloseBtn" style="background:none; border:none; font-size:22px; color:var(--color-neutral-600); cursor:pointer;">✕</button>
        </div>
        <div class="quiz-message">Obrigado pelas informações, vamos preparar o melhor atendimento para você</div>
      </div>
    `;
    document.getElementById('quizCloseBtn').onclick = async () => {
      const payload = {
        client_id: state.quiz.clientId,
        had_bleaching: state.quiz.answers.had_bleaching || null,
        chemical_treatment: state.quiz.answers.chemical_treatment || null,
        last_chemical: state.quiz.answers.last_chemical || null,
        chemical_cut_or_breakage: state.quiz.answers.chemical_cut_or_breakage || null,
        henna_or_black_dye: state.quiz.answers.henna_or_black_dye || null,
        goal: state.quiz.answers.goal || null,
      };
      const { data: inserted, error } = await sb.from('client_questionnaires').insert(payload).select();
      if (error) { showToast('Erro ao salvar: ' + error.message); return; }
      if (!inserted || !inserted.length) { showToast('Não foi possível salvar — faça login novamente.'); return; }
      showToast('Questionário salvo');
      quizTransitionTo(() => {
        state.quiz = { step: 0, clientId: null, answers: {} };
      });
    };
    return;
  }
}

// ── ESTOQUE ──────────────────────────────────────────────────
// Ocupou o lugar da aba Equipe: com uma profissional só, "Profissionais" era
// uma tela de uma linha, e o que falta no balcão é decisão de todo dia.

const UNIDADES = ['un', 'ml', 'g', 'cx'];

// ── Parâmetros do painel de estoque ──────────────────────────
// Quanto olhar pra trás pra estimar quanto sai por dia.
const CONSUMO_JANELA_DIAS = 60;
// Abaixo disso a média é ruído, não tendência: a tela prefere dizer "ainda sem
// histórico" a mostrar uma previsão inventada.
const CONSUMO_MIN_SAIDAS = 2;
const CONSUMO_MIN_DIAS = 7;
// Uma sugestão de compra cobre este tanto de dias acima do mínimo.
const SUGESTAO_COBERTURA_DIAS = 30;
// Acima do mínimo mas ainda perto dele → "baixo estoque".
const ESTOQUE_BAIXO_FATOR = 1.5;
// A partir daqui a validade vira aviso na tela.
const VALIDADE_ALERTA_DIAS = 30;
// Quantas movimentações ficam à vista antes do "ver mais". Mesmo número e
// mesmo padrão do histórico de visitas no perfil da cliente.
const MOV_PREVIEW_COUNT = 3;

// Quantidade sem casas decimais à toa: 3 em vez de 3.00, mas 2.5 continua 2,5.
function fmtQtd(n) {
  const v = Number(n);
  return (Number.isInteger(v) ? v : v.toFixed(2).replace(/0$/, '')).toString().replace('.', ',');
}

// Nome de produto é texto digitado pela Juliane e agora aparece em muito mais
// lugares (cartão, sugestão, timeline, aria-label) — escapar aqui é mais barato
// que lembrar de escapar em cada um.
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function precisaRepor(p) {
  return Number(p.quantity) <= Number(p.min_quantity);
}

// Quatro degraus, do pior pro melhor. Sem estoque vem antes do "no mínimo"
// porque zero é a única situação em que o atendimento simplesmente para.
function stockStatus(p) {
  const q = Number(p.quantity), m = Number(p.min_quantity);
  if (q <= 0) return 'sem';
  if (q <= m) return 'critico';
  if (m > 0 && q <= m * ESTOQUE_BAIXO_FATOR) return 'baixo';
  return 'ok';
}
const STOCK_STATUS_LABEL = {
  ok: 'Em estoque', baixo: 'Baixo estoque', critico: 'Reposição urgente', sem: 'Sem estoque',
};
const STOCK_STATUS_ORDEM = { sem: 0, critico: 1, baixo: 2, ok: 3 };

// Ícone por categoria. As categorias são texto livre no banco, então o mapa
// cobre as que existem hoje e qualquer nova cai no ícone genérico — categoria
// nova nunca quebra a tela.
const STOCK_CATEGORY_ICONS = {
  'coloração': 'drop', 'coloracao': 'drop',
  'descoloração': 'flask', 'descoloracao': 'flask',
  'tratamento': 'sparkle', 'tratamentos': 'sparkle',
  'finalização': 'spray', 'finalizacao': 'spray', 'finalizadores': 'spray',
  'oxidantes': 'flask',
  'descartáveis': 'glove', 'descartaveis': 'glove',
  'equipamentos': 'scissors',
};
function iconeDaCategoria(cat) {
  return ICONS[STOCK_CATEGORY_ICONS[String(cat || '').trim().toLowerCase()] || 'box'];
}

async function loadProducts() {
  const { data, error } = await sb.from('products').select('*').eq('active', true).order('name');
  if (error) { console.error(error); return; }
  state.products = data;
}

// Histórico de movimentação. É daqui que saem consumo médio, previsão de
// duração e sugestão de compra — sem essa leitura, esses números seriam chute.
async function loadMovements() {
  const { data, error } = await sb.from('product_movements')
    .select('*').order('created_at', { ascending: false }).limit(400);
  if (error) { console.error(error); return; }
  state.movements = data || [];
}

// Toda mudança de quantidade passa por aqui. Grava o saldo resultante junto:
// o histórico precisa dizer em quanto ficou naquele momento, e recalcular isso
// depois seria impossível se um produto for editado à mão.
async function registrarMovimento(produto, kind, quantidade, saldo, note) {
  const linha = {
    product_id: produto.id, kind, quantity: Math.abs(Number(quantidade)),
    resulting_quantity: saldo, actor: state.userLabel || null, note: note || null,
  };
  const { data, error } = await sb.from('product_movements').insert(linha).select();
  if (error) { console.error(error); return false; }
  // O demo devolve um registro simbólico, então a linha que entra no state é
  // montada aqui e não copiada da resposta — assim a timeline funciona nos dois.
  state.movements.unshift({
    ...linha,
    id: (data && data[0] && data[0].id) || ('tmp-' + Date.now()),
    created_at: (data && data[0] && data[0].created_at) || new Date().toISOString(),
  });
  return true;
}

// ── Consumo, previsão e sugestão ─────────────────────────────
function movimentosDoProduto(id) {
  return state.movements.filter(m => m.product_id === id);
}

// Quanto sai por dia. Só 'saida' conta: entrada é compra e ajuste é correção de
// contagem — nenhum dos dois é consumo, e somá-los inflaria a previsão.
function consumoDiario(p) {
  const limite = Date.now() - CONSUMO_JANELA_DIAS * 86400000;
  const saidas = movimentosDoProduto(p.id)
    .filter(m => m.kind === 'saida' && new Date(m.created_at).getTime() >= limite);
  if (saidas.length < CONSUMO_MIN_SAIDAS) return null;
  const total = saidas.reduce((s, m) => s + Number(m.quantity), 0);
  if (total <= 0) return null;
  const maisAntigo = Math.min(...saidas.map(m => new Date(m.created_at).getTime()));
  // Piso de dias: duas saídas na mesma tarde não podem virar "consome isso tudo
  // por dia" e prever que o estoque acaba amanhã.
  const dias = Math.max(CONSUMO_MIN_DIAS, (Date.now() - maisAntigo) / 86400000);
  return total / dias;
}

function diasRestantes(p) {
  const taxa = consumoDiario(p);
  if (!taxa) return null;
  return Math.floor(Number(p.quantity) / taxa);
}

// Repor até cobrir SUGESTAO_COBERTURA_DIAS acima do mínimo. Unidade contável
// arredonda pra cima; ml/g arredondam pra dezena, que é como se compra.
function sugestaoCompra(p) {
  const taxa = consumoDiario(p);
  if (!taxa) return null;
  const falta = Number(p.min_quantity) + taxa * SUGESTAO_COBERTURA_DIAS - Number(p.quantity);
  if (falta <= 0) return null;
  return (p.unit === 'un' || p.unit === 'cx') ? Math.ceil(falta) : Math.ceil(falta / 10) * 10;
}

// Meio-dia, não meia-noite: com 'T00:00:00' a data vira meia-noite no fuso do
// aparelho e um celular a oeste de Dublin lê o dia anterior. Mesma armadilha
// que salonTimeToInstant() cobre no agendamento.
function validadeInfo(p) {
  if (!p.expires_at) return null;
  const dias = Math.ceil((new Date(p.expires_at + 'T12:00:00').getTime() - Date.now()) / 86400000);
  if (dias < 0) return { dias, vencido: true, label: 'Produto vencido' };
  if (dias > VALIDADE_ALERTA_DIAS) return { dias, vencido: false, label: null };
  return { dias, vencido: false, label: dias === 0 ? 'Vence hoje' : `Vence em ${dias} dia${dias === 1 ? '' : 's'}` };
}

function valorDoEstoque() {
  return state.products.reduce((s, p) => s + (p.cost != null ? Number(p.cost) * Number(p.quantity) : 0), 0);
}

// "Atualizado" é o instante real mais recente entre edição de produto e
// movimentação — não a hora de abrir a tela.
function estoqueAtualizadoEm() {
  const ts = state.products.map(p => p.updated_at)
    .concat(state.movements.map(m => m.created_at))
    .filter(Boolean).map(t => new Date(t).getTime()).filter(t => !isNaN(t));
  return ts.length ? new Date(Math.max(...ts)) : null;
}

// ── Busca, filtros e ordenação ───────────────────────────────
const STOCK_SORTS = [
  { key: 'atencao', label: 'Prioridade (padrão)' },
  { key: 'nome', label: 'Nome (A–Z)' },
  { key: 'quantidade', label: 'Menor quantidade' },
  { key: 'valor', label: 'Maior valor em estoque' },
  { key: 'validade', label: 'Validade mais próxima' },
];

// Os chips de status são fixos; os de categoria nascem do que existe no banco.
// Chip de categoria vazia seria um filtro que nunca acha nada.
function stockFilters() {
  const chips = [
    { key: 'todos', label: 'Todos', icon: 'box' },
    { key: 'critico', label: 'Reposição', icon: 'warning' },
    { key: 'baixo', label: 'Baixo estoque', icon: 'bars' },
  ];
  if (state.products.some(p => p.favorite)) chips.push({ key: 'favoritos', label: 'Favoritos', icon: 'starFilled' });
  if (state.products.some(p => validadeInfo(p))) chips.push({ key: 'vencendo', label: 'Validade', icon: 'clock' });
  const cats = [...new Set(state.products.map(p => (p.category || '').trim()).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, 'pt-BR'));
  cats.forEach(c => chips.push({ key: 'cat:' + c, label: c, icon: STOCK_CATEGORY_ICONS[c.toLowerCase()] || 'box' }));
  return chips;
}

function filteredSortedProducts() {
  const termo = (state.stockSearch || '').trim().toLowerCase();
  let rows = state.products.map(p => ({ p, status: stockStatus(p) }));

  if (termo) {
    rows = rows.filter(({ p }) =>
      `${p.name || ''} ${p.brand || ''} ${p.category || ''} ${p.code || ''} ${p.supplier || ''}`
        .toLowerCase().includes(termo));
  }

  const f = state.stockFilter || 'todos';
  if (f === 'critico') rows = rows.filter(r => r.status === 'critico' || r.status === 'sem');
  else if (f === 'baixo') rows = rows.filter(r => r.status === 'baixo');
  else if (f === 'favoritos') rows = rows.filter(r => r.p.favorite);
  else if (f === 'vencendo') rows = rows.filter(r => { const v = validadeInfo(r.p); return v && v.label; });
  else if (f.startsWith('cat:')) rows = rows.filter(r => (r.p.category || '').trim() === f.slice(4));

  const porNome = (a, b) => (a.p.name || '').localeCompare(b.p.name || '', 'pt-BR');
  const ordem = state.stockSort || 'atencao';
  rows.sort((a, b) => {
    if (ordem === 'nome') return porNome(a, b);
    if (ordem === 'quantidade') return Number(a.p.quantity) - Number(b.p.quantity) || porNome(a, b);
    if (ordem === 'valor') {
      const val = r => (r.p.cost != null ? Number(r.p.cost) * Number(r.p.quantity) : 0);
      return val(b) - val(a) || porNome(a, b);
    }
    if (ordem === 'validade') {
      // Sem validade cadastrada vai pro fim: não é urgência, é ausência de dado.
      const d = r => (r.p.expires_at ? new Date(r.p.expires_at + 'T12:00:00').getTime() : Infinity);
      return d(a) - d(b) || porNome(a, b);
    }
    return STOCK_STATUS_ORDEM[a.status] - STOCK_STATUS_ORDEM[b.status] || porNome(a, b);
  });
  return rows;
}

// ── A tela ───────────────────────────────────────────────────
function renderStock() {
  const total = state.products.length;
  const contagem = { ok: 0, baixo: 0, critico: 0, sem: 0 };
  state.products.forEach(p => { contagem[stockStatus(p)]++; });
  const emEstoque = contagem.ok + contagem.baixo;
  const urgentes = contagem.critico + contagem.sem;

  document.getElementById('greeting').textContent = 'Estoque';
  document.getElementById('greetingSub').textContent =
    total ? `${total} produto${total === 1 ? '' : 's'} cadastrado${total === 1 ? '' : 's'}` : 'Nenhum produto ainda';

  const atualizado = estoqueAtualizadoEm();
  const resumo = [
    { key: 'todos', st: 'ok', val: total, lbl: 'Produtos' },
    { key: 'todos', st: 'ok', val: emEstoque, lbl: 'Em estoque' },
    { key: 'baixo', st: 'baixo', val: contagem.baixo, lbl: 'Baixo estoque' },
    { key: 'critico', st: 'critico', val: urgentes, lbl: 'Reposição urgente' },
  ];

  app.innerHTML = `
    <h2 style="margin-top:8px;">Resumo do estoque</h2>
    <div class="stock-summary stk-enter" style="animation-delay:0ms;">
      ${resumo.map((r, i) => `
        <button type="button" class="stk-sum-card st-${r.st} ${state.stockFilter === r.key && i > 1 ? 'active' : ''}" data-sum="${r.key}">
          <span class="ssc-dot"></span>
          <span>
            <span class="ssc-val">${r.val}</span>
            <span class="ssc-lbl">${r.lbl}</span>
          </span>
        </button>
      `).join('')}
    </div>

    <div class="stock-value-card stk-enter" style="animation-delay:40ms;">
      <span class="svc-icon">${ICONS.money}</span>
      <span class="svc-body">
        <span class="svc-val">€${valorDoEstoque().toFixed(0)}</span>
        <span class="svc-lbl">Valor total do estoque</span>
      </span>
      ${atualizado ? `
        <span class="svc-upd">
          Atualizado ${daysAgoLabel(atualizado.toISOString())}
          <strong>${fmtTime(atualizado)}</strong>
        </span>` : ''}
    </div>

    <div class="o-search-filter-bar stk-enter" style="animation-delay:100ms;">
      <label class="o-search-field" id="stockSearchField">
        <span class="o-search-field-icon" aria-hidden="true">${ICONS.search}</span>
        <input type="search" id="stockSearchInput" placeholder="Buscar produto, marca ou categoria…"
               autocomplete="off" aria-label="Buscar produto" value="${esc(state.stockSearch || '')}">
        <button class="o-search-clear" id="stockSearchClear" type="button" aria-label="Limpar busca">${ICONS.close}</button>
      </label>
      <button class="o-icon-btn o-icon-btn-solid o-icon-btn-squircle" id="stockSortBtn" aria-label="Filtrar e ordenar">${ICONS.sliders}</button>
    </div>

    <div class="o-chip-group-scroll stk-enter" id="stockFilterChips" style="animation-delay:160ms;" role="group" aria-label="Filtrar produtos">
      ${stockFilters().map(f => `
        <button class="o-chip" aria-pressed="${state.stockFilter === f.key}" data-filter="${esc(f.key)}">
          <span aria-hidden="true">${ICONS[f.icon] || ICONS.box}</span><span>${esc(f.label)}</span>
        </button>
      `).join('')}
    </div>

    <div id="stockListWrap" class="stk-enter" style="animation-delay:220ms;"></div>
    <div id="stockInsightsWrap"></div>
  `;

  renderStockList();
  renderStockInsights();
  bindStockToolbar();
}

// Só a lista — chamada a cada tecla digitada na busca e a cada troca de chip.
// Não pode passar por render(): o <input> seria recriado e perderia o foco.
function renderStockList() {
  const wrap = document.getElementById('stockListWrap');
  if (!wrap) return;

  if (!state.products.length) {
    wrap.innerHTML = emptyStateHtml({
      icon: ICONS.box,
      glow: true,
      title: 'Seu estoque está começando.',
      caption: 'Cadastre o que você usa no dia a dia e acompanhe o consumo sem esforço.',
      cta: '<button class="btn btn-primary" id="emptyStockCta">Cadastrar produto</button>',
    });
    document.getElementById('emptyStockCta').onclick = () => openProductModal();
    return;
  }
  const rows = filteredSortedProducts();
  if (!rows.length) {
    const buscandoProduto = !!(state.stockSearch || '').trim();
    wrap.innerHTML = buscandoProduto
      ? emptyStateHtml({
          icon: ICONS.search,
          title: 'Não encontramos esse produto no seu estoque.',
          caption: 'Ele pode estar guardado em outra categoria.',
          cta: '<button type="button" class="see-more-btn" id="emptyStockClearSearch">Limpar busca</button>',
        })
      : '<div class="empty">Nenhum produto neste filtro.</div>';
    if (buscandoProduto) document.getElementById('emptyStockClearSearch').onclick = clearStockSearch;
    return;
  }

  // Os rótulos de grupo só fazem sentido na ordenação por prioridade — em
  // "Nome (A–Z)" a lista não está agrupada e o título mentiria.
  const agrupar = (state.stockSort || 'atencao') === 'atencao';
  let html = agrupar ? '' : `<div class="stock-count-label">${rows.length} ${rows.length === 1 ? 'produto' : 'produtos'}</div>`;
  const grupos = [
    { st: 'critico', chaves: ['sem', 'critico'], label: 'Precisam de atenção' },
    { st: 'baixo', chaves: ['baixo'], label: 'Estoque baixo' },
    { st: 'ok', chaves: ['ok'], label: 'Em dia' },
  ];

  if (agrupar) {
    grupos.forEach(g => {
      const doGrupo = rows.filter(r => g.chaves.includes(r.status));
      if (!doGrupo.length) return;
      html += `<div class="stock-group-label st-${g.st}"><span class="sgl-dot"></span>${g.label} · ${doGrupo.length}</div>`;
      html += doGrupo.map(productCardHtml).join('');
    });
  } else {
    html += rows.map(productCardHtml).join('');
  }

  wrap.innerHTML = html;
  bindStockCards(wrap);
}

function productCardHtml({ p, status }) {
  const val = validadeInfo(p);
  const dias = diasRestantes(p);
  const notas = [];
  if (val && val.label) {
    notas.push(`<span class="pd-note ${val.vencido ? 'is-alert' : 'is-soft'}">${ICONS.clock}${esc(val.label)}</span>`);
  }
  if (dias != null) {
    notas.push(`<span class="pd-note ${dias <= 7 ? 'is-alert' : ''}">${ICONS.trendUp}≈ ${dias} ${dias === 1 ? 'dia' : 'dias'} de estoque</span>`);
  }
  const identidade = [p.brand, p.category].filter(Boolean).map(esc).join(' · ') || 'Sem marca';
  const codigo = p.code ? ` · <span class="pd-code">${esc(p.code)}</span>` : '';

  return `
    <div class="product-card st-${status} is-${status}" data-card="${p.id}">
      <div class="pd-top">
        <button type="button" class="pd-open" data-edit="${p.id}" aria-label="Abrir ${esc(p.name)}">
          <span class="pd-thumb">${p.image_url
            ? `<img src="${esc(p.image_url)}" alt="">`
            : iconeDaCategoria(p.category)}</span>
          <span class="pd-head">
            <span class="pd-name">${esc(p.name)}</span>
            <span class="pd-sub">${identidade}${codigo}</span>
          </span>
        </button>
        <button type="button" class="pd-fav ${p.favorite ? 'is-on' : ''}" data-fav="${p.id}"
                aria-label="${p.favorite ? 'Tirar' : 'Marcar'} ${esc(p.name)} dos favoritos"
                aria-pressed="${p.favorite ? 'true' : 'false'}">${p.favorite ? ICONS.starFilled : ICONS.star}</button>
      </div>
      <div class="pd-bottom">
        <div class="pd-meta">
          <span class="stk-badge"><span class="sb-dot"></span>${STOCK_STATUS_LABEL[status]}</span>
          <div class="pd-min">Mínimo ${fmtQtd(p.min_quantity)} ${esc(p.unit)}</div>
        </div>
        <div class="stock-qty">
          <button type="button" class="qty-btn" data-dec="${p.id}" aria-label="Tirar 1 de ${esc(p.name)}" ${Number(p.quantity) <= 0 ? 'disabled' : ''}>−</button>
          <button type="button" class="qty-num" data-qtyedit="${p.id}" aria-label="Editar quantidade de ${esc(p.name)}">
            <span data-qty-for="${p.id}">${fmtQtd(p.quantity)}</span>
            <span class="qty-unit">${esc(p.unit)}</span>
          </button>
          <button type="button" class="qty-btn" data-inc="${p.id}" aria-label="Adicionar 1 em ${esc(p.name)}">+</button>
        </div>
      </div>
      ${notas.length ? `<div class="pd-notes">${notas.join('')}</div>` : ''}
    </div>
  `;
}

function bindStockCards(wrap) {
  wrap.querySelectorAll('[data-edit]').forEach(el => { el.onclick = () => openProductModal(el.dataset.edit); });
  wrap.querySelectorAll('[data-fav]').forEach(el => { el.onclick = () => alternarFavorito(el.dataset.fav); });
  wrap.querySelectorAll('[data-qtyedit]').forEach(el => { el.onclick = () => openQtyEditSheet(el.dataset.qtyedit); });
  wrap.querySelectorAll('[data-inc]').forEach(el => bindQtyHold(el, el.dataset.inc, 1));
  wrap.querySelectorAll('[data-dec]').forEach(el => bindQtyHold(el, el.dataset.dec, -1));
}

// ── Sugestões, movimentações e estatísticas ──────────────────
function renderStockInsights() {
  const wrap = document.getElementById('stockInsightsWrap');
  if (!wrap || !state.products.length) return;
  wrap.innerHTML = statsHtml() + suggestionsHtml() + movementsHtml();
  wrap.querySelectorAll('[data-edit]').forEach(el => { el.onclick = () => openProductModal(el.dataset.edit); });
  const verMais = document.getElementById('stockMovToggle');
  if (verMais) verMais.onclick = () => {
    state.stockMovExpanded = !state.stockMovExpanded;
    renderStockInsights();
    // Ao recolher, o botão "ver menos" some junto com a lista e a tela salta
    // pro fim do documento — sem isso o dedo fica apontando pro nada. Volta
    // pro título da seção.
    if (!state.stockMovExpanded) {
      const titulo = document.getElementById('stockMovTitle');
      if (titulo) titulo.scrollIntoView({ block: 'start', behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
    }
  };
}

function suggestionsHtml() {
  const criticos = state.products
    .filter(p => ['critico', 'sem', 'baixo'].includes(stockStatus(p)))
    .map(p => ({ p, dias: diasRestantes(p), comprar: sugestaoCompra(p) }))
    .filter(s => s.comprar != null)
    .sort((a, b) => (a.dias == null ? Infinity : a.dias) - (b.dias == null ? Infinity : b.dias))
    .slice(0, 3);

  const vencendo = state.products.map(p => ({ p, v: validadeInfo(p) })).filter(x => x.v && x.v.label).slice(0, 2);

  if (!criticos.length && !vencendo.length) {
    // Sem histórico não existe sugestão possível. Dizer isso é melhor que
    // esconder a seção — a Juliane fica sabendo que o número vai aparecer.
    const semHistorico = state.products.some(p => precisaRepor(p)) && !state.movements.length;
    if (!semHistorico) return '';
    return `
      <div class="stock-section">
        <div class="stock-section-title"><span class="sst-icon">${ICONS.bulb}</span>Sugestões</div>
        <div class="stock-empty-note">
          <span class="sen-icon">${ICONS.history}</span>
          <span>Ainda sem histórico de consumo. Conforme você registrar entradas e saídas, a previsão de duração e a quantidade sugerida de compra aparecem aqui.</span>
        </div>
      </div>`;
  }

  const cards = [
    ...criticos.map(({ p, dias, comprar }) => {
      const st = stockStatus(p);
      return `
        <button type="button" class="suggestion-card st-${st}" data-edit="${p.id}" style="width:100%;text-align:left;font-family:inherit;color:inherit;cursor:pointer;">
          <span class="sc-icon">${ICONS.warning}</span>
          <span class="sc-body">
            <span class="sc-name">${esc(p.name)}</span>
            <span class="sc-text">${dias != null
              ? `Pelo consumo médio, restam cerca de <strong>${dias} ${dias === 1 ? 'dia' : 'dias'}</strong>. `
              : ''}Sugestão: comprar <strong>${fmtQtd(comprar)} ${esc(p.unit)}</strong>.</span>
          </span>
        </button>`;
    }),
    ...vencendo.map(({ p, v }) => `
      <button type="button" class="suggestion-card ${v.vencido ? 'st-critico' : 'st-baixo'}" data-edit="${p.id}" style="width:100%;text-align:left;font-family:inherit;color:inherit;cursor:pointer;">
        <span class="sc-icon">${ICONS.clock}</span>
        <span class="sc-body">
          <span class="sc-name">${esc(p.name)}</span>
          <span class="sc-text">${v.vencido
            ? 'Produto <strong>vencido</strong> — vale conferir antes de usar.'
            : `<strong>${esc(v.label)}</strong>. Priorize o uso deste antes de abrir outro.`}</span>
        </span>
      </button>`),
  ];

  return `
    <div class="stock-section">
      <div class="stock-section-title"><span class="sst-icon">${ICONS.bulb}</span>Sugestões</div>
      ${cards.join('')}
    </div>`;
}

const MOV_META = {
  entrada: { st: 'ok', icon: 'arrowIn', sinal: '+', label: 'Entrada' },
  saida: { st: 'critico', icon: 'arrowOut', sinal: '−', label: 'Saída' },
  ajuste: { st: 'baixo', icon: 'sliders', sinal: '', label: 'Ajuste' },
};
const DIAS_SEMANA = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];

function rotuloDoDia(d) {
  const dias = Math.floor((new Date().setHours(0, 0, 0, 0) - new Date(d).setHours(0, 0, 0, 0)) / 86400000);
  if (dias <= 0) return 'Hoje';
  if (dias === 1) return 'Ontem';
  if (dias < 7) return DIAS_SEMANA[new Date(d).getDay()];
  const { day, mon } = fmtDateShort(new Date(d).toISOString());
  return `${day} ${mon}`;
}

function movementsHtml() {
  if (!state.movements.length) {
    return `
      <div class="stock-section">

        </div>
      </div>`;
  }

  const escondidas = Math.max(0, state.movements.length - MOV_PREVIEW_COUNT);
  const recentes = state.stockMovExpanded ? state.movements : state.movements.slice(0, MOV_PREVIEW_COUNT);
  let ultimoDia = null;
  const itens = recentes.map(m => {
    const p = state.products.find(x => x.id === m.product_id);

function statsHtml() {
  const saidas = state.movements.filter(m => m.kind === 'saida');
  const reposicao = state.products
    .filter(p => ['critico', 'sem', 'baixo'].includes(stockStatus(p)))
    .reduce((s, p) => {
      const q = sugestaoCompra(p) ?? Math.max(0, Number(p.min_quantity) * ESTOQUE_BAIXO_FATOR - Number(p.quantity));
      return s + (p.cost != null ? q * Number(p.cost) : 0);
    }, 0);

  // Sem saída registrada não há "mais usado" nem "categoria que mais consome" —
  // a seção mostra só o que dá pra afirmar (valor e gasto estimado).
  let usoHtml = '';
  if (saidas.length) {
    const porProduto = {}, porCategoria = {};
    saidas.forEach(m => {
      const p = state.products.find(x => x.id === m.product_id);
      if (!p) return;
      porProduto[p.name] = (porProduto[p.name] || 0) + Number(m.quantity);
      const cat = (p.category || 'Sem categoria').trim();
      porCategoria[cat] = (porCategoria[cat] || 0) + Number(m.quantity);
    });
    const topProduto = Object.entries(porProduto).sort((a, b) => b[1] - a[1])[0];
    const topCategoria = Object.entries(porCategoria).sort((a, b) => b[1] - a[1])[0];
    if (topProduto) {
      usoHtml = `
        <div class="stock-stats">
          <div class="ss-head">No consumo dos últimos ${CONSUMO_JANELA_DIAS} dias</div>
          <div class="ss-pair">
            <div class="ss-cell">
              <div class="ss-val" style="font-size:15px;">${esc(topProduto[0])}</div>
              <div class="ss-lbl">Produto mais usado</div>
            </div>
            <div class="ss-cell">
              <div class="ss-val" style="font-size:15px;">${esc(topCategoria ? topCategoria[0] : '—')}</div>
              <div class="ss-lbl">Categoria com maior consumo</div>
            </div>
          </div>
        </div>`;
    }
  }

  return `
    <div class="stock-section">
      <div class="stock-section-title"><span class="sst-icon">${ICONS.bars}</span>Estatísticas</div>
      <div class="stock-stats">
        <div class="ss-pair">
          <div class="ss-cell">
            <div class="ss-val">€${valorDoEstoque().toFixed(0)}</div>
            <div class="ss-lbl">Valor total parado em estoque</div>
          </div>
          <div class="ss-cell">
            <div class="ss-val">€${reposicao.toFixed(0)}</div>
            <div class="ss-lbl">Gasto estimado pra repor o que falta</div>
          </div>
        </div>
      </div>
      ${usoHtml}
    </div>`;
}

// ── Toolbar (busca, chips, ordenação) ────────────────────────
function bindStockToolbar() {
  const field = document.getElementById('stockSearchField');
  const input = document.getElementById('stockSearchInput');
  const clear = document.getElementById('stockSearchClear');

  // O anel de foco e o placeholder que some usam :focus-within do próprio
  // .o-search-field — não precisam mais de classe amarrada em onfocus/onblur
  // (docs/04 §SearchField). .has-text continua em JS porque CSS não sabe "o
  // campo tem texto" sem :has(), que não é usado em mais nenhum lugar do projeto.
  if (input) {
    field.classList.toggle('has-text', !!input.value);
    input.oninput = () => {
      state.stockSearch = input.value;
      field.classList.toggle('has-text', !!input.value);
      renderStockList();
    };
  }
  if (clear) {
    // mousedown, não click: o blur do input dispararia antes e o botão já teria
    // sumido junto com a classe .has-text.
    clear.onmousedown = (e) => {
      e.preventDefault();
      clearStockSearch();
    };
  }

  document.querySelectorAll('#stockFilterChips .o-chip').forEach(chip => {
    chip.onclick = () => { aplicarFiltroEstoque(chip.dataset.filter); };
  });
  document.querySelectorAll('[data-sum]').forEach(btn => {
    btn.onclick = () => aplicarFiltroEstoque(btn.dataset.sum);
  });
  const sortBtn = document.getElementById('stockSortBtn');
  if (sortBtn) sortBtn.onclick = openStockSortSheet;
}

// Troca de filtro sem passar por render(): só aria-pressed/.active mudam e a
// lista é redesenhada. Se o render cheio rodasse, a animação de entrada
// tocaria de novo a cada chip — e a busca perderia o foco.
function aplicarFiltroEstoque(key) {
  state.stockFilter = key;
  document.querySelectorAll('#stockFilterChips .o-chip')
    .forEach(c => c.setAttribute('aria-pressed', String(c.dataset.filter === key)));
  document.querySelectorAll('[data-sum]')
    .forEach((c, i) => c.classList.toggle('active', i > 1 && c.dataset.sum === key));
  renderStockList();
}

// ── Contador: toque simples, segurar e edição manual ─────────
const HOLD_INICIO_MS = 420;  // antes disso ainda é um toque simples
const HOLD_PASSO_MS = 110;   // depois, um passo a cada

// Segurar não pode virar uma gravação por passo: os passos são acumulados na
// tela e só o total vai pro banco quando o dedo solta — uma escrita, uma
// movimentação. Por isso o número é atualizado no DOM direto: re-renderizar a
// lista no meio do gesto destruiria o próprio botão que está sendo apertado.
function bindQtyHold(btn, produtoId, sinal) {
  let inicio = null, repete = null, acumulado = 0;

  const passo = () => {
    const p = state.products.find(x => x.id === produtoId);
    if (!p) return;
    if (sinal < 0 && Number(p.quantity) + acumulado <= 0) return;
    acumulado += sinal;
    const alvo = document.querySelector(`[data-qty-for="${produtoId}"]`);
    if (alvo) alvo.textContent = fmtQtd(Number(p.quantity) + acumulado);
  };

  const soltar = () => {
    clearTimeout(inicio); clearInterval(repete);
    inicio = repete = null;
    if (!acumulado) return;
    const delta = acumulado;
    acumulado = 0;
    ajustarQuantidade(produtoId, delta);
  };

  btn.onpointerdown = (e) => {
    e.preventDefault();
    passo();
    inicio = setTimeout(() => { repete = setInterval(passo, HOLD_PASSO_MS); }, HOLD_INICIO_MS);
  };
  btn.onpointerup = soltar;
  btn.onpointercancel = soltar;
  btn.onpointerleave = soltar;
}

// Ajuste do balcão: usou um, tira um. A tela já mostra o valor novo (o gesto
// atualizou o DOM); aqui confirma no banco e volta atrás se falhar.
async function ajustarQuantidade(id, delta) {
  const p = state.products.find(x => x.id === id);
  if (!p) return;
  const anterior = Number(p.quantity);
  const nova = Math.max(0, anterior + delta);
  if (nova === anterior) { renderStockList(); return; }
  p.quantity = nova;
  renderStockList();

  // O .select() é o que prova que gravou: com a sessão expirada a RLS deixa o
  // update passar sem tocar em nenhuma linha, e sem isso a tela mentiria.
  const { data, error } = await sb.from('products')
    .update({ quantity: nova, updated_at: new Date().toISOString() }).eq('id', id).select('id');
  if (error || !data || !data.length) {
    p.quantity = anterior;
    renderStockList();
    showToast(error ? 'Não deu pra salvar: ' + error.message : 'Não foi possível salvar — faça login novamente.');
    return;
  }
  await registrarMovimento(p, delta > 0 ? 'entrada' : 'saida', Math.abs(nova - anterior), nova, null);
  renderStockInsights();
  if (precisaRepor(p)) showToast(`${p.name} chegou no mínimo — hora de repor`);
}

async function alternarFavorito(id) {
  const p = state.products.find(x => x.id === id);
  if (!p) return;
  const novo = !p.favorite;
  p.favorite = novo;
  renderStockList();
  const { data, error } = await sb.from('products')
    .update({ favorite: novo, updated_at: new Date().toISOString() }).eq('id', id).select('id');
  if (error || !data || !data.length) {
    p.favorite = !novo;
    renderStockList();
    showToast('Não foi possível salvar — faça login novamente.');
    return;
  }
  // O chip "Favoritos" só existe quando há algum favorito: marcar o primeiro
  // (ou desmarcar o último) muda a faixa de chips, não só a lista.
  if (novo || !state.products.some(x => x.favorite)) render();
}

// Foto do produto. Bucket próprio (product-photos), mesma compressão das fotos
// de cliente — frasco não precisa de mais resolução que cabelo.
async function uploadProductPhoto(produtoId, file) {
  showToast('Enviando foto…');
  const compressed = await compressImage(file, 900, 0.8);
  const path = `${produtoId}/${Date.now()}.jpg`;
  const { error: upErr } = await sb.storage.from('product-photos').upload(path, compressed, { contentType: 'image/jpeg' });
  if (upErr) { showToast('Erro ao enviar foto: ' + upErr.message); return null; }
  const { data: pub } = sb.storage.from('product-photos').getPublicUrl(path);
  if (!pub || !pub.publicUrl) { showToast('Foto não disponível nesta versão'); return null; }
  return pub.publicUrl;
}

              <div class="modal-field-label">Mínimo</div>
              <input type="number" id="prodMin" min="0" step="0.5" inputmode="decimal" value="${p ? v(p.min_quantity, '0') : '0'}">
            </div>
            <div>
              <div class="modal-field-label">Unidade</div>
              <select id="prodUnit" style="border-radius:999px;">
                ${UNIDADES.map(u => `<option value="${u}" ${p && p.unit === u ? 'selected' : ''}>${u}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="slot-note">O aviso de repor aparece quando a quantidade chega no mínimo.</div>

          <div class="modal-field-label">Custo por unidade (€)</div>
          <input type="number" id="prodCost" min="0" step="0.01" inputmode="decimal" value="${p && p.cost != null ? v(p.cost) : ''}">

          <div class="modal-field-label">Validade</div>
          <input type="date" id="prodExpires" value="${p ? esc(p.expires_at) : ''}">

          <div class="modal-field-label">Observações</div>
          <textarea id="prodNotes" placeholder="Onde fica guardado, diluição, o que for útil…">${p ? esc(p.notes) : ''}</textarea>
        </div>

        ${p ? `
          <div class="stock-section" style="margin-top:20px;">
            <div class="stock-section-title">
              <span class="sst-icon">${ICONS.history}</span>Histórico do produto
              <span class="sst-count">${historico.length} ${historico.length === 1 ? 'registro' : 'registros'}</span>
            </div>
            ${historico.length ? historico.slice(0, 20).map(m => {
              const meta = MOV_META[m.kind] || MOV_META.ajuste;
              return `
                <div class="mv-item st-${meta.st}">
                  <div class="mv-rail"><span class="mv-icon">${ICONS[meta.icon]}</span><span class="mv-line"></span></div>
                  <div class="mv-body">
                    <div class="mv-top">
                      <span class="mv-qty">${meta.sinal}${fmtQtd(m.quantity)}</span>
                      <span class="mv-name">${meta.label}${m.note ? ' · ' + esc(m.note) : ''}</span>
                    </div>
                    <div class="mv-sub">${fmtDate(m.created_at)} · ${fmtTime(m.created_at)}${
                      m.actor ? ' · ' + esc(m.actor) : ''}${
                      m.resulting_quantity != null ? ` · ficou em ${fmtQtd(m.resulting_quantity)} ${esc(p.unit)}` : ''}</div>
                  </div>
                </div>`;
            }).join('') : `
              <div class="stock-empty-note">
                <span class="sen-icon">${ICONS.history}</span>
                <span>O histórico deste produto começa na primeira movimentação. Toda entrada, saída ou ajuste fica registrado aqui, com data e hora.</span>
              </div>`}
          </div>
        ` : ''}

        <button class="btn btn-primary" id="saveProduct">Salvar produto</button>
        ${p ? '<button class="btn btn-ghost" id="deleteProduct">Remover do estoque</button>' : ''}
        <div id="prodError"></div>
      </div>
    </div>
  `;

  document.getElementById('modalClose').onclick = closeModal;
  document.getElementById('modalOverlay').onclick = (e) => { if (e.target.id === 'modalOverlay') closeModal(); };

  const erro = (msg) => {
    document.getElementById('prodError').innerHTML = msg ? `<div class="login-error">${msg}</div>` : '';
  };

  const fileInput = document.getElementById('prodPhotoInput');
  const photoBtn = document.getElementById('prodPhotoBtn');
  photoBtn.onclick = () => fileInput.click();
  fileInput.onchange = async () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    // Produto novo ainda não tem id — o caminho no bucket usa um temporário e o
    // arquivo é o mesmo; o que importa é a URL pública, não a pasta.
    const url = await uploadProductPhoto(p ? p.id : 'novos', file);
    if (!url) return;
    fotoNova = url;
    photoBtn.innerHTML = `<img src="${esc(url)}" alt="">`;
    showToast('Foto pronta — salve o produto');
  };

  document.getElementById('saveProduct').onclick = async () => {
    const btn = document.getElementById('saveProduct');
    const name = document.getElementById('prodName').value.trim();
    if (!name) { erro('Dê um nome ao produto.'); return; }
    const custo = document.getElementById('prodCost').value.trim();
    const qtdNova = Math.max(0, Number(document.getElementById('prodQty').value) || 0);
    const qtdAnterior = p ? Number(p.quantity) : null;
    const payload = {
      name,
      brand: document.getElementById('prodBrand').value.trim() || null,
      category: document.getElementById('prodCategory').value.trim() || null,
      code: document.getElementById('prodCode').value.trim() || null,
      supplier: document.getElementById('prodSupplier').value.trim() || null,
      unit: document.getElementById('prodUnit').value,
      quantity: qtdNova,
      min_quantity: Math.max(0, Number(document.getElementById('prodMin').value) || 0),
      cost: custo === '' ? null : Number(custo),
      expires_at: document.getElementById('prodExpires').value || null,
      notes: document.getElementById('prodNotes').value.trim() || null,
      updated_at: new Date().toISOString(),
    };
    if (fotoNova) payload.image_url = fotoNova;

    orenziUI.setButtonBusy(btn, p ? 'Salvando…' : 'Cadastrando…');
    const { data, error } = p
      ? await sb.from('products').update(payload).eq('id', p.id).select('id')
      : await sb.from('products').insert(payload).select('id');
    if (error) { console.error('products.save', error); orenziUI.resetButton(btn); erro('Não foi possível salvar. Tente de novo.'); return; }
    if (!data || !data.length) { orenziUI.resetButton(btn); erro('Não foi possível salvar — faça login novamente.'); return; }

    // Mexer na quantidade pelo formulário também é movimentação — senão o
    // histórico teria buracos e a previsão sairia de um saldo que ninguém sabe
    // de onde veio.
    if (p && qtdAnterior != null && qtdNova !== qtdAnterior) {
      await registrarMovimento({ ...p, quantity: qtdNova }, 'ajuste', Math.abs(qtdNova - qtdAnterior), qtdNova, 'Editado no cadastro');
    }
    await orenziUI.setButtonSuccess(btn, 'Salvo');
    closeModal();
    showToast(p ? 'Produto atualizado' : 'Produto cadastrado');
    await loadProducts();
    render();
  };

  const btnDel = document.getElementById('deleteProduct');
  if (btnDel) btnDel.onclick = () => {
    // Some da lista mas o registro fica: o histórico de custo não se perde
    // — por isso a mensagem fala em "deixa de aparecer", nunca "excluído
    // permanentemente" (é soft delete, `active:false`).
    orenziUI.confirm({
      title: 'Remover produto do estoque?',
      message: `${p.name} deixará de aparecer na lista ativa do estoque.`,
      confirmLabel: 'Remover produto',
      destructive: true,
      successLabel: 'Removido',
      onConfirm: async () => {
        const { data, error } = await sb.from('products')
          .update({ active: false, updated_at: new Date().toISOString() }).eq('id', p.id).select('id');
        if (error) { console.error('products.remove', error); throw new Error('Não foi possível remover. Tente de novo.'); }
        if (!data || !data.length) { throw new Error('Não foi possível remover — faça login novamente.'); }
        closeModal();
        showToast('Produto removido do estoque');
        await loadProducts();
        render();
      },
    });
  };
}

function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === state.tab));
  // O + flutuante é do Estoque e da lista de Clientes — a Agenda tem o dela
  // embutido na pílula do mês (#agendaAddBtn, dentro de renderAgenda()).
  // Em Clientes ele some no perfil, que é outra tela dentro da mesma aba.
  const mostraFab = !state.selectedApptId && (
    state.tab === 'estoque' ||
    (state.tab === 'clients' && !state.selectedClientId && !state.viewQuestionnaire)
  );
  document.getElementById('fabNewAppt').style.display = mostraFab ? 'flex' : 'none';
  if (state.selectedApptId) { renderApptDetail(); return; }
  if (state.tab === 'inicio') renderHome();
  else if (state.tab === 'insights') renderInsights();
  else if (state.tab === 'agenda') renderAgenda();
  else if (state.tab === 'clients') renderClients();
  else if (state.tab === 'estoque') renderStock();
  else if (state.tab === 'questionario') renderQuestionario();
}

document.querySelectorAll('nav button').forEach(btn => {
  btn.onclick = () => {
    state.tab = btn.dataset.tab;
    state.selectedClientId = null;
    state.selectedApptId = null;
    state.viewQuestionnaire = null;
    state.clientContext = null;
    state.quiz = { step: 0, clientId: null, answers: {} };
    // Tocar na aba é entrada nova: começa do topo. O scroll guardado serve
    // pro caminho de volta do perfil, não pra troca de aba.
    state.clientsScrollTop = 0;
    render();
    window.scrollTo(0, 0);

});

function renderLogin(errorMsg) {

  document.getElementById('fabNewAppt').style.display = 'none';
  app.innerHTML = `
    <div class="login-wrap">
      <div class="wordmark">ORENZI</div>
      <div class="wordmark-sub">ATELIER</div>
      <h1>Entrar</h1>

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    // Quem registrou a movimentação. Só existe uma conta hoje, mas o histórico
    // guarda o nome mesmo assim — sem isso, "quem tirou 2 luvas?" fica sem
    // resposta no dia em que houver uma segunda pessoa.
    const email = (session.user && session.user.email) || '';
    const apelido = email.split('@')[0].replace(/[._-]+/g, ' ').trim();
    state.userLabel = apelido ? apelido.charAt(0).toUpperCase() + apelido.slice(1) : 'Painel';
    document.querySelector('nav').style.display = 'flex';
    document.getElementById('logoutBtn').style.display = 'inline';
    loadAll();
  } else {
    renderLogin();
  }
}

document.getElementById('logoutBtn').onclick = async () => {
  await sb.auth.signOut();
};

sb.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_IN') checkSession();
  if (event === 'SIGNED_OUT') renderLogin();
});

// ── NOVO AGENDAMENTO MANUAL — WIZARD (Fase 2, 06/08/2026) ─────
// Substitui o formulário único por um assistente guiado de 5 etapas —
// Cliente → Serviço → Data → Horário → Confirmação — dentro da mesma folha
// (nunca outro modal/popup: sub-telas como "Novo cliente" também deslizam
// dentro de #wizBody). Lógica de disponibilidade, segmentos e o insert em
// `appointments` continuam exatamente as mesmas de antes; só a experiência
// mudou. `wiz` é recriado a cada abertura — não sobrevive ao fechar.
const modalContainer = document.getElementById('modalContainer');
let wiz = null;

function closeModal() {
  modalContainer.innerHTML = '';
  wiz = null;
}

const SERVICE_CATEGORY_ICONS = {
  'Coloração': 'drop', 'Corte': 'scissors', 'Alisamento': 'spray',
  'Tratamentos': 'sparkle', 'Outros': 'star',
};
function iconForService(service) {
  return ICONS[SERVICE_CATEGORY_ICONS[service?.category]] || ICONS.bag;
}

// `source`/`slotStart`/`slotEnd` são o contexto de entrada, integrados a
// este mesmo objeto (nunca uma variável global solta): 'button' é o modo
// normal (5 etapas, Data incluída); 'free-slot' é o modo contextual aberto
// a partir do card "Xh livres" da Agenda (4 etapas, sem Data), com
// slotStart/slotEnd em ms epoch marcando o buraco real clicado — usados só
// pra filtrar os horários da etapa Horário, nunca pra recalcular disponibilidade.
function newWizState(prefillDate, prefillTime, freeSlot) {
  const ativos = profissionaisAtivos();
  const base = prefillDate ? new Date(`${prefillDate}T00:00:00`) : new Date();
  return {
    step: 1,
    back: false,
    sub: null, // 'quickAddClient'
    clientId: null,
    clientQuery: '',
    serviceId: null,
    serviceQuery: '',
    staffId: ativos.length ? ativos[0].id : null,
    date: prefillDate || null,
    calendarMonth: new Date(base.getFullYear(), base.getMonth(), 1),
    time: null,
    preferredTime: prefillTime || null,
    error: null,
    source: freeSlot ? 'free-slot' : 'button',
    slotStart: freeSlot ? freeSlot.start : null,
    slotEnd: freeSlot ? freeSlot.end : null,
  };
}

function openNewApptModal() {
  wiz = newWizState(null, null);
  renderWizard();
}

// Aberto pelo toque no card de horário livre da Agenda — chega com o dia e
// o intervalo real (slotStartMs/slotEndMs) já resolvidos, então o wizard
// pula a etapa Data inteira (ver newWizState). O horário sugerido
// (preferredTime) só se confirma na etapa Horário, depois que o serviço
// escolhido define a duração.
function openNewApptModalAt(dateStr, timeStr, slotStartMs, slotEndMs) {
  const freeSlot = (Number.isFinite(slotStartMs) && Number.isFinite(slotEndMs))
    ? { start: slotStartMs, end: slotEndMs }
    : null;
  wiz = newWizState(dateStr, timeStr, freeSlot);
  renderWizard();
}

// Blocos ocupados da profissional no dia — só o trabalho (wb/wa), a pausa
// fica de fora de propósito, igual a RPC get_busy_slots que o agendar.html
// usa: durante a pausa a profissional está livre pra atender outra cliente.
function busyBlocksForStaffOnDate(staffId, dayDate) {
  return state.appointments
    .filter(a => a.staff?.id === staffId && a.status !== 'cancelled' && sameDay(new Date(a.starts_at), dayDate))
    .flatMap(a => {
      const seg = segmentsOf(a);
      const start = new Date(a.starts_at);
      const end = new Date(a.ends_at);
      const blocks = [];
      if (seg.wb > 0) blocks.push([start, new Date(start.getTime() + seg.wb * 60000)]);
      if (seg.wa > 0) blocks.push([new Date(end.getTime() - seg.wa * 60000), end]);
      return blocks;
    });
}

// Horários "HH:MM" livres pra um serviço, profissional e dia — mesma regra
// do agendar.html (expediente + grade de 30 min), só que lendo
// state.appointments direto em vez de RPC, já que aqui a sessão é
// autenticada e os dados já estão carregados.
function computeAvailableSlots(staffId, dateStr, durationMin) {
  if (!staffId || !dateStr || !durationMin) return [];
  const dayDate = new Date(`${dateStr}T00:00:00`);
  const busy = busyBlocksForStaffOnDate(staffId, dayDate);

  const slots = [];
  for (let m = OPEN_HOUR * 60; m + durationMin <= CLOSE_HOUR * 60; m += SLOT_MINUTES) {
    const slotStart = new Date(dayDate);
    slotStart.setHours(0, m, 0, 0); // setHours rola o overflow de minuto pra hora sozinho
    const slotEnd = new Date(slotStart.getTime() + durationMin * 60000);
    const overlaps = busy.some(([bs, be]) => slotStart < be && slotEnd > bs);
    if (!overlaps) {
      const hh = String(Math.floor(m / 60)).padStart(2, '0');
      const mm = String(m % 60).padStart(2, '0');
      slots.push(`${hh}:${mm}`);
    }
  }
  return slots;
}

// Nível de disponibilidade de um dia pro calendário da Etapa 3 (indicador
// verde/amarelo/cinza/vermelho) — só calculável depois que o serviço
// (duração) já foi escolhido na Etapa 2. `null` = ainda não dá pra saber.
function dayAvailabilityLevel(dateStr, staffId, durationMin) {
  const d = new Date(`${dateStr}T00:00:00`);
  if (!isSalonOpenDay(d)) return 'indisponivel';
  if (!staffId || !durationMin) return null;
  const total = Math.max(1, Math.floor((CLOSE_HOUR - OPEN_HOUR) * 60 / SLOT_MINUTES));
  const slots = computeAvailableSlots(staffId, dateStr, durationMin);
  if (!slots.length) return 'nenhum';
  if (slots.length / total <= 0.3) return 'poucos';
  return 'muitos';
}

function wizClient() { return state.clients.find(c => c.id === wiz.clientId) || null; }
function wizService() { return state.services.find(s => s.id === wiz.serviceId) || null; }
function wizStaffId() {
  if (wiz.staffId) return wiz.staffId;
  const ativos = profissionaisAtivos();
  return ativos.length === 1 ? ativos[0].id : null;
}
function wizStaff() { return state.staff.find(s => s.id === wizStaffId()) || null; }

// ── Modo de entrada (Fase 2b) ─────────────────────────────────────────
// Duas etapas (Cliente, Serviço) são sempre 1 e 2 nos dois modos — só o que
// vem depois muda de número de tela conforme wiz.source, por isso o
// dispatch é por NOME de etapa (wizStepName), não por número cru. Isso
// evita ter duas tabelas de step separadas: normal e contextual compartilham
// o mesmo `wiz.step` incremental, só a leitura difere.
const WIZ_TOTAL_STEPS = 5;
const WIZ_TOTAL_STEPS_CONTEXTUAL = 4;
function wizIsContextual() { return wiz.source === 'free-slot'; }
function wizTotalSteps() { return wizIsContextual() ? WIZ_TOTAL_STEPS_CONTEXTUAL : WIZ_TOTAL_STEPS; }
function wizStepName() {
  if (wiz.step === 1) return 'client';
  if (wiz.step === 2) return 'service';
  if (wizIsContextual()) return wiz.step === 3 ? 'time' : 'confirm';
  if (wiz.step === 3) return 'date';
  return wiz.step === 4 ? 'time' : 'confirm';
}

// "Alterar" (banner de contexto) e "Escolher outra data" (etapa Horário,
// quando o serviço não cabe no intervalo) fazem exatamente a mesma coisa:
// voltam ao fluxo completo de 5 etapas a partir de Data, sem perder
// cliente/serviço já escolhidos. Depois de nova data, o fluxo segue normal
// (wizGoToStep(4) do calendário já aponta pra Horário no modo de 5 etapas).
function wizSwitchToFullFlowAtDate() {
  wiz.source = 'button';
  wiz.slotStart = null;
  wiz.slotEnd = null;
  wiz.time = null;
  wizGoToStep(3);
}

function wizContextBannerHtml() {
  if (!wizIsContextual()) return '';
  const [y, m, d] = wiz.date.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const dateLabel = `${WEEKDAY_FULL_LABELS[(dt.getDay() + 6) % 7]}, ${dt.getDate()} ${MONTH_ABBR[dt.getMonth()]}`;
  const hasInterval = wiz.slotStart && wiz.slotEnd;
  const timeLabel = hasInterval
    ? `${new Date(wiz.slotStart).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}–${new Date(wiz.slotEnd).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`
    : '';
  const spoken = `Agendando em ${dateLabel}${timeLabel ? `, ${timeLabel}` : ''}`;
  return `
    <div class="o-wizard-context-banner" role="note" aria-label="${spoken}">
      <div class="o-wizard-context-banner-text" aria-hidden="true">
        Agendando em <b>${dateLabel}</b>${timeLabel ? `<br>${timeLabel}` : ''}
      </div>
      <button class="o-btn o-btn-ghost o-btn-inline" id="wizContextAlterBtn" type="button">Alterar</button>
    </div>
  `;
}

function renderWizard() {
  const total = wizTotalSteps();
  modalContainer.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="o-wizard-sheet" role="dialog" aria-modal="true" aria-label="Novo agendamento">
        <div class="o-wizard-head">
          <button class="o-icon-btn o-wizard-back" id="wizBack" aria-label="Voltar"
            style="visibility:${(wiz.step > 1 || wiz.sub) ? 'visible' : 'hidden'}">${ICONS.chevron}</button>
          <div class="o-wizard-titles"></div>
          <button class="o-icon-btn" id="wizCloseBtn" aria-label="Fechar">${ICONS.close}</button>
        </div>
        <div class="o-wizard-dots" role="progressbar" aria-valuemin="1" aria-valuemax="${total}"
          aria-valuenow="${wiz.step}" aria-label="Etapa ${wiz.step} de ${total}">
          ${Array.from({ length: total }, (_, i) => i + 1).map(n => `
            <span class="o-wizard-dot ${n === wiz.step ? 'is-active' : ''} ${n < wiz.step ? 'is-done' : ''}"></span>
          `).join('')}
        </div>
        ${wizContextBannerHtml()}
        <div class="o-wizard-body" id="wizBody"></div>
        <div class="o-wizard-footer" id="wizFooter"></div>
      </div>
    </div>
  `;
  document.getElementById('wizCloseBtn').onclick = closeModal;
  document.getElementById('modalOverlay').onclick = (e) => { if (e.target.id === 'modalOverlay') closeModal(); };
  document.getElementById('wizBack').onclick = wizGoBack;
  const alterBtn = document.getElementById('wizContextAlterBtn');
  if (alterBtn) alterBtn.onclick = wizSwitchToFullFlowAtDate;
  paintWizStep();
}

function wizGoBack() {
  if (wiz.sub) { wiz.sub = null; wiz.back = true; renderWizard(); return; }
  if (wiz.step > 1) { wiz.step -= 1; wiz.back = true; renderWizard(); }
}

function wizGoToStep(n) {
  wiz.step = n; wiz.back = false; wiz.sub = null;
  renderWizard();
}

// Preenche cabeçalho + corpo + rodapé da etapa atual. Chamada só na troca
// de etapa/sub-tela — buscas (cliente/serviço) atualizam apenas a própria
// lista via wizRenderClientList()/wizRenderServiceList(), nunca isto,
// senão o <input> perderia o foco a cada letra (mesma armadilha já
// documentada na lista de Clientes/Estoque).
function paintWizStep() {
  const titlesEl = document.querySelector('.o-wizard-titles');
  const bodyEl = document.getElementById('wizBody');
  const footEl = document.getElementById('wizFooter');
  if (!bodyEl) return;

  // Nome de etapa, não número cru: no modo contextual "3" é Horário, no
  // normal "3" é Data. wizStepName() é a única fonte dessa tradução.
  const name = wiz.sub === 'quickAddClient' ? null : wizStepName();
  let step;
  if (wiz.sub === 'quickAddClient') step = wizStepQuickAddClient();
  else if (name === 'client') step = wizStepClient();
  else if (name === 'service') step = wizStepService();
  else if (name === 'date') step = wizStepDate();
  else if (name === 'time') step = wizStepTime();
  else step = wizStepConfirm();

  titlesEl.innerHTML = `
    <div class="o-wizard-title">${step.title}</div>
    ${step.subtitle ? `<div class="o-wizard-subtitle">${step.subtitle}</div>` : ''}
  `;
  bodyEl.innerHTML = `<div class="o-wizard-step ${wiz.back ? 'is-back' : ''}">${step.bodyHtml}</div>`;
  footEl.innerHTML = step.footHtml || '';
  wiz.back = false;

  if (wiz.sub === 'quickAddClient') wizBindQuickAddClient();
  else if (name === 'client') wizBindStepClient();
  else if (name === 'service') wizBindStepService();
  else if (name === 'date') wizBindStepDate();
  else if (name === 'time') wizBindStepTime();
  else wizBindStepConfirm();
}

// ── Etapa 1 · Cliente ──────────────────────────────────────────
function wizRecentClients() {
  // "Clientes recentes" = últimos 6 pela última visita; sem histórico
  // nenhum entra por cadastro mais novo, pra lista nunca ficar vazia à toa.
  return state.clients
    .map(c => ({ c, lastVisitIso: clientStats(c.id).lastVisitIso }))
    .sort((a, b) => {
      if (a.lastVisitIso && b.lastVisitIso) return new Date(b.lastVisitIso) - new Date(a.lastVisitIso);
      if (a.lastVisitIso) return -1;
      if (b.lastVisitIso) return 1;
      return new Date(b.c.created_at || 0) - new Date(a.c.created_at || 0);
    })
    .slice(0, 6)
    .map(r => r.c);
}
function wizFilteredClients() {
  const q = (wiz.clientQuery || '').trim().toLowerCase();
  if (!q) return null; // null = mostra "recentes" em vez de resultado de busca
  return state.clients.filter(c => `${c.name || ''} ${c.phone || ''}`.toLowerCase().includes(q));
}
function wizClientRowHtml(c) {
  const color = colorForId(c.id);
  return `
    <button class="o-card o-card-interactive o-wizard-client-row" data-client-id="${c.id}">
      <span class="o-avatar o-avatar-sm" style="--avatar-bg:${color.border};--avatar-color:var(--color-bg)" aria-hidden="true">${initials(c.name)}</span>
      <span class="wcr-body">
        <span class="wcr-name">${c.name}</span>
        ${c.phone ? `<div class="wcr-phone">${c.phone}</div>` : ''}
      </span>
      <span class="wcr-chevron" aria-hidden="true">${ICONS.chevron}</span>
    </button>
  `;
}

function wizBindStepClient() {

  const input = document.getElementById('wizClientSearch');
  const clear = document.getElementById('wizClientSearchClear');
  field.classList.toggle('has-text', !!input.value);

function wizRenderClientList() {
  const wrap = document.getElementById('wizClientListWrap');
  if (!wrap) return;
  const filtered = wizFilteredClients();
  const list = filtered !== null ? filtered : wizRecentClients();
  const label = filtered !== null
    ? `${list.length} ${list.length === 1 ? 'resultado' : 'resultados'}`
    : 'Clientes recentes';

  wrap.innerHTML = `
    ${state.clients.length ? `<div class="o-wizard-section-label">${label}</div>` : ''}
    ${!list.length
      ? `<div class="o-wizard-empty">${filtered !== null ? 'Nenhum cliente encontrado.' : 'Nenhum cliente ainda.'}</div>`
      : `<div class="o-wizard-list">${list.map(wizClientRowHtml).join('')}</div>`}
    <button class="o-wizard-add-client" id="wizAddClientBtn" type="button">
      <span aria-hidden="true">${ICONS.plus}</span><span>Novo cliente</span>
    </button>
  `;

  wrap.querySelectorAll('.o-wizard-client-row[data-client-id]').forEach(btn => {
    btn.onclick = () => { wiz.clientId = btn.dataset.clientId; wizGoToStep(2); };
  });
  document.getElementById('wizAddClientBtn').onclick = () => {
    wiz.sub = 'quickAddClient';
    wiz.back = false;
    renderWizard();

// Sub-tela de Etapa 1 · cadastro rápido — nunca outro modal, só um slide

  return {

    subtitle: 'Cadastro rápido',
    bodyHtml: `
      <div class="o-wizard-nc-icon" aria-hidden="true">${ICONS.userPlus}</div>
      <div class="o-card">
        <div class="o-field">
          <label class="o-field-label" for="wizNcName">Nome</label>
          <input type="text" id="wizNcName" class="o-input" placeholder="Nome completo" autocomplete="off">
        </div>
        <div class="o-field" style="margin-top:var(--space-3)">
          <label class="o-field-label" for="wizNcPhone">Telefone</label>
          <input type="tel" id="wizNcPhone" class="o-input" placeholder="+353 ..." autocomplete="off">
        </div>
      </div>
      <div id="wizNcError" class="login-error" style="display:none;margin-top:var(--space-3)"></div>
    `,
    footHtml: `<button class="o-btn o-btn-primary" id="wizNcContinue">Continuar</button>`,
  };
}
function wizBindQuickAddClient() {
  document.getElementById('wizNcContinue').onclick = async () => {
    const nameEl = document.getElementById('wizNcName');
    const phoneEl = document.getElementById('wizNcPhone');
    const errEl = document.getElementById('wizNcError');
    const btn = document.getElementById('wizNcContinue');
    const name = nameEl.value.trim();
    const phone = phoneEl.value.trim();
    if (!name || !phone) {
      errEl.textContent = 'Preencha nome e telefone.';
      errEl.style.display = 'block';
      return;
    }
    btn.setAttribute('aria-busy', 'true');
    btn.disabled = true;
    // Mesma regra de duplicidade do agendamento online: find_or_create_client
    // normaliza o telefone no banco (353 + sem zero à esquerda) e reaproveita
    // a cliente se o número já existir. Antes essa checagem era feita aqui
    // com só dígitos crus — não batia com um telefone gravado via RPC no
    // mesmo formato "0871234567" vs "353871234567", e podia duplicar.
    const { data: clientId, error } = await sb.rpc('find_or_create_client', {
      p_name: name,
      p_phone: phone,
      p_email: null,
    });
    if (error || !clientId) {
      errEl.textContent = 'Erro ao cadastrar: ' + (error ? error.message : 'faça login novamente.');
      errEl.style.display = 'block';
      btn.removeAttribute('aria-busy');
      btn.disabled = false;
      return;
    }
    await loadClients();
    wiz.clientId = clientId;
    wiz.sub = null;
    wizGoToStep(2);
  };
}

// ── Etapa 2 · Serviço ──────────────────────────────────────────
function wizServicesUsageOrder() {
  // "Mais utilizados" = frequência real em appointments, não um campo do
  // banco — mesmo espírito de clientStats()/favoriteServices.
  const freq = {};
  state.appointments.forEach(a => { if (a.service?.id) freq[a.service.id] = (freq[a.service.id] || 0) + 1; });
  return [...state.services].sort((a, b) => (freq[b.id] || 0) - (freq[a.id] || 0));
}
function wizFilteredServices() {
  const q = (wiz.serviceQuery || '').trim().toLowerCase();
  const base = wizServicesUsageOrder();
  if (!q) return base;
  return base.filter(s => (s.name || '').toLowerCase().includes(q));
}

function wizRenderCalendar() {

  if (!wrap) return;

  const monthLabelRaw = viewDate.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  const monthLabel = monthLabelRaw.charAt(0).toUpperCase() + monthLabelRaw.slice(1);
  const firstOfMonth = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
  const gridStart = startOfWeek(firstOfMonth);
  const cells = Array.from({ length: 42 }, (_, i) => {
    const d = new Date(gridStart);
    d.setDate(d.getDate() + i);
    return d;
  });
  const todayStart = new Date(); todayStart.setHours(0, 0, 0, 0);
  const service = wizService();
  const staffId = wizStaffId();

  wrap.innerHTML = `
    <div class="o-wizard-cal-head">
      <button class="o-icon-btn o-icon-btn-outlined" id="wizCalPrev" aria-label="Mês anterior" style="transform:rotate(180deg)">${ICONS.chevron}</button>
      <div class="o-wizard-cal-title">${monthLabel}</div>
      <button class="o-icon-btn o-icon-btn-outlined" id="wizCalNext" aria-label="Próximo mês">${ICONS.chevron}</button>
    </div>
    <div class="o-wizard-cal-weekdays">${WEEKDAY_LABELS.map(l => `<div>${l}</div>`).join('')}</div>
    <div class="o-wizard-cal-grid">
      ${cells.map(d => {
        const inMonth = d.getMonth() === viewDate.getMonth();
        const dateStr = d.toISOString().split('T')[0];
        const isPast = d < todayStart;
        const level = inMonth && !isPast ? dayAvailabilityLevel(dateStr, staffId, service?.duration_minutes) : null;
        const disabled = !inMonth || isPast || level === 'indisponivel';
        const selected = wiz.date === dateStr;
        return `
          <button class="o-wizard-cal-day ${selected ? 'is-selected' : ''} ${sameDay(d, new Date()) ? 'is-today' : ''} ${!inMonth ? 'is-outside' : ''}"
            data-date="${dateStr}" ${disabled ? 'disabled' : ''} aria-current="${selected ? 'date' : 'false'}"
            aria-label="${d.getDate()} de ${monthLabel}">
            <span>${d.getDate()}</span>
            ${level ? `<span class="wcd-dot lvl-${level}" aria-hidden="true"></span>` : ''}
          </button>

      }).join('')}

    <div class="o-wizard-cal-legend">
      <span><i class="lvl-muitos"></i>Muitos horários</span>
      <span><i class="lvl-poucos"></i>Poucos horários</span>
      <span><i class="lvl-nenhum"></i>Nenhum horário</span>
      <span><i class="lvl-indisponivel"></i>Indisponível</span>
    </div>

  document.getElementById('wizCalPrev').onclick = () => {

    wiz.calendarMonth = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1);
    wizRenderCalendar();

  wrap.querySelectorAll('.o-wizard-cal-day[data-date]:not(:disabled)').forEach(btn => {
    btn.onclick = () => {
      wiz.date = btn.dataset.date;
      wiz.time = null;
      wizGoToStep(4);
    };
  });
}

// ── Etapa 4 · Horário ──────────────────────────────────────────
// Mensagens de apresentação — ainda não refletem inteligência real (PR
// combinado com o Raphael: placeholders por enquanto). Duas exceções
// honestas: o horário que encosta exatamente no fim de outro atendimento
// (fecha um buraco na agenda) ganha "Recomendado" de verdade; no modo
// contextual (opts.contextualFirst), quem ganha é o primeiro horário da
// lista, porque a lista já foi filtrada pro intervalo clicado — ele É o
// início do espaço livre, não decoração.
function wizSlotMessages(slots, staffId, dateStr, durationMin, opts) {
  const contextualFirst = !!(opts && opts.contextualFirst);
  const busy = busyBlocksForStaffOnDate(staffId, new Date(`${dateStr}T00:00:00`));
  const busyEnds = busy.map(([, be]) => be.getTime());
  let recommendedAssigned = false;
  return slots.map((t, i) => {
    if (contextualFirst && i === 0) {
      recommendedAssigned = true;
      return { time: t, recommended: true, message: 'Usa o início do horário livre.' };
    }
    const [hh, mm] = t.split(':').map(Number);
    const slotStart = new Date(`${dateStr}T00:00:00`);
    slotStart.setHours(hh, mm, 0, 0);
    const fillsGap = busyEnds.some(end => Math.abs(end - slotStart.getTime()) < 60000);
    if (fillsGap && !recommendedAssigned) {
      recommendedAssigned = true;
      return { time: t, recommended: true, message: 'Aproveita um intervalo livre sem aumentar sua jornada.' };
    }
    if (i === 0) return { time: t, recommended: false, message: 'Bom encaixe pela manhã' };
    if (i === slots.length - 1) return { time: t, recommended: false, message: 'Último horário disponível' };
    return { time: t, recommended: false, message: 'Agenda tranquila' };
  });
}
// Restringe os horários (já calculados por computeAvailableSlots — regras
// de negócio intactas) ao buraco real clicado na Agenda. Puro filtro por
// cima do resultado, nunca recálculo de disponibilidade.
function wizFilterSlotsToInterval(rawSlots, dateStr, durationMin) {
  if (!wizIsContextual() || !wiz.slotStart || !wiz.slotEnd) return rawSlots;
  return rawSlots.filter(t => {
    const [hh, mm] = t.split(':').map(Number);
    const slotStart = new Date(`${dateStr}T00:00:00`);
    slotStart.setHours(hh, mm, 0, 0);
    const slotEnd = new Date(slotStart.getTime() + durationMin * 60000);
    return slotStart.getTime() >= wiz.slotStart && slotEnd.getTime() <= wiz.slotEnd;
  });
}
function wizDayPreviewHtml(staffId, durationMin) {
  const busy = busyBlocksForStaffOnDate(staffId, new Date(`${wiz.date}T00:00:00`));
  const totalMin = (CLOSE_HOUR - OPEN_HOUR) * 60;
  const pct = (mins) => `${Math.max(0, Math.min(100, (mins / totalMin) * 100))}%`;
  const busyBars = busy.map(([bs, be]) => {
    const startMin = (bs.getHours() * 60 + bs.getMinutes()) - OPEN_HOUR * 60;
    const endMin = (be.getHours() * 60 + be.getMinutes()) - OPEN_HOUR * 60;
    return `<div class="o-wizard-daypreview-busy" style="left:${pct(startMin)};width:${pct(endMin - startMin)}"></div>`;
  }).join('');
  let markHtml = '';
  if (wiz.time) {
    const [hh, mm] = wiz.time.split(':').map(Number);
    const startMin = (hh * 60 + mm) - OPEN_HOUR * 60;
    markHtml = `<div class="o-wizard-daypreview-mark" style="left:${pct(startMin)}"></div>`;
  }
  return `
    <div class="o-wizard-daypreview">
      <div class="o-wizard-daypreview-track">${busyBars}${markHtml}</div>
      <div class="o-wizard-daypreview-labels"><span>${OPEN_HOUR}h</span><span>${CLOSE_HOUR}h</span></div>
    </div>
  `;
}
function wizStepTime() {
  return { title: 'Horários disponíveis', subtitle: '', bodyHtml: `<div id="wizSlotsWrap"></div>`, footHtml: '' };
}
function wizBindStepTime() {
  wizRenderSlots();
}
function wizRenderSlots() {
  const wrap = document.getElementById('wizSlotsWrap');
  if (!wrap) return;
  const service = wizService();
  const staffId = wizStaffId();
  if (!service || !staffId || !wiz.date) {
    wrap.innerHTML = `<div class="o-wizard-empty">Volte e escolha o serviço e a data.</div>`;
    return;
  }
  const [y, m, d] = wiz.date.split('-').map(Number);
  const dateLabelRaw = new Date(y, m - 1, d).toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  const dateLabel = dateLabelRaw.charAt(0).toUpperCase() + dateLabelRaw.slice(1);

  const daySlots = computeAvailableSlots(staffId, wiz.date, service.duration_minutes);
  const contextual = wizIsContextual() && !!wiz.slotStart && !!wiz.slotEnd;
  const rawSlots = contextual ? wizFilterSlotsToInterval(daySlots, wiz.date, service.duration_minutes) : daySlots;
  if (!wiz.time && wiz.preferredTime && rawSlots.includes(wiz.preferredTime)) wiz.time = wiz.preferredTime;

  if (!rawSlots.length) {
    if (!contextual) {
      wrap.innerHTML = `
        <div class="o-wizard-section-label">${dateLabel}</div>
        <div class="o-wizard-empty">Sem horário livre nesse dia. Volte e escolha outra data.</div>
      `;
      return;
    }
    // Modo contextual não tem etapa Data pra "voltar" — a saída é sempre uma
    // ação explícita. `fits` distingue "não cabe neste intervalo, mas cabe
    // em outro horário do dia" de "não sobrou nada nesse dia".
    const fits = daySlots.length > 0;
    wrap.innerHTML = `
      <div class="o-wizard-section-label">${dateLabel}</div>
      <div class="o-wizard-empty">${fits ? 'Este serviço não cabe neste intervalo.' : 'Sem horário livre nesse dia.'}</div>
      ${fits ? `<button class="o-btn o-btn-secondary" id="wizSeeOtherTimesBtn" type="button" style="margin-top:var(--space-3)">Ver outros horários neste dia</button>` : ''}
      <button class="o-btn o-btn-ghost" id="wizPickAnotherDateBtn" type="button" style="margin-top:${fits ? 'var(--space-2)' : 'var(--space-3)'}">Escolher outra data</button>
    `;
    if (fits) {
      document.getElementById('wizSeeOtherTimesBtn').onclick = () => {
        wiz.slotStart = null;
        wiz.slotEnd = null;
        // renderWizard(), não só wizRenderSlots(): o banner de contexto (fora
        // de #wizBody) mostra o intervalo, e precisa sumir a linha de hora
        // junto com a restrição.
        renderWizard();
      };
    }
    document.getElementById('wizPickAnotherDateBtn').onclick = wizSwitchToFullFlowAtDate;
    return;
  }

  const slots = wizSlotMessages(rawSlots, staffId, wiz.date, service.duration_minutes, { contextualFirst: contextual });

  wrap.innerHTML = `
    <div class="o-wizard-section-label">${dateLabel}</div>
    ${slots.map(s => `
      <button class="o-card o-card-interactive o-wizard-slot-card ${wiz.time === s.time ? 'is-selected' : ''}" data-time="${s.time}" aria-selected="${wiz.time === s.time}">
        ${s.recommended ? `<div class="o-badge o-badge-attention o-wizard-slot-badge">${ICONS.sparkle} Recomendado</div>` : ''}
        <div class="o-wizard-slot-top">
          <span class="o-wizard-slot-time">${s.time}</span>
          <span class="o-wizard-slot-check" aria-hidden="true">${ICONS.check}</span>
        </div>
        <div class="o-wizard-slot-msg">${s.message}</div>
      </button>
    `).join('')}
    ${wizDayPreviewHtml(staffId, service.duration_minutes)}
  `;

  wrap.querySelectorAll('.o-wizard-slot-card[data-time]').forEach(btn => {
    btn.onclick = () => {
      wiz.time = btn.dataset.time;
      wizRenderSlots();
      setTimeout(() => wizGoToStep(wizIsContextual() ? 4 : 5), prefersReducedMotion() ? 0 : 200);
    };
  });
}

  if (!c || !s || !wiz.date || !wiz.time) {
