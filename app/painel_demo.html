<script>
// ===== DADOS DE EXEMPLO — apenas para pré-visualização, não usa o Supabase real =====
function mockData(table){
  const now = new Date();
  const startOfDay = (d) => { const x=new Date(d); x.setHours(0,0,0,0); return x; };

  // Coloração e Mechas têm pausa: a tinta age sozinha, a profissional fica
  // livre no meio. É o que abre espaço pro encaixe e o que a timeline mostra
  // como faixa listrada.
  // category segue as 5 categorias reais do banco (Alisamento, Coloração,
  // Corte, Outros, Tratamentos) — sem isso a agenda do demo ficaria
  // monocromática de novo, o mesmo bug que colorForService() corrigiu.
  if (table === 'services') return [
    {id:'s1', name:'Coloração', category:'Coloração', price:180, duration_minutes:120, work_before_minutes:45, gap_minutes:40, work_after_minutes:35},
    {id:'s2', name:'Corte', category:'Corte', price:80, duration_minutes:45},
    {id:'s3', name:'Escova', category:'Tratamentos', price:60, duration_minutes:40},
    {id:'s4', name:'Mechas', category:'Outros', price:220, duration_minutes:150, work_before_minutes:60, gap_minutes:50, work_after_minutes:40},
    {id:'s5', name:'Hidratação', category:'Tratamentos', price:70, duration_minutes:50},
  ];

  // Rebecca existe só pra simular o histórico (igual às 4 profissionais
  // inativas do banco real) — não conta em profissionaisAtivos() e por isso
  // o campo "Profissional" some sozinho no modal, igual em produção. Nunca
  // reative ela sem reativar de verdade a lógica de múltiplas profissionais.
  if (table === 'staff') return [
    {id:'st1', name:'Juliane Orenzi', role:'Colorista', active:true},
    {id:'st2', name:'Rebecca Silva', role:'Cabeleireira', active:false},
  ];

  // Mesmo catálogo que está no banco. Luvas e shampoo entram no mínimo de
  // propósito: é o estado "precisa repor" que a tela existe pra mostrar.
  if (table === 'products') return [
    {id:'p1', name:'Água oxigenada 20 vol', brand:'Welloxon', category:'Descoloração', unit:'ml', quantity:900, min_quantity:500, cost:0.01, notes:null, active:true},
    {id:'p2', name:'Luvas descartáveis', brand:null, category:'Descartáveis', unit:'cx', quantity:2, min_quantity:2, cost:6, notes:null, active:true},
    {id:'p3', name:'Máscara de reconstrução', brand:'Olaplex', category:'Tratamento', unit:'g', quantity:500, min_quantity:250, cost:0.12, notes:null, active:true},
    {id:'p4', name:'Pó descolorante', brand:'Blondor', category:'Descoloração', unit:'g', quantity:450, min_quantity:200, cost:0.09, notes:null, active:true},
    {id:'p5', name:'Shampoo pós-química', brand:'Sebastian', category:'Finalização', unit:'ml', quantity:250, min_quantity:300, cost:0.04, notes:null, active:true},
    {id:'p6', name:'Tinta 7.0 louro médio', brand:'Koleston', category:'Coloração', unit:'un', quantity:3, min_quantity:2, cost:7.5, notes:null, active:true},
  ];

  if (table === 'clients') {
    const names = ['Marina Costa','Beatriz Lima','Ana Souza','Carla Reis','Fernanda Alves','Julia Prado',
      'Patrícia Nunes','Camila Rocha','Larissa Dias','Renata Melo','Aline Souza','Débora Farias',
      'Vanessa Costa','Gabriela Lopes'];
    return names.map((name, i) => {
      const d = new Date(now.getFullYear(), now.getMonth() - (i % 5), 3 + i);
      return { id: 'c' + i, name, phone: '35389' + (100 + i), created_at: d.toISOString() };
    });
  }

  if (table === 'appointments') {
    const appts = [];
    const services = [
      {id:'s1', name:'Coloração', price:180, work_before_minutes:45, gap_minutes:40, work_after_minutes:35},
      {id:'s2', name:'Corte', price:80},
      {id:'s3', name:'Escova', price:60},
      {id:'s4', name:'Mechas', price:220, work_before_minutes:60, gap_minutes:50, work_after_minutes:40},
      {id:'s5', name:'Hidratação', price:70},
    ];
    const clientNames = ['Marina Costa','Beatriz Lima','Ana Souza','Carla Reis','Fernanda Alves','Julia Prado',
      'Patrícia Nunes','Camila Rocha','Larissa Dias','Renata Melo'];
    // Só a Juliane atende — igual em produção. Rebecca é profissional
    // inativa (existe só no histórico), não entra nos agendamentos novos.
    const juliane = {id:'st1',name:'Juliane Orenzi'};
    let n = 0;
    function push(dt, durMin, status, i){
      const s = new Date(dt);
      const e = new Date(s.getTime() + durMin*60000);
      const svc = services[i % services.length];
      const createdAt = new Date(s.getTime() - (1 + (i % 5)) * 86400000); // "criado" alguns dias antes
      appts.push({
        id: 'appt' + (n++),
        starts_at: s.toISOString(), ends_at: e.toISOString(), status,
        created_at: createdAt.toISOString(),
        source: (i % 6 === 0) ? 'online' : 'manual',
        client: { id: 'c' + (i % clientNames.length), name: clientNames[i % clientNames.length] },
        staff: juliane,
        // ...svc e não só id/name/price: os campos de segmento (pausa) precisam
        // chegar na timeline, é deles que sai a faixa listrada do bloco.
        service: { ...svc },
      });
    }

    // HOJE — dia bem movimentado
    [9, 10.5, 12, 14, 15.5, 17].forEach((h, i) => {
      const dt = new Date(now); dt.setHours(Math.floor(h), (h % 1) * 60, 0, 0);
      push(dt, [45,120,40,150,60,45][i], i < 2 ? 'completed' : 'confirmed', i);
    });

    // AMANHÃ — dia mais tranquilo
    const tmr = new Date(now); tmr.setDate(tmr.getDate() + 1);
    [10, 14].forEach((h, i) => {
      const dt = new Date(tmr); dt.setHours(h, 0, 0, 0);
      push(dt, 60, 'confirmed', i + 6);
    });

    // RESTANTE DA SEMANA (a partir de amanhã até domingo) — volume variado
    const weekCounts = [0, 0, 6, 2, 5, 3, 8, 1]; // índice = dias a partir de hoje (aprox)
    for (let dOffset = 2; dOffset <= 6; dOffset++) {
      const dt0 = new Date(now); dt0.setDate(dt0.getDate() + dOffset);
      const countForDay = [3, 5, 2, 6, 4][dOffset - 2] || 2;
      for (let k = 0; k < countForDay; k++) {
        const dt = new Date(dt0); dt.setHours(9 + k * 1.5, 0, 0, 0);
        push(dt, 50, 'confirmed', dOffset * 3 + k);
      }
    }

    // SEMANA PASSADA (histórico, pra Tendência da Semana comparar)
    for (let dOffset = 1; dOffset <= 7; dOffset++) {
      const dt0 = new Date(now); dt0.setDate(dt0.getDate() - dOffset - 7 + 7); // ajusta abaixo
    }
    const lastWeekStart = new Date(now); lastWeekStart.setDate(lastWeekStart.getDate() - 7);
    const lastWeekCounts = [2, 1, 3, 2, 4, 3, 1];
    for (let i = 0; i < 7; i++) {
      const dt0 = new Date(lastWeekStart); dt0.setDate(dt0.getDate() + i);
      for (let k = 0; k < lastWeekCounts[i]; k++) {
        const dt = new Date(dt0); dt.setHours(9 + k * 1.5, 0, 0, 0);
        push(dt, 50, 'completed', i * 4 + k);
      }
    }

    // ÚLTIMOS ~45 DIAS (histórico geral, pra ocupação/insights do mês)
    for (let d = 8; d < 40; d++) {
      const dt = new Date(now); dt.setDate(dt.getDate() - d); dt.setHours(9 + (d % 6), 0, 0, 0);
      push(dt, 50, 'completed', d);
    }

    // ÚLTIMOS 5 MESES (pra evolução da receita e faturamento mensal)
    for (let m = 1; m <= 5; m++) {
      for (let k = 0; k < 10; k++) {
        const dt = new Date(now.getFullYear(), now.getMonth() - m, 2 + k * 3);
        push(dt, 50, 'completed', m * 10 + k);
      }
    }

    return appts;
  }

  if (table === 'booking_visits') {
    const visits = [];
    let vid = 0;
    // várias visitas este mês (mais visitas do que conversões, como no mundo real)
    const dayOfMonth = now.getDate();
    for (let d = 1; d <= dayOfMonth; d++) {
      const count = 6 + (d % 5); // 6 a 10 visitas por dia, dentro do mês atual
      for (let k = 0; k < count; k++) {
        const dt = new Date(now.getFullYear(), now.getMonth(), d, 9 + k, 15, 0);
        visits.push({ id: 'visit' + (vid++), created_at: dt.toISOString() });
      }
    }
    // alguma atividade no mês anterior também, pra "Comparativos" ficarem realistas
    for (let d = 1; d <= 20; d++) {
      const dt = new Date(now.getFullYear(), now.getMonth() - 1, d, 10, 0, 0);
      visits.push({ id: 'visitprev' + (vid++), created_at: dt.toISOString() });
    }
    return visits;
  }
  return [];
}

window.supabase = {
  createClient: function () {
    return {
      auth: {
        getSession: async function () { return { data: { session: { user: { id: 'demo' } } } }; },
        signInWithPassword: async function () { return {}; },
        signOut: async function () { return {}; },
        onAuthStateChange: function () {},
      },
      channel: function () { return { on: function () { return { subscribe: function () {} }; } }; },
      from: function (table) {
        const lista = function () { return Promise.resolve({ data: mockData(table), error: null }); };

        // Escrita no demo não sai daqui: devolve sucesso pra tela seguir o fluxo
        // normal (inclusive o .select() que o painel usa pra provar que gravou).
        // O valor que aparece é o que o painel já pôs no state antes de chamar,
        // então o + e o − do estoque mexem de verdade — só não persistem.
        const ok = function () { return Promise.resolve({ data: [{ id: 'demo' }], error: null }); };
        const escrita = {
          select: ok, eq: function () { return escrita; },
          then: function (res, rej) { return ok().then(res, rej); },
        };

        return {
          select: function () {
            return {
              order: lista,
              eq: function () { return { order: lista, maybeSingle: function () { return Promise.resolve({ data: null }); } }; },
              neq: function () { return { order: lista }; },
            };
          },
          insert: function () { return escrita; },
          update: function () { return escrita; },
          delete: function () { return escrita; },
        };
      },
    };
  },
};
</script>

  /* ── Padrão de linha (modelo: Início/Insights) ─────────────────
     Base que toda lista do app usa: cartão em --color-surface com borda
     e leve elevação ao toque, não o cinza plano de --color-neutral-100

  .appt-modern-card, .list-row {

  /* Header inspirado no princípio do Calendar da Apple: mês em pílula
     (setas dentro, com borda) à esquerda, + à direita — não é cópia, é o
     mesmo tipo de hierarquia aplicado aos tokens do Orenzi. Cabeçalho e
     faixa de dias ficam próximos (gap pequeno abaixo) pra ler como UM
     sistema de navegação; o respiro "de verdade" fica pro título de data,
     que é onde a tela muda de assunto (controle → conteúdo). */
  .day-nav {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin: 22px 0 14px;
  }
  .month-pill {
    display: flex; align-items: center; gap: 2px;
    background: var(--color-surface); border: 1.5px solid var(--color-divider);
    border-radius: 999px; padding: 4px 6px 4px 4px;
  }
  .month-pill .day-label { font-family: var(--font-heading); font-weight: 600; font-size: 16px; padding: 0 2px; }
  .month-pill .day-label-btn {
    display: flex; align-items: center; gap: 6px; background: none; border: none;
    cursor: pointer; padding: 4px 2px; color: inherit;
  }
  .month-pill .day-label-btn svg { width: 10px; height: 10px; color: var(--color-neutral-600); flex-shrink: 0; }
  .month-pill .day-label-btn:hover .day-label { color: var(--color-accent-700); }
  .month-pill button.arrow {
    width: 28px; height: 28px; border-radius: 50%; border: none;
    background: none; color: var(--color-text);
    font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: background .15s ease;
  }
  .month-pill button.arrow:hover { background: var(--color-neutral-100); }
  /* + da agenda: squircle no topo, ao lado da pílula do mês — troca o FAB
     circular flutuante que só o Estoque continua usando. */
  .agenda-add-btn {
    /* 42px, não 38 — bate com a altura real da .month-pill ao lado (o
       conteúdo dela mede ~41.6px), senão os dois ficam ligeiramente
       descasados na mesma linha. */
    width: 42px; height: 42px; border-radius: 13px; border: none; flex-shrink: 0;
    background: var(--color-accent); color: var(--color-bg); font-size: 22px; line-height: 1;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: transform .18s cubic-bezier(.34,1.56,.64,1); -webkit-tap-highlight-color: transparent;
  }
  .agenda-add-btn:active { transform: scale(0.9); }

  /* Título entre a faixa de dias e a agenda — hierarquia própria, não
     duplica o "Agenda" do cabeçalho nem o mês do day-nav. É o único respiro
     grande da zona de navegação, de propósito: marca onde o controle acaba
     e o conteúdo começa. */
  .agenda-date-title {
    font-family: var(--font-heading); font-weight: 600; font-size: 17px;
    color: var(--color-text); margin: 22px 2px 18px;

  .week-strip {

  }
  .week-day {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    padding: 12px 4px; border-radius: 12px; cursor: pointer;
    border: 1.5px solid var(--color-divider);
    background: var(--color-surface); font-family: var(--font-body);
    /* border-color/background em .2s: é a seleção "deslizando" de um dia
       pro outro quando os botões continuam os mesmos elementos (ver
       updateWeekStripSelection). transform tem easing "com molinha" —
       retorno elástico discreto no toque, não instantâneo. */
    transition: border-color .2s ease, background .2s ease,
      transform .14s cubic-bezier(.34,1.56,.64,1), opacity .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .week-day:hover { border-color: var(--color-neutral-300); }
  .week-day:active { transform: scale(0.97); opacity: 0.85; }
  .week-day .wd-label {

    letter-spacing: 0.03em;

  .week-day .wd-num {

    font-size: 15px; font-weight: 700; color: var(--color-text);

  .week-day.selected .wd-num { background: transparent; color: var(--color-bg); }
  .week-day.selected .wd-label { color: var(--color-neutral-300); }
  .week-day.is-today:not(.selected) { border-color: var(--color-accent-700); }

  .week-day.is-today:not(.selected) .wd-label { color: var(--color-accent-700); }
  .week-day .wd-dot {
    width: 4px; height: 4px; border-radius: 50%; background: var(--color-accent-2);
    visibility: hidden;
  }
  .week-day.has-appts .wd-dot { visibility: visible; }
  .week-day.selected .wd-dot { background: var(--color-accent-2); }
  .month-cal-overlay {
    position: fixed; inset: 0; background: rgba(43,36,32,0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; padding: 20px; backdrop-filter: blur(2px);
  }
  .month-cal-card {
    background: var(--color-bg); border-radius: 20px; padding: 22px;
    width: 100%; max-width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }

    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .month-cal-header .day-label {

  }

  .month-cal-weekdays div {

    text-transform: uppercase;
  }
  .month-cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
  }
  .month-cal-day {
    aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; border: none; border-radius: 10px; background: transparent; cursor: pointer;
    font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--color-text);
  }
  .month-cal-day:hover { background: var(--color-neutral-200); }
  .month-cal-day.is-outside { color: var(--color-neutral-300); }
  .month-cal-day.is-today { color: var(--color-accent-700); }
  .month-cal-day.selected { background: var(--color-text); color: var(--color-bg); }
  .month-cal-day .wd-dot {
    width: 4px; height: 4px; border-radius: 50%; background: var(--color-accent-2);
    visibility: hidden;
  }
  .month-cal-day.has-appts .wd-dot { visibility: visible; }
  .month-cal-day.selected .wd-dot { background: var(--color-accent-2); }
  /* Fundo/borda no padrão de cartão do resto do app (Início/Insights) —
     antes era o cinza chapado sem borda que só a Agenda ainda usava. O
     padding-left de 52px é geometria, não estilo: hour-label é ancorado
     em -52px pra encostar no início do conteúdo, então não mexe aqui. */
  /* Envolve .timeline só durante o slide de dia — o resto do tempo é
     transparente, sem efeito no layout. */
  .agenda-viewport { position: relative; overflow: hidden; }
  .agenda-pane { position: absolute; top: 0; left: 0; width: 100%; will-change: transform; }
  /* Sem card: a grade fica "solta" (referência: Apple Calendar) — só linhas
     de hora extremamente discretas, sem fundo nem borda envolvendo tudo.
     O padding-left de 52px continua sendo geometria, não estilo. */
  .timeline {
    position: relative;
    padding: 0 0 0 52px; margin-top: 4px;
    max-height: 62vh; overflow-y: auto; overflow-x: hidden;
    scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
    /* Some por padrão, só aparece durante a rolagem (classe .is-scrolling,
       ligada/desligada por JS — CSS não tem "faz 1s que parou de rolar"). */
    scrollbar-width: thin; scrollbar-color: transparent transparent;
  }
  .timeline::-webkit-scrollbar { width: 5px; }
  .timeline::-webkit-scrollbar-track { background: transparent; }
  .timeline::-webkit-scrollbar-thumb { background: transparent; border-radius: 999px; transition: background .3s ease; }
  .timeline.is-scrolling { scrollbar-color: var(--color-neutral-300) transparent; }
  .timeline.is-scrolling::-webkit-scrollbar-thumb { background: var(--color-neutral-300); }
  .hour-row {
    position: relative; height: 68px; border-top: 1px solid rgba(43,36,32,0.07);
  }
  .hour-row:first-child { border-top: none; }
  /* Hierarquia da timeline: hora é o elemento de MENOR peso (só orienta),
     evento é o de destaque, linha do horário atual é o mais importante de
     todos — ver z-index e cor abaixo. */
  .hour-label {
    position: absolute; left: -52px; top: -8px; width: 46px; text-align: right;
    font-size: 10.5px; color: var(--color-neutral-600); opacity: 0.8;
    font-variant-numeric: tabular-nums;
  }
  .timeline-body { position: relative; }
  /* Linha do horário atual — cor de marca (marrom/caramelo), não vermelho.
     Só existe no dia de hoje; updateCurrentTimeLine() reposiciona a cada
     30s. transition:top faz o reposicionamento deslizar suave (parecer
     contínuo) em vez de saltar de 30 em 30s. */
  .current-time-line {
    position: absolute; left: -52px; right: 0; display: flex; align-items: center;
    z-index: 30; pointer-events: none; animation: currentTimeFadeIn .22s ease;
    transition: top 1s linear;
    /* `top` marca o instante exato, mas a caixa cresce pra baixo a partir
       dele (a altura vem do badge, o filho mais alto) — sem isto o centro
       visual do selo/ponto/linha ficava ~9px abaixo da hora real. */
    transform: translateY(-50%);
  }
  .current-time-line::after {
    content: ''; flex: 1; height: 1.5px; background: var(--color-accent-700); margin-left: 5px;
  }
  .current-time-badge {
    font-family: var(--font-body); font-size: 10.5px; font-weight: 700; color: var(--color-bg);
    background: var(--color-accent-700); padding: 2px 6px; border-radius: 999px;
    width: 38px; text-align: center; flex-shrink: 0; font-variant-numeric: tabular-nums;
  }
  .current-time-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--color-accent-700);
    flex-shrink: 0; margin-left: 5px;
  }
  @keyframes currentTimeFadeIn { from { opacity: 0; } to { opacity: 1; } }
  /* Destaque de um instante, disparado pelo botão "Hoje" — pulso discreto,
     não pisca nem muda de cor. */
  @keyframes currentTimePulse { 0% { transform: scale(1); } 35% { transform: scale(1.22); } 100% { transform: scale(1); } }
  .current-time-line.is-highlighted .current-time-badge,
  .current-time-line.is-highlighted .current-time-dot { animation: currentTimePulse .6s ease; }
  /* Evento: sem sombra (o contraste de cor já separa do fundo), cantos mais
     soltos e padding mais confortável — leitura em primeiro lugar. */
  .timeline-appt {
    position: absolute; left: 6px; right: 6px; border-radius: 12px;
    padding: 8px 12px; overflow: hidden;
    cursor: pointer; transition: transform .16s cubic-bezier(.34,1.56,.64,1), opacity .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .timeline-appt:active { transform: scale(0.98); opacity: 0.92; }
  .timeline-appt .title { font-weight: 700; font-size: 12.5px; }
  .timeline-appt .sub { font-size: 11px; opacity: 0.85; }
  /* Pausa: a profissional está livre aqui, então o bloco fica "vazado" —
     listrado e sem fundo cheio, pra ler como buraco e não como atendimento. */
  .appt-gap {
    position: absolute; left: 0; right: 0; pointer-events: none;
    background: repeating-linear-gradient(
      -45deg, transparent, transparent 5px,
      rgba(255,255,255,0.55) 5px, rgba(255,255,255,0.55) 10px);
    border-top: 1px dashed rgba(0,0,0,0.18);
    border-bottom: 1px dashed rgba(0,0,0,0.18);
    display: flex; align-items: center; justify-content: center;
  }
  .gap-label {
    font-size: 9.5px; font-weight: 600; letter-spacing: 0.03em;
    color: var(--color-neutral-600); background: var(--color-bg);
    padding: 1px 6px; border-radius: 999px; white-space: nowrap;
  }

<script>
// ── CONFIGURAÇÃO ─────────────────────────────────────────────
const SUPABASE_URL = 'https://gsagtsxkhqlpxuvrijgw.supabase.co';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const state = { tab: 'inicio', appointments: [], clients: [], staff: [], services: [], products: [], bookingVisits: [], agendaDate: new Date(), selectedClientId: null, selectedApptId: null, clientPhotos: {}, apptPhotos: {}, viewQuestionnaire: null, quiz: { step: 0, clientId: null, answers: {} }, insightsTrendMonths: 6, insightsIndicatorPeriod: 'month' };

const STAFF_COLORS = [
  { bg: '#edefe4', border: '#7c8468', text: '#4c5439' },
  { bg: '#f7e7e7', border: '#b23a3a', text: '#8a2a2a' },
  { bg: '#efe9db', border: '#a89572', text: '#5f5238' },
  { bg: '#e4e8e1', border: '#5f7a6b', text: '#39493f' },
];
function colorForId(id) {
  if (!id) return STAFF_COLORS[0];
  let hash = 0;
  for (const ch of id) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
  return STAFF_COLORS[hash % STAFF_COLORS.length];
}
// Cor do booking por categoria do serviço — não mais por profissional. Com
// só a Juliane atendendo, colorar por `staff.id` sempre devolvia a mesma cor
// pra tudo (o id da profissional nunca muda), e a agenda inteira saía
// monocromática. Paleta fixa por categoria (não hash), pra ela aprender a
// reconhecer de relance — evita o vermelho de --color-accent-2, que já é a
// cor de "isso precisa de atenção" no resto do painel (estoque baixo, agenda
// lotada).
const CATEGORY_COLORS = {
  'Coloração':   { bg: '#f5e6d3', border: '#c4863a', text: '#8f5f26' },
  'Corte':       { bg: '#e4e8e1', border: '#5f7a6b', text: '#39493f' },
  'Alisamento':  { bg: '#efe9db', border: '#a89572', text: '#5f5238' },
  'Tratamentos': { bg: '#edefe4', border: '#7c8468', text: '#4c5439' },
  'Outros':      { bg: '#ede4ea', border: '#8a6b8f', text: '#5a4560' },
};
const CATEGORY_COLOR_FALLBACK = Object.values(CATEGORY_COLORS);
function colorForService(serviceId) {
  const category = state.services.find(s => s.id === serviceId)?.category;
  if (category && CATEGORY_COLORS[category]) return CATEGORY_COLORS[category];
  if (!category) return CATEGORY_COLOR_FALLBACK[0];
  // Categoria nova que ainda não ganhou cor fixa na tabela acima: cai num
  // hash estável, pra não quebrar nem repetir a cor de outra à toa.
  let hash = 0;
  for (const ch of category) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
  return CATEGORY_COLOR_FALLBACK[hash % CATEGORY_COLOR_FALLBACK.length];
}

// Redimensiona pra no máximo 1600px no lado maior e converte pra JPEG (qualidade 82%) —
// reduz bastante o tamanho do arquivo sem perda visível de qualidade.
async function compressImage(file, maxDim = 1600, quality = 0.82) {
  const bitmap = await createImageBitmap(file);
  let { width, height } = bitmap;
  if (width > maxDim || height > maxDim) {
    const scale = maxDim / Math.max(width, height);
    width = Math.round(width * scale);
    height = Math.round(height * scale);
  }
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  canvas.getContext('2d').drawImage(bitmap, 0, 0, width, height);
  return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
}

function minutesUntil(iso) {
  const diff = (new Date(iso) - new Date()) / 60000;
  return Math.max(0, Math.round(diff));
}

function occupancyPct(staffId, dayAppts) {
  const workingMinutes = WORK_MINUTES_PER_DAY;
  const bookedMinutes = dayAppts
    .filter(a => a.staff?.id === staffId)
    .reduce((sum, a) => sum + (new Date(a.ends_at) - new Date(a.starts_at)) / 60000, 0);
  return Math.min(100, Math.round((bookedMinutes / workingMinutes) * 100));

function startOfWeekMonday(date) {
  const d = new Date(date);
  const day = d.getDay(); // 0 dom .. 6 sáb
  const diff = (day === 0 ? -6 : 1) - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

function distributionBarsHtml(rows, opts = {}) {
  const { formatValue = v => String(v) } = opts;

  return rows.map(r => `

  `).join('');

function animateCounters(root) {
  root.querySelectorAll('[data-count-to]').forEach(el => {
    const to = Number(el.dataset.countTo);
    const prefix = el.dataset.countPrefix || '';
    const suffix = el.dataset.countSuffix || '';
    if (!isFinite(to) || to === 0) { el.textContent = prefix + '0' + suffix; return; }
    const duration = 600;
    const start = performance.now();
    function tick(now) {
      const p = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      const val = Math.round(to * eased);
      el.textContent = prefix + val.toLocaleString('pt-BR') + suffix;
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}
function animateFills(root) {
  root.querySelectorAll('.dr-fill, .adc-bar-fill').forEach(el => {
    requestAnimationFrame(() => { el.style.width = el.dataset.targetWidth + '%'; });
  });
}

// HOME · painel operacional — "Como está minha agenda hoje e
// como será minha semana?"

function dayAggregate(dateAppts) {
  const sorted = dateAppts.slice().sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
  const count = dateAppts.length;
  const first = sorted.length ? fmtTime(sorted[0].starts_at) : '—';
  const last = sorted.length ? fmtTime(sorted[sorted.length - 1].starts_at) : '—';
  const staffCount = Math.max(1, profissionaisAtivos().length);
  const capacityMinutes = staffCount * WORK_MINUTES_PER_DAY;
  const bookedMinutes = dateAppts.reduce((sum, a) => sum + serviceDurationMinutes(a.service?.id), 0);
  const freeMinutes = Math.max(0, capacityMinutes - bookedMinutes);
  const freeSlots = Math.floor(freeMinutes / 60);
  const occPct = capacityMinutes ? Math.min(100, Math.round((bookedMinutes / capacityMinutes) * 100)) : 0;
  let statusText = 'Agenda saudável', statusClassName = '';
  if (occPct >= 80) { statusText = 'Agenda praticamente lotada'; statusClassName = 'is-busy'; }
  else if (occPct <= 30) { statusText = 'Muitos horários disponíveis'; statusClassName = 'is-quiet'; }
  return { count, first, last, freeSlots, occPct, statusText, statusClassName };
}

const WEEKDAY_FULL_LABELS = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
const WEEKDAY_LONG_LABELS = ['Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado', 'Domingo'];
// Dias em que o salão não abre (0 = domingo, 1 = segunda) — mesma regra usada no agendamento online.
const CLOSED_WEEKDAYS = [0, 1];
function isSalonOpenDay(date) {
  return !CLOSED_WEEKDAYS.includes(date.getDay());
}

function weekAppointmentCounts(weekStart) {
  const days = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    return d;
  });
  const counts = days.map(d => appointmentsOnDate(d).length);
  return { days, counts };
}

function strongestWeakestDay(days, counts) {
  const openIdx = days.map((d, i) => i).filter(i => isSalonOpenDay(days[i]));
  if (!openIdx.some(i => counts[i] > 0)) return null;
  let strongIdx = openIdx[0], weakIdx = openIdx[0];
  openIdx.forEach(i => {
    if (counts[i] > counts[strongIdx]) strongIdx = i;
    if (counts[i] < counts[weakIdx]) weakIdx = i;
  });
  return {
    strong: { label: WEEKDAY_LONG_LABELS[strongIdx], count: counts[strongIdx] },
    weak: { label: WEEKDAY_LONG_LABELS[weakIdx], count: counts[weakIdx] },
  };
}

function bestDayForEncaixe(days) {
  const startOfToday = new Date(); startOfToday.setHours(0, 0, 0, 0);
  let best = null;
  days.forEach((d, i) => {
    if (d < startOfToday || !isSalonOpenDay(d)) return;
    const agg = dayAggregate(appointmentsOnDate(d));
    if (!best || agg.freeSlots > best.freeSlots) {
      best = { label: WEEKDAY_LONG_LABELS[i], freeSlots: agg.freeSlots, occPct: agg.occPct };
    }
  });
  return best;
}

function formatDurationShort(min) {
  if (min <= 0) return '0min';
  const h = Math.floor(min / 60), m = min % 60;
  if (h && m) return `${h}h${m}min`;
  if (h) return `${h}h`;
  return `${m}min`;
}

function nextAvailableSlot() {
  const now = new Date();
  if (!isSalonOpenDay(now)) return null;
  const staffCount = Math.max(1, profissionaisAtivos().length);
  const dayAppts = appointmentsOnDate(now);
  // Expediente, não a grade: este horário é sugerido pra ser oferecido à
  // cliente, e o agendar.html não aceita nada antes das 9h nem depois das 18h.
  const dayStart = new Date(now); dayStart.setHours(OPEN_HOUR, 0, 0, 0);
  const dayEnd = new Date(now); dayEnd.setHours(CLOSE_HOUR, 0, 0, 0);
  let cursor = now > dayStart ? new Date(now) : new Date(dayStart);
  cursor.setSeconds(0, 0);
  cursor.setMinutes(Math.ceil(cursor.getMinutes() / 15) * 15);
  if (cursor >= dayEnd) return null;
  const stepMs = 15 * 60000;
  let slotStart = null;
  for (let t = new Date(cursor); t < dayEnd; t = new Date(t.getTime() + stepMs)) {
    const busy = dayAppts.filter(a => new Date(a.starts_at) <= t && new Date(a.ends_at) > t).length;
    if (busy < staffCount) { slotStart = new Date(t); break; }
  }
  if (!slotStart) return null;
  let slotEnd = new Date(slotStart);
  for (; slotEnd < dayEnd; slotEnd = new Date(slotEnd.getTime() + stepMs)) {
    const busy = dayAppts.filter(a => new Date(a.starts_at) <= slotEnd && new Date(a.ends_at) > slotEnd).length;
    if (busy >= staffCount) break;
  }
  return { start: slotStart, durationMin: Math.round((slotEnd - slotStart) / 60000) };
}

function weekTrend() {
  const curStart = startOfWeekMonday(new Date());
  const prevStart = new Date(curStart); prevStart.setDate(prevStart.getDate() - 7);
  const cur = weekAppointmentCounts(curStart).counts.reduce((a, b) => a + b, 0);
  const prev = weekAppointmentCounts(prevStart).counts.reduce((a, b) => a + b, 0);
  const diff = cur - prev;
  if (diff === 0) {
    return { icon: '➖', headline: 'Mesmo volume da semana anterior', phrase: 'O ritmo de agendamentos se manteve estável.' };
  }
  if (prev === 0) {
    return {
      icon: '📈', headline: `+${diff} agendamento${diff === 1 ? '' : 's'} em relação à semana passada`,
      phrase: 'Você está atendendo mais clientes do que na semana passada.',
    };
  }
  const pct = Math.round((diff / prev) * 100);
  if (pct > 0) {
    return {
      icon: '📈', headline: `+${pct}% em agendamentos em relação à semana passada`,
      phrase: 'Você está atendendo mais clientes do que na semana passada.',
    };
  }
  return {
    icon: '📉', headline: `${pct}% em agendamentos em relação à semana passada`,
    phrase: 'Esta semana apresenta menor ocupação. Considere divulgar horários disponíveis.',
  };
}

// ══════════════════════════════════════════════════════════════
// INSIGHTS · painel analítico — "Como está o desempenho do
// meu negócio?"
// ══════════════════════════════════════════════════════════════
function currentWeekRevenue() {
  const start = startOfWeekMonday(new Date());
  const days = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    return d;
  });
  const values = days.map(d => appointmentsOnDate(d).reduce((sum, a) => sum + appointmentRevenue(a), 0));
  return { days, values };
}

function weekRevenueForStart(start) {
  const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(start); d.setDate(d.getDate() + i); return d; });
  return days.reduce((sum, d) => sum + appointmentsOnDate(d).reduce((s, a) => s + appointmentRevenue(a), 0), 0);
}

function monthlyRevenueHistory(months = 6) {
  const now = new Date();
  const result = [];
  for (let i = months - 1; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const total = state.appointments
      .filter(a => {
        const s = new Date(a.starts_at);
        return s.getFullYear() === d.getFullYear() && s.getMonth() === d.getMonth();
      })
      .reduce((sum, a) => sum + appointmentRevenue(a), 0);
    result.push({
      label: d.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', ''),
      total,
      isCurrent: d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth(),
    });
  }
  return result;
}

function monthlyRevenueForOffset(monthsAgo) {
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth() - monthsAgo, 1);
  return state.appointments
    .filter(a => { const s = new Date(a.starts_at); return s.getFullYear() === d.getFullYear() && s.getMonth() === d.getMonth(); })
    .reduce((sum, a) => sum + appointmentRevenue(a), 0);
}

function currentMonthAppointments() {
  const now = new Date();
  return state.appointments.filter(a => {
    const s = new Date(a.starts_at);
    return s.getFullYear() === now.getFullYear() && s.getMonth() === now.getMonth();
  });
}

function newClientsThisMonth() {
  const now = new Date();
  const withDates = state.clients.filter(c => c.created_at);
  if (!withDates.length) return null;
  return withDates.filter(c => {
    const d = new Date(c.created_at);
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  }).length;
}

function monthOccupancyPct(monthAppts) {
  if (!profissionaisAtivos().length) return null;
  const totalMinutes = monthAppts.reduce((sum, a) => sum + serviceDurationMinutes(a.service?.id), 0);
  const now = new Date();
  // Só os dias que o salão abriu entram na capacidade — contar domingo e segunda
  // como dia de trabalho inflava o denominador e derrubava a ocupação do mês.
  // Mesma conta que weekOccupancyPct já fazia.
  let openDaysElapsed = 0;
  for (let d = 1; d <= now.getDate(); d++) {
    if (isSalonOpenDay(new Date(now.getFullYear(), now.getMonth(), d))) openDaysElapsed++;
  }
  openDaysElapsed = Math.max(1, openDaysElapsed);
  const capacity = profissionaisAtivos().length * WORK_MINUTES_PER_DAY * openDaysElapsed;
  if (!capacity) return null;
  return Math.min(100, Math.round((totalMinutes / capacity) * 100));
}

function topServicesThisMonth(monthAppts, limit = 5) {
  const map = new Map();
  monthAppts.forEach(a => {
    const name = a.service?.name || 'Outro';
    map.set(name, (map.get(name) || 0) + 1);
  });
  return Array.from(map.entries())
    .map(([label, value]) => ({ label, value }))
    .sort((a, b) => b.value - a.value)
    .slice(0, limit);
}

function demandProfileThisMonth(monthAppts) {
  const buckets = {};
  for (let h = AGENDA_START_HOUR; h < AGENDA_END_HOUR; h++) buckets[h] = 0;
  monthAppts.forEach(a => {
    const h = new Date(a.starts_at).getHours();
    if (buckets[h] !== undefined) buckets[h]++;
  });
  return Object.keys(buckets).map(h => ({ label: `${h}h`, value: buckets[h] }));
}

function recentBookingHistory(limit = 6) {
  const now = new Date();
  return state.appointments
    .filter(a => new Date(a.starts_at) < now)
    .sort((a, b) => new Date(b.starts_at) - new Date(a.starts_at))
    .slice(0, limit);
}

function deltaInfo(cur, prev) {
  const diff = cur - prev;
  if (diff === 0) return { text: '— 0%', cls: 'is-flat' };
  if (prev === 0) return { text: `+${formatCurrency(diff)}`, cls: 'is-up' };
  const pct = Math.round((diff / prev) * 100);
  return { text: `${pct > 0 ? '+' : ''}${pct}%`, cls: pct > 0 ? 'is-up' : 'is-down' };
}

function periodComparisons() {
  const curWeekStart = startOfWeekMonday(new Date());
  const prevWeekStart = new Date(curWeekStart); prevWeekStart.setDate(prevWeekStart.getDate() - 7);
  return [
    { label: 'Receita — semana atual vs. anterior', cur: weekRevenueForStart(curWeekStart), prev: weekRevenueForStart(prevWeekStart) },
    { label: 'Receita — mês atual vs. anterior', cur: monthlyRevenueForOffset(0), prev: monthlyRevenueForOffset(1) },
  ];
}

function currentWeekAppointments() {
  const start = startOfWeekMonday(new Date());
  const end = new Date(start); end.setDate(end.getDate() + 7);
  return state.appointments.filter(a => { const s = new Date(a.starts_at); return s >= start && s < end; });
}

function newClientsThisWeek() {
  const start = startOfWeekMonday(new Date());
  const end = new Date(start); end.setDate(end.getDate() + 7);
  const withDates = state.clients.filter(c => c.created_at);
  if (!withDates.length) return null;
  return withDates.filter(c => { const d = new Date(c.created_at); return d >= start && d < end; }).length;
}

function weekOccupancyPct(weekAppts, weekStart) {
  if (!profissionaisAtivos().length) return null;
  const totalMinutes = weekAppts.reduce((sum, a) => sum + serviceDurationMinutes(a.service?.id), 0);
  const now = new Date();
  let openDaysElapsed = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart); d.setDate(d.getDate() + i);
    if (d > now) break;
    if (isSalonOpenDay(d)) openDaysElapsed++;
  }
  openDaysElapsed = Math.max(1, openDaysElapsed);
  const capacity = profissionaisAtivos().length * WORK_MINUTES_PER_DAY * openDaysElapsed;
  if (!capacity) return null;
  return Math.min(100, Math.round((totalMinutes / capacity) * 100));
}

function weekRangeLabel() {
  const start = startOfWeekMonday(new Date());
  const end = new Date(start); end.setDate(end.getDate() + 6);
  const fmt = d => d.toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' }).replace('.', '');
  return `${fmt(start)} – ${fmt(end)}`;
}

function currentMonthLabel() {
  const s = new Date().toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}

// ── Evolução da receita: componente de gráfico único e persistente ───
// Sempre trabalhamos com os 12 meses "por baixo do capó"; o modo 6 meses é só
// um estado visual (6 pontos escondidos) — trocar de modo nunca troca o SVG,
// só anima os mesmos elementos entre dois estados.
const TREND_FULL_MONTHS = 12;
const TREND_SHORT_MONTHS = 6;
const TREND_W = 320, TREND_H = 106, TREND_TOP_PAD = 26, TREND_BOTTOM_PAD = 10;
let trendFullHistoryCache = null;

function trendXAt(count, idx) {
  return count > 1 ? (idx / (count - 1)) * TREND_W : TREND_W / 2;
}
function trendYAt(value, maxValue) {
  const chartH = TREND_H - TREND_TOP_PAD - TREND_BOTTOM_PAD;
  return TREND_TOP_PAD + (1 - value / Math.max(1, maxValue)) * chartH;
}
function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

// Posição de cada mês (índice 0..11 do histórico completo) dentro de um
// determinado "modo" (6 ou 12 meses visíveis). Os 6 mais recentes (índices
// 6..11) existem nos dois modos e só mudam de x; os 6 mais antigos (0..5)
// só existem fisicamente no modo de 12 meses.
function trendPosFor(fullHistory, idx, visibleMonths, maxValue) {
  const fullCount = fullHistory.length;
  const addedCount = fullCount - TREND_SHORT_MONTHS;
  const x = idx < addedCount
    ? trendXAt(fullCount, idx)
    : trendXAt(visibleMonths, idx - (fullCount - visibleMonths));
  const y = trendYAt(fullHistory[idx].total, maxValue);
  const visible = idx >= addedCount || visibleMonths === fullCount;
  return { x, y, visible };
}

// Constrói a marcação (repouso, sem animação) para um determinado modo.
function buildTrendChartMarkup(fullHistory, visibleMonths) {
  const fullCount = fullHistory.length;
  const addedCount = fullCount - TREND_SHORT_MONTHS;
  const visibleValues = fullHistory.slice(fullCount - visibleMonths).map(m => m.total);
  const maxValue = Math.max(1, ...visibleValues);
  const labelSize = visibleMonths > 8 ? 8 : 9.5;

  const positions = fullHistory.map((m, idx) => trendPosFor(fullHistory, idx, visibleMonths, maxValue));

  // Linha: sempre os 12 pontos, em ordem invertida (mais recente → mais antigo),
  // pra que o "desenho" (dashoffset) fique ancorado no lado direito (presente).
  let lineD = '';
  for (let idx = fullCount - 1; idx >= 0; idx--) {
    const p = positions[idx];
    lineD += `${idx === fullCount - 1 ? 'M' : 'L'}${p.x.toFixed(1)},${p.y.toFixed(1)} `;
  }

  // Preenchimento: só os pontos visíveis no modo atual.
  const areaIdxs = [];
  for (let idx = 0; idx < fullCount; idx++) if (positions[idx].visible) areaIdxs.push(idx);
  const areaLineD = areaIdxs.map((idx, i) => {
    const p = positions[idx];
    return `${i === 0 ? 'M' : 'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`;
  }).join(' ');
  const firstAP = positions[areaIdxs[0]], lastAP = positions[areaIdxs[areaIdxs.length - 1]];
  const areaD = `${areaLineD} L${lastAP.x.toFixed(1)},${TREND_H - TREND_BOTTOM_PAD} L${firstAP.x.toFixed(1)},${TREND_H - TREND_BOTTOM_PAD} Z`;

  const dotsHtml = fullHistory.map((m, idx) => {
    const p = positions[idx];
    const color = m.isCurrent ? 'var(--color-accent-700)' : 'var(--color-accent-600)';
    return `<circle id="trendDot-${idx}" class="trend-dot${p.visible ? '' : ' is-hidden'}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="${color}"><title>${m.label} · ${formatCurrency(m.total)}</title></circle>`;
  }).join('');

  const labelsHtml = fullHistory.map((m, idx) => {
    const p = positions[idx];
    return `<text id="trendLabel-${idx}" class="trend-label${p.visible ? '' : ' is-hidden'}" x="${p.x.toFixed(1)}" y="${Math.max(9, p.y - 9).toFixed(1)}" text-anchor="middle" font-size="${labelSize}" font-weight="700" fill="${m.isCurrent ? 'var(--color-accent-700)' : 'var(--color-neutral-600)'}" font-family="Jost, system-ui, sans-serif">${m.label}</text>`;
  }).join('');

  return `
    <svg viewBox="0 0 ${TREND_W} ${TREND_H}" preserveAspectRatio="none">
      <path id="trendAreaPath" d="${areaD}" fill="var(--color-accent-100)" opacity="0.6" stroke="none"/>
      <path id="trendLinePath" d="${lineD.trim()}" fill="none" stroke="var(--color-accent-600)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${labelsHtml}
      ${dotsHtml}
    </svg>
  `;
}

// Aplica o "recorte" (stroke-dasharray/dashoffset) que ancora a linha no
// modo de repouso atual, sem trocar nada visualmente.
function settleTrendPath(pathEl, visibleMonths) {
  if (!pathEl) return;
  const totalLen = pathEl.getTotalLength();
  const revealFraction = (visibleMonths - 1) / (TREND_FULL_MONTHS - 1);
  pathEl.style.transition = 'none';
  pathEl.style.strokeDasharray = `${totalLen}`;
  pathEl.style.strokeDashoffset = `${totalLen * (1 - revealFraction)}`;
}

// ── Indicadores: formatação/animação por tipo, e recálculo Mês/Semana ──
function formatIndicatorValue(type, raw) {
  if (raw === null || raw === undefined || !isFinite(raw)) return '--';
  switch (type) {
    case 'currency': return formatCurrency(raw);
    case 'percent': return `${Math.round(raw)}%`;
    case 'hours': return `${raw.toFixed(1)}h`;
    default: return String(Math.round(raw));
  }
}

// Anima um indicador "descendo" até zero e depois "subindo" até o novo valor —
// dá a sensação de recálculo, sem precisar recarregar a seção inteira.
function animateIndicatorValue(el, type, fromRaw, toRaw) {
  if (toRaw === null || toRaw === undefined || !isFinite(toRaw)) { el.textContent = '--'; return; }
  const from = (fromRaw === null || fromRaw === undefined || !isFinite(fromRaw)) ? 0 : fromRaw;
  if (from === toRaw) { el.textContent = formatIndicatorValue(type, toRaw); return; }
  const downMs = 240, upMs = 420;
  const downStart = performance.now();
  function tickDown(now) {
    const p = Math.min(1, (now - downStart) / downMs);
    const eased = 1 - Math.pow(1 - p, 2);
    el.textContent = formatIndicatorValue(type, from * (1 - eased));
    if (p < 1) requestAnimationFrame(tickDown);
    else requestAnimationFrame(tickUpStart);
  }
  function tickUpStart(now0) {
    const upStart = now0;
    function tickUp(now) {
      const p = Math.min(1, (now - upStart) / upMs);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = formatIndicatorValue(type, toRaw * eased);
      if (p < 1) requestAnimationFrame(tickUp);
      else el.textContent = formatIndicatorValue(type, toRaw);
    }
    requestAnimationFrame(tickUp);
  }
  requestAnimationFrame(tickDown);
}

function computeIndicatorsData() {
  const monthAppts = currentMonthAppointments();
  const monthRevenue = monthAppts.reduce((sum, a) => sum + appointmentRevenue(a), 0);
  const monthMinutes = monthAppts.reduce((sum, a) => sum + serviceDurationMinutes(a.service?.id), 0);
  const monthHours = monthMinutes / 60;
  const newClients = newClientsThisMonth();
  const occPct = monthOccupancyPct(monthAppts);
  const avgTicket = monthAppts.length ? monthRevenue / monthAppts.length : null;

  const weekAppts = currentWeekAppointments();
  const weekRevenue = weekAppts.reduce((sum, a) => sum + appointmentRevenue(a), 0);
  const weekMinutes = weekAppts.reduce((sum, a) => sum + serviceDurationMinutes(a.service?.id), 0);
  const weekHours = weekMinutes / 60;
  const weekNewClients = newClientsThisWeek();
  const weekOccPctVal = weekOccupancyPct(weekAppts, startOfWeekMonday(new Date()));
  const weekAvgTicket = weekAppts.length ? weekRevenue / weekAppts.length : null;

  return {
    month: {
      label: currentMonthLabel(),
      items: [
        { icon: ICONS.calendar, type: 'count', raw: monthAppts.length, label: 'Agendamentos' },
        { icon: ICONS.money, type: 'currency', raw: monthRevenue, label: 'Receita' },
        { icon: ICONS.userPlus, type: 'count', raw: newClients, label: 'Novos clientes' },
        { icon: ICONS.clock, type: 'hours', raw: monthHours, label: 'Horas agendadas' },
        { icon: ICONS.target, type: 'percent', raw: occPct, label: 'Taxa de ocupação' },
        { icon: ICONS.tag, type: 'currency', raw: avgTicket, label: 'Ticket médio' },
      ],
    },
    week: {
      label: weekRangeLabel(),
      items: [
        { icon: ICONS.calendar, type: 'count', raw: weekAppts.length, label: 'Agendamentos' },
        { icon: ICONS.money, type: 'currency', raw: weekRevenue, label: 'Receita' },
        { icon: ICONS.userPlus, type: 'count', raw: weekNewClients, label: 'Novos clientes' },
        { icon: ICONS.clock, type: 'hours', raw: weekHours, label: 'Horas agendadas' },
        { icon: ICONS.target, type: 'percent', raw: weekOccPctVal, label: 'Taxa de ocupação' },
        { icon: ICONS.tag, type: 'currency', raw: weekAvgTicket, label: 'Ticket médio' },
      ],
    },
  };
}

// Recalcula SÓ a seção "Indicadores" (legenda + grid), sem tocar no resto da tela.
function renderIndicatorsSection() {
  const captionEl = document.getElementById('indicatorsCaption');

// Constrói (sem animação) o estado inicial do gráfico de evolução, no modo
// atual (state.insightsTrendMonths). Usado no primeiro carregamento da aba.
function renderTrendChartSection() {
  const wrap = document.getElementById('trendChartWrap');
  if (!wrap) return;
  const fullHistory = monthlyRevenueHistory(TREND_FULL_MONTHS);
  trendFullHistoryCache = fullHistory;
  const visibleMonths = state.insightsTrendMonths;
  wrap.innerHTML = buildTrendChartMarkup(fullHistory, visibleMonths);
  wrap.dataset.months = visibleMonths;
  settleTrendPath(wrap.querySelector('#trendLinePath'), visibleMonths);
}

// Anima a transição 6 ⇄ 12 meses no MESMO gráfico: os 6 meses recentes
// deslizam de posição, a linha se desenha/retrai a partir da âncora (o mês
// atual, à direita) e os meses extras entram/saem em cascata.
function animateTrendTransition(targetMonths) {
  const wrap = document.getElementById('trendChartWrap');
  if (!wrap) return;
  const prevMonths = Number(wrap.dataset.months) || targetMonths;
  if (prevMonths === targetMonths) return;

  const fullHistory = trendFullHistoryCache || monthlyRevenueHistory(TREND_FULL_MONTHS);
  const fullCount = fullHistory.length;
  const addedCount = fullCount - TREND_SHORT_MONTHS;
  const expanding = targetMonths > prevMonths;

  const pathEl = wrap.querySelector('#trendLinePath');
  const areaEl = wrap.querySelector('#trendAreaPath');
  if (!pathEl) { renderTrendChartSection(); return; }

  const dotEls = Array.from({ length: fullCount }, (_, idx) => wrap.querySelector(`#trendDot-${idx}`));
  const labelEls = Array.from({ length: fullCount }, (_, idx) => wrap.querySelector(`#trendLabel-${idx}`));

  const fromMax = Math.max(1, ...fullHistory.slice(fullCount - prevMonths).map(m => m.total));
  const toMax = Math.max(1, ...fullHistory.slice(fullCount - targetMonths).map(m => m.total));
  const revealFrom = (prevMonths - 1) / (fullCount - 1);
  const revealTo = (targetMonths - 1) / (fullCount - 1);

  // Esconde o preenchimento durante a transição (a área só volta, com fade,
  // quando o traçado final estiver correto — evita uma geometria "errada" no meio do caminho).
  if (areaEl) { areaEl.style.transition = 'none'; areaEl.style.opacity = 0; }

  // Dispara o pop/fade dos meses "extras", em cascata e na ordem certa:
  // ao expandir, entram do mês mais próximo do presente pro mais antigo;
  // ao encolher, saem do mais antigo pro mais próximo do presente.
  for (let idx = 0; idx < addedCount; idx++) {
    const order = expanding ? (addedCount - 1 - idx) : idx;
    const delay = 60 + order * 55;
    if (dotEls[idx]) dotEls[idx].style.transitionDelay = `${delay}ms`;
    if (labelEls[idx]) labelEls[idx].style.transitionDelay = `${delay}ms`;
  }
  requestAnimationFrame(() => {
    for (let idx = 0; idx < addedCount; idx++) {
      if (dotEls[idx]) dotEls[idx].classList.toggle('is-hidden', !expanding);
      if (labelEls[idx]) labelEls[idx].classList.toggle('is-hidden', !expanding);
    }
  });

  const duration = 620;
  const start = performance.now();

  function frame(now) {
    const t = Math.min(1, (now - start) / duration);
    const te = easeInOutCubic(t);
    const currentMax = fromMax + (toMax - fromMax) * te;

    const positions = new Array(fullCount);
    for (let idx = 0; idx < fullCount; idx++) {
      let x;
      if (idx < addedCount) {
        x = trendXAt(fullCount, idx); // meses extras: x fixo, só entram/saem de opacidade
      } else {
        const xFrom = trendXAt(prevMonths, idx - (fullCount - prevMonths));
        const xTo = trendXAt(targetMonths, idx - (fullCount - targetMonths));
        x = xFrom + (xTo - xFrom) * te;
      }
      const y = trendYAt(fullHistory[idx].total, currentMax);
      positions[idx] = { x, y };
      if (dotEls[idx]) { dotEls[idx].setAttribute('cx', x.toFixed(1)); dotEls[idx].setAttribute('cy', y.toFixed(1)); }
      if (labelEls[idx]) { labelEls[idx].setAttribute('x', x.toFixed(1)); labelEls[idx].setAttribute('y', Math.max(9, y - 9).toFixed(1)); }
    }

    let d = '';
    for (let idx = fullCount - 1; idx >= 0; idx--) {
      const p = positions[idx];
      d += `${idx === fullCount - 1 ? 'M' : 'L'}${p.x.toFixed(1)},${p.y.toFixed(1)} `;
    }
    pathEl.setAttribute('d', d.trim());
    const totalLen = pathEl.getTotalLength();
    const revealFraction = revealFrom + (revealTo - revealFrom) * te;
    pathEl.style.strokeDasharray = `${totalLen}`;
    pathEl.style.strokeDashoffset = `${totalLen * (1 - revealFraction)}`;

    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      // Reconstrói a marcação "limpa" pro estado final — mesma geometria da
      // última frame, então não há salto visual, só garante precisão/hover.
      wrap.innerHTML = buildTrendChartMarkup(fullHistory, targetMonths);
      wrap.dataset.months = targetMonths;
      settleTrendPath(wrap.querySelector('#trendLinePath'), targetMonths);
      const finalArea = wrap.querySelector('#trendAreaPath');
      if (finalArea) {
        finalArea.style.opacity = 0;
        requestAnimationFrame(() => {
          finalArea.style.transition = 'opacity .35s ease';
          requestAnimationFrame(() => { finalArea.style.opacity = 0.6; });
        });
      }
    }
  }
  requestAnimationFrame(frame);
}

function bookingConversionThisMonth() {
  const now = new Date();
  const isThisMonth = (iso) => {
    const d = new Date(iso);
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  };
  const visits = (state.bookingVisits || []).filter(v => isThisMonth(v.created_at)).length;
  const conversions = state.appointments.filter(a => a.source === 'online' && a.created_at && isThisMonth(a.created_at)).length;
  const pct = visits > 0 ? Math.round((conversions / visits) * 100) : null;
  return { visits, conversions, pct };
}

// ── gráfico semanal (SVG minimalista, usado em Insights) ──────
function weekChartSvg(values, days) {
  const w = 320, chartH = 84, labelH = 22, h = chartH + labelH;
  const max = Math.max(1, ...values);
  const gap = 10;
  const barW = (w - gap * (values.length - 1)) / values.length;
  const today = new Date();
  const bars = values.map((v, i) => {
    const barH = Math.max(3, Math.round((v / max) * (chartH - 6)));
    const x = i * (barW + gap);
    const y = chartH - barH;
    const isToday = sameDay(days[i], today);
    const fill = isToday ? 'var(--color-accent-700)' : 'var(--color-accent-100)';
    return `
      <rect class="week-bar" x="${x}" y="${y}" width="${barW}" height="${barH}" rx="${Math.min(6, barW / 2.4)}" fill="${fill}">
        <title>${WEEKDAY_FULL_LABELS[i]} · ${formatCurrency(v)}</title>
      </rect>
      <text x="${x + barW / 2}" y="${chartH + 16}" text-anchor="middle" font-size="10" font-weight="700"
        fill="${isToday ? 'var(--color-accent-700)' : 'var(--color-neutral-600)'}"
        font-family="Jost, system-ui, sans-serif">${WEEKDAY_FULL_LABELS[i]}</text>
    `;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${bars}</svg>`;
}

// A grade da timeline vai das 8h às 19h de propósito: dá uma hora de respiro
// antes e depois do expediente, pro encaixe e pro atendimento que atrasou
// aparecerem na tela em vez de ficarem cortados fora dela.
// Janela ampliada (5h–21h) só pra dar folga visual na rolagem — não é o
// expediente (OPEN_HOUR/CLOSE_HOUR, 9h–18h), que é o que manda nas contas
// de ocupação e nos horários oferecidos. HOUR_HEIGHT desceu de 68 pra 56
// (meio-termo: mais compacto que antes, mas não tão apertado quanto a
// referência) porque a janela ficou bem maior.
const AGENDA_START_HOUR = 5;
const AGENDA_END_HOUR = 22;
const HOUR_HEIGHT = 56;
const WEEKDAY_LABELS = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];

// Expediente de verdade — o que o agendar.html oferece à cliente. Ocupação e
// capacidade se medem contra ISTO, não contra a grade acima: usar as 11h da
// timeline dava um denominador que o formulário nunca consegue preencher (ele
// só oferece 9h), e a ocupação saía estruturalmente baixa. Mesmos valores de
// shared/salon.js — ao religar aquele arquivo, desestruturar de lá e apagar
// estas duas linhas.
const OPEN_HOUR = 9;
const CLOSE_HOUR = 18;
const WORK_MINUTES_PER_DAY = (CLOSE_HOUR - OPEN_HOUR) * 60;
// Mesma granularidade do agendar.html — o dropdown de horário do modal de
// novo agendamento usa essa grade.
const SLOT_MINUTES = 30;

function sameDay(a, b) {
  return a.toDateString() === b.toDateString();
}

function startOfWeek(date) {
  const d = new Date(date);
  d.setDate(d.getDate() - d.getDay()); // volta até domingo
  d.setHours(0, 0, 0, 0);
  return d;
}

// Segmentos do atendimento: trabalho inicial / pausa / trabalho final.
// O agendamento pode sobrescrever o padrão do serviço (cabelo que demorou mais).
function segmentsOf(a) {
  const s = a.service || {};
  const total = Math.round((new Date(a.ends_at) - new Date(a.starts_at)) / 60000);
  const wb = a.work_before_minutes ?? s.work_before_minutes ?? total;
  const gp = a.gap_minutes ?? s.gap_minutes ?? 0;
  const wa = a.work_after_minutes ?? s.work_after_minutes ?? 0;
  return { wb, gp, wa };
}

// Sobreposição empilhada, como no calendário do iPhone: o atendimento mais
// longo fica de fundo ocupando a faixa inteira e o encaixe entra por cima,
// recuado à esquerda. Dividir em colunas espremia os dois e escondia a pausa.
const NIVEL_RECUO = 18;   // px que cada camada entra pra dentro
const NIVEL_MAX = 3;      // além disso o bloco ficaria fino demais pra ler

function layoutAppts(appts) {
  const itens = appts
    .map(a => ({ a, s: new Date(a.starts_at).getTime(), e: new Date(a.ends_at).getTime() }))
    // Quem começa antes vai pro fundo; empatou, o mais longo é o fundo.
    .sort((x, y) => x.s - y.s || y.e - x.e);

  itens.forEach((it, i) => {
    // Quantos atendimentos já desenhados ainda estavam abertos quando este
    // começou — é o que faz o encaixe subir por cima da pausa.
    const nivel = itens.slice(0, i).filter(o => o.s <= it.s && o.e > it.s).length;
    it.nivel = Math.min(nivel, NIVEL_MAX);
  });
  return itens;
}

// Posição (px) e rótulo da linha do horário atual dentro da grade, ou null
// se agora estiver fora da janela desenhada (AGENDA_START_HOUR–END_HOUR).
function currentTimeInfo() {
  const now = new Date();
  const minsFromStart = (now.getHours() - AGENDA_START_HOUR) * 60 + now.getMinutes();
  const totalMins = (AGENDA_END_HOUR - AGENDA_START_HOUR) * 60;
  if (minsFromStart < 0 || minsFromStart > totalMins) return null;
  return {
    top: (minsFromStart / 60) * HOUR_HEIGHT,
    label: now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
  };
}

// Reposiciona a linha existente sem re-renderizar a agenda inteira — chamado
// no intervalo de 30s. A transição de `top` em CSS (ver .current-time-line)
// é que faz ela deslizar suave entre uma posição e outra, em vez de saltar.
function updateCurrentTimeLine() {
  if (state.tab !== 'agenda' || !sameDay(state.agendaDate, new Date())) return;
  const el = document.getElementById('currentTimeLine');
  if (!el) return;
  const info = currentTimeInfo();
  if (!info) { el.remove(); return; }
  el.style.top = info.top + 'px';
  el.querySelector('.current-time-badge').textContent = info.label;
}

// Destaca a linha do horário atual por um instante — usado pelo botão
// "Hoje", que precisa de algum feedback mesmo quando o dia já é hoje e não
// há troca de tela pra animar.
function highlightCurrentTimeLine() {
  requestAnimationFrame(() => {
    const line = document.getElementById('currentTimeLine');
    if (!line) return;
    line.classList.add('is-highlighted');
    setTimeout(() => line.classList.remove('is-highlighted'), 700);
  });
}

// Horário mais relevante pra abrir a grade: se for hoje, perto de agora; se
// tiver atendimento, perto do primeiro; senão, perto da abertura do salão.
// Sempre com ~1h30 de contexto acima, pra não colar o alvo na borda de cima.
function computeRelevantScrollTop(day, dayAppts) {
  if (sameDay(day, new Date())) {
    const info = currentTimeInfo();
    if (info) return Math.max(0, info.top - HOUR_HEIGHT * 1.5);
  }
  if (dayAppts.length) {
    const first = dayAppts.slice().sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at))[0];
    const fs = new Date(first.starts_at);
    const startMins = (fs.getHours() - AGENDA_START_HOUR) * 60 + fs.getMinutes();
    return Math.max(0, (startMins / 60) * HOUR_HEIGHT - HOUR_HEIGHT * 1.5);
  }
  return Math.max(0, (OPEN_HOUR - AGENDA_START_HOUR) * HOUR_HEIGHT - HOUR_HEIGHT * 0.5);
}

// `animate:false` (padrão): pula direto pra posição, sem herdar o
// scroll-behavior:smooth do CSS — é assim que a grade "já abre no lugar
// certo" sem parecer que rolou sozinha. `animate:true` é só pro botão
// "Hoje", que pede explicitamente um scroll visível.
function scrollTimelineTo(el, top, opts) {
  const animate = !!(opts && opts.animate);
  if (!el) return;
  if (!animate || prefersReducedMotion()) {
    const prev = el.style.scrollBehavior;
    el.style.scrollBehavior = 'auto';
    el.scrollTop = Math.max(0, top);
    el.style.scrollBehavior = prev;
  } else {
    el.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  }
}

// Miolo da grade (linhas de hora + eventos + linha do horário atual), sem o
// wrapper .timeline em volta — extraído pra ser recalculado sozinho quando
// só o dia muda dentro da mesma semana (renderAgendaGridTransition), sem
// precisar refazer a faixa de dias e o cabeçalho do mês.
function buildAgendaGrid(day) {
  const dayAppts = state.appointments.filter(a => sameDay(new Date(a.starts_at), day));
  const hours = [];
  for (let h = AGENDA_START_HOUR; h < AGENDA_END_HOUR; h++) hours.push(h);
  const currentTime = sameDay(day, new Date()) ? currentTimeInfo() : null;

  const blocksHtml = layoutAppts(dayAppts).map(it => {
    const a = it.a;
    const start = new Date(a.starts_at);
    const end = new Date(a.ends_at);
    const startMins = (start.getHours() - AGENDA_START_HOUR) * 60 + start.getMinutes();
    const durMins = Math.max(20, (end - start) / 60000);
    const top = (startMins / 60) * HOUR_HEIGHT;
    const height = (durMins / 60) * HOUR_HEIGHT - 4;
    const c = colorForService(a.service?.id);

    // Cada camada de sobreposição entra um pouco mais pra dentro; a borda
    // direita continua alinhada, então o bloco de baixo aparece à esquerda.
    const recuo = 6 + it.nivel * NIVEL_RECUO;

    // Faixa de pausa, quando o serviço tiver uma: é ela que mostra por que
    // cabe um encaixe no meio de um atendimento longo.
    const seg = segmentsOf(a);
    let gapHtml = '';
    if (seg.gp > 0) {
      const gapTop = (seg.wb / 60) * HOUR_HEIGHT;
      const gapH = (seg.gp / 60) * HOUR_HEIGHT;
      gapHtml = `<div class="appt-gap" style="top:${gapTop}px; height:${gapH}px;">
        ${gapH >= 22 ? `<span class="gap-label">pausa · ${seg.gp}min</span>` : ''}
      </div>`;
    }

    return `
      <div class="timeline-appt" data-appt-id="${a.id}" style="top:${top}px; height:${height}px; left:${recuo}px; width:calc(100% - ${recuo + 6}px); right:auto; z-index:${10 + it.nivel}; background:${c.bg}; border-left:3px solid ${c.border};">
        ${gapHtml}
        <div class="title" style="color:${c.text}">${a.client?.name || 'Cliente'}</div>
        <div class="sub" style="color:${c.text}">${a.service?.name || ''} · ${a.staff?.name || ''}</div>
      </div>
    `;
  }).join('');

  const html = `
    <div class="timeline-body" style="height:${(AGENDA_END_HOUR - AGENDA_START_HOUR) * HOUR_HEIGHT}px;">
      ${hours.map((h, i) => `
        <div class="hour-row" style="position:absolute; top:${i * HOUR_HEIGHT}px; left:0; right:0; height:${HOUR_HEIGHT}px;">
          <div class="hour-label">${String(h).padStart(2, '0')}:00</div>
        </div>
      `).join('')}
      ${blocksHtml}
      ${currentTime ? `
        <div class="current-time-line" id="currentTimeLine" style="top:${currentTime.top}px;">
          <span class="current-time-badge">${currentTime.label}</span>
          <span class="current-time-dot"></span>
        </div>
      ` : ''}
    </div>
  `;
  return { html, dayAppts };
}

function weekDayButtonHtml(d, selectedDay) {
  const selected = sameDay(d, selectedDay);
  const today = sameDay(d, new Date());
  const hasAppts = state.appointments.some(a => sameDay(new Date(a.starts_at), d));
  return `
    <button class="week-day ${selected ? 'selected' : ''} ${today ? 'is-today' : ''} ${hasAppts ? 'has-appts' : ''}" data-date="${d.toISOString()}">
      <div class="wd-label">${WEEKDAY_LABELS[d.getDay()]}</div>
      <div class="wd-num">${d.getDate()}</div>
      <div class="wd-dot"></div>
    </button>
  `;
}

// Toca só a classe .selected nos botões que já existem — nada de refazer o
// HTML da faixa. É isso que deixa a transição de background/border já
// declarada em .week-day animar de verdade, em vez de nascer pronta.
function updateWeekStripSelection(newDay) {
  document.querySelectorAll('.week-day').forEach(b => {
    const bd = new Date(b.dataset.date);
    b.classList.toggle('selected', sameDay(bd, newDay));
    b.classList.toggle('is-today', sameDay(bd, new Date()));
  });
}

function updateAgendaDateTitle(newDay) {

  if (!el) return;
  const raw = newDay.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  el.textContent = raw.charAt(0).toUpperCase() + raw.slice(1);
}

function bindTimelineApptClicks() {
  app.querySelectorAll('.timeline-appt[data-appt-id]').forEach(block => {
    block.onclick = async () => {

      if (!state.apptPhotos[apptId]) await loadApptPhotos(apptId);

function renderAgenda() {
  document.getElementById('greeting').textContent = 'Agenda';
  document.getElementById('greetingSub').textContent = '';
  const day = state.agendaDate;
  // Só a primeira letra maiúscula (mesmo padrão de currentMonthLabel()) — o
  // text-transform:capitalize que existia antes maiusculizava o "De" também,
  // errado em português.
  const monthLabelRaw = day.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  const monthLabel = monthLabelRaw.charAt(0).toUpperCase() + monthLabelRaw.slice(1);
  const dateTitleRaw = day.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const dateTitle = dateTitleRaw.charAt(0).toUpperCase() + dateTitleRaw.slice(1);

  const weekStart = startOfWeek(day);
  const weekDays = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    return d;
  });

  const { html: gridHtml, dayAppts } = buildAgendaGrid(day);

  app.innerHTML = `
    <div class="day-nav">
      <div class="month-pill">
        <button class="arrow" id="prevWeek">‹</button>
        <button class="day-label-btn" id="openMonthView">
          <div class="day-label">${monthLabel}</div>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <button class="arrow" id="nextWeek">›</button>
      </div>
      <button class="agenda-add-btn" id="agendaAddBtn" aria-label="Novo agendamento">+</button>
    </div>
    <div class="agenda-viewport" id="agendaWeekViewport">
      <div id="agendaWeekPane">
        <div class="week-strip" id="weekStrip">
          ${weekDays.map(d => weekDayButtonHtml(d, day)).join('')}
        </div>
        <div class="agenda-date-title" id="agendaDateTitle">${dateTitle}</div>
        <div class="agenda-viewport" id="agendaViewport">
          <div class="timeline" id="timelineEl">${gridHtml}</div>
        </div>
      </div>
    </div>
  `;

  // prevWeek/nextWeek/Hoje trocam a semana inteira, então deslizam o bloco
  // faixa+título+grade junto — ver renderAgendaTransition().
  document.getElementById('prevWeek').onclick = () => {
    state.agendaDate = new Date(day.getTime() - 7 * 86400000);
    renderAgendaTransition('back');
  };
  document.getElementById('nextWeek').onclick = () => {
    state.agendaDate = new Date(day.getTime() + 7 * 86400000);
    renderAgendaTransition('forward');
  };
  document.getElementById('openMonthView').onclick = () => openMonthCalendar(day);
  document.getElementById('agendaAddBtn').onclick = openNewApptModal;

  // Toque num dia dentro da MESMA semana: a faixa continua com as mesmas 7
  // datas, só a seleção muda (updateWeekStripSelection, sem refazer o HTML),
  // e só a grade desliza (renderAgendaGridTransition) — não tem por que
  // mover o cabeçalho se ele não mudou.
  app.querySelectorAll('.week-day').forEach(btn => {
    btn.onclick = () => {
      // Lê state.agendaDate na hora, não a variável `day` capturada aqui:
      // no caminho leve (mesma semana) esses onclick não são reamarrados a
      // cada toque, então `day` ficaria presa no dia do último render cheio.
      const novaData = new Date(btn.dataset.date);
      const diaAtual = state.agendaDate;
      if (sameDay(novaData, diaAtual)) return;
      const direction = novaData > diaAtual ? 'forward' : 'back';
      state.agendaDate = novaData;
      updateWeekStripSelection(novaData);
      updateAgendaDateTitle(novaData);
      renderAgendaGridTransition(direction);
    };
  });

  bindTimelineApptClicks();
  attachTimelineScrollbarFade(document.getElementById('timelineEl'));
  scrollTimelineTo(document.getElementById('timelineEl'), computeRelevantScrollTop(day, dayAppts), { animate: false });
}

// #timelineEl é recriado a cada renderAgenda(), então o listener é
// reamarrado toda vez — mesmo padrão dos outros binds desta função.
function attachTimelineScrollbarFade(el) {
  if (!el) return;
  let hideTimer = null;
  el.addEventListener('scroll', () => {
    el.classList.add('is-scrolling');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => el.classList.remove('is-scrolling'), 1000);
  });
}

// Motor genérico do slide: clona o painel antigo (por id), deixa uma função
// desenhar o novo conteúdo, anima os dois por cima um do outro. Mesma
// técnica de agendar.html, parametrizada pra servir dois níveis diferentes
// — ver as duas funções abaixo. O clone é tirado ANTES de drawFn() e só
// anexado DEPOIS: se drawFn() reescrever o innerHTML de um ancestral (caso
// da semana), o viewport antigo (e o clone nele) morreria junto.
function slidePane(direction, viewportId, paneId, drawFn) {
  if (prefersReducedMotion()) { drawFn(); return; }
  const oldPane = document.getElementById(paneId);
  const oldHeight = oldPane ? oldPane.offsetHeight : null;
  const clone = oldPane ? oldPane.cloneNode(true) : null;
  if (clone) clone.removeAttribute('id');

  drawFn();

  const viewport = document.getElementById(viewportId);
  const newPane = document.getElementById(paneId);
  if (!clone || !viewport || !newPane) return;

  clone.classList.add('agenda-pane');
  viewport.appendChild(clone);

  const newHeight = newPane.offsetHeight;
  viewport.style.height = Math.max(oldHeight, newHeight) + 'px';

  const enterFrom = direction === 'back' ? '-100%' : '100%';
  const exitTo = direction === 'back' ? '100%' : '-100%';

  newPane.classList.add('agenda-pane');
  newPane.style.transition = 'none';
  newPane.style.transform = `translateX(${enterFrom})`;
  clone.style.transform = 'translateX(0)';

  void newPane.offsetWidth;

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      newPane.style.transition = 'transform .22s cubic-bezier(.22,.61,.36,1)';
      clone.style.transition = 'transform .22s cubic-bezier(.22,.61,.36,1)';
      newPane.style.transform = 'translateX(0)';
      clone.style.transform = `translateX(${exitTo})`;
    });
  });

  let cleaned = false;
  function cleanup() {
    if (cleaned) return;
    cleaned = true;
    newPane.removeEventListener('transitionend', onTransitionEnd);
    newPane.classList.remove('agenda-pane');
    newPane.style.transition = '';
    newPane.style.transform = '';
    viewport.style.height = '';
    clone.remove();
  }
  function onTransitionEnd(e) {
    if (e.target === newPane && e.propertyName === 'transform') cleanup();
  }
  newPane.addEventListener('transitionend', onTransitionEnd);
  setTimeout(cleanup, 500);
}

// Semana muda (prevWeek/nextWeek/Hoje pra outro dia/escolha no calendário de
// mês): a faixa de dias inteira troca de data, então desliza junto com a
// grade — o cabeçalho de setas/mês fica de fora (é controle, não conteúdo).
function renderAgendaTransition(direction) {
  slidePane(direction, 'agendaWeekViewport', 'agendaWeekPane', renderAgenda);
}

// Toque num dia dentro da mesma semana: só a grade precisa deslizar — a
// faixa de dias já foi atualizada no lugar por updateWeekStripSelection().
function renderAgendaGridTransition(direction) {
  slidePane(direction, 'agendaViewport', 'timelineEl', () => {
    const day = state.agendaDate;
    const { html, dayAppts } = buildAgendaGrid(day);
    const el = document.getElementById('timelineEl');
    el.innerHTML = html;
    bindTimelineApptClicks();
    scrollTimelineTo(el, computeRelevantScrollTop(day, dayAppts), { animate: false });
  });
}

function openMonthCalendar(initialDate) {
  let viewDate = new Date(initialDate);
  viewDate.setDate(1);

  const overlay = document.createElement('div');
  overlay.className = 'month-cal-overlay';
  document.body.appendChild(overlay);

  function closeCal() {
    overlay.remove();
  }

  function renderCal() {
    const monthLabelRaw = viewDate.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
    const monthLabel = monthLabelRaw.charAt(0).toUpperCase() + monthLabelRaw.slice(1);
    const firstOfMonth = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
    const gridStart = startOfWeek(firstOfMonth);
    const cells = Array.from({ length: 42 }, (_, i) => {
      const d = new Date(gridStart);
      d.setDate(d.getDate() + i);
      return d;
    });

    overlay.innerHTML = `
      <div class="month-cal-card">
        <div class="month-cal-header">
          <button class="arrow" id="calPrevMonth">‹</button>
          <div class="day-label">${monthLabel}</div>
          <button class="arrow" id="calNextMonth">›</button>
        </div>
        <div class="month-cal-weekdays">
          ${WEEKDAY_LABELS.map(l => `<div>${l}</div>`).join('')}
        </div>
        <div class="month-cal-grid">
          ${cells.map(d => {
            const inMonth = d.getMonth() === viewDate.getMonth();
            const today = sameDay(d, new Date());
            const selected = sameDay(d, initialDate);
            const hasAppts = state.appointments.some(a => sameDay(new Date(a.starts_at), d));
            return `
              <button class="month-cal-day ${selected ? 'selected' : ''} ${today ? 'is-today' : ''} ${hasAppts ? 'has-appts' : ''} ${!inMonth ? 'is-outside' : ''}" data-date="${d.toISOString()}">
                <span>${d.getDate()}</span>
                <div class="wd-dot"></div>
              </button>
            `;
          }).join('')}
        </div>
      </div>
    `;

    overlay.querySelector('#calPrevMonth').onclick = (e) => {
      e.stopPropagation();
      viewDate.setMonth(viewDate.getMonth() - 1);
      renderCal();
    };
    overlay.querySelector('#calNextMonth').onclick = (e) => {
      e.stopPropagation();
      viewDate.setMonth(viewDate.getMonth() + 1);
      renderCal();
    };
    overlay.querySelectorAll('.month-cal-day').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        state.agendaDate = new Date(btn.dataset.date);
        closeCal();
        render();
      };
    });
  }

  overlay.onclick = closeCal;
  renderCal();
}

function clientStats(clientId) {
  const history = state.appointments
    .filter(a => a.client?.id === clientId)
    .sort((a, b) => new Date(b.starts_at) - new Date(a.starts_at));
  const visits = history.length;
  const spent = history.reduce((sum, a) => sum + Number(a.service?.price || 0), 0);
  const lastVisit = history[0] ? fmtDate(history[0].starts_at) : '—';
  const isVip = visits >= 5;

  const freq = {};
  history.forEach(a => {
    const name = a.service?.name;
    if (name) freq[name] = (freq[name] || 0) + 1;
  });
  const favoriteServices = Object.entries(freq)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 3)
    .map(([name]) => name);

  return { history, visits, spent, lastVisit, isVip, favoriteServices };
}
