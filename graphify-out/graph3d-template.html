<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>graphify 3D - graphify-out</title>
<style>
  /* CSS copiado do graph.html sem alteração — a sidebar tem que ficar idêntica.
     Só o que é novo (barra de câmera, tooltip, aviso de validação) vem depois. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f0f1a; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; height: 100vh; overflow: hidden; }
  #graph { flex: 1; position: relative; }
  #sidebar { width: 280px; background: #1a1a2e; border-left: 1px solid #2a2a4e; display: flex; flex-direction: column; overflow: hidden; }
  #search-wrap { padding: 12px; border-bottom: 1px solid #2a2a4e; }
  #search { width: 100%; background: #0f0f1a; border: 1px solid #3a3a5e; color: #e0e0e0; padding: 7px 10px; border-radius: 6px; font-size: 13px; outline: none; }
  #search:focus { border-color: #4E79A7; }
  #search-results { max-height: 140px; overflow-y: auto; padding: 4px 12px; border-bottom: 1px solid #2a2a4e; display: none; }
  .search-item { padding: 4px 6px; cursor: pointer; border-radius: 4px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .search-item:hover { background: #2a2a4e; }
  #info-panel { padding: 14px; border-bottom: 1px solid #2a2a4e; min-height: 140px; }
  #info-panel h3 { font-size: 13px; color: #aaa; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  #info-content { font-size: 13px; color: #ccc; line-height: 1.6; }
  #info-content .field { margin-bottom: 5px; }
  #info-content .field b { color: #e0e0e0; }
  #info-content .empty { color: #555; font-style: italic; }
  .neighbor-link { display: block; padding: 2px 6px; margin: 2px 0; border-radius: 3px; cursor: pointer; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid #333; }
  .neighbor-link:hover { background: #2a2a4e; }
  #neighbors-list { max-height: 160px; overflow-y: auto; margin-top: 4px; }
  #legend-wrap { flex: 1; overflow-y: auto; padding: 12px; }
  #legend-wrap h3 { font-size: 13px; color: #aaa; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
  .legend-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; border-radius: 4px; font-size: 12px; }
  .legend-item:hover { background: #2a2a4e; padding-left: 4px; }
  .legend-item.dimmed { opacity: 0.35; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .legend-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-count { color: #666; font-size: 11px; }
  #stats { padding: 10px 14px; border-top: 1px solid #2a2a4e; font-size: 11px; color: #555; }
  #legend-controls { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding: 4px 0; }
  #legend-controls label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; color: #aaa; user-select: none; }
  #legend-controls label:hover { color: #e0e0e0; }
  .legend-cb, #select-all-cb { appearance: none; -webkit-appearance: none; width: 14px; height: 14px; border: 1.5px solid #3a3a5e; border-radius: 3px; background: #0f0f1a; cursor: pointer; position: relative; flex-shrink: 0; }
  .legend-cb:checked, #select-all-cb:checked { background: #4E79A7; border-color: #4E79A7; }
  .legend-cb:checked::after, #select-all-cb:checked::after { content: ''; position: absolute; left: 3.5px; top: 1px; width: 4px; height: 7px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  #select-all-cb:indeterminate { background: #4E79A7; border-color: #4E79A7; }
  #select-all-cb:indeterminate::after { content: ''; position: absolute; left: 2px; top: 5px; width: 8px; height: 2px; background: #fff; border: none; transform: none; }

  /* ── novo: controles de câmera 3D ── */
  #cam {
    position: absolute; top: 12px; left: 12px; z-index: 5; display: flex; gap: 6px;
    align-items: center; flex-wrap: wrap; max-width: calc(100% - 24px);
  }
  #cam button {
    background: #1a1a2e; border: 1px solid #3a3a5e; color: #e0e0e0;
    font-family: inherit; font-size: 12px; padding: 6px 11px; border-radius: 6px; cursor: pointer;
  }
  #cam button:hover { border-color: #4E79A7; }
  #cam button.on { background: #4E79A7; border-color: #4E79A7; color: #fff; }
  #depth-wrap {
    display: flex; align-items: center; gap: 7px; background: #1a1a2e;
    border: 1px solid #3a3a5e; border-radius: 6px; padding: 5px 11px; font-size: 12px; color: #aaa;
  }
  #depth { width: 96px; accent-color: #4E79A7; }
  #depth-val { color: #e0e0e0; font-variant-numeric: tabular-nums; min-width: 30px; }
  #tooltip {
    position: absolute; z-index: 6; pointer-events: none; display: none;
    background: #1a1a2e; border: 1px solid #3a3a5e; border-radius: 5px;
    padding: 5px 9px; font-size: 12px; color: #e0e0e0; max-width: 320px;
  }
  #valid {
    position: absolute; bottom: 12px; left: 12px; z-index: 5; font-size: 11px;
    padding: 5px 10px; border-radius: 5px; background: #1a1a2e; border: 1px solid #2a2a4e;
  }
  #valid.ok { color: #59A14F; }
  #valid.bad { color: #E15759; border-color: #E15759; }
</style>
</head>
<body>
<div id="graph">
  <div id="cam">
    <button id="btn-front">Front View</button>
    <button id="btn-recenter">Recenter</button>
    <button id="btn-proj">Perspective</button>
    <button id="btn-spin">Spin</button>
    <div id="depth-wrap">
      <label for="depth">Depth</label>
      <input id="depth" type="range" min="0" max="900" step="10">
      <span id="depth-val"></span>
    </div>
  </div>
  <div id="tooltip"></div>
  <div id="valid"></div>
</div>
<div id="sidebar">
  <div id="search-wrap">
    <input id="search" type="text" placeholder="Search nodes..." autocomplete="off">
    <div id="search-results"></div>
  </div>
  <div id="info-panel">
    <h3>Node Info</h3>
    <div id="info-content"><span class="empty">Click a node to inspect it</span></div>
  </div>
  <div id="legend-wrap">
    <h3>Communities</h3>
    <div id="legend-controls">
      <label><input type="checkbox" id="select-all-cb" checked>Select All</label>
    </div>
    <div id="legend"></div>
  </div>
  <div id="stats">__STATS__</div>
</div>

<script>
// ── Dados: exatamente os mesmos arrays do graph.html, copiados sem edição ──
const RAW_NODES = /*__NODES__*/;
const RAW_EDGES = /*__EDGES__*/;
const LEGEND = /*__LEGEND__*/;
const HYPEREDGES = /*__HYPEREDGES__*/;
// Coordenadas x/y capturadas de network.getPositions() do graph.html depois da
// estabilização. O graph.html não persiste posições e não fixa randomSeed, então
// re-rodar a física daria um mapa diferente a cada abertura; congelar aqui é o
// que torna "Front View == o mapa 2D" uma afirmação verificável.
const LAYOUT = /*__LAYOUT__*/;
</script>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Profundidade conservadora por padrão: o mapa 2D ganhando volume, não um mapa
// novo. O span de x/y passa de 3300 unidades; 260 aqui é ~8% disso.
let DEPTH_SCALE = 260;

const POS = new Map(LAYOUT.pos.map(p => [p[0], { x: p[1], y: p[2] }]));
const byId = new Map(RAW_NODES.map(n => [n.id, n]));

// z derivado da comunidade — a camada que o graphify já tem (regra 1 do pedido).
// Centrado em zero pro volume crescer pros dois lados do plano original.
const nCom = Math.max(1, LEGEND.length - 1);
function zOf(n) { return (n.community / nCom - 0.5) * DEPTH_SCALE; }

// x3D = x2D, y3D = -y2D. A inversão do Y é obrigatória e não é layout novo: no
// vis-network o Y cresce pra baixo, no three cresce pra cima. Sem ela o mapa
// sairia espelhado na vertical.
function xyOf(id) { const p = POS.get(id); return { x: p.x, y: -p.y }; }

const host = document.getElementById('graph');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f0f1a);

// centro e extensão do mapa 2D, pra câmera enquadrar como o fit do vis
const xs = RAW_NODES.map(n => xyOf(n.id).x), ys = RAW_NODES.map(n => xyOf(n.id).y);
const CX = (Math.min(...xs) + Math.max(...xs)) / 2, CY = (Math.min(...ys) + Math.max(...ys)) / 2;
const SPAN = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys));
const DIST = SPAN * 1.15;

let W = host.clientWidth, H = host.clientHeight;
const persp = new THREE.PerspectiveCamera(50, W / H, 1, SPAN * 12);
const orthoH = SPAN * 0.62;
const ortho = new THREE.OrthographicCamera(-orthoH * (W / H), orthoH * (W / H), orthoH, -orthoH, 1, SPAN * 12);
let camera = persp;
[persp, ortho].forEach(c => c.position.set(CX, CY, DIST));

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W, H);
host.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;       // rotação orbital suave
controls.dampingFactor = 0.08;
controls.target.set(CX, CY, 0);
controls.update();

scene.add(new THREE.AmbientLight(0xffffff, 0.85));
const key = new THREE.DirectionalLight(0xffffff, 0.55); key.position.set(1, 1, 2); scene.add(key);

// ── NÓS ──────────────────────────────────────────────────────
// Esfera no lugar do círculo: a adaptação mínima pra WebGL que o pedido permite.
// Raio = n.size do vis, sem reescalar, então o tamanho relativo é o mesmo.
const esferas = [], porId = new Map();
const geoCache = new Map();
function geoDe(r) {
  const k = r.toFixed(1);
  if (!geoCache.has(k)) geoCache.set(k, new THREE.SphereGeometry(r, 20, 14));
  return geoCache.get(k);
}
for (const n of RAW_NODES) {
  const { x, y } = xyOf(n.id);
  const mat = new THREE.MeshLambertMaterial({ color: new THREE.Color(n.color.background) });
  const m = new THREE.Mesh(geoDe(n.size), mat);
  m.position.set(x, y, zOf(n));
  m.userData = { id: n.id, node: n, corBase: new THREE.Color(n.color.background) };
  scene.add(m); esferas.push(m); porId.set(n.id, m);
}

// ── RÓTULOS ──────────────────────────────────────────────────
// Só onde font.size > 0 — mesmo critério que o graph.html já usa pra decidir
// qual nó mostra label. Sprite, pra ficar sempre virado pra câmera.
const sprites = [];
for (const n of RAW_NODES) {
  if (!n.font || !n.font.size) continue;
  const cv = document.createElement('canvas');
  const ctx0 = cv.getContext('2d');
  const fs = 64;
  ctx0.font = `600 ${fs}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
  cv.width = Math.ceil(ctx0.measureText(n.label).width) + 16;
  cv.height = Math.round(fs * 1.5);
  const c2 = cv.getContext('2d');
  c2.font = `600 ${fs}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
  c2.textBaseline = 'middle';
  c2.lineWidth = 6; c2.strokeStyle = '#0f0f1a';
  c2.strokeText(n.label, 8, cv.height / 2);
  c2.fillStyle = n.font.color || '#ffffff';
  c2.fillText(n.label, 8, cv.height / 2);
  const tex = new THREE.CanvasTexture(cv);
  tex.minFilter = THREE.LinearFilter;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  const alt = n.font.size * 2.6;
  sp.scale.set(alt * (cv.width / cv.height), alt, 1);
  const { x, y } = xyOf(n.id);
  sp.position.set(x, y + n.size + alt * 0.55, zOf(n));
  sp.userData = { id: n.id };
  scene.add(sp); sprites.push(sp);
}

// ── ARESTAS ──────────────────────────────────────────────────
// Uma linha por aresta (não mescladas), pra cada uma manter cor, opacidade,
// tracejado e destaque próprios — e pra nenhuma sumir quando a comunidade some.
const linhas = [], setas = [];
const geoSeta = new THREE.ConeGeometry(1, 2.4, 8);
for (const e of RAW_EDGES) {
  const a = xyOf(e.from), b = xyOf(e.to);
  const na = byId.get(e.from), nb = byId.get(e.to);
  const pa = new THREE.Vector3(a.x, a.y, zOf(na)), pb = new THREE.Vector3(b.x, b.y, zOf(nb));
  const op = (e.color && e.color.opacity != null) ? e.color.opacity : 0.7;
  const cor = new THREE.Color((e.color && e.color.color) || 0x9aa4c8);

  const Mat = e.dashes ? THREE.LineDashedMaterial : THREE.LineBasicMaterial;
  const opts = { color: cor, transparent: true, opacity: op };
  if (e.dashes) { opts.dashSize = 9; opts.gapSize = 6; }
  const ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints([pa, pb]), new Mat(opts));
  if (e.dashes) ln.computeLineDistances();
  ln.userData = { e, opBase: op };
  scene.add(ln); linhas.push(ln);

  // seta na ponta, equivalente ao arrows.to do vis
  const dir = new THREE.Vector3().subVectors(pb, pa).normalize();
  const tam = 3.2 + (e.width || 1) * 1.5;
  const cone = new THREE.Mesh(geoSeta, new THREE.MeshBasicMaterial({ color: cor, transparent: true, opacity: op }));
  cone.scale.set(tam, tam, tam);
  cone.position.copy(pb).addScaledVector(dir, -(nb.size + tam * 1.2));
  cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
  cone.userData = { e, opBase: op };
  scene.add(cone); setas.push(cone);
}

// ── HYPEREDGES ───────────────────────────────────────────────
// As regiões sombreadas do graph.html: mesmo casco expandido 1.15x a partir do
// centroide, mesma cor e mesmas opacidades (0.12 preenchimento / 0.4 contorno).
const hyper = [];
for (const h of HYPEREDGES) {
  const ids = h.nodes.filter(id => POS.has(id));
  if (ids.length < 3) continue;
  const face = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshBasicMaterial({
    color: 0x6366f1, transparent: true, opacity: 0.12, side: THREE.DoubleSide, depthWrite: false }));
  const borda = new THREE.LineLoop(new THREE.BufferGeometry(),
    new THREE.LineBasicMaterial({ color: 0x6366f1, transparent: true, opacity: 0.4 }));
  scene.add(face); scene.add(borda);
  hyper.push({ h, face, borda, ids });
}

// ── profundidade ao vivo (recalcula só z; x/y nunca são tocados) ──
function aplicarProfundidade() {
  for (const m of esferas) m.position.z = zOf(m.userData.node);
  for (const sp of sprites) sp.position.z = zOf(byId.get(sp.userData.id));
  linhas.forEach((ln, i) => {
    const e = RAW_EDGES[i], a = xyOf(e.from), b = xyOf(e.to);
    const na = byId.get(e.from), nb = byId.get(e.to);
    const pa = new THREE.Vector3(a.x, a.y, zOf(na)), pb = new THREE.Vector3(b.x, b.y, zOf(nb));
    ln.geometry.setFromPoints([pa, pb]);
    if (e.dashes) ln.computeLineDistances();
    const dir = new THREE.Vector3().subVectors(pb, pa).normalize();
    const cone = setas[i], tam = cone.scale.x;
    cone.position.copy(pb).addScaledVector(dir, -(nb.size + tam * 1.2));
    cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
  });
  for (const hp of hyper) {
    const pts = hp.ids.map(id => {
      const p = xyOf(id), n = byId.get(id); return new THREE.Vector3(p.x, p.y, zOf(n));
    });
    const c = pts.reduce((s, p) => s.add(p.clone()), new THREE.Vector3()).divideScalar(pts.length);
    const exp = pts.map(p => c.clone().addScaledVector(p.clone().sub(c), 1.15));
    const v = [];
    for (let i = 1; i < exp.length - 1; i++) v.push(exp[0], exp[i], exp[i + 1]);   // leque de triângulos
    hp.face.geometry.setFromPoints(v);
    hp.borda.geometry.setFromPoints(exp);
  }
}
aplicarProfundidade();

const slider = document.getElementById('depth'), sval = document.getElementById('depth-val');
slider.value = DEPTH_SCALE; sval.textContent = DEPTH_SCALE;
slider.addEventListener('input', () => {
  DEPTH_SCALE = +slider.value; sval.textContent = DEPTH_SCALE; aplicarProfundidade();
});

// ── validação: o que foi renderizado bate com os dados de origem? ──
function validar() {
  const err = [];
  if (esferas.length !== RAW_NODES.length) err.push(`nós ${esferas.length}!=${RAW_NODES.length}`);
  if (linhas.length !== RAW_EDGES.length) err.push(`arestas ${linhas.length}!=${RAW_EDGES.length}`);
  const idsCena = esferas.map(m => m.userData.id).slice().sort().join('|');
  const idsFonte = RAW_NODES.map(n => n.id).slice().sort().join('|');
  if (idsCena !== idsFonte) err.push('ids divergentes');
  let xy = 0, endp = 0;
  for (const m of esferas) {
    const p = POS.get(m.userData.id);
    if (Math.abs(m.position.x - p.x) > 1e-6 || Math.abs(m.position.y + p.y) > 1e-6) xy++;
  }
  linhas.forEach((ln, i) => {
    if (ln.userData.e.from !== RAW_EDGES[i].from || ln.userData.e.to !== RAW_EDGES[i].to) endp++;
  });
  if (xy) err.push(`${xy} nós com x/y fora do original`);
  if (endp) err.push(`${endp} arestas com endpoints trocados`);

  const el = document.getElementById('valid');
  const ok = err.length === 0;
  el.className = ok ? 'ok' : 'bad';
  el.textContent = ok
    ? `✓ ${esferas.length} nodes · ${linhas.length} edges · x/y idênticos ao 2D`
    : '✗ ' + err.join(' · ');
  (ok ? console.log : console.error)('[validacao 3D]', ok ? 'OK' : err);
  window.__validacao = { ok, err, nos: esferas.length, arestas: linhas.length };
  return ok;
}
validar();

// ── câmera ───────────────────────────────────────────────────
function frontView() {
  camera.position.set(CX, CY, DIST);
  camera.up.set(0, 1, 0);
  controls.target.set(CX, CY, 0);
  controls.update();
}
document.getElementById('btn-front').onclick = frontView;
document.getElementById('btn-recenter').onclick = () => { controls.target.set(CX, CY, 0); controls.update(); };

const btnProj = document.getElementById('btn-proj');
btnProj.onclick = () => {
  const alvo = controls.target.clone(), pos = camera.position.clone();
  camera = (camera === persp) ? ortho : persp;
  btnProj.textContent = (camera === persp) ? 'Perspective' : 'Orthographic';
  camera.position.copy(pos);
  controls.object = camera;
  controls.target.copy(alvo);
  controls.update();
};

let girando = false;
const btnSpin = document.getElementById('btn-spin');
btnSpin.onclick = () => { girando = !girando; btnSpin.classList.toggle('on', girando); };

addEventListener('resize', () => {
  W = host.clientWidth; H = host.clientHeight;
  persp.aspect = W / H; persp.updateProjectionMatrix();
  ortho.left = -orthoH * (W / H); ortho.right = orthoH * (W / H);
  ortho.updateProjectionMatrix();
  renderer.setSize(W, H);
});

// ── seleção, hover, filtros ──────────────────────────────────
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tooltip = document.getElementById('tooltip');
let selId = null;
const escondidas = new Set();

const vizCache = new Map();
function vizinhos(id) {
  if (vizCache.has(id)) return vizCache.get(id);
  const s = new Set();
  for (const e of RAW_EDGES) {
    if (e.from === id) s.add(e.to);
    if (e.to === id) s.add(e.from);
  }
  const r = [...s]; vizCache.set(id, r); return r;
}
function visivel(id) { return !escondidas.has(byId.get(id).community); }

function repintar() {
  const viz = selId ? new Set(vizinhos(selId).concat([selId])) : null;
  for (const m of esferas) {
    const n = m.userData.node;
    m.visible = visivel(n.id);
    // highlight do vis: fundo branco no selecionado
    m.material.color.set(n.id === selId ? 0xffffff : m.userData.corBase);
    m.material.transparent = !!viz;
    m.material.opacity = (viz && !viz.has(n.id)) ? 0.25 : 1;
  }
  for (const sp of sprites) sp.visible = visivel(sp.userData.id);
  linhas.forEach((ln, i) => {
    const e = ln.userData.e;
    const vis = visivel(e.from) && visivel(e.to);
    ln.visible = vis; setas[i].visible = vis;
    const real = viz && viz.has(e.from) && viz.has(e.to);
    ln.material.opacity = (viz && !real) ? 0.06 : (real ? 1 : ln.userData.opBase);
    setas[i].material.opacity = ln.material.opacity;
  });
  for (const hp of hyper) {
    const vis = hp.ids.some(id => visivel(id));
    hp.face.visible = vis; hp.borda.visible = vis;
  }
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function showInfo(nodeId) {
  const n = byId.get(nodeId);
  if (!n) return;
  const vz = vizinhos(nodeId);
  const itens = vz.map(nid => {
    const nb = byId.get(nid);
    const cor = nb ? nb.color.background : '#555';
    return `<span class="neighbor-link" style="border-left-color:${esc(cor)}" data-nid="${esc(nid)}">${esc(nb ? nb.label : nid)}</span>`;
  }).join('');
  document.getElementById('info-content').innerHTML = `
    <div class="field"><b>${esc(n.label)}</b></div>
    <div class="field">Type: ${esc(n.file_type || 'unknown')}</div>
    <div class="field">Community: ${esc(n.community_name)}</div>
    <div class="field">Source: ${esc(n.source_file || '-')}</div>
    <div class="field">Degree: ${n.degree}</div>
    ${vz.length ? `<div class="field" style="margin-top:8px;color:#aaa;font-size:11px">Neighbors (${vz.length})</div><div id="neighbors-list">${itens}</div>` : ''}
  `;
}

function focusNode(nodeId) {
  const m = porId.get(nodeId);
  if (!m) return;
  selId = nodeId; repintar(); showInfo(nodeId);
  // aproxima mantendo a direção de onde a câmera já está
  const dir = camera.position.clone().sub(controls.target).normalize();
  controls.target.copy(m.position);
  camera.position.copy(m.position).addScaledVector(dir, SPAN * 0.30);
  controls.update();
}

function noSob(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
  mouse.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(esferas.filter(m => m.visible), false);
  return hits.length ? hits[0].object.userData.id : null;
}

renderer.domElement.addEventListener('pointermove', ev => {
  const id = noSob(ev);
  renderer.domElement.style.cursor = id ? 'pointer' : 'default';
  if (id) {
    const n = byId.get(id);
    tooltip.textContent = n.title || n.label;
    tooltip.style.display = 'block';
    const r = renderer.domElement.getBoundingClientRect();
    tooltip.style.left = (ev.clientX - r.left + 14) + 'px';
    tooltip.style.top = (ev.clientY - r.top + 14) + 'px';
  } else tooltip.style.display = 'none';
});
renderer.domElement.addEventListener('click', ev => {
  const id = noSob(ev);
  if (id) { selId = id; repintar(); showInfo(id); }
  else {
    selId = null; repintar();
    document.getElementById('info-content').innerHTML = '<span class="empty">Click a node to inspect it</span>';
  }
});
document.addEventListener('click', e => {
  const el = e.target.closest('.neighbor-link');
  if (el && el.dataset.nid !== undefined) focusNode(el.dataset.nid);
});

// ── busca ────────────────────────────────────────────────────
const searchInput = document.getElementById('search');
const searchResults = document.getElementById('search-results');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLowerCase().trim();
  searchResults.innerHTML = '';
  if (!q) { searchResults.style.display = 'none'; return; }
  const matches = RAW_NODES.filter(n => n.label.toLowerCase().includes(q)).slice(0, 20);
  if (!matches.length) { searchResults.style.display = 'none'; return; }
  searchResults.style.display = 'block';
  matches.forEach(n => {
    const el = document.createElement('div');
    el.className = 'search-item';
    el.textContent = n.label;
    el.style.borderLeft = `3px solid ${n.color.background}`;
    el.style.paddingLeft = '8px';
    el.onclick = () => {
      focusNode(n.id);
      searchResults.style.display = 'none';
      searchInput.value = '';
    };
    searchResults.appendChild(el);
  });
});
document.addEventListener('click', e => {
  if (!searchResults.contains(e.target) && e.target !== searchInput)
    searchResults.style.display = 'none';
});

// ── legenda / filtros de comunidade ──────────────────────────
const selectAllCb = document.getElementById('select-all-cb');
function updateSelectAllState() {
  selectAllCb.checked = escondidas.size === 0;
  selectAllCb.indeterminate = escondidas.size > 0 && escondidas.size < LEGEND.length;
}
function toggleAllCommunities(hide) {
  document.querySelectorAll('.legend-item').forEach(i => i.classList.toggle('dimmed', hide));
  document.querySelectorAll('.legend-cb').forEach(cb => cb.checked = !hide);
  escondidas.clear();
  if (hide) LEGEND.forEach(c => escondidas.add(c.cid));
  repintar(); updateSelectAllState();
}
selectAllCb.addEventListener('change', () => toggleAllCommunities(!selectAllCb.checked));

const legendEl = document.getElementById('legend');
LEGEND.forEach(c => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  const cb = document.createElement('input');
  cb.type = 'checkbox'; cb.className = 'legend-cb'; cb.checked = true;
  cb.addEventListener('change', e => {
    e.stopPropagation();
    if (cb.checked) { escondidas.delete(c.cid); item.classList.remove('dimmed'); }
    else { escondidas.add(c.cid); item.classList.add('dimmed'); }
    repintar(); updateSelectAllState();
  });
  item.innerHTML = `<div class="legend-dot" style="background:${c.color}"></div>
    <span class="legend-label">${c.label}</span>
    <span class="legend-count">${c.count}</span>`;
  item.prepend(cb);
  item.onclick = e => {
    if (e.target === cb) return;
    cb.checked = !cb.checked;
    cb.dispatchEvent(new Event('change'));
  };
  legendEl.appendChild(item);
});

// ── loop ─────────────────────────────────────────────────────
const semMovimento = matchMedia('(prefers-reduced-motion: reduce)').matches;
function laco() {
  requestAnimationFrame(laco);
  if (girando && !semMovimento) {
    const v = camera.position.clone().sub(controls.target);
    const a = 0.0022, cs = Math.cos(a), sn = Math.sin(a);
    camera.position.set(
      controls.target.x + v.x * cs - v.z * sn,
      camera.position.y,
      controls.target.z + v.x * sn + v.z * cs
    );
    camera.lookAt(controls.target);
  }
  controls.update();
  renderer.render(scene, camera);
}
frontView();
repintar();
laco();

// exposto pro teste automatizado
window.__g3d = { esferas, linhas, setas, sprites, hyper, POS, byId, frontView, focusNode, validar,
  get camera() { return camera; }, controls, escondidas, repintar,
  get depth() { return DEPTH_SCALE; } };
</script>
